# Dante (fixture) — ⚠ **engine fixture body, not a board body and not a claim about Dante.**
# Values copied from `engine/test_interior.py` 의 다공성 로스터 픽스처 (1.552e21 kg · 521 km).
# ⚠ **질량-반지름 쌍은 오너가 열어 둔 물음이다** (Dante·Hades 반지름) — 보드 값이 아니고,
# 이 파일에 옮겨 적었다고 그 물음이 닫히지 않는다. 여기 있는 수를 Dante 의 성질로 인용하지 말 것.
# ⚠ **보드·phase4 배선 없음, emit 없음.**
#
# 왜 있나 (C45 (e), 브리프 173): 계약 검사의 표본이 **발표된 천체 여섯뿐**이라, 선언이 거의 없는
# 바디가 하나도 없었다. 이 파일은 그 편향을 깬다 — 표본별 공급(172 (a))의 스무 행 중 **일곱**이
# 이 바디의 빈 선언이고, 그것이 계기가 보게 된 것이다.
# ⚠ **이 줄은 2026-09-11 에 고쳐졌다** (감사석이 자기 실측을 정정, 브리프 187): 예전에는 «사슬
# 경로에 `infer_composition` 호출이 아예 없다 (C57, 감사석 호출그래프 실측)» 라고 적혀 있었는데,
# 182 B 가 `_infer_from_state` 를 배선한 뒤로 **거짓**이다. 지금 이 바디는 핵 재질도
# `composition_intent` 도 `core_mass_fraction` 도 선언하지 않으므로 `_solve_from_state` 가
# 추론 경로로 보내고(`interior.py`), 거기서 **이분법 가지**로 풀린다 — 순철 한계곡선을 부르는
# 거절 가지는 안 밟는다.
name: Dante (fixture)
kind: moon
parent: Alpha Centauri A b

inputs:
  # 픽스처 값 그대로. 지구 질량 5.97219e24 kg · 지구 반지름 6371 km 로 나눈 것이다.
  mass_earth: 0.00025987
  radius_earth: 0.08178
  # 얼음 없음 — 픽스처의 `ice_allowed=False` («silicate volcanic (Io-type)»).
  ice_mass_fraction: 0.0
  # 조석가열 — 픽스처의 `tidal_heating=True`. 공극 레짐 판정의 세 지표 중 하나다 (C50 (b) 표 11행).
  tidal_heating: true
  body_class: rocky
  # ⚠ **`composition_intent` 를 선언하지 않는다.** 첫 판에서 `earth_like` 를 적었더니 프리셋이
  # 핵질량비 0.325 를 공급해 `interior_layers` 가 **정방향 분기**(`integrated_fe_prem_silicate`)로
  # 갔고, 이 파일이 존재하는 이유인 역산 분기를 안 밟았다. 그리고 그 선언은 애초에 픽스처에 없다 —
  # `test_interior` 의 로스터는 질량·반지름·얼음 허용·조석가열 넷으로만 `infer_composition` 을 부른다.
  # 그래서 지우는 것이 «원하는 결과가 나오게 입력을 고치는 것» 이 아니라 **복사를 바로잡는 것**이다.
  # ⚠ **정정 (2026-09-10, C59 (a)).** 여기 «대가: `dynamo_rocky` 가 조성 프리셋이 없다며 이름을
  # 대고 거절한다 (C28)» 라고 적혀 있었다. **그런 거절은 안 난다** — 실행값에서 `dynamo_rocky` 는
  # 값을 내며 `cannot-say (conductor_phase undecided)` 로 거절하고, 그건 온도가 없어서지 조성
  # 때문이 아니다. ⚠ 그리고 `interior_layers` 는 **답을 낸다**: 아무도 선언하지 않은 핵질량비
  # 0.325 가 `inputs["core_mass_fraction"]` 에 이름을 달고 앉아 반지름 455.7 km 를 낸다.
  # 미선언에 대한 두 소비처의 처분이 서로 다르다 — 하나는 조용히 `earth_like` 로 채우고 하나는
  # 아예 안 묻는다. **그것이 C57 이 여는 자리다.**
  # 판구조 영역 — 픽스처에는 없다. 선언하지 않는 것이 이 파일의 성질이다: 검사기가 «어떤 표본은
  # 공급하고 어떤 표본은 안 한다» 를 세는 데 이 빈칸이 그대로 쓰인다 (172 (a)).

units:
  mass_earth: M_earth
  radius_earth: R_earth
  ice_mass_fraction: dimensionless
