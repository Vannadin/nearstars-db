# Luhman 16 B — 로스터 갈색왜성. 값은 전부 db/systems/luhman_16_b.json 에서 읽었다 (2026-09-04). 도출값은 안 적는다.
name: Luhman 16 B
kind: brown_dwarf
parent: null

inputs:
  mass_earth: 9089.0         # 0.0273 ± 0.0003 M☉ (연성 궤도, Lazorenko & Sahlmann 2018, recommended) × 332946 — 28.6 M_J
  radius_rj: 0.876           # ⚠ 선언. DB: 0.09 ± 0.01 R☉ (evolutionary_model) — "No measured radius exists for either component"
  radius_rj_min: 0.778       # DB 자신의 밴드 0.08 R☉ — 반지름은 R^(-7/6) 으로 들어가는 유일한 선언 입력
  radius_rj_max: 0.973       # 0.10 R☉
  age_gyr: 0.5               # 보드 phase4/luhman_16.yaml (Gagné 2023 이동군); DB 는 1.5 ± 1.5 (범위 중점) — O1, 이 가지는 나이를 읽지 않는다
  body_class: brown_dwarf
  luminosity_lsun: 1.95e-05  # 측정 — 볼로메트릭 플럭스, Faherty+ 2014 (2014ApJ...790...90F), ± 4.5e-06
  rotation_period_h: 4.87    # DB rotation_period_days 0.2029
  isolated: true             # 모항성 없음·핵융합 없음 → 관측 L_bol = 내부 냉각광도. 이 가지의 전제 조건 (선언)

# 전이 기록 (engine/transfers.py, Brief 153). 두 성분의 반지름 선언이 같은 수라서 기록이 요구된다 —
# 어느 쪽에서 다른 쪽으로 옮긴 게 아니라 DB 가 두 성분에 같은 진화모형 값을 준 것이다.
transfers:
  - field: radius_rj
    from_body: Luhman 16 A
    form: printed
    kind: state
    grade: analog
    anchor: "luhman_16_a.yaml@«radius_rj: 0.876»"
    validated: "same DB declaration 0.09 ± 0.01 R☉ for both components — no measured radius exists for either"
  - field: radius_rj_min
    from_body: Luhman 16 A
    form: printed
    kind: state
    grade: analog
    anchor: "luhman_16_a.yaml@«radius_rj_min: 0.778»"
    validated: "the DB band's lower edge, same for both components"
  - field: radius_rj_max
    from_body: Luhman 16 A
    form: printed
    kind: state
    grade: analog
    anchor: "luhman_16_a.yaml@«radius_rj_max: 0.973»"
    validated: "the DB band's upper edge, same for both components"
  - field: age_gyr
    from_body: Luhman 16 A
    form: printed
    kind: state
    grade: analog
    anchor: "luhman_16_a.yaml@«age_gyr: 0.5»"
    validated: "same fact — one binary, one moving-group age (Gagné 2023); this branch does not read it"

units:
  mass_earth: M_earth
  radius_rj: R_jup
  radius_rj_min: R_jup
  radius_rj_max: R_jup
  age_gyr: Gyr
  luminosity_lsun: L_sun
  rotation_period_h: h
