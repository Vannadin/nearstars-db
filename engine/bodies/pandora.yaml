# Pandora (Alpha Centauri A b III) — 암석 위성. mass_radius_relation 이 실제로 값을 내는 표본.
name: Pandora
kind: moon
parent: Alpha Centauri A b

inputs:
  mass_earth: 0.6447       # 보드 3.85e24 kg / 5.972e24
  age_gyr: 5.3
  body_class: rocky
  composition_intent: earth_like
  radius_earth: 0.8984     # 보드 5724 km / 6371
  core_mass_fraction: 0.325   # 지구식. composition_intent 가 정할 자리다.
  # source: Earth analog (earth.yaml@«potential_temperature: 1600.0», petrological); grade analog — dry rocky, composition_intent earth_like.
  # ⚠ this comment is now also a machine record — see the transfers: block at the end of this file (Brief 153).
  # Owner declaration 2026-09-04 (C29). Not scaled — the analogy is the value; the source itself (Unterborn+ 2019 §3.2)
  # relaxes it to 1400–1900 K. Gives core_state a lower-bound verdict only;
  # the core-side CMB temperature (earth.yaml@«# C20 열진화의 초기온도 — Nimmo+ 2004») is a separate, undeclared thing.
  potential_temperature: 1600.0
  # source: owner declaration 2026-09-04 (C29 c) — grade declared. core_state's lower-bound branch cannot decide the
  # core label without a core-side CMB temperature, and the owner declares the dynamo on instead of authoring that
  # temperature. Board: phase4/alpha_centauri.yaml@«a tidally driven iron-core dynamo» and the two rows behind it, phase4/alpha_centauri.yaml@«Radiogenic plus weak tidal heating (forced e ~0.005), enough to drive volcanism, continental drift and a dynamo»
  # and phase4/alpha_centauri.yaml@«Active volcanic belts and fast continental drift (tidal plus radiogenic)».
  dynamo_alive: true
  # source: owner declaration 2026-09-04 (C29 c); board phase4/alpha_centauri.yaml@«Radiogenic plus weak tidal heating (forced e ~0.005), enough to drive volcanism, continental drift and a dynamo»
  # and phase4/alpha_centauri.yaml@«Active volcanic belts and fast continental drift (tidal plus radiogenic)» — mobile lid, not stagnant. grade declared.
  # 핵 물질 — **오너 선언 2026-09-09** (C50 (b) 표 5행). 가상 천체라 문헌 근거가 없고, 네 핵 노드가
  # 이미 쓰던 기본값을 그대로 이름 붙인 것이다 — 지구처럼 PREM 전사라고 말할 수 없으므로 등급은
  # **선언**이고 출처는 오너다. 값이 기본값과 같으므로 이 선언만으로는 아무 것도 안 움직인다.
  core_material: fe_prem        # owner declaration 2026-09-09 — 가상 천체, 문헌 근거 없음
  # 구조 풀이의 조석가열 스위치 — **오너 선언 2026-09-09** (C50 (b) 표 11행). 보드가 이 천체에
  # 강제 이심률(~0.005)로 유지되는 조석가열을 적고 C30 이 45 W/m² 를 재현한다. ⚠ 이 선언은
  # **답을 움직인다** — `false` 기본값으로 풀던 층 구조가 가열을 받는 쪽으로 바뀐다. 전후 값은
  # 브리프 170 D 의 커밋 메시지에 숫자로 적혀 있다.
  tidal_heating: true           # owner declaration 2026-09-09 — 보드의 조석가열을 구조 풀이에 켠다
  # 판구조 영역 — 옛 `stagnant_lid: false` 를 대신한다 (C53, 브리프 168). ⚠ 사전등록은 결정 (c) 의
  # 근거를 «오늘의 false 에는 기록된 이유가 없다» 로 적었는데 **그것이 틀렸다**: 이유는 바로 위 두 줄의
  # 보드 앵커로 이미 기록되어 있었다. 그래서 오너 선언은 그 앵커를 근거로 유지하는 선언이다.
  tectonic_regime:
    value: mobile
    grade: declared
    source: "owner declaration 2026-09-04 (C29 c), re-declared as a regime 2026-09-09 (C53 (c)); board anchors two lines above"
    note: "fiction body — nothing to measure; the board's own prose says mobile lid, not stagnant"
  # ── 이 아래 보드 인용은 값 행 자체를 앵커로 잡는다. 보드가 그 값을 바꾸면 앵커가 썩는데, provenance 인용에서는
  # 그게 옳은 동작이다 — 인용이 가리키던 근거가 실제로 사라진 것이므로 조용히 다른 줄을 가리키는 편보다 낫다.
  # ── tidal inputs (C30, 2026-09-04). e and k₂/Q are declarations; the board fits k₂/Q to its flux, phase4/alpha_centauri.yaml@«The tidal term needs k₂/Q ≈ 0.0016 at the simulated e ≈ 0.005, which is fitted rather than predicted, but it».
  semi_major_axis_km: 252393     # source: phase3/stability-sim/hypotheticals/alpha_centauri.json@«"semi_major_axis_km": 252393» (design-of-record 2026-06-21)
  perturber_mass_earth: 120.0    # source: phase4/alpha_centauri.yaml@«- { name: mass, value: 120, unit: M_earth, op: set, phase3_default: "120 M⊕ (0.38 M_Jup)" }» (Polyphemus 120 M⊕)
  eccentricity_forced: 0.005     # source: phase4/alpha_centauri.yaml@«Radiogenic plus weak tidal heating (forced e ~0.005), enough to drive volcanism, continental drift and a dynamo»
  # (sim e_max 0.0072, e_min 0.00016 in the same row block)
  # ⚠ 같은 수를 두 이름으로 싣는다. `eccentricity_forced` 는 조석열이 읽는 기존 키이고, `eccentricity` 는
  # 궤도 이심률을 요구하는 소비자(§4 자전 상태 분류)가 읽는 키다. 이름이 다른 두 양이라 의심했는데,
  # 오너 판정(2026-09-07): **시뮬에서 나온 실측 궤도 이심률이므로 같은 수다.** 공명이 유지시키는 값이라
  # 해서 궤도의 실제 이심률이 아닌 것이 아니다 — 그것이 바로 이 궤도의 이심률이다.
  # 진동 구간 0.00016–0.0072 전체가 §4 의 1:1 상한 0.055 아래라, 점이 우연히 아래 있는 것이 아니다.
  eccentricity: 0.005            # source: phase4/alpha_centauri.yaml@«at the simulated e ≈ 0.005»
  k2_over_q: 0.0016              # source: phase4/alpha_centauri.yaml@«The tidal term needs k₂/Q ≈ 0.0016 at the simulated e ≈ 0.005, which is fitted rather than predicted, but it» — declared

# 다른 천체에서 정해진 값의 기록 — engine/transfers.py 가 로드 시 검사한다 (Brief 153). 두 값 모두 지구의
# 인쇄값을 그대로 옮긴 analog 이고, 도출값은 아니다.
transfers:
  - field: potential_temperature
    from_body: Earth
    form: printed
    kind: state
    grade: analog
    anchor: "earth.yaml@«potential_temperature: 1600.0»"
    validated: "owner declaration 2026-09-04 (C29) — the analogy is the value"
  - field: core_mass_fraction
    from_body: Earth
    form: printed
    kind: state
    grade: analog
    anchor: "earth.yaml@«core_mass_fraction: 0.325»"
    validated: "composition_intent earth_like — the intent's own place to decide"
  - field: age_gyr
    from_body: Alpha Centauri A b
    form: printed
    kind: state
    grade: analog
    anchor: "alpha_centauri_a_b.yaml@«age_gyr: 5.3»"
    validated: "same fact — a moon shares its primary's system age"

units:
  mass_earth: M_earth
  age_gyr: Gyr
  radius_earth: R_earth
  potential_temperature: K
  semi_major_axis_km: km
  perturber_mass_earth: M_earth
  eccentricity_forced: dimensionless
  eccentricity: dimensionless
  k2_over_q: dimensionless

# 이미 출하된 값. 엔진은 읽지 않고 대조만 한다.
expected:
  surface_flux:
    value: 45
    unit: W/m2
    tol: 0.01
    source: "phase4/alpha_centauri.yaml@«plus solid-body tidal heating 45 W/m², giving Teq 237K; +54K greenhouse = 291K. So the lift IS partly tidal.»"
  b_eq:
    value: 75
    unit: uT
    tol: 1.0
    tol_reason: >
      대조용이지 강제가 아니다 (C29 c). 보드 75 µT 는 "rocky-dynamo ℳ⁺ 상한" 으로 적힌 선택이고, 엔진의
      사다리는 지구 앵커 30 µT · ℳ_base · (R/R⊕)⁻³ 를 낸다. 차이는 기록한다 — 보드 갱신은 별도 결정.
    source: "phase4/alpha_centauri.yaml@«a tidally driven iron-core dynamo» · magnetism.magnetic_field"
  radius:
    value: 0.8984
    unit: R_earth
    source: "phase4/alpha_centauri.yaml · bulk.radius (5724 km / 6371)"
  density:
    value: 4.90
    unit: g/cm3
    tol: 0.05
    tol_reason: >
      밀도는 반지름의 세제곱에 반비례한다. 엔진은 자기가 도출한 반지름을 쓰고 보드
      값은 보드 반지름에서 나오므로, 반지름 1.1 % 차이가 밀도에서 3.4 % 로 커진다.
      불일치가 아니라 전파다.
    source: "mass-radius-relation-methodology.md §7 — Option B 가 채택한 ~4900 kg/m³"
