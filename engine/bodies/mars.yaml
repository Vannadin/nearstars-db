# 다른 천체에서 정해진 값이 이 파일에 들어온 기록. engine/transfers.py 가 로드 시 검사한다 — 기록 없는
# 전이, state 인데 derived 인 전이(지구의 3040 K 가 그 모양), 풀리지 않는 앵커는 로드를 거절한다.
# `validated` 는 별도 축이다: 옮겨도 되는지는 form 이 아니라 C47 0단계가 답한다.
transfers:
  - field: age_gyr
    from_body: Earth
    form: printed
    kind: state
    grade: analog
    anchor: "earth.yaml@«age_gyr: 4.54»"
    validated: "same fact — the system's age, not a Mars-only dating"
  - field: potential_temperature
    from_body: Earth
    form: printed
    kind: state
    grade: analog
    anchor: "earth.yaml@«potential_temperature: 1600.0»"
    # C47 (h) stage 0 asked whether Earth's T_p may travel at all; C47 (i) answered it.
    validated: "C47 stage 0, 2026-09-08 (H 1.5 pW/kg, 0.25 Myr step cap): criterion A max |slope|
      0.0017 (threshold 0.5) and the 3.7 Ga checkpoint in at both sweep ends (1668.86 / 1668.41 K in
      Herzberg+ 2007's [1553.15, 1673.15] K). Re-run 2026-09-18 on the declared H 0.088 with a 4.0 Myr
      cap: max |slope| 0.00088, five points giving T_p 1377.61-1377.96 K, checkpoint 1668.21 / 1667.82 K
      — criterion A passes there too, and the response is not monotone (1600 K is the turning point).
      ⚠ headroom is 4.36 K today, which is 4.3 % of the radiogenic budget on the 3.7 Ga slope; the
      4.0-4.7 K and 5.15 K figures are earlier generations. Katsura+ 2010's band would still say out
      — see C47 (i)"

  - field: core_initial_temperature
    from_body: Earth
    form: printed
    kind: state
    grade: analog
    anchor: "earth.yaml@«core_initial_temperature: 4800.0»"
    validated: "the 3.7 Ga checkpoint verifies or refutes it (Monders+ 2007)"

