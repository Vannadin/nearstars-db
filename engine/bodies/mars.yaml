# Mars — 이 엔진의 둘째 대조 바디. earth.yaml 과 같은 자격이다: **보드 천체가 아니라
# 발표된 값으로 엔진을 대보는 표본**이고, 보드에도 emit 에도 올라가지 않는다.
# 왜 생겼나: C47 (h). 단계 4 방향 시험이 지구·화성에 **공통 T_p** 를 줬는데, 문헌은 화성의
# 높은 Urey ratio 를 "화성이 더 식었다" 로 설명한다 — 즉 시험이 재려는 물리를 입력에서
# 뺐을 수 있다. 바디별 T_p 를 열이력에서 받으려면 화성이 C20 에서 돌아야 하고, 그러려면
# 이 파일이 있어야 한다.
name: Mars
kind: planet
parent: Sun

inputs:
  # 질량·반지름·핵질량비 — engine/test_interior.py 의 ANCHORS 표에 이미 있던 값을 그대로.
  # 출처 "Konopliv+ 2011 · InSight". 그 표 자신의 주석이 조건을 적어 놨다:
  # *"CMF 는 조성 선언이지 적합 매개변수가 아니다 … 우리 답이 맞도록 돌려 맞춘 값이 아니다."*
  mass_earth: 0.1074
  radius_earth: 0.5320
  # 태양계와 함께 강착했다는 표준 진술. 지구가 쓰는 4.54 와 같은 수이고, 화성만의 별도
  # 연대 측정이 아니라 계 전체의 나이다 — 그래서 지구와 같은 값을 쓰는 것이 선언이 아니라
  # 같은 사실의 재사용이다.
  age_gyr: 4.54
  body_class: rocky
  # 규산염 방사성 농도 — prereg-radiogenic §4 (오너 결정 ③, 2026-09-24). Drilleau+ 2022 §4.1.2(PDF 9 쪽)의
  # EH45 벌. 2023 역산이 고정한 값이고 열진화 판 2 가 쓰는 것과 같은 벌이다.
  radiogenic_concentration:
    U_ppb: 14.0
    Th_ppb: 54.0
    K_ppm: 284.0
    grade: literature
    source: "2022JGRE..12707067D §4.1.2, PDF p9"
  # 핵 **쪽** 핵-맨틀 경계 온도 — **오너 결정 2026-09-09** (C54 (b), 브리프 174). 문헌 밴드는
  # **1900–2100 K** 이고 Durán+ 2022 (2022PEPI..32506851D, 보유) 가 그 밴드를 인쇄한다. 같은 논문의
  # 포텐셜 온도는 1650–1750 K 이며 «implying an entirely liquid core at present» 라고 적는다.
  # Stähler+ 2021 (2021Sci...373..443S, 보유) 은 지진학에서 같은 상에 닿는다 — «the observation of
  # ScS … rules out a solid outer core».
  # ⚠ **층상 모형 계열은 일부러 밴드 밖이다**: Khan+ 2023 (2023Natur.622..718K, 보유) 은 더 작고
  # 무거운 핵 위에 완전 용융 규산염층을 두는데, 그것은 같은 양의 다른 측정이 아니라 **다른 맨틀
  # 모형 선택**이다. 섞으면 모형 불일치가 불확실성의 모양을 입는다.
  # ⚠ **엔진 입력은 스칼라인데 밴드는 끝이 둘이라, 세 점을 다 재고 골랐다** (브리프 174 B).
  #   1900 K (낮은 끝) → `liquid_outer_solid_inner` · CMB 여유 +116.76 K · ⚠ `cmb_heat_flux` **거절**
  #                      («핵 쪽 1900 K 가 맨틀 단열선 밑 1910 K 이하 — 초단열 점프가 없다»)
  #   2000 K (중점)    → `liquid` · +216.76 K · 열류 계산됨
  #   2100 K (위 끝)   → `liquid` · +316.76 K · 열류 계산됨
  # ⚠ **낮은 끝은 아무도 관측하지 않은 내핵을 주장하고, 동시에 열류를 계산 불가로 만든다.**
  #   사전등록에서 나는 «선언된 T_c 는 Q_CMB 의 하한이니 낮은 끝이 방향을 지킨다» 고 적었는데,
  #   그 추론은 **측정에 졌다** — 방향을 지키려던 선택이 물리 주장을 하나 얹는다. 그래서 밴드의
  #   **중점**을 적는다: 어느 끝으로도 기울지 않고, 보유 문헌(전액체 핵)과 어긋나지 않는다.
  # ⚠ 다이나모 판정은 세 점에서 **같다** — `dead (stagnant lid, declared)` · ℳ 0 · B_eq 0.
  #   그래서 이 점의 선택은 오늘의 자기장 출력을 바꾸지 않는다.
  # ⚠ **2000 K 는 오너 결정이다 (2026-09-09 23:4x).** 처음에는 작업석의 가역 선택으로 적었는데,
  #   양 끝의 물리를 재서 올린 뒤 오너가 중점을 확정했다 — 밴드 1900–2100 은 인쇄값이고, 낮은 끝의
  #   두 귀결(내핵 추론 · `cmb_flux` 계산 불가)은 위에 기록된 대로 결정의 근거로 들어갔다.
  # ⚠ 등급으로 말하면 **선언**이다. 이 키는 스칼라라 `grade` 필드를 갖지 않으니 여기 적어 둔다 —
  #   밴드 1900–2100 은 인쇄값이지만 **중점은 인쇄된 수가 아니라 오너가 고른 점**이다. 이 파일에서
  #   `grade: measured` 를 든 것은 `tectonic_regime` 하나뿐이고, 그건 원전이 그 분류를 그 바디에
  #   대해 인쇄하기 때문이다. 이 온도는 그 자격이 아니다.
  core_cmb_temperature: 2000.0
  # 바닥 규산염층의 철 수 Fe# — **선언이고 도출이 아니다** (C100, 사전등록 f68e8156 §1·§3).
  # ⚠ **C103 이 이것을 걷어낸다.** 같은 판에 등재돼 있고, 이 줄은 «장치를 판정할 수 있게 하는
  #   발판» 이지 화성 맨틀에 대한 주장이 아니다.
  # ⚠ **단위는 Fe# = 100·Fe/(Fe + Mg) 로 0–100 이다** (Samuel+ 2021, 2021JGRE..12606613S.txt:1378).
  #   Mg#(0–1)로 적으면 항이 100 배 작아지고 **작은 쪽은 아무 일도 안 난 것처럼 보인다**.
  # 값의 출처 — Khan+ 2023 (2023Natur.622..718K.txt:758-762) 이 액체 규산염층의 Mg# 를
  #   0.2–0.3 으로 **인쇄한다** (역산 온도 2000–2300 K 에서). Fe# = 100·(1 − Mg#) = 70–80 이고
  #   75 는 그 중점이다. ⚠ **± 5 는 논문 범위 그 자체이지 우리가 지은 수가 아니다.**
  # ⚠ **대조로 65.9 가 따로 있다** — Khan 표 3 의 두 AIMD 점(ρ 3710·3818 @19 GPa·2100 K)을 이어
  #   층 밀도 4050 까지 외삽한 값이다. **외삽 폭이 두 점 간격의 2.1 배**이고 두 점이 한 축만
  #   다르지 않아(Si·Ca·Al·O 동반) **선언이 아니라 대조로만 쓴다** — 인쇄 도출값이 우리 외삽을 이긴다.
  # ⚠ **두 길의 Fe 종이 다르다** — 표 2 의 원자수는 **전체 Fe**, 본문의 Mg# 는 **Fe2+** 기준이다.
  #   환원 조건(같은 파일 `:764`)이라 둘이 거의 같고 **그래서 이 어긋남은 조용하다**. Fe3+/ΣFe 는 미보유.
  basal_iron_number: 75.0
  # 판구조 영역 — 옛 `stagnant_lid: true` 를 대신한다 (C53, 브리프 168). 화성은 P9 가 훑은 모든
  # 분류 체계에서 단일판이고, 그것이 Reese+ 1998 이 화성에 정체뚜껑 천장을 계산한 이유다.
  # 등급이 `measured` 인 것은 우리가 재었다는 뜻이 아니라 **보유한 원전이 이 바디에 대해 그 분류를
  # 인쇄한다** 는 뜻이다.
  tectonic_regime:
    value: stagnant
    grade: measured
    source: "1998JGR...10313643R"
    note: "single plate in every scheme surveyed (P9); Reese, Solomatov & Moresi 1998's abstract prints «Mantle convection on Mars and Venus is likely to occur in the [stagnant lid] regime»"
  # ⚠⚠ **이 값이 C47 (h) 0단계가 시험하는 대상 그 자체다. 확정된 값이 아니다.**
  # 화성의 현재 맨틀 포텐셜 온도는 **발표된 적이 없다** — 화성에 현재 화산활동이 없어
  # 그것을 기록할 분출 용융이 없고, 문헌의 "현재 화성 T_p" 는 전부 열진화 모형의 출력이다
  # (Monders, Médard & Grove 2007, 2007M&PS...42..131M — 3.7 Ga 까지 "현대 지구와 비슷").
  # 여기 적힌 1600 K 는 지구 선언값(Unterborn+ 2019 §2)을 옮긴 것이고, **옮겨도 되는지가
  # 바로 0단계의 질문이다.** 0단계가 기준 A·B 를 통과하기 전에는 이 수를 근거로 아무것도
  # 주장하지 말 것. 통과하면 근거를 여기 다시 적고, 실패하면 이 바디는 C20 을 못 돌린다.
  #
  # ✅ **0단계 통과 (2026-09-08, C47 (i) · 커밋 2fb2bba4 규칙 · 286c004a 판정).** 근거는 둘이다.
  #  ⚠ 아래 다섯 수(1382.56–1382.90 · 1668.86 · 1668.41)는 모두 **핵 열원 H 1.5 pW/kg 조건**의
  #    측정이다 — 그때의 공칭이었다. 오너 결정 ⑤ (2026-09-09) 로 선언 H 가 0.088 로 내려오면서
  #    같은 궤적의 답이 T_p 1377.03 K · T_p@3.7 Ga 1668.00 K 로 옮겼다 (브리프 166 D 배선 · 166 E 값).
  #    ⚠ 그 둘도 **180 C 이전 세대**다 — 현행은 **T_p 1377.9563 K · T_p@3.7 Ga 1668.79 K**
  #    (걸음 상한 4.0 Myr · STEP_FRACTION 0.1 · H_CORE 0.088 · 선언 1600 K).
  #    **판정은 그대로다** — 기준 B 의 위끝 여유가 4.0–4.7 K 에서 5.15 K 로 오히려 늘었다가,
  #    t_m@3.7 Ga 가 1668.00 → 1668.79 K 로 옮기면서 **현행 4.36 K** 가 됐다 (5.15 − 0.79).
  #    ⚠ 이 줄의 4.0–4.7 · 5.15 는 **지난 세대의 수**이고 현행은 4.36 K 다. 그 여유는
  #    방사성 예산의 **4.3 %** 에 해당한다 (3.7 Ga 칸의 기울기 1.003 K/% 로 잰 것, 오늘 칸의
  #    1.347 K/% 가 아니다 — 자를 섞으면 3.3 % 로 과소평가된다).
  #    ⚠ 166 D 는 이 자리에 1377.23 / 1668.05 를 적었다 — 그때의 선언 H 0.14 는 교과서 환산이었고,
  #    논문 자신의 환산 0.088 로 고치자 −0.20 / −0.04 K 움직였다 (166 E).
  #    ✅ **기준 A 의 쓸기를 선언 H 0.088 에서 다시 돌렸다 (2026-09-18).** 다섯 점
  #    (1400·1500·1600·1700·1800 K) → T_p **1377.61–1377.96 K**, 최대 |기울기| **0.00088**
  #    (문턱 0.5) — **선언 H 에서도 기준 A 통과**다. ⚠ 응답이 **단조가 아니다**: 1600 K 가
  #    꼭짓점(최대)이고 T_c 는 거기서 최저다. 그래서 양 끝만 재면 폭이 0.18 K 로 보이는데
  #    실제는 0.35 K 다. 격자 대조: 걸음 상한 4 → 1 Myr 에서 **오늘 칸은 소수 넷째 자리까지
  #    불변**(1377.9563), @3.7 Ga 칸만 ±0.17 K 움직인다. 출처 — 작업석 census
  #    `c20-consumer-census.md` blob affc70c6, 걸음 상한 4.0 Myr, 선언 H 0.088.
  #  · 기준 A — 이 선언을 1400–1800 K 로 쓸어도 출력 T_p 가 1382.56–1382.90 K 안에 머문다.
  #    ⚠ 이 불릿의 수는 **H 1.5 · 걸음 상한 0.25 Myr** 세대다. 선언 H 0.088 · 4.0 Myr 의 현행은
  #    위 ✅ 절의 1377.61–1377.96 K · 기울기 0.00088 이다.
  #    최대 |기울기| 0.0017 (문턱 0.5), 즉 400 K 를 흔들어 답이 0.34 K 움직인다. 궤적이 이
  #    선언을 거의 잊는다는 뜻이고, 그래서 옮긴 값이 답을 만들지 않는다.
  #  · 기준 B — 3.7 Ga 검문소(Monders+ 2007: 그때까지 "현대 지구와 비슷")를 스윕 양단에서
  #    똑같이 통과한다. T_p@3.7 Ga = 1668.86 K (1400 K) · 1668.41 K (1800 K), 둘 다 오너가
  #    고른 판정선 Herzberg+ 2007 [1553.15, 1673.15] K 안. ⚠ 그 둘은 **H 1.5 · 걸음 상한
  #    0.25 Myr** 의 수다. 선언 H 0.088 · **걸음 상한 4.0 Myr** 에서 같은 양 끝은
  #    **1668.21 K (1400 K) · 1667.82 K (1800 K)**, 역시 밴드 안이다. ⚠ 이 칸은 보간이 아니라
  #    «t = −3.7 Gyr 에 가장 가까운 표본 행» 이라 **걸음 상한을 함께 적지 않으면 재현이 안 된다**.
  # ⚠ **통과가 정밀검증은 아니다.** Monders 의 진술은 정성적이고, 여유는 밴드 위끝까지
  #   **4.36 K** 뿐이다 (이 줄은 4.0–4.7 K 로 읽혔다 — 위 ✅ 절 참조). 그리고 기록열 Katsura+ 2010 [1575, 1645] 로 재면 양단 모두 밴드 밖이다 — 판정은
  #   오너가 고른 논문에 딸려 있다. 화성의 현재 T_p 가 측정된 적 없다는 사실은 그대로다.
  potential_temperature: 1600.0
  # 표면온도 — 두 손실 법칙이 ΔT 의 아래끝으로 **받는다**(Foley 쪽은 받되 답이 안 움직인다, 아래).
  # ⚠ **216.0 은 Plesa+ 2016 의 모형 상수이지 화성 실측 평균이 아니다.**
  # ⚠ **2026-09-20 에 지구 상속값 293.0 을
  # 이 값으로 바꿨다** (그 «별도 커밋»이 이 커밋이다). 293.0 은 `mantle_flux` 의 모듈 기본값이
  # 바디 선언으로 올라온 것이었고, 화성의 수가 아니었다.
  # ⚠ **그런데 화성의 답은 이 교체로 안 움직인다** — 화성은 `stagnant` 라 Foley eq. (3) 으로 돌고,
  # 그 식은 `n = 1` 에서 표면온도에 **정확히 둔감**하다 (θ ∝ ΔT · Ra_i ∝ ΔT · Nu = a θ^(−1−β) Ra^β,
  # β = 1/3 → F ∝ ΔT⁰; 216 K 와 293 K 에서 16 자리 동일). 움직이는 것은 Nimmo 쪽뿐이다.
  # **그러니 이 커밋이 산 것은 수의 이동이 아니라 출처다.**
  surface_temperature_k:
    value: 216.0
    grade: analog
    source: "2016JGRE..121.2386P"
    note: >
      Plesa+ 2016's thermal-evolution models hold the surface temperature constant at
      "216 K or as a function of latitude" (Parameters Held Constant). ⚠ The paper's own
      default is the latitude-dependent form; 216 K is its globally constant alternative,
      which is what a single declared number can carry. The grade is analog because this is
      a model parameter, not a measured global mean. It replaces the 293.0 inherited from
      Earth, which was the module default both loss laws had been running with.
  # 정체뚜껑 두께 δ — Foley 2018 eq. (3) 이 받는 양이다. 선언이 없으면 정체뚜껑 바디는
  # 손실 법칙을 못 고른다 (결정 8). ⚠ **도구 상수와 다른 물건이다** — `tools/c51_regimes.py` 가
  # 훑는 350–500 km 는 **스윕 범위**이고 이 값은 **선언**이라, 둘은 같이 산다. 선언 330 은
  # 그 범위 아래에 있고, 그래서 그 도구는 화성을 자기 선언값에서 평가한 적이 없다.
  # 관측된 핵 반지름 — InSight 지진 관측. ⚠ **이 값은 «맞출 대상»이다** (황 맞춤 항목):
  # 엔진이 이 수를 재현하도록 핵의 황 분율을 푼다. 그러면 이 양은 **소비된 관측**이 되어
  # 검사 대상에서 빠진다 — 맞춘 값은 그 맞춤을 검사하지 못한다.
  # ⚠ **계열은 오너 결정 ④′ 로 Durán 두 축으로 정해졌다** (2026-09-20). 그래서 맞춤의 목표도
  #   창과 같은 논문에서 온다 — 반지름 1820–1870 km, 밀도 6–6.2 g/cm³ 가 한 문장에서 나온다.
  #   앞서 여기 선언돼 있던 것은 Stähler+ 2021 의 1830±40 이었고, 그때 적었던
  #   «보드 창은 다른 논문의 수다» 라는 지적은 **이 결정으로 닫혔다** — 두 축이 한 논문이 되면
  #   섞임이 없다. ⚠ 그 앞에 있던 «두 추정의 끝을 섞었다» 는 문장은 **틀렸고 이미 철회했다**.
  core_plus_layer_radius_km:
    value: 1845.0
    uncertainty_km: 25.0
    grade: judgment
    source: "2022PEPI..32506851D"
    note: >
      Durán, Khan, Giardini et al. 2022, "Observation of a core-diffracted P-wave from a farside
      impact with implications for the lower-mantle structure of Mars", PEPI 325, 106851. 축자:
      "we obtain an improved estimate of the Martian core radius (1820–1870 km) and mean core
      density (6–6.2 g/cm3)" (2022PEPI..32506851D:79), 그리고 :1948 에서 같은 구간을 "the ranges
      1820–1870 km (previously 1790–1870 km) and 6–6.2 g/cm3 (previously 5.7–6.3 g/cm3)" 로 적으며
      자기 값이 Stähler et al. (2021) 보다 좁다고 밝힌다. ⚠ **논문이 인쇄하는 것은 구간이고 1845
      라는 수가 아니다** — 여기 쓰는 1845±25 는 그 구간의 중점과 반폭이고, 엔진 입력이 스칼라
      하나이기 때문에 그렇게 적는다. 구간 밖의 판단은 하나도 안 들어갔다.
      ⚠ **그래서 등급이 `judgment` 다.** 이 파일이 `core_cmb_temperature` 자리에서 같은
      판정을 이미 내려 놨다 — «밴드는 인쇄값이지만 중점은 인쇄된 수가 아니라 고른 점이다.
      이 파일에서 `grade: measured` 를 든 것은 `tectonic_regime` 하나뿐이고, 그건 원전이 그
      분류를 그 바디에 대해 인쇄하기 때문이다». 앞 판본이 `measured` 였던 것은 옳았다 —
      Stähler 는 "1830 ± 40 km" 를 **그대로 인쇄**한다. 논문이 바뀌면서 **등급의 근거가
      사라진 것**이지 표기 취향이 아니다 (감사석, 2026-09-20).
      ⚠ **앞 판본은 Stähler+ 2021 의 1830±40 이었다** (2021Sci...373..443S:104–106 · 2021Sci...373..443S:279; 방법별
      폭 1836/1815 km 는 :283–285, 진원 깊이 고정 1820±40 은 :286–287). 그 판으로 맞춘 값은
      S 18.9062 wt% · 핵 1819.89 km 였고, 이 결정으로 **착지 전에 대체된다** — 물리가 바뀐 것이
      아니라 목표가 바뀐 것이다. `uncertainty_km` 은 **기록**이다: 이 트리에 그 칸을 읽는
      소비처가 아직 없고, 블록에서 값을 꺼내는 독자(`core_history._declared_scalar`)는
      `value` 만 본다.
  # 핵의 가벼운 원소 — 황은 **맞춘다**, 산소·탄소는 **고정한다**. 어느 끝에 고정하느냐가
  # 맞춘 황을 크게 움직이므로(2026-09-20 측정, 반분 6 둘: 하한 고정 → S 18.9062 wt%, 상한
  # 고정 → S 13.8438 wt%, 차 5.06 wt% = 상자 폭의 4 분의 1 이상) 그 선택은 **선언**이다.
  # ⚠ 굳힌 파일(`mars_sulphur_anchor.json`)의 상한은 **14.5000 wt%** 다 — 반분을 2 회만 사서
  # 해상도가 3 wt% 이기 때문이고, 물리가 다른 것이 아니다. 굳힘이 상한에 정밀도를 안 사는 이유는
  # 그 값을 쓰는 시험이 «두 고정이 갈리느냐» 만 묻기 때문이다(거친 값으로도 차 4.41 wt%).
  # ⚠ 이 키가 없으면 맞춤은 **이름 대고 거절한다** — 조용한 기본값을 두지 않는다.
  # 핵의 가벼운 원소를 **한 칸에** — 황은 fit(관측 핵 반지름에 맞춤), 산소 · 탄소는 오너 상자의 윗모서리
  # (prereg-core-light-elements, 층 일반화 ⓒ1). 값은 질량분율. 아래 옛 `light_element_fixing` 과 같은 수여야 하고
  # (다르면 이름 대고 거절), 옛 칸은 정리 단계에서 지운다.
  core_light_elements:
    value: {S: fit, O: 0.04, C: 0.014}
    grade: declared
    fit: true
    source: "owner core box 2026-09-10 (S 13–19 · O 1–4 · C 0.5–1.4 wt%) and owner declaration 2026-09-20 (box_ceiling)"
    counter_evidence_searched: >
      C107 (interior-core.md): with this box the layered family's core is not reached; the two box corners give
      S 18.9062 (floor) against 13.8438 wt% (ceiling) at halvings 6, so the choice of corner is a declaration.
      Huang+ 2023's fit range (19 GPa anchor) is the box; no source held gives Mars's O or C.
  light_element_fixing:
    value: box_ceiling        # box_floor = O 1 · C 0.5 wt% · box_ceiling = O 4 · C 1.4 wt%
    grade: declared
    source: "owner declaration 2026-09-20"
    note: >
      오너 상자(2026-09-10)는 S 13–19 · O 1–4 · C 0.5–1.4 wt% 다. 황은 관측 핵 반지름
      (core_plus_layer_radius_km)을 재현하도록 풀고, 나머지 둘은 이 선언이 가리키는 끝에 고정한다.
      ⚠ 두 끝이 **다른 답**을 주므로 이 한 줄이 곧 조성 결정이다 — 측정값은 착지 기록에.
      ⚠ **2026-09-20: box_floor → box_ceiling 으로 바꿨다 (오너, «산소 탄소를 늘려보자»).**
      이유는 측정이다 — 목표가 Durán 의 1845 km 로 가자 하한 고정이 요구하는 황이
      **20.5938 wt%** 로 **상자(13–19) 밖**으로 나갔고, 상한 고정은 같은 자(반분 6)에서
      **15.5313 wt%** 로 상자 안에 있다. ⚠ **전환이 고치는 것은 그 한 가지뿐이다**: 같은
      실행에서 nmoi 는 −1.956 → −1.939 %(허용 1 %, **여전히 밖**)이고 평균 핵밀도는
      **6.768 g/cm³ 로 한 자리도 안 움직인다**(Durán 창 6.0–6.2 대비 +9.2 %). 두 고정의 핵
      반지름도 1841.52 대 1841.56 km 로 사실상 같다 — 맞춤이 목표를 재현하기 때문이고,
      그래서 **O·C 선택은 핵의 크기가 아니라 황의 양으로만 드러난다**.
  lid_thickness_km:
    value: 330.0
    grade: analog
    source: "2011Icar..212..541M"
    note: >
      Morschhauser, Grott & Breuer 2011's thermal-evolution model prints a present-day
      stagnant-lid thickness of 330 km for Mars (2011Icar..212..541M:1457–1459, cache text
      layer; the paper defines `Dl` as the lid base at :274, not an elastic or seismic
      thickness — so it is the quantity eq. (3) takes). It is a model output, not an
      observation, which is why the grade is analog. Breuer & Spohn 2003's 350–500 km band
      brackets it from above; the ~250 km elastic thickness is a different quantity and
      neither confirms nor refutes it. The refutation site is an observational lid-base
      thickness, an InSight-class result, not another model.
  # C20 열진화의 초기온도 — 지구와 **같은 인쇄값을 그대로 전이**한다. Nimmo+ 2004 Fig. 2
  # 캡션의 *"starting temperature of both mantle and core was 4800 K"*, 실온도로 읽음.
  # ⚠ **지구의 3040 K 를 옮기면 안 된다** — 그것은 4800/r_b 이고 r_b 는 **바디마다 다르다.**
  # 지구 r_b = 1.5789(내부구조 해가 재현한다, yaml 주석의 1.579), 화성 r_b ≈ 1.1937.
  # 그래서 옮기는 것은 **핵·맨틀 바닥의 실온도 4800 K 하나**이고, 맨틀 퍼텐셜은 이 바디의
  # 해로 다시 나눈다: 4800 / 1.1937 = 4021 K. 3040 을 그대로 쓰면 지구의 압축을 화성에
  # 밀수하는 것이 된다.
  # ⚠ 이 전이의 값은 "이 좌석이 고를 것이 없다" 는 데 있다. MANTLE_SHARE = 0.70 이나
  # T_s = 293 K 처럼 지구 수를 모든 암석체에 선언하는 이 엔진의 기존 패턴이고, 전이가
  # 옳은지는 3.7 Ga 검문소가 검증하거나 반증한다.
  # ⚠ r_b 는 선언 T_pot 에 거의 안 딸린다 — 1400·1600·1800 K 에서 1.1882·1.1937·1.1799,
  # 폭 1.2 %. 그래서 0단계의 스윕에서도 이 값은 사실상 고정이다.
  core_initial_temperature: 4800.0
  mantle_initial_potential_temperature: 4021.0
  # 층 적분기(thermal_stack)의 몸 값 — ⓐ1 (prereg-a1-body-stack, 동결 ea6000e1 · 덧붙임 1–2). 층 없는 화성이라
