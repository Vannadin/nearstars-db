# 물리값 의존 그래프 — 노드(양)와 네 종류 엣지. 문서에 근거 있는 것만 등재
#
# 이 파일이 정본이다. engine/DEPENDENCY-CHAIN.md 와 dependency-chain.html 은
# 여기서 읽어 만든 뷰이지 별도의 진실이 아니다.
#
# v2 (2026-08-24): 방법론 21개를 네 묶음으로 나눠 전수 채굴한 결과를 반영.
# v1 은 대화 중 우연히 읽은 5-6개 문서에서만 캐낸 편향 표본이었고, 전수
# 채굴에서 엣지가 두 배 넘게 나왔다.
#
# 엣지 종류
#   requires    A 의 수치가 B 의 입력. 빌드 순서를 정한다.
#   selects     A 가 B 의 *모델* 을 고른다. 숫자를 넘기지 않는다.
#               빠뜨리면 틀린 레시피가 조용히 적용된다.
#   influences  정식 입력은 아니나 A 가 바뀌면 B 를 다시 봐야 한다.
#   excludes    시험했고 아니었다. "그럴듯해서 다시 긋는 것"을 막는 기록.
#
# 필드
#   via       넘어가는 양. 없으면 selects 이거나 스칼라가 아니다.
#   scope     self(기본) | parent | system. 부모의 값을 소비하는 엣지가 실재한다.
#   sign      influences 의 부호. non-monotonic 은 반드시 명시한다.
#   spatial   true 면 스칼라가 아니라 분포가 바뀐다.
#   status    gap = 결합은 실재하나 우리 문서가 아직 서술하지 않음.
#   textbook  교과서 관계식이라 논문 인용이 면제되는 경우.
#
# 근거 없는 엣지는 넣지 않는다. 그림을 위해 추측한 화살표가 이 프로젝트가
# 반복해 온 실수다.

version: 2
updated: 2026-08-24

kinds: [requires, selects, influences, excludes]
node_kinds: [measured, owner, computed, class_table]
grades: [measured, calibrated, analog, judgment]
scopes: [self, parent, system]

# 노드 축 둘 (2026-09-03 브리프 61, 오너 지시). 둘은 교차한다 — interior_layers 와 core_state 는
# 2층이고 dynamo_rocky 는 3층인데 셋 다 domain 은 interior 다.
#   layer   실행 순서. 아래 배너 주석이 이름 그대로 필드가 됐다(오너가 정한 이름, 바꾸지 않는다).
#           배너와 필드는 chain.py check 가 대조하므로 서로 어긋날 수 없다. 필드는 **파일이 노드를
#           둔 자리** 를 적는다 — t_exo_bracket 은 kind 가 computed 인데 클래스 표 배너 아래 있고,
#           그 불일치는 나중에 살펴볼 파일의 사실이지 지금 매끈하게 고칠 것이 아니다.
#   domain  주제. 의존 그래프의 주제 축이다. docs/reference/methodology-index.md 는 **문서의 정리
#           순서** 라 서로 달라도 된다 — 인덱스는 내부·조석·자전/도형·자기를 한 절에 두고
#           internal_heat_nontidal 과 surface_dose 를 "Atmosphere & thermal" 에, 색 레시피를
#           공용 엔진 절에 두지만, 여기서는 오너가 더 잘게 나눴고 internal_heat_nontidal 은
#           interior, atmosphere_reflected_color 는 atmosphere 다. 그 차이를 "고치지" 말 것.
#           `given` 은 주제가 아니라 **입력 경계** 다 — 출처(measured/owner)는 node_kinds 가
#           이미 싣는다. 축을 총체로 두어야 "모든 노드가 domain 을 선언한다" 가 검사 가능한
#           게이트가 되므로 남긴다. 클래스 표 넷은 layer 로는 함께(조회값), domain 으로는 먹이는
#           주제로 갈린다(nmoi → interior, k2q · omega0 → tidal).
#   개수 (50 노드 — C14 의 core_energy_balance(09-03)와 C15 의 core_entropy_production(09-04); 파일이 정본이고 어떤 메시지도 아니다):
#     domain  interior 10 · tidal 7 · given 11 · thermal 5 · atmosphere 5 · surface 5 · space_env 4 · spin_figure 3
#     layer   0층 11 · 1층 2 · 2층 8 · 클래스 표 상수 4 · 3층 12 · 4층 6 · 5층 7
#   노드 명칭 결론과 진척 (오너, 1588ff47, 09-03 15:28–15:40). 오너의 물음 — 15:28 "나는 내부구조를 하나의
#   노드로 생각하고 있었거든? 내부구조 안의 노드를 말하는거야 아님 내부구조와 동격의 새 노드를 말하는거야?",
#   15:36 "하나의 특성으로 묶이는 그룹이 있고 그 안에 노드들이 여러가지 있는걸로 하는게 나을까?" — 에 대한
#   결론: 주제로 묶는 그룹 축이 `domains` 이고 그 안에 노드가 든다. **이 파일이 정본이고 탐색기는 그리기만
#   한다** (반대로 하면 파일과 그림이 갈라진다). 초안 둘 중 원안(8 domain)을 채택 — 15:40 "수정 전의 초안이
#   더 낫겠다." 세 단계 중 진척(브리프 64 기록):
#     ① domain/layer 축을 모든 노드에 선언하고 chain.py check 가 게이트한다 — 브리프 61, 완료.
#     ② 의존 사슬 탐색기(dependency-chain.html)가 domain 을 읽어 묶음으로 그린다 — 미착수.
#     ③ 명세·보드의 "노드" 용어를 이 축에 맞춰 정렬한다 — 미착수.
layers: ["0층. 계산되지 않는 것", "1층. 분기키", "2층. 허브", "클래스 표 상수", "3층. 갈래", "4층. 열·대기", "5층. 표면"]
domains: [interior, tidal, spin_figure, space_env, thermal, atmosphere, surface, given]

nodes:

  # ── 0층. 계산되지 않는 것 ──────────────────────────────────────
  star_physical:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: measured
    # p_rot: 측정된 항성 자전주기. 2026-09-03 브리프 43 — star_physical → body_figure via p_rot
    # (:body-figure-methodology.md:238, α Cen A P_rot 22 d 측정 경로)이 "오배선" 으로 분류됐다가
    # 정정됐다: 화살표는 맞고 이 목록이 짧았다. spin_axis_inclination 의 p_rot 은 v sin i + i★ 의
    # **도출** 경로(:244, Fomalhaut A)이고 둘은 다른 길이다. DB 는 rotation_measurements 로
    # 측정 자전주기를 실제로 담고 있다 (db/stellar_props_curated.json · db/systems).
    outputs: [mass, radius, teff, luminosity, sed, v_sin_i, p_rot]
  star_metallicity:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: measured
    outputs: [z]
    status: gap
  system_age:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: measured
    outputs: [t_sys]
  body_age:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: measured
    outputs: [t_body]
    note: 천체 자신의 나이. 항성 나이와 다르고, 거대행성 냉각광도의 실입력이다.
  orbit_elements:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: measured
    outputs: [a, e, i, lan, aop, n]
  mass_or_radius:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: measured
    outputs: [mass, radius]

  composition_intent:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: owner
    outputs: [layer_fractions, mantle_redox, surface_species]
    status: gap
    note: 층 질량분율·맨틀 산화도·표면 종. 측정되지 않는 오너 결정인데 지금은 body_type 산문에만 있다.
  ocean_fraction:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: owner
    outputs: [f_ocean]
    status: gap
  ocean_depth:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: owner
    outputs: [d_ocean]
    status: gap
    note: f_ocean 과 다른 양이다. 공명 두께에 걸리면 소산이 자릿수로 움직인다.
  resonance_architecture:
    layer: "0층. 계산되지 않는 것"
    domain: tidal
    kind: owner
    outputs: [forced_e]
    status: gap
    note: 지속 조석가열을 주장하려면 e 를 유지하는 공명을 이름 대야 한다.
  ring_system:
    layer: "0층. 계산되지 않는 것"
    domain: given
    kind: owner
    outputs: [present, optical_depth]
    status: gap

  # ── 1층. 분기키 ────────────────────────────────────────────────
  body_class:
    layer: "1층. 분기키"
    domain: given
    kind: computed
    recipe: body-class-methodology
    outputs: [class, classes, decided_by, agrees_with_declared]
    note: >
      아래 전부가 여기서 갈린다 — selects 엣지 여덟이 이 노드에서 나간다. 2026-08-27
      까지 값이 계산되지 않고 bodies/*.yaml 에 손으로 적혀 있었고, 모든 레시피가 그것을
      액면 그대로 받았다. 해왕성을 giant 로 적어 넣으면 H/He 폴리트로프가 돌아 자신 있게
      틀린 답이 나왔다는 뜻이다.
      이제 질량과 반지름에서 좁힌다. **고르지 않고 좁힌다** — 경계마다 발표된 띠가 있고
      띠 안이면 양쪽이 다 살아남는다. 선언은 지우지 않는다: 지어낸 천체는 관측이 없어
      도출할 수 없으므로, 이 노드가 하는 일은 선언을 **대조** 하는 것이고 어긋나면
      agrees_with_declared 가 거짓이 된다. 어느 쪽이 맞는지는 오너가 정한다.
      소비처 여덟은 아직 선언을 읽는다. 그 배선은 interior.py 를 만져야 해서 별건이다.
  mass_radius_relation:
    layer: "1층. 분기키"
    domain: interior
    kind: computed
    recipe: mass-radius-relation-methodology
    outputs: [radius, density]

  # ── 2층. 허브 ──────────────────────────────────────────────────
  interior_layers:
    layer: "2층. 허브"
    domain: interior
    kind: computed
    recipe: interior-structure-methodology
    outputs: [nmoi, core_radius_fraction, core_radius, radius, core_pressure,
              core_temperature, cmb_temperature, cmb_pressure, ice_column_state,
              ocean_thickness, ice_shell_thickness, bulk_porosity, voids_expected,
              figure_relaxation]
    note: >
      질량과 조성에서 층 구조를 푼다. 정수압 평형·질량보존·상태방정식을 함께
      적분하므로 층 밀도가 입력이 아니라 결과다 — 그래서 반지름과 중심압도 같이
      나온다. 2026-08-25 까지 interior_structure 한 덩어리였는데, 거기에는 열
      문제(핵이 전도성 액체인가)와 점탄성 문제(k2/Q)가 같이 들어 있었다. 입력도
      논문도 등급도 다르므로 나눴다.
      2026-08-27 에 온도가 들어왔다. core_temperature 와 cmb_temperature 는
      **internal_heat_nontidal 의 geotherm 과 다른 양이다** — 저쪽은 방사성 붕괴와
      잔열이 정하는 열 예산(l_int, 암석체에서 t_int ≈ 35 K)이고, 이쪽은 그 예산이
      수준을 정해 주는 정수압 프로파일 위의 T(P) 다. 한 낱말이 두 양을 덮고 있으니
      geotherm 쪽 이름을 갈라 주는 것이 좋다. 여기서는 손대지 않았다.
      2026-08-29 에 바다가 들어왔다. ice_column_state 의 판정이 밀도에 들어가고
      (액체 물 EOS, SeaFreeze water1), 그래서 이 노드 **안에** 고리가 생겼다 —
      순환 7. ocean_thickness · ice_shell_thickness 는 그 결과이고, 둘 다
      포텐셜 온도 선언이 정하는 값이라 등급이 analog 다.
      2026-08-30 에 sub_neptune 이 거절 목록에서 나왔다. gas_mass_fraction 은
      일곱 번째 **선언** 이다 (ice_allowed · tidal_heating · initial_porosity ·
      envelope_z · potential_temperature · core_cmb_temperature 와 같은 종류):
      나이와 항성 조사량이 정하고 이 레시피에 진화가 없어서 도출하지 않는다.
      2026-08-30 에 두 선언이 더 들어왔다 (C5) — boundary_temperature_jump (얼음 맨틀
      꼭대기와 기체 외피 바닥 사이의 열경계층 온도 차, Nettelmann+ 2016) 와
      mantle_rock_fraction (얼음 맨틀에 섞인 암석의 질량분율). 둘 다 형성과 열 이력이
      정하고 이 레시피가 도출하지 않으며, 쓰이면 등급이 analog 로 내려간다. 앵커는 둘 다
      0 으로 두어 움직이지 않는다.
      같은 날 serpentinisation 이 들어왔다 (C10) — 암석층에서 antigorite 가 차지하는
      질량분율, 규산염과 부피 가법으로 섞는 선언 축 하나. 물이 어디까지 갔는가의 이력이라
      도출하지 않는다. Hilairet+ 2006 의 antigorite 는 상온 적합뿐이라 등급은 그 결핍이
      정한다. 앵커는 0.
      2026-08-30 에 세 선언이 더 들어왔다 (C11, 중간 단) — differentiation_front (중심에서
      잰 누적 질량분율로 어디까지 녹아 분화했는가; 1 이면 지각 없음), crust_rock_fraction
      (그 위 한 번도 녹지 않은 원시 지각의 암석 질량분율 — Malamud & Prialnik 2015 의 바깥
      맨틀이 재동결로 원시 조성이 아니라 둘째 선언이 필요하다), crust_porosity (같은 논문 식
      (4)–(6) 의 two-layer 공극을 지각에 얹는 상한, 선택). 지각은 얼음 사다리와 규산염을
      알갱이로 부피 가법 혼합한 층이라 C7 이 막은 반응이 아니다. 어디까지 녹았는가는 열
      이력이라 도출하지 않고, 쓰이면 analog. 앵커는 전선 1.0 (지각 없음).
  core_state:
    layer: "2층. 허브"
    domain: interior
    kind: computed
    recipe: core-state-methodology
    outputs: [conductor_phase, cmb_melt_temperature, center_melt_temperature,
              core_cmb_temperature_used, core_center_temperature_used, icb_pressure,
              center_margin, cmb_margin, center_margin_fraction, gamma_flip,
              gamma_flip_in_alfe_range, k0_flip, melt_splice_disagreement, margin_condition]
    note: >
      핵이 다이나모를 돌릴 수 있는 상태인가. 핵 압력·온도를 융해곡선과 비교해야
      하므로 지오섬이 먼저 필요하다. interior_layers 와 별개의 계산이다.
      2026-08-27 에 융해곡선이 들어와 구현됐고, 그때 **융해곡선만으로는 열리지
      않는다는 것** 이 같이 나왔다. interior_layers 의 지오섬은 맨틀 단열선을 핵까지
      이어 그린 것이라 D″ 열경계층과 철의 진짜 단열 기울기가 빠져 있고, 두 편향이 같은
      방향이라 그 값은 **하한** 이다. 하한만으로는 '액체' 만 말할 수 있고 '고체' 는
      말할 수 없다. 핵 쪽 경계 온도를 선언하면 둘 다 말한다.
  tidal_response:
    layer: "2층. 허브"
    domain: tidal
    kind: computed
    status: missing
    outputs: [k2_over_q, layer_q]
    note: >
      층 유동학에서 조석 Love 수와 소산을 낸다. k2q_class_table 이 이 자리를
      대신하고 있다. 바다 유무와 두께가 자릿수로 움직인다.
  xuv_history:
    layer: "2층. 허브"
    domain: space_env
    kind: computed
    outputs: [xuv_cumulative]
    note: 순간 플럭스가 아니라 생애 적분 선량. 모든 stripping 추정의 입력.
  internal_heat_nontidal:
    layer: "2층. 허브"
    domain: interior
    kind: computed
    recipe: internal-heat-luminosity-methodology
    # 2026-09-03 브리프 44: geotherm 이라는 이름을 물린다 — 한 낱말이 열 예산과 T(P) 프로파일 둘을
    # 덮고 있었다 (interior_layers 노트, 브리프 40 §4). 암석체에서 이 노드는 방사성 예산이다:
    # l_int = 총 방사성 출력, mantle_radiogenic_power = 맨틀 몫 70 %(선언). 거대행성 갈래(냉각광도)는
    # dynamo.py 와 같은 이유로 거절한다. 붕괴 이력은 계산하되 열진화는 아니다(Nimmo+ 2004 는 보유 — 하단 경계층은 cmb_heat_flux 가 전사했다).
    outputs: [l_int, t_int, radiogenic_power, mantle_radiogenic_power, crust_radiogenic_power,
              radiogenic_power_low, radiogenic_heat_w_m2, radiogenic_power_history_4gyr,
              mantle_top_boundary_layer, implied_surface_heat_flux, implied_surface_heat_flow,
              heat_flow_consistency, urey_ratio,
              mantle_temperature_floor_min, mantle_temperature_floor_max, mantle_temperature_floor_verdict,
              mantle_temperature_width_zeta, mantle_temperature_width_set,
              mantle_temperature_width_denominator, mantle_temperature_width_surface]

  cmb_heat_flux:
    layer: "2층. 허브"
    domain: interior
    kind: computed
    recipe: internal-heat-luminosity-methodology
    # 2026-09-03 브리프 60 (오너 승인): 핵-맨틀 경계 열류. Nimmo+ 2004 식 37–39 (맨틀 하단 경계층) 를
    # 전사하고, 핵 쪽 단열 열류는 선언된 철 열전도 50 ± 20 (Table 1) 로 낸다. 핵 쪽 경계온도는
    # 선언(core_cmb_temperature)이라 없으면 점프가 없어 이름 대며 거절한다. φ(엔트로피 생성)와
    # 다이나모 배선은 다음 단계다 — 여기서는 Q_CMB 와 Q_adiabat 만.
    outputs: [q_cmb, q_cmb_min, q_cmb_max, cmb_boundary_layer, cmb_heat_flux_density, eta_bottom,
              q_adiabat, q_adiabat_min, q_adiabat_max, adiabat_gradient_cmb, g_cmb, k_core, cmb_jump,
              cmb_flux_verdict, q_cmb_in_paper_range]

  core_energy_balance:
    layer: "2층. 허브"
    domain: interior
    kind: computed
    recipe: internal-heat-luminosity-methodology
    # 2026-09-03 C14 (오너 "c14 진행하자" / "B로 가야지"): Nimmo+ 2004 식 30 의 핵 에너지 수지를 현재 시점에서
    # 닫아 핵 쪽 CMB 온도를 **근찾기로 푼다** — 선언 하한(지구 3760 K)을 해로. dT_c/dt(−33 K/Gyr, 밴드 33–126)와
    # 핵 H(1.5 pW/kg, 바닥 0)는 선언. 핵 프로파일(ρ·g·T·ψ)은 이 노드가 CMB 에서 안쪽으로 정수압 적분해 만든다.
    # **되먹이지 않는다** — 풀린 T_c 는 보고이지 core_state 의 입력이 아니다(앵커 이동은 별도 결정). φ·다이나모는 C15.
    outputs: [core_cmb_temperature_solved, core_cmb_temperature_solved_min, core_cmb_temperature_solved_max,
              core_cmb_temperature_declared, core_cmb_solved_minus_declared, q_cmb_solved, q_s, q_l, q_g, q_r,
              icb_radius_solved, icb_pressure_solved, c_r_km_per_k, has_inner_core_solved,
              core_profile_mass_residual, core_center_pressure_solved, balance_residual, band_corners_with_root]

  core_entropy_production:
    layer: "2층. 허브"
    domain: interior
    kind: computed
    recipe: internal-heat-luminosity-methodology
    # 2026-09-04 C15 (오너 "자기장쪽 배선 최대한"): Nimmo+ 2004 식 43 의 현재 시점 엔트로피 생성 φ = ΔE, 여섯 항
    # (E_R·E_s·E_L·E_H·E_g·E_k), C14 가 푼 T_c 의 프로파일 위에서. **판정이 아니라 밴드** — 논문 자신이 문턱을 안 쓰고
    # ΔE > 0 을 쓰며(필요 엔트로피는 0.1–1000 MW/K), 우리는 그 선택을 "문턱 회피" 라벨과 함께 채택한다. dynamo_rocky
    # 판정에는 **배선하지 않는다**(사다리를 덮어쓸 자격 없음). 3 Gyr 진술(평균·최소 ΔE)은 이력 양이라 C20 없이는 거절.
    outputs: [entropy_production, entropy_production_min, entropy_production_max, entropy_production_h0,
              e_r, e_s, e_l, e_g, e_h, e_k, entropy_positive_present, entropy_band_straddles_zero,
              entropy_corners_positive, has_inner_core_solved, entropy_history_verdict, entropy_integration_width]

  # ── 클래스 표 상수 — 도출값이 아니라 조회값 ─────────────────────
  # 세 문서가 공통으로 인정한다. per-body 기록이 아니라 클래스별 표에서
  # 꺼내는 상수이고, 그런데도 J2·조석고정·조석가열 전부의 뿌리다.
  nmoi_class_table:
    layer: "클래스 표 상수"
    domain: interior
    kind: class_table
    outputs: [nmoi]
    note: "\"바디 클래스에서 NMoI 를 고르고 가정과 범위를 명시하라\" — body-figure:256"
  k2q_class_table:
    layer: "클래스 표 상수"
    domain: tidal
    kind: class_table
    outputs: [k2_over_q]
    note: "\"외계 천체에서는 사실상 측정된 적이 없다\" — tidal-heating:527"
  omega0_class_table:
    layer: "클래스 표 상수"
    domain: tidal
    kind: class_table
    outputs: [p_init]
    note: "\"원시 미지값. 인용이 아니라 논증으로 경계지어진다\" — tidal-locking:431"
  t_exo_bracket:
    layer: "클래스 표 상수"
    domain: thermal
    kind: class_table
    outputs: [t_exo]
    note: "\"T_exo 는 약한 입력이고 표면온도가 아니다\" — exoplanet-atmosphere:284. 손으로 구간을 잡는다."

  # ── 3층. 갈래 ──────────────────────────────────────────────────
  tidal_locking:
    layer: "3층. 갈래"
    domain: tidal
    kind: computed
    recipe: tidal-locking-timescale-methodology
    # 2026-09-04 (C16): **레시피 미등록** — 계산 노드 34 중 등록 10. 이 노드의 `locked` 가 dynamo_rocky 영역 게이트의 분기
    # 열쇠라, 이 노드가 없는 동안 그 게이트는 모든 천체에 cannot-say (no tidal_locking) 다. 잠김 여부는 Phase 4 성격이라
    # 소비자가 스스로 선언하지 않는다(판도라의 32 h 잠김은 보드에 있고 엔진이 읽는 자리에는 없다).
    outputs: [locked, t_lock, rotation_period]
  body_figure:
    layer: "3층. 갈래"
    domain: spin_figure
    kind: computed
    recipe: body-figure-methodology
    outputs: [j2, c22, flattening, reference_radius, relief]
  cassini_state:
    layer: "3층. 갈래"
    domain: spin_figure
    kind: computed
    recipe: cassini-state-obliquity-methodology
    outputs: [obliquity]
  spin_axis_inclination:
    layer: "3층. 갈래"
    domain: spin_figure
    kind: computed
    recipe: spin-axis-inclination-methodology
    outputs: [i_star, p_rot]
  dynamo_giant:
    layer: "3층. 갈래"
    domain: interior
    kind: computed
    recipe: planetary-dynamo-scaling
    outputs: [b_pol, b_eq, dipole_moment]
  dynamo_rocky:
    layer: "3층. 갈래"
    domain: interior
    kind: computed
    recipe: rocky-planet-dynamo-methodology
    # 2026-09-03 브리프 47: 레시피 등록. 두 게이트(생존·영역)는 라벨이고 ℳ_base·영역·다극자 계수는 선언
    # 가족이다. Rm > 40 은 인용이지 평가가 아니다 (문서에 공식이 없다). regime 은 선언된 갈래 또는
    # "undeclared (both emitted)" — rossby 엣지가 gap 이라 그렇다.
    outputs: [dipole_moment, dipole_moment_min, dipole_moment_max, b_eq, b_pol,
              b_eq_multipolar_min, b_eq_multipolar_max, regime, ladder_regime, dynamo_alive, rossby_verdict]
  stellar_wind:
    layer: "3층. 갈래"
    domain: space_env
    kind: computed
    outputs: [n_sw, v_sw, p_ram]
  magnetosphere_geometry:
    layer: "3층. 갈래"
    domain: space_env
    kind: computed
    recipe: planetary-magnetosphere-geometry-methodology
    outputs: [r_mp, belt_extent, belt_intensity]
  tidal_heating:
    layer: "3층. 갈래"
    domain: tidal
    kind: computed
    recipe: tidal-heating-methodology
    outputs: [power, surface_flux, radius_ceiling, plains_temperature]
    note: "radius_ceiling 은 수송 테스트가 돌려주는 하드 반지름 상한 (§6, Dante 521 km 가 그 산물), plains_temperature 는 외부 예산의 평원 온도 (§6.3·6.5, Dante 223 K) — 둘 다 방법론이 실제로 계산하는 값이라 2026-09-03 에 gap 이 아니라 출력으로 선언했다."
  heat_transport_mode:
    layer: "3층. 갈래"
    domain: tidal
    kind: computed
    recipe: tidal-heating-methodology
    outputs: [mode, resurfacing_rate]
    note: 내부 열이 표면까지 어떻게 나오는가. 별빛 열의 재분배는 day_night_contrast 다.
  day_night_contrast:
    layer: "3층. 갈래"
    domain: thermal
    kind: computed
    recipe: tidally-locked-temperature-methodology
    outputs: [contrast, substellar_ceiling]
    note: >
      별빛 열을 대기가 낮밤으로 얼마나 재분배하는가. 2026-08-25 까지
      heat_transport_mode 안에 들어 있었는데, 그건 안에서 나오는 열이고
      이건 밖에서 들어온 열이다. "수송" 이라는 말을 공유해 합쳐져 있었다.
  global_fluid_layer:
    layer: "3층. 갈래"
    domain: atmosphere
    kind: computed
    outputs: [present]

  # ── 4층. 열·대기 ───────────────────────────────────────────────
  t_eq_stellar:
    layer: "4층. 열·대기"
    domain: thermal
    kind: computed
    outputs: [t_eq]
  moon_energy_budget:
    layer: "4층. 열·대기"
    domain: thermal
    kind: computed
    recipe: moon-energy-budget-methodology
    outputs: [t_eq_4term, f_abs]
  t_eff_body:
    layer: "4층. 열·대기"
    domain: thermal
    kind: computed
    outputs: [t_eff]
    note: "T_eff⁴ = T_eq⁴ + T_int⁴"
  atmospheric_escape:
    layer: "4층. 열·대기"
    domain: atmosphere
    kind: computed
    recipe: exoplanet-atmosphere-methodology
    outputs: [retained, loss_rate]
  atmosphere_choice:
    layer: "4층. 열·대기"
    domain: atmosphere
    kind: owner
    outputs: [pressure, composition, haze]
  greenhouse:
    layer: "4층. 열·대기"
    domain: atmosphere
    kind: computed
    recipe: greenhouse-warming-methodology
    outputs: [delta_t_gh, t_surf]

  # ── 5층. 표면 ──────────────────────────────────────────────────
  ice_stability:
    layer: "5층. 표면"
    domain: surface
    kind: computed
    recipe: ice-stability-methodology
    outputs: [ice_survives, min_albedo]
  surface_albedo:
    layer: "5층. 표면"
    domain: surface
    kind: computed
    recipe: surface-color-albedo-methodology
    outputs: [albedo, hue]
  crater_state:
    layer: "5층. 표면"
    domain: surface
    kind: computed
    recipe: crater-degradation-methodology
    outputs: [cratered]
  surface_dose:
    layer: "5층. 표면"
    domain: space_env
    kind: computed
    recipe: surface-radiation-dose-methodology
    outputs: [dose]
  surface_uv:
    layer: "5층. 표면"
    domain: surface
    kind: computed
    outputs: [uv_flux]
    status: gap
  atmosphere_reflected_color:
    layer: "5층. 표면"
    domain: atmosphere
    kind: computed
    recipe: atmosphere-reflected-color-methodology
    outputs: [hex]
  hapke_shader_values:
    layer: "5층. 표면"
    domain: surface
    kind: computed
    recipe: hapke-shader-methodology
    outputs: [terrain, scaled, porosity_k, theta]

edges:

  # ── 질량·반지름이 뿌리에 가깝다 ────────────────────────────────
  - {from: mass_or_radius, to: mass_radius_relation, kind: requires, ref: "mass-radius-relation-methodology.md:62"}
  - {from: composition_intent, to: mass_radius_relation, kind: selects, ref: "mass-radius-relation-methodology.md:191"}
  - {from: star_physical, to: mass_radius_relation, kind: influences, sign: positive, via: insolation, ref: "mass-radius-relation-methodology.md:107"}
  - from: mass_radius_relation
    to: body_class
    kind: requires
    via: radius_valley
    note: >
      밸리 게이트는 저쪽에 남는다. 저쪽이 묻는 것은 "이 반지름에서 암석 격자를 믿을 수
      있나" 이고 이쪽이 묻는 것은 "이 천체가 무엇인가" 다 — 저쪽의 거절("통계적으로
      암석이 아니다")은 분류가 아니라서, 서브넵튠인지 얼음거대행성인지 가스거대행성인지를
      말하지 않는다. body_class 는 같은 띠를 **가져다 쓴다** (mass_radius.VALLEY_LO/HI):
      사본을 두 벌 두면 그중 하나가 표류한다.
      다만 이 엣지가 늘 값을 나르지는 않는다. 저쪽은 거대행성을 거절하므로 Alpha
      Centauri A b 에서는 아무 값도 안 낸다 — 그래서 사다리의 위쪽 절반은 질량으로 읽는다.
    ref: "mass-radius-relation-methodology.md:220"
  - {from: mass_or_radius, to: body_class, kind: requires}
  - from: composition_intent
    to: body_class
    kind: requires
    status: gap
    note: >
      경계 여섯 중 **하나** 에서만 짐을 진다. 가스거대행성과 얼음거대행성을 가르는 것은
      크기가 아니라 질량의 대부분이 수소-헬륨인가 무거운 원소인가이고 (Lambrechts &
      Johansen 2014), 그것을 말하는 것이 이 노드다. 선언되면 그 경계가 조성으로 갈리고,
      없으면 발표된 질량 띠 둘 사이가 모호한 채로 남는다. 나머지 다섯 경계는 질량이나
      반지름으로 그어지므로 이것이 없어도 갈린다.
  - {from: mass_radius_relation, to: interior_layers, kind: requires, ref: "rocky-planet-dynamo-methodology.md:187"}
  - {from: body_class, to: interior_layers, kind: requires}
  - {from: composition_intent, to: interior_layers, kind: requires}
  - {from: mass_radius_relation, to: atmosphere_choice, kind: selects, ref: "mass-radius-relation-methodology.md:221"}
  - {from: mass_radius_relation, to: surface_albedo, kind: influences, sign: non-monotonic, ref: "mass-radius-relation-methodology.md:368"}

  # ── 클래스 표 상수가 실제 공급자다 ─────────────────────────────
  - {from: body_class, to: nmoi_class_table, kind: selects, ref: "body-figure-methodology.md:256"}
  - {from: body_class, to: k2q_class_table, kind: selects, ref: "tidal-heating-methodology.md:194"}
  - {from: body_class, to: omega0_class_table, kind: selects, ref: "tidal-locking-timescale-methodology.md:431"}
  # 클래스 조회는 이제 **적분이 못 미치는 클래스에서만** 공급자다. 응축상 천체도
  # H/He 봉투를 가진 거대행성도 interior_layers 가 per-body 로 낸다(아래).
  #
  # 남은 넷은 각자 다른 이유로 거절된다 — 얼음거대행성은 봉투가 물-암모니아-메탄
  # 혼합이라 n = 1 이 안 맞고, 서브넵튠은 봉투 두께가 나이와 조사량이 정하는데 이
  # 레시피에 진화 트랙이 없고, 갈색왜성은 중수소 연소가 있고, 항성은 n = 3/2 의
  # 0.205 로 body_figure 의 별도 갈래에 있다.
  # (interior-structure-methodology.md §Domain of validity)
  - {from: nmoi_class_table, to: body_figure, kind: requires, via: nmoi, note: "적분이 거절하는 클래스에 한한다 — brown_dwarf · star. ice_giant 는 2026-08-27, sub_neptune 은 2026-08-30 에 적분으로 넘어갔다.", ref: "body-figure-methodology.md:256"}
  - {from: nmoi_class_table, to: cassini_state, kind: requires, via: nmoi, note: "적분이 거절하는 클래스에 한한다 — brown_dwarf · star. ice_giant 는 2026-08-27, sub_neptune 은 2026-08-30 에 적분으로 넘어갔다.", ref: "cassini-state-obliquity-methodology.md:166"}
  - {from: k2q_class_table, to: tidal_heating, kind: requires, via: k2_over_q, ref: "tidal-heating-methodology.md:194"}
  - {from: k2q_class_table, to: tidal_locking, kind: requires, via: k2_over_q, ref: "tidal-locking-timescale-methodology.md:266"}
  - {from: omega0_class_table, to: tidal_locking, kind: requires, via: p_init, ref: "tidal-locking-timescale-methodology.md:270"}
  - {from: t_exo_bracket, to: atmospheric_escape, kind: requires, via: t_exo, ref: "exoplanet-atmosphere-methodology.md:284"}
  - from: interior_layers
    to: body_figure
    kind: requires
    via: nmoi
    note: >
      C/MR² 의 공급자. 2026-08-25 까지 클래스 조회 하나가 이 자리에 있었고, 적분이
      per-body 값을 내기 시작한 뒤에도 소비처가 표를 계속 봤다 — 더 나은 수가 옆에서
      안 쓰인 채로 있었다는 뜻이다. 클래스 표는 적분이 거절하는 클래스에만 남는다.
    ref:
      - "interior-structure-methodology.md:Contract"
      - "body-figure-methodology.md:256"
  - from: interior_layers
    to: cassini_state
    kind: requires
    via: nmoi
    note: >
      body_figure 와 같은 양을 같은 곳에서 받는다. 한쪽만 적분으로 옮기면 하나의
      C/MR² 에 공급자가 둘이 되고, 그게 이미 한 번 사고를 낸 모양이다.
    ref:
      - "interior-structure-methodology.md:Contract"
      - "cassini-state-obliquity-methodology.md:166"

  # ── figure · 자전 ──────────────────────────────────────────────
  - {from: tidal_locking, to: body_figure, kind: requires, via: locked, ref: "body-figure-methodology.md:252"}
  - {from: body_figure, to: tidal_locking, kind: selects, via: [j2, c22], ref: "tidal-locking-timescale-methodology.md:204"}
  - {from: mass_radius_relation, to: body_figure, kind: requires, via: radius, ref: "body-figure-methodology.md:353"}
  - {from: orbit_elements, to: body_figure, kind: requires, via: n, ref: "body-figure-methodology.md:37"}
  - {from: body_class, to: body_figure, kind: selects, ref: "body-figure-methodology.md:79"}
  - {from: star_physical, to: body_figure, kind: requires, via: p_rot, ref: "body-figure-methodology.md:238"}
  - {from: star_physical, to: spin_axis_inclination, kind: requires, via: v_sin_i, ref: "spin-axis-inclination-methodology.md:21"}
  - {from: body_class, to: spin_axis_inclination, kind: selects, ref: "spin-axis-inclination-methodology.md:75"}
  - {from: spin_axis_inclination, to: body_figure, kind: requires, via: p_rot, ref: "body-figure-methodology.md:244"}
  - {from: body_figure, to: cassini_state, kind: requires, via: [j2, c22], ref: "cassini-state-obliquity-methodology.md:92"}
