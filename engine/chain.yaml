# 물리값 의존 그래프 — 노드(양)와 네 종류 엣지. 문서에 근거 있는 것만 등재
#
# 이 파일이 정본이다. engine/DEPENDENCY-CHAIN.md 와 dependency-chain.html 은
# 여기서 읽어 만든 뷰이지 별도의 진실이 아니다.
#
# v2 (2026-08-24): 방법론 21개를 네 묶음으로 나눠 전수 채굴한 결과를 반영.
# v1 은 대화 중 우연히 읽은 5-6개 문서에서만 캐낸 편향 표본이었고, 전수
# 채굴에서 엣지가 두 배 넘게 나왔다.
#
# 엣지 종류
#   requires    A 의 수치가 B 의 입력. 빌드 순서를 정한다.
#   selects     A 가 B 의 *모델* 을 고른다. 숫자를 넘기지 않는다.
#               빠뜨리면 틀린 레시피가 조용히 적용된다.
#   influences  정식 입력은 아니나 A 가 바뀌면 B 를 다시 봐야 한다.
#   excludes    시험했고 아니었다. "그럴듯해서 다시 긋는 것"을 막는 기록.
#
# 필드
#   via       넘어가는 양. 없으면 selects 이거나 스칼라가 아니다.
#   scope     self(기본) | parent | system. 부모의 값을 소비하는 엣지가 실재한다.
#   sign      influences 의 부호. non-monotonic 은 반드시 명시한다.
#   spatial   true 면 스칼라가 아니라 분포가 바뀐다.
#   status    gap = 결합은 실재하나 우리 문서가 아직 서술하지 않음.
#   textbook  교과서 관계식이라 논문 인용이 면제되는 경우.
#
# 근거 없는 엣지는 넣지 않는다. 그림을 위해 추측한 화살표가 이 프로젝트가
# 반복해 온 실수다.

version: 2
updated: 2026-08-24

kinds: [requires, selects, influences, excludes]
node_kinds: [measured, owner, computed, class_table]
grades: [measured, calibrated, analog, judgment]
scopes: [self, parent, system]

nodes:

  # ── 0층. 계산되지 않는 것 ──────────────────────────────────────
  star_physical:      {kind: measured, outputs: [mass, radius, teff, luminosity, sed, v_sin_i]}
  star_metallicity:   {kind: measured, outputs: [z], status: gap}
  system_age:         {kind: measured, outputs: [t_sys]}
  body_age:
    kind: measured
    outputs: [t_body]
    note: 천체 자신의 나이. 항성 나이와 다르고, 거대행성 냉각광도의 실입력이다.
  orbit_elements:     {kind: measured, outputs: [a, e, i, lan, aop, n]}
  mass_or_radius:     {kind: measured, outputs: [mass, radius]}

  composition_intent:
    kind: owner
    outputs: [layer_fractions, mantle_redox, surface_species]
    status: gap
    note: 층 질량분율·맨틀 산화도·표면 종. 측정되지 않는 오너 결정인데 지금은 body_type 산문에만 있다.
  ocean_fraction:     {kind: owner, outputs: [f_ocean], status: gap}
  ocean_depth:
    kind: owner
    outputs: [d_ocean]
    status: gap
    note: f_ocean 과 다른 양이다. 공명 두께에 걸리면 소산이 자릿수로 움직인다.
  resonance_architecture:
    kind: owner
    outputs: [forced_e]
    status: gap
    note: 지속 조석가열을 주장하려면 e 를 유지하는 공명을 이름 대야 한다.
  ring_system:        {kind: owner, outputs: [present, optical_depth], status: gap}

  # ── 1층. 분기키 ────────────────────────────────────────────────
  body_class:
    kind: computed
    status: missing
    outputs: [class]
    note: 아래 전부가 여기서 갈린다. 없어서 오적용을 기계적으로 막을 수 없다.
  mass_radius_relation: {kind: computed, recipe: mass-radius-relation-methodology, outputs: [radius, density]}

  # ── 2층. 허브 ──────────────────────────────────────────────────
  interior_layers:
    kind: computed
    recipe: interior-structure-methodology
    outputs: [nmoi, core_radius_fraction, core_radius]
    note: >
      질량·반지름·핵질량분율에서 층 기하를 푼다. 정적 구조 문제다.
      2026-08-25 까지 interior_structure 한 덩어리였는데, 거기에는 열 문제(핵이
      전도성 액체인가)와 점탄성 문제(k2/Q)가 같이 들어 있었다. 입력도 논문도
      등급도 다르므로 나눴다.
  core_state:
    kind: computed
    status: missing
    outputs: [conductor_phase]
    note: >
      핵이 다이나모를 돌릴 수 있는 상태인가. 핵 압력·온도를 융해곡선과 비교해야
      하므로 지오섬이 먼저 필요하다. interior_layers 와 별개의 계산이다.
  tidal_response:
    kind: computed
    status: missing
    outputs: [k2_over_q, layer_q]
    note: >
      층 유동학에서 조석 Love 수와 소산을 낸다. k2q_class_table 이 이 자리를
      대신하고 있다. 바다 유무와 두께가 자릿수로 움직인다.
  xuv_history:
    kind: computed
    outputs: [xuv_cumulative]
    note: 순간 플럭스가 아니라 생애 적분 선량. 모든 stripping 추정의 입력.
  internal_heat_nontidal:
    kind: computed
    recipe: internal-heat-luminosity-methodology
    outputs: [l_int, t_int, geotherm]

  # ── 클래스 표 상수 — 도출값이 아니라 조회값 ─────────────────────
  # 세 문서가 공통으로 인정한다. per-body 기록이 아니라 클래스별 표에서
  # 꺼내는 상수이고, 그런데도 J2·조석고정·조석가열 전부의 뿌리다.
  nmoi_class_table:
    kind: class_table
    outputs: [nmoi]
    note: "\"바디 클래스에서 NMoI 를 고르고 가정과 범위를 명시하라\" — body-figure:256"
  k2q_class_table:
    kind: class_table
    outputs: [k2_over_q]
    note: "\"외계 천체에서는 사실상 측정된 적이 없다\" — tidal-heating:527"
  omega0_class_table:
    kind: class_table
    outputs: [p_init]
    note: "\"원시 미지값. 인용이 아니라 논증으로 경계지어진다\" — tidal-locking:431"
  t_exo_bracket:
    kind: class_table
    outputs: [t_exo]
    note: "\"T_exo 는 약한 입력이고 표면온도가 아니다\" — exoplanet-atmosphere:284. 손으로 구간을 잡는다."

  # ── 3층. 갈래 ──────────────────────────────────────────────────
  tidal_locking:      {kind: computed, recipe: tidal-locking-timescale-methodology, outputs: [locked, t_lock, rotation_period]}
  body_figure:        {kind: computed, recipe: body-figure-methodology, outputs: [j2, c22, flattening, reference_radius, relief]}
  cassini_state:      {kind: computed, recipe: cassini-state-obliquity-methodology, outputs: [obliquity]}
  spin_axis_inclination: {kind: computed, recipe: spin-axis-inclination-methodology, outputs: [i_star, p_rot]}
  dynamo_giant:       {kind: computed, recipe: planetary-dynamo-scaling, outputs: [b_pol, b_eq, dipole_moment]}
  dynamo_rocky:       {kind: computed, recipe: rocky-planet-dynamo-methodology, outputs: [dipole_moment, b_eq]}
  stellar_wind:       {kind: computed, outputs: [n_sw, v_sw, p_ram]}
  magnetosphere_geometry: {kind: computed, recipe: planetary-magnetosphere-geometry-methodology, outputs: [r_mp, belt_extent, belt_intensity]}
  tidal_heating:      {kind: computed, recipe: tidal-heating-methodology, outputs: [power, surface_flux]}
  heat_transport_mode:
    kind: computed
    recipe: tidal-heating-methodology
    outputs: [mode, resurfacing_rate]
    note: 내부 열이 표면까지 어떻게 나오는가. 별빛 열의 재분배는 day_night_contrast 다.
  day_night_contrast:
    kind: computed
    recipe: tidally-locked-temperature-methodology
    outputs: [contrast, substellar_ceiling]
    note: >
      별빛 열을 대기가 낮밤으로 얼마나 재분배하는가. 2026-08-25 까지
      heat_transport_mode 안에 들어 있었는데, 그건 안에서 나오는 열이고
      이건 밖에서 들어온 열이다. "수송" 이라는 말을 공유해 합쳐져 있었다.
  global_fluid_layer: {kind: computed, outputs: [present]}

  # ── 4층. 열·대기 ───────────────────────────────────────────────
  t_eq_stellar:       {kind: computed, outputs: [t_eq]}
  moon_energy_budget: {kind: computed, recipe: moon-energy-budget-methodology, outputs: [t_eq_4term, f_abs]}
  t_eff_body:         {kind: computed, outputs: [t_eff], note: "T_eff⁴ = T_eq⁴ + T_int⁴"}
  atmospheric_escape: {kind: computed, recipe: exoplanet-atmosphere-methodology, outputs: [retained, loss_rate]}
  atmosphere_choice:  {kind: owner, outputs: [pressure, composition, haze]}
  greenhouse:         {kind: computed, recipe: greenhouse-warming-methodology, outputs: [delta_t_gh, t_surf]}

  # ── 5층. 표면 ──────────────────────────────────────────────────
  ice_stability:      {kind: computed, recipe: ice-stability-methodology, outputs: [ice_survives, min_albedo]}
  surface_albedo:     {kind: computed, recipe: surface-color-albedo-methodology, outputs: [albedo, hue]}
  crater_state:       {kind: computed, recipe: crater-degradation-methodology, outputs: [cratered]}
  surface_dose:       {kind: computed, recipe: surface-radiation-dose-methodology, outputs: [dose]}
  surface_uv:         {kind: computed, outputs: [uv_flux], status: gap}
  atmosphere_reflected_color: {kind: computed, recipe: atmosphere-reflected-color-methodology, outputs: [hex]}
  hapke_shader_values: {kind: computed, recipe: hapke-shader-methodology, outputs: [terrain, scaled, porosity_k, theta]}

edges:

  # ── 질량·반지름이 뿌리에 가깝다 ────────────────────────────────
  - {from: mass_or_radius, to: mass_radius_relation, kind: requires, ref: "mass-radius-relation-methodology.md:62"}
  - {from: composition_intent, to: mass_radius_relation, kind: selects, ref: "mass-radius-relation-methodology.md:191"}
  - {from: star_physical, to: mass_radius_relation, kind: influences, sign: positive, via: insolation, ref: "mass-radius-relation-methodology.md:107"}
  - {from: mass_radius_relation, to: body_class, kind: requires, via: radius_valley, ref: "mass-radius-relation-methodology.md:220"}
  - {from: mass_or_radius, to: body_class, kind: requires}
  - {from: composition_intent, to: body_class, kind: requires}
  - {from: mass_radius_relation, to: interior_layers, kind: requires, ref: "rocky-planet-dynamo-methodology.md:187"}
  - {from: body_class, to: interior_layers, kind: requires}
  - {from: composition_intent, to: interior_layers, kind: requires}
  - {from: mass_radius_relation, to: atmosphere_choice, kind: selects, ref: "mass-radius-relation-methodology.md:221"}
  - {from: mass_radius_relation, to: surface_albedo, kind: influences, sign: non-monotonic, ref: "mass-radius-relation-methodology.md:368"}

  # ── 클래스 표 상수가 실제 공급자다 ─────────────────────────────
  - {from: body_class, to: nmoi_class_table, kind: selects, ref: "body-figure-methodology.md:256"}
  - {from: body_class, to: k2q_class_table, kind: selects, ref: "tidal-heating-methodology.md:194"}
  - {from: body_class, to: omega0_class_table, kind: selects, ref: "tidal-locking-timescale-methodology.md:431"}
  - {from: nmoi_class_table, to: body_figure, kind: requires, via: nmoi, ref: "body-figure-methodology.md:256"}
  - {from: nmoi_class_table, to: cassini_state, kind: requires, via: nmoi, ref: "cassini-state-obliquity-methodology.md:166"}
  - {from: k2q_class_table, to: tidal_heating, kind: requires, via: k2_over_q, ref: "tidal-heating-methodology.md:194"}
  - {from: k2q_class_table, to: tidal_locking, kind: requires, via: k2_over_q, ref: "tidal-locking-timescale-methodology.md:266"}
  - {from: omega0_class_table, to: tidal_locking, kind: requires, via: p_init, ref: "tidal-locking-timescale-methodology.md:270"}
  - {from: t_exo_bracket, to: atmospheric_escape, kind: requires, via: t_exo, ref: "exoplanet-atmosphere-methodology.md:284"}
  - {from: interior_layers, to: nmoi_class_table, kind: influences, status: gap, note: 내부구조가 생기면 클래스 조회를 도출값이 대체한다.}

  # ── figure · 자전 ──────────────────────────────────────────────
  - {from: tidal_locking, to: body_figure, kind: requires, via: lock_state, ref: "body-figure-methodology.md:252"}
  - {from: body_figure, to: tidal_locking, kind: selects, via: permanent_quadrupole, ref: "tidal-locking-timescale-methodology.md:204"}
  - {from: mass_radius_relation, to: body_figure, kind: requires, via: radius, ref: "body-figure-methodology.md:353"}
  - {from: orbit_elements, to: body_figure, kind: requires, via: n, ref: "body-figure-methodology.md:37"}
  - {from: body_class, to: body_figure, kind: selects, ref: "body-figure-methodology.md:79"}
  - {from: star_physical, to: body_figure, kind: requires, via: p_rot, ref: "body-figure-methodology.md:238"}
  - {from: star_physical, to: spin_axis_inclination, kind: requires, via: v_sin_i, ref: "spin-axis-inclination-methodology.md:21"}
  - {from: body_class, to: spin_axis_inclination, kind: selects, ref: "spin-axis-inclination-methodology.md:75"}
  - {from: spin_axis_inclination, to: body_figure, kind: requires, via: p_rot, ref: "body-figure-methodology.md:244"}
  - {from: body_figure, to: cassini_state, kind: requires, via: [j2, c22], ref: "cassini-state-obliquity-methodology.md:92"}
  - {from: tidal_locking, to: cassini_state, kind: selects, ref: "cassini-state-obliquity-methodology.md:175"}
  - {from: orbit_elements, to: cassini_state, kind: requires, via: [e, a, n], ref: "cassini-state-obliquity-methodology.md:167"}
  - {from: star_physical, to: cassini_state, kind: requires, via: mass, ref: "cassini-state-obliquity-methodology.md:79"}
  - {from: ocean_fraction, to: cassini_state, kind: influences, sign: positive, status: gap, ref: "cassini-state-obliquity-methodology.md:187"}
  - from: body_figure
    to: cassini_state
    kind: requires
    via: [j2, radius]
    scope: parent
    note: 위성의 Cassini 상태는 *부모 행성의* J2 와 반지름이 정하는 교점 이동률에 걸린다.
    ref: "cassini-state-obliquity-methodology.md:124"
  - {from: body_figure, to: cassini_state, kind: selects, via: fossil_bulge, ref: "cassini-state-obliquity-methodology.md:185"}
  - {from: body_figure, to: crater_state, kind: requires, via: relief, ref: "tidal-heating-methodology.md:471"}

  # ── 조석 ───────────────────────────────────────────────────────
  - {from: orbit_elements, to: tidal_locking, kind: requires, via: [a, e], ref: "tidal-locking-timescale-methodology.md:141"}
  - {from: mass_radius_relation, to: tidal_locking, kind: requires, ref: "tidal-locking-timescale-methodology.md:450"}
  - {from: system_age, to: tidal_locking, kind: requires, via: t_sys, ref: "tidal-locking-timescale-methodology.md:89"}
  - {from: atmosphere_choice, to: tidal_locking, kind: selects, via: thermal_tide, ref: "tidal-locking-timescale-methodology.md:247"}
  - {from: tidal_locking, to: tidal_heating, kind: selects, ref: "tidal-locking-timescale-methodology.md:438"}
  - {from: orbit_elements, to: tidal_heating, kind: requires, via: [a, e, n], ref: "tidal-heating-methodology.md:61"}
  - {from: mass_radius_relation, to: tidal_heating, kind: requires, via: radius, ref: "mass-radius-relation-methodology.md:371"}
  - {from: resonance_architecture, to: tidal_heating, kind: requires, via: forced_e, status: gap, ref: "tidal-heating-methodology.md:182"}
  - {from: cassini_state, to: tidal_heating, kind: requires, via: obliquity, ref: "moon-energy-budget-methodology.md:318"}
  - {from: ocean_depth, to: tidal_heating, kind: requires, via: d_ocean, status: gap, ref: "moon-energy-budget-methodology.md:237"}
  - {from: tidal_heating, to: interior_layers, kind: influences, sign: non-monotonic, ref: "tidal-heating-methodology.md:199"}
  - from: tidal_heating
    to: mass_radius_relation
    kind: requires
    via: radius_ceiling
    note: >
      수송 테스트가 하드 반지름 상한을 돌려준다. 제한받는 것은 *측정된* 반지름이
      아니라 우리가 배정하는 반지름이다 — Dante 521 km 가 그 상한의 산물이다.
    ref: "tidal-heating-methodology.md:442"
  - {from: tidal_heating, to: heat_transport_mode, kind: requires, via: surface_flux, ref: "tidal-heating-methodology.md:273"}
  - {from: internal_heat_nontidal, to: heat_transport_mode, kind: requires, via: geotherm, ref: "tidal-heating-methodology.md:266"}
  - {from: global_fluid_layer, to: heat_transport_mode, kind: selects, ref: "tidal-heating-methodology.md:332"}
  - {from: t_eq_stellar, to: heat_transport_mode, kind: requires, ref: "tidal-heating-methodology.md:341"}
  - {from: atmosphere_choice, to: day_night_contrast, kind: requires, via: pressure, ref: "tidally-locked-temperature-methodology.md:117"}
  - {from: omega0_class_table, to: day_night_contrast, kind: selects, via: circulation_regime, ref: "tidally-locked-temperature-methodology.md:117"}
  - {from: t_eq_stellar, to: day_night_contrast, kind: requires, ref: "tidally-locked-temperature-methodology.md:61"}
  - from: tidal_locking
    to: day_night_contrast
    kind: selects
    note: >
      이 문서는 동기자전 암석행성만 다룬다. 비동기 자전체에서는 대비를 묻지 않고
      T_eq 로 끝난다 — 그래서 값을 바꾸는 게 아니라 레시피를 쓸지 말지를 고른다.
    ref: "tidally-locked-temperature-methodology.md:29"
  - {from: tidal_heating, to: ice_stability, kind: requires, ref: "tidal-heating-methodology.md:717"}
  - {from: tidal_heating, to: crater_state, kind: requires, ref: "tidal-heating-methodology.md:720"}
  - from: tidal_heating
    to: surface_albedo
    kind: requires
    via: plains_temperature
    note: 평원 온도가 어느 휘발성 물질이 안정한지를 정한다 — 황이냐 SO2 서리냐가 표면 색조를 가른다.
    ref: "tidal-heating-methodology.md:460"
  - {from: tidal_heating, to: internal_heat_nontidal, kind: requires, ref: "internal-heat-luminosity-methodology.md:34"}

  # ── 자기 ───────────────────────────────────────────────────────
  - {from: mass_or_radius, to: dynamo_giant, kind: requires, ref: "planetary-dynamo-scaling.md:29"}
  - {from: body_age, to: dynamo_giant, kind: requires, via: cooling_luminosity, ref: "planetary-dynamo-scaling.md:34"}
  - {from: internal_heat_nontidal, to: dynamo_giant, kind: requires, via: l_int, ref: "internal-heat-luminosity-methodology.md:472"}
  - {from: body_class, to: dynamo_giant, kind: selects, ref: "planetary-dynamo-scaling.md:82"}
  - {from: tidal_locking, to: dynamo_giant, kind: selects, ref: "planetary-dynamo-scaling.md:33"}
  - {from: body_class, to: dynamo_rocky, kind: selects, ref: "planetary-dynamo-scaling.md:97"}
  - {from: mass_or_radius, to: dynamo_rocky, kind: requires, ref: "rocky-planet-dynamo-methodology.md:22"}
  - {from: orbit_elements, to: dynamo_rocky, kind: requires, via: period, ref: "rocky-planet-dynamo-methodology.md:22"}
  - {from: interior_layers, to: dynamo_rocky, kind: requires, via: [core_radius, conductor_phase], ref: "rocky-planet-dynamo-methodology.md:23"}
  - {from: tidal_locking, to: dynamo_rocky, kind: selects, via: rossby, ref: "rocky-planet-dynamo-methodology.md:76"}
  - {from: ocean_fraction, to: dynamo_rocky, kind: influences, sign: negative, status: gap, ref: "rocky-planet-dynamo-methodology.md:109"}
  - {from: body_age, to: dynamo_rocky, kind: influences, sign: negative, ref: "rocky-planet-dynamo-methodology.md:70"}
  - {from: heat_transport_mode, to: dynamo_rocky, kind: selects, via: cmb_heat_flux, ref: "rocky-planet-dynamo-methodology.md:70"}
  - {from: internal_heat_nontidal, to: dynamo_rocky, kind: requires, via: geotherm, ref: "internal-heat-luminosity-methodology.md:202"}
  - {from: star_physical, to: stellar_wind, kind: requires, via: age}
