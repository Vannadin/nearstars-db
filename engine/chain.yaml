  - {from: t_eq_stellar, to: greenhouse, kind: requires, ref: "greenhouse-warming-methodology.md:439"}
  - {from: moon_energy_budget, to: greenhouse, kind: requires, via: t_eq_4term, ref: "greenhouse-warming-methodology.md:441"}
  - {from: star_physical, to: greenhouse, kind: requires, via: teff, ref: "greenhouse-warming-methodology.md:162"}
  - {from: star_physical, to: greenhouse, kind: selects, via: spectrum, ref: "greenhouse-warming-methodology.md:283"}
  - {from: tidal_heating, to: greenhouse, kind: influences, status: gap, ref: "moon-energy-budget-methodology.md:124"}
  - {from: mass_or_radius, to: internal_heat_nontidal, kind: requires, ref: "internal-heat-luminosity-methodology.md:118"}
  - {from: body_age, to: internal_heat_nontidal, kind: requires, ref: "internal-heat-luminosity-methodology.md:118"}
  - {from: body_class, to: internal_heat_nontidal, kind: selects, ref: "internal-heat-luminosity-methodology.md:187"}
  - {from: star_metallicity, to: internal_heat_nontidal, kind: influences, status: gap, ref: "internal-heat-luminosity-methodology.md:254"}
  - from: interior_layers
    to: mass_radius_relation
    kind: requires
    via: radius
    note: >
      조성별 M-R 곡선의 절대 위치는 층을 풀어야 나온다. 2026-08-25 까지는 문서 §2 의
      산문 순서에서 유도한 배율표가 그 자리에 있었고, 밀도 게이트의 문턱이 거기
      걸려 있어서 문서 §7 의 기각 사례가 재현되지 않았다. 이제 반지름도 순철 곡선도
      interior_layers 의 적분에서 나온다.
    ref:
      - "interior-structure-methodology.md:Contract"
  - {from: internal_heat_nontidal, to: mass_radius_relation, kind: influences, sign: positive, ref: "internal-heat-luminosity-methodology.md:477"}
  - {from: internal_heat_nontidal, to: t_eff_body, kind: requires, via: t_int, ref: "internal-heat-luminosity-methodology.md:60"}
  - {from: t_eq_stellar, to: t_eff_body, kind: requires, textbook: true, ref: "internal-heat-luminosity-methodology.md:60"}

  # ── 표면 ───────────────────────────────────────────────────────
  - {from: greenhouse, to: ice_stability, kind: requires, via: t_surf}
  - {from: moon_energy_budget, to: ice_stability, kind: requires, via: f_abs, ref: "ice-stability-methodology.md:53"}
  - {from: surface_albedo, to: ice_stability, kind: requires, via: albedo, ref: "ice-stability-methodology.md:73"}
  - {from: ice_stability, to: surface_albedo, kind: requires, via: min_albedo, ref: "ice-stability-methodology.md:159"}
  - {from: composition_intent, to: ice_stability, kind: selects, ref: "ice-stability-methodology.md:137"}
  - {from: body_age, to: ice_stability, kind: requires, ref: "ice-stability-methodology.md:71"}
  - {from: mass_or_radius, to: ice_stability, kind: requires, ref: "ice-stability-methodology.md:72"}
  - {from: composition_intent, to: surface_albedo, kind: requires, ref: "surface-color-albedo-methodology.md:64"}
  - {from: star_physical, to: surface_albedo, kind: requires, via: sed, ref: "surface-color-albedo-methodology.md:268"}
  - {from: stellar_wind, to: surface_albedo, kind: influences, sign: negative, ref: "surface-color-albedo-methodology.md:184"}
  - {from: magnetosphere_geometry, to: surface_albedo, kind: influences, spatial: true, ref: "surface-color-albedo-methodology.md:231"}
  - {from: atmosphere_choice, to: surface_albedo, kind: selects, ref: "surface-color-albedo-methodology.md:26"}
  - {from: body_age, to: surface_albedo, kind: influences, sign: negative, ref: "surface-color-albedo-methodology.md:68"}
  - {from: ocean_fraction, to: surface_albedo, kind: requires, status: gap, ref: "tidally-locked-temperature-methodology.md:208"}
  - {from: t_eq_stellar, to: crater_state, kind: requires, via: homologous_temperature, ref: "crater-degradation-methodology.md:92"}
  - {from: composition_intent, to: crater_state, kind: selects, ref: "crater-degradation-methodology.md:96"}
  - from: atmosphere_choice
    to: crater_state
    kind: selects
    via: fluvial_aeolian_channel
    note: >
      두꺼운 대기는 크레이터 열화의 채널 자체를 바꾼다. 작동하는 수문·풍성 순환이
      있으면 비·강·바람이 바닥부터 채우고, 그 열화는 초반이 빠르고 스스로 멈춘다 —
      낡은 것은 전부 깊이 메워지고 어린 것은 거의 안 건드려진 이중 분포가 남는다.
      대기가 없으면 이 채널이 아예 없고 열화는 충돌·완화에만 의존한다.
      D ≳ 10 km 소거 시간은 화성·타이탄 수준에서 수억 년.
    ref:
      - "crater-degradation-methodology.md:100-112"
      - "2012P&SS...60...26N"
  - {from: body_age, to: crater_state, kind: requires, ref: "crater-degradation-methodology.md:143"}
  - {from: star_physical, to: atmosphere_reflected_color, kind: requires, via: sed, ref: "atmosphere-reflected-color-methodology.md:233"}
  - {from: atmosphere_choice, to: atmosphere_reflected_color, kind: requires, ref: "atmosphere-reflected-color-methodology.md:55"}
  - {from: t_eq_stellar, to: atmosphere_reflected_color, kind: selects, via: cloud_class, ref: "atmosphere-reflected-color-methodology.md:58"}
  - {from: atmosphere_reflected_color, to: surface_albedo, kind: influences, ref: "surface-color-albedo-methodology.md:277"}
  - {from: atmosphere_reflected_color, to: greenhouse, kind: influences, ref: "atmosphere-reflected-color-methodology.md:439"}
  - {from: body_class, to: hapke_shader_values, kind: selects, ref: "hapke-shader-methodology.md:165"}
  - {from: surface_albedo, to: hapke_shader_values, kind: influences, sign: non-monotonic, ref: "hapke-shader-methodology.md:81"}
  - from: atmosphere_choice
    to: hapke_shader_values
    kind: selects
    via: scaled_family
    note: >
      대기는 원반 위상곡선을 매끄러운 산란 쪽으로 씻어낸다. 무대기 레골리스·얼음이
      scaled 2.2 계열인 데 반해, 얇고 먼지 있는 대기는 1.56/1.0(화성), 두꺼운 대기는
      1.0~1.15 로 내려가고 지구는 아예 무대기 경로 밖(대양 셰이더)이다.
      즉 대기 유무가 값을 조금 움직이는 게 아니라 어느 계열을 쓸지를 고른다.
    ref:
      - "hapke-shader-methodology.md:42-51"
      - "hapke-shader-methodology.md:88-90"
  - {from: crater_state, to: hapke_shader_values, kind: requires, via: terrain, ref: "hapke-shader-methodology.md:158"}

  # ── excludes — 시험했고 아니었다 ───────────────────────────────
  - {from: mass_or_radius, to: hapke_shader_values, kind: excludes, ref: "hapke-shader-methodology.md:148", note: "corr(K, log g) = +0.58 뿐이고 이상치가 끌고 있다. K 는 표면중력을 따라가지 않는다."}
  - {from: interior_layers, to: hapke_shader_values, kind: excludes, ref: "hapke-shader-methodology.md:144", note: "phi 는 근표면 광학 packing 이지 벌크 다공도가 아니다."}
  - {from: composition_intent, to: surface_dose, kind: excludes, ref: "surface-radiation-dose-methodology.md:89", note: 조성은 거의 상관없다. 기둥밀도가 정한다.}
  - {from: internal_heat_nontidal, to: t_eff_body, kind: excludes, scope: self, ref: "internal-heat-luminosity-methodology.md:308", note: 암석체에서는 0.001 K 보정이라 표면온도에 무의미하다. 거대행성 엣지와 구분할 것.}
  - {from: star_physical, to: internal_heat_nontidal, kind: excludes, ref: "internal-heat-luminosity-methodology.md:118", note: 나이와 질량이 정하지 호스트가 정하지 않는다.}
  - {from: orbit_elements, to: day_night_contrast, kind: excludes, ref: "tidally-locked-temperature-methodology.md:47", note: 낮밤 대비는 대기가 정하지 궤도가 정하지 않는다.}
  - {from: heat_transport_mode, to: surface_albedo, kind: excludes, ref: "surface-color-albedo-methodology.md:191", note: "화산 재표면화 → 알베도는 어느 문서도 서술하지 않는다. 가장 가까운 건 충돌·풍화 노출연령이고 그건 다른 것이다."}
  - {from: cassini_state, to: spin_axis_inclination, kind: excludes, ref: "cassini-state-obliquity-methodology.md:203", note: 조석 감쇠된 것과 아닌 것. 교차적용 금지.}

cycles:
  - id: 1
    name: 표면온도 ↔ 내부구조
    members: [interior_layers, greenhouse, tidal_heating]
    resolution: T_eq 를 1차 경계값으로 두고 두 번 반복.
  - id: 2
    name: 알베도 ↔ 평형온도 ↔ 얼음 ↔ 온실 ↔ 대기
    members: [surface_albedo, t_eq_stellar, ice_stability, greenhouse, atmosphere_choice]
    resolution: >
      클래스 기본 알베도로 시드 후 두 번 반복. 처음엔 3노드로 봤는데 검증기가
      실제 고리를 짚어줬다 — T_eq 가 알베도를 먹고, 알베도를 얼음 생존이
      되돌려주고, 얼음은 온실이 준 T_surf 를 먹고, 온실은 대기를 먹고, 대기는
      척도높이 때문에 다시 T_eq 를 먹는다. 다섯 노드다.
  - id: 3
    name: 조석가열 ↔ 내부구조
    members: [interior_layers, tidal_heating, heat_transport_mode]
    resolution: >
      층 적분이 생겨 구조 쪽은 닫혔다 (2026-08-25). k2/Q 는 여전히 클래스 표
      상수다 — 그건 유동학이라 tidal_response 의 몫이다.
  - id: 4
    name: figure ↔ 조석고정
    members: [body_figure, tidal_locking]
    resolution: 1:1 잠금을 가정해 figure 를 풀고, 영구 사중극이 p:q 포획을 허용하는지 되짚는다.
  - id: 5
    name: 내부열 ↔ 반지름
    members: [internal_heat_nontidal, mass_radius_relation]
    resolution: 내부열이 반지름을 부풀리고 그 반지름이 T_int 를 정한다. 나이에 맞춰 반복.
  - id: 6
    name: 조석가열 ↔ 배정 반지름 ↔ figure ↔ Cassini
    members: [tidal_heating, mass_radius_relation, body_figure, cassini_state]
    resolution: >
      반지름이 figure 를 정하고, figure 가 Cassini 세차상수를 정하고, 경사각이
      조석 소산에 들어가고, 그 열유속의 수송 테스트가 반지름 상한을 돌려준다.
      검증기가 짚어준 고리다 — 처음엔 조석↔반지름 2노드로 봤는데 실제로는 넷을
      돈다. 반지름을 잡고 한 바퀴 돌린 뒤 상한을 위반하지 않는지 확인한다.

  - id: 7
    name: 상 ↔ 밀도 ↔ 온도 (interior_layers 안)
    members: [interior_layers]
    resolution: >
      노드 하나 안의 고리다. 얼음 기둥의 상(고체/액체)이 밀도를 정하고, 밀도가
      정수압·단열선을 정하고, 그 온도가 다시 상을 정한다. 적분이 중심에서 바깥으로
      가며 걸음마다 그 자리의 (P, T) 로 상을 정하므로 한 번의 적분 안에서는 인과가
      한 방향이고(안쪽이 바깥쪽을 정한다), 되먹임은 표면 온도를 선언값에 맞추는
      바깥 고리(shoot 의 온도 반복)가 닫는다. 수렴은 겉질량 1e-8 과 표면 온도 1e-3
      이 함께 들어야 converged 다. 2026-08-29.
ordering_rules:
  - 부모가 완전히 풀리기 전에는 위성을 풀 수 없다. scope=parent 엣지가 네 건 확인됐다.
  - 별이 행성보다 먼저다.
  - 클래스 표 상수(NMoI · k2/Q · omega0 · T_exo)는 도출값이 아니다. 그렇게 표시해야 한다.

# 위 여섯은 물리적으로 왜 얽히는지를 이름 붙인 것이고, 실제로는 **하나의 덩어리**다.
# requires 와 selects 를 함께 따라가면 강결합 성분이 하나 나오고 여섯이 전부 그
# 부분 고리다. 여섯으로 쪼개 적은 것이 결합의 크기를 가리고 있었다 — 검증기가
# requires 만 보느라 못 잡았고, 러너를 만들자 위상정렬이 막히면서 드러났다.
#
# body_class·moon_energy_budget·spin_axis_inclination 은 어느 선언에도 없었다.
# interior_layers 는 반대로 선언돼 있지만 덩어리 밖이었다 — 그쪽 엣지가 status: gap
# 이었기 때문이다. 2026-08-25 에 층 적분이 반지름을 내면서 그 엣지가 requires 로
# 바뀌었고, 예고대로 합류했다. 덩어리가 열다섯에서 열여섯이 됐다.
coupled_core:
  members: [atmosphere_choice, body_class, body_figure, cassini_state, greenhouse,
            heat_transport_mode, ice_stability, interior_layers,
            internal_heat_nontidal, mass_radius_relation, moon_energy_budget,
            spin_axis_inclination, surface_albedo, t_eq_stellar, tidal_heating,
            tidal_locking]
  anticipated: []
  resolution: >
    클래스 기본값으로 시드하고 덩어리 전체를 함께 반복한다. 부분 고리마다 따로
    두 번 도는 것이 아니라 한 덩어리로 돈다 — 부분 고리끼리 값을 주고받으므로
    따로 돌리면 수렴을 보장할 수 없다. 값이 안 움직이면 멈춘다.
  note: >
    클래스 표(NMoI·k2/Q·omega0·T_exo)는 이 계산에서 제외한다. 조회는 순서를
    요구하지 않는다 — 키만 있으면 즉시 나온다. 표를 계산 단계로 세면 없는 고리가
    생긴다(그렇게 세면 선언 안 된 순환이 12개로 늘어난다).
