<!DOCTYPE html>
<!-- 단독 시각화 도구·계산기들을 한곳에 모은 Tools 허브 페이지 (수동 관리 정적 페이지) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title"></title>
<link rel="stylesheet" href="style.css">
<style>
main { max-width: 980px }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 6px }
.tool { display: block; padding: 14px 16px; border: 1px solid var(--bd-strong); border-radius: 8px;
        background: var(--bg-card); text-decoration: none; transition: border-color .15s }
.tool:hover { border-color: var(--accent) }
.tool .tname { color: var(--fg-emph); font-weight: 700; font-size: 14px; margin-bottom: 4px }
.tool .tdesc { color: var(--fg-dim); font-size: 12.5px; line-height: 1.5 }
.tool .tsub { margin-top: 8px; font-family: var(--mono); font-size: 11px }
.tool .tsub a { color: var(--accent) }
.lang-toggle { margin-left: auto }
</style>
</head>
<body>

<header>
  <h1 data-i18n="title"></h1>
  <div class="crumb"><a href="index.html">DB</a> · <a href="starmap.html">3D Map</a> · <a href="reports.html">Reports</a> · <a href="phase4/index.html">Phase 4</a> · <span>Tools</span> · <a href="wiki/index.html">Wiki</a></div>
  <div class="seg lang-toggle" id="lang-seg">
    <button data-lang="ko">한</button>
    <button class="on" data-lang="en">EN</button>
  </div>
</header>

<main>
<section>
  <h2 data-i18n="section_title"></h2>
  <div class="card">
    <p class="intro" data-i18n="intro"></p>
  </div>
  <div class="tool-grid">
    <a class="tool" href="starmap.html">
      <div class="tname" data-i18n="t_starmap"></div>
      <div class="tdesc" data-i18n="d_starmap"></div>
    </a>
    <a class="tool" href="firefly-colors.html">
      <div class="tname" data-i18n="t_colors"></div>
      <div class="tdesc" data-i18n="d_colors"></div>
    </a>
    <a class="tool" href="belt-viewer.html">
      <div class="tname" data-i18n="t_belts"></div>
      <div class="tdesc" data-i18n="d_belts"></div>
    </a>
    <a class="tool" href="ice-stability.html">
      <div class="tname" data-i18n="t_ice"></div>
      <div class="tdesc" data-i18n="d_ice"></div>
    </a>
    <a class="tool" href="phase4/orbit-viewers/index.html">
      <div class="tname" data-i18n="t_orbits"></div>
      <div class="tdesc" data-i18n="d_orbits"></div>
    </a>
    <a class="tool" href="phase4/orbit-viewers/alpha-centauri-validation/index.html">
      <div class="tname" data-i18n="t_valid"></div>
      <div class="tdesc" data-i18n="d_valid"></div>
    </a>
  </div>
</section>
</main>

<footer>
  <span data-i18n="footer_note"></span>
</footer>

<script>
const T = {
  en: {
    title: "NearStars · Tools",
    section_title: "Standalone tools",
    intro: "Interactive visualizations and calculators that stand apart from the per-body report chain. Each opens in place; use the nav above to get back.",
    t_starmap: "3D star map",
    d_starmap: "Every curated system within 50 light-years, with spin axes, astrospheres, interstellar wind, and the 1314-star field layer.",
    t_colors: "Element & plasma colors",
    d_colors: "LTE emission colors per element and reentry-plasma palettes, computed from Saha-Boltzmann level populations.",
    t_belts: "Radiation belt viewer",
    d_belts: "Kerbalism belt geometry (SDF torus + pause) for Solar System anchors and NearStars bodies, stock vs physical presets.",
    t_ice: "Surface ice stability",
    d_ice: "Given an ice species, orbit, size, and albedo: does an exposed ice surface survive the body's age, and what does the dust-lag branch leave behind?",
    t_orbits: "Orbit viewers",
    d_orbits: "Interactive 3D orbit and n-body views per system, rendered from the stability-sim runs.",
    t_valid: "Alpha Cen validation set",
    d_valid: "Leapfrog vs IAS15/MEGNO cross-checks for the Alpha Centauri planet and moon configurations.",
    footer_note: "NearStars · Tools index · hand-maintained (docs/tools.html)"
  },
  ko: {
    title: "NearStars · 도구",
    section_title: "단독 도구",
    intro: "천체별 보고서 사슬과 별개로 도는 인터랙티브 시각화·계산기 모음입니다. 각 도구에서 위 내비게이션으로 돌아올 수 있습니다.",
    t_starmap: "3D 성도",
    d_starmap: "50광년 이내 큐레이션 항성계 전부. 자전축, 항성권, 성간풍, 1314개 별 필드 레이어 포함.",
    t_colors: "원소·플라스마 발광색",
    d_colors: "Saha-Boltzmann 준위 분포로 계산한 원소별 LTE 발광색과 재진입 플라스마 팔레트.",
    t_belts: "방사선대 뷰어",
    d_belts: "태양계 앵커와 NearStars 천체의 Kerbalism 벨트 기하(SDF 토러스 + 자기권계면). 스톡/물리 프리셋 비교.",
    t_ice: "표면 얼음 안정성",
    d_ice: "얼음 종류·궤도·크기·알베도를 넣으면, 노출된 얼음 표면이 천체 나이만큼 버티는지와 먼지 잔류층 갈래의 결과를 보여줍니다.",
    t_orbits: "궤도 뷰어",
    d_orbits: "안정성 시뮬레이션 결과로 렌더한 시스템별 인터랙티브 3D 궤도·n-body 뷰.",
    t_valid: "알파센 검증 세트",
    d_valid: "알파 센타우리 행성·위성 구성의 leapfrog 대 IAS15/MEGNO 교차 검증 차트.",
    footer_note: "NearStars · 도구 인덱스 · 수동 관리 (docs/tools.html)"
  }
};

let lang = localStorage.getItem('nearstars-lang') || 'en';

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[lang][el.dataset.i18n];
    if (v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll('#lang-seg button').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });
}

document.getElementById('lang-seg').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  lang = btn.dataset.lang;
  localStorage.setItem('nearstars-lang', lang);
  applyLang();
});

applyLang();
</script>

</body>
</html>
