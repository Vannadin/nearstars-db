function syncControls(){
  document.querySelectorAll('input[type=range]').forEach(inp=>{

// 장면 전체(벨트·계면 꼬리·Shue 닫힘)가 들어오는 반너비 → 뷰 슬라이더 최대값에 반영
let RMAX=70, RWHEEL=70;   // RMAX=슬라이더 상한(장면 크기), RWHEEL=휠 상한(궤도 고리까지)
function sceneExtent(){
  let e=5;
  const belt=B=>{ if(!B.on)return;
    const m=B.dist+B.rad;
    e=Math.max(e, m/Math.min(B.comp,B.ext,1), m); };
  belt(state.inner); belt(state.outer);
  if(state.pause.on){ const P=state.pause, nt=pauseNoseTail(P);
    e=Math.max(e, Math.abs(nt.nose), Math.abs(nt.tail), P.rad/P.hscale); }
  return Math.ceil(e*1.06);
}
function updateViewMax(){
  RMAX=Math.max(10, sceneExtent());
  // 궤도 고리는 수만 바디반경이라 슬라이더 상한으로 쓰면 눈금이 못 쓰게 거칠어진다.
  // 슬라이더는 장면 크기까지만 두고, 휠 축소만 궤도 너머까지 갈 수 있게 따로 잡는다.
  const orb=(state.orbit&&state.orbit.r)||0;
  RWHEEL=Math.max(RMAX, orb*1.15);
  const el=document.querySelector('input[type=range][data-g="view"][data-k="R"]');
  if(el) el.max=RMAX;
}
function applyControl(g,k,v){

  if(k==='deform' && v>0 && viewMode==='2d' && state.view.z===0){

}

// 현재 상태 → Kerbalism cfg (레거시 필드, 오늘 작동하는 스키마)
function nm(v){ return Math.round(v*1e5)/1e5; }
function toCfg(){
  const s=state,I=s.inner,O=s.outer,P=s.pause,L=[];
  L.push('// NearStars belt-viewer 내보내기 — 단위: 바디 반경, rad/h');
  L.push('// Kerbalism MM 패치에 붙여넣고 name + :NEEDS[...] 지정');
  if(Math.abs(P.waist||0)>0.001) L.push('// ⚗ pause_waist '+nm(P.waist)+' 는 스톡 함수 일반화 필드(하모니 패치 대기) → cfg emit 불가');
  if((P.smooth||0)>0.001){
    L.push('// ⚗ pause_smooth '+nm(P.smooth)+' 는 스톡 함수 일반화 필드(하모니 패치 대기) → cfg emit 불가');
    // 그 두 필드를 못 싣는다는 것은 아래 세 값이 스톡에서 다른 형상이 된다는 뜻이다 — 여기가
    // 조용히 어긋나기 쉬운 자리라 노즈를 양쪽 다 적어 둔다(뷰어 기본이 대기 세트라 더 그렇다).
    L.push('// ⚗ 스톡 엔진은 그 둘을 무시하므로 아래 pause_radius/compression 은 노즈 '+
      nm(pauseNoseTail(P).nose)+' 가 아니라 '+nm(P.rad/P.comp)+' 로 렌더된다 — 출하용은 보드의 비-smoothed 값을 쓸 것');
  }
  const belt=(B,pre)=>{
    L.push('  has_'+pre+' = '+(B.on?'true':'false'));
    if(!B.on) return;
    L.push('  '+pre+'_dist = '+nm(B.dist));
    L.push('  '+pre+'_radius = '+nm(B.rad));
    if(Math.abs(B.dxy-1)>1e-4) L.push('  '+pre+'_deform_xy = '+nm(B.dxy));
    if(Math.abs(B.comp-1)>1e-4) L.push('  '+pre+'_compression = '+nm(B.comp));
    if(Math.abs(B.ext-1)>1e-4) L.push('  '+pre+'_extension = '+nm(B.ext));
    if(B.brad>1e-4){ L.push('  '+pre+'_border_dist = '+nm(B.bdist));
      L.push('  '+pre+'_border_radius = '+nm(B.brad));
      if(Math.abs(B.bdxy-1)>1e-4) L.push('  '+pre+'_border_deform_xy = '+nm(B.bdxy)); }
    if(B.deform>1e-3) L.push('  '+pre+'_deform = '+nm(B.deform));
  };
  L.push('RadiationModel'); L.push('{'); L.push('  name = nsCustom');
  belt(I,'inner'); belt(O,'outer');
  L.push('  has_pause = '+(P.on?'true':'false'));
  if(P.on){ L.push('  pause_radius = '+nm(P.rad));
    if(Math.abs(P.comp-1)>1e-4) L.push('  pause_compression = '+nm(P.comp));
    if(Math.abs(P.ext-1)>1e-4) L.push('  pause_extension = '+nm(P.ext));
    if(Math.abs(P.hscale-1)>1e-4) L.push('  pause_height_scale = '+nm(P.hscale));
    if(P.deform>1e-3) L.push('  pause_deform = '+nm(P.deform));
    if(Math.abs((P.dscale==null?1:P.dscale)-1)>1e-3) L.push('// ⚗ pause_deform_scale '+nm(P.dscale)+' 는 스톡 Kerbalism이 소비하지 않는다(파수 5/7/6 하드코딩) → 자기권계면 플러그인 대기'); }
  L.push('}');
  L.push('RadiationBody'); L.push('{'); L.push('  name = <BodyName>'); L.push('  radiation_model = nsCustom');
  if(I.on){ L.push('  radiation_inner = '+nm(I.radiation));
    if(Math.abs(I.grad-3.3)>1e-4) L.push('  radiation_inner_gradient = '+nm(I.grad)); }
  if(O.on){ L.push('  radiation_outer = '+nm(O.radiation));
    if(Math.abs(O.grad-2.2)>1e-4) L.push('  radiation_outer_gradient = '+nm(O.grad)); }
  if(P.on) L.push('  radiation_pause = '+nm(P.radiation));
  const tilt=s.view.tilt; if(Math.abs(tilt)>1e-4) L.push('  geomagnetic_pole_lat = '+nm(90-tilt));
  const goff=s.view.offset||0; if(goff>1e-4) L.push('  geomagnetic_offset = '+nm(goff));
  L.push('}');
  if(P.on){ const V=state.view, fx=V.shue_r0>0, nt=pauseNoseTail(P);
    // 역산값은 smooth·waist 가 든 실제 형상에서 읽는다. α 는 방법론 Part C 의 log2(compression)
    // 인데, 일반화형에서는 compression 이 1.0 으로 은퇴하므로 형상이 주는 실효 압축비
    // rad/u_nose 를 넣는다(w=0·waist=0 이면 P.comp 로 환원 → 옛 출력과 동일).
    L.push('// Shue-native pause (KerbalismShuePause PR 채택 시): pause_nose = '+nm(fx?V.shue_r0:nt.nose)+
    ' · pause_alpha = '+nm(fx?V.shue:Math.log2(P.rad/nt.uNose))+' · pause_tail = '+nm(fx&&V.shue_L>0?V.shue_L:nt.tail)+
    (fx?' (보드 고정값)':' (pause 역산값)')); }
  return L.join('\n');
}
function copyCfg(btn){
  const txt=toCfg(), old=btn.textContent;
  const done=()=>{ btn.textContent=t('copied'); btn.classList.add('done');
    setTimeout(()=>{btn.textContent=old;btn.classList.remove('done');},1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy');done();}catch(_){} document.body.removeChild(ta);
}
let currentPreset=null;
function deepset(preset){
  const P=PRESETS[preset];
  state.inner=belt(P.inner); state.outer=belt(P.outer);
  state.pause=Object.assign({on:true,rad:15,radiation:-0.01,comp:1,ext:1,hscale:1,deform:0,dscale:1,waist:0,smooth:0,alpha:0.6},P.pause);
  state.view=Object.assign({R:8,tilt:0,z:0,shue:0,shue_r0:0,shue_L:0,shue_an:0,offset:0},P.view);
  state.moons.list=P.moons||[];   // on 은 사용자 설정이므로 프리셋을 바꿔도 유지한다
  state.orbit=P.orbit||null;
  state.pending=P.pending||null;
  // 되돌리기용 스톡 값은 세트를 얹기 전에 떠 둔다(같은 키만).
  state.pauseStock=null; pendOn=false;
  if(state.pending){
    state.pauseStock={};
    Object.keys(state.pending).forEach(k=>{ state.pauseStock[k]=state.pause[k]; });
    Object.entries(state.pending).forEach(([k,v])=>{ state.pause[k]=v; });
    pendOn=true;
  }
  labelPend();
}
function applyPreset(p,{keepZoom=false,keepSlice=false,keepShue=false}={}){
  // stock↔physical 토글은 같은 천체의 두 판본이므로 줌을 유지한다 — 프리셋 R 로 되돌리면
  // 확대해서 보던 자리를 매번 잃는다. 천체/계를 바꿀 때는 프리셋 스케일을 그대로 쓴다.
  // keepSlice 는 '현재값 초기화' 전용이다. slice_z 도 값이 아니라 보는 자리라서 유지한다.
  const prevR = keepZoom && state.view ? state.view.R : null;
  const prevZ = keepSlice && state.view ? state.view.z : null;
  // Shue 오버레이(α·r0 핀·꼬리 핀·야간 α)도 값이 아니라 탐색 상태다 — 초기화가 지우면
  // 슬라이더로 맞춰 보던 기준선을 매번 다시 세워야 한다.
  const prevS = keepShue && state.view
    ? {shue:state.view.shue, shue_r0:state.view.shue_r0,
       shue_L:state.view.shue_L, shue_an:state.view.shue_an} : null;
  currentPreset=p; deepset(p);
  if(prevR) state.view.R=prevR;
  if(prevZ!==null) state.view.z=prevZ;
  if(prevS) Object.assign(state.view, prevS);
  syncControls();
  const meta=PRESETS[p];
  if(meta && typeof curBody!=='undefined'){
    curBody=meta.body_key||p; curVar=meta.variant||'only';
    if(meta.sys && meta.sys!==curSys){ curSys=meta.sys; buildBodies(); }
    if(typeof labelPicker==='function') labelPicker();
  }
  scheduleRender();
}

// ---- rendering ----
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const ro=document.getElementById('ro');
// SZ = SDF 를 계산하는 래스터 해상도(픽셀당 한 번 평가하므로 비용 지배).
// CW = CSS 상 캔버스 크기, DPR = 디스플레이 배율. 백스토어는 CW×DPR 로 잡고 오버레이(눈금·글자·
// 곡선)는 그 해상도로 그린다. 래스터만 오프스크린에서 확대 합성 → 선과 글자가 선명해진다.
let SZ=560, CW=420, DPR=1, img=null, rasterCv=null, rasterCtx=null;
function resize(){
  CW=Math.max(240,Math.round(cv.clientWidth||420));
  DPR=Math.min(window.devicePixelRatio||1,2);
  SZ=Math.max(320,Math.min(720,Math.round(CW*Math.min(DPR,1.5))));
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CW*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);          // 이후 좌표는 CSS 픽셀 기준
  ctx.imageSmoothingEnabled=true;
  if(!rasterCv){ rasterCv=document.createElement('canvas'); rasterCtx=rasterCv.getContext('2d'); }
  rasterCv.width=SZ; rasterCv.height=SZ;
  img=rasterCtx.createImageData(SZ,SZ); scheduleRender();
}
// 엔진 상수(Radiation.cs) — 바디 필드 누적이 끝난 뒤 배경이 더해지고, 마지막에 바닥값으로 잘린다.
// 이 두 항이 없으면 음수 radiation_pause 가 화면상 0 으로 뭉개져서 차폐가 아예 안 보인다.
const EXTERN=0.04;      // Settings.ExternRadiation 기본값 (rad/h) — 은하우주선 배경
const NOMINAL=0.0003;   // Radiation.Nominal — 최종 clamp 바닥
function doseAt(x,y){ // world coords -> {field, dose, zone}
  const v=state.view, tr=v.tilt*Math.PI/180, ca=Math.cos(tr), sa=Math.sin(tr);
  const xr=x*ca - y*sa, yr=x*sa + y*ca - (v.offset||0), z=v.z;
  let dose=0, zone=[];
  const mag=Math.sqrt(x*x+y*y+z*z);
  if(mag<1) return {dose:NaN,zone:'body',mag};
  let shield=0;   // 계면 기여만 따로 — 판독에서 배경 − 차폐 로 쪼개 보여주려고
  if(state.inner.on){ const d=torusSDF(xr,yr,z,state.inner);
    if(d<0){ dose+=clamp(state.inner.grad*(-d)/state.inner.rad,0,1)*state.inner.radiation; zone.push(t('zInner')); } }

   if(dose>1e-4){
    float dn=dose/uMaxI;
    float aS=clamp(dn*13.0*dt/uBR,0.0,0.32);
    col+=(1.0-a)*inferno(dn)*aS*1.25; a+=(1.0-a)*aS;}
   if(uPauseOn>0.5){
    float pd=pauseF(pw); // 계면은 항성정렬 (틸트 미적용)
    float shell=exp(-abs(pd)/(uBR*0.006));
    float aP2=shell*24.0*dt/uBR*pAlpha;
    col+=(1.0-a)*vec3(0.22,0.81,0.85)*aP2;
    a+=(1.0-a)*aP2*0.5;
    if(pd<0.0){float aI=1.6*dt/uBR*pAlpha;
     col+=(1.0-a)*vec3(0.045,0.075,0.13)*aI; a+=(1.0-a)*aI*0.4;}}
   if(a>0.985)break;
  }}
 vec3 bg=vec3(0.020,0.027,0.051);
 col+=(1.0-a)*bg;
 gl_FragColor=vec4(col,1.0);}`;

function glInit(){
 if(gl)return true;
 gl=cv3.getContext('webgl',{antialias:false,depth:false});
 if(!gl){ro.innerHTML=t('webgl');return false;}
 function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
 prog=gl.createProgram();
 gl.attachShader(prog,sh(gl.VERTEX_SHADER,VSH));
 gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FSH));
 gl.linkProgram(prog);
 if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
 gl.useProgram(prog);
 const buf=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,buf);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(prog,'aP');
 gl.enableVertexAttribArray(loc);
 gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 ['uRes','uYaw','uPitch','uDistCam','uTilt','uMaxI','uBR','uInnerOn','uOuterOn','uPauseOn','uOff',
  'iD','iR','iXY','iC','iE','iBD','iBR2','iBXY','iDef','iDS','iInt','iGr',
  'oD','oR','oXY','oC','oE','oBD','oBR2','oBXY','oDef','oDS','oInt','oGr',
  'pR','pC','pE','pH','pDef','pDS','pWaist','pSmooth','pAlpha'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
 return true;
}
function resize3d(){
 const dpr=Math.min(window.devicePixelRatio||1,1.5);
 const w=Math.round((cv3.clientWidth||420)*dpr);
 if(w<10)return;
 cv3.width=w; cv3.height=w;
 if(gl)gl.viewport(0,0,w,w);
}
function render3d(){
 if(!glInit())return;
 if(cv3.width<10)resize3d();
 const s=state, v=s.view;
 const maxI=Math.max(s.inner.on?s.inner.radiation:0, s.outer.on?s.outer.radiation:0, 1e-6);
 gl.uniform2f(U.uRes,cv3.width,cv3.height);
 gl.uniform1f(U.uYaw,cam.yaw); gl.uniform1f(U.uPitch,cam.pitch);
 gl.uniform1f(U.uDistCam,v.R*2.6); gl.uniform1f(U.uBR,v.R*1.5);
 gl.uniform1f(U.uTilt,v.tilt); gl.uniform1f(U.uMaxI,maxI); gl.uniform1f(U.uOff,v.offset||0);
 gl.uniform1f(U.uInnerOn,s.inner.on?1:0);
 gl.uniform1f(U.uOuterOn,s.outer.on?1:0);
 gl.uniform1f(U.uPauseOn,s.pause.on?1:0);
 const I=s.inner,O=s.outer,P=s.pause;
 gl.uniform1f(U.iD,I.dist);gl.uniform1f(U.iR,I.rad);gl.uniform1f(U.iXY,I.dxy);
 gl.uniform1f(U.iC,I.comp);gl.uniform1f(U.iE,I.ext);gl.uniform1f(U.iBD,I.bdist);
 gl.uniform1f(U.iBR2,I.brad);gl.uniform1f(U.iBXY,I.bdxy);gl.uniform1f(U.iDef,I.deform);gl.uniform1f(U.iDS,I.dscale==null?1:I.dscale);
 gl.uniform1f(U.iInt,I.radiation);gl.uniform1f(U.iGr,I.grad);
 gl.uniform1f(U.oD,O.dist);gl.uniform1f(U.oR,O.rad);gl.uniform1f(U.oXY,O.dxy);
 gl.uniform1f(U.oC,O.comp);gl.uniform1f(U.oE,O.ext);gl.uniform1f(U.oBD,O.bdist);
 gl.uniform1f(U.oBR2,O.brad);gl.uniform1f(U.oBXY,O.bdxy);gl.uniform1f(U.oDef,O.deform);gl.uniform1f(U.oDS,O.dscale==null?1:O.dscale);
 gl.uniform1f(U.oInt,O.radiation);gl.uniform1f(U.oGr,O.grad);
 gl.uniform1f(U.pR,P.rad);gl.uniform1f(U.pC,P.comp);gl.uniform1f(U.pE,P.ext);
 gl.uniform1f(U.pH,P.hscale);gl.uniform1f(U.pDef,P.deform);gl.uniform1f(U.pDS,P.dscale==null?1:P.dscale);
 gl.uniform1f(U.pWaist,P.waist||0);gl.uniform1f(U.pSmooth,P.smooth||0);gl.uniform1f(U.pAlpha,P.alpha!=null?P.alpha:0.6);
 gl.drawArrays(gl.TRIANGLES,0,3);
 document.getElementById('scaleHi').textContent=fmt(maxI);
}

let drag=null;

 cam.yaw -= (e.clientX-drag.x)*0.008;

const SYS_ORDER=['sol','alpha_centauri','proxima_cen','demo'];
const sysTabs=document.getElementById('sysTabs'), bodyBtns=document.getElementById('bodyBtns'),
      variantSeg=document.getElementById('variantSeg');
const BY_SYS={}, BY_BODY={};
Object.entries(PRESETS).forEach(([k,p])=>{
  (BY_SYS[p.sys||p.group]??=[]).push(k);
  (BY_BODY[p.body_key||k]??={})[p.variant||'only']=k;
});
const SYS_LIST=SYS_ORDER.filter(g=>BY_SYS[g]).concat(Object.keys(BY_SYS).filter(g=>!SYS_ORDER.includes(g)));
let curSys=SYS_LIST[0], curBody=null, curVar='phys';

function bodiesOf(sys){                      // 계 안의 천체 목록(중복 제거, 모행성 → 위성 순)
  const seen=[], out=[];
  BY_SYS[sys].forEach(k=>{ const b=PRESETS[k].body_key||k; if(!seen.includes(b)){seen.push(b); out.push(b);} });
  return out.sort((a,b)=>(PRESETS[BY_BODY[a][Object.keys(BY_BODY[a])[0]]].depth||0)
                        -(PRESETS[BY_BODY[b][Object.keys(BY_BODY[b])[0]]].depth||0));
}
function presetFor(body,variant){
  const v=BY_BODY[body]; return v[variant] || v.phys || v.only || v[Object.keys(v)[0]];
}
function anyPreset(body){ const v=BY_BODY[body]; return PRESETS[v[Object.keys(v)[0]]]; }
function nameOf(p){ return (lang==='en'&&p.label_en)?p.label_en:(p.label||''); }

function buildTabs(){
  sysTabs.innerHTML='';
  SYS_LIST.forEach(g=>{
    const b=document.createElement('button'); b.dataset.sys=g; b.type='button';
    b.setAttribute('role','tab'); b.setAttribute('aria-selected', String(g===curSys));
    b.tabIndex = g===curSys ? 0 : -1;
    sysTabs.appendChild(b);
  });
}
function buildBodies(){
  bodyBtns.innerHTML='';
  bodiesOf(curSys).forEach(bk=>{
    const p=anyPreset(bk), b=document.createElement('button'); b.type='button'; b.dataset.body=bk;
    if(p.depth) b.innerHTML='<span class="moon" aria-hidden="true">└</span>';
    b.appendChild(document.createTextNode(''));
    if(p.desig) b.title=p.desig;
    b.setAttribute('aria-pressed', String(bk===curBody));
    bodyBtns.appendChild(b);
  });
  labelPicker();
}
function labelPicker(){
  sysTabs.querySelectorAll('button').forEach(b=>{
    const p=PRESETS[BY_SYS[b.dataset.sys][0]];
    b.textContent=(lang==='en'&&p.sys_label_en)?p.sys_label_en:(p.sys_label||b.dataset.sys);
    b.setAttribute('aria-selected', String(b.dataset.sys===curSys));
    b.tabIndex = b.dataset.sys===curSys ? 0 : -1;
  });
  bodyBtns.querySelectorAll('button').forEach(b=>{
    const p=anyPreset(b.dataset.body), txt=nameOf(p);
    b.lastChild.nodeValue=txt;
    b.setAttribute('aria-pressed', String(b.dataset.body===curBody));
  });
  variantSeg.querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on', b.dataset.var===curVar);
    b.textContent=t(b.dataset.l);
  });
}
function selectBody(bk,{keepVariant=true}={}){
  curBody=bk;
  const v=BY_BODY[bk], hasBoth = v.stock && v.phys;
  variantSeg.hidden=!hasBoth;
  if(!hasBoth) curVar='only';
  else if(!keepVariant || !v[curVar]) curVar='phys';
  applyPreset(presetFor(bk,curVar));
  labelPicker();
}
function selectSys(g){
  curSys=g; buildBodies(); selectBody(bodiesOf(g)[0]);
}
