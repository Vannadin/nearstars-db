<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const P = JSON.parse(document.getElementById('params').textContent);
const DEG = Math.PI / 180;
const XHAT = new THREE.Vector3(1, 0, 0);

/* 좌표계: +X = 태양 방향(태양풍은 −X 로 분다), +Y = 궤도면 법선, +Z = 공전 진행 방향.
   길이 단위 = 행성 반지름 1개. 두 세계는 Y 로 떨어뜨려 같은 카메라로 비교한다. */

/* ── renderer / scene ─────────────────────────────────────────────────── */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06070a);
const camera = new THREE.PerspectiveCamera(42, 1, 0.4, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 1600;

scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.15);
sunLight.position.set(1, 0.3, 0.25);
scene.add(sunLight);

/* ── helpers ──────────────────────────────────────────────────────────── */
function shueR(r0, alpha, th) { return r0 * Math.pow(2 / (1 + Math.cos(th)), alpha); }

function shueTheta(r0, alpha, rmax) {          // r(θ) 를 뒤집어 원하는 반경의 θ 를 얻는다
  const k = Math.pow(rmax / r0, 1 / alpha);
  return Math.acos(Math.max(-0.9995, Math.min(1, 2 / k - 1)));
}

function spinAxis(obliqDeg) {                   // 자전축: 자전축경사만큼 태양 쪽으로 기울인다
  const t = obliqDeg * DEG;
  return new THREE.Vector3(Math.sin(t), Math.cos(t), 0).normalize();
}

function perpBasis(u) {                         // u 에 수직인 정규직교 두 벡터
  const a = Math.abs(u.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1);
  const e1 = new THREE.Vector3().crossVectors(a, u).normalize();
  const e2 = new THREE.Vector3().crossVectors(u, e1).normalize();
  return [e1, e2];
}

function rotX(v, ang) {                         // X 축 둘레 회전 (꼬리 나선 비틀림에 쓴다)
  const c = Math.cos(ang), s = Math.sin(ang);
  return new THREE.Vector3(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
}

function mkLine(n, color, opacity = 1, dashed = false) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const m = dashed
    ? new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 1.4, gapSize: 1.1 })
    : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const l = new THREE.Line(g, m);
  l.frustumCulled = false;
  l.userData.cap = n;
  return l;
}

function setLine(line, pts) {
  const a = line.geometry.attributes.position;
  const n = Math.min(pts.length, line.userData.cap);
  for (let i = 0; i < n; i++) a.setXYZ(i, pts[i].x, pts[i].y, pts[i].z);
  a.needsUpdate = true;
  line.geometry.setDrawRange(0, n);
}

/* ── magnetopause (Shue) ──────────────────────────────────────────────── */
function shueSurface(r0, alpha, thMax, color) {
  const nT = 46, nP = 60, pos = [], idx = [];
  for (let i = 0; i <= nT; i++) {
    const th = thMax * i / nT, r = shueR(r0, alpha, th);
    for (let j = 0; j <= nP; j++) {
      const ph = 2 * Math.PI * j / nP;
      pos.push(r * Math.cos(th), r * Math.sin(th) * Math.cos(ph), r * Math.sin(th) * Math.sin(ph));
    }
  }
  for (let i = 0; i < nT; i++) {
    for (let j = 0; j < nP; j++) {
      const a = i * (nP + 1) + j, b = a + nP + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.075, side: THREE.DoubleSide, depthWrite: false
  }));
  const grp = new THREE.Group();
  grp.add(mesh);
  // 경선 + 위선 골격 (면만 있으면 형태가 안 읽힌다)
  const wire = new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.30 }));
  const seg = [];
  const push = (th, ph) => {
    const r = shueR(r0, alpha, th);
    seg.push(r * Math.cos(th), r * Math.sin(th) * Math.cos(ph), r * Math.sin(th) * Math.sin(ph));
  };
  for (let m = 0; m < 12; m++) {                      // 경선
    const ph = 2 * Math.PI * m / 12;
    for (let i = 0; i < nT; i++) { push(thMax * i / nT, ph); push(thMax * (i + 1) / nT, ph); }
  }
  for (const th of [45 * DEG, 90 * DEG, 120 * DEG, thMax * 0.999]) {  // 위선
    for (let j = 0; j < nP; j++) { push(th, 2 * Math.PI * j / nP); push(th, 2 * Math.PI * (j + 1) / nP); }
  }
  wire.geometry.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
  wire.frustumCulled = false;
  grp.add(wire);
  return grp;
}

/* ── one world (Earth or Uranus) ──────────────────────────────────────── */
const LABELS = [];
function addLabel(world, key, getPos, cls) {
  const el = document.createElement('div');
  el.className = 'lbl' + (cls ? ' ' + cls : '');
  document.getElementById('labels').appendChild(el);
  const rec = { el, world, getPos, key };
  LABELS.push(rec);
  return rec;
}

function makeWorld(cfg, yOffset) {
  const g = new THREE.Group();
  g.position.set(0, yOffset, 0);
  scene.add(g);

  const u = spinAxis(cfg.obliquity);
  const [e1, e2] = perpBasis(u);
  const tilt = cfg.dipole_tilt * DEG;
  const thMax = shueTheta(cfg.r0, cfg.alpha, cfg.tail_len);
  const flank = cfg.r0 * Math.pow(2, cfg.alpha);        // θ = 90° 단말자 반경
  const axLen = Math.max(9, cfg.r0 * 0.75);

  const w = { cfg, g, u, e1, e2, tilt, thMax, flank, axLen, phase: 0 };

  /* 행성 (실제 반지름 = 1 단위) */
  const planet = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32),
    new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.9, metalness: 0.02 }));
  g.add(planet);

  /* 자전축 */
  const spin = mkLine(2, 0xffd479, 0.95);
  setLine(spin, [u.clone().multiplyScalar(-axLen), u.clone().multiplyScalar(axLen)]);
  g.add(spin);
  const spinTip = new THREE.Mesh(new THREE.ConeGeometry(axLen * 0.045, axLen * 0.14, 16),
    new THREE.MeshBasicMaterial({ color: 0xffd479 }));
  spinTip.position.copy(u.clone().multiplyScalar(axLen));
  spinTip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), u);
  g.add(spinTip);

  /* 쌍극자축이 자전축 둘레로 그리는 원뿔 + 그 궤적 원 */
  const coneGrp = new THREE.Group(); g.add(coneGrp);
  for (const sgn of [1, -1]) {
    const h = axLen * 0.82 * Math.cos(tilt), rad = axLen * 0.82 * Math.sin(tilt);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(Math.abs(rad), Math.abs(h), 40, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xff7ad0, transparent: true, opacity: 0.085,
        side: THREE.DoubleSide, depthWrite: false }));
    cone.geometry.translate(0, -Math.abs(h) / 2, 0);    // 꼭짓점을 원점으로 (몸통은 −Y 쪽)
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), u.clone().multiplyScalar(sgn));
    coneGrp.add(cone);
    const ring = mkLine(65, 0xff7ad0, 0.55);
    const pts = [];
    for (let i = 0; i <= 64; i++) {
      const t = 2 * Math.PI * i / 64;
      pts.push(u.clone().multiplyScalar(sgn * axLen * 0.82 * Math.cos(tilt))
        .addScaledVector(e1, sgn * axLen * 0.82 * Math.sin(tilt) * Math.cos(t))
        .addScaledVector(e2, sgn * axLen * 0.82 * Math.sin(tilt) * Math.sin(t)));
    }
    setLine(ring, pts);
    coneGrp.add(ring);
  }

  /* 쌍극자축 자체 + 중심 이탈 표시 (원뿔을 꺼도 축은 남는다) */
  const dipGrp = new THREE.Group(); g.add(dipGrp);
  const dipLine = mkLine(2, 0xff7ad0, 1); dipGrp.add(dipLine);
  const dipTip = new THREE.Mesh(new THREE.SphereGeometry(axLen * 0.035, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xff7ad0 }));
  dipGrp.add(dipTip);
  const offLine = mkLine(2, 0xffffff, 0.8); dipGrp.add(offLine);
  const offDot = new THREE.Mesh(new THREE.SphereGeometry(0.10, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0xffffff }));
  dipGrp.add(offDot);

  /* 닫힌 쌍극자 자기력선 (안쪽) */
  const fieldGrp = new THREE.Group(); g.add(fieldGrp);
  const loops = [];
  for (const L of [3, 6]) {
    for (const psi of [0, Math.PI / 2]) {
      const ln = mkLine(121, 0x9be7ff, 0.5);
      fieldGrp.add(ln);
      loops.push({ ln, L, psi });
    }
  }

  /* 자기꼬리: 전류층 리본 + 나선 자기력선 */
  const nS = 44, stations = [];
  for (let i = 0; i < nS; i++) {
    const th = (92 * DEG) + (thMax - 92 * DEG) * i / (nS - 1);
    const r = shueR(cfg.r0, cfg.alpha, th);
    stations.push({ x: r * Math.cos(th), rho: r * Math.sin(th) });
  }
  const ribbonGeo = new THREE.BufferGeometry();
  ribbonGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nS * 2 * 3), 3));
  const rIdx = [];
  for (let i = 0; i < nS - 1; i++) {
    const a = i * 2;
    rIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  ribbonGeo.setIndex(rIdx);
  const ribbon = new THREE.Mesh(ribbonGeo, new THREE.MeshBasicMaterial({
    color: 0x9be7ff, transparent: true, opacity: 0.20, side: THREE.DoubleSide, depthWrite: false
  }));
  ribbon.frustumCulled = false;
  fieldGrp.add(ribbon);
  const ribbonEdge = [mkLine(nS, 0x9be7ff, 0.75), mkLine(nS, 0x9be7ff, 0.75)];
  ribbonEdge.forEach(l => fieldGrp.add(l));
  // 로브(±n) 와 측면(±p) 을 따라가는 네 가닥 — 천왕성에서는 비틀린다
  const helix = [];
  for (const spec of [{ dir: 'n', s: 1, f: 0.55 }, { dir: 'n', s: -1, f: 0.55 },
                      { dir: 'p', s: 1, f: 0.86 }, { dir: 'p', s: -1, f: 0.86 }]) {
    const ln = mkLine(nS, spec.dir === 'n' ? 0x9be7ff : 0x6fd0ff, 0.8);
    fieldGrp.add(ln);
    helix.push({ ln, ...spec });
  }

  /* 태양풍 흐름 화살표 */
  const windGrp = new THREE.Group(); g.add(windGrp);
  const wx = cfg.r0 + Math.max(14, cfg.r0 * 0.9);
  for (const [dy, dz] of [[0, 0], [flank * 0.75, 0], [-flank * 0.75, 0], [0, flank * 0.75], [0, -flank * 0.75]]) {
    const a = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0),
      new THREE.Vector3(wx, dy, dz), Math.max(10, cfg.r0 * 0.55), 0xffb066, 3.0, 1.8);
    a.line.material.transparent = true; a.line.material.opacity = 0.75;
    a.cone.material.transparent = true; a.cone.material.opacity = 0.75;
    windGrp.add(a);
  }

  /* 마커: 보이저 2호가 본 플라스모이드 (천왕성만) */
  if (cfg.plasmoid) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.9 }));
    m.position.set(-cfg.plasmoid, 0, 0);
    g.add(m);
    w.plasmoidMesh = m;
  }

  /* 자기권계면 */
  const pause = shueSurface(cfg.r0, cfg.alpha, thMax, 0x7aa8ff);
  g.add(pause);

  Object.assign(w, { planet, spin, spinTip, coneGrp, dipGrp, dipLine, dipTip, offLine, offDot,
    fieldGrp, loops, stations, ribbon, ribbonEdge, helix, windGrp, pause, nS });

  /* 라벨 */
  const wp = v => g.localToWorld(v.clone());
  addLabel(w, 'name', () => wp(new THREE.Vector3(0, -axLen * 0.30, 0)));
  addLabel(w, 'spin', () => wp(u.clone().multiplyScalar(axLen * 1.06)), 'sm');
  addLabel(w, 'dip', () => wp(w.dipEnd ? w.dipEnd.clone().multiplyScalar(1.08) : new THREE.Vector3()), 'sm');
  addLabel(w, 'flank', () => wp(new THREE.Vector3(0, 0, flank)), 'sm');
  addLabel(w, 'nose', () => wp(new THREE.Vector3(cfg.r0, 0, 0)), 'sm');
  addLabel(w, 'sheet', () => wp(new THREE.Vector3(-cfg.tail_len * 0.62, 0, 0)), 'sm');
  addLabel(w, 'wind', () => wp(new THREE.Vector3(wx + Math.max(10, cfg.r0 * 0.55) + 3, 0, 0)), 'sm');
  if (cfg.plasmoid) addLabel(w, 'plasmoid', () => wp(new THREE.Vector3(-cfg.plasmoid, 4, 0)), 'sm');

  return w;
}

/* 한 프레임의 위상(0..1)을 세계에 반영 */
function updateWorld(w, f) {
  const c = w.cfg, phi = 2 * Math.PI * f;
  const d = w.u.clone().multiplyScalar(Math.cos(w.tilt))
    .addScaledVector(w.e1, Math.sin(w.tilt) * Math.cos(phi))
    .addScaledVector(w.e2, Math.sin(w.tilt) * Math.sin(phi)).normalize();
  w.dipDir = d;

  // 자전에 따라 행성 자체도 돈다
  w.planet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), w.u);
  w.planet.rotateY(phi);

  // 쌍극자 중심은 자기축을 따라 offset 만큼 밀려 있다 (Kopernicus geomagnetic_offset 정의)
  const ctr = d.clone().multiplyScalar(-c.offset);
  const L = w.axLen * 0.82;
  const end = ctr.clone().addScaledVector(d, L);
  w.dipEnd = end;
  setLine(w.dipLine, [ctr.clone().addScaledVector(d, -L), end]);
  w.dipTip.position.copy(end);
  setLine(w.offLine, [new THREE.Vector3(0, 0, 0), ctr]);
  w.offDot.position.copy(ctr);

  // 닫힌 자기력선: 쌍극자 좌표계(축 = +Y)에서 r = L cos²λ
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  for (const lp of w.loops) {
    const pts = [];
    for (let i = 0; i <= 120; i++) {
      const lam = -Math.PI / 2 + Math.PI * i / 120;
      const r = lp.L * Math.cos(lam) * Math.cos(lam);
      const v = new THREE.Vector3(r * Math.cos(lam) * Math.cos(lp.psi), r * Math.sin(lam),
        r * Math.cos(lam) * Math.sin(lp.psi));
      pts.push(v.applyQuaternion(q).add(ctr));
    }
    setLine(lp.ln, pts);
  }

  // 꼬리: 전류층 법선 n = 태양-행성선에 수직인 쌍극자 성분
  const n = new THREE.Vector3(0, d.y, d.z);
  if (n.lengthSq() < 1e-8) n.set(0, 1, 0);
  n.normalize();
  const p = new THREE.Vector3().crossVectors(n, XHAT).normalize();   // 전류층이 뻗는 방향
  const tanPitch = Math.tan(c.pitch * DEG);
  const x0 = w.stations[0].x;
  const pos = w.ribbon.geometry.attributes.position;
  const eA = [], eB = [];
  for (let i = 0; i < w.nS; i++) {
    const s = w.stations[i];
    const tw = tanPitch * (x0 - s.x) / w.flank;      // 하류로 갈수록 감기는 나선 (pitch 각)
    const pr = rotX(p, tw);
    const half = s.rho * 0.92;
    const a = new THREE.Vector3(s.x, pr.y * half, pr.z * half);
    const b = new THREE.Vector3(s.x, -pr.y * half, -pr.z * half);
    pos.setXYZ(i * 2, a.x, a.y, a.z);
    pos.setXYZ(i * 2 + 1, b.x, b.y, b.z);
    eA.push(a); eB.push(b);
  }
  pos.needsUpdate = true;
  setLine(w.ribbonEdge[0], eA);
  setLine(w.ribbonEdge[1], eB);

  for (const h of w.helix) {
    const pts = [];
    for (let i = 0; i < w.nS; i++) {
      const s = w.stations[i];
      const tw = tanPitch * (x0 - s.x) / w.flank;
      const base = h.dir === 'n' ? n : p;
      const v = rotX(base, tw).multiplyScalar(h.s * s.rho * h.f);
      pts.push(new THREE.Vector3(s.x, v.y, v.z));
    }
    setLine(h.ln, pts);
  }
}

/* ── caption table + refs ─────────────────────────────────────────────── */
function buildCaption() {
  const rows = [
    ['rObl', '23.4°', '97.8°'],
    ['rPole', t('poleE'), t('poleU')],
    ['rTilt', '11°', '59°'],
    ['rOff', '0.08 R_E', '0.3 R_U'],
    ['rR0', '10 R_E', '18 R_U'],
    ['rAlpha', '0.58', '0.58'],
    ['rFlank', '14.95 R_E', '26.9 R_U'],
    ['rPer', '23.93 h', '17.24 h'],
    ['rPitch', t('none'), '5.5 ± 3.0°'],
  ];
  let html = `<tr><th>${t('thProp')}</th><th>${t('thEarth')}</th><th>${t('thUranus')}</th></tr>`;
  for (const [k, a, b] of rows) html += `<tr><td>${t(k)}</td><td>${a}</td><td>${b}</td></tr>`;
  document.getElementById('capTable').innerHTML = html;

  const list = document.getElementById('capRefList');
  list.innerHTML = P.refs.map(r =>
    `<li>${r[lang === 'ko' ? 'ko' : 'en']} — <a href="https://ui.adsabs.harvard.edu/abs/${r.bibcode}"
      target="_blank" rel="noopener"><code>${r.bibcode}</code></a></li>`).join('');
}

/* ── i18n apply ───────────────────────────────────────────────────────── */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (STR[lang][k] !== undefined) el.textContent = STR[lang][k];
  });
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  // 한국어일 때만 영어 요약 줄을 보인다 (영어 모드에서는 중복)
  document.querySelectorAll('#capBody .en').forEach(el => {
    el.style.display = (lang === 'ko' && el.textContent) ? '' : 'none';
  });
  buildCaption();
  labelText();
}

function labelText() {
  for (const rec of LABELS) {
    const suf = rec.world === earth ? 'Earth' : 'Uranus';
    let s;
    if (rec.key === 'name') s = '<b>' + t('name' + suf) + '</b>';
    else if (rec.key === 'wind') s = t('wind');
    else if (rec.key === 'plasmoid') s = t('plasmoid');
    else s = t(rec.key + suf);
    rec.el.innerHTML = s;
  }
}

/* ── controls wiring ──────────────────────────────────────────────────── */
const phaseEl = document.getElementById('phase');
const playBtn = document.getElementById('playBtn');

playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '⏸' : '▶'; };
document.getElementById('resetBtn').onclick = () => { frac = 0; phaseEl.value = 0; };
phaseEl.oninput = () => { frac = (+phaseEl.value) / 360; playing = false; playBtn.textContent = '▶'; };

document.getElementById('sceneSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-scene]'); if (!b) return;
  sceneMode = b.dataset.scene;
  document.querySelectorAll('#sceneSeg button').forEach(x => x.classList.toggle('on', x.dataset.scene === sceneMode));
  earth.g.visible = sceneMode !== 'uranus';
  uranus.g.visible = sceneMode !== 'earth';
  frameView(false);
});
document.getElementById('langSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if (!b) return;
  lang = b.dataset.lang; localStorage.setItem('nearstars-lang', lang); applyLang();
});

const CHK = { cPause: 'pause', cCone: 'cone', cField: 'field', cWind: 'wind', cLabels: 'labels' };
for (const [id, key] of Object.entries(CHK)) {
  const el = document.getElementById(id);
  el.onchange = () => {
    show[key] = el.checked;
    for (const w of WORLDS) {
      w.pause.visible = show.pause;
      w.coneGrp.visible = show.cone;
      w.fieldGrp.visible = show.field;
      w.windGrp.visible = show.wind;
    }
  };
}

document.getElementById('capHead').onclick = () => {
  const c = document.getElementById('caption');
  c.classList.toggle('collapsed');
  document.getElementById('capArrow').textContent = c.classList.contains('collapsed') ? '▸' : '▾';
};

function frameView(close) {
  // 근접 시점은 한 세계만 본다 (나란히 보기에서 누르면 천왕성으로)
  const which = sceneMode === 'earth' ? earth : (sceneMode === 'uranus' || close) ? uranus : null;
  const y = which ? which.g.position.y : 0;
  const x = close ? 0 : (which ? -which.cfg.r0 * 1.1 : -20);
  controls.target.set(x, y, 0);
  const d = close ? 14 : (which ? 210 : 430);
  camera.position.copy(controls.target)
    .add(new THREE.Vector3(0.42, 0.44, 1).normalize().multiplyScalar(d));
  controls.update();
}
document.getElementById('viewWide').onclick = () => frameView(false);
document.getElementById('viewClose').onclick = () => frameView(true);

/* ── labels each frame ────────────────────────────────────────────────── */
const _v = new THREE.Vector3();
function updateLabels() {
  const W = renderer.domElement.clientWidth, H = renderer.domElement.clientHeight;
  for (const rec of LABELS) {
    if (!show.labels || !rec.world.g.visible) { rec.el.style.display = 'none'; continue; }
    _v.copy(rec.getPos()).project(camera);
    if (_v.z > 1 || _v.x < -1.25 || _v.x > 1.25 || _v.y < -1.25 || _v.y > 1.25) {
      rec.el.style.display = 'none'; continue;
    }
    rec.el.style.display = '';
    rec.el.style.left = ((_v.x * 0.5 + 0.5) * W) + 'px';
    rec.el.style.top = ((-_v.y * 0.5 + 0.5) * H) + 'px';
  }
}

/* ── readouts ─────────────────────────────────────────────────────────── */
const rPhase = document.getElementById('readPhase');
const rEarth = document.getElementById('readEarth');
const rUranus = document.getElementById('readUranus');
function readouts() {
  const deg = Math.round(frac * 360) % 360;
  rPhase.innerHTML = `${t('phase')} φ = <b>${deg}°</b>`;
  rEarth.innerHTML = `${t('nameEarth')} <b>${(frac * P.earth.period).toFixed(1)}</b> / ${P.earth.period} ${t('hr')}`;
  rUranus.innerHTML = `${t('nameUranus')} <b>${(frac * P.uranus.period).toFixed(1)}</b> / ${P.uranus.period} ${t('hr')}`;
}

/* ── resize / loop ────────────────────────────────────────────────────── */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) {
    frac = (frac + dt / P.anim_seconds_per_rotation) % 1;
    phaseEl.value = Math.round(frac * 360) % 360;
  }
  for (const w of WORLDS) if (w.g.visible) updateWorld(w, frac);
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  readouts();
  requestAnimationFrame(loop);
}

/* ── init ─────────────────────────────────────────────────────────────── */
document.querySelectorAll('#sceneSeg button').forEach(x => x.classList.toggle('on', x.dataset.scene === sceneMode));
applyLang();
resize();
frameView(false);
requestAnimationFrame(loop);
</script>
</body>
</html>
