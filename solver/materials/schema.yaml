# 물질 기록 스키마 — 한 물질 = 한 데이터 시트의 닫힌 키 목록: 상 · 상태방정식 · 열 세트 · 안정 영역 · 창 · 가장자리 · 출처 · 검산 (phase-2 D-M1, D-M2)
# Every key a material record (`solver/materials/<id>.yaml`) may carry. A key not listed here is a load STOP by
# name (material.unknown_key). Frozen design: rewrite/phase2-design.frozen.md D-M1, D-M2, D-P1, D-P3, §I, with
# post-freeze note 1 item 3 (the citation rule); registration rewrite/phase2-impl.frozen.md P1, P2 and note 1.
#
# shape:    as the body schema (solver/data/schema.yaml): number | text | enum | mapping | list | record | constant.
#           `constant` is a sourced number: {value, unit, source, grade, [cites], [printed], [conversion], [note]}.
# required: the key must be present; absence is a load STOP (material.missing_key).
version: 1

kinds: [single, branched, assemblage, hand_over]         # D-P1

record:
  id:              {shape: text, required: true}          # = the file's stem; the registry key
  label:           {shape: text, required: true}
  kind:            {shape: enum, values: [single, branched, assemblage, hand_over], required: true}
  system:          {shape: text, required: true}          # the composition system a layer declares (R-LAYERGEN-1)
  fit_composition: {shape: text, required: true}          # the composition the record was fitted to (the C58 field)
  role_hint:       {shape: enum, values: [core, mantle, ice, envelope, any]}   # the old `role`; core_gamma's guard
  phases:          {shape: list, of: phase, required: true, min: 1}
  boundaries:      {shape: list, of: boundary}             # branched: chain = one per adjacent pair; field = touching fields
  choice:          {shape: enum, values: [chain, field]}   # branched: how the phase at (P, T) is chosen (impl note 6)
  triple_points:   {shape: list, of: triple_point}         # field: mixed triple points, as printed (impl note 6 item 4)
  field_probe:     {shape: record, of: sampling}           # field: the grid P4 walks for overlaps and gaps (note 6 item 5)
  refusals:        {shape: list, of: refusal_region}       # declared refusal regions (frozen P6: a region with no cached
                                                           # source is a named refusal); they win over every field
  joins:           {shape: list, of: join}                 # hand_over: required (D-P1, r2 N7)
  formula_checks:  {shape: list, of: formula_check, required: true, min: 1}
  note:            {shape: text}

phase:
  id:          {shape: text, required: true}
  label:       {shape: text}
  state:       {shape: enum, values: [solid, liquid, fluid, mixed], required: true}
  eos:         {shape: record, of: eos, required: true}
  thermal:     {shape: record, of: thermal, required: true}
  field:       {shape: record, of: field, required: true}  # D-M2: every phase, single records included (r2 B6)
  window:      {shape: record, of: box, required: true}    # the EOS validity window
  edges:       {shape: record, of: edges, required: true}  # behaviour where the field passes the window (D-M2)
  porosity:    {shape: record, of: porosity}
  sources:     {shape: list, of: source_entry}           # impl note 3 A8: each source the phase reads, with its data range
  joins_within: {shape: list, of: join_within}          # impl notes 3 A4–A5, 4: blend / taper / seam / cross_check
  precedence:  {shape: record, of: precedence}           # impl note 4 item 3: fixed before any comparison

eos:
  form:      {shape: enum, values: [bm2, bme3, vinet, library, table, evaluator], required: true}   # bme4: not built
  evaluator: {shape: record, of: evaluator}                # form evaluator only: a potential gives ρ and its derivatives
                                                           # (French & Redmer 2015); no sets, no gamma_window, as library
  params:    {shape: mapping, of: constant}                # bm2/bme3/vinet: rho0, k0, [k0p]; each a constant
  reference: {shape: record, of: reference, required: true}
  library:   {shape: record, of: library}                  # form library only (SeaFreeze, owner db20e171 (b)); γ and
                                                           # dT/dP then come from the library: no sets, no gamma_window
  table:     {shape: record, of: table}                    # form table only (impl note 3 B1, note 4 item 5)

# A direct table (impl note 3 B1–B3, note 4 item 5). Its edges are its window; outside it the record refuses.
table:
  axes:          {shape: enum, values: [P_T, rho_T], required: true}
  first:         {shape: list, required: true}             # P [Pa] or ρ [kg/m³] nodes, increasing
  t:             {shape: list, required: true}             # T [K] nodes, increasing
  columns:       {shape: mapping, required: true}          # name → rows over (first × t): rho or P, and alpha, c_p, k_t where given
  interpolation: {shape: enum, values: [bilinear_lnp_t, c1], required: true}   # bilinear needs alpha and k_t columns (note 4 item 5)
  maxwell_tolerance: {shape: number}                       # where the columns allow the Maxwell check (B3)
  alpha_range:   {shape: list}                             # [lo, hi] 1/K: the declared sane range for α (B3)
  source:        {shape: source, required: true}           # sourced, or {user_declared: <reason>} (B2)

reference:
  kind:  {shape: enum, values: [state, path], required: true}   # D-M1: a path is allowed (r2 N5, «PREM path»)
  p:     {shape: constant}                                   # kind state
  t:     {shape: constant}                                   # kind state
  path:  {shape: text}                                       # kind path: its name, e.g. «PREM path»; `t` is then the
                                                             # temperature the thermal model applies against (an adiabat's T_p)
  t_ref_kind: {shape: enum, values: [isotherm, adiabat]}     # how the thermal model applies against the reference
  adiabat:    {shape: record, of: reference_adiabat}         # kind path, t_ref_kind adiabat: ΔT = T − T_ref(P) from this table

# A reference adiabat as data (legacy C148: fe_prem's ΔT is measured from its own reference adiabat, not T·(1 − t_ref/T_pot)).
reference_adiabat:
  lnp:           {shape: list, required: true}               # ln(P / Pa) nodes, increasing
  t:             {shape: list, required: true}               # T_ref [K] at each node
  interpolation: {shape: enum, values: [pchip_lnp, linear_lnp], required: true}   # outside the table: the end slope, straight
  anchor:        {shape: mapping, required: true}            # where the adiabat is pinned (P, T and how)
  source:        {shape: source, required: true}             # the generator and its commit: a formula source, grade derived

library:
  name:     {shape: text, required: true}
  version:  {shape: text, required: true}
  sha256:   {shape: text, required: true}                    # the pinned distribution; checked at load (impl note 1 §6)
  submodel: {shape: text, required: true}

# Thermal sets: pressure windows over one phase, each with its own source (legacy `ThermalSet`; impl note 1 §2).
# The density path's thermal pressure reads the phase's own `pressure` block; γ and (∂P/∂T)_V read the set whose
# window holds P, else the phase's own constants. γ has its own window and never falls back to a constant (D-M2).
thermal:
  source_state:       {shape: enum, values: [solid, liquid, fluid, mixed], required: true}
  source_composition: {shape: text, required: true}
  pressure:           {shape: mapping, of: constant}         # alpha_k [Pa/K], alpha_k_dt [Pa/K²], c_v [J/kg/K]
  sets:               {shape: list, of: thermal_set}
  gamma_window:       {shape: record, of: box}             # required except for a library-form phase (registry)
  phase_constants:    {shape: record, of: constants_span}    # where the phase's own constants give γ (68 N19)
  grade:              {shape: text}                           # e.g. «solid hcp constants on a liquid-fit phase»

# Where γ comes from the phase's own `pressure` constants rather than a set (legacy: below the first set). Inside the γ
# window, the sets and this span together must cover every pressure (68 N19): no gap is filled undeclared.
constants_span:
  p_min:  {shape: number, unit: Pa, required: true}
  p_max:  {shape: number, unit: Pa, required: true}
  reason: {shape: text, required: true}

thermal_set:
  window:    {shape: record, of: box, required: true}
  source_state:       {shape: enum, values: [solid, liquid, fluid, mixed], required: true}
  source_composition: {shape: text, required: true}
  constants: {shape: mapping, of: constant}                  # alpha_k, c_v (piecewise constant)
  evaluator: {shape: record, of: evaluator}                  # a printed formula evaluated (e.g. Dorogokupets 2017)
  t_ref:     {shape: constant}                               # the set's own reference T for its ΔT (legacy ThermalSet.t_ref)
  t_ref_kind: {shape: enum, values: [isotherm, adiabat]}
  edge_above: {shape: record, of: set_edge}                # past the set's printed p_max: a band up to a stated limit
  printed_scope: {shape: record, of: printed_scope}         # the source's printed range; the set window stays inside it
  grade:     {shape: text}

printed_scope:
  p_max:  {shape: number, unit: Pa, required: true}
  source: {shape: source, required: true}

# A thermal set's upper edge (G4, directing 2026-10-10): the set and the γ window end at the source's printed scope;
# between the set's p_max and `limit` the set is evaluated with this band, the declared edge D-M2 asks for (γ never
# falls back silently); above `limit` the record refuses.
set_edge:
  band:         {shape: record, of: band, required: true}
  limit:        {shape: number, unit: Pa, required: true}
  limit_reason: {shape: text, required: true}
  refusal:      {shape: text}                              # the Stop id above `limit`; required when limit is below the
                                                           # phase window's p_max (else the phase's own p_max edge applies)

evaluator:
  name:   {shape: text, required: true}                      # the view's registered evaluator
  source: {shape: source, required: true}
  params: {shape: mapping, of: constant}                     # the printed parameters the evaluator reads, each as read

box:
  p_min: {shape: number, unit: Pa, required: true}
  p_max: {shape: number, unit: Pa, required: true}           # .inf allowed
  t_min: {shape: number, unit: K}
  t_max: {shape: number, unit: K}

# The stability field as data (D-M2). sourced: curves or a box from a source; declared: graded «declared» with a
# reason; gibbs: derived from the source's Gibbs surfaces at a library pin (SeaFreeze, impl note 1 §6).
field:
  kind:   {shape: enum, values: [sourced, declared, gibbs], required: true}
  box:    {shape: record, of: box}
  lower:  {shape: list, of: curve}                           # curves bounding the field from below / above in P
  upper:  {shape: list, of: curve}
  source: {shape: source}                                    # sourced: required
  reason: {shape: text}                                      # declared: required
  grade:  {shape: text}

curve:
  form:  {shape: enum, values: [clapeyron, scaled, table, library, ln_sum], required: true}
  p0:    {shape: constant}                                   # clapeyron: P_b(T) = p0 + slope·(T − t0)
  t0:    {shape: constant}
  slope: {shape: constant}
  p_star: {shape: constant}                                  # ln_sum: P_b(T) = p*·exp(Σ a_i (1 − θ^b_i)), θ = T/T*
  t_star: {shape: constant}                                  # (IAPWS R14-08 eqs (1)–(5), Simon-type melting lines)
  terms:  {shape: list, of: ln_term}
  t_min: {shape: constant}                                   # clapeyron, ln_sum: the printed T range; outside it the curve is
  t_max: {shape: constant}                                   # absent and a query refuses (68 N32), as a table does
  base:  {shape: text}                                       # scaled: a named curve times `factor`
  factor: {shape: constant}
  nodes: {shape: list}                                       # table: [[T, P], …] as printed
  source: {shape: source}

# One entry per window edge the field passes (D-M2). Each is a refusal or a band; neither is a load STOP.
edges:
  p_min: {shape: record, of: edge}
  p_max: {shape: record, of: edge}
  t_min: {shape: record, of: edge}
  t_max: {shape: record, of: edge}

edge:
  refusal: {shape: text}                                     # a registry id, e.g. input.material_out_of_data
  band:    {shape: record, of: band}

band:
  form:   {shape: enum, values: [relative, absolute], required: true}
  error:  {shape: number}                                   # exactly one of error / method
  method: {shape: text}                                     # an expression the checker evaluates from the record (C4 grammar)
  grade:  {shape: text, required: true}
  origin: {shape: text, required: true}                      # source or method of the error (D-M2, r2 N10)
  sampling: {shape: record, of: sampling}                    # hand-over bands: declared before measuring (c8 on rev 2)
  source: {shape: source}                                     # where the printed values a method compares against were read

sampling:
  box:  {shape: record, of: box, required: true}
  dp:   {shape: number, unit: Pa, required: true}
  dt:   {shape: number, unit: K, required: true}

boundary:
  between: {shape: list, required: true}                     # [lower-P phase id, higher-P phase id]
  kind:    {shape: enum, values: [solid_solid, melting], required: true}   # D-P3; a triple point refuses at solve
  curve:   {shape: record, of: curve, required: true}
  delta_rho: {shape: constant}                               # the per-side ruler checks the step equals this (P4)

refusal_region:
  id:     {shape: text, required: true}                    # a refusal id, e.g. input.material_out_of_data
  box:    {shape: record, of: box, required: true}
  lower:  {shape: list, of: curve}                         # the region is at P ≥ each lower curve …
  upper:  {shape: list, of: curve}                         # … and at P < each upper curve, inside the box
  reason: {shape: text, required: true}
  source: {shape: source}

triple_point:
  phases:    {shape: list, required: true}                 # the three phase ids
  unchecked: {shape: text}                                 # only when a declared refusal region holds the point: why
  p:         {shape: constant, required: true}
  t:         {shape: constant, required: true}
  tolerance: {shape: record, of: tp_tolerance, required: true}

tp_tolerance:
  dp:     {shape: number, unit: Pa, required: true}
  dt:     {shape: number, unit: K, required: true}
  reason: {shape: text, required: true}                    # set before any measurement

ln_term:
  a: {shape: constant, required: true}
  b: {shape: constant, required: true}

join:
  between: {shape: list, required: true}                     # [lower material id, upper material id]
  p:       {shape: constant, required: true}
  band:    {shape: record, of: band, required: true}

porosity:
  law:    {shape: text, required: true}
  params: {shape: mapping, of: constant}

# The citation rule (design note 1 item 3): a value's source is where it was actually read. Exactly one of
# cache / library / doi. Load checks the form only; existence and sha256 are a generated test (impl P2, P4).
source:
  cache:   {shape: text}                                     # a file name under docs/phase3/_papers/
  page:    {shape: text}                                     # printed page
  where:   {shape: text}                                     # table / equation / text anchor
  sha256:  {shape: text}                                     # of the cached file; required with cache
  library: {shape: text}                                     # name@version
  user_declared: {shape: text}                               # no source: a one-line reason; grade «declared», counted (note 3 B2)
  formula:  {shape: text}                                    # a value computed from a stated formula and inputs, e.g. Dulong–Petit
                                                             # «3R/M, R = 8.314462618 J/mol/K, M = 0.055845 kg/mol»; grade declared
  doi:     {shape: text}                                     # doi:…
  cites:   {shape: text}                                     # «A cites B»: B is never the source
  abstract_only: {shape: bool}                               # a value seen only in an abstract

constant:
  value:      {shape: number, required: true}                # SI
  unit:       {shape: text, required: true}                  # the SI unit of `value`
  source:     {shape: source, required: true}
  grade:      {shape: enum, values: [read, derived, declared, held], required: true}
  printed:    {shape: text}                                  # the value and unit as printed, when converted
  conversion: {shape: text}
  note:       {shape: text}

# Grades of a constant: read = as printed on the cited page; derived = our arithmetic on read values (stated in
# `conversion`); declared = a labelled convention with its reason in `note`; held = the cache PROVENANCE says HELD
# (route unknown), carried onto the constant (c8 item 4).

# One source a phase reads (impl note 3 A1, A3, A6.1; note 4 item 4).
source_entry:
  id:         {shape: text, required: true}
  source:     {shape: source, required: true}
  basis:      {shape: enum, values: [measured, computed], required: true}   # measured includes fits to measurements
  data_range: {shape: record, of: box, required: true}     # where the source has data; the overlap is the intersection
  data_range_where: {shape: text, required: true}          # the page/table that states the data range
  sigma:      {shape: record, of: sigma, required: true}
  sigma_kind: {shape: enum, values: [1sigma, ci68, ci90, ci95, not_applicable], required: true}   # converted to 1σ by the checker

sigma:
  kind:        {shape: enum, values: [propagated, constant, not_printed], required: true}
  from:        {shape: mapping}                            # propagated: parameter → its printed σ
  correlation: {shape: enum, values: [printed, not_printed]}   # propagated: required (note 4 item 4)
  matrix:      {shape: mapping}                            # correlation printed: the printed matrix, with `where`
  value:       {shape: number}                             # constant: relative σ of ρ
  reduction:   {shape: text}                               # constant: how a varying σ was reduced (e.g. «max over the box»)
  where:       {shape: text}                               # page/table of the printed σ, or of the statement that none is printed

join_within:
  between:     {shape: list, required: true}               # [preferred source id, other source id]
  kind:        {shape: enum, values: [blend, taper, seam, cross_check], required: true}
  overlap:     {shape: record, of: box}                    # blend / cross_check: the data-range intersection (A1)
  weight:      {shape: enum, values: [smoothstep_p]}       # blend / taper: P only (A4)
  shared_data: {shape: text}                               # with page: one source's fit includes the other's points (A3)
  k:           {shape: number}                             # 2 (A3); a different k is a recorded change
  edge_p:      {shape: number, unit: Pa}                   # taper: P_e, the measured source's data edge
  side:        {shape: enum, values: [upper, lower]}       # taper: P_e → 1.5·P_e (upper) or P_e/1.5 → P_e (lower)
  width:       {shape: record, of: taper_width}            # taper: absent = the default rule
  t_extrapolation: {shape: record, of: t_extrapolation}    # a T edge (note 4 item 1.4)
  disclosures: {shape: list}                               # cross_check: «cross-check disagrees beyond 2σ at …»

taper_width:
  p_end:       {shape: number, unit: Pa, required: true}
  reason:      {shape: text, required: true}
  declared_before_comparison: {shape: text, required: true}   # the date; the width is never chosen after seeing values

t_extrapolation:
  to:          {shape: enum, values: [field_limit], required: true}
  band_origin: {shape: text, required: true}

precedence:
  by:          {shape: enum, values: [basis, declared, frozen], required: true}   # measured over computed first (note 4 item 3); not «rule», a prose key
  declared_before_comparison: {shape: text}                # by declared: the date
  ref:         {shape: text}                               # by frozen: the frozen record that fixed it

formula_check:
  quantity:   {shape: text, required: true}                  # what is printed
  state:      {shape: mapping, required: true}               # where it is evaluated (P, T, V…)
  expected:   {shape: number, required: true}                # as printed
  unit:       {shape: text, required: true}
  tolerance:  {shape: number, required: true}
  tolerance_reason: {shape: text, required: true}
  expression: {shape: text, required: true}                  # over the stored constants, evaluated by the view
  source:     {shape: source, required: true}
  disclosed_fail: {shape: record, of: disclosed_fail}        # a known miss, printed by a cached source (directing, III–L)

# A formula check that fails by a disagreement a cached source itself prints (directing, 2026-10-11: only then). The
# suite passes it and lists the disclosure; a disclosed check that starts to pass fails the suite (stale disclosure).
disclosed_fail:
  source: {shape: source, required: true}                    # where the disagreement is printed (cache with page)
  why:    {shape: text, required: true}
