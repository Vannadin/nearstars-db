  at install by pip --require-hashes); library.sha256 is the installed package tree (material_library.tree_sha256). Windows
  are the spline knot domains at the pin ∩ the printed validity (130–500 K to 2,300 MPa, Journaux 2020 p.1; water1 ≤ 500 K).
  Below 130 K the ices refuse by name until directing rules on an extrapolation band (68 H1). Liquid above water1''s window
  and the vapour refuse by name until IAPWS-IF97 lands (owner-direction 2026-10-11, scope change). Any icy column crossing
  ~2.2 GPa refuses until a VI–VII boundary source is cached (directing 2026-10-11). Ice VII from 2.3 GPa (VI''s window top)
  to F&R''s ρ = 1600 kg/m³ edge (~3.3 GPa at 300 K) refuses by name: Bezacier gives ρ there but prints no c_P, and the c_P
  it borrows from F&R is outside F&R''s ρ bracket; it waits on a measured ice VII c_P source (h2o-sources.md; 68 N53). French
  & Redmer 2015 prints no point value of its potential; its transcription is checked against legacy ice_fr2015 (test_material_evaluators)
  and against SeaFreeze''s VII_X_French, the same potential (P6 test, directing).'
