  - quantity: "P_TH at 6000 K"
    state: {T: 6000.0, T0: 300.0}
    expected: 82000000000.0
    unit: Pa
    tolerance: 500000000.0
    tolerance_reason: "2-figure print «82 GPa»"
    expression: "alpha_k * (T - T0) + 0.5 * alpha_k_dt * (T - T0)**2"
    source: {cache: "2003PhyB..328..345I.pdf", page: "347", where: "text below eq. (4): «the value of PTH at 6000 K is 82 GPa»", sha256: d6cc26aa2bdb9a04d55efa480bdbbbeca8c6899ca35275e627c43051ec6fd6ee}
  - quantity: "P_TH nonlinear term at 6000 K"
    state: {T: 6000.0, T0: 300.0}
    expected: 13000000000.0
    unit: Pa
    tolerance: 500000000.0
    tolerance_reason: "2-figure print «13 GPa»; exercises the ½ (r2 N4)"
    expression: "0.5 * alpha_k_dt * (T - T0)**2"
    source: {cache: "2003PhyB..328..345I.pdf", page: "347", where: "text below eq. (4): «of which 13 GPa is due to the nonlinear term»", sha256: d6cc26aa2bdb9a04d55efa480bdbbbeca8c6899ca35275e627c43051ec6fd6ee}
