    expression: "alpha_k / (rho * c_v)"
    source: {cache: "2023GeoRL..5002271H-pub.pdf", page: "7", where: "Table 1, liquid Fe, CMB column: γ 2.74 (1σ 0.14), ρ 8,083", sha256: 653cbb0690f690eaca8d8450029ecedd0495c7bdb4263421e5320c85a0f60af6}
note: >-
  The liquid/hcp split and the iron melting curve × 0.8 belong to the core-energy node, which phase 2 does
  not build; they are not in this record (G1). W-L20-01: Zeng's BM2 path derivative is taken as K_T with
  (∂P/∂T)_V·γ·T added (legacy treatment); the finding stays open. W-L1-01: alpha_k is I&A's printed
  12.1×10⁻³ GPa/K (legacy 0.00121). The reference adiabat is legacy's table as computed with legacy's
  thermal model, so below 19 GPa it carries legacy's α (W-L1-01) until it is regenerated. G4: the
  Dorogokupets set and the γ window end at the printed 350 GPa; between 350 GPa and 12 TPa only the set's
  declared edge band speaks, and above 12 TPa the record refuses.
