# 천체 파일 스키마(v2) — 닫힌 키 목록: 꼴 · 단위 · 범위 · 출처 요구 · 읽는 곳 (phase1-design D-A7-3, D-A2-7).
# Every key a v2 body file may carry. A key not listed here is refused by name (input.unknown_key).
#
# shape:     number | bool | text | enum | block (scalar-with-provenance: value + grade, source, and
#            counter_evidence_searched or note) | record (a component record with its own field list)
# number_or_block: the key may be a bare number or a block.
# unit:      the schema unit; a stated unit must equal it (D-A2-7). "1" = dimensionless.
# si:        factor to SI; the converted value must stay finite (r2 S2-B1).
# A block (number_or_block given as a mapping, block, extent block) needs grade, source, and counter_evidence_searched
# or note; provenance: true asks for the full trio.
# domain:    gt / ge / lt / le bounds on the value; absent = any finite value.
# provenance: true = the trio grade · source · counter_evidence_searched is required (R-A1-12, R-MLD-4).
# consumer:  solver | history (in-scope post-processors: core nodes, internal heat, thermal history) | later-tools.
#            Readers at 097a8aa3 are named per key (r2 H6).
version: 2

top:
  name:   {shape: text, required: true}
  kind:   {shape: enum, values: [planet, moon, brown_dwarf, star, fixture], required: true}
  parent: {shape: text}                 # optional; absent = free-floating (null is refused)
  inputs: {shape: mapping, required: true}
  layers: {shape: list, required: true}       # required unless `bulk` is declared (layers S1 §1.2)
  closure: {shape: mapping, required: true}    # likewise
  bulk:   {shape: mapping}                    # layers S1: expanded by validate._expand_bulk; excludes layers/closure
  jumps:  {shape: mapping}

inputs:
  mass_earth:            {shape: number_or_block, unit: M_earth, si: 5.972e24, domain: {gt: 0}, required: true, consumer: solver}
  radius_earth:          {shape: number_or_block, unit: R_earth, si: 6.371e6, domain: {gt: 0}, consumer: solver}          # observation / closure target
  potential_temperature: {shape: number_or_block, unit: K, domain: {gt: 0}, consumer: solver}
  surface_temperature_k: {shape: number_or_block, unit: K, domain: {gt: 0}, consumer: solver}                 # lid (R-LITHO-3), R-RUL-5
  surface_pressure_pa:   {shape: number_or_block, unit: Pa, domain: {ge: 0}, consumer: solver}                # declared P_s (§Q2), optional
  tidal_heating:         {shape: bool, consumer: solver}                                                     # voids_expected, interior.py:4953 (r2 H6)
  age_gyr:               {shape: number_or_block, unit: Gyr, domain: {gt: 0}, consumer: history}              # radiogenic at age (R-RUL-17)
  body_class:            {shape: enum, values: [rocky, sub_neptune, ice_giant, gas_giant, giant, brown_dwarf, star], consumer: solver,
                          out_of_scope: {brown_dwarf: "중수소가 탄다 — 13 M_J 위는 광도가 시간에 따라 변하고(Spiegel+ 2011) 이 솔버에는 그 열이력이 없다",
                                         star: "수소가 탄다 — 별의 구조는 이 솔버 밖이다"}}   # body_class.LADDER + alias giant; FLUID_CLASSES interior.py:4033/:4149 (c8 note 1)
  basal_iron_number:     {shape: number_or_block, unit: "Fe#, molar, 0–100", domain: {ge: 0, le: 100}, consumer: solver}   # C100, read by solve (c8 note 1 §3)
  core_cmb_temperature:  {shape: number_or_block, unit: K, domain: {gt: 0}, consumer: history}               # core_state
  core_initial_temperature:             {shape: number_or_block, unit: K, domain: {gt: 0}, consumer: history}
  mantle_initial_potential_temperature: {shape: number_or_block, unit: K, domain: {gt: 0}, consumer: history}
  lid_thickness_km:      {shape: block, unit: km, si: 1.0e3, domain: {gt: 0}, consumer: history}
  tectonic_regime:       {shape: block, value_shape: enum, values: [stagnant, mobile, transitional, episodic, heat_pipe], consumer: history,
                          extra_fields: [setting_override, contested]}      # REGIMES, tectonic_regime.py:39; «contested» is a field, not a value (R-GV-5)
  radiogenic_concentration: {shape: record, consumer: history, check: declared_needs_override,
                             fields: {U_ppb: {shape: number, unit: ppb, domain: {ge: 0}}, Th_ppb: {shape: number, unit: ppb, domain: {ge: 0}},
                                      K_ppm: {shape: number, unit: ppm, domain: {ge: 0}}},
                             meta: [grade, source, note, alternative, override, default, counter_evidence_searched]}   # R-GV-4
  thermal_evolution:     {shape: record, consumer: history, fields: {mantle: {shape: any}, crust: {shape: any}, core: {shape: any}, melting: {shape: any}},
                          leaf_provenance: true}                            # R-A1-1: every leaf block carries the trio
  # later-tools keys (D-A2-7 reader table): carried through, never read by the solver
  k2_over_q:             {shape: number_or_block, unit: "1", domain: {gt: 0}, consumer: later-tools}          # tidal_heating, tidal_locking → power → IHN
  perturber_mass_earth:  {shape: number_or_block, unit: M_earth, domain: {gt: 0}, consumer: later-tools}
  semi_major_axis_km:    {shape: number_or_block, unit: km, domain: {gt: 0}, consumer: later-tools}
  eccentricity_forced:   {shape: number_or_block, unit: "1", domain: {ge: 0, lt: 1}, consumer: later-tools}
  eccentricity:          {shape: number_or_block, unit: "1", domain: {ge: 0, lt: 1}, consumer: later-tools}  # tidal_locking
  rotation_period_h:     {shape: number_or_block, unit: h, domain: {gt: 0}, consumer: later-tools}            # dynamo, dynamo_rocky, tidal_locking
  dynamo_alive:          {shape: bool, consumer: later-tools}                                                # dynamo_rocky
  luminosity_lsun:       {shape: number_or_block, unit: L_sun, domain: {gt: 0}, consumer: later-tools}        # dynamo
  isolated:              {shape: bool, consumer: later-tools}                                                # dynamo
  radius_rj:             {shape: number_or_block, unit: R_jup, domain: {gt: 0}, consumer: later-tools}        # body_class:414 (LT), dynamo
  radius_rj_min:         {shape: number_or_block, unit: R_jup, domain: {gt: 0}, consumer: later-tools}
  radius_rj_max:         {shape: number_or_block, unit: R_jup, domain: {gt: 0}, consumer: later-tools}

layer:
  id:          {shape: text, required: true}
  role:        {shape: text, required: true}           # checked against roles.yaml
  material:    {shape: text, required: true}           # checked by the material resolver when one is given
  extent:      {shape: mapping}                        # one of the forms below; absent = remainder (or the closure's layer)
  thermal:     {shape: enum, values: [adiabatic, conductive, isothermal]}
  t_declared:  {shape: number_or_block, unit: K, domain: {gt: 0}}
  system:      {shape: text}
  composition: {shape: block, value_shape: mapping, provenance: true,
                extra_fields: [source_kind, deviation, preset, owner_direction, anchor, bulk_plan]}   # phase-2 note 1 item 2, impl P1; bulk_plan: layers S1 §2.3
  params:      {shape: mapping}                        # name → block with the trio

# The closed layer `params` vocabulary (phase-1 design note 14 item 2, note 14a). `materials`: the layer materials a
# key is allowed on; «plain» = any id except the three built ids (silicate_basal_const, fe_core_light, silicate_decl).
# density's domain is a unit guard (a g/cm³ or g/L slip falls outside it), not a physics bound (r2 on note A6).
layer_params:
  density:          {unit: kg/m3, domain: {ge: 500, le: 20000}, materials: [silicate_basal_const], consumer: solver}
  initial_porosity: {unit: "1", domain: {ge: 0, le: 0.60}, materials: plain, fit: true, consumer: solver}
  porosity_p_cap:   {unit: Pa, domain: {gt: 0}, materials: plain, requires: initial_porosity, consumer: solver}
  thickness_km:     {unit: km, domain: {gt: 0}, materials: [silicate_basal_const], consumer: history}
# Renamed keys: refused as unknown, with the new name as the nearest (note 14 item 2: one name for φ₀).
layer_params_renamed: {porosity_phi0: initial_porosity}

extent:
  mass_fraction:      {unit: "1", domain: {ge: 0, le: 1}}
  radius_from_centre: {unit: km, domain: {gt: 0}}
  depth_from_surface: {unit: km, domain: {gt: 0}}
  thickness_above:    {unit: km, domain: {ge: 0}, ref: layer}    # basal-layer pattern only; 0 is valid (R-BL-7)
  phase:              {ref: event}

# A composition closure's default range is the old engine's fit bracket, kept for oracle parity even where it runs
# past the material's declared window (S [0.13, 0.25] vs CORE_BOX_WT S ≤ 0.19, eos.py:4402; the old engine applies
# the box only to a declared S). A root outside the window is recorded by the solve as an extrapolation
# (R-RUL-10/10a), never silent (r2 S2-N1; rule recorded here, the solve's record is b9's MaterialView).
closure:
  kinds:
    R:             {default: [0.05, 30.0], unit: R_earth, domain: {gt: 0}, fields: []}
    boundary_mass: {default: [0.001, 0.999], unit: "1", domain: {gt: 0, lt: 1}, fields: [layer]}
    composition:   {unit: "1", domain: {ge: 0, le: 1}, fields: [layer, name], defaults: {S: [0.13, 0.25],                       # SULPHUR_FIT_BRACKET, interior.py:5843
                                          initial_porosity: [0.0, 0.60]}}      # PHI0_NOMINAL, porosity.py:68 (c8 note 1 §2)

# A layer composition's rule per system (phase-2 impl P1 and post-freeze note 2). A component outside its system's
# list, or a system not listed here, is refused by name.
composition_systems:
  silicate:                                     # a bulk declaration: oxide wt% as printed
    form: bulk
    components: [SiO2, TiO2, Al2O3, Cr2O3, FeO, MnO, MgO, NiO, CaO, Na2O, K2O, P2O5]   # OXIDES, mantle_composition.py:33
    required: [CaO, FeO, MgO, Al2O3, SiO2, Na2O]                                         # CFMASNA, mantle_composition.py:37
    sum: {target: 100.0, tolerance: 2.0, unit: "wt%"}                                    # SUM_TOLERANCE_WT, mantle_composition.py:35
    source_kind_required: true
  iron_alloy:                                   # a partial declaration: light-element mass fractions, no sum-to-1 rule
    form: partial
    components: [S, O, C]                                                                 # CORE_BOX_WT, eos.py:4402
    markers: [fit]                                                                        # the closure axis, not a number
    source_kind_required: false

# Where a declared composition came from (phase-2 design note 1 item 2). Phase 2 accepts the first four; the last two
# are refused by name until the resolver (c) is built.
source_kinds:
  accepted: [measured, owner_override, preset, default_bse]
  not_built: [inherited, star_derived]
  companions:                                   # required with each kind (impl P1, c8 item 9)
    measured: []                                # the block's grade · source · counter_evidence_searched (the trio)
    owner_override: [owner_direction, anchor]   # the owner-direction blob and a unique anchor
    preset: [preset]                            # an id in presets.yaml
    default_bse: []                             # McDonough & Sun 1995 Table 5, read with page; oxides derived (note 2)

deviation_kinds:                                # deviation {kind, grade}
  none: "no deviation from the source composition"
  distance_condensation: "volatile condensation from the body's distance to its star; grade carries «current orbit, migration not modelled»"
  scenario: "a declared formation scenario"
  declared: "a directly declared value"
deviation_distance_grade: "current orbit, migration not modelled"

jump: {unit: K, domain: {ge: 0}}                                     # R-IJ-3

tolerances:
  mass_fraction_sum: 1.0e-9                                          # the one named tolerance (X13)

grades:
  input: [measured, literature, analog, derived, judgment, declared, inherited, authored]   # INPUT_GRADES (R-GV-1)
  forbidden: [owner-override, declared-default, contested, calibrated, guessed]              # R-GV-6

# The `bulk:` block's vocabulary, constants and defaults (layers S1 registration 1346ffc6 §1; moved verbatim from S0's
# solver/data/bulk.yaml at ea3ae617, which S1 deletes). Read by solver/partition.py; validate.py reads `top.bulk` only.
bulk:
  forms: [materials, elements, preset]

  # (E) vocabulary: the 83 elements of Wang+ 2018 Table 1 (arXiv 1708.08718 p. 7), in Z order, plus the volatiles.
  elements: [H, He, Li, Be, B, C, N, O, F, Ne, Na, Mg, Al, Si, P, S, Cl, Ar, K, Ca, Sc, Ti, V, Cr, Mn, Fe, Co, Ni, Cu, Zn, Ga, Ge, As, Se, Br, Kr, Rb, Sr, Y, Zr, Nb, Mo, Ru, Rh, Pd, Ag, Cd, In, Sn, Sb, Te, I, Xe, Cs, Ba, La, Ce, Pr, Nd, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu, Hf, Ta, W, Re, Os, Ir, Pt, Au, Hg, Tl, Pb, Bi, Th, U]
  volatiles: [H2O]
  volatile_threshold: 0.0            # H2O > 0 in the bulk makes a volatile layer, refused at S1 (registration §2.2 step 5)

  # (M) material → role. The partition orders an (M) list by these roles; the last role carries no extent.
  material_roles: {fe_prem: core, fe_core_light: core, silicate: mantle, silicate_decl: mantle}
  role_order: [core, mantle]
  fractions_tol: 1.0e-12             # (M) and (E) fractions sum to 1 within this (registration §2.1)

  # Mantle oxides: the twelve oxides of McDonough & Sun 1995 Table 4 as solver/data/bse_ms95.yaml prints them.
  # element: [oxide, cations per formula, O per formula]. Every other mantle element is listed as dropped, unoxidised.
  oxides:
    Si: [SiO2, 1, 2]
    Ti: [TiO2, 1, 2]
    Al: [Al2O3, 2, 3]
    Cr: [Cr2O3, 2, 3]
    Mn: [MnO, 1, 1]
    Fe: [FeO, 1, 1]
    Ni: [NiO, 1, 1]
    Mg: [MgO, 1, 1]
    Ca: [CaO, 1, 1]
    Na: [Na2O, 2, 1]
    K: [K2O, 2, 1]
    P: [P2O5, 2, 5]
  # The O check's σ_Δ takes the stated ± of these elements and of O (registration §2.2 step 3).
  o_check_elements: [Fe, Mg, Si, Ca, Al, Na]
  o_check_sigmas: 3.0

  # Atomic masses (g/mol), copied from burnman 2.1.0 burnman/data/input_masses/atomic_masses.dat («Masses from NIST»,
  # kg/mol there), sha256 df35fe789c9be269a4d54b85a1bf796ca736ad5ecccdd69ae7873b506df3d7af. test_partition checks
  # them against that file when burnman is importable.
  atomic_mass_g_mol: {O: 15.9994, Na: 22.9898, Mg: 24.305, Al: 26.9815, Si: 28.0855, P: 30.9738, K: 39.0983,
                      Ca: 40.078, Ti: 47.867, Cr: 51.9961, Mn: 54.938, Fe: 55.845, Ni: 58.6934}

  defaults:
    fe_metal_fraction:
      value: 0.8625
      sigma: 0.042
      grade: "default (Earth, Wang+ 2018)"
      source: "2018Icar..299..460W arXiv p. 7 Table 1: 0.325 × core Fe 82.8 / bulk Fe 31.2 (registration §1)"
      counter_evidence_searched: "Morard+ 2013 (cached) and MS95 (cached), registration §1; tests 2 and 3"
    o_relative_sigma:
      value: 0.022727272727272728
      grade: "default from Wang 2018, not this body's"
      source: "2018Icar..299..460W arXiv p. 7 Table 1 row «8 O (%)», bulk column «30.8 ±0.7»: 0.7 / 30.8"
      counter_evidence_searched: "used only when an (E) block states no O uncertainty (registration §2.2 step 3)"

  # The fe_prem core's composition for the draw: Table 1's core column (49 elements), as printed. The partition
  # renormalises it over the elements a bulk declares (registration §2.2 step 1). Read with pdftotext -layout from the
  # cached 2018Icar..299..460W.pdf (sha256 12e40de9b3e38ad077951ff39066571da49a571a2393f187cc6b3ae886491c46);
  # solver/tests/fixtures/wang2018_table1.json is the full table.
  fe_prem_core_printed:
    H: "569 ppm"
    Li: "1.57 ppm"
    C: "7921 ppm"
    N: "93 ppm"
    O: "2.66 %"
    Na: "1372 ppm"
    Mg: "0.0588 %"
    Si: "4.96 %"
    P: "2774 ppm"
    S: "18269 ppm"
    Cl: "459 ppm"
    K: "206 ppm"
    V: "122 ppm"
    Cr: "6590 ppm"
    Mn: "3257 ppm"
    Fe: "82.8 %"
    Co: "2373 ppm"
    Ni: "5.06 %"
    Cu: "154 ppm"
    Zn: "29 ppm"
    Ga: "4.9 ppm"
    Ge: "24 ppm"
    As: "4.89 ppm"
    Se: "8.63 ppm"
    Br: "0.514 ppm"
    Rb: "1.08 ppm"
    Nb: "0.423 ppm"
    Mo: "4.97 ppm"
    Ru: "3939 ppb"
    Rh: "684 ppb"
    Pd: "2719 ppb"
    Ag: "239 ppb"
    Cd: "0.167 ppm"
