# 파생 파일 목록 — engine/·solver/ 에 커밋된 파생 파일마다 빌드 진입점·입력·검사를 적고(sg-gate prereg 1765b55c §1 G1), 조사에서 빠지는 파일의 까닭을 적음
# Read by derived/check.py (stamps, checks, census, landing steps) and by scripts/check.sh. derived/ is no entry's input.
# code: build entry points (path:function); the stamped code is their static import closure, computed at check time.
# data: in-tree inputs by git blob (a path with * is a glob, expanded at check time: a new match moves the stamp). derived: listed derived files this entry reads (the DAG). out_of_tree: artifacts paths,
# read at artifacts origin/main from NEARSTARS_ARTIFACTS. packages: name (version stamped). external: name → {env, path}
# (sha256 of the file; a missing env or file is red). check: the value or rebuild check run when the stamp moved.
# census (G1 load census, N18): what derived/load_census.py runs in-process before comparing sys.modules with the
# closure — default the check command; `call` file:function with args; `argv`; `restore` puts the entry's own files
# back after a build and removes the untracked files it created; `where: pc` runs in the go-live PC block.
# {external}/{papers}/{artifacts} are the env dirs; the entry's `external` env vars are passed to the census run.
# check.tolerance / check.reference_machine: G1 «the check … with its tolerance and reference machine» (census red if absent).

entries:
  1-earth:
    row: 1
    files: [engine/structure_grid/earth.json]
    code: [engine/structure_grid.py:build]
    # the build's run.load_body → transfers.check_body → load_others globs every body yaml (walk survey, note 1 §4)
    data: ["engine/bodies/*.yaml", engine/chain.yaml]
    derived: [engine/reference_adiabats.json, engine/mars_sulphur_anchor.json]
    check: {kind: structure_table, table: engine/structure_grid/earth.json,
             tolerance: "structure_grid._recheck within ε (C161; G4 «row 1 keeps ε»)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
    census: {call: "engine/structure_grid.py:build", args: [Earth, null, [2004.686159407071]], restore: true}   # one grid point (G1)
  1-venus:
    row: 1
    files: [engine/structure_grid/venus.json]
    code: [engine/structure_grid.py:build]
    # the build's run.load_body → transfers.check_body → load_others globs every body yaml (walk survey, note 1 §4)
    data: ["engine/bodies/*.yaml", engine/chain.yaml]
    derived: [engine/reference_adiabats.json, engine/mars_sulphur_anchor.json]
    check: {kind: structure_table, table: engine/structure_grid/venus.json,
             tolerance: "structure_grid._recheck within ε (C161; G4 «row 1 keeps ε»)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
    census: {call: "engine/structure_grid.py:build", args: [Venus, null, [2218.1251654372177]], restore: true}   # one grid point (G1)
  1-mars:
    row: 1
    files: [engine/structure_grid/mars.json]
    code: [engine/structure_grid.py:build]
    # the build's run.load_body → transfers.check_body → load_others globs every body yaml (walk survey, note 1 §4)
    data: ["engine/bodies/*.yaml", engine/chain.yaml]
    derived: [engine/reference_adiabats.json, engine/mars_sulphur_anchor.json]
    check: {kind: structure_table, table: engine/structure_grid/mars.json,
             tolerance: "structure_grid._recheck within ε (C161; G4 «row 1 keeps ε»)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
    census: {call: "engine/structure_grid.py:build", args: [Mars, null, [2020.8472065056037]], restore: true}   # one grid point (G1)
  2-reference-adiabats:
    row: 2
    files: [engine/reference_adiabats.json]
    code: [engine/tools/reference_adiabats.py:build]
    data: [engine/chain.yaml]
    check: {kind: command, argv: ["{python}", engine/tools/reference_adiabats.py, --check],
             tolerance: "exact bytes (G4)",
             reference_machine: "Linux-x86_64 (reference_adiabats.REFERENCE_MACHINE; off it the check only records, G5)"}
  3-ice-giant-anchor:
    row: 3
    files: [engine/ice_giant_anchor.json]
    code: [engine/test_ice_giant.py:refresh]
    # measured (trace_reads on the check, 68 n3): the listed reads are all it reads
    data: [engine/chain.yaml]
    derived: [engine/reference_adiabats.json, engine/mars_sulphur_anchor.json]
    check: {kind: command, argv: ["{python}", engine/test_ice_giant.py],
             tolerance: "exact frozen values (G4; the Mac drifts at 1e-14, note 1 §4)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
  4-mars-sulphur-anchor:
    row: 4
    files: [engine/mars_sulphur_anchor.json]
    code: [engine/test_mars_sulphur.py:refresh]
    # measured (trace_reads on the check, 68 n3): every body yaml (a glob), the reference adiabats and one mantle table
    data: ["engine/bodies/*.yaml", engine/chain.yaml]
    derived: [engine/reference_adiabats.json, engine/mantle_tables/0663e6a031cae4dc.json]
    check: {kind: command, argv: ["{python}", engine/test_mars_sulphur.py],
             tolerance: "re-fit sulphur within test_mars_sulphur.SULPHUR_TOL_WT; data trigger files exact bytes",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
  5-c143-inventory:
    row: 5
    files: [engine/c143_sum_inventory.json]
    code: [engine/test_c143_guard.py:main]
    # measured (trace_reads on the check, 68 n3): it also reads these. The census inside it reads every .py under
    # engine/ and scripts/ as text (CENSUS_ROOTS, rglob; 68 B1 on 2be90e97): globs over tracked files, so a sum() in a
    # module outside the closure moves the stamp; the derived .py tables it matches are listed under derived
    data: [engine/chain.yaml, "engine/**/*.py", "scripts/**/*.py"]
    derived: [engine/reference_adiabats.json, engine/mantle_tables/0663e6a031cae4dc.json,
              engine/mantle_tables/c6bd588831fd8229.json, engine/hhe_table.py, engine/ice_melt_table.py,
              engine/water_table.py, engine/water2_table.py, engine/ammonia_table.py]
    check: {kind: command, argv: ["{python}", engine/test_c143_guard.py],
             tolerance: "bit-identical inventory (test_c143_guard)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
  6-mantle-tables:
    row: 6
    files: [engine/mantle_tables/0663e6a031cae4dc.json, engine/mantle_tables/25cb82c1607ef8c7.json,
            engine/mantle_tables/7f2146ace4f965b1.json, engine/mantle_tables/c6bd588831fd8229.json]
    code: [engine/mantle_composition.py:build]
    packages: [burnman]
    census: {call: "derived/census_targets.py:mantle_one_column", args: [mars], restore: true}   # build(), one P column (only mars.yaml declares a mantle composition)
  7-fall-sets:
    row: 7
    files: [solver/materials/fall_sets/silicate_slb_default_bse.json.gz,
            solver/materials/fall_sets/silicate_slb_earth_dmm_wh2005.json.gz,
            solver/materials/fall_sets/silicate_slb_mars_khan2022.json.gz]
    code: [solver/rho_fall_build.py:main, solver/fall_sets.py:export]
    # measured (trace_reads on the check, 68 B3 / n3): the whole material registry it loads, not only the SLB yamls
    # material_registry.load globs solver/materials/*.yaml (walk survey): a glob, so a new record moves the stamp
    data: [engine/chain.yaml, solver/data/bse_ms95.yaml, solver/data/presets.yaml, solver/data/roles.yaml,
           solver/data/schema.yaml, "solver/materials/*.yaml"]
    derived: [engine/reference_adiabats.json, engine/mars_sulphur_anchor.json,
              solver/materials/silicate_slb_default_bse.yaml, solver/materials/silicate_slb_earth_dmm_wh2005.yaml,
              solver/materials/silicate_slb_mars_khan2022.yaml, solver/materials/tables/silicate_slb_default_bse.json.gz,
              solver/materials/tables/silicate_slb_earth_dmm_wh2005.json.gz,
              solver/materials/tables/silicate_slb_mars_khan2022.json.gz, solver/materials/h2o.yaml,
              solver/materials/fe_prem.yaml, solver/materials/fe_prem_legacy.yaml,
              solver/materials/silicate_prem_zeng2016.yaml, solver/materials/tables/silicate_prem_zeng2016.json.gz]
    check: {kind: command, argv: ["{python}", -m, unittest, solver.tests.test_fall_set_stamp],
             tolerance: "exact stamp equality (test_fall_set_stamp)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
  8a-h2o:
    row: 8a
    files: [solver/materials/h2o.yaml]
    code: [solver/material_library.py, solver/material_registry.py, solver/material_joins.py, solver/material_view.py]
    out_of_tree: [rewrite/phase2-records/gen_h2o.py]
    packages: [SeaFreeze]
    census: {where: pc, how: "the go-live PC block runs the generator under derived/load_census.py (A-time)"}
  8b-fe-prem:
    row: 8b
    files: [solver/materials/fe_prem.yaml, solver/materials/fe_prem_legacy.yaml]
    derived: [engine/reference_adiabats.json]
    out_of_tree: [rewrite/phase2-records/gen_fe_prem.py]
    census: {where: pc, how: "the go-live PC block runs the generator under derived/load_census.py (A-time)"}
  8c-prem-handover:
    row: 8c
    files: [solver/materials/silicate_prem_zeng2016.yaml, solver/materials/tables/silicate_prem_zeng2016.json.gz]
    # measured (sg-gate trace_reads on gen_prem_handover 61a03ce4, 68 B3): it reads all three SLB compacts; the merged
    # tables c82f42b2 / 23e3cfe6 / 5fd586dc and the builder are pinned by blob inside the generator
    derived: [solver/materials/tables/silicate_slb_default_bse.json.gz,
              solver/materials/tables/silicate_slb_earth_dmm_wh2005.json.gz,
              solver/materials/tables/silicate_slb_mars_khan2022.json.gz]
    # the builder it executes (ac974604, a path argument) is pinned by blob inside the generator (BUILDER_BLOB); not on
    # artifacts main at any path — extract it with `git -C $NEARSTARS_ARTIFACTS show
    # 9b8f406f:rewrite/phase2-records/build_assemblage.py` (origin/silicate-rebuild-9b8f406f; 68 n2 on R1)
    out_of_tree: [rewrite/phase2-records/gen_prem_handover.py]
    census: {where: pc, how: "the go-live PC block runs the generator under derived/load_census.py (A-time)"}
  8d-silicate-slb:
    row: 8d
    files: [solver/materials/silicate_slb_default_bse.yaml, solver/materials/silicate_slb_earth_dmm_wh2005.yaml,
            solver/materials/silicate_slb_mars_khan2022.yaml, solver/materials/tables/silicate_slb_default_bse.json.gz,
            solver/materials/tables/silicate_slb_earth_dmm_wh2005.json.gz,
            solver/materials/tables/silicate_slb_mars_khan2022.json.gz]
    # the generator's measured import closure (regen8d PC trace, 6c1fd9664; loaded or read, sg-gate note 1 §2); the
    # tables' builder ac974604 is read as bytes and pinned against the sidecar header, never loaded
    out_of_tree: [rewrite/phase2-records/gen_silicate_records.py, rewrite/phase2-records/slb2024/dtdp_eq.py,
                  rewrite/phase2-records/slb2024/strict_report.py,
                  rewrite/phase2-records/slb2024/transition/transition_check.py]
    packages: [burnman]
    census: {where: pc, how: "the go-live PC block runs the generator under derived/load_census.py (A-time)"}
  9-hhe-table:
    row: 9
    files: [engine/hhe_table.py]
    code: [engine/tools/make_hhe_table.py:main]
    external: {DirEOS2019: {env: NEARSTARS_EXTERNAL, path: DirTABLES-EOS2019/TABLEEOS_HHE_TP_IVL_Y0.275_v1}}
    census: {argv: [engine/tools/make_hhe_table.py, "{external}/DirTABLES-EOS2019"], restore: true}
  9-ice-melt-table:
    row: 9
    files: [engine/ice_melt_table.py]
    code: [engine/tools/make_ice_melt_table.py:main]
    external:
      liquid: {env: NEARSTARS_EXTERNAL, path: highP-ice/figs-1-and-S1/coex-line-liquid.dat}
      vii: {env: NEARSTARS_EXTERNAL, path: highP-ice/figs-1-and-S1/coex-line-superionic-ice.dat}
      direct: {env: NEARSTARS_EXTERNAL, path: highP-ice/figs-1-and-S1/coex-direct-coexistence.dat}
    census: {argv: [engine/tools/make_ice_melt_table.py, "{external}/highP-ice"], restore: true}
  9-water-table:
    row: 9
    files: [engine/water_table.py]
    code: [engine/tools/make_water_table.py:main]
    packages: [SeaFreeze]
    census: {argv: [engine/tools/make_water_table.py], restore: true}
  9-water2-table:
    row: 9
    files: [engine/water2_table.py]
    code: [engine/tools/make_water2_table.py:main]
    packages: [SeaFreeze]
    census: {argv: [engine/tools/make_water2_table.py], restore: true}
  9-ammonia-table:
    row: 9
    files: [engine/ammonia_table.py]
    code: [engine/tools/make_ammonia_table.py:main]
    external: {Bethkenhagen2013: {env: NEARSTARS_PAPERS, path: 2013JChPh.138w4504B.pdf}}
    census: {call: "derived/census_targets.py:ammonia_table", args: ["{papers}"], restore: true}   # PDF at the stamped path (note 1 §10)
  10-graph-page:
    row: 10
    files: [engine/chain-explorer.html]
    code: [engine/build_graph_page.py:build]
    # measured (trace_reads on check_graph_page, 68 n3): bindings and the phase-4 yamls besides chain.yaml
    # (a glob: the page reads every phase4/*.yaml, so a new one moves the stamp)
    data: [engine/chain.yaml, engine/bindings.yaml, "phase4/*.yaml"]
    check: {kind: command, argv: ["{python}", engine/tools/check_graph_page.py],
             tolerance: "exact bytes (G4)",
             reference_machine: "Linux-x86_64 (the PC landing suites, G5)"}
    census: {call: "engine/build_graph_page.py:build", restore: true}   # its check builds in a subprocess, unseen

# tracked files under engine/ and solver/ that are neither source, documents nor listed: regex → reason (prereg §0)
exempt:
  'engine/bodies/.*\.yaml': authored body declarations
  'engine/bindings\.yaml': authored
  'engine/chain\.yaml': authored chain
  'engine/tools/core_items_kind\.yaml': authored
  'engine/test_fixtures/.*': test fixtures
  'engine/dependency-chain\.html': prose page, hand-written (build_graph_page names it so)
  'engine/aqua-substitution-gaps/.*': frozen measurement records, never rebuilt
  'solver/data/.*\.yaml': authored solver data
  'solver/materials/sources\.yaml': authored
  'solver/materials/schema\.yaml': authored
  'solver/materials/silicate_basal_const\.yaml': authored, no generator line (68 B2)
  'solver/tests/fixtures/.*': test fixtures
  'solver/tests/env_tiers\.yaml': authored test tier list (HEAVY-onctl P2)
  '(engine|solver)/requirements(-burnman)?\.txt': requirements files
  'solver/\.gitignore': VCS config

# make_*.py outputs that are not committed (census: named, not listed)
not_tracked:
  engine/aqua_table.py: make_aqua_table.py writes it; not committed
