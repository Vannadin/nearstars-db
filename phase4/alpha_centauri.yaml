      못했고, 그래서 9.5시간마다 한 바퀴를 돈다. 자전축도 세워지지 않아 15도쯤 기울어 있다. 이 회전이 천체를
      적도 쪽으로 부풀려, 적도 지름이 극 지름보다 7퍼센트쯤 크다. 내부에서 나오는 열은 사실상 없다.
    fields:
