  - body: Cassandra
    axis: gameplay                 # group 11 facet-walk 2026-06-22
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-27: difficulty "차폐 경미" → "외대 차폐". environment.radiation 등급이
      낮음 → 중간으로 오른 데 따른 것. 바이옴 6종·후보 1종, SOI, ScienceValues, RB 등급은 무변경.
      2026-07-28: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24).
      구값 "임무=한랭 무산소 착륙 + 외대 차폐".
    status: gated
    driver: [engine]
    narrative: >
      Landing is not hard, but there is nothing to breathe and it is cold, and sitting inside the outer belt means
      shielding is needed too. The surface divides into six: Seas (cold open water) / Coastlines / Cold Highlands /
      Polar Ice / Volcanic & Hydrothermal (the vent fields) / Hazy Lowlands (where the amber haze pools). The most
      interesting of them is the hydrothermal ground, where traces of anaerobic life can be found.
    narrative_ko: >
      착륙은 어렵지 않지만 숨 쉴 수 없고 춥다. 외대 안에 잠겨 있어 차폐도 필요하다. 지표는 여섯으로 갈린다.
      바다(Seas, 차가운 노출 수면) / 해안(Coastlines) / 한랭 고지(Cold Highlands) / 극빙(Polar Ice) / 화산·열수
      지대(Volcanic & Hydrothermal, 열수구 지대) / 연무 저지대(Hazy Lowlands, 호박색 연무가 고이는 곳). 그중 가장
      흥미로운 곳은 혐기성 생명의 흔적을 찾을 수 있는 열수구다.
    fields:
      - { name: science_biomes, value: "6 (+후보 1 = colors 7키): Seas / Coastlines / Cold Highlands / Polar Ice / Volcanic & Hydrothermal / Hazy Lowlands / (후보) Microbial Mats", op: set, colors: {"Seas":"#2E5680","Coastlines":"#4A8C6E","Cold Highlands":"#6E7480","Polar Ice":"#CBDEE6","Volcanic & Hydrothermal":"#9A4436","Hazy Lowlands":"#B79A5E","Microbial Mats (candidate)":"#A85078"} }   # provisional naturalistic biome-map display colors (S↓; microbial mats = accent)
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: "The second (marginal) life-world. Hydrothermal vents=anaerobic microbial science hub, which is why the narrative singles them out of the six. Non-breathable and cold, with intermediate radiation from sitting inside the outer belt (environment.radiation), so shielding is required rather than optional; the older \"light shielding\" reading came from the retired low grade. Heat is no threat. SOI=auto, full ScienceValues. Microbial Mats biome=candidate, a 7th added later only if it does not overlap other bodies' biomes."
      evidence_ko: "두 번째 (한계)생명 세계. 열수구=혐기 미생물 과학 거점(서사가 여섯 중 열수구만 짚는 이유). 비호흡·한랭에 외대 안쪽이라 방사선 중간(environment.radiation), 차폐는 선택이 아니라 필수. 구 '차폐 경미'는 폐기된 낮음 등급에서 온 서술. 열은 위협 아님. SOI=auto, full ScienceValues. 미생물 매트 바이옴=후보(다른 바디 바이옴과 중복하지 않을 때만 7번째로 추가)."

  - body: Chaos                    # A b V
    axis: identity
    status: gated                  # facet-walk 2026-06-23
    driver: [fiction]
    fictional: true            # 실제 관측된 천체가 아님 (DB 대조 검사 면제)
    narrative: >
      Chaos is the outermost of Polyphemus's moons, a small icy body only 400 km in radius, yet its surface is
      split by enormous Miranda-like fractures with cliffs running 15 to 30 km tall, which a gravity of just
      0.023 g holds up without letting those steep vast walls collapse. It travels on a retrograde orbit, and the
      ice grains its plumes throw into that orbit are what fill the blue-white ring around Polyphemus. Like the
      other moons it is pure fiction, with no real detection behind it; formally it is Alpha Centauri A b V, with
      Chaos kept as the cultural name.
    narrative_ko: >
      Chaos는 Polyphemus를 도는 위성 가운데 가장 바깥에 있는 작은 얼음 천체다. 반경은 400 km에 그치지만
      표면은 Miranda를 닮아 거대한 균열로 갈라져 있고, 그 사이로 높이 15~30 km에 이르는 절벽이 이어져 있으며
      0.023 g에 불과한 중력이 가파르고 거대한 절벽을 붕괴시키지 않고 유지시킨다. 역행 궤도를 갖고 있으며,
      이 천체가 궤도로 뿜어 올리는 얼음 알갱이가 Polyphemus를 감싼 푸른 흰빛 고리를 채운다. 다른 위성들처럼
      실제 검출이 없는 픽션 천체이고, 공식 명칭은 Alpha Centauri A b V, Chaos는 문화명으로 쓴다.
    fields:
      - { name: body_type, value: "작은 얼음 위성 (반경 400 km, ρ ~2015 kg/m³, Miranda형 균열), 역행, E-고리 공급원", op: set }
      - { name: cliff_height, value: "15–30", unit: km, op: set, note: "아바타 게임 설정 명시값; 0.023 g라 이 규모가 서 있을 수 있다" }
      - { name: designation, value: "Alpha Centauri A b V", op: set }
      - { name: cultural_name, value: "Chaos", op: set }
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        Classified a small retrograde icy moon, the E-ring's supplier. Check: ρ ≈ 2015 kg/m³ is an ice-rock
        mix, consistent with water plumes and the Miranda-like fracture terrain; the supply link to the
        blue-white ring is recorded with numbers in the satellites row (the plume main supply is an
        art-marked choice, the 134 kg/s neutral torus is the gas share). Designation Alpha Centauri A b V;
        fictional, so the db-parity check does not apply.
      evidence_ko: >
        역행 궤도의 작은 얼음 위성이자 E-고리 공급원으로 분류. 확인: 밀도 ~2015 kg/m³는 얼음-암석 혼합
        범위로 물 플룸과 Miranda형 균열 지형에 맞고, 청백 고리로의 공급 관계는 satellites 행이 수치로
        든다(플룸 주공급은 아트 표시된 선택, 중성 수증기 토러스 134 kg/s는 기체 몫). 명명은
        Alpha Centauri A b V, 픽션 천체라 DB 대조 검사는 면제.
    refs: ["phase4/art-direction/polyphemus-art-direction.md"]
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-27: cliff_height 15–30 km 신규. canon [GAME]이 명시한 값인데 보드 전체에서
      누락되어 있었고 polyphemus-art-direction.md 위성 표에서 되살렸다. canon의 원인 설명
      ("past tidal heating")은 유지한다 — 조석열 부족으로 기각한 것은 현재의 바다·플룸이다.

