  - body: Dante                    # A b I
    axis: identity
    status: gated                  # facet-walk 2026-06-22
    driver: [fiction]
    fictional: true            # 실제 관측된 천체가 아님 (DB 대조 검사 면제)
    narrative: >
      Dante is the innermost of Polyphemus's five moons, a small silicate world blanketed in relentless,
      Io-like volcanism. Formally the first moon (Alpha Centauri A b I), it keeps the Avatar name Dante as its
      cultural name in descriptions only. It is pure fiction, with no real detection behind it.
    narrative_ko: >
      Dante는 Polyphemus의 다섯 위성 중 가장 안쪽에 있는, 이오를 닮은 격렬한 화산에 뒤덮인 작은 규산염
      세계다. 공식적으로는 첫째 위성(Alpha Centauri A b I)이며, 아바타 이름 Dante는 설명 텍스트에만 붙는
      문화명이다. 실제 검출이 존재하지 않는 픽션 천체이다.
    fields:
      - { name: body_type, value: "silicate volcanic moon (900 km, 8.0e21 kg, ρ ~2620 kg/m³)", op: set }
      - { name: designation, value: "Alpha Centauri A b I", op: set }
      - { name: cultural_name, value: "Dante", op: set }
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        Classified an Io-type volcanic moon. Check: ρ ≈ 2620 kg/m³ sits in the silicate-body range, and the
        volcanism is powered by the ~1200× Io flux in the bulk.tidal_heating row. The designation follows
        the moon-numbering convention (Alpha Centauri A b I); fictional, so the db-parity check does not apply.
      evidence_ko: >
