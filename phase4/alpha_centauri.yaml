      for a while, but it never settles back and soon becomes part of the ring. Vapor sublimating off the
      surface spreads thinner still and stays as a gas layer beside the ring.
    narrative_ko: >
      Chaos는 대기를 붙잡을 힘이 없다. 플룸이 뿜어 올린 것들이 잠시 천체 주위에 옅은 껍질을 만들지만,
      가라앉지 못하고 곧 고리의 일부가 된다. 표면 얼음에서 승화한 수증기는 그보다 옅게 퍼져 고리 옆에
      기체 층으로 남는다.
    fields:
      - { name: composition, value: "none (안정 대기 없음; 플룸 국소 수증기 exosphere/halo → E-고리)", op: set }
      - { name: breathability, value: false, op: set }
    gate:
      criterion: [physics]
      verdict: pass-in-window
      evidence: >
        No atmosphere; plume ejecta form a transient exosphere, then leave for the ring and space
        (Enceladus-style). Check: the numbers are in the satellites row: escape velocity sits below water's
        ~430 m/s thermal speed at the surface temperature, so vapor escapes freely, 134 kg/s into the
        neutral torus.
      evidence_ko: >
        대기 없음. 플룸 분출물이 일시적 exosphere를 만들었다가 고리와 우주로 떠난다(엔셀라두스식). 확인:
        수치는 satellites 행에 있다. 탈출속도가 표면 온도의 물 열속도 ~430 m/s보다 낮아 수증기가 자유롭게
        이탈하고, 134 kg/s가 중성 토러스로 간다.

  - body: Chaos
    axis: surface                  # G5 facet-walk 2026-06-23
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      The surface is water ice mixed with rock, and Miranda-like fractures dominate the terrain. Water jets rise
      from the active fracture zones, and their fallout repaves the ground around them in fresh ice. That coat
      leaves the surface very bright. At 134 K the ice holds.
    narrative_ko: >
      표면은 물얼음과 암석이 섞인 얼음이고, Miranda를 닮은 균열이 지형을 지배한다. 활성 균열대에서는 물 제트가
      솟아 낙진으로 주변을 신선한 얼음으로 다시 덮는다. 그 덮개 덕에 표면은 매우 밝다. 온도는 134 K에 머물러
      얼음이 안정하게 유지된다.
    fields:
      - { name: surface_type, value: "얼음 (물얼음+암석), Miranda형 균열 + tiger-stripe cryovolcanic 플룸", op: set }
      - { name: hydrosphere, value: "지하 액체 (art 전제, 국소)", op: set }
      - { name: albedo, value: 0.91, op: set, note: "오너 아트 선택; §6 신선 물얼음 밴드(0.6–0.8)·엔셀라두스(0.81) 위. 표면 얼음 존속 임계 0.875를 넘기는 값" }
      - { name: surface_temperature, value: 134, unit: K, op: set }
      - { name: ice_caps, value: "전역 얼음", op: set }
    refs: ["docs/reference/ice-stability-methodology.md", "docs/reference/surface-color-albedo-methodology.md",
           "docs/reference/moon-energy-budget-methodology.md", "docs/reference/tidal-heating-methodology.md"]
    gate:
      criterion: [stability, visual-checklist]
      verdict: owner-override
      evidence: >
        Two separate owner overrides sit on this row. (1) The plumes: at 21 R_p with e 0.02 the tidal heat is
        only a few MW, so a subsurface ocean driving Enceladus-style cryovolcanism is impossible (a⁻⁷·⁵ is
        fatal; checked across every e·a·resonance·rotation combination). Adopted as art because the plume-fed
        E-ring is isomorphic with the real Saturn E-ring, which strengthens the "E-ring" naming.
        (2) The albedo: exposed water ice cannot survive here at any brightness the albedo methodology's §6
        anchors allow. Chaos receives 1.30 AU-equivalent insolation, where the surface ice sublimates faster
        than the body's age permits: 0.089 m/yr at the old albedo 0.70, stripping 400 km in 4.5 Myr against a
        5.3 Gyr age. The survival threshold is albedo 0.875, above §6's fresh-water-ice band (0.6–0.8) and
        above Enceladus (0.81), the brightest body known. The owner chose to keep the bright ice as art and
        raise the albedo past that threshold rather than accept a dark lag-mantled surface. 0.91 was picked over the bare
        minimum so the threshold is cleared by 33× rather than marginally; ice loss over 5.3 Gyr is then 12 km of
        a 400 km radius. Recipe and its validation: ice-stability-methodology.md, whose worked example is this
        body; the threshold behaves the way Hayne & Aharonson found for a Ceres polar cap.
      evidence_ko: >
        이 행에는 오너 오버라이드가 둘 있다. (1) 플룸: 21 R_p·e 0.02에서 조석열이 수 MW뿐이라 엔셀라두스식
        cryovolcanism을 돌릴 지하 바다가 불가능하다(a⁻⁷·⁵가 치명적이며 e·a·공명·자전 전 조합을 확인했다).
        플룸이 채우는 E-고리가 실제 토성 E-고리와 동형이어서 "E-고리" 명명 정합을 강화하므로 아트로 채택했다.
        (2) 알베도: 알베도 방법론 §6이 인정하는 어떤 밝기로도 이 자리에서 노출된 물얼음이 버티지 못한다.
        Chaos가 받는 복사속은 태양계 1.30 AU 상당이고, 그 자리에서 표면 얼음은 천체의 나이보다 빨리 승화한다.
        구값 알베도 0.70에서 0.089 m/yr로, 나이 5.3 Gyr에 대해 반경 400 km를 4.5 Myr에 잃는다. 존속 임계는
        알베도 0.875이며 §6의 신선 물얼음 밴드(0.6–0.8)와 알려진 가장 밝은 천체 엔셀라두스(0.81) 위다.
        오너는 어두운 잔류층 표면을 받아들이는 대신 밝은 얼음을 아트로 유지하고 알베도를 그 임계 위로
        올리기로 했다. 최소치가 아니라 0.91을 택한 것은 임계를 간신히가 아니라 33배로 넘기기 위해서다.
        5.3 Gyr 동안의 얼음 손실은 반경 400 km 중 12 km다.
        레시피와 그 검증은 ice-stability-methodology.md에 있고 이 천체가 그 문서의 worked example이다. 임계가
        움직이는 방향은 Hayne & Aharonson이 세레스 극관에서 얻은 결과와 같다.
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-27: albedo 0.7 → 0.91, surface_temperature 200 K → 134 K. 구 짝(0.7 / 200 K)은 근거가
      없었고, 승화 안정성을 계산하니 0.70은 4.5 Myr에 소멸이었다. 오너가 어두운 잔류층 대안을 물리며
      밝은 얼음 유지 + 알베도 상향을 택했다. 경위는 prose-readability/context-notes.md.

