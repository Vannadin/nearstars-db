      표면을 가로지르는 균열이 그림자를 깊게 남기고, 활성 균열대에서 솟은 물 제트가 햇빛을 받아 밝게 흩어진다.
      대기가 없어 명암의 경계는 칼처럼 선명하다.
    fields:
      - { name: surface, value: "밝은 청백 얼음 (엔셀라두스형 frost, ice-blue #cdd9e4), Miranda 균열", op: set }
      - { name: emission_glow, value: "tiger-stripe 물 제트/플룸 빛산란 (무대기라 선명 그림자)", op: set }
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: >
        Plumes plus bright frost, the Enceladus look. Check: the tone link to the ice-blue E-ring holds by
        construction: the ring color was Mie-synthesized from icy-grain composition and Chaos is the grain
