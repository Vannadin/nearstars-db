      evidence_ko: "화산 분출 기원의 희박한 대기로, 안정 대기가 아님; stock atmosphereContainsOxygen=false."

  - body: Dante
    axis: environment.radiation
    status: gated
    driver: [window-selection, fiction]
    narrative: >
      Radiation here is extreme, around 7,200 rem/day. It comes from Polyphemus's radiation belt, which Dante's
      own volcanic plasma feeds.
    narrative_ko: >
      방사선이 극심해 하루 약 7,200 rem에 이른다. 이 방사선은 Dante 자신의 화산 플라스마가 공급하는 Polyphemus
      방사선대에서 온다.
    fields:
      - { name: radiation, value: "~7,200 rem/day (극심)", op: set, note: "우리 belt 모델 내대 300 rad/h ×24h ≈ 7,200 rad/day; 아바타 게임 설정 하한 >4,500 초과" }
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    gate:
      criterion: [canon-consistency, derived-grounding]
      verdict: pass-in-window
      evidence: >
        Our value: the Polyphemus inner belt is 300 rad/h (radiation_belts row); Dante at 1.54 R_p sits inside it, so
        ~300 rad/h × 24 h ≈ 7,200 rad/day ≈ 7,200 rem/day (rad≈rem), above the Avatar game's floor. The Avatar game's setting: "innermost moonlet >4,500 rem/day (Io 3,200)". Holds even with the weak 170µT field: belt intensity is governed by the source, not the field:
        Dante's ~1,200× Io volcanism supplies an enormous SO₂/sulfur plasma torus (a super-enhanced Io→Jupiter belt)
        → dense trapped particles → a strong belt. Causal loop: Dante's volcanism feeds the belt that bakes it. The Avatar game's setting >4500 ↔ dynamo 170µT
        reconciled without conflict (no field inflation needed). cf. Pandora is protected per the film's setting by being "between the two belts".
      evidence_ko: >
        우리 값: 폴리페무스 내대 300 rad/h(radiation_belts 행), Dante(1.54 R_p)는 내대 안이라
        ~300 rad/h × 24h ≈ 7,200 rad/day ≈ 7,200 rem/day(rad≈rem)로 아바타 게임 설정 하한 위. 아바타 게임 설정 "최내곽 moonlet >4,500 rem/day(Io 3,200)". 약한 170µT 장에도 성립한다. 벨트 세기는 場이 아니라
        공급원(source) 지배: Dante ~1200× Io 화산이 막대한 SO₂/황 플라스마 토러스 공급(Io→목성 벨트 초강화판)
        → 조밀 트랩 입자 → 강벨트. 인과고리: Dante 화산이 자신을 굽는 벨트를 먹임. 아바타 게임 설정 >4500 ↔ dynamo 170µT
        충돌 없이 화해(場 발산 불요). cf. Pandora는 영화 설정대로 "두 벨트 사이"라 보호.

  - body: Dante
    axis: gameplay
    status: gated
    driver: [engine]
    narrative: >
      Landing here is very hard. Brief touchdowns are possible in the lava-free areas, where the ground is merely
      oven-hot, but the extreme radiation makes it impossible to stay long. The surface divides into six: Grand Chasma / Lava Lakes (the
      hottest ground, on the face turned to Polyphemus) / Sulfur Plains / Basalt Plains (the far side) /
      Volcanic Cones / Poles (set by position, not season). The sight worth the trip is the great chasm with
      lava lakes on its floor.
    narrative_ko: >
      착륙 난도는 매우 높다. 용암이 없는 지역이라면 땅이 오븐 정도로만 뜨거워 잠시 내려앉을 수는 있지만, 극심한
      방사선 탓에 오래 머물기는 어렵다. 지표는 여섯으로 갈린다. 대협곡(Grand Chasma) / 용암호 사슬(Lava Lakes, Polyphemus
      대면측이라 가장 뜨겁다) / 황 평원(Sulfur Plains) / 현무암 평원(Basalt Plains, 반대면) /
      화산추·칼데라(Volcanic Cones) / 극(Poles, 계절이 아니라 위치로 갈린다). 그중 가장 볼 만한 곳은 바닥을
      용암호가 채운 대협곡이다.
    fields:
      - { name: science_biomes, value: "6: Grand Chasma / Lava Lakes / Sulfur Plains / Basalt Plains / Volcanic Cones / Poles", op: set, colors: {"Grand Chasma":"#3A3B4A","Lava Lakes":"#C8492C","Sulfur Plains":"#C9A93E","Basalt Plains":"#4E463F","Volcanic Cones":"#7E4A3C","Poles":"#D8D0B6"} }   # provisional naturalistic biome-map display colors (S↓, lava = accent)
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: "Landing is very hard: brief touchdowns are possible on the lava-free far side, where the plains are 360 K, but extreme radiation (~7,200 rem/day) rules out any long stay. The six biomes include a geographic (not seasonal) Poles biome, since the moon is tide-locked with obliquity ~0. Sulfur Plains survives as a biome because solid sulfur is stable at the plains temperature (surface row)."
      evidence_ko: "착륙 난도 매우 높음: 평원이 360 K인 용암 없는 far-side에 단기 착륙은 가능하나 극심한 방사선(~7,200 rem/day)으로 장기 체류 불가. 조석고정+obliquity~0이라 극(Poles) 바이옴은 seasonal이 아닌 지리적 구분이다. 황 평원 바이옴이 남는 것은 평원 온도에서 고체 황이 안정하기 때문이다(surface 행)."

  - body: Hades                    # A b II
    axis: identity
    status: gated                  # facet-walk 2026-06-22
    driver: [fiction]
    fictional: true            # 실제 관측된 천체가 아님 (DB 대조 검사 면제)
    narrative: >
      Hades is the second of Polyphemus's moons, a rocky body about 750 km across that looks like a gray Ganymede
      but is silicate rather than icy. Formally the second moon (Alpha Centauri A b II), it keeps the Avatar name
      Hades as its cultural name in descriptions only. It is pure fiction, with no real detection behind it.
    narrative_ko: >
      Hades는 Polyphemus의 둘째 위성으로, 지름 750 km 안팎의 암석 천체다. 회색 가니메데처럼 보이지만 조성은
      얼음이 아니라 규산암이다. 공식적으로는 둘째 위성(Alpha Centauri A b II)이며, 아바타 이름 Hades는 설명
      텍스트에만 붙는 문화명이다. 실제 검출이 존재하지 않는 픽션 천체이다.
    fields:
      - { name: body_type, value: "rocky moon (750 km, 5.0e21 kg, ρ ~2830 kg/m³, 규산암·비빙질)", op: set }
      - { name: designation, value: "Alpha Centauri A b II", op: set }
      - { name: cultural_name, value: "Hades", op: set }
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        Classified a rocky moon behind a gray Ganymede-like face. Check: ρ ≈ 2830 kg/m³ is silicate, not
        ice, so the gray is surface color rather than composition; the surface row's half-adopted film
        reading (gray and non-luminous at 278 K) supplies it. Designation Alpha Centauri A b II; fictional,
        so the db-parity check does not apply.
      evidence_ko: >
        회색의 가니메데형 얼굴을 한 암석 위성으로 분류. 확인: 밀도 ~2830 kg/m³는 얼음이 아니라 규산암 범위라
        회색은 조성이 아니라 표면색이고, 그 색은 영화 설정을 절반 채택한 surface 행(278 K의 회색·비발광)이
        든다. 명명은 Alpha Centauri A b II, 픽션 천체라 DB 대조 검사는 면제.

