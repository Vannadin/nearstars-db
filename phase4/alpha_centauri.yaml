      궤도에서 본 Pandora는 초록빛이 감도는 지구와 같은 모습을 띠고 있다. 표면의 절반 가량이 바다이며, 흰 구름
      아래로 식생의 초록이 대양의 파란색과 어우러진다. Pandora의 밤은 매우 화려하다. 생물발광이 해안선을 따라
      번지며, 대기 상층부에서는 격렬한 오로라가 타오른다. 특히 강한 국소 자기장을 띠고 있는 지역의 하늘에 독특한
      형태의 오로라가 더해진다.
    fields:
