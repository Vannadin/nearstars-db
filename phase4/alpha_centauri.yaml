      임무 난이도 등급은 모드-지원 관심사). 구값 "임무=거주가능 세계 착륙(최대 보상)".
    status: gated
    driver: [engine]
    narrative: >
      Pandora is the most interesting destination in Alpha Centauri, and the only world in the system where a
      person can breathe. The surface divides into seven: Oceans / Coastlines (bioluminescent) / Rainforest
      Lowlands / Highland Mountains / Volcanic Belts / Ice Peaks & Polar Caps / Geometric Formations (the
      magnetic-anomaly ground). Its most compelling site is the flux-vortex region, where geometric structures
      and a local aurora together make the one landing worth the whole journey.
    narrative_ko: >
      Pandora는 Alpha Centauri에서 가장 흥미로운 목적지다. 이 계에서 유일하게 사람이 숨 쉴 수 있는 세계이기도
      하다. 지표는 일곱으로 갈린다. 대양(Oceans) / 해안(Coastlines, 생물발광) / 우림 저지대(Rainforest
      Lowlands) / 고지대 산맥(Highland Mountains) / 화산대(Volcanic Belts) / 빙봉·극관(Ice Peaks & Polar
      Caps) / 기하 구조물(Geometric Formations, 자기 이상대). 그중 가장 매력적인 곳은 플럭스 볼텍스 구역으로,
      기하학적 구조물과 국소 오로라가 어우러져 이 한 곳이 여정 전체를 값어치 있게 만든다.
    fields:
      - { name: science_biomes, value: "7: Oceans / Coastlines / Rainforest Lowlands / Highland Mountains / Volcanic Belts / Ice Peaks & Polar Caps / Geometric Formations (Flux-Vortex)", op: set, colors: {"Oceans":"#2A5C99","Coastlines":"#35B8A0","Rainforest Lowlands":"#3E7A3A","Highland Mountains":"#7A6A5A","Volcanic Belts":"#9A4A38","Ice Peaks & Polar Caps":"#D6E4EA","Geometric Formations (Flux-Vortex)":"#7A44C8"} }   # provisional naturalistic biome-map display colors (S↓; biolum coast + flux-vortex = accents)
      - { name: sphere_of_influence_tuning, value: "auto from mass", op: passthrough }
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        Surface present → formal biome map (7): Oceans / Coastlines (bioluminescence) / Rainforest Lowlands /
        Highland Mountains / Volcanic Belts / Ice Peaks & Polar Caps / Geometric Formations (Flux-Vortex),
        high-magnetic-anomaly special science. NearStars's only habitable body, so the richest biome map. In the
        flux-vortex zone, place distinctive structures (geometric rock formations + magnetic-anomaly terrain) + a local
        aurora separate from the polar cap (see appearance.aurora). SOI=auto from mass; full ScienceValues.
        Unobtanium only as a report mystery (report_flavor).
      evidence_ko: >
        표면 있음 → 정식 biome map(7): 대양 / 해안(생물발광) / 우림 저지대 / 고지대 산맥 / 화산대 / 빙봉·극관 /
        기하 구조물(플럭스 볼텍스), 고자기 이상 특수 과학. NearStars 유일 거주가능체라 가장 풍부한 biome map. 플럭스
        볼텍스 구역엔 기하학적 암석 구조물 + 자기 이상 지형 배치 + 극관과 별개의 국소 오로라(appearance.aurora
        참조). SOI=질량서 자동; ScienceValues 전체. 언옵타늄은 report 미스터리로만(report_flavor).

  - body: Cassandra                # A b IV
    axis: identity
    status: gated                  # facet-walk 2026-06-22
    driver: [fiction]
    fictional: true            # 실제 관측된 천체가 아님 (DB 대조 검사 면제)
    narrative: >
      Cassandra is the fourth moon orbiting Polyphemus, some 3,400 km in radius and the second largest of them. It
      carries a thin atmosphere and looks able to support microbial life. Officially it is Alpha Centauri A b IV, while
      the name Cassandra comes from material the studio released rather than the films themselves, and the moon does
      not really exist.
    narrative_ko: >
      Cassandra는 Polyphemus를 도는 넷째 위성으로, 반경 3400 km가량에 위성들 가운데 둘째로 크다. 얇은 대기를
      두르고 있으며 미생물이 생존할 수 있을 것으로 보인다. 공식 이름은 Alpha Centauri A b IV이고, Cassandra는 영화
      본편이 아니라 제작사가 공개한 설정에서 온 명칭으로 실제로 존재하지는 않는다.
    fields:
      - { name: body_type, value: "큰 암석 위성 (반경 3400 km), 얇은 대기 + 한계 거주 (미생물급)", op: set }
      - { name: designation, value: "Alpha Centauri A b IV", op: set }
      - { name: cultural_name, value: "Cassandra", op: set }
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
