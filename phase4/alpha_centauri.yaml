    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-06-21: 이 행이 구 appearance.rings 결정을 대체했다. 원안은 디스크를 가로지르는 얇고 어두운
      framing line(Beichman §5.3 ring-model 반경 fit 채택, 관측 우선)이었고, 미해결이던 "고리 위치 =
      로슈 한계 분석"이 별개로 남아 있었다. 얇은 Roche-zone 밀집고리를 폐기하고 흐릿한 연속 E고리로 갔다.
