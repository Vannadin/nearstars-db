  - body: Hades
    axis: bulk.tidal_heating
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-26: "~400× Io이나 k₂/Q 낮아 텍토닉으로 발현" 폐기 → ~15× Io, 207 W/m².
      기각 이유는 evidence의 두 논거. 대안(Hades e 하향)은 안정성 시뮬 3런으로 기각 —
      e_init 0.005/0.010/0.020 모두 e_max 0.047~0.064로 복귀(판도라가 강제), Dante e는 무영향.
      스캔은 phase3/stability-sim/results/_hades_lowe_scan/. 오너가 rocky 밴드 하단 채택.
    status: gated
    driver: [window-selection, fiction]
    narrative: >
      Tides keep Hades warm from the inside, releasing about fifteen times the heat Io does. That tidal heat drives the
      surface temperature dramatically higher. Only a thin shell of rock separates the surface from melt below, so the
      crust is young everywhere and no ancient landscape survives on it.
    narrative_ko: >
      조석이 Hades를 안에서부터 데워, 이오의 열다섯 배쯤을 내놓는다. 이 조석열은 지표면의 온도를 극단적으로 높인다.
      표면과 아래의 용융부 사이를 가르는 것은 얇은 암석 껍질뿐이라, 지각은 어디나 젊고 오래된 지형은 남지 못한다.
    refs: ["docs/reference/tidal-heating-methodology.md", "docs/reference/moon-energy-budget-methodology.md", "phase3/stability-sim/STABILITY_REPORT.md"]
    fields:
      - { name: tidal_heating, value: "~15× Io (207 W/m² 표면 플럭스; rocky band 하단 k₂/Q=1e-3, e_rms 0.0385)", op: set, note: "밴드 전체는 15–146× Io (k₂/Q 1e-3–1e-2), 표면 278–444K" }
    gate:
      criterion: [canon-consistency, physics]
      verdict: owner-override
      evidence: >
        Adopted: the rocky band's low end, 207 W/m², ~15× Io, T_eq 278 K (~5 °C).
        Check: the eccentricity is the stability sim's forced value, not an assumption. Three runs with
        e_init 0.005/0.010/0.020 all return e_max 0.047–0.064 (Pandora, 770× Hades's mass at period ratio
        2.22, forces it; an initial condition cannot lower it). Simulated e_rms = 0.0385 with the
        methodology's rocky band k₂/Q = 1e-3~1e-2 gives 207–2071 W/m² (15–146× Io) and a four-term satellite
        T_eq of 278–444 K, against 141 W/m² of absorbed starlight. Film vs Avatar-game settings: the Avatar game's ">900 K
        red-hot Hades" stays unadopted; the film's "cold gray plain" is half-adopted: gray and non-luminous
        holds (a 278 K blackbody emits ~1e-20 of its power in the visible, far below the ~798 K Draper
        point), the ancient cratered plain does not (a ~10 m conductive lid over melt resurfaces
        continuously). Caveat: the flux is above the melting threshold, where fixed-Q is unreliable; an
        Andrade/Maxwell treatment could move it by >10×, and that gap is the error bar (tidal-heating doc,
        caution 3). The two refuted counter-arguments live in tidal-heating-methodology §7 (Hades entry).
      evidence_ko: >
        채택값은 rocky 밴드 하단인 207 W/m², 이오의 약 15배, T_eq 278 K(약 5 °C).
        확인. 이심률은 가정이 아니라 안정성 시뮬의 강제값이다. 초기 e를 0.005/0.010/0.020으로 넣은 세 런 모두
        e_max 0.047~0.064로 복귀했다(질량 770배의 Pandora가 주기비 2.22로 강제하므로 초기 조건으로는 낮출 수
        없다). 시뮬 e_rms 0.0385에 방법론의 rocky 밴드 k₂/Q = 1e-3~1e-2를 적용하면 207~2071 W/m²(이오의
        15~146배), 4항 위성 T_eq 278~444 K가 되고, 흡수 별빛은 141 W/m²다. 영화·아바타 게임 설정 대조. 아바타 게임의
        ">900 K 붉은 Hades"는 미채택 유지, 영화의 "차가운 회색 평원"은 절반 채택이다. 회색·비발광은 성립하고
        (278 K 흑체의 가시 몫은 약 1e-20으로 Draper 점 약 798 K에 한참 못 미친다), 오래된 크레이터 평원은
        성립하지 않는다(용융부 위 ~10 m 전도 지각이 계속 갈아엎힌다). 유보: 플럭스가 용융 문턱 위라 fixed-Q의
        신뢰도가 떨어지고, Andrade/Maxwell 처리는 값을 10배 이상 옮길 수 있다. 그 간격이 오차 막대다
        (tidal-heating 문서 caution 3). 격파된 반론 둘은 tidal-heating-methodology §7의 Hades 항목으로 옮겼다.

  - body: Hades
    axis: surface
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-26: surface_temperature 225 K → 278 K. 구값은 별빛만 계산에 "내부 조석열 기여
      미미" 메모가 붙어 있었으나 조석 207 W/m² > 별빛 141 W/m². 오너 승인으로 오래된 크레이터
      지형 폐기(용융부 위 지각 10 m), surface_type도 그에 맞춰 교체.
      2026-08-03: Dante 온도 재마감에 맞춰 evidence의 Dante 대비 문장만 갱신(360 K 평원·지각 ~2 m).
      이 행의 수치 필드는 무변경.
    status: gated
    driver: [fiction, window-selection]
    narrative: >
      Hades is a gray rocky moon that looks like Ganymede. Strong tides resurface it over and over, so no old craters
      remain, and that tidal heat holds the surface near 278 K. That is high for an airless body, and it barely drops
      at night.
    narrative_ko: >
      Hades는 가니메데의 외형을 닮은 회색 암석 위성이다. 강한 조석력으로 인해 지표면이 반복해서 갈아엎어져 오래된
      크레이터는 존재하지 않으며, 조석열로 인해 표면이 278 K 안팎에 머문다. 대기가 없는 천체로서는 높은 값이며,
      밤에도 온도가 거의 떨어지지 않고 유지된다.
    refs: ["docs/reference/moon-energy-budget-methodology.md", "docs/reference/tidal-heating-methodology.md", "docs/reference/surface-color-albedo-methodology.md"]
    fields:
      - { name: surface_type, value: "회색 rocky, 젊은 지표 (홈/단층 지형 지배, 오래된 크레이터 없음, 얇은 지각 상시 재포장)", op: set }
      - { name: albedo, value: 0.30, op: set, note: "중간 회색(달 고지대급), 오너 B" }
      - { name: surface_temperature, value: 278, unit: K, op: set, note: "4항 Teq: 조석 207 W/m²가 별빛 141 W/m²를 압도 → 내부열이 지배; 구값 225K는 조석 항 누락" }
    gate:
      criterion: [canon-consistency]
      verdict: pass-in-window
      evidence: >
        [FILM] gray plain + tidal energy=tectonic grooves (Ganymede grooved-terrain analogy). Composition=rock/silicate (not icy:
        water ice is unstable; Ganymede was a morphology analogy, not composition). Chemical-composition facet skipped (low-impact).
        albedo 0.30=owner B (medium gray, lunar-highland class); A (0.18 dark)·C (0.43 Ganymede-class) not adopted.
        surface_temperature 278 K, not the starlight-only value. Albedo 0.30 + α Cen A insolation alone would give
        225 K, and internal tidal heat is not negligible against it: the tidal term is 207 W/m²
        against 141 W/m² of absorbed starlight, so internal heat DOMINATES and the star is the minor contributor
        (bulk.tidal_heating row for the chain and the k₂/Q band). Two consequences follow. Day-night and eclipse
        variation nearly vanishes, because an internally heated surface does not track the sky. And the old cratered
        terrain goes: a 10 m conductive lid over melt resurfaces continuously, so grooves and faults are the only
        landforms that survive. Visual contrast with Dante no longer rests on ambient temperature, which is close on
        both (Dante's plains 360 K, Hades 278 K); it rests on exposed melt. About a twentieth of Dante is open lava
        under a ~2 m lid, while Hades has none under 10 m.
        KSP auto-derives an airless body's temperature from flux+albedo, so emit must inject the internal term
        explicitly rather than relying on the stock path.
      evidence_ko: >
        [FILM] 회색 밋밋 + 조석에너지=텍토닉 홈(가니메데 grooved terrain 유추). 조성=암석/규산염(빙질 아님,
        水빙 불안정; 가니메데는 형태학 유추지 조성 아님). 화학조성 facet 스킵(저임팩트).
        albedo 0.30=오너 B(중간 회색, 달 고지대급); A(0.18 어두움)·C(0.43 가니메데급)은 미채택.
        surface_temperature는 별빛만의 값이 아니라 278 K다. albedo 0.30 + α Cen A 입사량만으로는 225 K이고, 내부
        조석열은 그에 비해 무시할 수 없다. 조석 항이 207 W/m²로 흡수 별빛 141 W/m²를
        넘어서므로 내부열이 지배하고 별이 부수적이다(사슬과 k₂/Q 밴드는 bulk.tidal_heating 행 참조). 두 가지가
        따라온다. 내부에서 데워지는 표면은 하늘을 따라가지 않으므로 낮밤·식 변동이 거의 사라진다. 그리고 오래된
        크레이터 지형이 사라진다. 용융부 위 10 m 전도 지각은 계속 갈아엎히므로 살아남는 지형은 홈과 단층뿐이다.
        Dante와의 시각 대비는 더 이상 주변 온도에 있지 않다(Dante 평원 360 K, Hades 278 K로 비슷하다). 대비는
        노출 용융부에 있다. Dante는 약 20분의 1이 열린 용암이고 그 아래 지각이 ~2 m인데, Hades는 10 m 지각
        아래로 지표 용암이 없다. KSP는 대기 없는 천체 온도를 flux+albedo로 자동 산출하므로,
        emit에서 내부열 항을 명시적으로 주입해야 하며 스톡 경로에 기대면 안 된다.

