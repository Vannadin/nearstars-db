  - body: Pandora
    axis: magnetism.radiation_belts
    status: gated                 # 2026-07-24 refit — 물리값 보존, 지오메트리만 L-셸 피팅 + 필드 구조화
    driver: [window-selection]
    refs: ["docs/reference/planetary-magnetosphere-geometry-methodology.md", "docs/reference/solar-system-radiation-belts.md"]
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-24: 이 행이 구 결정을 대체했다(오너 승인). 물리값은 그대로 보존하고, 손수 짠 토러스 지오메트리를
      L-셸 수치 피팅으로 교체했으며 패킹 문자열이던 radiation_model을 emitter가 직접 읽는 개별 cfg 필드로
      구조화했다. radiation_inner는 그 전에 2.0(약장 gap-기아 가정)에서 4.0으로 올라와 있었다.
      2026-07-28: 이력만 담고 있던 superseded 행을 삭제하고 여기로 옮겼다.
    narrative: >
      Pandora keeps a single thin radiation belt of its own, tucked just above the atmosphere. Its magnetosphere is squeezed
      small, embedded inside Polyphemus's far larger field, so there is room for only one narrow belt where Earth would have
      two. That belt is an orbital-altitude hazard that feeds the aurora rather than a danger at the surface, which the field
      itself shields; the dipole leans about ten degrees.
    narrative_ko: >
      판도라는 제 몫의 얇은 방사선대 하나를 대기 바로 위에 두르고 있다. 자기권이 Polyphemus의 훨씬 큰 자기장 안에 파묻혀
      작게 눌린 탓에, 지구라면 두 겹일 자리에 좁은 벨트 한 겹만 들어선다. 이 벨트는 지표가 아니라 궤도 고도의 위협이라
      오로라를 먹일 뿐, 지표는 자기장이 따로 막아 준다. 쌍극은 약 10° 기울어 있다.
    fields:
      - { name: radiation_model, value: nearstars_pandora, op: set }
      - { name: inner_dist, value: 1.0193, unit: R_moon, op: set }
      - { name: inner_radius, value: 0.8489, unit: R_moon, op: set }
      - { name: inner_deform_xy, value: 0.7196, op: set }
      - { name: inner_border_dist, value: 0.0971, unit: R_moon, op: set }
      - { name: inner_border_radius, value: 0.9349, unit: R_moon, op: set }
      - { name: inner_border_deform_xy, value: 0.8829, op: set }
      - { name: pause_radius, value: 2.99, unit: R_moon, op: set, note: "= 노즈(standoff) 2.6 × comp 1.15 (nose = pause_radius/pause_compression)" }
      - { name: pause_compression, value: 1.15, op: set }
      - { name: pause_extension, value: 0.6, op: set }
      - { name: radiation_inner, value: 4.0, unit: "rad/h", op: set, phase3_default: "2.0 (구값: 약장 gap-기아 가정)" }
      - { name: radiation_pause, value: -0.01, unit: "rad/h", op: set }
      - { name: geomagnetic_pole_lat, value: 80, unit: deg, op: set, note: "= 90° − 자기축 기울기 ~10°; magnetic_dipole_tilt_deg 확정 시 따름" }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        Physics per the magnetosphere-geometry methodology Part D, strong-field embedded sub-regime 3b: field-crossover
        standoff (B_moon 75 / B_parent_local 3.9)^(1/3) ≈ 2.6 R_moon, a real CRAND belt off the thick atmosphere
        (Earth-KIND, not Ganymede-negligible), GCR-screened by Polyphemus + gap-starved to 4 rad/h ≈ 0.4× ROKerbalism
        Earth's 10.4, single narrow belt since the compressed magnetosphere has no room for Earth's two, conf low with
        no Solar-System exemplar (Ganymede is the weak-field 3a contrast). Geometry = fit_belts.py
        fit of the closed-line drift shell L 1.15–2.2 with the 1.05 loss-cone cut (IoU 0.98, same standard as the solar-system
        audit); pause encoded with the audited nose semantics, standoff 2.6 preserved exactly (pause_radius 2.99 / compression
        1.15); the packed radiation_model string became individual cfg fields the emitter reads directly.
      evidence_ko: >
        물리는 자기권-지오메트리 방법론 Part D 강장 임베디드 sub-regime 3b를 따른다. 場교차 standoff
        (B_moon 75 / B_parent_local 3.9)^(1/3) ≈ 2.6 R_moon, 두꺼운 대기가 유지하는 실질 CRAND 벨트(지구-KIND이지
        가니메데식 무시가능이 아님), Polyphemus GCR 차폐 + gap 기아로 4 rad/h(ROKerbalism 지구 10.4의 ~0.4배),
        압축 자기권이라 지구식 2벨트가 못 들어가 단일 좁은 벨트, conf low이며 태양계 선례 없음(실제 약장 대조군은
        가니메데 3a). 지오메트리 = 폐쇄 자력선 드리프트 셸 L 1.15–2.2 + 손실원뿔
        컷 1.05를 fit_belts.py로 피팅(IoU 0.98, 태양계 감사와 동일 기준). pause = 감사된 노즈 의미론으로 인코딩, standoff
        2.6 정확 보존(pause_radius 2.99 / compression 1.15). 패킹 문자열이던 radiation_model은 emitter가 직접 읽는 개별
        cfg 필드로 구조화.

  - body: Pandora
