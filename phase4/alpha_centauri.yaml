  - body: Pandora
    axis: bulk                     # mass/radius/gravity/rotation/obliquity (facet-walk 2026-06-22)
    body_class: tidally_locked     # §3.2 템플릿 앵커
    status: gated
    driver: [fiction, window-selection]
    narrative: >
      The film Avatar's setting gives four physical values that cannot all be true at once, so only the two a
      visitor would actually feel (the size and the 0.8 g gravity) are kept and the rest derived from them through
      the methodology, landing the density realistically between Mars and Earth. The day is 32 hours, tide-locked
      to Polyphemus, chosen over the film's 27 because the wider orbit keeps the ocean's tidal budget safely below
      runaway. The axis tilt is simply the orbit's own ~10° lean (the design mean; the emitted snapshot leans ~18°
      at epoch). For a tide-locked moon the source material's "29°" is
      simply impossible. Inside, radioactive decay and a gentle tidal heating keep the rock warm enough to drive
      the volcanoes, the fast continental drift, and the magnetic dynamo all from the same fire; the tide also
      pulls the moon faintly egg-shaped, invisible to the eye but real to the Principia orbit.
    narrative_ko: >
      영화 아바타의 배경 설정이 제공하는 네 개의 물성 값은 동시에 다 맞을 수가 없다. 그래서 방문자가 실제로
      체감하는 두 값, 크기와 0.8g 중력만 살리고 나머지는 두 값을 기반으로 방법론을 통해 도출했다. 그 결과 밀도는
      화성과 지구 사이 현실적인 값에 자리잡았다. 하루는 32시간이고 Polyphemus에 조석고정돼 있다. 영화의 27시간
      대신 이 값을 고른 건, 궤도가 더 넓어야 바다에 걸리는 조석 부담이 폭주하지 않고 안전하게 유지되기 때문이다.
      자전축 기울기는 궤도가 기운 ~10° 그대로다(설계 평균 기준, emit 스냅샷은 epoch에서 ~18°). 조석고정된
      위성에게 원작 설정의 "29°"는 애초에 불가능한 값이다.
      내부에서는 방사성 붕괴와 잔잔한 조석 가열이 암석을 데워, 화산과 빠른 대륙이동과 자기 다이나모를 모두 같은
      열원으로 돌린다. 조석은 달을 아주 살짝 계란 모양으로 잡아당기는데, 시각적으로는 보이지 않지만 프린키피아
      궤도에는 영향을 준다.
    fields:
      - { name: radius, value: 5724, unit: km, op: set, note: "canon 지름 11,447" }
      - { name: mass, value: 3.85e24, unit: kg, op: set, phase3_default: "옵션 B: 0.8g 고정 → 0.645 M⊕" }
      - { name: gravity, value: 7.84, unit: m/s2, op: set, note: "= 0.8 g, 영화 설정 체감값; GM/R² 일치" }
      - { name: flattening, value: 5.2e-3, op: set, note: "= (5/2)·J₂ 평균적도 spheroid, 시각상 사실상 구 (a−c≈47 km는 C22 행 note)" }
      - { name: reference_radius, value: 5724, unit: km, op: set, note: "J2/C22 기준 반경 = radius" }
      - { name: rotation_period, value: 32, unit: h, op: set, note: "조석고정 (canon 27h 대신)" }
      - { name: obliquity, value: 10, unit: deg, op: set, note: "궤도경사서 옴" }
      - { name: internal_heat, value: "방사성 + 약한 조석 (e강제 ~0.005) → 화산·대륙이동·dynamo 구동", op: set }
      - { name: geopotential_j2, value: 2.06e-3, reference_radius_km: 5724, op: set, note: "= 10/3·C̄₂₂, φ0.95, 0.645 M⊕(3.85e24 kg) 재계산 (구 5.5e-4계는 기각된 0.72 M⊕ 기반)" }
      - { name: geopotential_c22, value: 6.2e-4, op: set, note: "조석 삼축; 편평 0.83%(a−c≈47 km), 시각상 구, 궤도 섭동에만 실재" }
      - { name: age, value: 5.3, unit: Gyr, op: set }
      - { name: spin_axis_orientation, value: "orbit normal", op: set }
    refs: ["docs/reference/mass-radius-relation-methodology.md", "docs/reference/body-figure-methodology.md", "docs/reference/cassini-state-obliquity-methodology.md", "docs/reference/tidal-locking-timescale-methodology.md", "docs/reference/tidal-heating-methodology.md", "phase3/stability-sim/STABILITY_REPORT.md"]
    gate:
      criterion: [canon-consistency, physics]
      verdict: owner-override
      evidence: >
        Canon 4 values (0.72 M⊕·0.8g·5724km·1.2 ρ⊕) mutually inconsistent → adopt radius+gravity (option B), derive
        mass 0.645 M⊕ (3.85e24 kg)·density ~0.89 ρ⊕ (~4900 kg/m³, Mars↔Earth). Canon 1.2 ρ⊕ (=6617 kg/m³) requires
        super-Mercury iron fraction (unrealistic for a habitable body) and contradicts canon's own mass+radius
        (→0.99 ρ⊕) → rejected. rotation=tidal lock 32h (vs canon 27h: ocean tidal-budget robustness, see
        satellites final_2026_06_21); obliquity canon 29°→~10° = the orbital inclination (locked moon: "spin-axis
        29°" originally meant the orbital-plane obliquity, not a free axis). internal_heat=radiogenic + weak tidal
        (forced e ~0.005), shared source with volcanism·drift·dynamo. Tidal C̄₂₂≈6.2e-4 (φ=0.95, recomputed for
        0.645 M⊕), flattening 0.83%, visually spherical, real to the orbit (body-figure-methodology.md).
        spin_axis=orbit normal; age 5.3 Gyr inherited. ✅ mass B re-sim STABLE (results/_pandora_massB, 1000yr
        TRACE+J2(0.023), |ΔE/E| 7.6e-9, 5 moons bound·calm·ejections 0, Pandora e≤0.0075 ocean-safe), a light
        perturber, as expected.
      evidence_ko: >
        canon 4값(0.72 M⊕·0.8g·5724km·1.2 ρ⊕) 상호 불일치 → 반경+중력 채택(옵션 B), mass 0.645 M⊕(3.85e24 kg)·
        밀도 ~0.89 ρ⊕(~4900 kg/m³, 화성↔지구) 도출. canon 1.2 ρ⊕(=6617 kg/m³)는 super-Mercury급 철 함량 필요
        (거주가능체에 비현실) + canon 자기 질량+반경(→0.99 ρ⊕)과도 모순 → 기각. rotation=조석고정 32h(canon 27h
        대신, 해양 조석예산 robustness, satellites final_2026_06_21 참조); obliquity canon 29°→~10° = 궤도경사
        (고정 위성: "자전축 29°"는 본래 궤도면 황도경사, 자유 축 아님). internal_heat=방사성 + 약한 조석(e강제
        ~0.005), 화산·대륙이동·dynamo와 열원 공유. 조석 C̄₂₂≈6.2e-4(φ=0.95, 0.645 M⊕ 재계산), 편평 0.83%,
        시각상 구, 궤도엔 실재(body-figure-methodology.md). spin_axis=궤도 법선; age 5.3 Gyr 상속. ✅ mass B
        재시뮬 STABLE(results/_pandora_massB, 1000yr TRACE+J2(0.023), |ΔE/E| 7.6e-9, 5위성 bound·calm·이젝션 0,
        Pandora e≤0.0075 해양안전). 예상대로 가벼운 교란체.

  - body: Pandora
    axis: atmosphere               # composition/pressure/temperature/greenhouse/breathability (group 4, facet-walk 2026-06-22)
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-26: temperature 290 K 유지, 회계 교체. 구 사슬 "Teq ~225K + 온실 +70K"는 온실
      이중 계산 → 4항 Teq 220.6K + 조석 45 W/m² = Teq 237K, + 온실 +54K = 291K. greenhouse
      필드도 +70K → +54K. refs에서 tidally-locked-temperature 제거(위성은 4항 예산이 Layer 1을
      대체), moon-energy-budget·tidal-heating·cassini-state 추가.
    status: gated
    driver: [fiction, window-selection]
    narrative: >
      The air follows the film's setting faithfully: mostly nitrogen with oxygen, a heavy dose of carbon dioxide,
      a strange xenon richness, and toxic traces that are lethal to Earth life. At the surface it runs about a
      tenth denser than Earth's. Raw sunlight at this distance would not warm it enough. The thick CO₂ greenhouse does
      most of the lifting and tidal heat from below supplies the rest, together bringing the surface to livable
      temperatures, with a gentle great-season swing as the parent planet rides its eccentric orbit.
    narrative_ko: >
      대기는 영화 설정을 충실히 따랐다. 질소가 주성분이고 산소가 있으며, 이산화탄소가 듬뿍에 제논이 유난히
      풍부하고, 독성 미량 성분까지 섞여 있어 지구 생명체에겐 치명적이다. 지표 기압은 지구보다 십분의 일쯤 높다.
      이 거리의 맨 햇빛만으로는 충분한 열이 제공되지 않는다. 두꺼운 CO₂ 온실이 대부분을 끌어올리고, 조석이 데우는
      내부열이 남은 몫을 보태 지표를 살 만한 온도로 만든다. 여기에 모행성이 찌그러진 궤도를 도는 리듬에 맞춰
      대계절이 잔잔하게 오간다.
    fields:
      - { name: composition, value: "N₂ 주성분 + O₂ + CO₂ >18% + Xe 5.5% + CH₄ + H₂S >1% (canon)", op: set }
      - { name: pressure, value: 1.1, unit: atm, op: set, note: "canon ~20% 빽빽" }
      - { name: temperature, value: 290, unit: K, op: set, note: "4항 Teq 220.6K + 조석 45 W/m² → Teq 237K, + CO₂ 온실 +54K = 291K; great-season ±15–25K" }
      - { name: greenhouse, value: "강함 (CO₂>18%+CH₄+H₂S 구동, +54K lift, 나머지는 조석)", op: set }
      - { name: scale_height, value: "도출 (무거운 CO₂+0.8g)", op: set }
      - { name: escape, value: "안정 (지구형 0.8g)", op: set }
      - { name: breathability, value: true, op: set, note: "O₂ 존재 but lore-독성; stock atmosphereContainsOxygen=true" }
    refs: ["docs/reference/greenhouse-warming-methodology.md", "docs/reference/moon-energy-budget-methodology.md", "docs/reference/tidal-heating-methodology.md", "docs/reference/cassini-state-obliquity-methodology.md", "docs/reference/exoplanet-atmosphere-methodology.md"]
    gate:
      criterion: [canon-consistency, physics]
      verdict: pass-in-window
      evidence: >
        Faithful to canon composition (N₂ + O₂ + CO₂ >18% + Xe 5.5% + CH₄ + H₂S >1%) and pressure (~1.1 atm, canon
        ~20% denser). The 290K accounting is worth stating precisely, because "Teq ~225K + greenhouse +70K, the
        lift is greenhouse not tidal" double-counts the greenhouse: the greenhouse recipe (greenhouse-warming,
        Layer 3 extrapolated band) gives this composition only +54K, and the stellar-only Teq is not 225K either.
        Grounded chain: four-term satellite Teq = 220.6K (moon-energy-budget:
        eclipses remove 7.7% of the starlight at 3.53 R_p, the parent returns 11.7 W/m² thermal + 4.9 reflected),
        plus solid-body tidal heating 45 W/m², giving Teq 237K; +54K greenhouse = 291K. So the lift IS partly tidal.
        The tidal term needs k₂/Q ≈ 0.0016 at the simulated e ≈ 0.005, which is fitted rather than predicted, but it
        is the same k₂/Q that puts the film's 27h orbit at 106 W/m² against a ~101 W/m² runaway ceiling: one
        interior model explains both the adopted 32h lock and the film's temperature. Sensitivity is severe: an
        Io-like k₂/Q = 0.015 would make Pandora a 369K steam world. Ocean tidal dissipation is a separate,
        depth-dependent term still unquantified; the obliquity channel that could run away is starved because the
        spin axis is orbit-normal (the recorded obliquity 10° is the orbital inclination, and the Cassini-state
        obliquity is sub-degree). great-season ±15–25K unchanged.
        scale_height derived (heavy CO₂ + 0.8g); escape stable (Earth-like 0.8g).
        breathability: KSP stock does not model toxicity → atmosphereContainsOxygen=true (jets·Kerbal breathing),
        human toxicity is a Kerbalism flag/report lore. Altitude T/P curves generated at emit from the
        cool-giant/Earth-like model (the eccentricity curve reads the parent Polyphemus e for the great-season,
        a delicate emit value, see the facet-checklist).
      evidence_ko: >
        canon 조성(N₂ + O₂ + CO₂ >18% + Xe 5.5% + CH₄ + H₂S >1%)·압력(~1.1 atm, canon ~20% 빽빽) 충실.
        290K의 회계를 정확히 적어둔다. "Teq ~225K + 온실 +70K, lift는 조석 아닌 온실"이라는 서술은 온실을 이중
        계산한다. 온실 레시피(greenhouse-warming, Layer 3 외삽 구간)가 이 조성에 주는 값은 +54K뿐이고, 별빛만의
        Teq도 225K가 아니다. 근거 사슬: 4항 위성 Teq = 220.6K(moon-energy-budget,
        3.53 R_p에서 식이 별빛의 7.7%를 걷어가고 모행성이 열복사 11.7 + 반사 4.9 W/m² 되돌려줌), 여기에 고체 조석
        45 W/m²를 더해 Teq 237K, +54K 온실 = 291K. 즉 lift에는 조석이 실제로 들어간다. 조석 항은 시뮬 e ≈ 0.005에서
        k₂/Q ≈ 0.0016을 요구하는데 이는 예측이 아니라 맞춘 값이다. 다만 같은 k₂/Q가 영화의 27h 궤도를 106 W/m²로
        올려 ~101 W/m² 폭주 천장을 넘긴다. 하나의 내부 모형이 채택된 32h 조석고정과 영화 설정 온도를 동시에 설명하는
        셈이다. 민감도는 가혹하다. 이오급 k₂/Q = 0.015면 판도라는 369K 증기 세계가 된다. 해양 조석 소산은 깊이에
        의존하는 별도 항으로 아직 미정량이고, 폭주를 낼 수 있는 기울기 채널은 자전축이 궤도 법선이라 굶주려 있다
        (기록된 obliquity 10°는 궤도 경사이고 Cassini 상태 기울기는 1도 미만). great-season ±15–25K는 그대로.
        scale_height 도출(무거운 CO₂+0.8g); escape 안정(지구형 0.8g). breathability: KSP 스톡은 독성 미모델 → atmosphereContainsOxygen=true(제트·Kerbal 호흡), 인간
        독성은 Kerbalism 플래그/레포트 lore. 고도별 T/P 커브는 emit 시 cool-giant/지구형 모델서 생성
        (eccentricity curve는 부모 폴리페무스 e를 읽어 great-season 반영, delicate emit 값, facet-checklist 참조).

  - body: Pandora
    axis: surface                  # type/hydrosphere/biosphere/tectonics/terrain/ice_caps/albedo/temp (group 5, facet-walk 2026-06-22)
    status: gated
    driver: [fiction, art-direction, window-selection]
    narrative: >
      Pandora is a mountain world with an even split of land and sea: more continent than Earth ever had, and
      almost none of it flat. Lush rainforest climbs the highlands, glowing faintly cyan along plants and
      coastlines at night, while active volcanic belts and unusually fast continental drift run on the same
      internal heat that powers the dynamo. Ice survives only on the highest summits and at the poles. Its most
      striking landform is a field of dramatic geometric rock formations at the flux-vortex site.
    narrative_ko: >
      Pandora는 육지와 바다가 반반인 산악 세계다. 지구가 가져본 적 없는 육지 비중인데, 그중 평평한 땅은 거의
      없다. 무성한 우림이 고지대를 타고 오르고, 밤이면 식물과 해안선을 따라 청록빛이 은은하게 번진다. 활발한
      화산대와 유난히 빠른 대륙이동은 다이나모까지 함께 돌리는 같은 내부열에서 나온다. 얼음은 최고봉 정상과
      극지방에만 남는다. 가장 인상적인 지형은 플럭스 볼텍스 지점에 솟은 극적인 기하학적 암석 구조물들이다.
    fields:
      - { name: surface_type, value: "지구형, 육지:대양 ≈ 50:50, 산악 우세", op: set }
      - { name: hydrosphere, value: "액체 물 대양/바다 (~50%, 290K 안정)", op: set }
      - { name: biosphere, value: "무성한 우림 + 고생물 다양성, 청록 생물발광", op: set }
      - { name: tectonics, value: "활화산대 + 빠른 대륙이동 (조석+방사성)", op: set }
      - { name: terrain, value: "산악+화산대+고지대 산맥, 플럭스 볼텍스 지점에 기하학적 자연 암석 구조물", op: set }
      - { name: ice_caps, value: "고봉 정상 + 극관에만 (제한적)", op: set }
      - { name: albedo, value: 0.30, op: set }
      - { name: surface_temperature, value: 290, unit: K, op: set }
    gate:
      criterion: [canon-consistency, physics]
      verdict: pass-in-window
      evidence: >
        The flux-vortex landmark is a field of natural geometric rock formations, built as PQS terrain.
        land:ocean ≈ 50:50 (vs Earth 30:70),
        mountains dominant·flatland scarce. hydrosphere=liquid water ~50%, stable at 290K (group 4 greenhouse);
        tectonics=active volcanic belts + fast drift (tidal+radiogenic, same origin as the dynamo). Ice caps=high
        peaks+polar caps only (limited at mean 290K); albedo ~0.30 (Earth-class from land·clouds·some ice/snow).
        Bioluminescence=subtle (a bit of plants + a bit of coastline) → rendered in the appearance row.
      evidence_ko: >
        플럭스 볼텍스 랜드마크는 자연 기하학 암석 구조물로, PQS 지형으로 구현. 육지:대양 ≈ 50:50(지구 30:70 대비),
        산악 우세·평지 희소. hydrosphere=액체 물
        ~50%, 290K 안정(group 4 온실); tectonics=활화산대 + 빠른 대륙이동(조석+방사성, dynamo와 동근).
        빙관=고봉+극관만(평균 290K라 제한적); albedo ~0.30(육지·구름·일부 빙설로 지구급). 생물발광=은은(식물
        약간 + 해안 약간) → appearance 행서 렌더.

  - body: Pandora                  # A b III
    axis: magnetism.magnetic_field
    status: gated
    driver: [window-selection, fiction]
    narrative: >
      Pandora carries a field roughly twice Earth's, a strength nearly unheard-of for a moon. The same tidal heat
      that fuels its volcanoes keeps the iron core churning, and the fast 32-hour spin organizes that churn into a
      clean dipole. The film's fictional unobtanium does not exist here, but where the field spikes around the
      geometric rock formations, the "flux vortex" produces a local aurora effect.
    narrative_ko: >
      Pandora는 위성으로서는 거의 전례가 없는 세기인 지구 두배 가량의 자기장을 갖고 있다. 화산을 지피는 것과
      같은 조석열이 철핵을 쉼 없이 휘젓고, 빠른 32시간의 자전이 그 소용돌이를 깔끔한 쌍극으로 정돈한다. 영화의
      가상 설정인 언옵타늄은 존재하지 않지만, 기하학적 암석 구조물 일대에서 자기장이 치솟는 "플럭스 볼텍스"는
      국소적인 오로라 효과를 제공한다.
    fields:
      - { name: magnetic_field, value: "75 µT (~1.8× 지구; rocky-dynamo ℳ⁺ 상한, 조석-구동 Fe 핵 dynamo, 32h 자전 쌍극)", op: set }
      - { name: magnetic_field_polar, value: 150, unit: uT, op: set }
    refs: ["docs/reference/rocky-planet-dynamo-methodology.md"]
    gate:
      criterion: [canon-consistency, physics]
      verdict: pass-in-window
      evidence: >
        Canon Fe core + strong magnetic field. Grounded in the rocky-dynamo ladder (RM22/OC06), NOT the giant energy-flux law (which would wrongly give a
        near-parent-giant field). At this density (0.89 ρ⊕) the iron core is medium-sized, not huge (super-Mercury), but tidal heat (forced e ~0.005)+radiogenic
        heat keep it vigorously convecting, and the fast 32 h spin keeps the dynamo dipolar → the ℳ⁺ upper bound, ~1.8× Earth (75 µT eq / 150 µT polar), not
        "Earth-class" but a strong few-×-Earth field, the interesting-first high end (earlier 140 µT ≈ 0.82× Polyphemus was giant-law over-application, rejected).
        Shares the same heat source (tidal heat) as the volcanism·fast continental drift (causally linked). Unusual among moons (only Ganymede has a
        weak dynamo). The unobtanium boost is excluded from the grounding (realism): just a strong intrinsic field. Not enough to levitate mountains
        (that is a canon/report mystery). Downstream report seed: the "seemingly able to mine what seems unminable"
        nuance: leak the flux-vortex mechanism into reports as a mystery/easter-egg without
        physical assertion; the high-field zone is a formal biome (gameplay row).
      evidence_ko: >
        영화 설정의 Fe 핵 + 강한 자기장. 암석형 다이나모 사다리(RM22/OC06)로 근거화, 거대행성 에너지플럭스 법칙 아님
        (그걸 쓰면 모행성급 자기장이 잘못 나옴). B밀도(0.89 ρ⊕)면 철핵은 거대(super-Mercury) 아닌 중간 크기지만,
        조석열(e강제 ~0.005)+방사성이 왕성히 대류시키고 빠른 32h 자전이 쌍극 유지 → ℳ⁺ 상한 ~1.8× 지구(적도 75 / 극 150 µT).
        "지구급"이 아니라 지구 수 배의 강장이며 interesting-first 상한 선택(이전 140 µT ≈ Polyphemus 0.82배는 giant-법칙 과적용이라 기각).
        화산·빠른 대륙이동과 같은 열원(조석열)을 공유(인과 묶임). 위성 중 이례적(가니메데만
        약한 dynamo). 언옵타늄 부스트는 grounding서 제외(현실고증). 그냥 강한 고유 자기장. 산을 띄울 정도는
        아님(그건 canon/report 미스터리). 후행 레포트 씨앗: "채굴 불가능할 것 같은 물질을 채굴할 수 있을 듯한"
        뉘앙스, 플럭스 볼텍스 메커니즘을 물리 단언 없이 미스터리/이스터에그로 레포트에 흘릴 것; 고자기장
        구역은 정식 바이옴(gameplay 행).

