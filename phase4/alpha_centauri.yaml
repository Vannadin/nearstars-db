    narrative: >
      Chaos runs against the other moons, so you cannot hop across from a neighbor; reaching it costs a
      separate bill to reverse your orbital direction. The surface divides into five: Chasmata (the 15–30 km
      cliffs) / Plume Vents (active fractures with water jets) / Icy Plains (fresh ice laid down by plume
      fallout) / Craters (the old terrain) / Poles (high latitude). The one worth going to is Plume Vents, where
      material that has just come up from below can be caught where it lands.
    narrative_ko: >
      다른 위성들과 반대 방향으로 도는 궤도라, 옆 위성에서 곧바로 건너올 수 없고 궤도 방향을 되돌리는 비용을
      따로 치러야 한다. 지표는 다섯으로 갈린다. 거대 균열대(Chasmata, 15~30 km 절벽) / 플룸 분출대(Plume Vents,
      물 제트가 솟는 활성 균열) / 얼음 평원(Icy Plains, 플룸 낙진이 덮은 신선 얼음) / 크레이터(Craters, 오래된
      지형) / 극(Poles, 고위도). 그중 가장 흥미로운 곳은 플룸 분출대로, 지하에서 갓 올라온 물질을 그 자리에서
      받을 수 있다.
