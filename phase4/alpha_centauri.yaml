  - body: Alpha Centauri A b
    kopernicus_name: Polyphemus
    axis: environment.radiation
    status: gated                 # 4b 완료 (2026-06-22)
    driver: [window-selection, engine]
    depends_on: "magnetism.magnetic_field / magnetosphere (위 두 행)"
    narrative: >
      Each moon gets its radiation station: Dante extreme (>4,500 rem/day), Hades severe, Pandora safe and
      livable, Cassandra intermediate, Chaos low but variable. The interesting reconciliation is that the field alone is too weak for
      the Avatar game canon's brutal numbers: it is Dante's furious volcanism, feeding sulfur plasma into the belts at roughly
      1,200 times Io's rate, that makes the inner zone so deadly without inflating the field. Pandora stays
      habitable exactly as the film says: it orbits in the gap between the two belts and shields its surface with
      its own field, a few times Earth's strength.
    narrative_ko: >
      위성마다 받는 방사선 등급이 다르다. 흥미로운 대목은 자기장만으로는 아바타 게임 설정의 가혹한 수치가 나오지 않는다는 것이다. Io의 약 1200배로
      끓는 Dante의 화산이 황 플라스마를 벨트에 퍼부어, 자기장을 부풀리지 않고도 안쪽 지대를 그렇게 치명적으로
      만든다. Pandora는 영화 설정 그대로 살 만하다. 두 벨트 사이 틈새를 돌면서 지구 수 배 세기의 자기장으로 표면을
      가린다. 위성별 등급: Dante 극심(>4,500 rem/day), Hades 심함,
      Pandora 안전·거주가능, Cassandra 중간, Chaos 낮음·가변.
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window        # 아바타 게임 설정 >4500은 Dante 화산-source로 화해(場 발산 불요)
      evidence: >
        Dose is set by field + source: despite 170µT (~0.4× Jupiter, ~8× Saturn; weak vs Jupiter for belt
        generation), Dante (~1,200× Io volcanism) supplies enormous SO₂/sulfur plasma to the belt, so a strong belt
        forms. Dante innermost extreme (>4,500 rem/day; it also sits inside its own source torus), Hades severe at the
        belt peak (2.07 R_p). The game's ">4,500
        rem/day" is reconciled via this volcanic source without inflating the field (see the Dante env.radiation
        row). Pandora is habitable via the gap between the two belts + its own strong intrinsic dipole (Fe-core
        dynamo, a few times Earth's strength; details in the Pandora magnetism row); unobtanium is excluded from the physics
        grounding. Pandora's distance is fixed by the 32h tidal lock and does not move.
      evidence_ko: >
        선량은 場+공급원으로 결정: 170µT(목성 ~0.4×, 토성 ~8×, 벨트생성엔 목성比 약함)이지만 Dante(~1200× Io
        화산)가 막대한 SO₂/황 플라스마를 벨트에 공급해 강벨트 성립. Dante 최내곽 극심(>4,500 rem/day; 자기 공급원
        토러스 안이기도 함), Hades는 벨트
        피크(2.07 R_p)에서 심함. 아바타 게임 설정 ">4,500 rem/day"는 場 발산 없이 이 화산-source로 화해(Dante env.radiation 행
        참조). Pandora는 두 벨트 사이 gap + 자체 강한 고유 dipole(Fe핵 dynamo, 지구 수 배; 세부는 Pandora
        magnetism 행)로 거주가능; 언옵타늄은 물리 grounding서 제외. Pandora 거리는 32h 조석고정에 묶여 이동 안 함.

  - body: Alpha Centauri A b
