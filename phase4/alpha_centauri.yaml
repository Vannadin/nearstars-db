      evidence_ko: "소형 얼음체라 dynamo 불가. 차폐는 애초에 문제가 아니다. Chaos는 21 R_p를 돌아 Polyphemus 자기권의 바깥 끝자리에 있고(자기권계면 23.5 R_p, Polyphemus.magnetism.magnetosphere) 벨트 밖이라 주변 방사선이 약하다(environment.radiation)."

  - body: Chaos
    axis: environment.radiation    # G8 facet-walk 2026-06-23
    status: gated
    driver: [window-selection]
    narrative: >
      The radiation Chaos takes is on the weak side, but not steady. It runs outside the belts, so most of the
      time conditions are mild; sitting just inside the boundary of the magnetosphere, though, a hard gust of
      stellar wind pushes that boundary inward and leaves the moon exposed for a while. Then it takes α Cen A's
      wind and the cosmic-ray flux directly.
    narrative_ko: >
      Chaos가 받는 방사선은 약한 편이지만 일정하지 않다. 벨트 밖을 돌아 평소에는 온건한데, 자기권 경계 바로
      안쪽이라 항성풍이 세게 밀려오면 경계가 밀려 들어와 한동안 그대로 노출된다. 그때는 α Cen A의 항성풍과
      우주선을 직접 맞는다.
    fields:
      - { name: radiation, value: "낮음/가변 (21 R_p, 벨트 밖 + 자기권계면 23.5 R_p 안쪽; 항성풍 압축 시 노출)", op: set }
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: "Chaos orbits at 21 R_p: outside the radiation belts (outer belt ends at L 10, Polyphemus.magnetism.radiation_belts) and inside the 23.5 R_p magnetopause (Polyphemus.magnetism.magnetosphere). Hence weak but variable: the variability is stellar-wind compression pushing the standoff below 21 R_p, not the moon sitting on the boundary. wind/activity/heliosphere/flares/uv/HZ=star-level ∅."
      evidence_ko: "Chaos는 21 R_p를 돈다. 방사선대 밖이고(외대가 L 10에서 끝난다, Polyphemus.magnetism.radiation_belts) 자기권계면 23.5 R_p 안쪽이다(Polyphemus.magnetism.magnetosphere). 그래서 약하지만 가변이며, 가변의 원인은 위성이 경계에 앉아 있는 것이 아니라 항성풍 압축이 standoff를 21 R_p 아래로 밀어 넣는 것이다. wind/activity/heliosphere/flares/uv/HZ=항성-레벨 ∅."

  # ── Chaos G9 rings = ∅ 전부(자체 고리 없음; circumstellar_disk·asteroid_belt 계-레벨 ∅). ──
  - body: Chaos
    axis: satellites               # G10 — dust_source 역할 (facet-walk 2026-06-23)
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      Chaos has no moons of its own. What is settled here is what feeds the ring: the plumes are a look, not a
      mechanism the physics supports, and the real outgassing is a thin water-vapor stream that rides alongside
      the ring rather than filling it.
    narrative_ko: >
      Chaos에게 위성은 없다. 여기서 정하는 것은 고리를 무엇이 채우느냐다. 플룸은 물리가 지지하는 기제가 아니라
      연출이고, 실제 방출은 고리를 채우기보다 그 곁을 도는 얇은 수증기 흐름이다.
    fields:
      - { name: dust_sources, value: "Chaos = E-고리 공급원 (물 플룸 = 아트 디렉션 / 충돌 파편·sputtering = 물리 경로, 단독으로는 약함)", op: set }
      - { name: neutral_torus_supply, value: 134, unit: kg/s, op: set, note: "표면 134 K 승화 유출; 기체이므로 먼지 고리가 아니라 중성 수증기 토러스" }
      - { name: co_orbitals, value: "none", op: set }
    refs: ["docs/reference/ice-stability-methodology.md", "phase4/art-direction/polyphemus-art-direction.md"]
    gate:
      criterion: [stability]
      verdict: owner-override
      evidence: >
        The plumes are art direction, not a mechanism we claim. Two numbers say why. Tidal heat at 21 R_p with
        e 0.02 is only a few MW, far short of driving a reservoir (surface row). And Chaos's 424 m/s escape
        velocity is the highest of any real dust-ring source body: Thebe 34, Amalthea 58 and Phoebe 102 m/s are
        fed by impact ejecta, and even Enceladus at 239 m/s needed plumes to get material out. So impact ejecta
        and sputtering, the honest physical channels here, are weak rather than sufficient, and no ejection
        mechanism we can ground supplies this ring at the brightness it is gated at. The owner's call is to keep
        the plumes and mark them as art. Sublimation is separately ruled out as a dust source: at the gated
        albedo the outflux is 6.7e-11 kg/m² s, and free-molecular gas drag against 0.023 g caps the liftable
        grain radius at 2e-10 m, smaller than a water molecule (comets entrain dust because their flux is ~6
        orders larger off km-scale nuclei with negligible gravity). It does count as a gas budget: 134 kg/s off
        a 134 K surface, escaping freely since 424 m/s is under water's 430 m/s thermal speed, implying a
        neutral water torus like Europa's, alongside the ring rather than feeding it. An icy body, so its grain
        composition matches the ice-blue ring.
      evidence_ko: >
        플룸은 아트 디렉션이며 우리가 주장하는 기제가 아니다. 이유는 숫자 두 개다. 21 R_p·e 0.02에서 조석열이
        수 MW뿐이라 저장소를 돌릴 수준에 한참 못 미친다(surface 행). 그리고 Chaos의 탈출속도 424 m/s는 실제
        먼지고리 공급 천체 중 가장 높다. 충돌 파편으로 고리를 채우는 테베 34, 아말테아 58, 포이베 102 m/s보다 훨씬
        높고, 239 m/s인 엔셀라두스조차 물질을 내보내려 플룸이 필요했다. 따라서 여기서 정직한 물리 경로인
        충돌 파편과 sputtering은 충분하다기보다 약하며, 근거를 댈 수 있는 어떤 방출 기제도 게이트된 밝기의
        고리를 떠받치지 못한다. 오너 결정은 플룸을 유지하고 아트로 표시하는 것이다. 승화는 먼지 공급원에서
        따로 배제된다. 게이트된 알베도에서 유출은 6.7e-11 kg/m²s이고, 자유분자 가스 항력을 0.023 g와 맞추면
        들어올릴 수 있는 알갱이 반경이 2e-10 m로 물 분자보다 작다(혜성이 먼지를 끌고 나가는 것은 플럭스가
        여섯 자리 크고 km 규모 핵의 중력이 무시할 수준이기 때문이다). 기체 예산으로는 유효하다. 134 K
        표면에서 134 kg/s가 빠져나가고 탈출속도가 물의 열속도 430 m/s보다 낮아 자유롭게 이탈하므로,
        에우로파처럼 중성 수증기 토러스를 고리와 나란히 만든다. 고리를 채우는 것은 아니다. 얼음체라 알갱이
        조성이 ice-blue 고리와 일치한다.
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-27: verdict pass-in-window → owner-override, dust_sources에 아트 표시 명시,
      neutral_torus_supply 134 kg/s 신규. 구값은 "art-first 물 플룸 주공급 + sputtering/승화 보조"로,
      주공급 자체는 바뀌지 않았다. 오너가 플룸 유지 + 아트 표시를 택했다("걍 플룸으로 하고 아트 디렉션
      표시만 하자"). 검토 경위는 prose-readability/context-notes.md.

  - body: Chaos
    axis: gameplay                 # G11 facet-walk 2026-06-23
