      evidence_ko: >
        플룸에 밝은 서리, 엔셀라두스 룩이다. 확인: ice-blue E-고리와의 동톤은 구성상 성립한다. 고리색은 얼음
        알갱이 조성에서 Mie 합성으로 얻었고 그 알갱이의 공급원이 Chaos이므로(satellites 행), 공급원과 고리가
        같은 재료로 같은 청백을 공유한다.

  - body: Chaos
