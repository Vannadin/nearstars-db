      From orbit Pandora looks much like Earth, with a green tint. About half the surface is ocean, and beneath
      white clouds the green of its vegetation blends with the blue of the seas. Pandora's nights are spectacular:
      bioluminescence spreads along the coastlines while a fierce aurora burns high in the atmosphere, and over
