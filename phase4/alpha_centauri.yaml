  - body: Cassandra
    axis: atmosphere               # group 4 facet-walk 2026-06-22
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-26: temperature 270–275 K → 243–263 K. 구값은 레시피 없는 "+45–50K CIA 온실"
      가정이었음.
      2026-07-27: pressure 1 bar → 1.37 bar (오너 선택). 유지 게이트가 0.5~3 bar 어디도 지지하지
      않고, 조성이 타이탄 계열이라 유사체 표의 중앙(지구) 줄을 물려받을 자리가 아니었음. 비정수
      값은 의도(반듯한 수는 가정으로 읽힘). 이 지적이 exoplanet-atmosphere §6의 유사체 선택
      규칙으로 이어짐. 온도 243–263 K는 그 기압에서 재계산(N₂ 압력확장 +2.0K 포함),
      scale_height 13.8 km 신규.
    status: gated
    driver: [fiction, window-selection]
    narrative: >
      Cassandra's atmosphere is mostly nitrogen, pressing down at 1.37 bar. Beyond a few percent carbon dioxide and a
      little methane there is nothing else, so it cannot be breathed. Those greenhouse gases lift the surface to
      between 243 and 263 K, warm enough that liquid water appears for part of the year.
    narrative_ko: >
      Cassandra의 대기는 질소가 주성분이며 지표를 1.37기압으로 누른다. 여기에 이산화탄소가 수 퍼센트, 메테인이
      조금 섞여 있는 게 전부라 호흡은 불가능하다. 온실가스들이 지표를 243~263 K까지 끌어올려 계절에 따라 액체
      물이 존재하는 시기가 있다.
    refs: ["docs/reference/greenhouse-warming-methodology.md", "docs/reference/moon-energy-budget-methodology.md", "docs/reference/exoplanet-atmosphere-methodology.md"]
    fields:
      - { name: composition, value: "N₂ 주성분 + 수% CO₂ + ~0.1–1% CH₄ + 미량 H₂ + H₂O, 무산소·환원성", op: set }
      - { name: pressure, value: 1.37, unit: bar, op: set, note: "타이탄급 유사체(1.5 bar) 안쪽의 비정수 선택; 구값 1 bar는 지구 기본값" }
      - { name: temperature, value: "243–263", unit: K, op: set, note: "4항 Teq 219K + 온실 상승폭 +24K(haze 포함)~+44K(haze 없음), N₂ 압력확장 +2.0K 포함; 구값 270–275K는 미근거 +45–50K 가정" }
      - { name: scale_height, value: 13.8, unit: km, op: set, note: "H=RT/μg, μ 28.5 g/mol(N₂+3% CO₂), g 5.20 m/s², T 245K" }
      - { name: greenhouse, value: "CO₂+CH₄+N₂–H₂ 충돌유발흡수 (시생대/초기화성 레시피)", op: set }
      - { name: breathability, value: false, op: set }
      - { name: escape, value: "N₂/CO₂ 보유, H₂ 탈출하나 화산 보충", op: set }
    gate:
      criterion: [canon-consistency, physics]
      verdict: pass-in-window
      evidence: >
        Adopted: anoxic Archean-style N₂ at 1.37 bar, surface 243–263 K, orange haze kept.
        Check, temperature: four-term satellite Teq = 219 K (moon-energy-budget: eclipses cost 3.1% of the
        starlight at 8.4 R_p, the parent adds 2.1+0.9 W/m², tides only 2.5 W/m² this far out) + greenhouse
        increment +24 K with the designed haze to +44 K without it (greenhouse-warming Layer 3; CH₄/CO₂ = 0.1
        sits at Arney 2016's haze threshold) + 2.0 K of N₂ pressure broadening = 243–263 K, a global mean
        below freezing, consistent with the seasonal/equatorial melt in the surface row. Check, pressure:
        retention does not constrain it (v_esc 5.94 km/s vs Mars's 5.03, a quiet G2V at 1.6 AU, and the moon
        orbits inside Polyphemus's magnetopause), so the analog-selection rule (exoplanet-atmosphere §6:
        match by composition and temperature class; this is Titan's family, not Earth's) sets 1.37 bar
        inside the ~0.5–3 bar band, deliberately non-round and under the 2-bar calibration ceiling of the
        greenhouse contours. Anoxic and CH₄ is the consistent pair (O₂·CH₄ cannot coexist; Archean Earth held
        an ocean for 2 Gyr without O₂). Caveat: CH₄/CO₂ sits exactly at the haze threshold, so the 20 K
        spread between the hazy and haze-free readings is irreducible by design.
      evidence_ko: >
        채택값은 무산소 시생대형 N₂ 대기, 1.37 bar, 지표 243~263 K, 주황 haze 유지.
        온도 확인. 4항 위성 Teq = 219 K(moon-energy-budget: 8.4 R_p에서 식이 별빛의 3.1%를 걷어가고 모행성이
        2.1+0.9 W/m², 이 거리의 조석열은 2.5 W/m²) + 온실 상승폭 +24 K(설계된 haze 인정)~+44 K(haze 없음;
        greenhouse-warming Layer 3, CH₄/CO₂ = 0.1이 Arney 2016의 haze 문턱) + N₂ 압력확장 +2.0 K = 243~263 K.
        전지구 평균이 어는점 아래라 surface 행의 계절·적도 국지 융해와 맞는다. 기압 확인. 유지 쪽은 값을 제약하지
        못하므로(탈출속도 5.94 km/s로 화성 5.03보다 높고, 조용한 G2V의 1.6 AU에 폴리페무스 자기권계면 안쪽)
        유사체 선택 규칙(exoplanet-atmosphere §6: 거리보다 조성·온도 계열로 고르며, 이 천체는 지구가 아니라
        타이탄의 가족)이 1.37 bar를 정한다. 유지 밴드 약 0.5~3 bar 안의 의도적 비정수 값이고, 온실 등온선의
        2 bar 보정 상한 아래다. 무산소와 CH₄는 서로 맞는 짝이다(O₂·CH₄ 공존 불가; 시생대 지구는 O₂ 없이 20억 년
        바다를 유지). 유보: CH₄/CO₂가 정확히 haze 문턱에 있어, haze 유무에 따른 20 K 폭은 설계상 줄일 수 없다.

  - body: Cassandra
    axis: surface                  # group 5 facet-walk 2026-06-22
    status: gated
    driver: [fiction, window-selection]
    narrative: >
      Cassandra's surface divides into rocky continents and seas, cold and damp. The water is liquid only near the warm
      equator or in season; the rest of the year it freezes, burying the poles and high latitudes under thick ice.
      Colonies of primitive anaerobic microbes are scattered across the ground.
    narrative_ko: >
      Cassandra의 지표는 암석 대륙과 바다로 나뉜 한랭 습윤 지형이다. 바다는 따뜻한 적도나 계절에 액체로 존재하는
      정도이며, 나머지 시기에는 얼어붙어 극관과 고위도를 두꺼운 얼음으로 덮는다. 지표면 곳곳에 원시적인 혐기성
      미생물의 군락이 존재한다.
    fields:
      - { name: surface_type, value: "암석 대륙 + 바다 (한랭-습윤 시생대형)", op: set }
      - { name: hydrosphere, value: "물바다 (한계-습윤, 부분빙) + 빙관", op: set }
      - { name: biosphere, value: "혐기 미생물 탄소순환 (매트, 무성하지 않음)", op: set }
      - { name: tectonics, value: "방사성 구동, 일부 화산/열수구", op: set }
      - { name: ice_caps, value: "풍부 (극관+고위도)", op: set }
      - { name: albedo, value: 0.35, op: set }
      - { name: surface_temperature, value: "243–263", unit: K, op: set, note: "부분 동결 (atmosphere 행 재도출과 동일, 1.37 bar 기준; 구값 270–275K)" }
    gate:
      criterion: [canon-consistency, physics]
      verdict: pass-in-window
      evidence: >
        Water ocean=marginally moist (partially frozen). Life=anaerobic microbes (differentiated from
        Pandora's lush biosphere). Hydrothermal vents=candidate carbon-cycle life hubs (biome). Check: the
