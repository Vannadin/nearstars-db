      evidence_ko: >
        물바다=한계-습윤(부분빙). 생명=혐기 미생물(판도라 무성과 차별). 열수구=탄소순환 생명 거점
        후보(바이옴). 확인: 부분빙은 atmosphere 행의 243~263 K(전지구 평균이 어는점 아래, 계절 융해)에서
        따라 나오고, 혐기 한정은 그 무산소 조성에서 따라 나온다.

  - body: Cassandra
    axis: appearance               # group 6 facet-walk 2026-06-22
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-28: 구 서술이 amber를 haze의 산란색으로 거꾸로 설명했던 교정 이력을 evidence에서
      이곳으로 옮김(교정 자체는 이전 패스, haze_aerosol_radius 하한 ≳0.2 µm 신설과 함께).
      evidence는 결론→확인→유보 형태로 축약, 내용 불변.
    status: gated
    driver: [fiction, art-direction, window-selection]
    narrative: >
      From a distance Cassandra is a pale blue-white bead under a thin amber wash. The organic haze that nitrogen and
      methane build photochemically sits high and thin, never hiding the surface but stripping the blue out of the
      light that passes through it. So the blue-gray seas, white polar caps, dark rocky continents and white water
      clouds all show through, tinted amber. The ocean catches the starlight in a glint, and the weak field leaves
      only a faint aurora.
    narrative_ko: >
      멀리서 본 Cassandra는 엷은 청백색 구슬에 호박색 기운이 얇게 덮인 모습이다. 질소와 메테인이 광화학으로 만든
      유기 haze가 높은 고도에 얇게 걸쳐, 표면을 가리지는 않고 그 빛에서 파란색만 걷어낸다. 그래서 아래의 청회색
      바다와 흰 극관, 어두운 암석 대륙, 흰 물구름이 호박색으로 물든 채 드러난다. 바다는 별빛을 받아 반짝이고,
      약한 자기장 탓에 오로라는 희미하다.
    refs: ["docs/reference/atmosphere-reflected-color-methodology.md"]
    fields:
      - { name: base_colour, value: "엷은 청백 마블 + 약한 amber (청회색 바다 + 흰 빙관 + 어두운 대륙)", op: set }
      - { name: haze, value: "얇은 고층 유기 톨린 haze (표면 비침; amber는 산란색이 아니라 투과 색조)", op: set }
      - { name: haze_aerosol_radius, value: "≳0.2", unit: µm, op: set, note: "하한. 이보다 작으면 레일리 영역 산란이 흡수를 압도해 haze가 청색(#c7e6ff)이 됨" }
      - { name: clouds, value: "흰 물구름 (활발한 기상)", op: set }
      - { name: specular, value: "바다 glint", op: set }
      - { name: aurora, value: "약함 (약자기장)", op: set }
      - { name: rings, value: "none", op: set }
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: >
        Adopted: a thin, high tholin haze that tints without hiding: amber as a transmission color over a
        visible surface.
        Check: the tholin optical constants are Khare+ 1984 with Tomasko+ 2008's in-situ Titan pinning
        (atmosphere-reflected-color §5); the material absorbs ~45× more strongly in the blue than the red
        (k 0.27 vs 0.006), so amber is what survives passing through the haze, not what the haze scatters.
        The project's Mie engine (disk_color_mie tholin n,k, α Cen A spectrum) sets the particle floor: below
        ~0.2 µm the aerosols scatter Rayleigh-blue (#c7e6ff), 0.2–1 µm give pale yellow (#fff2c8), hence
        the recorded ≳0.2 µm floor. Titan, the analog family (atmosphere row), shows why the tint stays
        weak: its saturated orange needs optical thickness built by deep cold, excess CH₄ and low gravity,
        none of which Cassandra has at 243–263 K with moderate CH₄ and 2.3× the escape velocity, so seas,
        caps, continents and water clouds show through, distinct from Pandora's green·cyan.
        Caveat: the hexes are single-scattering colors from a thin-dust tool; the true haze-over-surface
        color is two-stream radiative transfer, which the reflected-color methodology owns.
      evidence_ko: >
        채택값은 표면을 가리지 않고 물들이기만 하는 얇은 고층 톨린 haze. amber는 산란색이 아니라 투과 색조다.
        확인. 톨린 광학상수는 Khare+ 1984에 Tomasko+ 2008의 타이탄 현장 고정(atmosphere-reflected-color §5).
        이 물질은 청색을 적색보다 45배쯤 강하게 흡수하므로(k 0.27 대 0.006) amber는 haze를 통과한 빛에 남는
        색이다. 프로젝트 Mie 엔진(disk_color_mie 톨린 n,k, α Cen A 스펙트럼)이 입자 하한을 정한다. 약 0.2 µm
        아래 에어로졸은 레일리 영역이라 청색으로 산란하고(#c7e6ff), 0.2~1 µm는 연노랑(#fff2c8)이라, 기록한
        하한 ≳0.2 µm이 amber의 성립 조건이다. 유사체 가족인 타이탄(atmosphere 행 참조)이 색조가 옅게 머무는
        이유를 보여준다. 타이탄의 진한 주황은 극저온·CH₄ 과다·저중력이 쌓아 올린 광학적 두께에서 오는데,
        Cassandra는 243~263 K에 CH₄이 적당하고 탈출속도가 2.3배라 그 두께가 없다. 그래서 바다·빙관·대륙·물구름이
        비쳐 보이며 판도라의 초록·청록과도 갈린다. 유보: 위 헥스는 얇은 먼지용 도구의 단일 산란 색이고, 표면
        위 haze의 실제 색은 2-stream 복사전달로 reflected-color 방법론이 담당한다.

  - body: Cassandra
    axis: magnetism.magnetic_field # group 7 facet-walk 2026-06-22 — 약함(오너 결정)
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-27: 차폐 주장에 적용 범위와 유사체를 붙임(가니메데형 부분 차폐, 극 노출).
      Pandora 대비 문구와 magnetosphere 필드 신규. 자기장 세기는 여전히 미도출.
      2026-07-28: 세기 도출(오너 결정 ④a, 감사 C7) — RM22 사다리, 가니메데 앵커 ℳ≈2×10⁻³ ℳ⊕ →
      B_eq ≈ 0.4 µT(밴드 0.2~1.2). standoff ~1.1 R_moon이라 서사의 "외대를 막아낸다"를
      "저위도 소폭 저감"으로 하향. 도출 전엔 criterion=derived-grounding이 실행 안 된 게이트였음.
    status: gated
    driver: [window-selection]
    narrative: >
      Cassandra carries a faint magnetic field of its own. An iron-rich core and a 39-hour spin do drive a dynamo,
      though only to Ganymede's class, a few tenths of a microtesla. That buys a skin-tight magnetosphere: it trims
      the belt dose at low latitudes rather than holding the outer belt off, and the poles take the flux in full.
    narrative_ko: >
      Cassandra는 미약한 자기장을 보유하고 있다. 철이 많은 핵과 39시간의 자전이 다이나모를 가동시키지만, 세기는
      가니메데급인 1마이크로테슬라의 몇 분의 1 수준이다. 그걸로 얻는 것은 표면에 겨우 붙는 자기권이다. 외대를
      밀어내지는 못하고 저위도의 선량을 조금 깎아줄 뿐이며, 극은 플럭스를 고스란히 받는다.
    fields:
      - { name: magnetic_field, value: "~0.4 µT eq / ~0.8 µT polar (가니메데급 고유 dipole; 철-부유 핵 + 자유 자전 39h, ℳ≈2×10⁻³ ℳ⊕)", op: set, note: "RM22 사다리 도출 2026-07-28, 밴드 0.2~1.2 µT; Pandora 75 µT의 ~1/200" }
      - { name: magnetosphere, value: "가니메데형 미니 자기권, standoff ~1.1 R_moon (폴리페무스 자기권 안의 위성 자기권; 저위도 닫힘·극 열림)", op: set }
    refs: ["docs/reference/rocky-planet-dynamo-methodology.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        Adopted: an intrinsic dipole of ~0.4 µT equatorial (band 0.2–1.2), Ganymede's class, with a
        skin-tight magnetosphere: partial low-latitude shielding, poles open.
        Check: the rocky-dynamo ladder (RM22 anchors). Density 5466 kg/m³ (≈1.0 ρ⊕ at 0.53 R⊕) makes the
        body iron-rich with a Mercury-class core fraction; on the Mercury precedent a 0.151 M⊕ iron core
        still convects at 5.3 Gyr, and free rotation at 39 h keeps the dynamo dipolar. The Solar-System
        anchors bracket the moment at ℳ ≈ 1e-3~6e-3 ℳ⊕ (Mercury 4e-4 at 0.055 M⊕, Ganymede 2e-3); the
        Ganymede anchor is adopted as the structural analog (a weak intrinsic dipole inside a giant's
        magnetosphere), giving B_eq = 30·ℳ·(R/R⊕)⁻³ = 30·2e-3/0.533³ ≈ 0.4 µT. Standoff: the parent's
        local field at 8.4 R_p is 170/8.4³ ≈ 0.29 µT, so R_mp ≈ (0.4/0.29)^(1/3) ≈ 1.1 R_moon, the same
        pressure-balance convention as Pandora's 2.6. Ganymede's observed outcome transfers: closed
        low-latitude lines shield while open polar lines funnel plasma straight in (its
        irradiation-darkened poles are the fingerprint), so the moon is protected except at the poles,
        never "holds the outer belt off".
        Caveat on scope: the field is credited with trimming the surface particle dose only, never with
        protecting the atmosphere from stellar-wind stripping, the claim Ramstad & Barabash 2021 refute
        and the atmosphere methodology's Gate 4 forbids leaning on.
      evidence_ko: >
        채택값은 고유 쌍극자 적도 ~0.4 µT(밴드 0.2~1.2), 가니메데급, 표면에 겨우 붙는 자기권이다. 저위도만 부분
        차폐되고 극은 열려 있다.
        확인. rocky-dynamo 사다리(RM22 앵커). 밀도 5466 kg/m³(0.53 R⊕에서 ≈1.0 ρ⊕)라 철 부유·수성급 핵
        비율이고, 수성 선례상 0.151 M⊕ 철핵은 5.3 Gyr에도 대류를 유지하며, 자유 자전 39 h가 쌍극자 레짐을
        지킨다. 태양계 앵커가 모멘트를 ℳ ≈ 1e-3~6e-3 ℳ⊕로 묶고(수성 4e-4 at 0.055 M⊕, 가니메데 2e-3), 구조
        유사체(거대행성 자기권 안의 약한 고유 쌍극자)인 가니메데 앵커를 채택하면 B_eq = 30·ℳ·(R/R⊕)⁻³ =
        30·2e-3/0.533³ ≈ 0.4 µT. standoff는 8.4 R_p의 모행성 국지장 170/8.4³ ≈ 0.29 µT에서 R_mp ≈
        (0.4/0.29)^(1/3) ≈ 1.1 R_moon(Pandora의 2.6과 같은 압력 균형 관례). 가니메데의 관측 결과가 그대로
        옮겨온다. 닫힌 저위도 자력선은 지키고 열린 극 자력선은 플라스마를 그대로 끌어들이므로(조사로 어둡게
        변색된 가니메데의 극이 그 지문이다) 극만 노출된 채 보호되는 것이지, "외대를 막아내는" 것이 아니다.
        유보(적용 범위). 이 자기장에 인정하는 것은 지표 입자 선량 저감뿐이며, 항성풍의 대기 침식을 막아준다는
        주장은 인정하지 않는다. Ramstad & Barabash 2021이 반박했고 대기 방법론 관문 4가 기대는 것을 금지한다.

  - body: Cassandra
    axis: environment.radiation    # group 8 facet-walk 2026-06-22
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-27: 등급 "낮음 (방사선대 밖)" → "중간" (오너 선택 a). 구 서술이 폴리페무스
      radiation_belts 행(외대 L 4.2–10이 Cassandra를 잠기게 함)과 모순이었고, 벨트 지오메트리
      도출보다 앞선 것이라 갱신되지 않았던 것. 벨트 행의 대안(외대를 Cassandra에서 끊기)은
      미발동. refs 2건 추가.
      2026-07-28: magnetism 행 세기 도출(~0.4 µT, standoff ~1.1 R_moon)에 맞춰 자기장 기여를
      "대부분 밀어냄" → "저위도 소폭 저감"으로 하향. 등급 중간은 불변(근거의 주축이 옅은 외대로 이동).
    status: gated
    driver: [window-selection]
    narrative: >
      Cassandra orbits inside Polyphemus's outer belt, so the particles are there, but they are far thinner than the
      inner belt that bakes Dante and Hades, and the moon's faint field trims a little more off at low latitudes.
      What limits life here is the cold and the missing oxygen, not radiation.
    narrative_ko: >
      Cassandra는 Polyphemus 외대 안쪽을 돈다. 입자가 없는 곳은 아니지만 Dante와 Hades를 굽는 내대보다 훨씬 옅고,
      위성 자신의 옅은 자기장이 저위도에서 조금 더 깎아낸다. 이곳에서 생명을 제한하는 것은 방사선이 아니라
      추위와 없는 산소다.
    fields:
      - { name: radiation, value: "중간 (외대 L 4.2–10 안쪽 8.4 R_p, 외대 30 rad/h; 위성 자기장 ~0.4 µT가 저위도 선량 소폭 저감, 극은 노출)", op: set, note: "구값 '낮음 (방사선대 밖)'; 벨트 지오메트리 도출 이전 서술" }
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        The grade follows the derived belt geometry, not the moon's position alone. "Outside the radiation belt" is
        wrong here: the Polyphemus radiation_belts row puts the outer belt at L 4.2–10 and states it "submerges
        Cassandra, giving it its intermediate radiation", and its per-moon ladder reads Cassandra=intermediate. The
        belts row's recorded alternative of ending the outer belt at Cassandra is NOT exercised.
        So the grade is intermediate, and the reason is the thin outer belt, helped only marginally by the moon's own
        field. The outer belt runs 30 rad/h against the inner belt's 300, so Cassandra starts a factor 10 below Dante
        and Hades, and its skin-tight Ganymede-type mini-magnetosphere (standoff ~1.1 R_moon) trims the low-latitude
        dose modestly (scope and the derived ~0.4 µT strength in the magnetism row). Poles stay exposed.
        stellar_wind/activity/heliosphere/flares/uv_xray/habitable_zone = star-level ∅, with the note that anoxia
        means no ozone and therefore raised surface UV; HZ position is handled in the atmosphere row.
      evidence_ko: >
        등급은 위치만이 아니라 도출된 벨트 지오메트리를 따른다. 여기서 "방사선대 밖"은 틀린 서술이다. 폴리페무스
        radiation_belts 행이 외대를 L 4.2–10에 두고 "Cassandra를 잠기게 해 그 중간 방사선을 만든다"고 명시하며,
        위성별 사다리에도 Cassandra=중간으로 적혀 있다. 벨트 행이 기록해 둔 "외대를 Cassandra에서 끊는" 대안은
        발동하지 않는다.
        따라서 등급은 중간이고, 이유는 옅은 외대다. 위성 자기장은 한계적으로만 거든다. 외대는 30 rad/h로 내대
        300 rad/h의 10분의 1이라 Cassandra는 Dante·Hades보다 한 자리 낮은 데서 출발하며, 표면에 겨우 붙는
        가니메데형 미니 자기권(standoff ~1.1 R_moon)이 저위도 선량을 소폭 깎는다(적용 범위와 도출된 ~0.4 µT
        세기는 magnetism 행 참조). 극은 노출된 채다.
        stellar_wind/activity/heliosphere/flares/uv_xray/habitable_zone = 항성 레벨 ∅. 단 무산소는 오존이 없다는
        뜻이므로 지표 UV가 올라간다는 메모를 남긴다. HZ 내 위치는 atmosphere 행에서 다룬다.

