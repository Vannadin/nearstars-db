  - body: Dante                    # A b I
    axis: bulk.tidal_heating
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-26: e 가정 평균 0.0175 → 안정성 시계열 측정 e_rms 0.0186. ~820× Io → ~1200× Io,
      표면 플럭스 ~11,500 W/m². 구 행은 이 플럭스를 surface 행의 주변 230 K와 짝지어 에너지
      보존을 위반했음. 오너가 주변 673 K + 핫스팟 973 K로 확정(처음 400/700 °C로 제시, 이어서
      켈빈 표기 요청).
      2026-08-03: 감사 C5 재마감(오너 결정) — 주변 673 K → 360 K, 발광 영역 973 K → 1350 K(노출 용융부),
      면적 5.7%, 전도 지각 0.12 m → ~2.1 m. 플럭스·k₂/Q·조석 배율은 무변경이고 열의 분배만 바뀌었다.
      673 K는 황 융점 388 K 위라 팔레트가 딛는 고체 황을 불성립으로 만들었다(감사 C5). 오너는 황을 지키고
      온도를 내리기로 했고(융점은 기초 화학이라 틀리면 바로 걸리지만 조석열 분배는 그렇지 않다는 판단),
      이 행의 verdict를 methodology-derived → documented-divergence로 내렸다.
      2026-08-03: 같은 날 오너 지적으로 다이버전스 노트를 정정 — 최초 문안은 이 분배를 "이오의 실제 구조"로
      정당화하고 이탈을 "이오 활동 면적의 ~3배"로 적었다. 둘 다 틀렸다. Veeder 1994는 이오의 열유출을 넓은
      온난(≤200 K) 영역이 지배하고 고온 핫스팟 기여는 작다고 관측했으므로, 열의 92 %를 1350 K 용융부로
      내보내는 우리 배치는 이오 유추가 아니다. 수치 필드는 무변경이고 근거 서술만 정정했다.
    status: gated                  # 2026-06-22 — 아바타 게임 설정+물리 합치
    driver: [window-selection, fiction]
    narrative: >
      Dante's tidal heating is extreme, roughly twelve hundred times Io's, and it never lets up. All of that heat has
      to leave through the surface, and on this board almost all of it leaves through open lava covering about a
      twentieth of the moon at some 1350 K, so the plains between stay near 360 K. That split is an art choice, and a
      generous one: spread evenly, the same heat would hold the whole surface above the temperature at which its own
      sulfur melts.
    narrative_ko: >
      Dante의 조석 가열은 이오의 약 1200배에 이르고 잦아들지 않는다. 그 열은 전부 표면으로 빠져나가야 하는데, 이
      보드에서는 그 열의 거의 전부가 위성의 약 20분의 1을 덮은 1350 K 안팎의 열린 용암으로 빠져나가고, 그래서 그
      사이 평원이 360 K 근처에 머문다. 이 분배는 아트 선택이고, 후한 선택이다. 같은 열을 고르게 펴면 표면 전체가
      제 황이 녹는 온도 위에 있게 된다.
    fields:
      - { name: tidal_heating, value: "~1200× Io (시뮬 e_rms 0.0186, k₂/Q≈0.0155)", op: set, note: "구값 ~820×는 e 0.0175 가정" }
      - { name: tidal_surface_flux, value: "~11,500 W/m² (평원 360K; 노출 용융부 1350K이 면적 ~5.7%)", op: set, note: "전도 지각 두께 ~2.1 m (평원). 균일 복사면 독법은 주변 673 K + 지각 0.12 m" }
    refs: ["docs/reference/tidal-heating-methodology.md", "docs/reference/moon-energy-budget-methodology.md", "phase3/stability-sim/STABILITY_REPORT.md", "2012Icar..219..701V", "1994JGR....9917095V"]
    gate:
      criterion: [stability, canon-consistency]
      verdict: documented-divergence
      divergence_note: >
        Recipe (docs/reference/tidal-heating-methodology.md): tidal 11,500 W/m² + starlight 141 W/m² fix the
        area-weighted radiating mean at 673 K, and its §7 refutation rejects hotspot concentration as a route to a
        cool surface. Read as one radiator the surface is 673 K, above sulfur's melting point 388 K (boiling 718 K),
        so the yellow sulfur behind the palette, the albedo-0.5 half and the Sulfur Plains biome cannot exist.
        NearStars keeps the sulfur and takes the plains to 360 K, which requires 92 % of the heat to leave through
        exposed melt at the ~1350 K silicate ceiling over 5.7 % of the surface. The mean is preserved so the
        arithmetic closes, but the configuration sits at the limit of what silicate volcanism can deliver and is not
        the Io analogue: Veeder finds Io's heat flow dominated by large warm (≤200 K) regions with high-temperature
        hotspots contributing little, and the implied conductive lid under our plains is ~2.4 m where Io's is
        kilometres. Physically the plains are a thin chilled crust over near-surface melt; calling them solid
        sulfur-bearing ground is the art choice.
      divergence_note_ko: >
        레시피(docs/reference/tidal-heating-methodology.md): 조석 11,500 W/m² + 별빛 141 W/m²가 면적가중 복사
        평균을 673 K로 고정하고, §7 반박은 핫스팟 집중으로 차가운 표면을 얻는 길을 기각한다. 표면을 하나의
        복사면으로 읽으면 673 K이고, 이는 황의 융점 388 K를 넘으므로(비등 718 K) 팔레트·알베도 0.5 반쪽·황 평원
        바이옴이 딛는 노란 황이 성립하지 않는다. NearStars는 황을 지키고 평원을 360 K로 내리는데, 그러려면 열의
        92 %가 표면 5.7 %의 규산염 상한 ~1350 K 노출 용융부로 빠져나가야 한다. 평균이 보존되므로 계산은 닫히지만,
        이 배치는 규산염 화산활동이 낼 수 있는 한계에 있고 이오 유추도 아니다. Veeder의 관측에서 이오의 열유출은
        넓은 온난(≤200 K) 영역이 지배하고 고온 핫스팟의 기여는 작으며, 우리 평원 아래 전도 지각은 이오가 km인
        자리에서 ~2.4 m다. 물리적으로 이 평원은 표층 근처 용융부 위의 얇은 냉각 지각이다. 그것을 고체 황이 놓인
        땅이라 부르는 것이 아트 선택이다.
      evidence: >
        Adopted: perpetual tidal heating at ~1200× Io, surface flux ~11,500 W/m², escaping as 360 K plains over
        94.3 % of the area plus 1350 K exposed melt over 5.7 %, with a ~2.1 m conductive lid under the plains.
        Check, heating: Io scaling (Ė∝M_p^2.5·R^5·e²·a^-7.5) at 1.54 R_p with the measured e_rms 0.0186 from the
        stability timeseries (not an assumed mean) and k₂/Q 0.0155. The sim's e oscillates 0.0002–0.031 without
        dying because Hades and the others force it, so the heating is perpetual, as the Avatar game describes.
        Check, partition: 952 W/m² over 94.3 % plus 1350 K melt over 5.7 % reproduces the 11,641 W/m² total to the
        digit, so the 673 K area-weighted mean is preserved; the old 230 K plains could not radiate it under any
        partition. The cost is that the melt then carries 92 % of the heat at the silicate ceiling, leaving a ~2.4 m
        lid under the plains, which is a departure from the recipe rather than a result of it (divergence note). Plains sit at 360 K rather than just under the 388 K melting point because bright orthorhombic
        sulfur converts at 368 K, and the melt fraction only moves 5.5–5.8 % across 340–388 K, so that margin is
        free. Lid follows the local flux, not the mean: 990 K over 952 W/m² at k ≈ 2 W/m/K, against 0.12 m for a
        uniform 673 K surface. Caveat: the partition is the look, not a recipe output (divergence note).
      evidence_ko: >
        채택값은 이오의 약 1200배로 잦아들지 않는 조석 가열, 표면 플럭스 약 11,500 W/m²이고, 이 열은 면적 94.3 %의
        360 K 평원과 5.7 %의 1350 K 노출 용융부로 빠져나간다. 평원 아래 전도 지각은 약 2.1 m다.
        가열 확인. Io 스케일링(Ė∝M_p^2.5·R^5·e²·a^-7.5), 1.54 R_p, 가정한 평균이 아니라 안정성 시계열에서 측정한
        e_rms 0.0186, k₂/Q 0.0155. 시뮬에서 e는 Hades 등이 강제하는 덕에 0.0002~0.031로 진동하며 죽지 않으니
        가열은 영구적이고, 아바타 게임 설정이 말하는 그대로다.
        분배 확인. 94.3 %의 952 W/m²에 5.7 %의 1350 K 용융부를 더하면 총 11,641 W/m²가 자릿수까지 재현되므로
        면적가중 평균 673 K는 보존된다. 구값 230 K 평원은 어떤 분배로도 이 플럭스를 복사할 수 없었다. 대가는 용융부가
        규산염 상한에서 열의 92 %를 나르고 평원 아래 지각이 ~2.4 m로 얇아진다는 것이며, 이는 레시피의 결과가 아니라
        레시피에서의 이탈이다(다이버전스 노트). 평원을 융점
        388 K 바로 아래가 아니라 360 K로 둔 것은 밝은 사방정계 황이 368 K에서 전이하기 때문이며, 필요한 용융부
        면적은 340~388 K 구간에서 5.5~5.8 %로만 움직이므로 이 여유에는 치르는 대가가 없다. 지각은 평균이 아니라 국소 플럭스를 따른다.
        k ≈ 2 W/m/K로 990 K를 952 W/m²로 나눈 값이고, 균일 673 K 표면이었다면 0.12 m다.
        유보: 이 분배는 레시피의 산출이 아니라 룩이다(다이버전스 노트 참조).

  - body: Dante
    axis: surface
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-07-26: surface_temperature "230 K 주변 + ~600 K 핫스팟" → "673 K 주변 + ~973 K
      화산 영역". bulk.tidal_heating의 조석 플럭스를 복사할 수 있는 값으로 맞춤. 팔레트는 무변경
      (673 K가 Draper 점 798 K 아래라 주변 지표는 여전히 비발광).
      2026-07-28: 감사 C5 후속(오너 결정 ②c) — 673 K는 황 융점(388 K) 위라 고체 황 평원이 물리적으로
      불성립. 팔레트·알베도는 아바타 게임 설정 룩으로 유지하되 albedo 필드를 owner-override로 마킹하고 evidence에
      상 불안정 인정을 명시. 값 무변경.
      2026-08-03: 감사 C5 재마감(오너 결정) — 07-28의 "결함을 인정한다"에서 "온도를 내린다"로 방향 전환.
      surface_temperature "673 K 주변 + ~973 K 화산 영역" → "360 K 평원 + 1350 K 노출 용융부(면적 ~5.7%)".
      albedo의 owner-override 마킹은 철회했다. 360 K에서 고체 황이 안정상이므로 황 반 ~0.5가 다시 성립한다.
      온도를 낮춘 대가는 bulk.tidal_heating 행의 다이버전스로 기록했다.
    status: gated
    driver: [fiction, window-selection]
    narrative: >
      Dante is a silicate world of Io-like violence. Tide-locked, its parent-facing hemisphere holds a vast rift
      on the scale of Valles Marineris, its floor filled with lava lakes, while the far side is cooled basalt
      plains and craters. That contrast gives the
      surface a sharp division: lava lakes and bright sulfur fields against dark basalt terrain. The plains between the
      lava run near 360 K, cool enough for solid sulfur to keep its yellow, while the exposed melt reaches some 1350 K.
    narrative_ko: >
      Dante는 이오처럼 격렬한 규산염 세계다. 조석고정되어 있어 모행성을 바라보는 반구는 발레스 마리네리스와 같은
      거대한 균열이 존재하며, 그 바닥을 용암 호수가 채운다. 반대편은 식어 굳은 현무암 평원과 충돌구가 존재한다. 이러한 차이로 인해 위성의 지표면은 용암호와
      밝은 황 지대, 어두운 현무암 지대로 강한 대비를 보인다. 용암 사이의 평원은 360 K 근처로, 고체 황이 노란색을
      유지할 만큼 서늘하고, 노출된 용융부는 1350 K에 이른다.
    fields:
      - { name: surface_type, value: "silicate volcanic (Io-type)", op: set }
      - { name: albedo, value: 0.30, op: set, note: "황 반 ~0.5 / 현무암 반 ~0.10 벌크 평균; 360 K 평원에서 고체 사방정계 황이 안정상이라 성립" }
      - { name: surface_temperature, value: "360 K 평원 (87°C) + ~1350 K (1077°C) 노출 용융부, 용융부 면적 ~5.7%", unit: K, op: set, note: "평원을 균일 복사면으로 읽으면 673 K이고 황이 녹는다(bulk.tidal_heating 행의 다이버전스 노트 참조). 구값 230K+600K는 조석 플럭스 11,500 W/m²와 에너지 보존 위반" }
    refs: ["docs/reference/tidal-heating-methodology.md", "docs/reference/moon-energy-budget-methodology.md", "docs/reference/surface-color-albedo-methodology.md"]
    gate:
      criterion: [canon-consistency, physics]
      verdict: pass-in-window
      evidence: >
        Adopted: a two-tone silicate surface, bright sulfur against dark basalt, on 360 K plains with 1350 K exposed
        melt, bulk albedo 0.30. All three hold together at this temperature pair.
        Check, sulfur: solid sulfur is the stable phase at 360 K, below both the 388 K melting point and the 368 K
        orthorhombic-to-monoclinic conversion that would deepen its yellow, so the bright fields and the albedo-0.5
        sulfur half are supported rather than overridden. Check, glow: 360 K is far below the ~798 K Draper point, so
        the plains read dark by daylight and only the melt glows, which is the Avatar game's "orange lava flecks" and
        the night-side orange lines in the appearance row. Check, geography: with asthenosphere dissipation the
        equator and the tidal axis are enhanced, so the sub-Polyphemus rift and its lava lakes have physical
        motivation (real Io runs a ~30–60° longitude offset, art-permitted), and that rift's plasma feeds the
        radiation belt (environment.radiation). Caveat: what buys the 360 K plains is the heat partition, and that
        partition is the look; the divergence is recorded on bulk.tidal_heating.
      evidence_ko: >
        채택값은 어두운 현무암에 밝은 황이 얹힌 이중 톤 규산염 표면이고, 평원 360 K에 노출 용융부 1350 K, 벌크
        알베도 0.30이다. 이 온도 조합에서 세 값이 함께 성립한다.
        황 확인. 360 K에서 고체 황은 안정상이다. 융점 388 K 아래이고 노란색을 짙게 바꿀 사방정계→단사정계 전이
        368 K 아래이기도 하므로, 밝은 황 지대와 알베도 0.5의 황 반쪽은 오버라이드가 아니라 지지되는 값이다.
        발광 확인. 360 K는 Draper 점 약 798 K보다 한참 아래라 평원은 주광에서 어둡게 남고 용융부만 빛나는데,
        이것이 아바타 게임 설정의 '주황 용암 반점'이자 appearance 행의 야간측 주황 실선이다.
        지형 확인. asthenosphere 소산이면 적도와 조석축이 강화되므로 sub-Polyphemus 거대 균열과 용암호에 물리
        동기가 있고(실제 Io는 경도 ~30~60° offset, 아트 허용), 그 균열의 플라스마가 방사선대를 먹인다
        (environment.radiation).
        유보: 360 K 평원을 사 오는 것은 열의 분배이고 그 분배 자체가 룩이다. 다이버전스는 bulk.tidal_heating에 기록했다.

  - body: Dante
    axis: appearance
    status: gated
    driver: [fiction, art-direction]
    narrative: >
      Dante reads as a two-tone world: a bright sulfur half, yellow around its volcanoes and fractures, set
      against a dark black-basalt remainder. The canyons, calderas, and lava lakes glow from red to yellow-white
      with their heat, tracing orange lines across the night side. From the parent-facing hemisphere Polyphemus
      hangs fixed overhead, lava canyons underfoot and the gas giant filling the sky, the moon's signature view.
    narrative_ko: >
      Dante는 두 가지 색조의 세계로 보인다. 화산과 균열을 중심으로 한 밝은 황 지대가 절반, 그 나머지는 어두운
      흑현무암이다. 대협곡과 칼데라, 용암호는 온도에 따라 적색에서 황백색으로 발광하며, 야간측에는 주황 실선을
      그린다. 모행성을 마주보는 반구에서는 Polyphemus가 하늘에 고정된 채 떠 있어, 발밑의 용암 협곡과 머리 위
      거대 가스행성이 이 위성의 시그니처 풍경을 이룬다.
    fields:
      - { name: surface, value: "sulfur plains #d9c24a (밝음) / basalt #2a2622 (어두움), 고대비 이중-재질", op: set }
      - { name: emission_glow, value: "lava #ff5a1e→#ffd070 (온도별), 협곡·칼데라·용암호", op: set }
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: "High-contrast sulfur-plain/basalt halves (albedo mean ~0.30), arranged around volcanoes·fractures. Only the fractures glow. The sulfur area is expanded to half of the Avatar game's 'orange lava flecks'."
      evidence_ko: "황 평원/현무암 반반 고대비(albedo 평균 ~0.30), 화산·균열 중심 배치. 균열만 발광. 아바타 게임 설정 'orange lava flecks'에서 황 면적을 반으로 확대."

