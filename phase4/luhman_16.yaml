decisions:
  # ── Luhman 16 A (L7.5 주성, 조용한 쪽) ──────────────────────────────────
  - body: Luhman 16 A
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The nearer half of the closest brown dwarf pair to the Sun, and the third-closest
      system of any kind. It is a failed star: at 33.5 Jupiter masses it never lit
      hydrogen, and the lithium that a true star would have burned away is still there
      to prove it. What warmth it has is leftover contraction heat, radiated from
      1310-kelvin cloud tops as a dim magenta glow. Next to its restless companion it
      is the calm one, a smooth, quietly fading ember of a world that almost became
      a sun. In-game it anchors the system as the primary the pair swings around.
    narrative_ko: >
      태양에서 가장 가까운 갈색왜성 쌍 중 가까운 쪽이고, 시스템으로 치면 알파
      센타우리와 바너드 다음, 세 번째 이웃이다. 별이 되다 만 천체다. 목성 질량
      33.5배로는 수소를 태우지 못했고, 진짜 별이라면 진작 태워 없앴을 리튬이
      아직 남아 그걸 증명한다. 가진 온기라곤 수축하며 남긴 잔열뿐이라, 1310켈빈
      구름 꼭대기가 어둑한 마젠타빛으로 새어 나오는 게 전부다. 들썩이는 짝 옆에서
      이쪽은 차분한 쪽. 조용히 식어 가는, 하마터면 태양이 될 뻔한 세계의
      잉걸불이다. 인게임에서는 쌍의 중심을 잡는 주성 노릇을 한다.
    fields:
      - { name: body_type, value: "L7.5 brown dwarf, the quiet and smoothly clouded primary of the nearest BD binary", value_ko: "L7.5 갈색왜성, 최근접 갈색왜성 쌍의 조용하고 매끈한 주성", op: set }
      - { name: designation, value: "Luhman 16 A (WISE J104915.57-531906.1 A)", op: set }
      - { name: naked_eye, value: false, op: set, note: "V ~ 23; invisible without instruments despite 2 pc", note_ko: "V ~ 23. 2 pc인데도 맨눈 불가" }
    gate:
      criterion: [classification, observation]
      verdict: pass-in-window
      evidence: >
        Owner facet-walk 2026-08-16: the "quiet ember" identity adopted, with the color
        noun updated to magenta after the brown-dwarf color regime superseded the
        Planck-ember reading. Classification chain: L7.5 (Burgasser 2013 resolved NIR),
        substellar by dynamical mass 33.5 M_Jup + the lithium test (Faherty 2014,
        EW 8.0 A). Distance rank checked against the DB (2.0 pc, after alpha Cen and
        Barnard).
      evidence_ko: >
        오너 facet-walk 2026-08-16. "조용한 잉걸불" 정체성을 채택하되, 갈색왜성 색
        분기가 Planck 엠버 읽기를 대체한 뒤라 색 명사는 마젠타로 갱신. 분류 사슬은
        L7.5(Burgasser 2013 분해 근적외 분광), 역학 질량 33.5 M_Jup + 리튬 테스트
        (Faherty 2014, EW 8.0 Å)로 준항성 확증. 거리 순위는 DB로 확인(2.0 pc,
        알파 센타우리·바너드 다음).
    refs: [2014ApJ...790...90F, 2018A&A...618A.111L]

  - body: Luhman 16 A
    axis: bulk                        # §3.2 템플릿 앵커 — DB/Phase3 측정 passthrough 에코 (spin_axis·J2는 전용 행)
    body_class: free_rotator
    status: passthrough
    narrative: >
      The measured body, gathered in one place: 33.5 Jupiter masses weighed directly
      from the pair's 27.5-year orbit, a Jupiter-sized globe of 0.090 solar radii,
      1310 kelvin at the cloud tops, and a faint two-hundredths of a percent of the
      Sun's light, nearly all of it infrared. Surface pull is a crushing 110 g: the
      mass of thirty Jupiters packed into one Jupiter's volume. The system is young,
      about half a billion years, carried by its membership in the Oceanus moving
      group. One turn takes 6.94 hours, a tentative reading and the least certain
      number on this body.
    narrative_ko: >
      측정된 값들을 한자리에 모은 행이다. 질량은 쌍이 그리는 27.5년 궤도에서 직접
      잰 목성 33.5배. 덩치는 태양 반지름의 9%, 딱 목성만 하다. 구름 꼭대기는
      1310켈빈, 내는 빛은 태양의 0.002%가 전부인데 그마저 거의 적외선이다. 목성
      서른 개를 목성 하나 크기에 우겨 넣은 셈이라 표면 중력이 110g에 달한다.
      나이는 오케아누스 이동군에 묶여 약 5억 년, 갈색왜성치고 젊다. 자전은
      6.94시간에 한 바퀴인데 이것만은 잠정 판독이라, 이 천체의 숫자 가운데
      가장 부정확하다.
    fields:
      - { name: mass, value: 0.0320, unit: M_sun, op: passthrough, note: "±0.0003 = 33.5 M_Jup (Lazorenko & Sahlmann 2018 astrometric orbit)" }
      - { name: radius, value: 0.090, unit: R_sun, op: passthrough, note: "±0.01 = 0.9 R_Jup assumed field-BD degenerate radius (Faherty 2014); no L/T dwarf has a measured radius", note_ko: "±0.01 = 0.9 R_Jup, 필드 갈색왜성 축퇴 반지름 가정(Faherty 2014). 반지름이 측정된 L/T 왜성은 없다" }
      - { name: gravity, value: 1084, unit: m/s2, op: passthrough, phase3_default: "GM/R² derived echo (~110 g)", phase3_default_ko: "GM/R² 파생 에코 (~110 g)" }
      - { name: internal_heat, value: 2.14e-5, unit: L_sun, op: passthrough, note: "self-luminous: contraction heat, log L = -4.67 (Faherty 2014); this IS the body's light source", note_ko: "자발광. 수축열, log L = −4.67 (Faherty 2014). 이 광도가 곧 광원" }
      - { name: age, value: 0.5, unit: Gyr, op: passthrough, note: "Phase 3 resolved: Oceanus moving group (Gagné 2023), corroborated by 12C/13C = 74 (de Regt 2026); supersedes the Faherty 2014 field guess 1.5", note_ko: "Phase 3 해결값. 오케아누스 이동군(Gagné 2023), ¹²C/¹³C = 74 교차지지(de Regt 2026). Faherty 2014 필드 추정 1.5를 대체" }
      - { name: rotation_period, value: 0.2892, unit: d, op: passthrough, note: "6.94 hr, tentative TESS attribution (Apai 2021), owner-confirmed 2026-08-16; alternatives ~5-8 hr", note_ko: "6.94시간, TESS 잠정 귀속(Apai 2021), 오너 확정 2026-08-16. 대안 ~5–8시간" }
      - { name: obliquity, value: null, na_reason: "No constraint; the spin-axis row carries the derived line-of-sight inclination instead", na_reason_ko: "구속 없음. 시선경사 도출값은 자전축 전용 행이 담당" }
      - { name: geopotential_c22, value: null, na_reason: "A freely rotating fluid body is axisymmetric; no tidal triaxiality (rotational J2 gets its own row)", na_reason_ko: "자유 회전 유체 천체라 축대칭. 조석 삼축 없음 (회전 J2는 전용 행)" }
    refs: ["2018A&A...618A.111L", "2014ApJ...790...90F", "2021ApJ...906...64A", "2602.03409"]

  - body: Luhman 16 A
    axis: bulk.spin_axis_orientation
    status: gated
    driver: [window-selection]
    narrative: >
      We view this body nearly along its equator: the spectral lines say how fast it
      spins toward us, the brightness cycle says how long a turn takes, and with the
      radius those two numbers pin the viewing angle above 62 degrees. That is the
      same neighborhood as the pair's orbital plane, seen at 79 degrees, and the
      companion's spin sits there too. The tidy reading is that both worlds and their
      mutual orbit still share the plane they were born in, so the axis is drawn
      aligned to the orbit. Since the rotation period itself is tentative, the angle
      inherits that caution.
    narrative_ko: >
      우리는 이 천체를 거의 옆에서, 적도에 가까운 방향으로 보고 있다. 스펙트럼
      선이 넓어진 정도에서 자전 속도가, 밝기 변화의 주기에서 한 바퀴 도는 시간이
      나오고, 반지름까지 합치면 시선이 적도면에서 28도 이내로 좁혀진다. 쌍의
      궤도면도 79도로 기울어 보이니 사실상 같은 자리이고, 짝의 자전축 역시
      마찬가지다. 두 천체와 궤도가 태어날 때의 평면을 지금껏 그대로 공유한다는
      그림이 가장 자연스러워서, 자전축은 궤도에 정렬해 그린다. 다만 바탕이 된
      자전주기가 아직 잠정값이라, 이 각도 역시 확정이라기보다는 유력한 추정에
      가깝다.
    fields:
      - { name: spin_axis_orientation, value: "i★ > 62° (derived bracket 62-90°); drawn aligned with the AB orbital plane (i_orb 79.2°), azimuth free, ICRS pole at emit", value_ko: "i★ > 62°(도출 구간 62–90°) · AB 궤도면(i_orb 79.2°) 정렬로 그림, 방위각 자유, ICRS 극 변환은 emit", op: set }
    provenance: >
      2026-08-16 first gated in the same facet-walk that commissioned the
      spin-axis-inclination methodology; the derived bracket reproduces Apai 2021
      sec 6.2 (A within 28 deg of equator-on) and the alignment reading follows
      their spin-spin-orbit note.
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        sin i★ = v sin i · P / 2πR with v sin i 17.6±0.1 km/s (Crossfield 2014),
        P 6.94 hr (Apai 2021, tentative, owner-adopted), R 0.90-1.10 R_Jup gives
        v_eq 16.2-19.8 km/s and i★ > 62°, reproducing Apai 2021's own published
        bracket. Alignment with the orbit (Bedin 2017 i 79.21°; the curated L&S 2018
        100.26° is the same plane under the opposite node convention) is Apai 2021's
        reading, adopted. Caveat: conditional on the tentative 6.94 hr period; an
        ~8 hr period would push the nominal angle higher, still inside the bracket.
      evidence_ko: >
        sin i★ = v sin i · P / 2πR에 v sin i 17.6±0.1 km/s(Crossfield 2014),
        P 6.94시간(Apai 2021 잠정, 오너 채택), R 0.90–1.10 R_Jup을 넣으면 v_eq
        16.2–19.8 km/s, i★ > 62°. Apai 2021이 발표한 구간이 그대로 재현된다.
        궤도 정렬(Bedin 2017 i 79.21°. 큐레이션된 L&S 2018의 100.26°는 노드 규약이
        반대인 같은 평면)은 Apai 2021의 읽기를 채택. 주의: 잠정 주기 6.94시간에
        조건부이며, ~8시간이면 명목 각도가 더 올라가지만 구간 안에 머문다.
    refs: ["docs/reference/spin-axis-inclination-methodology.md", "2021ApJ...906...64A"]

  - body: Luhman 16 A
    axis: bulk.geopotential_j2
    status: gated
    driver: [window-selection]
    narrative: >
      A turn every seven hours leaves a mark on the figure: the equator bulges out
      by about a quarter of a percent. Subtle next to Jupiter's visible squash, but
      enormous by stellar standards, over a thousand times the Sun's flattening
      term. The body is a fully convective, degenerate globe, so how much it
      deforms per unit of spin follows the same structural branch as the roster's
      red dwarfs and white dwarf.
    narrative_ko: >
      일곱 시간마다 한 바퀴 도는 자전은 몸매에 흔적을 남긴다. 적도가 0.2%쯤 부풀어
      있다. 목성의 눈에 띄는 눌림에 비하면 미미하지만 별의 기준으로는 태양의
      1400배에 달하는 큰 값이다. 완전히 대류하는 축퇴 구체라, 자전 대비 얼마나
      찌그러지는지는 로스터의 적색왜성·백색왜성과 같은 구조 분기를 탄다.
    fields:
      - { name: geopotential_j2, value: 3.07e-4, op: set, note: "= 0.084 x q (n=3/2 polytrope Radau-Darwin branch), q = 3.66e-3 at P 6.94 hr", note_ko: "= 0.084 × q (n=3/2 폴리트로프 Radau–Darwin 분기), P 6.94시간에서 q = 3.66e-3" }
      - { name: reference_radius, value: 62613, unit: km, op: set, note: "= mean radius (0.090 R_sun), the Principia pair convention", note_ko: "= 평균 반지름(0.090 R☉), Principia 짝 규약" }
      - { name: flattening, value: 2.29e-3, op: set, note: "= (3J2+q)/2 derived echo; the visual oblate-mesh slot", note_ko: "= (3J₂+q)/2 파생 에코. 시각 oblate 메시 슬롯" }
    provenance: >
      2026-08-17 first computed at the owner-adopted tentative P 6.94 hr; scales as
      P^-2 (q 2.7e-3, J2 2.3e-4, f 1.7e-3 at 8 hr) if the period moves.
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        q = Omega^2 R^3 / GM = 3.656e-3 (P 6.94 hr, R 0.090 R_sun, M 0.0320 M_sun);
        J2 = 0.084 q on the fully-convective/degenerate n=3/2 polytrope branch
        (NMoI 0.205, same branch as TRAPPIST-1 and 40 Eri B on their boards);
        f = (3 J2 + q)/2 = 2.29e-3. Standing owner policy: stellar-class J2 is
        always computed and emitted, never waved off as negligible. Caveat: P is
        tentative and R assumed, so treat as +-40% on J2; the branch itself is the
        stable part.
      evidence_ko: >
        q = Ω²R³/GM = 3.656e-3 (P 6.94시간, R 0.090 R☉, M 0.0320 M☉).
        완전대류·축퇴 n=3/2 폴리트로프 분기(NMoI 0.205, TRAPPIST-1·40 Eri B와 같은
        분기)에서 J₂ = 0.084 q, f = (3J₂+q)/2 = 2.29e-3. 항성급 J₂는 무시가능로
        접지 않고 상시 계산·emit한다는 오너 정책 그대로. 주의: P가 잠정이고 R이
        가정이라 J₂는 ±40%로 볼 것. 분기 선택 자체가 안정적인 부분이다.
    refs: ["docs/reference/body-figure-methodology.md"]

  - body: Luhman 16 A
    axis: appearance
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      Three layers make the look. Underneath, the hot interior glows a deep
      temperature-red, and it shows wherever the cloud deck thins. The deck itself
      is the darkest thing on the globe: thick silicate and iron cloud, cool on top,
      a near-black lid over the fire. And where the deck breaks or thins at its
      edges, the escaping light comes through with its middle colors eaten away,
      so the seams glow a soft magenta. On this quiet half of the pair the deck is
      smooth and nearly unbroken; the fire stays buried, the seams are rare and
      faint, and the globe reads as a dark, slowly breathing ember laced with the
      thinnest pink light.
    narrative_ko: >
      생김새는 세 겹이다. 맨 아래에는 뜨거운 내부가 제 온도만큼의 짙은 붉은빛으로
      타고 있고, 구름층이 얇아지는 곳마다 그 빛이 비친다. 구름층 자체는 이 구체에서
      가장 어두운 존재다. 규산염과 철 구름이 두껍게 덮여 위가 차갑고, 불 위에 얹힌
      거의 검은 뚜껑처럼 보인다. 그리고 구름이 갈라지거나 가장자리가 얇아지는
      자리에서는, 빠져나오는 빛이 가운데 색을 다 뜯긴 채라 이음매가 은은한
      마젠타로 빛난다. 조용한 쪽인 이 천체는 구름층이 매끈하고 거의 갈라지지
      않아서, 불은 묻혀 있고 이음매는 드물고 희미하다. 전체적으로는 가느다란
      분홍빛이 실처럼 얹힌, 어둡게 숨 쉬는 잉걸불로 보인다.
    fields:
      - { name: banding, value: "#29140f", op: set, note: "cloud-deck base: near-black warm maroon (thick silicate/iron deck, cool tops)", note_ko: "구름층 베이스. 거의 검은 따뜻한 적갈색(두꺼운 규산염·철 구름, 윗면이 차가움)" }
      - { name: emission_glow, value: "#993500", op: set, note: "interior glow through thin spots: 1310 K Planck hue #ff5900 at 60% value; self-luminous, intrinsic emission color", note_ko: "얇은 자리로 비치는 내부 발광. 1310 K Planck 색조 #ff5900의 60% 명도. 자발광 고유색" }
      - { name: clouds, value: "rim glow #d94a63 on deck edges/seams", value_ko: "구름 가장자리·이음매의 테두리 발광 #d94a63", op: set, note: "soft R-dominant magenta (observed-L5 anchor family, owner pick); faint and sparse on A", note_ko: "부드러운 R-우세 마젠타(실측 L5 앵커 계열, 오너 선택). A에서는 희미하고 드묾" }
      - { name: haze, value: "single thick low-contrast layer, very slow evolution; wavelength-layered subtle variability <4.5%", value_ko: "두껍고 대비 낮은 단일층, 매우 느린 변화. 파장별로 층이 갈리는 미세 변광 <4.5%", op: set }
      - { name: rings, value: "none", op: set }
    provenance: >
      2026-08-16 owner color call: the soft R-dominant magenta (observed-L5 end)
      over the saturated model violets; supersedes the Phase 3 Planck-ember
      #662400. 2026-08-17 owner three-layer refinement: red interior, dark deck,
      magenta rims.
    gate:
      criterion: [derived-grounding, art]
      verdict: methodology-derived
      evidence: >
        Hue family from the brown-dwarf color regime (BT-Settl x CIE integration,
        triangulated against Burrows 2001's observed L5 and Cranmer 2021's published
        table); the owner's soft R-dominant pick sits at the observed-anchor end of
        that window, and the rim placement matches the physics (a thinning cloud
        column is where alkali-carved transmitted light escapes). Deck darkness is
        relative: at 1310 K the cloud tops still glow faintly. Morphology constraint
        honored: polarimetry requires constant longitudinal banding on A
        (Millar-Blanchaer 2020), so the deck carries low-contrast bands rather than
        a featureless skin.
      evidence_ko: >
        색조 계열은 갈색왜성 색 분기에서(BT-Settl × CIE 적분, Burrows 2001 실측
        L5와 Cranmer 2021 발표 표로 삼각측량). 오너의 부드러운 R-우세 선택은 그
        허용 폭에서 실측 앵커 쪽 끝에 있고, 테두리 배치는 물리와도 맞는다(구름
        기둥이 얇아지는 곳이 알칼리에 깎인 투과광이 새는 자리). 구름층의 어두움은
        상대적이다. 1310 K라 구름 윗면도 희미하게는 빛난다. 형태 구속도 지켰다.
        편광 관측이 A에 상시 위도 띠를 요구하므로(Millar-Blanchaer 2020) 구름층은
        민무늬가 아니라 대비 낮은 띠를 갖는다.
    refs: ["docs/reference/stellar-photospheric-color-methodology.md", "2020ApJ...894...42M", "2015ApJ...805L...3O"]

  - body: Luhman 16 A
    axis: magnetism
    status: gated
    driver: [window-selection]
    narrative: >
      No one has measured this body's magnetic field, but its own heat budget sets
      one: in a fast-spinning convective globe the field strength follows from how
      much internal power threads the interior, and here that gives a surface field
      around 1250 gauss, several times Jupiter's. The deepest radio and X-ray
      searches ever pointed at a brown dwarf found nothing, and the two facts do
      not clash: the upper atmosphere is too cold and neutral to couple to the
      field, so a kilogauss magnet can sit under the clouds in perfect silence.
      And this dynamo does the job a stellar wind would do, supplying the magnetic
      pressure itself. Because the pair plows through interstellar gas at 26 km/s,
      the boundary where that pressure meets the interstellar ram stands at 490
      body radii, a fifth of an astronomical unit. The flow barely exceeds the
      local magnetosonic speed, so only a weak wave forms ahead of the boundary,
      and the tail streams thirty astronomical units downwind alongside its
      companion's. It also keeps one proton belt, fed the same way Earth's inner
      belt is.
    narrative_ko: >
      이 천체의 자기장을 측정한 기록은 없지만, 열수지를 통해 값을 유추할 수 있다.
      빠르게 도는 대류 구체에서는 내부를 관통하는 동력의 양이 자기장 세기를
      결정하는데, 여기서는 표면 기준 1250가우스쯤, 목성의 몇 배가 나온다.
      갈색왜성을 겨눈 역대 가장 깊은 전파·X선 수색은 아무것도 찾지 못했지만,
      두 사실은 서로 상충하지 않는다. 상층 대기가 지나치게 차갑고 중성이라
      자기장과 엮이지 못해, 킬로가우스 급의 자기장이 구름 밑에 침묵하고 있을 수
      있다. 그리고 이 다이나모는 항성풍을 대신해 자기압을 만들어낸다. 쌍성이
      성간 가스를 초속 26 km로 헤치고 나아가므로, 자기압과 성간 램압이 만나는
      경계가 천체 반지름의 490배, 0.2 천문단위에 선다. 흐름이 국소 자기음속을
      살짝 넘는 정도라 경계 앞에는 약한 파도만 서고, 꼬리는 하류로 30 천문단위를
      뻗어 짝의 꼬리와 나란히 흐른다. 또한 지구 내대와 같은 원리의 양성자 벨트도
      하나 보유하고 있다.
    fields:
      - { name: magnetic_field, value: 1250, unit: G, op: set, note: "B_dyn = 4.8 (M L^2 / R^7)^(1/6) kG, BD branch (dynamo near the surface); R 0.08-0.10 spread gives 1100-1430 G", note_ko: "B_dyn = 4.8 (M L²/R⁷)^(1/6) kG, 갈색왜성 분기(표면 근처 dynamo). R 0.08–0.10이면 1100–1430 G" }
      - { name: pause_radius, value: 654.9, unit: R_bd, op: set, note: "= nose x 2^alpha; ISM-ram Chapman-Ferraro. Reproduce: scripts/refs/magnetopause_geometry.py (BROWN DWARFS section)", note_ko: "= 노즈 × 2^α. 성간 램압 Chapman–Ferraro. 재현: scripts/refs/magnetopause_geometry.py (BROWN DWARFS 절)" }
      - { name: pause_compression, value: 1.3379, op: set, note: "= 2^0.42" }
      - { name: pause_extension, value: 0.0089195, op: set, note: "= 2^alpha / 150" }
      - { name: pause_height_scale, value: 1.0, op: set, note: "Shue is axisymmetric", note_ko: "Shue는 축대칭" }
      - { name: pause_nose, value: 490, unit: R_bd, op: set, note: "0.205 AU; B_eq 441 G (= B_dyn / 2 sqrt 2) vs ISM ram (n 0.2 /cc, v_rel 26 km/s from the LISM cloud vectors)", note_ko: "0.205 AU. B_eq 441 G(= B_dyn/2√2) 대 성간 램압(n 0.2 /cc, v_rel 26 km/s, LISM 구름 벡터)" }
      - { name: pause_alpha, value: 0.42, op: set, note: "rotation-dominated magnetosphere: Jupiter's fitted ceiling, clamped (the Polyphemus precedent)", note_ko: "회전지배 자기권. 목성 피팅 상한 클램프(폴리페무스 선례)" }
      - { name: pause_tail, value: 73426, unit: R_bd, op: set, note: "L = 150 x nose = 30.7 AU convention", note_ko: "L = 150 × 노즈 = 30.7 AU 관례" }
      - { name: radiation_inner, value: 10, unit: "rad/h", op: set, note: "CRAND-fed proton belt, Earth-inner analog (same feeding mechanism); unmodulated interstellar GCR could raise it a few-fold; kept faint under the Osten 2015 null", note_ko: "CRAND 공급 양성자 벨트, 지구 내대 유추(같은 공급 기제). 비변조 성간 우주선이면 몇 배 위. Osten 2015 무음 아래로 약하게 유지" }
      - { name: radiation_inner_gradient, value: 2.09, op: set, note: "Earth-inner analog profile", note_ko: "지구 내대 유추 프로파일" }
      - { name: radiation_outer, value: null, na_reason: "No outer belt: a wind/torus-fed population has no source here (no stellar wind, no volcanic moon)", na_reason_ko: "외대 없음. 항성풍·화산위성 공급원이 없어 채울 입자가 없다" }
    provenance: >
      2026-08-17 first gated with magnetosphere/belts as prose ("present but
      non-emitting" / "none"). Re-gated the same day: owner sent it back through
      the magnetosphere-geometry methodology; the ISM-ram branch was added to
      magnetopause_geometry.py, and belts moved from none to a faint CRAND proton
      belt after the 2023 UCD radiation-belt imaging (and the 2025 binarity
      enhancement) made the class precedent observational.
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        Field: energy-flux dynamo scaling (Reiners & Christensen 2010 form) on
        measured M and L, assumed R: B_dyn 1246 G, bracket 1100-1430 over R
        0.08-0.10; compatible with the Osten 2015 non-detection (neutral
        atmosphere decouples matter from field; the paper cites the same scaling
        predicting ~1 kG for this class). Geometry: the magnetosphere-geometry
        recipe on the ISM-ram branch, nose 490 R_bd from B_eq 441 G vs rho v^2
        (n 0.2 cm-3, v_rel 26 km/s from the LISM cloud vectors, G/LIC/Blue span
        24-28), M_A 1.77 super-Alfvenic so the Shue form with the
        rotation-dominated alpha 0.42 clamp applies; the cfg set is emitted by
        the same script. Belt: the class precedent is imaged (Kao 2023 Nature;
        Climent 2023 Science) and binaries show belt emission more often (Kao
        2025); the dose is an Earth-inner CRAND analog, order-of-magnitude,
        kept faint under the Osten synchrotron null. Caveat: n_ism and the dose
        anchor are the soft inputs; the nose scales as (n v^2)^(-1/6), so even
        a factor 4 in pressure moves it only ~20%.
      evidence_ko: >
        자기장: 에너지플럭스 dynamo 스케일링(Reiners & Christensen 2010 형)에
        측정 M·L과 가정 R로 B_dyn 1246 G, R 0.08–0.10 전파 시 1100–1430 G.
        Osten 2015 불검출과 양립(중성 대기가 물질과 자기장을 분리. 논문 스스로
        같은 스케일링의 ~1 kG 예측을 인용). 기하: 자기권 기하 레시피의 성간
        램압 분기로 B_eq 441 G 대 ρv²(n 0.2 cm⁻³, v_rel 26 km/s, LISM 구름 벡터
        G/LIC/Blue 24–28)에서 노즈 490 R_bd. M_A 1.77 초알펜이라 회전지배 α 0.42
        클램프의 Shue 형식이 성립하고, cfg 세트는 같은 스크립트가 낸다. 벨트:
        부류 선례가 영상으로 확인됐고(Kao 2023 Nature, Climent 2023 Science)
        쌍성에서 더 잦다(Kao 2025). 선량은 지구 내대 CRAND 유추의 자릿수 값이며
        Osten 싱크로트론 무음 아래로 약하게 유지. 주의: n_ism과 선량 앵커가 무른
        입력이지만 노즈는 (nv²)^(-1/6)이라 압력이 4배 틀려도 ~20%만 움직인다.
    refs: ["docs/reference/planetary-magnetosphere-geometry-methodology.md", "docs/reference/planetary-dynamo-scaling.md", "2015ApJ...805L...3O", "2023Natur.619..272K", "2023Sci...381.1120C", "2403.08860"]

  - body: Luhman 16 A
    axis: environment
    status: passthrough
    narrative: >
      The quietest kind of neighborhood. The deepest radio and X-ray searches ever
      aimed at a brown dwarf watched this pair through multiple rotations and saw
      nothing at all. There is no wind worth the name either; all a visiting craft
      receives here is the body's own faint thermal glow.
    narrative_ko: >
      더없이 차분한 천체다. 갈색왜성을 겨눈 역대 가장 깊은 전파·X선 수색이 이 쌍을
      여러 자전에 걸쳐 관측했지만 어떠한 현상도 발견하지 못했다. 항성풍이라 부를
      만한 것도 없으며, 이곳에 도달한 탐사선이 받을 것은 약하게 뿜어내는 복사열이
      전부다.
    fields:
      - { name: activity, value: "radio log(Lr/Lbol) < -18.1 (5.5 GHz) / < -17.9 (9 GHz); X-ray log(Lx/Lbol) < -5.7; no flares over multiple rotations", value_ko: "전파 log(Lr/Lbol) < −18.1(5.5 GHz) / < −17.9(9 GHz), X선 log(Lx/Lbol) < −5.7. 여러 자전 동안 플레어 없음", op: passthrough, note: "deepest fractional UCD limits (Osten 2015 ATCA + Chandra)", note_ko: "극저온왜성 최심 상한(Osten 2015 ATCA+Chandra)" }
      - { name: flares, value: "none detected", value_ko: "검출 없음", op: passthrough }
      - { name: uv_xray_flux, value: "negligible (log Lx < 23.0 erg/s)", value_ko: "무시 가능(log Lx < 23.0 erg/s)", op: passthrough }
      - { name: stellar_wind, value: "none modeled", value_ko: "모델 없음", op: passthrough, note: "no measurable outflow; nothing for Kerbalism to carry", note_ko: "측정 가능한 유출 없음. Kerbalism이 실어 나를 것도 없음" }
      - { name: radiation, value: "thermal only", value_ko: "열복사뿐", op: passthrough }
      - { name: habitable_zone, value: null, na_reason: "At L = 2.1e-5 L_sun the liquid-water distance lies inside ~0.005 AU, under the Roche limit for any real companion; no usable zone exists", na_reason_ko: "L = 2.1e-5 L☉이면 액체 물 거리가 ~0.005 AU 안쪽, 실존 동반체의 로슈 한계 밑이라 쓸 만한 영역이 없음" }
    refs: ["2015ApJ...805L...3O"]

  - body: Luhman 16 A
    axis: appearance.aurora
    status: gated
    driver: [art-direction]
    narrative: >
      A faint magenta-pink auroral ring sits over each pole. Brown dwarfs can
      light aurorae on their own, driving currents out of their spinning
      magnetospheres with no star to feed them, and the phenomenon has been
      observed on bodies of this class. The dedicated search at this pair found
      nothing, but auroral radio is a narrowly beamed emission, so for a body
      viewed almost edge-on that silence cannot be read as proof of absence.
    narrative_ko: >
      극에 희미한 마젠타-분홍 오로라 고리가 존재한다. 갈색왜성은 스스로의
      자기권에서 전류를 만들어 오로라를 발광시킬 수 있으며, 실제로 그러한 현상이
      관측된 바 있다. 이 천체를 향한 관측에서는 발견하지 못했지만, 오로라 전파는
      좁게 뻗는 빔이라 거의 옆에서 보는 천체에서 그 무음을 부재의 증거로 볼 수
      없다.
    fields:
      - { name: aurora, value: "faint narrow polar ring, magenta-pink #d94a63 family, low altitude, both poles", value_ko: "희미하고 좁은 극 고리, 마젠타-분홍 #d94a63 계열, 낮은 고도, 양극", op: set }
    provenance: >
      2026-08-17 owner call: art aurora adopted over the strict observational
      "none", using the ECM beaming loophole; supersedes the aurora: none field
      the appearance row briefly carried.
    gate:
      criterion: [observation, art]
      verdict: documented-divergence
      evidence: >
        Physically coherent with the rest of the board: the dynamo row's ~1.25 kG
        field is ample for auroral ECM, and the class shows aurorae at T types
        (Kao 2016 detections at kG-scale fields). Checked against the observation:
        Osten 2015's limits constrain emission toward Earth, not the existence of
        auroral currents; the divergence is confined to that beaming loophole.
        Caveat: rendered faint and narrow so the art stays inside what the null
        allows.
      evidence_ko: >
        보드의 다른 행들과 물리적으로 맞물린다. dynamo 행의 ~1.25 kG 자기장은
        오로라 ECM에 충분하고, 부류 차원에서는 T형에서도 kG급 자기장과 함께
        오로라가 검출됐다(Kao 2016). 관측과의 대조도 확인했다. Osten 2015 상한이
        구속하는 것은 지구 방향 방출이지 오로라 전류의 존재가 아니므로, 이탈은
        빔 기하 구멍 안으로 한정된다. 주의: 무음이 허용하는 범위에 머물도록
        어둡고 좁게만 그린다.
      divergence_note: >
        Departs the Osten 2015 non-detection (deepest UCD auroral-radio limits,
        log Lr/Lbol < -18.1, multi-rotation coverage): drawn as present-but-faint
        anyway. The loophole is physical: ECM auroral radio is narrowly beamed,
        so a null at Earth does not exclude auroral currents on a body viewed
        near equator-on. Class precedent: auroral emission is confirmed on UCDs
        including T dwarfs (Hallinan 2015; Kao 2016, ~10% detection rate).
      divergence_note_ko: >
        Osten 2015 불검출(극저온왜성 최심 오로라 전파 상한, log Lr/Lbol < −18.1,
        여러 자전 커버)에서 이탈해 "있되 희미함"으로 그린다. 구멍은 물리적이다.
        ECM 오로라 전파는 좁게 빔이 지므로, 거의 적도 방향에서 보는 천체의 지구
        기준 무음은 오로라 전류의 부재 증명이 아니다. 부류 선례: T왜성을 포함한
        극저온왜성에서 오로라 방출 확인(Hallinan 2015, Kao 2016, 검출률 ~1할).
    refs: ["2015ApJ...805L...3O", "2015Natur.523..568H", "2016ApJ...818...24K"]
