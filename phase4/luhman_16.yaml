# Luhman 16 (WISE J104915.57-531906.1) Phase 4 결정 보드 — 최근접 갈색왜성 쌍 (L7.5 + T0.5, 2.0 pc). (body × axis) 행별 상태. DB 불변, staging.
# 실관측 시스템 → 측정 passthrough + 방법론 도출(자전축·자기장·색) + 오너 아트(색 계열·B 날씨). grounding=docs/phase3/luhman-16-*.md
# 아트 스크래치=phase4/art-direction/luhman-16-art-direction.md, 작업 노트=phase4/luhman16-board/
schema_version: 2
