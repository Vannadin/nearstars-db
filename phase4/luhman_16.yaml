decisions:
  # ── Luhman 16 A (L7.5 주성, 조용한 쪽) ──────────────────────────────────
  - body: Luhman 16 A
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The nearer half of the closest brown dwarf pair to the Sun, and the third-closest
      system of any kind. It is a failed star: at 33.5 Jupiter masses it never lit
      hydrogen, and the lithium that a true star would have burned away is still there
      to prove it. What warmth it has is leftover contraction heat, radiated from
      1310-kelvin cloud tops as a dim magenta glow. Next to its restless companion it
      is the calm one, a smooth, quietly fading ember of a world that almost became
      a sun. In-game it anchors the system as the primary the pair swings around.
    narrative_ko: >
      태양에서 가장 가까운 갈색왜성 쌍 중 가까운 쪽이고, 시스템으로 치면 알파
      센타우리와 바너드 다음, 세 번째 이웃이다. 별이 되다 만 천체다. 목성 질량
      33.5배로는 수소를 태우지 못했고, 진짜 별이라면 진작 태워 없앴을 리튬이
      아직 남아 그걸 증명한다. 가진 온기라곤 수축하며 남긴 잔열뿐이라, 1310켈빈
      구름 꼭대기가 어둑한 마젠타빛으로 새어 나오는 게 전부다. 들썩이는 짝 옆에서
      이쪽은 차분한 쪽. 조용히 식어 가는, 하마터면 태양이 될 뻔한 세계의
      잉걸불이다. 인게임에서는 쌍의 중심을 잡는 주성 노릇을 한다.
    fields:
      - { name: body_type, value: "L7.5 brown dwarf, the quiet and smoothly clouded primary of the nearest BD binary", value_ko: "L7.5 갈색왜성, 최근접 갈색왜성 쌍의 조용하고 매끈한 주성", op: set }
      - { name: designation, value: "Luhman 16 A (WISE J104915.57-531906.1 A)", op: set }
      - { name: naked_eye, value: false, op: set, note: "V ~ 23; invisible without instruments despite 2 pc", note_ko: "V ~ 23. 2 pc인데도 맨눈 불가" }
    gate:
      criterion: [classification, observation]
      verdict: pass-in-window
      evidence: >
        Owner facet-walk 2026-08-16: the "quiet ember" identity adopted, with the color
        noun updated to magenta after the brown-dwarf color regime superseded the
        Planck-ember reading. Classification chain: L7.5 (Burgasser 2013 resolved NIR),
        substellar by dynamical mass 33.5 M_Jup + the lithium test (Faherty 2014,
        EW 8.0 A). Distance rank checked against the DB (2.0 pc, after alpha Cen and
        Barnard).
      evidence_ko: >
        오너 facet-walk 2026-08-16. "조용한 잉걸불" 정체성을 채택하되, 갈색왜성 색
        분기가 Planck 엠버 읽기를 대체한 뒤라 색 명사는 마젠타로 갱신. 분류 사슬은
        L7.5(Burgasser 2013 분해 근적외 분광), 역학 질량 33.5 M_Jup + 리튬 테스트
        (Faherty 2014, EW 8.0 Å)로 준항성 확증. 거리 순위는 DB로 확인(2.0 pc,
        알파 센타우리·바너드 다음).
    refs: [2014ApJ...790...90F, 2018A&A...618A.111L]

  - body: Luhman 16 A
    axis: bulk                        # §3.2 템플릿 앵커 — DB/Phase3 측정 passthrough 에코 (spin_axis·J2는 전용 행)
    body_class: free_rotator
    status: passthrough
    narrative: >
      The measured body, gathered in one place: 33.5 Jupiter masses weighed directly
      from the pair's 27.5-year orbit, a Jupiter-sized globe of 0.090 solar radii,
      1310 kelvin at the cloud tops, and a faint two-hundredths of a percent of the
      Sun's light, nearly all of it infrared. Surface pull is a crushing 110 g: the
      mass of thirty Jupiters packed into one Jupiter's volume. The system is young,
      about half a billion years, carried by its membership in the Oceanus moving
      group. One turn takes 6.94 hours, a tentative reading and the least certain
      number on this body.
    narrative_ko: >
      측정된 값들을 한자리에 모은 행이다. 질량은 쌍이 그리는 27.5년 궤도에서 직접
      잰 목성 33.5배. 덩치는 태양 반지름의 9%, 딱 목성만 하다. 구름 꼭대기는
      1310켈빈, 내는 빛은 태양의 0.002%가 전부인데 그마저 거의 적외선이다. 목성
      서른 개를 목성 하나 크기에 우겨 넣은 셈이라 표면 중력이 110g에 달한다.
      나이는 오케아누스 이동군에 묶여 약 5억 년, 갈색왜성치고 젊다. 자전은
      6.94시간에 한 바퀴인데 이것만은 잠정 판독이라, 이 천체의 숫자 가운데
      가장 부정확하다.
    fields:
      - { name: kopernicus_name, value: "Luhman 16 A", op: set, note: "Kopernicus body name. The formal designation verbatim (_naming.to_kopernicus_name): the in-game label is a separate field, so the internal name carries the designation rather than the culture name, and the whole designation is kept because tails collide across systems", note_ko: "Kopernicus 바디명. 공식 명칭 그대로다(_naming.to_kopernicus_name). 인게임 표시명은 별도 필드이므로 내부 이름은 문화명이 아니라 명칭을 쓰고, 꼬리만 쓰면 계 사이에서 충돌하므로 명칭 전체를 유지한다" }
      - { name: mass, value: 0.0320, unit: M_sun, op: passthrough, note: "±0.0003 = 33.5 M_Jup (Lazorenko & Sahlmann 2018 astrometric orbit)" }
      - { name: radius, value: 0.090, unit: R_sun, op: passthrough, note: "±0.01 = 0.9 R_Jup assumed field-BD degenerate radius (Faherty 2014); no L/T dwarf has a measured radius", note_ko: "±0.01 = 0.9 R_Jup, 필드 갈색왜성 축퇴 반지름 가정(Faherty 2014). 반지름이 측정된 L/T 왜성은 없다" }
      - { name: gravity, value: 1084, unit: m/s2, op: passthrough, phase3_default: "GM/R² derived echo (~110 g)", phase3_default_ko: "GM/R² 파생 에코 (~110 g)" }
      - { name: internal_heat, value: 2.14e-5, unit: L_sun, op: passthrough, note: "self-luminous: contraction heat, log L = -4.67 (Faherty 2014); this IS the body's light source", note_ko: "자발광. 수축열, log L = −4.67 (Faherty 2014). 이 광도가 곧 광원" }
      - { name: age, value: 0.5, unit: Gyr, op: passthrough, note: "Phase 3 resolved: Oceanus moving group (Gagné 2023), corroborated by 12C/13C = 74 (de Regt 2026); supersedes the Faherty 2014 field guess 1.5", note_ko: "Phase 3 해결값. 오케아누스 이동군(Gagné 2023), ¹²C/¹³C = 74 교차지지(de Regt 2026). Faherty 2014 필드 추정 1.5를 대체" }
      - { name: rotation_period, value: 0.2892, unit: d, op: passthrough, note: "6.94 hr, tentative TESS attribution (Apai 2021), owner-confirmed 2026-08-16; alternatives ~5-8 hr", note_ko: "6.94시간, TESS 잠정 귀속(Apai 2021), 오너 확정 2026-08-16. 대안 ~5–8시간" }
      - { name: obliquity, value: null, na_reason: "No constraint; the spin-axis row carries the derived line-of-sight inclination instead", na_reason_ko: "구속 없음. 시선경사 도출값은 자전축 전용 행이 담당" }
      - { name: geopotential_c22, value: null, na_reason: "A freely rotating fluid body is axisymmetric; no tidal triaxiality (rotational J2 gets its own row)", na_reason_ko: "자유 회전 유체 천체라 축대칭. 조석 삼축 없음 (회전 J2는 전용 행)" }
    refs: ["2018A&A...618A.111L", "2014ApJ...790...90F", "2021ApJ...906...64A", "2602.03409"]

  - body: Luhman 16 A
    axis: bulk.spin_axis_orientation
    status: gated
    driver: [window-selection]
    narrative: >
      We view this body nearly along its equator: the spectral lines say how fast it
      spins toward us, the brightness cycle says how long a turn takes, and with the
      radius those two numbers pin the viewing angle above 62 degrees. That is the
      same neighborhood as the pair's orbital plane, seen at 79 degrees, and the
      companion's spin sits there too. The tidy reading is that both worlds and their
      mutual orbit still share the plane they were born in, so the axis is drawn
      aligned to the orbit. Since the rotation period itself is tentative, the angle
      inherits that caution.
    narrative_ko: >
      우리는 이 천체를 거의 옆에서, 적도에 가까운 방향으로 보고 있다. 스펙트럼
      선이 넓어진 정도에서 자전 속도가, 밝기 변화의 주기에서 한 바퀴 도는 시간이
      나오고, 반지름까지 합치면 시선이 적도면에서 28도 이내로 좁혀진다. 쌍의
      궤도면도 79도로 기울어 보이니 사실상 같은 자리이고, 짝의 자전축 역시
      마찬가지다. 두 천체와 궤도가 태어날 때의 평면을 지금껏 그대로 공유한다는
      그림이 가장 자연스러워서, 자전축은 궤도에 정렬해 그린다. 다만 바탕이 된
      자전주기가 아직 잠정값이라, 이 각도 역시 확정이라기보다는 유력한 추정에
      가깝다.
    fields:
      - { name: spin_axis_orientation, value: "i★ > 62° (derived bracket 62-90°); drawn aligned with the AB orbital plane (i_orb 79.2°), azimuth free, ICRS pole at emit", value_ko: "i★ > 62°(도출 구간 62–90°) · AB 궤도면(i_orb 79.2°) 정렬로 그림, 방위각 자유, ICRS 극 변환은 emit", op: set }
    provenance: >
      2026-08-16 first gated in the same facet-walk that commissioned the
      spin-axis-inclination methodology; the derived bracket reproduces Apai 2021
      sec 6.2 (A within 28 deg of equator-on) and the alignment reading follows
      their spin-spin-orbit note.
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        sin i★ = v sin i · P / 2πR with v sin i 17.6±0.1 km/s (Crossfield 2014),
        P 6.94 hr (Apai 2021, tentative, owner-adopted), R 0.90-1.10 R_Jup gives
        v_eq 16.2-19.8 km/s and i★ > 62°, reproducing Apai 2021's own published
        bracket. Alignment with the orbit (Bedin 2017 i 79.21°; the curated L&S 2018
        100.26° is the same plane under the opposite node convention) is Apai 2021's
        reading, adopted. Caveat: conditional on the tentative 6.94 hr period; an
        ~8 hr period would push the nominal angle higher, still inside the bracket.
      evidence_ko: >
        sin i★ = v sin i · P / 2πR에 v sin i 17.6±0.1 km/s(Crossfield 2014),
        P 6.94시간(Apai 2021 잠정, 오너 채택), R 0.90–1.10 R_Jup을 넣으면 v_eq
        16.2–19.8 km/s, i★ > 62°. Apai 2021이 발표한 구간이 그대로 재현된다.
        궤도 정렬(Bedin 2017 i 79.21°. 큐레이션된 L&S 2018의 100.26°는 노드 규약이
        반대인 같은 평면)은 Apai 2021의 읽기를 채택. 주의: 잠정 주기 6.94시간에
        조건부이며, ~8시간이면 명목 각도가 더 올라가지만 구간 안에 머문다.
    refs: ["docs/reference/spin-axis-inclination-methodology.md", "2021ApJ...906...64A"]

  - body: Luhman 16 A
    axis: bulk.geopotential_j2
    status: gated
    driver: [window-selection]
    narrative: >
      A turn every seven hours leaves a mark on the figure: the equator bulges out
      by about a quarter of a percent. Subtle next to Jupiter's visible squash, but
      enormous by stellar standards, over a thousand times the Sun's flattening
      term. The body is a fully convective, degenerate globe, so how much it
      deforms per unit of spin follows the same structural branch as the roster's
      red dwarfs and white dwarf.
    narrative_ko: >
      일곱 시간마다 한 바퀴 도는 자전은 몸매에 흔적을 남긴다. 적도가 0.2%쯤 부풀어
      있다. 목성의 눈에 띄는 눌림에 비하면 미미하지만 별의 기준으로는 태양의
      1400배에 달하는 큰 값이다. 완전히 대류하는 축퇴 구체라, 자전 대비 얼마나
      찌그러지는지는 로스터의 적색왜성·백색왜성과 같은 구조 분기를 탄다.
    fields:
      - { name: geopotential_j2, value: 3.07e-4, op: set, note: "= 0.084 x q (n=3/2 polytrope Radau-Darwin branch), q = 3.66e-3 at P 6.94 hr", note_ko: "= 0.084 × q (n=3/2 폴리트로프 Radau–Darwin 분기), P 6.94시간에서 q = 3.66e-3" }
      - { name: reference_radius, value: 62613, unit: km, op: set, note: "= mean radius (0.090 R_sun), the Principia pair convention", note_ko: "= 평균 반지름(0.090 R☉), Principia 짝 규약" }
      - { name: flattening, value: 2.29e-3, op: set, note: "= (3J2+q)/2 derived echo; the visual oblate-mesh slot", note_ko: "= (3J₂+q)/2 파생 에코. 시각 oblate 메시 슬롯" }
    provenance: >
      2026-08-17 first computed at the owner-adopted tentative P 6.94 hr; scales as
      P^-2 (q 2.7e-3, J2 2.3e-4, f 1.7e-3 at 8 hr) if the period moves.
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        q = Omega^2 R^3 / GM = 3.656e-3 (P 6.94 hr, R 0.090 R_sun, M 0.0320 M_sun);
        J2 = 0.084 q on the fully-convective/degenerate n=3/2 polytrope branch
        (NMoI 0.205, same branch as TRAPPIST-1 and 40 Eri B on their boards);
        f = (3 J2 + q)/2 = 2.29e-3. Standing owner policy: stellar-class J2 is
        always computed and emitted, never waved off as negligible. Caveat: P is
        tentative and R assumed, so treat as +-40% on J2; the branch itself is the
        stable part.
      evidence_ko: >
        q = Ω²R³/GM = 3.656e-3 (P 6.94시간, R 0.090 R☉, M 0.0320 M☉).
        완전대류·축퇴 n=3/2 폴리트로프 분기(NMoI 0.205, TRAPPIST-1·40 Eri B와 같은
        분기)에서 J₂ = 0.084 q, f = (3J₂+q)/2 = 2.29e-3. 항성급 J₂는 무시가능로
        접지 않고 상시 계산·emit한다는 오너 정책 그대로. 주의: P가 잠정이고 R이
        가정이라 J₂는 ±40%로 볼 것. 분기 선택 자체가 안정적인 부분이다.
    refs: ["docs/reference/body-figure-methodology.md"]

  - body: Luhman 16 A
    axis: appearance
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      Three layers make the look. Underneath, the hot interior glows a deep
      temperature-red, and it shows wherever the cloud deck thins. The deck itself
      is the darkest thing on the globe: thick silicate and iron cloud, cool on top,
      a near-black lid over the fire. And where the deck breaks or thins at its
      edges, the escaping light comes through with its middle colors eaten away,
      so the seams glow a soft magenta. On this quiet half of the pair the deck is
      smooth and nearly unbroken; the fire stays buried, the seams are rare and
      faint, and the globe reads as a dark, slowly breathing ember laced with the
      thinnest pink light.
    narrative_ko: >
      생김새는 세 겹이다. 맨 아래에는 뜨거운 내부가 제 온도만큼의 짙은 붉은빛으로
      타고 있고, 구름층이 얇아지는 곳마다 그 빛이 비친다. 구름층 자체는 이 구체에서
      가장 어두운 존재다. 규산염과 철 구름이 두껍게 덮여 위가 차갑고, 불 위에 얹힌
      거의 검은 뚜껑처럼 보인다. 그리고 구름이 갈라지거나 가장자리가 얇아지는
      자리에서는, 빠져나오는 빛이 가운데 색을 다 뜯긴 채라 이음매가 은은한
      마젠타로 빛난다. 조용한 쪽인 이 천체는 구름층이 매끈하고 거의 갈라지지
      않아서, 불은 묻혀 있고 이음매는 드물고 희미하다. 전체적으로는 가느다란
      분홍빛이 실처럼 얹힌, 어둡게 숨 쉬는 잉걸불로 보인다.
    fields:
      - { name: banding, value: "#29140f", op: set, note: "cloud-deck base: near-black warm maroon (thick silicate/iron deck, cool tops)", note_ko: "구름층 베이스. 거의 검은 따뜻한 적갈색(두꺼운 규산염·철 구름, 윗면이 차가움)" }
      - { name: emission_glow, value: "#993500", op: set, note: "interior glow through thin spots: 1310 K Planck hue #ff5900 at 60% value; self-luminous, intrinsic emission color", note_ko: "얇은 자리로 비치는 내부 발광. 1310 K Planck 색조 #ff5900의 60% 명도. 자발광 고유색" }
      - { name: clouds, value: "rim glow #d94a63 on deck edges/seams", value_ko: "구름 가장자리·이음매의 테두리 발광 #d94a63", op: set, note: "soft R-dominant magenta (observed-L5 anchor family, owner pick); faint and sparse on A", note_ko: "부드러운 R-우세 마젠타(실측 L5 앵커 계열, 오너 선택). A에서는 희미하고 드묾" }
      - { name: haze, value: "single thick low-contrast layer, very slow evolution; wavelength-layered subtle variability <4.5%", value_ko: "두껍고 대비 낮은 단일층, 매우 느린 변화. 파장별로 층이 갈리는 미세 변광 <4.5%", op: set }
      - { name: rings, value: "none", op: set }
    provenance: >
      2026-08-16 owner color call: the soft R-dominant magenta (observed-L5 end)
      over the saturated model violets; supersedes the Phase 3 Planck-ember
      #662400. 2026-08-17 owner three-layer refinement: red interior, dark deck,
      magenta rims.
    gate:
      criterion: [derived-grounding, art]
      verdict: methodology-derived
      evidence: >
        Hue family from the brown-dwarf color regime (BT-Settl x CIE integration,
        triangulated against Burrows 2001's observed L5 and Cranmer 2021's published
        table); the owner's soft R-dominant pick sits at the observed-anchor end of
        that window, and the rim placement matches the physics (a thinning cloud
        column is where alkali-carved transmitted light escapes). Deck darkness is
        relative: at 1310 K the cloud tops still glow faintly. Morphology constraint
        honored: polarimetry requires constant longitudinal banding on A
        (Millar-Blanchaer 2020), so the deck carries low-contrast bands rather than
        a featureless skin.
      evidence_ko: >
        색조 계열은 갈색왜성 색 분기에서(BT-Settl × CIE 적분, Burrows 2001 실측
        L5와 Cranmer 2021 발표 표로 삼각측량). 오너의 부드러운 R-우세 선택은 그
        허용 폭에서 실측 앵커 쪽 끝에 있고, 테두리 배치는 물리와도 맞는다(구름
        기둥이 얇아지는 곳이 알칼리에 깎인 투과광이 새는 자리). 구름층의 어두움은
        상대적이다. 1310 K라 구름 윗면도 희미하게는 빛난다. 형태 구속도 지켰다.
        편광 관측이 A에 상시 위도 띠를 요구하므로(Millar-Blanchaer 2020) 구름층은
        민무늬가 아니라 대비 낮은 띠를 갖는다.
    refs: ["docs/reference/stellar-photospheric-color-methodology.md", "2020ApJ...894...42M", "2015ApJ...805L...3O"]

  - body: Luhman 16 A
    axis: magnetism
    status: gated
    driver: [window-selection]
    narrative: >
      No one has measured this body's magnetic field, but its own heat budget sets
      one: in a fast-spinning convective globe the field strength follows from how
      much internal power threads the interior, and here that gives a surface field
      around 1250 gauss, several times Jupiter's. The deepest radio and X-ray
      searches ever pointed at a brown dwarf found nothing, and the two facts do
      not clash: the upper atmosphere is too cold and neutral to couple to the
      field, so a kilogauss magnet can sit under the clouds in perfect silence.
      And this dynamo does the job a stellar wind would do, supplying the magnetic
      pressure itself. Because the pair plows through interstellar gas at 26 km/s,
      the boundary where that pressure meets the interstellar ram stands at 490
      body radii, a fifth of an astronomical unit. The flow barely exceeds the
      local magnetosonic speed, so only a weak wave forms ahead of the boundary,
      and the tail streams thirty astronomical units downwind alongside its
      companion's. It also keeps one proton belt, fed the same way Earth's inner
      belt is.
    narrative_ko: >
      이 천체의 자기장을 측정한 기록은 없지만, 열수지를 통해 값을 유추할 수 있다.
      빠르게 도는 대류 구체에서는 내부를 관통하는 동력의 양이 자기장 세기를
      결정하는데, 여기서는 표면 기준 1250가우스쯤, 목성의 몇 배가 나온다.
      갈색왜성을 겨눈 역대 가장 깊은 전파·X선 수색은 아무것도 찾지 못했지만,
      두 사실은 서로 상충하지 않는다. 상층 대기가 지나치게 차갑고 중성이라
      자기장과 엮이지 못해, 킬로가우스 급의 자기장이 구름 밑에 침묵하고 있을 수
      있다. 그리고 이 다이나모는 항성풍을 대신해 자기압을 만들어낸다. 쌍성이
      성간 가스를 초속 26 km로 헤치고 나아가므로, 자기압과 성간 램압이 만나는
      경계가 천체 반지름의 490배, 0.2 천문단위에 선다. 흐름이 국소 자기음속을
      살짝 넘는 정도라 경계 앞에는 약한 파도만 서고, 꼬리는 하류로 30 천문단위를
      뻗어 짝의 꼬리와 나란히 흐른다. 또한 지구 내대와 같은 원리의 양성자 벨트도
      하나 보유하고 있다.
    fields:
      - { name: magnetic_field, value: 1250, unit: G, op: set, note: "B_dyn = 4.8 (M L^2 / R^7)^(1/6) kG, BD branch (dynamo near the surface); R 0.08-0.10 spread gives 1100-1430 G", note_ko: "B_dyn = 4.8 (M L²/R⁷)^(1/6) kG, 갈색왜성 분기(표면 근처 dynamo). R 0.08–0.10이면 1100–1430 G" }
      - { name: pause_radius, value: 654.9, unit: R_bd, op: set, note: "= nose x 2^alpha; ISM-ram Chapman-Ferraro. Reproduce: scripts/refs/magnetopause_geometry.py (BROWN DWARFS section)", note_ko: "= 노즈 × 2^α. 성간 램압 Chapman–Ferraro. 재현: scripts/refs/magnetopause_geometry.py (BROWN DWARFS 절)" }
      - { name: pause_compression, value: 1.3379, op: set, note: "= 2^0.42" }
      - { name: pause_extension, value: 0.0089195, op: set, note: "= 2^alpha / 150" }
      - { name: pause_height_scale, value: 1.0, op: set, note: "Shue is axisymmetric", note_ko: "Shue는 축대칭" }
      - { name: pause_nose, value: 490, unit: R_bd, op: set, note: "0.205 AU; B_eq 441 G (= B_dyn / 2 sqrt 2) vs ISM ram (n 0.2 /cc, v_rel 26 km/s from the LISM cloud vectors)", note_ko: "0.205 AU. B_eq 441 G(= B_dyn/2√2) 대 성간 램압(n 0.2 /cc, v_rel 26 km/s, LISM 구름 벡터)" }
      - { name: pause_alpha, value: 0.42, op: set, note: "rotation-dominated magnetosphere: Jupiter's fitted ceiling, clamped (the Polyphemus precedent)", note_ko: "회전지배 자기권. 목성 피팅 상한 클램프(폴리페무스 선례)" }
      - { name: pause_tail, value: 73426, unit: R_bd, op: set, note: "L = 150 x nose = 30.7 AU convention", note_ko: "L = 150 × 노즈 = 30.7 AU 관례" }
      - { name: radiation_inner, value: 10, unit: "rad/h", op: set, note: "CRAND-fed proton belt, Earth-inner analog (same feeding mechanism); unmodulated interstellar GCR could raise it a few-fold; kept faint under the Osten 2015 null", note_ko: "CRAND 공급 양성자 벨트, 지구 내대 유추(같은 공급 기제). 비변조 성간 우주선이면 몇 배 위. Osten 2015 무음 아래로 약하게 유지" }
      - { name: radiation_inner_gradient, value: 2.09, op: set, note: "Earth-inner analog profile", note_ko: "지구 내대 유추 프로파일" }
      - { name: radiation_outer, value: null, na_reason: "No outer belt: a wind/torus-fed population has no source here (no stellar wind, no volcanic moon)", na_reason_ko: "외대 없음. 항성풍·화산위성 공급원이 없어 채울 입자가 없다" }
    provenance: >
      2026-08-17 first gated with magnetosphere/belts as prose ("present but
      non-emitting" / "none"). Re-gated the same day: owner sent it back through
      the magnetosphere-geometry methodology; the ISM-ram branch was added to
      magnetopause_geometry.py, and belts moved from none to a faint CRAND proton
      belt after the 2023 UCD radiation-belt imaging (and the 2025 binarity
      enhancement) made the class precedent observational.
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        Field: energy-flux dynamo scaling (Reiners & Christensen 2010 form) on
        measured M and L, assumed R: B_dyn 1246 G, bracket 1100-1430 over R
        0.08-0.10; compatible with the Osten 2015 non-detection (neutral
        atmosphere decouples matter from field; the paper cites the same scaling
        predicting ~1 kG for this class). Geometry: the magnetosphere-geometry
        recipe on the ISM-ram branch, nose 490 R_bd from B_eq 441 G vs rho v^2
        (n 0.2 cm-3, v_rel 26 km/s from the LISM cloud vectors, G/LIC/Blue span
        24-28), M_A 1.77 super-Alfvenic so the Shue form with the
        rotation-dominated alpha 0.42 clamp applies; the cfg set is emitted by
        the same script. Belt: the class precedent is imaged (Kao 2023 Nature;
        Climent 2023 Science) and binaries show belt emission more often (Kao
        2025); the dose is an Earth-inner CRAND analog, order-of-magnitude,
        kept faint under the Osten synchrotron null. Caveat: n_ism and the dose
        anchor are the soft inputs; the nose scales as (n v^2)^(-1/6), so even
        a factor 4 in pressure moves it only ~20%.
      evidence_ko: >
        자기장: 에너지플럭스 dynamo 스케일링(Reiners & Christensen 2010 형)에
        측정 M·L과 가정 R로 B_dyn 1246 G, R 0.08–0.10 전파 시 1100–1430 G.
        Osten 2015 불검출과 양립(중성 대기가 물질과 자기장을 분리. 논문 스스로
        같은 스케일링의 ~1 kG 예측을 인용). 기하: 자기권 기하 레시피의 성간
        램압 분기로 B_eq 441 G 대 ρv²(n 0.2 cm⁻³, v_rel 26 km/s, LISM 구름 벡터
        G/LIC/Blue 24–28)에서 노즈 490 R_bd. M_A 1.77 초알펜이라 회전지배 α 0.42
        클램프의 Shue 형식이 성립하고, cfg 세트는 같은 스크립트가 낸다. 벨트:
        부류 선례가 영상으로 확인됐고(Kao 2023 Nature, Climent 2023 Science)
        쌍성에서 더 잦다(Kao 2025). 선량은 지구 내대 CRAND 유추의 자릿수 값이며
        Osten 싱크로트론 무음 아래로 약하게 유지. 주의: n_ism과 선량 앵커가 무른
        입력이지만 노즈는 (nv²)^(-1/6)이라 압력이 4배 틀려도 ~20%만 움직인다.
    refs: ["docs/reference/planetary-magnetosphere-geometry-methodology.md", "docs/reference/planetary-dynamo-scaling.md", "2015ApJ...805L...3O", "2023Natur.619..272K", "2023Sci...381.1120C", "2403.08860"]

  - body: Luhman 16 A
    axis: environment
    status: passthrough
    narrative: >
      The quietest kind of neighborhood. The deepest radio and X-ray searches ever
      aimed at a brown dwarf watched this pair through multiple rotations and saw
      nothing at all. There is no wind worth the name either; all a visiting craft
      receives here is the body's own faint thermal glow.
    narrative_ko: >
      더없이 차분한 천체다. 갈색왜성을 겨눈 역대 가장 깊은 전파·X선 수색이 이 쌍을
      여러 자전에 걸쳐 관측했지만 어떠한 현상도 발견하지 못했다. 항성풍이라 부를
      만한 것도 없으며, 이곳에 도달한 탐사선이 받을 것은 약하게 뿜어내는 복사열이
      전부다.
    fields:
      - { name: activity, value: "radio log(Lr/Lbol) < -18.1 (5.5 GHz) / < -17.9 (9 GHz); X-ray log(Lx/Lbol) < -5.7; no flares over multiple rotations", value_ko: "전파 log(Lr/Lbol) < −18.1(5.5 GHz) / < −17.9(9 GHz), X선 log(Lx/Lbol) < −5.7. 여러 자전 동안 플레어 없음", op: passthrough, note: "deepest fractional UCD limits (Osten 2015 ATCA + Chandra)", note_ko: "극저온왜성 최심 상한(Osten 2015 ATCA+Chandra)" }
      - { name: flares, value: "none detected", value_ko: "검출 없음", op: passthrough }
      - { name: uv_xray_flux, value: "negligible (log Lx < 23.0 erg/s)", value_ko: "무시 가능(log Lx < 23.0 erg/s)", op: passthrough }
      - { name: stellar_wind, value: "none modeled", value_ko: "모델 없음", op: passthrough, note: "no measurable outflow; nothing for Kerbalism to carry", note_ko: "측정 가능한 유출 없음. Kerbalism이 실어 나를 것도 없음" }
      - { name: radiation, value: "thermal only", value_ko: "열복사뿐", op: passthrough }
      - { name: habitable_zone, value: null, na_reason: "At L = 2.1e-5 L_sun the liquid-water distance lies inside ~0.005 AU, under the Roche limit for any real companion; no usable zone exists", na_reason_ko: "L = 2.1e-5 L☉이면 액체 물 거리가 ~0.005 AU 안쪽, 실존 동반체의 로슈 한계 밑이라 쓸 만한 영역이 없음" }
    refs: ["2015ApJ...805L...3O"]

  - body: Luhman 16 A
    axis: appearance.aurora
    status: gated
    driver: [art-direction]
    narrative: >
      A faint magenta-pink auroral ring sits over each pole. Brown dwarfs can
      light aurorae on their own, driving currents out of their spinning
      magnetospheres with no star to feed them, and the phenomenon has been
      observed on bodies of this class. The dedicated search at this pair found
      nothing, but auroral radio is a narrowly beamed emission, so for a body
      viewed almost edge-on that silence cannot be read as proof of absence.
    narrative_ko: >
      극에 희미한 마젠타-분홍 오로라 고리가 존재한다. 갈색왜성은 스스로의
      자기권에서 전류를 만들어 오로라를 발광시킬 수 있으며, 실제로 그러한 현상이
      관측된 바 있다. 이 천체를 향한 관측에서는 발견하지 못했지만, 오로라 전파는
      좁게 뻗는 빔이라 거의 옆에서 보는 천체에서 그 무음을 부재의 증거로 볼 수
      없다.
    fields:
      - { name: aurora, value: "faint narrow polar ring, magenta-pink #d94a63 family, low altitude, both poles", value_ko: "희미하고 좁은 극 고리, 마젠타-분홍 #d94a63 계열, 낮은 고도, 양극", op: set }
    provenance: >
      2026-08-17 owner call: art aurora adopted over the strict observational
      "none", using the ECM beaming loophole; supersedes the aurora: none field
      the appearance row briefly carried.
    gate:
      criterion: [observation, art]
      verdict: documented-divergence
      evidence: >
        Physically coherent with the rest of the board: the dynamo row's ~1.25 kG
        field is ample for auroral ECM, and the class shows aurorae at T types
        (Kao 2016 detections at kG-scale fields). Checked against the observation:
        Osten 2015's limits constrain emission toward Earth, not the existence of
        auroral currents; the divergence is confined to that beaming loophole.
        Caveat: rendered faint and narrow so the art stays inside what the null
        allows.
      evidence_ko: >
        보드의 다른 행들과 물리적으로 맞물린다. dynamo 행의 ~1.25 kG 자기장은
        오로라 ECM에 충분하고, 부류 차원에서는 T형에서도 kG급 자기장과 함께
        오로라가 검출됐다(Kao 2016). 관측과의 대조도 확인했다. Osten 2015 상한이
        구속하는 것은 지구 방향 방출이지 오로라 전류의 존재가 아니므로, 이탈은
        빔 기하 구멍 안으로 한정된다. 주의: 무음이 허용하는 범위에 머물도록
        어둡고 좁게만 그린다.
      divergence_note: >
        Departs the Osten 2015 non-detection (deepest UCD auroral-radio limits,
        log Lr/Lbol < -18.1, multi-rotation coverage): drawn as present-but-faint
        anyway. The loophole is physical: ECM auroral radio is narrowly beamed,
        so a null at Earth does not exclude auroral currents on a body viewed
        near equator-on. Class precedent: auroral emission is confirmed on UCDs
        including T dwarfs (Hallinan 2015; Kao 2016, ~10% detection rate).
      divergence_note_ko: >
        Osten 2015 불검출(극저온왜성 최심 오로라 전파 상한, log Lr/Lbol < −18.1,
        여러 자전 커버)에서 이탈해 "있되 희미함"으로 그린다. 구멍은 물리적이다.
        ECM 오로라 전파는 좁게 빔이 지므로, 거의 적도 방향에서 보는 천체의 지구
        기준 무음은 오로라 전류의 부재 증명이 아니다. 부류 선례: T왜성을 포함한
        극저온왜성에서 오로라 방출 확인(Hallinan 2015, Kao 2016, 검출률 ~1할).
    refs: ["2015ApJ...805L...3O", "2015Natur.523..568H", "2016ApJ...818...24K"]

  - body: Luhman 16 A
    axis: orbit
    status: gated
    driver: [window-selection]
    narrative: >
      The pair completes a mutual orbit every 27.5 years, swinging between about
      2.3 and 4.8 astronomical units apart on a moderately stretched path. Every
      element is measured, read from twelve years of precision astrometry, so the
      dance needs no invention: the plane, the stretch, the timing of closest
      approach are all data. Seen from Earth the orbit stands nearly edge-on, the
      same tilt the two bodies' own spins share. The game clock starts in 1950,
      two and a half turns before the measured 2017 closest approach, and the
      starting positions are wound back along the measured orbit to that moment.
    narrative_ko: >
      두 천체는 27.5년에 한 번 서로를 돈다. 사이는 2.3에서 4.8 천문단위를 오가는,
      적당히 늘어난 길이다. 이 궤도의 모든 요소는 12년치 정밀 위치측정에서 읽어낸
      측정값이라 지어낼 것이 없다. 평면도, 늘어남도, 최근접 시점도 전부 데이터다.
      지구에서 보면 궤도가 거의 옆으로 서 있는데, 두 천체의 자전축도 같은 기울기를
      나눠 갖는다. 게임의 시계는 1950년에 시작하므로, 측정된 2017년 최근접에서
      두 바퀴 반을 되감아 그 시점의 자리에서 출발시킨다.
    fields:
      - { name: semi_major_axis_au, value: 3.557, op: passthrough, note: "relative orbit (Lazorenko & Sahlmann 2018)" }
      - { name: eccentricity, value: 0.343, op: passthrough, note: "±0.005; already non-circular, nothing to de-perfect", note_ko: "±0.005. 이미 비원형이라 손볼 것 없음" }
      - { name: inclination_deg, value: 100.26, op: passthrough, note: "±0.05 (equivalently 79.74 under the opposite node convention)", note_ko: "±0.05 (노드 규약 반대면 79.74)" }
      - { name: longitude_ascending_node, value: 139.67, unit: deg, op: passthrough, note: "J2000 equinox (L&S 2018)" }
      - { name: argument_periapsis, value: 128.1, unit: deg, op: passthrough, note: "±1.5" }
      - { name: mean_anomaly, value: 194.0, unit: deg, op: set, note: "at the game epoch JD 2433282.5 (1950.0): rewound 2.4611 orbits from T_peri JD 2458039.1 (2017.78, L&S 2018); P ±0.4 yr propagates to ±13°", note_ko: "게임 에포크 JD 2433282.5(1950.0) 기준. 근점 JD 2458039.1(2017.78)에서 2.4611바퀴 되감기. P ±0.4년이 ±13°로 전파" }
      - { name: spin_orbit_resonance, value: "none (free rotators; 6.94 h and 4.87 h spins vs a 27.5 yr orbit)", value_ko: "없음 (자유 회전. 자전 6.94/4.87시간 대 궤도 27.5년)", op: passthrough }
      - { name: lagrange_placement, value: "none", op: passthrough }
    provenance: >
      2026-08-17 authored with the epoch phase validated by the standard
      two-integrator run (owner instruction): the 1950.0 state was integrated
      forward and reproduced the observed 2017.78 periastron before freezing.
    gate:
      criterion: [observation, derived-grounding, stability]
      verdict: methodology-derived
      evidence: >
        Elements are the Lazorenko & Sahlmann 2018 astrometric solution
        unchanged; the one derived number is the epoch phase, M(1950.0) =
        194.0 deg by the standard rewind M = 360 (JD_epoch - T_peri)/P mod 360.
        Validated by round trip: integrating the 1950.0 state forward 67.78 yr
        in both IAS15 and leapfrog lands on the observed periastron (residual
        0.29 deg, separation 2.337 AU = a(1-e) exact), MEGNO <Y> = 2.005 over
        1e6 yr = 36,300 orbits (regular, no chaos), leapfrog element drift
        0.0000 % over the same span - full run in the stability report. Caveat: 2.46 orbits of back-propagation turns
        the P uncertainty into +-13 deg of phase; the elements carry no such
        inflation.
      evidence_ko: >
        요소는 Lazorenko & Sahlmann 2018 위치측정 해 그대로. 도출값은 에포크
        위상 하나로, M(1950.0) = 194.0° = 360·(JD_epoch − T_peri)/P mod 360
        표준 되감기다. 왕복 검증 완료: 1950.0 상태를 IAS15·leapfrog 양쪽으로
        67.78년 순방향 적분하면 관측된 근점에 안착하고(잔차 0.29°, 근접거리
        2.337 AU = a(1−e) 정확), 10⁶년 = 36,300궤도의 MEGNO ⟨Y⟩ = 2.005
        (규칙적, 카오스 없음), 같은 구간 leapfrog 요소 표류 0.0000%다. 전체 수치는 안정성 리포트에. 주의:
        2.46바퀴 역산이라 P 불확도가 위상 ±13°로 불어난다. 요소 자체에는 그런
        부풀림이 없다.
    refs: ["2018A&A...618A.111L", "docs/reference/emit-orbit-phase-match-methodology.md", "docs/reference/binary-epoch-pipeline.md", "phase3/stability-sim/STABILITY_REPORT.md"]

  - body: Luhman 16 A
    axis: atmosphere
    status: gated
    driver: [window-selection]
    narrative: >
      The surface is defined where the eye stops: the photosphere. High-resolution
      spectroscopy has measured where that is, a few bars of pressure, with the
      silicate cloud bases anchored near thirteen bars below. The gas above is
      hydrogen and helium; sodium and potassium vapor drink the visible light,
      water shapes the infrared, and iron-bearing molecules trace the mineral
      dust the clouds are made of. Below the visible face the envelope simply
      thickens until it turns to fluid.
    narrative_ko: >
      표면은 시선이 멈추는 곳, 곧 광구로 정의한다. 고분해 분광이 그 위치를
      실제로 재 놓았다. 기압으로 몇 bar,
      규산염 구름의 바닥은 그 아래 13 bar 부근이다. 그 위의 기체는 수소와
      헬륨이다. 나트륨·칼륨 증기가 가시광을 마셔 버리고, 물이 적외선의 형태를
      빚으며, 철을 품은 분자들이 구름의 재료가 광물 먼지임을 알려 준다. 보이는
      낯 아래로 외피는 그저 두꺼워지다가 유체로 바뀔 뿐이다.
    fields:
      - { name: composition, value: "H/He envelope; pressure-broadened Na/K resonance absorption dominates the optical; H2O + FeH + HF detected (CRIRES+ J-band); silicate (MgSiO3/Mg2SiO4) condensate clouds, iron rained out below", value_ko: "수소·헬륨 외피. 압력폭증 Na/K 공명 흡수가 가시광 지배, H₂O·FeH·HF 검출(CRIRES⁺ J밴드), 규산염(MgSiO₃/Mg₂SiO₄) 응결 구름, 철은 그 아래로 침전", op: passthrough }
      - { name: pressure, value: 2.6, unit: bar, op: set, note: "surface = photosphere policy (owner 2026-08-17): log-midpoint of the retrieved photospheric window 0.6-11 bar (de Regt 2025 CRIRES+ retrieval); cloud base 13.3 (+1.3/-1.2) bar", note_ko: "표면=광구 정책(오너 2026-08-17). 리트리벌 광구 창 0.6–11 bar(de Regt 2025 CRIRES⁺)의 로그 중앙값. 구름 바닥 13.3(+1.3/−1.2) bar" }
      - { name: temperature, value: 1310, unit: K, op: passthrough, note: "tau ~ 1 photosphere = the rendered face (Faherty 2014)", note_ko: "광학깊이 ~1 광구 = 렌더되는 낯(Faherty 2014)" }
      - { name: scale_height, value: 24, unit: km, op: set, note: "H = kT/(mu m_H g), mu 2.35, T 1310 K, g 1084 m/s2 - derived echo", note_ko: "H = kT/(μ m_H g), μ 2.35·T 1310 K·g 1084 m/s²의 파생 에코" }
      - { name: breathability, value: "none", op: passthrough }
      - { name: escape, value: "none", op: passthrough, note: "110 g surface gravity; nothing leaves", note_ko: "표면 중력 110 g. 아무것도 못 떠난다" }
    gate:
      criterion: [observation, derived-grounding]
      verdict: pass-in-window
      evidence: >
        The photosphere-as-surface policy gets a measured anchor: the CRIRES+
        retrieval places the Luhman 16 photospheres at 0.6-11 bar and A's
        silicate cloud base at 13.3 bar (de Regt 2025); the adopted 2.6 bar is
        the log-midpoint of that window. Cross-check: the grey-photosphere
        condition P ~ g/kappa with g 1084 m/s2 and a ~0.03 cm2/g Rosseland
        opacity gives ~3-4 bar, the same order. Caveat: the window spans a
        factor 18 because different wavelengths see different depths; the
        single number is a rendering convention, not a sharp boundary.
      evidence_ko: >
        광구=표면 정책이 측정 앵커를 얻었다. CRIRES⁺ 리트리벌이 Luhman 16 광구를
        0.6–11 bar에, A의 규산염 구름 바닥을 13.3 bar에 놓는다(de Regt 2025).
        채택한 2.6 bar는 그 창의 로그 중앙값. 교차검증: 회색 광구 조건 P ~ g/κ에
        g 1084 m/s², 로슬란드 불투명도 ~0.03 cm²/g을 넣으면 3~4 bar로 같은
        자릿수다. 주의: 파장마다 보이는 깊이가 달라 창이 18배에 걸치므로, 단일
        숫자는 예리한 경계가 아니라 렌더 관례다.
    refs: ["2503.21266", "2014ApJ...790...90F"]

  - body: Luhman 16 A
    axis: surface
    status: passthrough
    narrative: >
      The "ground" of this world is the photosphere the atmosphere row defines;
      everything below it is fluid hydrogen under growing pressure.
    narrative_ko: >
      이 세계의 "지면"은 대기 행이 정의한 광구이고, 그 아래는 압력이 쌓여 가는
      유체 수소뿐이다.
    fields:
      - { name: surface_type, value: "none (photosphere is the rendered face; see atmosphere)", value_ko: "없음 (렌더되는 낯은 광구. 대기 행 참조)", op: passthrough }

  - body: Luhman 16 A
    axis: satellites
    status: passthrough
    narrative: >
      No companions of its own: twelve years of precision astrometry that
      weighed the pair to a percent would have betrayed any moon of substance,
      and none appears.
    narrative_ko: >
      제 몫의 동반체는 없다. 쌍의 질량을 1% 수준까지 잰 12년치 정밀 위치측정이
      묵직한 위성이라면 들켰을 텐데, 아무것도 나타나지 않는다.
    fields:
      - { name: satellites, value: "none", op: passthrough, note: "no astrometric residual companion (L&S 2018)", note_ko: "위치측정 잔차 동반체 없음 (L&S 2018)" }
      - { name: co_orbitals, value: "none", op: passthrough }
    refs: ["2018A&A...618A.111L"]

  - body: Luhman 16 A
    axis: gameplay
    status: gated
    driver: [art-direction]
    narrative: >
      Flying here means flying inside the light source: below the craft the
      interior glows through every thinning of the deck, and the horizon is lit
      from underneath, not from any sun. Three biomes split the globe by
      latitude. Equatorial Cloud Bands, the smooth low-latitude deck where the
      banding is cleanest; Midlatitude Seams, the belt where the deck thins and
      cracks into magenta-lit edges; and the Polar Auroral Caps, dark high
      latitudes under the faint auroral rings. The place worth the trip is a
      midlatitude seam: red firelight below, magenta rim ahead, on a world that
      turns once every seven hours.
    narrative_ko: >
      여기서의 비행은 광원 안을 나는 일이다. 기체 아래에서는 구름층이 얇아지는
      자리마다 내부의 빛이 배어 나오고, 지평선은 태양이 아니라 발밑에서부터
      밝아 온다. 바이옴은 위도로 셋이다. 적도 구름 밴드, 띠 무늬가 가장 정갈한
      매끈한 저위도 구름층. 중위도 이음매, 구름층이 얇아지고 갈라져 마젠타빛
      가장자리가 서는 띠. 그리고 극 오로라 관, 희미한 오로라 고리 아래의 어두운
      고위도. 가 볼 만한 자리는 중위도 이음매다. 아래로는 붉은 불빛, 앞으로는
      마젠타 테두리, 일곱 시간에 한 번 도는 세계 위에서.
    fields:
      - { name: science_biomes, value: "Equatorial Cloud Bands / Midlatitude Seams / Polar Auroral Caps (3, latitude-banded)", value_ko: "적도 구름 밴드 / 중위도 이음매 / 극 오로라 관 (위도 3분할)", op: set }
      - { name: sphere_of_influence_tuning, value: "stock (mass-derived)", value_ko: "스톡 (질량 유도값)", op: passthrough }
      - { name: timewarp_limits, value: "stock", op: passthrough }
    provenance: >
      2026-08-17 owner call: three latitude-banded biomes (low-latitude cloud
      bands split up to the high latitudes); boundaries follow the appearance
      row's three-layer look.
    gate:
      criterion: [gameplay, visual-checklist]
      verdict: pass-in-window
      evidence: >
        Biome boundaries reuse the gated appearance structure (banded deck,
        seam belt, polar aurora), so the science map and the visual map cannot
        contradict each other. Latitude banding matches the only mapped
        constraint (Millar-Blanchaer 2020 longitudinal bands). ScienceValues
        and any discovery-mod grading stay downstream with the writer mods.
      evidence_ko: >
        바이옴 경계는 확정된 appearance 구조(띠 구름층·이음매 띠·극 오로라)를
        그대로 재사용하므로 과학 지도와 시각 지도가 어긋날 수 없다. 위도 띠
        구도는 유일한 지도 구속(Millar-Blanchaer 2020 상시 위도 띠)과 정합.
        ScienceValues와 발견 모드 등급은 하류 writer 몫으로 남긴다.
    refs: []

  # ── Luhman 16 B (T0.5 반성, 들썩이는 쪽) ──────────────────────────────────
  - body: Luhman 16 B
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The famous half of the pair: the first world beyond the Solar System to
      have its weather mapped. Slightly lighter than its companion at 28.5
      Jupiter masses, and confirmed substellar by the same lithium test, it sits
      just past the boundary where the thick silicate clouds begin to tear open.
      Standing on that boundary is its entire character. Its brightness swings
      by a tenth as dark cloud and bright clearings wheel past every 4.9 hours,
      weather changing from one night to the next. If its companion is a quiet
      ember, this is the storm.
    narrative_ko: >
      쌍에서 유명한 쪽이다. 태양계 밖에서는 처음으로 날씨 지도가 그려진 천체다.
      목성 질량 28.5배로 짝보다 조금 가볍고, 같은 리튬 검사로 준항성임이
      확인됐으며, 두꺼운 규산염 구름이 찢어지기 시작하는 경계를 막 지났다.
      이 경계 위에 서 있다는 사실이 성격의 전부를 정한다. 어두운 구름과 밝은
      클리어링이 4.9시간마다 돌아 지나가며 밝기가 1할씩 출렁이고, 날씨는 하룻밤
      사이에 얼굴을 바꾼다. 짝이 고요한 잉걸불이라면, 이쪽은 폭풍이다.
    fields:
      - { name: body_type, value: "T0.5 brown dwarf, the restless weather-mapped secondary of the nearest BD binary", value_ko: "T0.5 갈색왜성, 최근접 갈색왜성 쌍의 들썩이는 날씨 지도 반성", op: set }
      - { name: designation, value: "Luhman 16 B (WISE J104915.57-531906.1 B)", op: set }
      - { name: naked_eye, value: false, op: set, note: "as for A: invisible without instruments despite 2 pc", note_ko: "A와 같음. 2 pc인데도 맨눈 불가" }
    gate:
      criterion: [classification, observation]
      verdict: pass-in-window
      evidence: >
        Owner facet-walk 2026-08-16/17. Classification chain: T0.5 (Burgasser
        2013 resolved NIR), dynamical mass 28.5 M_Jup + lithium detection (the
        first in a T dwarf, Faherty 2014 EW 3.8 A). The identity claims are
        observational: first BD surface map (Crossfield 2014), ~11%
        peak-to-peak variability and night-to-night evolution (Gillon 2013),
        P 4.87 h.
      evidence_ko: >
        오너 facet-walk 2026-08-16/17. 분류 사슬은 T0.5(Burgasser 2013 분해
        근적외), 역학 질량 28.5 M_Jup + 리튬 검출(T왜성 최초, Faherty 2014
        EW 3.8 Å). 정체성 주장들은 관측 사실이다. 갈색왜성 최초 표면 지도
        (Crossfield 2014), 피크간 ~11% 변광과 하룻밤 단위 변화(Gillon 2013),
        P 4.87시간.
    refs: ["2014ApJ...790...90F", "2018A&A...618A.111L", "2014Natur.505..654C", "2013A&A...555L...5G"]

  - body: Luhman 16 B
    axis: bulk                        # §3.2 템플릿 앵커 — 측정 passthrough 에코 (spin_axis·J2는 전용 행)
    body_class: free_rotator
    status: passthrough
    narrative: >
      The measured body: 28.5 Jupiter masses from the pair's mutual orbit, the
      same assumed Jupiter-size globe as its companion, 1280 kelvin at the cloud
      tops, and a shade less light. Surface pull is 94 g. The half-billion-year
      Oceanus age is shared with the primary. The one number this body owns
      outright is its spin: 4.87 hours, read cleanly from the turning weather,
      and the best-measured rotation in the system.
    narrative_ko: >
      측정된 값들이다. 질량은 상호 궤도에서 잰 목성 28.5배, 덩치는 짝과 같은
      목성급 가정 반지름, 구름 꼭대기는 1280켈빈에 빛은 짝보다 한 끗 어둡다.
      표면 중력은 94 g. 오케아누스 이동군의 5억 년 나이는 주성과 공유한다.
      이 천체가 온전히 제 것으로 가진 숫자는 자전 하나다. 돌아가는 날씨에서
      깨끗하게 읽어낸 4.87시간, 이 시스템에서 가장 잘 측정된 자전이다.
    fields:
      - { name: kopernicus_name, value: "Luhman 16 B", op: set, note: "Kopernicus body name. The formal designation verbatim (_naming.to_kopernicus_name): the in-game label is a separate field, so the internal name carries the designation rather than the culture name, and the whole designation is kept because tails collide across systems", note_ko: "Kopernicus 바디명. 공식 명칭 그대로다(_naming.to_kopernicus_name). 인게임 표시명은 별도 필드이므로 내부 이름은 문화명이 아니라 명칭을 쓰고, 꼬리만 쓰면 계 사이에서 충돌하므로 명칭 전체를 유지한다" }
      - { name: mass, value: 0.0273, unit: M_sun, op: passthrough, note: "±0.0003 = 28.5 M_Jup (Lazorenko & Sahlmann 2018 astrometric orbit)" }
      - { name: radius, value: 0.090, unit: R_sun, op: passthrough, note: "±0.01 = 0.9 R_Jup assumed field-BD degenerate radius (Faherty 2014)", note_ko: "±0.01 = 0.9 R_Jup, 필드 갈색왜성 축퇴 반지름 가정(Faherty 2014)" }
      - { name: gravity, value: 924, unit: m/s2, op: passthrough, phase3_default: "GM/R² derived echo (~94 g)", phase3_default_ko: "GM/R² 파생 에코 (~94 g)" }
      - { name: internal_heat, value: 1.95e-5, unit: L_sun, op: passthrough, note: "self-luminous: contraction heat, log L = -4.71 (Faherty 2014)", note_ko: "자발광. 수축열, log L = −4.71 (Faherty 2014)" }
      - { name: age, value: 0.5, unit: Gyr, op: passthrough, note: "shared system age: Oceanus moving group (Gagné 2023), 12C/13C corroboration (de Regt 2026)", note_ko: "시스템 공유 나이. 오케아누스 이동군(Gagné 2023), ¹²C/¹³C 교차지지(de Regt 2026)" }
      - { name: rotation_period, value: 0.2029, unit: d, op: passthrough, note: "4.87 ± 0.01 hr (Gillon 2013, high confidence); TESS jet-drift spread 4.9-5.3 hr noted (Apai 2021)", note_ko: "4.87 ± 0.01시간(Gillon 2013, 고신뢰). TESS 제트 표류 산포 4.9–5.3시간 병기(Apai 2021)" }
      - { name: obliquity, value: null, na_reason: "No constraint; the spin-axis row carries the derived line-of-sight inclination instead", na_reason_ko: "구속 없음. 시선경사 도출값은 자전축 전용 행이 담당" }
      - { name: geopotential_c22, value: null, na_reason: "A freely rotating fluid body is axisymmetric; no tidal triaxiality (rotational J2 gets its own row)", na_reason_ko: "자유 회전 유체 천체라 축대칭. 조석 삼축 없음 (회전 J2는 전용 행)" }
    refs: ["2018A&A...618A.111L", "2014ApJ...790...90F", "2013A&A...555L...5G", "2602.03409"]

  - body: Luhman 16 B
    axis: orbit
    status: passthrough
    narrative: >
      The mutual orbit is one object, recorded once on the primary's row: the
      27.5-year, moderately eccentric path and its validated 1950 starting
      phase. Each body still gets its own starting state: the barycenter splits
      that one relative orbit by the mass ratio, and both positions and
      velocities at the game epoch already sit in the database, computed by the
      binary-epoch pipeline. This row exists to say that split is deliberate,
      not missing.
    narrative_ko: >
      상호 궤도는 하나의 실체라 주성 행에 한 번만 적는다. 27.5년짜리 적당히
      찌그러진 길도, 검증을 마친 1950년 출발 위상도 거기에 있다. 그래도 출발
      상태는 천체마다 제 몫이 있다. 무게중심이 그 상대궤도 하나를 질량비로
      갈라 두 천체의 위치·속도를 만들고, 게임 에포크 기준 값 양쪽 다 다성계
      에포크 파이프라인이 계산해 데이터베이스에 이미 들어 있다. 이 행은 그
      분해가 누락이 아니라 의도임을 적어 두는 자리다.
    fields:
      - { name: orbit_ref, value: "see Luhman 16 A / orbit (the AB relative orbit, L&S 2018; M(1950.0) = 194.0 deg validated)", value_ko: "Luhman 16 A / orbit 참조 (AB 상대궤도, L&S 2018. M(1950.0)=194.0° 검증 완료)", op: passthrough }
      - { name: barycentric_split, value: "r_B = +(m_A/M_tot) x r_rel, r_A = -(m_B/M_tot) x r_rel; per-component ICRS states at B1950.0 in db/systems/luhman_16_{a,b}.json derived (kepler_thiele_innes)", value_ko: "r_B = +(m_A/M_tot)·r_rel, r_A = −(m_B/M_tot)·r_rel. 성분별 B1950.0 ICRS 상태는 db/systems/luhman_16_{a,b}.json derived에 (kepler_thiele_innes)", op: passthrough }
      - { name: spin_orbit_resonance, value: "none (free rotator; 4.87 h spin vs a 27.5 yr orbit)", value_ko: "없음 (자유 회전. 자전 4.87시간 대 궤도 27.5년)", op: passthrough }
      - { name: lagrange_placement, value: "none", op: passthrough }
    refs: ["2018A&A...618A.111L", "docs/reference/binary-epoch-pipeline.md"]

  - body: Luhman 16 B
    axis: bulk.spin_axis_orientation
    status: gated
    driver: [window-selection]
    narrative: >
      We see this body almost exactly along its equator. The spin speed read
      from its lines matches the full circumference-per-4.87-hours pace so
      tightly that no room is left for a tilt: the viewing angle computes to
      ninety degrees within a few. Its axis stands in the same plane as its
      companion's axis and the mutual orbit. This is also why the weather shows
      so well; seen equator-on, one rotation carries the entire face past the
      line of sight.
    narrative_ko: >
      이 천체는 거의 정확히 적도 방향에서 보인다. 선폭에서 읽은 자전 속도가
      4.87시간에 한 바퀴라는 속도와 빈틈없이 맞아떨어져, 기울어 있을 여지가
      남지 않는다. 계산하면 시선각이 90도에서 몇 도 안쪽이다. 자전축은 짝의
      자전축, 상호 궤도와 같은 평면에 서 있다. 날씨가 그토록 잘 보이는 것도
      이 덕분이다. 적도방향에서는 자전 한 바퀴에 표면 전체가 시야를 지나간다.
    fields:
      - { name: spin_axis_orientation, value: "i★ ≈ 90° (derived; nominal sin i★ reaches 1.0-1.23 across the radius bracket, read as equator-on); aligned with the AB orbital plane, azimuth free, ICRS pole at emit", value_ko: "i★ ≈ 90°(도출. 반지름 구간에서 명목 sin i★ 1.0–1.23 → 적도방향으로 읽음) · AB 궤도면 정렬, 방위각 자유, ICRS 극 변환은 emit", op: set }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        sin i★ = v sin i · P / 2πR with v sin i 26.1±0.2 km/s (Crossfield 2014),
        P 5.28 h (TESS) over R 0.90-1.10 R_Jup gives v_eq 21.3-26.0 km/s and
        nominal sin i★ 1.00-1.23: the methodology's rule for nominal sin > 1
        reads this as equator-on, reproducing Apai 2021's published "within a
        few degrees of 90". Doppler-map fits agree (Karalidi 2016: 69±8°;
        Crossfield 2014: i > 60°). Caveat: the exact degree is soft; "near 90,
        not below ~60" is the defensible statement.
      evidence_ko: >
        sin i★ = v sin i · P / 2πR에 v sin i 26.1±0.2 km/s(Crossfield 2014),
        P 5.28시간(TESS), R 0.90–1.10 R_Jup을 넣으면 v_eq 21.3–26.0 km/s, 명목
        sin i★ 1.00–1.23. 방법론의 규칙대로 명목 1 초과는 적도방향으로 읽으며,
        Apai 2021이 발표한 "90도에서 몇 도 이내"가 재현된다. 도플러 맵 피팅도
        정합(Karalidi 2016 69±8°, Crossfield 2014 i > 60°). 주의: 정확한 도수는
        무르고, "90 근처, ~60 아래는 아님"까지가 방어 가능한 진술이다.
    refs: ["docs/reference/spin-axis-inclination-methodology.md", "2021ApJ...906...64A"]

  - body: Luhman 16 B
    axis: bulk.geopotential_j2
    status: gated
    driver: [window-selection]
    narrative: >
      A turn every 4.87 hours squashes this globe visibly more than its
      companion: the equator bulges by about half a percent, two and a half
      times the primary's figure. Same structural branch, faster spin, and this
      time the period underneath is solidly measured, so the number is the
      firmest figure value in the system.
    narrative_ko: >
      4.87시간에 한 바퀴 도는 자전은 이 구체를 짝보다 눈에 띄게 더 누른다.
      적도가 0.5%쯤 부풀어, 주성의 두 배 반이다. 구조 분기는 같고 자전만 더
      빠른데, 이번에는 바탕이 되는 주기가 단단한 측정값이라 이 숫자는 시스템에서
      가장 굳은 형상값이다.
    fields:
      - { name: geopotential_j2, value: 7.31e-4, op: set, note: "= 0.084 x q (n=3/2 polytrope Radau-Darwin branch), q = 8.70e-3 at P 4.87 hr", note_ko: "= 0.084 × q (n=3/2 폴리트로프 Radau–Darwin 분기), P 4.87시간에서 q = 8.70e-3" }
      - { name: reference_radius, value: 62613, unit: km, op: set, note: "= mean radius (0.090 R_sun), the Principia pair convention", note_ko: "= 평균 반지름(0.090 R☉), Principia 짝 규약" }
      - { name: flattening, value: 5.45e-3, op: set, note: "= (3J2+q)/2 derived echo; the visual oblate-mesh slot", note_ko: "= (3J₂+q)/2 파생 에코. 시각 oblate 메시 슬롯" }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        q = Omega^2 R^3 / GM = 8.702e-3 (P 4.87 hr measured, R 0.090 R_sun,
        M 0.0273 M_sun); J2 = 0.084 q on the n=3/2 polytrope branch, f =
        (3 J2 + q)/2 = 5.45e-3. Unlike the primary, P is a high-confidence
        measurement, so the residual uncertainty is the assumed radius
        (R 0.08-0.10 moves J2 by roughly -25/+40%).
      evidence_ko: >
        q = Ω²R³/GM = 8.702e-3 (측정 P 4.87시간, R 0.090 R☉, M 0.0273 M☉).
        n=3/2 폴리트로프 분기에서 J₂ = 0.084 q, f = (3J₂+q)/2 = 5.45e-3.
        주성과 달리 P가 고신뢰 측정이라 남는 불확도는 가정 반지름뿐이다
        (R 0.08–0.10이면 J₂가 약 −25/+40% 움직인다).
    refs: ["docs/reference/body-figure-methodology.md"]

  - body: Luhman 16 B
    axis: atmosphere
    status: gated
    driver: [window-selection]
    narrative: >
      The surface is the photosphere here too, measured to the same few bars as
      its companion, but the air above it has crossed a chemical line: methane
      is strengthening in the infrared as the atmosphere cools past the
      transition, and the silicate cloud, anchored near eighteen bars, is no
      longer a closed lid. Where it tears, hotter gas about fifty kelvin deeper
      shows through, and that ever-opening, ever-closing patchwork of cloud is
      the atmosphere's ordinary state.
    narrative_ko: >
      여기서도 표면은 광구이고, 위치도 짝과 같은 몇 bar로 측정돼 있다. 다만
      그 위의 공기는 화학적 경계 하나를 이미 넘었다. 대기가 전이를 지나
      식으면서 적외선에서는 메테인이 짙어지는 중이고, 18 bar 부근에 닻을 내린
      규산염 구름은 더 이상 닫힌 뚜껑이 아니다. 찢어진 자리에서는 50켈빈쯤 더
      뜨거운 심층 기체가 들여다보이고, 그렇게 열리고 닫히기를 반복하는 구름의
      조각보가 이 대기의 평소 모습이다.
    fields:
      - { name: composition, value: "H/He envelope; Na/K resonance absorption in the optical; CH4 strengthening at 1.15/2.2 um (early-T); H2O + FeH + HF detected (CRIRES+); patchy silicate clouds, clearings expose ~50 K hotter gas", value_ko: "수소·헬륨 외피. 가시광은 Na/K 공명 흡수, 1.15/2.2 µm 메테인 강화(초기 T형), H₂O·FeH·HF 검출(CRIRES⁺), 조각난 규산염 구름, 클리어링은 ~50 K 더 뜨거운 기체 노출", op: passthrough }
      - { name: pressure, value: 2.6, unit: bar, op: set, note: "surface = photosphere policy: log-midpoint of the retrieved photospheric window 0.6-11 bar (de Regt 2025, both components); B's cloud base 18.3 (+1.4/-1.1) bar", note_ko: "표면=광구 정책. 리트리벌 광구 창 0.6–11 bar(de Regt 2025, 두 성분 공통)의 로그 중앙값. B의 구름 바닥 18.3(+1.4/−1.1) bar" }
      - { name: temperature, value: 1280, unit: K, op: passthrough, note: "tau ~ 1 photosphere (Faherty 2014); clearings run ~50 K hotter", note_ko: "광학깊이 ~1 광구(Faherty 2014). 클리어링은 ~50 K 더 뜨거움" }
      - { name: scale_height, value: 27, unit: km, op: set, note: "H = kT/(mu m_H g), mu 2.35, T 1280 K, g 924 m/s2 - derived echo", note_ko: "H = kT/(μ m_H g), μ 2.35·T 1280 K·g 924 m/s²의 파생 에코" }
      - { name: breathability, value: "none", op: passthrough }
      - { name: escape, value: "none", op: passthrough }
    gate:
      criterion: [observation, derived-grounding]
      verdict: pass-in-window
      evidence: >
        Same measured anchor as the primary: the CRIRES+ retrieval spans both
        photospheres at 0.6-11 bar and places B's silicate cloud base at 18.3
        bar; 2.6 bar is the log-midpoint convention. The patchy-cloud reading
        and the ~50 K hotter clearings are Faherty 2014's measurement; the CH4
        strengthening is their band comparison against A. Caveat: as for A,
        the single pressure is a rendering convention across an 18x window.
      evidence_ko: >
        주성과 같은 측정 앵커다. CRIRES⁺ 리트리벌이 두 광구를 0.6–11 bar에
        걸치게 놓고 B의 규산염 구름 바닥을 18.3 bar에 둔다. 2.6 bar는 로그
        중앙값 관례. 조각난 구름과 ~50 K 더 뜨거운 클리어링은 Faherty 2014의
        측정이고, 메테인 강화는 같은 논문의 A 대비 밴드 비교다. 주의: A와
        마찬가지로 단일 기압은 18배 창 위의 렌더 관례다.
    refs: ["2503.21266", "2014ApJ...790...90F"]

  - body: Luhman 16 B
    axis: surface
    status: passthrough
    narrative: >
      The "ground" is the photosphere the atmosphere row defines; below it the
      envelope thickens into fluid hydrogen.
    narrative_ko: >
      "지면"은 대기 행이 정의한 광구이고, 그 아래로 외피는 유체 수소로
      두꺼워질 뿐이다.
    fields:
      - { name: surface_type, value: "none (photosphere is the rendered face; see atmosphere)", value_ko: "없음 (렌더되는 낯은 광구. 대기 행 참조)", op: passthrough }

  - body: Luhman 16 B
    axis: appearance
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      The same three layers as the primary, torn open. The deck is the same
      near-black lid, but here it is broken into bands and patches, and every
      opening shows the interior: red glow in the clearing floors, running a
      shade hotter and brighter than anything on the calm companion, with soft
      magenta burning along every edge. The layout is not invented; the first
      map ever drawn of a world outside the Solar System fixed its skeleton, a
      great dark region at mid-latitudes, a brighter cap near the pole, mottling
      along the equator. Jets carry the features around at slightly different
      speeds by latitude, so the face never repeats: the map is the anchor, the
      motion is the character.
    narrative_ko: >
      주성과 같은 세 겹인데, 찢어져 열려 있다. 구름층은 똑같이 거의 검은
      뚜껑이지만 여기서는 띠와 조각으로 갈라져 있고, 열린 자리마다 내부가
      드러난다. 클리어링 바닥의 붉은 불빛은 차분한 짝의 어떤 곳보다 한 끗 더
      뜨겁고 밝으며, 모든 가장자리를 따라 은은한 마젠타가 탄다. 배치는 지어낸
      것이 아니다. 태양계 밖 천체 최초의 지도가 골격을 박아 두었다. 중위도의
      거대한 암부, 극 근방의 더 밝은 관, 적도를 따라 이어지는 얼룩. 제트가
      위도마다 조금씩 다른 속도로 이 지형들을 실어 나르니 같은 얼굴이 두 번
      나오지 않는다. 지도가 닻이고, 움직임이 성격이다.
    fields:
      - { name: banding, value: "#29140f", op: set, note: "cloud-deck base, shared palette with A; broken into bands/patches here", note_ko: "구름층 베이스, A와 공유 팔레트. 여기서는 띠·조각으로 갈라짐" }
      - { name: emission_glow, value: "#a63a00", op: set, note: "clearing floors: interior glow ~50 K hotter than A's seams (1280 K deck, hotter gas below), one step brighter than A's #993500", note_ko: "클리어링 바닥. A의 이음매보다 ~50 K 뜨거운 내부 발광, A의 #993500보다 한 단계 밝음" }
      - { name: clouds, value: "Crossfield 2014 Doppler map as the base-texture skeleton (mid-latitude dark region, bright near-polar area, equatorial mottling); rim glow #d94a63 on all deck edges, dense and prominent", value_ko: "베이스 텍스처 골격 = Crossfield 2014 도플러 맵(중위도 암부, 극 근방 밝은 영역, 적도 얼룩). 모든 구름 가장자리에 테두리 발광 #d94a63, 촘촘하고 뚜렷함", op: set }
      - { name: haze, value: "2-3 differential cloud layers (EVE), latitude-dependent drift emulating the zonal jets; ~11% brightness swing per 4.87 h rotation, night-to-night evolution", value_ko: "차등 이동 구름 레이어 2–3장(EVE), 위도별 속도차로 제트 재현. 자전(4.87시간)당 밝기 ~11% 출렁임, 하룻밤 단위 변화", op: set }
      - { name: rings, value: "none", op: set }
    provenance: >
      2026-08-16 owner call: keep both anchors, the Crossfield map as the
      static skeleton and the Apai jets as the motion model; colors follow the
      2026-08-16/17 soft-magenta three-layer decision shared with A.
    gate:
      criterion: [observation, art]
      verdict: pass-in-window
      evidence: >
        Every structural claim is observed: the map skeleton is Crossfield
        2014's Doppler image, the drifting multi-period motion is Apai 2021's
        jets/planetary-wave reading, the 11% swing and night-to-night evolution
        are Gillon 2013, the hotter clearings Faherty 2014, and persistent
        top-of-atmosphere features (map anchoring is legitimate) Chen 2024.
        Colors sit in the brown-dwarf regime window at the owner's
        observed-anchor end. Caveat: any fixed texture is one epoch of a
        changing face; the differential layers are what keep it honest.
      evidence_ko: >
        구조 주장 전부가 관측이다. 골격은 Crossfield 2014 도플러 영상, 다중
        주기가 표류하는 운동은 Apai 2021의 제트/행성규모 파동 해석, 11% 출렁임과
        하룻밤 변화는 Gillon 2013, 더 뜨거운 클리어링은 Faherty 2014, 그리고
        지속성 상층 지형(지도를 닻으로 삼는 근거)은 Chen 2024다. 색은 갈색왜성
        분기 허용 폭에서 오너가 고른 실측 앵커 끝. 주의: 고정 텍스처는 변하는
        얼굴의 한 에포크일 뿐이며, 차등 레이어가 그 정직함을 지킨다.
    refs: ["2014Natur.505..654C", "2021ApJ...906...64A", "2013A&A...555L...5G", "2024MNRAS.533.3114C", "docs/reference/stellar-photospheric-color-methodology.md"]

  - body: Luhman 16 B
    axis: appearance.aurora
    status: gated
    driver: [art-direction]
    narrative: >
      A faint magenta-pink auroral ring over each pole, the same treatment as
      the primary. The argument is even stronger here: we view this body
      exactly along its equator, the worst possible geometry for catching a
      polar radio beam, so the dedicated search's silence constrains this
      aurora least of all.
    narrative_ko: >
      극마다 희미한 마젠타-분홍 오로라 고리를 두른다. 주성과 같은 처리다.
      근거는 여기서 오히려 더 강하다. 이 천체는 정확히 적도 방향에서 보이는데,
      그 기하는 극의 전파 빔을 붙잡기에 가장 나쁜 각도라서, 전용 수색의 무음이
      이 오로라를 가장 덜 구속한다.
    fields:
      - { name: aurora, value: "faint narrow polar ring, magenta-pink #d94a63 family, low altitude, both poles; matched pair with A", value_ko: "희미하고 좁은 극 고리, 마젠타-분홍 #d94a63 계열, 낮은 고도, 양극. A와 짝 맞춤", op: set }
    provenance: >
      2026-08-18 owner call: aurora on both components, both faint (the pair
      stays symmetric in treatment).
    gate:
      criterion: [observation, art]
      verdict: documented-divergence
      evidence: >
        Same physical coherence as A's row: the ~1.2 kG dynamo field supports
        auroral ECM, T-type precedent is imaged (Kao 2016 detections), and the
        equator-on viewing geometry (i near 90) makes a polar beam missing
        Earth the default expectation, not a coincidence. Kept faint and narrow
        inside what the Osten null allows.
      evidence_ko: >
        A 행과 같은 물리 정합이다. ~1.2 kG dynamo 자기장은 오로라 ECM을
        지지하고, T형 선례가 검출돼 있으며(Kao 2016), 적도방향 시선(i ≈ 90)에서는
        극의 빔이 지구를 비켜가는 것이 우연이 아니라 기본 기대다. Osten 무음이
        허용하는 범위 안에서 어둡고 좁게만 그린다.
      divergence_note: >
        Departs the Osten 2015 non-detection (deepest UCD auroral-radio limits,
        multi-rotation coverage): drawn present-but-faint via the ECM beaming
        loophole, strongest for this equator-on component. Class precedent:
        Hallinan 2015; Kao 2016.
      divergence_note_ko: >
        Osten 2015 불검출(극저온왜성 최심 오로라 전파 상한, 여러 자전 커버)에서
        이탈해 "있되 희미함"으로 그린다. ECM 빔 기하 구멍은 적도방향인 이
        성분에서 가장 강하게 성립한다. 부류 선례: Hallinan 2015, Kao 2016.
    refs: ["2015ApJ...805L...3O", "2015Natur.523..568H", "2016ApJ...818...24K"]
