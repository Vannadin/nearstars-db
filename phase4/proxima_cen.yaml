        이라 Fe³⁺ 적색 슬로프 무관(애초 무대기). 색조=interesting-first.

        paper: docs/reference/surface-color-albedo-methodology.md(§4 공간풍화 Hapke2001·Pieters2000, 자기권 차폐로 감소).
