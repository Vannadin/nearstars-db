      자기권이 항성풍을 막아 준 중위도는 상대적으로 밝고(고유 #3c3833 → Proxima-lit ~#3c2d17), 플레어 입자가
      집중 채널되는 자기극관은 거의 흑갈로 짙다(고유 #2a2622 → Proxima-lit ~#2a1e10). 크레이터와 풍화 줄무늬가
      더해진다. 오로라는 없다. 자기장은 약 16 G로 존재하지만 발광할 대기가 없다. b의 황토 호수세계, c의 차가운
      미니 해왕성과 함께 시각적으로 세 극을 이룬다.
