        value: 4.9e-3
        op: set
        note: "=0.30·J₂ (J₂=10/3·C̄₂₂ 조석 삼축; 축차 a−c:b−c=4:1)"
      - name: flattening
        value: 4.0e-2
        op: set
        note: "=(5/2)·J₂ → a/c~1.04 (>2% 가시 삼축, 계란형). Mimas 실제 앵커(q_s 0.0186 동일, 가시 삼축). 오블레이트 메쉬 emit 대상"
      - name: internal_heat
        value: "negligible"
        op: set
        note: "소형 얼음체 radiogenic 미미; e≈0 원형궤도 → 정상상태 조석가열 0. 강제 e(공명)면 c 초근접이라 Io급 가열 가능; tidal-heating-methodology.md"
      - name: obliquity
        value: 0
        unit: deg
        op: set
        note: "≈0 = Cassini State 1 (계산). |g|/α=8e-4 (c의 J₂ 구동 g + 동기 α) → ε₁≲0.004° (갈릴레이 위성급, 사실상 0). method=cassini-state-obliquity-methodology.md"
      - name: age
        value: 4.85
        unit: Gyr
        op: set
    gate:
      criterion: [fiction, error-bar]
      verdict: pass-in-window
      evidence: >
        rationale: 오너 2026-06-23 결정으로, 앞서 "1.5× 달"(반경 2,600km, 비율 0.15 과대)을 ~950 km로 하향(비율 ~0.055=
        해왕성-트리톤, mini-Neptune 위성에 정합). 픽션이라 질량/반경은 얼음 밀도(~1.9)로 자기일관 도출. g·밀도는
        트리톤/티타니아급.

        caveat: G1·c-G10의 '~1.5× 달' 표기는 본 G3로 정정(~950 km).

  - body: Proxima Cen c I
    axis: atmosphere
    refs: ["docs/reference/exoplanet-atmosphere-methodology.md", "docs/reference/ice-stability-methodology.md"]
    status: gated
    driver: [fiction]
    narrative: >
      희박 N₂ 대기(명왕성식, +CH₄/CO 미량)이고, 표면 N₂ 얼음 승화로 ~Pa(µbar)급(명왕성 ~1 Pa 유추). 증기압 평형이라
      승화-지지 정상상태(탈출분을 얼음 승화가 재공급 → Gyr 안정; v_esc~0.97 km/s 낮아도 명왕성처럼 유지). tholin 청색
      haze 층(명왕성 특유 → G6 외형 연계). breathability=∅. 게임상 공기역학 무의미(너무 희박).
    fields:
      - name: composition
        value: "희박 N₂ (명왕성식, +CH₄/CO 미량) + tholin 청색 haze 층"
        op: set
      - name: pressure
        value: 1
        unit: Pa
        op: set
        note: "µbar급 (명왕성 ~1 Pa 유추, 승화-지지 정상상태); KSP상 사실상 무대기"
      - name: breathability
        value: false
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        rationale: 명왕성 아날로그(g 0.5·~40–60K·N₂ 얼음)라 명왕성식 희박 N₂가 자연. 안정 근거 = 승화-지지(증기압 평형) +
        중력 결속(대기 H~30 km ≪ 위성 Hill 2,460 km). c 자기권 상호작용(픽업/torus)은 modest라 본 결정엔 미상세화
        (승화로 상쇄, 오너 2026-06-23).

        paper: 명왕성 N₂ 대기·haze 유추. scale-height/μ = docs/reference/exoplanet-atmosphere-methodology.md.

  - body: Proxima Cen c I
    axis: surface
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [fiction, art-direction]
    # MIGRATION-FLAG: 표면 hex 색(#dcd6c6/#6e4632/#e8eef0)은 narrative 원문에 보존, typed 색필드 미분해 (emit 말미 art-pass).
    narrative: >
      명왕성/트리톤 아날로그이고, 이원(bimodal) 지형 + 위도 구조(오너 a, 2026-06-23). 조성=N₂/CH₄/CO/H₂O 얼음 + tholin.
      공간 배치(오너): 적갈 tholin 지대 = 적도대(가장 많이 조명·따뜻 → 톨린 생성 + 휘발성 손실; 명왕성 Cthulhu식
      저albedo) / 밝은 N₂/CH₄ 얼음 = 극관(가장 추워 휘발성 cold-trap → 고albedo 창백 크림; 트리톤 밝은 극관식). 휘발성
      이동 물리와 정합. 크라이오볼케이노 시그니처 제외(오너). Bond albedo 전반 높음(~0.5–0.7, 명왕성급) 단 공간 변동 큼.
      고유색=크림 N₂(극) ~#dcd6c6 · 적갈 tholin(적도) ~#6e4632 · 물얼음 청백 패치. 조석고정. + sub-c eyeball(오너 2026-06-23):
      c·고리 마주보는 sub-c 지점에 고리-얼음 신선 코팅 → 밝고 톨린 없는 국소 원형 영역(고리 바로 밖 shepherd 위성이라
      쓸어담은 ring-ice가 톨린을 매몰; 트리톤/Iapetus식 한쪽 코팅). 고유색 신선 얼음 백 ~#e8eef0.
    fields:
      - name: surface_type
        value: "ice (명왕성/트리톤 아날로그, bimodal: 적도 tholin + 극 N₂/CH₄ 빙관 + sub-c 신선얼음 eyeball)"
        op: set
      - name: albedo
        value: "~0.5–0.7 (Bond, 명왕성급, 공간 변동 큼)"
        op: set
    gate:
      criterion: [classification, visual-checklist]
      verdict: pass-in-window
      evidence: >
        rationale: 명왕성/트리톤 직접 유추(같은 ~40–60K 냉 얼음+톨린 regime). 색=표면색 문서(물얼음 Warren&Brandt·tholin
        Khare·N₂/CH₄ Grundy/Cruikshank). 별서 멀어 reddening 미미 + 인게임 normalize → 색이 본질(밝기 아님). interesting-first
        균형 지형.

        paper: docs/reference/surface-color-albedo-methodology.md(얼음·tholin n,k). 명왕성/트리톤 표면=Grundy2016·Cruikshank1993.

  - body: Proxima Cen c I
    axis: appearance
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [art-direction]
    narrative: >
      명왕성 룩 + 위도 구조다. 어두운 적갈 tholin 적도대 + 밝은 크림 N₂ 극관(G5 위도 배치; 트리톤식 밝은 극 + 적도
      적화), 그 위 얼룩(mottled) 디테일 + 얇은 청색
      tholin haze 림(G4 haze 역광 → 명왕성 시그니처 청 노을, 위성 특징 비주얼). 조석고정이라 하늘에 c가 거대하게 + 2중
      적/흰 고리까지 떠 보임(위성서 본 장관). 표시색=고유색 거의 그대로(별서 멀어 reddening 미미 + 인게임 normalize):
      크림 #dcd6c6 · 적갈 #6e4632 · haze 청. b(황토)·c(창백 회백)·d(회갈)와 또 다른 = 크림+적갈 얼룩 + 청 haze.
    fields:
      - name: base_color
        value: "크림 #dcd6c6 (극) + 적갈 #6e4632 (적도) 얼룩; 표시색=고유색 거의 그대로"
        op: set
      - name: haze
        value: "얇은 청색 tholin haze 림 (명왕성 시그니처 청 노을)"
        op: set
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: "G4(haze)+G5(이원 지형) 종합. 색=표면색·대기반사색 문서 엔진. c+고리가 하늘에 보이는 건 조석고정 위성의 자연 연출. 오너 G6 확정 2026-06-23."

  - body: Proxima Cen c I
    axis: magnetism.magnetic_field
    refs: ["docs/reference/rocky-planet-dynamo-methodology.md"]
    status: gated
    driver: [fiction]
    narrative: >
      무자기장이다. ~950 km 소형 얼음체라 금속핵 대류 dynamo 불가(얼음 위성 전형). 유도장도 미미(e~0·조석고정→조석가열
      없음 + 소형 저방사성열 → 동결 고체, 전도성 지하 바다 없음 → Europa/트리톤식 유도장 없음). 무관하게 c 자기권 안
      (4 R_c)이라 자기 환경은 c가 결정.
    fields:
      - name: magnetic_field
        value: "none (소형 얼음체 무dynamo, 유도장도 미미; c 자기권 4 R_c 내부)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: "소형 얼음 위성 전형(무dynamo). 지하 바다 없음(열원 부재)이라 유도장도 없음. c 자기권 내부라 위성 자체 장 불필요. 오너 G7 확정 2026-06-23."

  - body: Proxima Cen c I
    axis: environment
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      radiation=낮음(시스템 최저). c가 별서 1.5 AU 멀고 위성이 c 자기권 안이라 항성풍·플레어 직격을 c가 차폐.
      항성풍 차폐 → 표면 항성풍 라디올리시스 거의 없음(G5 톨린이 명왕성보다 덜 빠른 이유). GCR(은하 우주선)은 차폐
      안 됨 → 4.85 Gyr 누적이 G5 적도 톨린 적화의 주력(KBO식). c 자기권 플라스마 sputtering=modest. heliosphere=
      Proxima astrosphere 심부(c 경유). 차갑고 조용하고, 무생물·최저 해저드.
    fields:
      - name: radiation
        value: "낮음 (시스템 최저, c 자기권 차폐; GCR만 비차폐, 적도 톨린 적화 주력)"
        op: set
      - name: stellar_wind
        value: "차폐됨 (c 자기권 4 R_c 내부 → 항성풍 직격 c가 차단; 표면 라디올리시스 거의 없음)"
        op: set
      - name: heliosphere
        value: "Proxima astrosphere 심부 (c 경유)"
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        note: 별 거리 + c 자기권 차폐 + GCR에서 도출. 항성풍 차폐(c)와 GCR 비차폐의 조합이 G5 톨린 생성률·분포를 설명.
        오너 G8 확정 2026-06-23.

        coupling: G5 표면 톨린(GCR 주도, 항성풍 채널 없음) + G7(c 자기권 내부)와 정합.

  - body: Proxima Cen c I
    axis: rings
    status: gated
    driver: [fiction]
    narrative: "고리 없음 (~950 km 위성, 고리 물질·근거 없음). 단순 부재."
