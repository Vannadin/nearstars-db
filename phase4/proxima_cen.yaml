  - body: Proxima Cen c I
    axis: gameplay
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "항성간 플래그십 + 최외곽 c의 위성".
    status: gated
    driver: [engine]
    narrative: >
      착륙 가능(고체 얼음 표면, 명왕성/트리톤 착륙 느낌). 저중력 g~0.5 m/s²(통통 튀는 착륙). splashdown 없음(동결)·
      대기비행 없음(~Pa 너무 희박, 단 청 haze는 보임). breathability=불가. radiation 해저드=낮음(G8 시스템 최저라 상대적
      안전 착륙지). biome = 위도 지형 + sub-c eyeball 4구획(오너 검토 2026-06-23): ① 적도 톨린대(어두운 적갈) · ② 중위도
      (전이) · ③ 극 N₂ 빙관(밝은 크림) · ④ sub-c 고리-얼음 eyeball(밝은 신선 얼음·톨린 없음, c+2중 고리 마주보는 시그니처
      명소). anti-c 반구 biome 제외(오너). ScienceValues(landed/flying-low=탄도/in-space; splashed 토큰 inert). SOI 자동.
      난도 = 항성간 플래그십 + 최외곽 c의 위성(시스템 깊숙이). 발견=RB F F F F(픽션 위성, G1).
    fields:
      - name: science_biomes
        value: "4구획: 적도 톨린대/중위도/극 N₂ 빙관/sub-c 고리-얼음 eyeball (anti-c 반구 제외)"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        owner_review: 2026-06-23 오너 검토로 biome 4구획(위도 3 + sub-c eyeball), anti-c 제외. sub-c eyeball=고리-얼음
        코팅 시그니처.

        note: 착륙 가능(b·d처럼 고체)이되 명왕성식 얼음+톨린+저중력의 독특한 착륙지. c+2중고리 하늘 풍경이 sub-c 명소의 매력.
        cfg emit(biome map·ScienceValues·ResearchBodies)는 프로젝트 말미.
