        note_ko: "=(5/2)·J₂ → a/c~1.012 (<2% 가시 임계 아래). 6.4 R_c로 물러나며 q_s가 4배 줄어 계란형이 사라짐 → 오블레이트 메쉬 비대상, 중력에만 반영"
