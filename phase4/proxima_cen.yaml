# Proxima Centauri (α Cen C / GJ 551) Phase 4 결정 보드 — 별 + 행성 b/c/d. (body × axis) 행별 상태. DB 불변, staging 기록
# 실관측 시스템 → 대부분 Phase 3 측정/합성값 passthrough, 소수 art/divergence만 결정. grounding=docs/phase3/proxima-cen*.md
schema_version: 2
system: proxima_cen
status: staged
updated: 2026-07-12

decisions:
  # ── 별 (Proxima Cen, M5.5Ve 플레어 별) — facet-walk 2026-06-23 ──────────
  - body: Proxima Cen
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The closest star to the Sun. It is a red dwarf of an eighth of a solar mass, and the e on the end of its
      spectral type marks hydrogen emission: this is a flare star. It sits 13,000 AU from α Cen AB, bound so
      loosely that it is the system's third member while moving almost independently of the pair's orbit. Besides
      Proxima Centauri it also answers to α Cen C and GJ 551.
    narrative_ko: >
      태양에서 가장 가까운 별이다. 질량이 태양의 8분의 1뿐인 적색왜성이고, 분광형 끝의 e는 수소 방출선을 뜻한다.
      즉 이 별은 플레어 별이다. α Cen AB에서 13,000 AU 떨어져 아주 약하게 묶여 있어, 같은 계의 세 번째
      구성원이면서도 두 별의 궤도와는 거의 무관하게 움직인다. Proxima Centauri라는 이름 외에 α Cen C나
      GJ 551로도 불린다.
    fields:
      - name: body_type
        value: "M5.5Ve red dwarf (flare star)"
        value_ko: "M5.5Ve 적색왜성(플레어 별)"
        op: set
      - name: designation
        value: "Proxima Centauri (α Cen C / GJ 551)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        Unlike α Cen A and B (naked_eye, bright stars), Proxima is 11th magnitude and invisible to the naked eye
        → category = confirmed (consistent with the history of its telescopic detection), not naked_eye. Owner
        decision (a).
      evidence_ko: >
        α Cen A·B(naked_eye, 밝은 별)와 달리 Proxima는 겉보기 11등이라 맨눈 불가 → category=confirmed(망원경 검출사와
        정합), naked_eye 아님. 오너 결정(a).

  - body: Proxima Cen
    axis: bulk                        # §3.2 템플릿 앵커 — 측정 passthrough 에코 (spin_axis·J2는 전용 행)
    refs: ["2025A&A...700A..11S", "2009A&A...505..205D", "2019A&A...627A.161P", "2012ApJ...757..112B", "1998AJ....116..429B", "2017A&A...598L...7K"]
    body_class: star
    status: passthrough
    narrative: >
      A small cold star: an eighth of the Sun's mass, a seventh of its radius, and a mere six-hundred-and-fortieth
      of its light. The surface runs at 2,900 K, less than half the Sun's, so most of that light leaves in the
      infrared. Packing that mass into that radius puts the surface gravity above 170 times Earth's. Rotation is
      slow at 83.5 days, which makes this star's day close to three Earth months. The age comes out near 4.85
      billion years, much like the Sun's, but it is a kinematic estimate, so whether Proxima was captured by
      α Cen AB or born alongside it remains open. Every value here is a high-confidence measurement.
    narrative_ko: >
      태양의 8분의 1 질량에 7분의 1 반지름, 밝기는 640분의 1에 그치는 작고 차가운 별이다. 표면은 2,900 K로
      태양의 절반이 채 안 되고, 그만큼 빛은 적외선 쪽으로 몰린다. 작고 무거운 몸집이라 표면 중력은 지구의
      170배가 넘는다. 자전은 83.5일로 느려서, 이 별의 하루는 지구의 석 달에 가깝다. 나이는 약 48억 년으로
      태양과 비슷하지만 운동학으로 얻은 값이라, α Cen AB에 나중에 붙잡힌 것인지 함께 태어난 것인지는 아직
      갈리지 않는다. 값은 모두 신뢰도 높은 실측이다.
    fields:
      - name: mass
        value: 0.1221
        unit: M_sun
        op: passthrough
        note: "±0.0022 (SM2025 evolutionary model)"
        note_ko: "±0.0022 (SM2025 진화모델)"
      - name: radius
        value: 0.141
        unit: R_sun
        op: passthrough
        note: "±0.011 (Demory2009 VLTI)"
      - name: gravity
        value: 1684
        unit: m/s2
        op: passthrough
        phase3_default: "derived echo of GM/R^2"
        phase3_default_ko: "GM/R² 파생 에코"
      - name: flattening
        value: 2.8e-8
        op: set
        note: "= (3J₂+q)/2 derived echo (J₂ 3.7e-9, q 4.4e-8); the visual oblateness slot"
        note_ko: "= (3J₂+q)/2 파생 에코 (J₂ 3.7e-9, q 4.4e-8), 시각 oblate 슬롯"
      - name: rotation_period
        value: 83.5
        unit: d
        op: passthrough
        note: "DB recommended; same input as the bulk.geopotential_j2 row"
        note_ko: "DB recommended, bulk.geopotential_j2 행과 동일 입력"
      - name: intrinsic_luminosity
        value: 0.00157
        unit: L_sun
        op: passthrough
      - name: age
        value: 4.85
        unit: Gyr
        op: passthrough
        note: "±0.5 (kinematic; capture vs co-formation unsettled). Teff 2904±51 K (Passegger 2019)"
        note_ko: "±0.5 (kinematic; 포획 vs 동시생성 미정). Teff 2904±51K (Passegger2019)"

  - body: Proxima Cen
    axis: appearance                  # [star] group 6 — 관측 기반 + 흑점 결정
    status: gated
    driver: [window-selection]
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: 산문을 문체 계약에 맞춰 다시 썼다. 폐기 이력을 여기로 옮겼다. 구 표시색 #c54c2a(심적색)은
      광도와 색조를 혼동한 render 짐작이라 폐기하고 실측 Pickles SED→CIE의 #ffcc75로 대체했다. 수치 필드는
      무변경이고 인용은 refs가 담는다.
    narrative: >
      In visible light this star shows a warm orange. Spots cover 3 to 5 percent of the surface, which makes it
      look blotchier than α Cen A or B. The darkening toward the limb is moderate for a red dwarf this size. The
      red hydrogen glow of a flare is recorded for reference, but a flicker that changes with time cannot go into
      a config file, so it stays out of the star's appearance.
    narrative_ko: >
      가시광에서 이 별은 따뜻한 주황색을 띠고 있다. 흑점이 표면의 3~5%를 덮고 있어 α Cen A·B에 비해
      얼룩덜룩해 보인다. 가장자리로 갈수록 어두워지는 정도는 이 크기의 적색왜성치고 온건하다. 플레어가 터질 때의
      붉은 수소 발광색은 참고로 적어 두지만, 시간에 따라 변하는 번쩍임은 설정 파일에 담을 수 없어 겉모습에는
      들어가지 않는다.
    fields:
      - name: color
        value: "#ffcc75"
        op: set
        phase3_default: "#c54c2a (deep red; a render guess that confused luminosity with hue, retired)"
        phase3_default_ko: "#c54c2a (심적색, 광도/색조 혼동 render 짐작 → 폐기)"
        note: "M5.5V physical color, measured Pickles SED → CIE"
        note_ko: "M5.5V 물리색, 실측 Pickles SED→CIE"
      - name: limb_darkening
        value: 0.4
        op: set
        note: "α ~0.4 (Claret 2018 M-dwarf interpolation, tie-break)"
        note_ko: "α~0.4 (Claret2018 M-dwarf 보간, tie-break)"
      - name: spots_faculae
        value: "~3-5% (moderate to somewhat high; 83 d rotational modulation detected)"
        value_ko: "~3–5% (보통~다소 많음; 83d 자전 변조 검출)"
        op: set
      - name: flares
        value: "#ff5e2a (H-α, for reference; dynamic flares cannot be rendered from cfg, visual passthrough)"
        value_ko: "#ff5e2a (Hα, 참조용; 동적 플레어 cfg 렌더 불가, visual passthrough)"
        op: set
    gate:
      criterion: [observation]
      verdict: methodology-derived
      evidence: >
        Color corrected 2026-06-24. The physical color #ffcc75 (measured Pickles SED → CIE) is adopted and the
        old #c54c2a retired. Limb darkening is a tie-break passthrough. Spot coverage ~3–5% is an
        owner-delegated decision (for the texture). Flares are dropped visually (KSP does not support dynamic
        flares; owner confirmed).
      evidence_ko: >
        색 정정 2026-06-24. 물리색 #ffcc75(실측 Pickles SED→CIE)를 채택하고 옛 #c54c2a는 폐기. limb=tie-break passthrough.
        흑점량=오너 위임 결정(텍스처용) ~3–5%. 플레어 visual 드롭(KSP 동적 플레어 미지원, 오너 확인).
    refs: ["docs/reference/stellar-photospheric-color-methodology.md"]

  - body: Proxima Cen
    axis: magnetism.magnetic_field    # 측정
    refs: ["2008ApJ...684.1390R", "2021MNRAS.500.1844K"]
    status: passthrough
    narrative: >
      This star's magnetic field runs hundreds of times the Sun's. Averaged over the surface it reaches
      0.6 kilogauss, of which the large-scale dipole that actually extends out to the planets is 0.135 kilogauss.
      The rest is tangled at small scales and does not reach far. Being fully convective, it does not run the Sun's
      layered dynamo, which is how it holds a field this strong while turning slowly.
    narrative_ko: >
      이 별의 자기장은 태양의 수백 배에 달한다. 표면 전체를 평균하면 0.6 킬로가우스이고, 그중 행성까지 뻗는
      대규모 쌍극자 성분은 0.135 킬로가우스다. 나머지는 작은 규모로 얽혀 있어 멀리 미치지 못한다. 완전 대류
      별이라 태양처럼 층이 갈린 다이나모가 아니고, 그래서 느린 자전에도 이만한 장을 유지한다.
    fields:
      - name: magnetic_field
        value: 0.6
        unit: kG
        op: passthrough
        note: "Mean surface field (Reiners & Basri 2008 / Reiners 2022 CARMENES); large-scale dipole 0.135 kG (Klein 2021 ZDI, mostly poloidal); spin inclination 47±7°"
        note_ko: "평균 표면장 (Reiners&Basri2008/Reiners2022 CARMENES); 대규모 dipole 0.135 kG (Klein2021 ZDI, 주로 poloidal); spin incl 47°±7°"

  - body: Proxima Cen
    axis: environment.activity        # 플레어 별 핵심 — 측정
    # 2026-07-31: logR'HK −5.65±0.17 원출처를 SM2015 로 교정 (구 핀 2016MNRAS.459.3565S 는 ADS 미해결 오기였음)
    refs: ["1998AJ....116..429B", "2017MNRAS.464.3281W", "2015MNRAS.452.2745S", "2004A&A...417..651S"]
    status: passthrough
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: 산문을 문체 계약에 맞춰 다시 썼다. 본문에 있던 점검 로그를 여기로 옮겼다. 2026-07-12 점검에서
      사이클 인용을 Wargelin2024에서 2017(2017MNRAS.464.3281W)로 바꿔 DB recommended 핀과 정렬했다. 수치 필드는
      무변경이고 인용은 refs가 담는다.
    narrative: >
      The star looks quiet and detonates often. It turns slowly at 83.5 days and its quiescent chromospheric
      activity is low, yet flares arrive about 1.5 times a day. Superflares beyond anything the Sun offers come
      around three times a year, and one an order of magnitude larger about every other year. An old slow rotator
      flaring this often reads as a contradiction, and a seven-year activity cycle is what bridges it. X-ray
      brightness swings by more than a factor of thirty between quiescence and flare peak.
    narrative_ko: >
      이 별은 조용한 듯 보이지만 자주 폭발한다. 자전은 83.5일로 느리고 평상시 채층 활동 지표도 낮은데, 플레어는
      하루 평균 1.5회로 터진다. 태양이 내놓는 무엇보다 큰 슈퍼플레어가 해마다 세 번쯤, 그보다 한 자릿수 큰 것이
      2년에 한 번쯤 온다. 나이 든 느린 자전체가 이렇게 자주 폭발하는 것은 모순처럼 보이지만, 7년 주기의 활동
      사이클이 그 사이를 메운다. X선 밝기는 평상시와 플레어 최대 사이에서 30배 넘게 오간다.
    fields:
      - name: activity
        value: "P_rot 83.5±0.5 d (Benedict 1998 HST), 7-year cycle (Wargelin 2017), log R'HK −5.65±0.17"
        value_ko: "P_rot 83.5±0.5d (Benedict1998 HST), 7년 사이클 (Wargelin2017), log R'HK −5.65±0.17"
        op: passthrough
      - name: flares
        value: "1.49 flares/day (Vida 2019 TESS); superflares ≥10³³ erg ~3/yr, ultra ~0.5/yr; X-ray log Lx ~27.0 quiescent to 28.5 peak"
        value_ko: "1.49회/일 (Vida2019 TESS); 슈퍼플레어 ≥10³³erg ~3회/년, ultra ~0.5회/년; X선 log Lx ~27.0 정온→28.5 피크"
        op: passthrough

  - body: Proxima Cen
    axis: environment.stellar_wind    # 측정
    refs: ["2001ApJ...547L..49W"]
    status: passthrough
    narrative: >
      The wind this star sheds is weaker than the Sun's. What the observations give is an upper limit, no more
      than a fifth of the Sun's mass-loss rate, which follows from the star being so small and faint. So what
      troubles the planets here is not a steady wind but the flares that arrive in bursts.
    narrative_ko: >
      이 별이 흘려보내는 항성풍은 태양보다도 약하다. 관측으로 얻은 것은 상한값이고, 태양 질량손실률의 5분의 1을
      넘지 않는다. 별 자체가 워낙 어둡고 작아서 그렇다. 그래서 이 계의 행성들을 괴롭히는 것은 꾸준한 바람이
      아니라 이따금 들이치는 플레어다.
    fields:
      - name: stellar_wind
        value: 0.2
        unit: Mdot_sun
        op: passthrough
        note: "≤0.2 (Wood 2001 astrospheric Lyman-α upper limit). A flare-dominated environment; the steady wind itself is weak"
        note_ko: "≤0.2 (Wood2001 astrospheric Lyα 상한). 플레어-지배 환경, 절대 풍 약함"

  - body: Proxima Cen
    axis: environment.heliosphere     # SHARED 시스템 대표
    refs: ["2001ApJ...547L..49W"]
    status: passthrough
    narrative: >
      The boundary where this star's wind is stopped by the interstellar medium sits inside 55 AU. Against the
      Sun's equivalent boundary beyond 100 AU that is less than half the size, which is what a weak wind buys. The
      interstellar flow it pushes through runs at 25 km/s, the same cloud α Cen AB travels in.
    narrative_ko: >
      항성풍이 성간물질에 밀려 멈추는 경계는 55 AU 안쪽이다. 태양의 같은 경계가 100 AU를 넘는 것과 비교하면
      절반도 되지 않는 작은 거품이고, 약한 바람의 당연한 결과다. 이 별이 헤치고 지나가는 성간 흐름은 초속
      25 km이며, α Cen AB가 지나는 것과 같은 구름이다.
    fields:
      - name: heliosphere
        value: "Astrosphere standoff ≤55 AU (Wood 2001); ISM inflow ~25 km/s (Wood 2005, the same G-cloud as Alpha Cen AB)"
        value_ko: "astrosphere standoff ≲55 AU (Wood2001); ISM 유입 ~25 km/s (Wood2005, α Cen AB와 동일 G-cloud)"
        op: passthrough

  # ── 항성 자전축/J2 — 2026-07-12 항성 점검서 신설 (silent-passthrough 해소) ──
  - body: Proxima Cen
    axis: bulk.spin_axis_orientation
    status: gated                     # 측정 채택 (Klein 2021 ZDI)
    driver: [window-selection]
    narrative: >
      The star's spin axis is tilted 47 degrees to our line of sight, a value that came out of the same
      observations that map its magnetic field. Which way the axis points on the sky is still unconstrained, so we
      know the tilt and not the bearing. None of the three planets has a measured orbital inclination either, so
      whether this star's spin lines up with their orbital plane cannot be answered yet. That leaves its equatorial
      plane as a candidate reference when the planets' orbital orientation has to be fixed.
    narrative_ko: >
      이 별의 자전축은 우리 시선에 대해 47도 기울어 있다. 자기장 지도를 그리는 관측에서 함께 얻은 값이다. 다만
      축이 하늘에서 어느 방향을 향하는지는 아직 묶이지 않아, 기울기만 알고 방위는 모른다. 행성 셋의 궤도 경사도
      측정된 것이 없어서, 이 별의 자전이 행성 궤도면과 나란한지는 지금 답할 수 없다. 그래서 행성 궤도의 방향을
      정할 때 이 적도면을 기준으로 삼는 것이 후보로 남는다.
    fields:
      - { name: spin_axis_orientation, value: "i* 47±7° (measured, relative to the line of sight); position angle free, converted to ICRS at emit", value_ko: "i★ 47°±7° (LOS 기준, 측정) · PA 자유, ICRS 변환 at emit", op: set }
    gate:
      criterion: [observation]
      verdict: pass-in-window
      evidence: >
        The ZDI measurement is adopted as it stands (47°±7°, recommended). The only assumption is the polar
        azimuth. The planets' orbital inclinations are unmeasured, so no alignment is claimed.
      evidence_ko: >
        ZDI 측정값 그대로 채택(47°±7°, recommended). 가정은 극 방위각뿐. 행성 궤도 경사 미측정이라
        정렬 주장 없음.
    refs: ["2021MNRAS.500.1844K"]

  - body: Proxima Cen
    axis: bulk.geopotential_j2
    status: gated                     # 오너 정책 2026-07-12 — 항성 J2 상시 계산·emit
    driver: [window-selection]
    narrative: >
      This star is very nearly a perfect sphere. Turning once in 83.5 days leaves the centrifugal term negligible
      against its own gravity, so the equatorial bulge stays at the level of four parts in a billion. The Sun, by
      the same measure, is bulged about sixty times more. Because the star is fully convective its internal mass
      distribution cannot be borrowed from the Sun, so the flattening comes from a moment of inertia taken from a
      polytrope model instead. The uncertainty is about a quarter, dominated by the measured radius.
    narrative_ko: >
      이 별은 사실상 완벽한 구다. 자전이 83.5일로 느려서 원심력이 자기중력에 비해 무시할 만하고, 그래서 적도가
      부푸는 정도가 10억분의 4 수준에 머문다. 태양이 같은 값에서 이 별의 60배쯤 부풀어 있다. 완전 대류 별이라
      내부 질량 분포를 태양에서 빌려 올 수 없어, 폴리트로프 모형으로 얻은 관성모멘트를 써서 편평도를 구했다.
      값의 불확도는 4분의 1 정도이고 대부분 반지름 측정에서 온다.
    fields:
      - { name: geopotential_j2, value: 3.7e-9, op: set }
      - { name: reference_radius, value: 9.809e7, unit: m, op: set }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        Slow rotation (83.5 d) and a small radius make q itself ~1/470 of the Sun's, the smallest J₂ on the
        roster. It is still emitted as a computed value per owner policy (a star's J₂ may not be treated as
        negligible; it matters in Principia play). Using the M-dwarf polytrope coefficient (0.084) instead of
        the solar ratio (0.0105) is the physical consequence of the difference in central concentration.
      evidence_ko: >
        느린 자전(83.5d)+작은 반지름이라 q 자체가 태양의 ~1/470이고, 로스터 최소 J2다. 그래도 오너 정책
        (항성 J2 무시가능 처리 금지, Principia 플레이 중요)대로 계산값 emit. 태양 비율(0.0105) 대신
        M왜성 폴리트로프 계수(0.084)를 쓴 것은 응집도 차이의 물리적 귀결.
    refs: ["docs/reference/body-figure-methodology.md"]

  # ── 행성 b (대륙형 호수 세계, 무생물) — facet-walk 2026-06-23 ──────────
  - body: Proxima Cen b
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The closest planet to the Sun. A rocky world about Earth's size, with highland rising at the centre of the
      face turned toward its star and lakes and inland seas scattered around it. The far side, where night never
      ends, is capped in ice. It is not the eyeball world usually drawn, with an ocean pooled at the substellar
      point. Nothing lives here.
    narrative_ko: >
      태양에서 가장 가까운 행성이다. 지구와 비슷한 크기의 암석 세계이고, 별을 향한 한쪽 면 가운데에 고지대가 솟고
      그 주변으로 호수와 내해가 흩어져 있다. 밤이 영원한 반대편에는 얼음이 덮여 있다. 흔히 그려지는 눈알 모양의
      세계, 즉 직하점에 바다가 고인 형태는 아니다. 생명은 없다.
    fields:
      - name: body_type
        value: "Rocky terrestrial: a continental lake world (substellar highlands, scattered lakes and inland seas, night-side ice cap, lifeless)"
        value_ko: "암석 지구형: 대륙형 호수 세계 (직하 고지대 + 흩어진 호수/내해 + 야간측 빙관, 무생물)"
        op: set
      - name: designation
        value: "Proxima Centauri b (no proper name)"
        value_ko: "Proxima Centauri b (고유명 없음)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        RV confirmed. The climate is a continental lake world (avoiding the eyeball reading for roster variety;
        the substellar-highland premise makes it diverge naturally from TRAPPIST-1 e). No life.
      evidence_ko: >
        RV confirmed. 기후=대륙형 호수(eyeball 회피, 로스터 다양성; 직하-고지대 전제라
        TRAPPIST-1 e와 자연 분기). 생명 없음.

  - body: Proxima Cen b
    axis: orbit                       # a/e/inc/lock = 측정 passthrough
    refs: ["2025A&A...700A..11S", "2016Natur.536..437A", "2022A&A...658A.115F"]
    status: passthrough
    narrative: >
      It hugs its star, one lap in 11.2 days. The orbit is circular for all practical purposes, and at this
      distance tides lock the spin to it within a hundred thousand years, so one face holds toward the star
      forever. The planet does not transit, so how far the orbit tilts to our line of sight is unknown.
    narrative_ko: >
      별에 아주 가까이 붙어 11.2일에 한 바퀴를 돈다. 궤도는 사실상 원이고, 이 거리에서는 조석이 10만 년 안에
      자전을 궤도에 묶어 버리므로 한쪽 면이 영원히 별을 마주한다. 통과 현상이 관측되지 않아 궤도가 우리 시선에
      얼마나 기울었는지는 모른다.
    fields:
      - name: semi_major_axis_au
        value: 0.04848
        unit: AU
        op: passthrough
        note: "P=11.18465d"
      - name: eccentricity
        value: 0
        op: passthrough
        note: "~0 measured (SM2025); inclination unmeasured (non-transiting). Emit caution: e~0 with a 0.3 bar atmosphere trips the Kopernicus temperatureEccentricityBiasCurve divide-by-zero, and the value is measured so noise is banned; suppress the curve at emit"
        note_ko: "≈0 measured (SM2025); inc 미측정(비통과). emit 주의: e≈0 + 0.3 bar 대기 → Kopernicus temperatureEccentricityBiasCurve 0-나눗셈 트랩 → 측정값이라 noise 금지 → emit시 곡선 suppress"
      - name: tidal_lock
        value: "1:1 (locking time <10⁵ yr); Omega/omega/M free at emit"
        value_ko: "1:1 (락타임 <10⁵yr); Ω/ω/M free-emit"
        op: passthrough

  - body: Proxima Cen b
    axis: bulk                        # §3.2 템플릿 앵커 — mass=등방 prior 중앙 진질량(결정), 나머지 passthrough/tie-break
    body_class: tidally_locked
    status: gated
    driver: [window-selection]
    narrative: >
      A rocky planet a little heavier and a little larger than Earth. Its density is nearly Earth's, so the body
      is an iron core under a silicate mantle, and the surface gravity is much the same as ours. The mass, though,
      is the radial-velocity minimum corrected for orbital inclination by probability, so it is a median rather
      than a measurement. Tides hold the rotation to the orbit, and the spin axis stands very nearly perpendicular
      to the orbital plane, a tilt that was computed as an equilibrium rather than assumed. Turning that slowly
      leaves the equatorial bulge negligible, and the heat rising from inside is too little to move the surface
      temperature. That little heat is what drives the planet's weak magnetic field.
    narrative_ko: >
      지구보다 조금 무겁고 조금 큰 암석 행성이다. 밀도가 지구와 거의 같아 철 핵과 규산염 맨틀로 이루어진 몸이고,
      표면 중력도 지구와 다를 바 없다. 다만 질량은 시선속도가 주는 최소값에 궤도 경사를 확률로 보정한 값이라,
      측정치가 아니라 중앙값이다. 조석에 묶여 자전 주기가 공전 주기와 같고, 자전축은 궤도면에 거의 수직으로 선다.
      이 기울기는 가정이 아니라 평형 상태를 계산해 얻은 값이다. 느린 자전 탓에 적도가 부푸는 정도는 무시할 만하며,
      내부에서 올라오는 열도 표면 온도를 바꾸지 못할 만큼 적다. 다만 그 적은 열이 이 행성의 약한 자기장을 돌린다.
    fields:
      - name: mass
        value: 1.22
        unit: M_earth
        op: set
        phase3_default: "Msini 1.055 M⊕ (RV minimum mass, SM2025)"
        phase3_default_ko: "Msini 1.055 M⊕ (RV 최소질량, SM2025)"
        note: "Median true mass under an isotropic prior"
        note_ko: "등방 prior 중앙 진질량"
      - name: radius
        value: 1.07
        unit: R_earth
        op: set
        note: "Non-transiting tie-break (mass-radius); g ~1.07, density ~5.5 g/cm³, terrestrial rock"
        note_ko: "비통과 tie-break(질량-반경); g~1.07·밀도~5.5 g/cm³ 지구형 암석"
      - name: gravity
        value: 1.07
        unit: g
        op: set
        note: "derived echo of GM/R^2"
        note_ko: "GM/R² 파생 에코"
      - name: flattening
        value: 7.0e-5
        op: set
        note: "= (5/2)·J₂ mean-equatorial spheroid (J₂ 2.8e-5); visually a sphere"
        note_ko: "= (5/2)·J₂ 평균적도 spheroid (J₂ 2.8e-5), 시각상 구"
      - name: rotation_period
        value: 11.186
        unit: d
        op: set
        note: "= orbital period (tidally locked, DB curated)"
        note_ko: "= 공전주기 (조석고정, DB curated)"
      - name: spin_axis_orientation
        value: "Offset from the orbit normal toward the Laplace pole by the Cassini ε (~0.03°), the State 1 equilibrium; azimuth de-perfected at emit"
        value_ko: "궤도 법선에서 Cassini ε(~0.03°)만큼 Laplace pole 쪽 offset (State 1 평형); 방위각 de-perfect-at-emit"
        op: set
      - name: geopotential_j2
        value: 2.8e-5
        op: set
        note: "~ q_s (synchronous rotation; body-figure-methodology section 6 worked example)"
        note_ko: "≈ q_s (동기 자전, body-figure-methodology §6 워크드)"
      - name: geopotential_c22
        value: 8.0e-6
        op: set
        note: "Permanent tidal triaxiality (section 6 worked example); the emit threshold call belongs to the emit stage"
        note_ko: "영구 조석 삼축 (§6 워크드), emit 임계 판단은 emit 단계"
      - name: reference_radius
        value: 6817
        unit: km
        op: set
        note: "J₂/C₂₂ reference radius = radius"
        note_ko: "J2/C22 기준 반경 = radius"
      - name: internal_heat
        value: "negligible (at the surface)"
        value_ko: "negligible (표면)"
        op: set
        note: "Radiogenic, Earth-scale ~0.08 W/m² (T_int ~35 K), so the surface holds T_eff ~ T_eq (section 7); that internal heat is what drives the weak dynamo (RM22)"
        note_ko: "radiogenic ~Earth-scale ~0.08 W/m² (T_int~35K), 표면 T_eff≈T_eq(§7); 내부열 몫은 G7 약한 dynamo(RM22) 구동"
      - name: obliquity
        value: 0
        unit: deg
        op: set
        note: "~0 = the Cassini State 1 equilibrium (computed, not assumed). |g|/α = 0.017 (Laplace-Lagrange nodal rate g with the synchronous α, far below the ~1.1 resonance threshold) → ε₁ = (|g|/α)·sin I ~ 0.02-0.05° for the near-coplanar orbital inclination. No dramatic obliquity. Method: cassini-state-obliquity-methodology.md"
        note_ko: "≈0 = Cassini State 1 평형 (가정 아님·계산). |g|/α=0.017 (Laplace–Lagrange 승교점율 g + 동기 α, ≪ 공명 임계 ~1.1) → ε₁=(|g|/α)·sinI ≈0.02–0.05° (근접-공면 궤도 I). 극단 obliquity 없음. method=cassini-state-obliquity-methodology.md"
      - name: age
        value: 4.85
        unit: Gyr
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        The adopted values are a true mass of 1.22 M⊕, a radius of 1.07 R⊕, tidally locked rotation, obliquity 0
        and J₂ 2.8e-5. Verified: applying the median inclination of 60° for random orientations (1/sin 60 =
        1.1547) to the measured minimum mass Msini 1.055 M⊕ gives the median true mass 1.22 M⊕, the same method
        as the Barnard board. The radius is a mass-radius tie-break because the planet does not transit, and it
        keeps a terrestrial density of 5.5 g/cm³; at this mass an H/He envelope could not survive flare
        photoevaporation. The synchronous q_s of 2.8e-5 becomes J₂ directly, and the permanent tidal triaxiality
        C̄₂₂ is 8e-6. The obliquity sits at the Cassini State 1 equilibrium, with |g|/α = 0.017 far below the
        resonance threshold of 1.1. Caveat: 1.22 is the median of an isotropic prior (uniform in cos i → median
        inclination 60°). The lower bound is the measured Msini 1.055 and there is no upper bound. Folding in a
        population mass function shifts the posterior median below the isotropic assumption, so this must not be
        read as a precise expectation value. All three planets use the isotropic median for roster consistency.
      evidence_ko: >
        채택값은 진질량 1.22 M⊕, 반경 1.07 R⊕, 조석고정 자전, obliquity 0, J₂ 2.8e-5이다.
        확인: 측정된 최소질량 Msini 1.055 M⊕에 무작위 배향의 중앙 경사 60°를 적용해(1/sin60 = 1.1547) 중앙
        진질량 1.22 M⊕를 얻었고, Barnard 보드와 같은 방식이다. 반경은 비통과라 질량-반경 관계로 tie-break해
        밀도 5.5 g/cm³의 지구형을 유지하며, 이 질량대에서 H/He 외피는 플레어 광증발로 남지 못한다. 동기 자전의
        q_s 2.8e-5이 그대로 J₂가 되고 영구 조석 삼축 C̄₂₂는 8e-6이다. obliquity는 |g|/α = 0.017로 공명 임계
        1.1보다 훨씬 작아 Cassini State 1 평형에 앉는다.
        유보: 1.22는 등방 prior의 중앙값이다(cos i 균일 → 중앙 경사 60°). 하한은 측정된 Msini 1.055이고 상한은
        없다. 모집단 질량함수를 함께 넣어 사후분포를 구하면 중앙값이 등방 가정보다 낮은 쪽으로 이동하므로, 이 값을
        정밀한 기대값으로 읽어서는 안 된다. 로스터 일관성을 위해 세 행성 모두 등방 중앙값을 쓴다.
    refs: ["1007.0245", "docs/reference/mass-radius-relation-methodology.md", "docs/reference/body-figure-methodology.md", "docs/reference/cassini-state-obliquity-methodology.md", "docs/reference/internal-heat-luminosity-methodology.md"]

  - body: Proxima Cen b
    axis: atmosphere                  # G4
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-04: pressure 0.7 → 0.3 bar (오너 결정). 구값 0.7 bar는 Phase 3 앵커 1 bar에서 내려온 값인데 사유
      기록이 없었고, 야간 CO₂ 서리가 분압을 버퍼링한다는 조건을 넣으면 야간 157 K를 요구해 GCM 앵커 150 K와
      어긋났다. 150 K가 버퍼링하는 분압 8.4 mbar가 3%가 되는 총기압이 0.28 bar라 0.3 bar가 자기정합적이다.
      같은 검토에서 evidence의 CO₂ frost point 135 K가 오류로 드러났다(같은 Fray & Schmitt 곡선으로 21 mbar는
      156.8 K, 화성 극관 147.7 K로 곡선 검증). divergence_note의 "shoreline 위"도 반대로 정정했고, Ribas 2016을
      침식 근거로 인용한 것도 바로잡았다(그 논문은 보유 쪽 결론이다).
    status: gated
    driver: [window-selection]
    narrative: >
      The planet holds an atmosphere at about a third of Earth's pressure. Nitrogen dominates it with 3 percent
      carbon dioxide, and that 3 percent works as a greenhouse that keeps the star-facing ground above the freezing
      point of water. There is no oxygen, so it cannot be breathed. The air is thin: 95 percent of its mass sits
      within 21 km of the surface. On the far side, in permanent night, the ground is cold enough that some of the
      carbon dioxide settles out as dry-ice frost, and that frost is what fixes how much of the gas stays in the
      air: any excess freezes onto it, any shortfall sublimates back. Nothing survives as frost on the lit side,
      where even the terminator is far too warm. That this air survives the star at all, though, is a choice rather
      than an observation. Proxima's flares and wind are capable of stripping an atmosphere of this size.
    narrative_ko: >
      이 행성에는 지구의 3분의 1쯤 되는 기압의 대기가 있다. 질소가 주성분이고 이산화탄소가 3% 섞여 있는데, 그 3%가
      온실로 작용해 별을 마주한 쪽 지표를 물의 어는점 위에 붙들어 둔다. 산소는 없어 숨 쉴 수 없다. 대기는 얇다.
      질량의 95%가 지표 위 21 km 안에 들어 있다. 밤이 영원한 반대편은 지표가 충분히 차가워 이산화탄소 일부가
      드라이아이스 서리로 내려앉고, 그 서리가 대기에 남는 기체의 양을 정한다. 남으면 서리로 얼어붙고 모자라면
      다시 승화해 돌아온다. 빛을 받는 쪽에는 서리가 남지 못한다. 명암경계선조차 너무 따뜻하다. 다만 이 대기가
      별을 견디고 남아 있다는 것 자체는 관측이 아니라 선택이다. Proxima의 플레어와 항성풍에는 이만한 대기를
      벗겨낼 힘이 있다.
    # MIGRATION-FLAG: derived_temps 는 비표준 행-레벨 키로 프로즈 원문 보존 (validator 무시). 온도값 typed field 로 병기.
    derived_temps: >
      Teq≈228K(A 0.33, 기압 무관, G5 albedo cascade). 조석고정 1:1 → 1 bar GCM 앵커(Turbet2016·Boutle2017: 직하 290K,
      야간 150K, 평균 250K)에서 0.3 bar로 Koll 2022 대비 스케일링: 직하 ~295–310K(>273K → 액체 호수 유지)·야간
      ~148–152K(CO₂ 서리 버퍼가 이 온도에 고정)·평균 ~240K. 온실 계산기(greenhouse_dt.py, S 0.668·pCO₂ 9 mbar·A 0.33)는
      평균 Ts 241K. 직하 호수 + 나머지 빙결 = 대륙형 호수 세계와 정합하고, 얇아진 대기는 재분배를 줄여 직하를 오히려
      높이므로 빙점 마진이 0.7 bar보다 넓다.
    fields:
      - name: pressure
        value: 0.3
        unit: bar
        op: set
        phase3_default: "Phase 3 synthesized atmosphere where one exists; this decision fixes the art-directed pressure and composition"
        phase3_default_ko: "Phase 3 합성 대기(있으면); 본 결정이 art-direction 기압/조성 확정값"
        note: "CO₂ frost at the ~150 K night-side minimum buffers a partial pressure of 8.4 mbar, which makes 0.28 bar the total pressure at which CO₂ is 3%. The old 0.7 bar demanded a 157 K night side and clashed with the GCM anchor"
        note_ko: "야간 최저 ~150 K의 CO₂ 서리가 분압 8.4 mbar를 버퍼링 → 3%가 되는 총기압 0.28 bar. 구값 0.7 bar는 야간 157 K를 요구해 GCM 앵커와 어긋났다"
      - name: composition
        value: "N₂-dominated with ~3% CO₂ (μ ~28.5 g/mol)"
        value_ko: "N₂ 지배 + CO₂ ~3% (μ≈28.5 g/mol)"
        op: set
      - name: temperature
        value: 228
        unit: K
        op: set
        note: "Teq (A 0.33, pressure-independent). Redistribution at 0.3 bar: substellar ~295-310 K, night ~148-152 K, mean ~240 K (scaled from the 1 bar GCM anchor per Koll 2022)"
        note_ko: "Teq (A 0.33, 기압 무관). 0.3 bar 재분배: 직하 ~295–310K·야간 ~148–152K·평균 ~240K (1 bar GCM 앵커에서 Koll 2022 대비 스케일링)"
      - name: scale_height
        value: 7
        unit: km
        op: set
        note: "=RT/μg (T~250K·g 10.5·μ 28.5)"
      - name: breathability
        value: false
        op: set
        note: "Lifeless and oxygen-free; atmosphereContainsOxygen = false"
        note_ko: "무생물·무산소, atmosphereContainsOxygen=false"
      - name: escape
        value: "Below the shoreline (by 23 times the gravitational allowance), but retention is adopted on the premise of a lake world"
        value_ko: "shoreline 아래(중력 허용치의 23배 초과)이나 호수 세계 전제로 보유 채택"
        op: set
    gate:
      criterion: [classification, retention, error-bar]
      verdict: documented-divergence
      divergence_note: >
        On the empirical cosmic shoreline (Zahnle & Catling 2017, v_esc ∝ I_XUV^¼) this planet falls on the
        stripped side rather than the retaining one. Its escape velocity of 11.94 km/s is only 1.068 times
        Earth's, so gravity allows 1.3 times the irradiation, while the actual dose measured by Ribas 2016 is 30
        times Earth's in EUV and 250 times in X-rays, exceeding the allowance by about 23 times. The atmosphere
        is nonetheless retained because this board fixed b as a liquid-water lake world, choosing the temperate
        branch among the environmental states Meadows 2018 enumerates as an explicit tie-break. The literature
        is split: Dong 2017's stellar-wind ion escape has it eroded on geologically short timescales, whereas
        Ribas 2016 computes energy-limited escape and concludes that less than one Earth ocean of hydrogen was
        lost and that b remains a strong habitability candidate. So what we depart from is the empirical
        shoreline and Dong's ion escape, and what we adopt is the detailed calculations of Ribas and Meadows.
        Garraffo 2016's magnetic shielding could help, but Ramstad & Barabash 2021 argue the opposite, so it is
        not used as grounding.
      divergence_note_ko: >
        경험적 cosmic shoreline(Zahnle & Catling 2017, v_esc ∝ I_XUV^¼)에서 이 행성은 유지 쪽이 아니라 벗겨지는
        쪽에 있다. 탈출속도 11.94 km/s는 지구의 1.068배뿐이어서 중력이 허용하는 조사량이 1.3배인데, Ribas 2016이
        측정한 실제 조사량은 EUV 30배·X선 250배로 약 23배 초과한다. 그래도 대기를 남긴 것은 이 보드가 b를 액체
        물 호수 세계로 확정했기 때문이고, Meadows 2018이 나열한 환경 상태 중 온대 분기를 명시적 tie-break로
        골랐다. 문헌은 갈려 있다. Dong 2017의 항성풍 이온 탈출은 지질학적으로 짧은 시간에 침식된다고 보는 반면,
        Ribas 2016은 에너지 제한 탈출로 계산해 잃은 수소가 지구 바다 하나 미만이며 b가 유력한 거주가능 후보라고
        맺는다. 즉 우리가 떠난 것은 경험적 shoreline과 Dong의 이온 탈출이고, 택한 것은 Ribas·Meadows의 상세
        계산이다. Garraffo 2016의 자기 차폐는 도울 수 있으나 Ramstad & Barabash 2021이 반대 방향을 제시하므로
        근거로 세우지 않는다.
      evidence: >
        The adopted values are a 0.3 bar N₂ atmosphere with 3% CO₂, mean molecular weight 28.5, scale height 7
        km, equilibrium temperature 228 K and no oxygen. Verified: what sets the pressure is CO₂ cold-trapping
        on the night side. On the Fray & Schmitt vapor-pressure curve, frost at the 150 K night-side minimum
        buffers the atmospheric CO₂ partial pressure at 8.4 mbar, and the total pressure at which that is 3% is
        0.28 bar. The frost pile acts as a reservoir: surplus CO₂ freezes out and any deficit sublimates back,
        holding the partial pressure. No frost survives on the lit side; already at the 200 K terminator the
        vapor pressure is 1,556 mbar, 170 times the atmospheric partial pressure. 0.3 bar is the top of Joshi
        1997's 0.1–0.3 bar collapse threshold, so transport can hold the night side at that temperature, and the
        thermal tides are weaker than at 1 bar, which keeps the 1:1 lock and obliquity 0 safe. The three
        temperature layers were carried over from the 1 bar GCM anchor (substellar 290 K, night 150 K, mean 250
        K) by Koll 2022 scaling, and the greenhouse calculator gives a mean of 241 K. Caveat: the Bond albedo
        0.33 was set including substellar clouds; a thinner atmosphere means fewer clouds and the albedo could
        fall toward 0.30, which raises the equilibrium temperature. That is left as a matter to weigh together
        with the surface row.
      evidence_ko: >
        채택값은 0.3 bar의 N₂ 대기에 CO₂ 3%, 평균 분자량 28.5, 규모 높이 7 km, 평형온도 228 K, 산소 없음이다.
        확인: 기압을 정한 것은 야간측 CO₂ 냉각 포획이다. Fray & Schmitt 증기압 곡선에서 야간 최저 150 K의 서리가
        대기 CO₂ 분압을 8.4 mbar로 버퍼링하고, 그 값이 3%가 되는 총기압이 0.28 bar다. 서리 더미가 저장고로
        작동해 남는 CO₂는 얼어붙고 모자라면 승화해 돌아오므로 분압이 유지된다. 일사를 받는 쪽에는 서리가 남지
        않는다. 명암경계선 200 K에서 이미 증기압이 1,556 mbar로 대기 분압의 170배다. 0.3 bar는 Joshi 1997의
        붕괴 임계 0.1~0.3 bar의 상단이라 수송이 야간을 그 온도에 붙들 수 있고, 열조석도 1 bar보다 약해 1:1
        고정과 obliquity 0이 안전하다. 온도 3계층은 1 bar GCM 앵커(직하 290 K·야간 150 K·평균 250 K)에서
        Koll 2022 대비 스케일링으로 옮겼고, 온실 계산기는 평균 241 K를 준다.
        유보: Bond 알베도 0.33은 직하 구름을 포함해 잡은 값인데, 기압이 얇아지면 구름이 줄어 알베도가 0.30 쪽으로
        내려갈 수 있다. 그러면 평형온도가 오른다. surface 행에서 함께 볼 사안으로 남긴다.
    refs: ["1702.04089", "1608.06813", "1608.08620", "docs/reference/exoplanet-atmosphere-methodology.md", "docs/reference/tidally-locked-temperature-methodology.md"]

  - body: Proxima Cen b
    axis: surface                     # G5 — 대륙형 호수 세계 표면; 색=표면색 문서, A=Bond cascade
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [window-selection, art-direction]
    narrative: >
      The hemisphere in permanent day divides into two colours of ground. The low country is basalt rich in olivine
      and pyroxene, a dark grey-green; the high country is feldspar-rich and bright. It is not Mars-red. With no
      life and no oxygen the iron never oxidizes and stays reduced, so the charge transfer that makes rust-red never
      happens. Lakes and inland seas lie scattered between them as dark water, and water cloud hangs over the
      substellar point, cooling what is beneath. The far side, in permanent night, is covered in bright water ice
      with a faint blue cast.
    narrative_ko: >
      낮이 영원한 반구는 두 가지 색의 땅으로 갈린다. 낮은 곳은 올리빈과 휘석이 많은 현무암 지대라 어두운
      회녹색이고, 높은 곳은 장석이 모인 밝은 고지다. 화성처럼 붉지는 않다. 생명도 산소도 없어 철이 산화되지
      못하고 환원된 상태로 남는 탓에, 붉은색을 만드는 전하 이동이 일어나지 않는다. 그 사이로 호수와 내해가
      흩어져 어두운 물빛으로 놓이고, 직하점 위에는 물구름이 걸려 그 아래를 식힌다. 밤이 영원한 반대편은 밝은
      물얼음으로 덮여 살짝 푸르다.
    # MIGRATION-FLAG: bond_albedo_cascade / cfg_colors_intrinsic 는 비표준 행-레벨 키로 프로즈+hex 원문 보존 (색은 emit 말미 art-pass, typed 색필드 미분해).
    bond_albedo_cascade: >
      Bond albedo는 **일사받는 데이샤이드만** 결정(1:1 고정 → 야간측 일사 0 → 밝은 빙관은 Bond에 미기여, 과대평가 회피).
      데이샤이드 면적가중 = 어두운 마픽+호수(낮음) + 밝은 anorthosite 고지·직하 구름(높음) → **A≈0.33**. G4 Teq 228K와
      맞물림 → cascade 닫힘. 오너 "평균 알베도 조금↑"은 밝은 고지 추가로 물리적 정당화(0.30→0.33), 온도는 G4서 동기 하향.
    cfg_colors_intrinsic: >
      고유(중립광/태양 기준) 반사색 — cfg 저장값, 렌더러가 항성광 적용(Proxima-lit 표시색은 appearance/G6).
      마픽 저지 #3c4339(창 #353b32–#444b40) · 장석질 고지 #928c81(창 #88827a–#9d978c) ·
      직하 호수 #1d2c3a(창 #182430–#223240) · 야간 빙관 #dde6ec(창 #d4dde6–#e8eef2) · 직하 구름층 #eef1f4.
    fields:
      - name: surface_type
        value: "rock (two-tone continents: grey-green mafic lowlands and feldspathic highlands)"
        value_ko: "rock (2색 대륙: 회녹 마픽 저지 + 장석질 고지)"
        op: set
      - name: albedo
        value: 0.33
        op: set
        note: "Bond, area-weighted over the dayside (cascades into the Teq 228 K decision)"
        note_ko: "Bond, 데이샤이드 면적가중 (G4 Teq 228K와 cascade)"
      - name: hydrosphere
        value: "Substellar lakes and inland seas (dark water, A ~0.07, scattered)"
        value_ko: "직하 호수/내해 (어두운 물 A~0.07, 산재)"
        op: set
      - name: ice_caps
        value: "Night-side ice cap (bright water ice, A ~0.5-0.6, faintly blue)"
        value_ko: "야간 빙관 (밝은 물얼음 A~0.5–0.6, 살짝 청색)"
        op: set
    gate:
      criterion: [classification, visual-checklist]
      verdict: pass-in-window
      evidence: >
        The adopted values are two-tone continents (dark grey-green mafic lowlands with bright feldspathic
        highlands), substellar lakes and inland seas, a night-side ice cap and a Bond albedo of 0.33. Verified:
        the largest lever on color is the oxidation state. Lifeless and anoxic, the iron stays as Fe²⁺, so the
        red slope that Fe³⁺ charge transfer produces never appears. The Bond albedo was area-weighted over the
        lit dayside alone; with the 1:1 lock the night side receives no insolation, so including the bright ice
        cap would overestimate it. Dark mafic terrain and lakes together with bright highlands and substellar
        clouds come to 0.33, and that value closes against the atmosphere row's equilibrium temperature of 228
        K. The surface divisions drawn here carry over as the biome candidates in the gameplay row. Caveat: the
        hue and the pattern themselves are an art choice made inside the window physics allows. The one thing
        physics binds is the area-weighted Bond albedo. Dropping to 0.3 bar thins the substellar clouds and the
        albedo could move toward 0.30, but the resulting 2.5 K rise sits inside the ±10 K band of the greenhouse
        calculation and does not change the verdict.
      evidence_ko: >
        채택값은 2색 대륙(어두운 회녹 마픽 저지 + 밝은 장석질 고지), 직하 호수·내해, 야간 빙관, Bond 알베도
        0.33이다.
        확인: 색을 정하는 최대 레버는 산화상태다. 무생물·무산소이므로 철이 Fe²⁺로 남아 Fe³⁺ 전하이동이 만드는
        적색 슬로프가 생기지 않는다. Bond 알베도는 일사를 받는 데이샤이드만으로 면적가중했다. 1:1 고정이라
        야간측 일사가 0이어서 밝은 빙관을 넣으면 과대평가가 된다. 어두운 마픽과 호수, 밝은 고지와 직하 구름을
        합쳐 0.33이 되고, 이 값이 대기 행의 평형온도 228 K와 맞물려 닫힌다. 여기서 나눈 표면 구획은 gameplay
        행의 biome 후보로 이어진다.
        유보: 색조와 패턴 자체는 물리가 허용하는 창 안에서 고른 아트 선택이다. 물리가 묶는 것은 면적가중 Bond
        알베도 하나뿐이다. 0.3 bar로 내려가면 직하 구름이 얇아져 알베도가 0.30 쪽으로 갈 수 있으나, 그때 평형온도
        상승은 2.5 K로 온실 계산의 ±10 K 밴드 안이라 판정을 바꾸지 않는다.

  - body: Proxima Cen b
    axis: appearance                  # G6 — Proxima-lit 표시색 + 디스크 종합 + 희미 플레어-오로라
    provenance: >
      2026-08-07: Hapke shader scalars + mean visual albedo added (hapke_terrain / hapke_scaled / hapke_porosity_k / hapke_theta / albedo_mean) per docs/reference/hapke-shader-methodology.md; K computed from the packing formula, theta anchored by analog. No prior value changed.
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      Under red starlight the planet reads as a warm ochre disk. The brightest thing on it is the swirl of water
      cloud over the substellar point, ringed by two-tone continents stained red, with lakes sunk dark between them.
      Past the terminator the night-side ice cap carries on in cream. Starlight erases the blue of that ice. It is
      the opposite of Alpha Centauri A b (Polyphemus), which stands under a Sun twin and keeps its own colours almost untouched. Only
      when a flare breaks does a violet aurora spread faintly, and with no oxygen the green Earth shows never
      appears.
    narrative_ko: >
      붉은 별빛 아래 이 행성은 따뜻한 황토빛 원반으로 보인다. 가장 밝은 것은 직하점에 걸린 물구름의 소용돌이이고,
      그 둘레로 붉게 물든 두 색의 대륙이 펼쳐지며 사이사이 호수가 검붉게 잠긴다. 명암경계선을 넘어서면 야간
      빙관이 크림빛으로 이어진다. 얼음의 푸른 기는 별빛에 지워진다. 태양 쌍둥이의 빛을 받아 제 색을 거의 그대로
      보이는 Alpha Centauri A b(폴리페무스)와는 정반대다. 플레어가 터질 때만 자줏빛 오로라가 희미하게 번지는데, 산소가 없어
      지구에서 보는 초록빛은 나타나지 않는다.
    # MIGRATION-FLAG: cfg_colors_displayed 는 비표준 행-레벨 키로 프로즈+hex 원문 보존 (표시 팔레트, emit 말미 정밀화).
    cfg_colors_displayed: >
      Proxima reddening 적용 근사(§6 엔진, illuminant=별; emit서 정밀화). 마픽 저지 #3e2c16(움버) ·
      장석 고지 #9a5e38(테라코타) · 직하 호수 #1d1810(검붉은 근흑) · 야간 빙관 #dda176(크림-복숭아, 청색 죽음) ·
      직하 구름 #f0d8bf(크림화이트). 고유색은 G5 cfg_colors_intrinsic.
    fields:
      - name: base_color
        value: "Warm ochre / red-brown disk (Proxima M5.5, Teff 2904 K reddening)"
        value_ko: "따뜻한 황토/적갈 디스크 (Proxima M5.5 Teff 2904K reddening)"
        op: set
      - name: aurora
        value: "Faint, intermittent flare aurora in magenta-violet"
        value_ko: "희미·간헐 플레어-오로라, 적자색 (magenta-violet)"
        op: set
      - name: hapke_terrain
        value: 1.0
        op: set
        note: "Lunar-family land (diffuse-cosine exponent = Lambert)."
        note_ko: "달형 패밀리 육지 (확산 코사인 지수 = 램버트)"
      - name: hapke_scaled
        value: 1.0
        op: set
        note: "Full-disk phase behaviour (Sol's class convention)."
        note_ko: "원반 위상 거동(Sol 클래스 컨벤션)"
      - name: hapke_porosity_k
        value: 1.86
        op: set
        note: "Hapke 2008 K(φ) computed; optical-layer filling factor φ ~ 0.49 (51% porosity)."
        note_ko: "Hapke 2008 K(φ) 계산, 광학층 충전율 φ≈0.49 (51% 다공)"
      - name: hapke_theta
        value: 18
        unit: deg
        op: set
        note: "Cratered-regolith analog. A fitted parameter, so an analog choice rather than a derivation."
        note_ko: "포화 크레이터 레골리스 아날로그. 적합 파라미터라 도출이 아닌 아날로그 선택이다."
      - name: albedo_mean
        value: 0.45
        op: set
        note: "Area-weighted geometric (visual) albedo; the Bond value 0.33 for the energy budget stays on the surface row."
        note_ko: "면적가중 기하(시각) 알베도; 에너지 수지용 Bond 0.33은 surface 행"
    gate:
      criterion: [visual-checklist, composition-lock]
      verdict: owner-override
      evidence: >
        The adopted look is a warm ochre and red-brown disk, brightest at the substellar cloud swirl, carrying
        red-stained two-tone continents, dark red lakes, a cream night-side ice cap, and a faint magenta-violet
        aurora visible only during flares. Verified: the displayed colors are the surface row's intrinsic
        reflectances multiplied by Proxima's spectrum, and the reddening by starlight is itself physics. The
        auroral color is locked by composition: N₂-dominated and oxygen-free, so Earth's oxygen 557 nm green
        line cannot appear, and the red of N₂ 1st Positive with the violet of N₂⁺ 391 nm dominates into
        magenta-violet. Caveat: this planet's magnetic field has never been measured. No exoplanetary magnetic
        field has been detected directly, and the radio star-planet interaction is tentative and may be
        stellar-flare in origin. Its tidally locked slow rotation suggests a weak dynamo while the driving star
        is powerful, so we assumed a weak field with strong driving and chose a faint, intermittent aurora. This
        is recorded as a choice that assumes the field weakly exists.
      evidence_ko: >
        채택값은 따뜻한 황토·적갈 원반이고, 직하 구름 소용돌이가 가장 밝으며, 붉게 물든 2색 대륙과 검붉은 호수,
        크림빛 야간 빙관, 그리고 플레어 때만 보이는 희미한 자적색 오로라가 얹힌다.
        확인: 표시색은 surface 행의 고유 반사색에 Proxima의 스펙트럼을 곱해 얻었고, 별빛이 붉히는 것 자체는
        물리다. 오로라 색은 조성이 잠근다. N₂ 지배에 산소가 없어 지구의 산소 557 nm 녹색선이 나오지 못하고,
        N₂ 1st Positive의 적색과 N₂⁺ 391 nm의 자색이 지배해 자적색이 된다.
        유보: 이 행성의 자기장은 측정된 적이 없다. 외계행성 자기장 직접 검출 사례가 없고, 전파로 본 항성-행성
        상호작용도 잠정이며 항성 플레어 기원일 수 있다. 조석고정된 느린 자전은 약한 다이나모를 시사하는 반면
        구동원인 별은 강력하다. 그래서 약한 장을 가정하고 강한 구동을 얹어 희미하고 간헐적인 오로라를 택했다.
        장의 존재를 약하게 가정한 선택임을 명기한다.
    refs: ["2017ApJ...844L..13G", "2012.02116", "2011Icar..213...12D", "docs/reference/hapke-shader-methodology.md"]

  - body: Proxima Cen b
    axis: magnetism.magnetic_field    # G7 — 암석 dynamo(RM22)+조석고정 penalty → 약한 장. G6서 함의된 결정 명시
    status: gated
    driver: [window-selection]
    narrative: >
      The planet's field is weak, under a third of Earth's, and whether a dynamo is running at
      all is uncertain. Two things work against it: tides hold the rotation to 11.2 days, too slow to organize a
      dynamo, and a core that has been cooling for 4.85 billion years convects feebly. Nothing here is measured.
      No exoplanet's magnetic field has been detected directly, and what has been reported is a modulation of the
      star's flares at the planet's orbital period, a trace of magnetic interaction rather than a field strength.
      What the slow rotation does decide is the field's shape: not a clean dipole with two poles, but a multipolar
      one whose surface flux breaks into patches. Aurora follows those patches down to mid-latitudes instead of
      ringing the poles, and the weak field shields poorly, which is why the atmosphere is at risk and the surface
      takes what the star throws.
    narrative_ko: >
      이 행성의 자기장은 약하다. 지구의 3분의 1에도 못 미치고, 활성 다이나모가 돌고 있는지 자체가 불확실하다. 불리한
      조건이 둘이다. 조석에 묶여 11.2일에 한 번 도는 자전은 다이나모를 조직할 만큼 빠르지 않고, 48억 년을 식은 핵은
      대류가 시들하다. 측정된 것은 없다. 외계행성의 자기장을 직접 검출한 사례가 아직 없고, 보고된 것은 이 별의
      플레어가 행성 공전 주기에 맞춰 변조된다는 사실, 즉 자기적 상호작용의 흔적일 뿐 세기가 아니다. 느린 자전이
      확실히 정하는 것은 세기가 아니라 형태다. 두 극을 가진 매끈한 쌍극자가 아니라, 표면 자속이 여러 조각으로
      갈라진 다중극이다. 그래서 오로라가 극지를 둘러싸는 대신 그 반점을 따라 중위도까지 내려오고, 약한 장은 차폐를
      제대로 못 해 대기가 위험해지고 지표는 별이 던지는 것을 그대로 받는다.
    fields:
      - name: magnetic_field
        value: "Weak (order ≤0.1-0.3× Earth, ≤ a few microtesla at the surface); whether a dynamo is active is uncertain, confidence low"
        value_ko: "약한 (차수 ≲0.1–0.3× 지구, ≲ 수 µT 표면); 활성 dynamo 여부 불확실, conf=low"
        op: set
      - { name: field_geometry, value: "Multipolar (passes the Ro_l > 0.12 gate)", value_ko: "다중극 (multipolar; Ro_l > 0.12 게이트 통과)", op: set, note: "The dipole moment collapses to 0.06×; ladder values B_eq ~1.2 µT, B_pol ~2.4 µT. Shape diagram: docs/img/field-geometry.png", note_ko: "쌍극 모멘트 0.06배 붕괴, 사다리값 B_eq ~1.2 µT·B_pol ~2.4 µT. 형태 도식 = docs/img/field-geometry.png" }
      - { name: radiation_model, value: "nearstars_proxima_b", value_ko: "nearstars_proxima_b", op: set, note: "Mercury-analog Shue, no belts. Was the stock irregular template, which is built for Mars' crustal remanent magnetism (a body with NO dynamo), and so contradicted this body's own field row. b runs an active if weak multipolar dynamo, and its standoff of 1.54 R_p is nearly Mercury's 1.45, which makes Mercury the class analog. Mercury is the one small magnetosphere with a FITTED Shue alpha (0.5, Winslow 2013, 2013JGRA..118.2213W, from MESSENGER crossings in exactly this form). pause_deform 0.1 is kept from the template and is now better grounded, not worse, because ROKerbalism gives its own mercury model the same 0.1. Still no belts. Re-gated 2026-08-16", note_ko: "수성 아날로그 Shue, 벨트 없음. 구값은 스톡 irregular 템플릿이었다. 그건 dynamo가 (없는) 화성의 잔류 지각자기용이라 이 천체 자신의 자기장 행과 모순이었다. b는 약하지만 활동하는 다중극 dynamo를 돌리고, standoff 1.54 R_p는 수성 1.45와 거의 같아 수성이 등급 아날로그다. 수성은 Shue alpha가 '피팅된' 유일한 소형 자기권이다(0.5, Winslow 2013, 2013JGRA..118.2213W, MESSENGER 통과를 바로 이 형식으로 피팅). pause_deform 0.1은 템플릿에서 유지했고 근거는 오히려 강해졌다. ROKerbalism도 자기 mercury 모델에 같은 0.1을 준다. 벨트는 여전히 없다. 2026-08-16 재게이트" }
      - { name: pause_radius, value: 1.3728, unit: R_p, op: set, note: "= nose 1.20 x the Mars-measured induced flaring ratio 1.144. Anchored on the TANGENT radius rather than the nose (owner call 2026-08-16): the boundary has to be thick enough to carry geomagnetic_offset and pause_deform without cutting through the surface, and the nose alone gives only 0.023 R_p of headroom", note_ko: "= 노즈 1.20 × 화성 실측 유도 벌어짐 비 1.144. 노즈가 아니라 접선 반경을 기준으로 잡았다(오너 결정 2026-08-16). 경계가 geomagnetic_offset 과 pause_deform 을 지표를 뚫지 않고 담을 만큼 두꺼워야 하는데, 노즈 기준으로는 여유가 0.023 R_p 뿐이다" }
      - { name: pause_compression, value: 1.144, op: set, note: "The measured flank/nose ratio of an INDUCED boundary, not a Shue alpha. Venus is 1.071 and Mars 1.144, both far flatter than the 1.414 a Shue alpha of 0.5 would give: an induced boundary hugs the body. Recording it as a Shue alpha was tried and rejected, because log2(1.144) = 0.194 is below 0.5, and a Shue tail with alpha < 0.5 pinches itself shut, contradicting the >=20 R_V induced tail Edberg 2024 measures at Venus", note_ko: "Shue alpha 가 아니라 유도 경계의 실측 플랭크/노즈 비다. 금성 1.071, 화성 1.144로 둘 다 Shue alpha 0.5 가 주는 1.414 보다 훨씬 납작하다. 유도 경계는 몸체에 붙는다. 이 값을 Shue alpha 로 기록하는 안은 시도했다가 기각했다. log2(1.144) = 0.194 는 0.5 미만이고, alpha < 0.5 인 Shue 꼬리는 스스로 닫혀서 Edberg 2024 가 금성에서 재는 20 R_V 이상의 유도 꼬리와 모순되기 때문이다" }
      - { name: pause_extension, value: 0.0076267, op: set, note: "Tail closes at 180 R_p = 150 x nose", note_ko: "꼬리는 180 R_p = 150 × 노즈 에서 닫힌다" }
      - { name: pause_height_scale, value: 1.0, op: set, note: "Axisymmetric", note_ko: "축대칭" }
      - { name: radiation_pause, value: -0.005, unit: "rad/h", op: set, note: "Half the -0.010 a dipole magnetopause carries, and the same value the stock ionosphere template gave this body. An induced boundary standing at 1.20 planetary radii screens galactic cosmic rays far less than a dipole one", note_ko: "쌍극 자기권계면이 갖는 -0.010 의 절반이며, 스톡 ionosphere 템플릿이 이 천체에 주던 값과 같다. 행성 반지름의 1.20 배에 서 있는 유도 경계는 쌍극 계면보다 은하우주선을 훨씬 덜 막는다" }
      - { name: pause_deform, value: 0.1, op: set, note: "The NON-axisymmetric multipole component, and the right home for it. Mars is the measured precedent for a multipolar field coexisting with an induced magnetosphere: crustal field patches lift the pileup boundary locally rather than displacing it globally (Crider 2002, 2002GeoRL..29.1170C; Edberg 2008, 2008JGRA..113.8206E, which finds MPB crossings over strong-crustal-field regions sit further out). Kept from the stock irregular template, which is Mars' own model", note_ko: "비축대칭 다중극 성분이고, 그 성격이 들어갈 올바른 자리다. 다중극장과 유도 자기권이 공존하는 실측 선례가 화성이다. 지각장 반점은 경계를 전역으로 밀지 않고 국소적으로 들어올린다(Crider 2002, 2002GeoRL..29.1170C. Edberg 2008, 2008JGRA..113.8206E 는 강한 지각장 영역 위의 MPB 통과가 평균적으로 더 바깥에 있음을 밝힌다). 스톡 irregular 템플릿에서 유지했고, 그건 화성 자신의 모델이다" }
      - { name: pause_smooth, value: 0.7150, unit: R_p, op: set, note: "Generalised stock pause. With smoothing on, compression re-solves to 1.0632 and the radius to 1.4300 to hold nose 1.25; the tangent/nose ratio 1.144 is unchanged. Clearance 1.036", note_ko: "⚗ 일반화 스톡 pause. 스무딩을 켜면 노즈 1.25 를 지키기 위해 compression 이 1.0632, 반지름이 1.4300 으로 다시 풀린다. 접선/노즈 비 1.144 는 그대로다. 여유 1.036" }
      - { name: pause_waist, value: 0.0, unit: R_p, op: set, note: "No waist shift. Unlike the Shue bodies, an induced boundary is not trying to reproduce a tail that flares, so there is no widest-section to move", note_ko: "⚗ 허리 이동 없음. Shue 바디와 달리 유도 경계는 벌어지는 꼬리를 재현하려는 게 아니므로 옮길 최대 단면이 없다" }
      - { name: pause_radius_smoothed, value: 1.4300, unit: R_p, op: set, note: "Pairs with pause_smooth", note_ko: "⚗ pause_smooth 와 한 짝" }
      - { name: pause_compression_smoothed, value: 1.0632, op: set, note: "Pairs with pause_smooth: re-solved so the nose lands at 1.25 under the smoothing", note_ko: "⚗ pause_smooth 와 한 짝. 스무딩 상태에서 노즈가 1.25 에 놓이도록 재산출" }
      - { name: pause_extension_smoothed, value: 0.0076305, op: set, note: "Pairs with pause_smooth. Tail 187.5 R_p = 150 x nose 1.25", note_ko: "⚗ pause_smooth 와 한 짝. 꼬리 187.5 R_p = 150 × 노즈 1.25" }
      - { name: geomagnetic_offset, value: 0.25, op: set, note: "The axisymmetric multipole (dipole plus quadrupole) component; larger than Mercury's 0.208 because the dipole dominates less here", note_ko: "축대칭 다중극(쌍극+사극) 성분; 수성 0.208보다 크다. 쌍극 지배력이 더 약하기 때문이다" }
      - { name: geomagnetic_pole_lat, value: 60, unit: deg, op: set, note: "A 30° tilt. The field is multipolar so a single pole means little, and the axis is unmeasured, so the art choice breaks the symmetry", note_ko: "기울기 30°. 다중극이라 단일 극의 의미가 약하고 축도 미측정이라 대칭을 깨는 쪽으로 art 선택" }
      - { name: magnetopause_standoff_rp, value: 1.20, unit: R_p, op: set, note: "Chapman-Ferraro: B_eq 1.2 µT against a 2000 nPa FLOOR on the ram pressure at 0.04848 AU. That floor is the 3D MHD result for this star (Garraffo 2016, 2016ApJ...833L...4G / arXiv 1609.09076: pressures more than 2000x Earth's across every orbit explored), replacing the old 170.2 nPa, which was our own extrapolation (solar 1 AU value scaled by the Wood 2001 mass-loss UPPER LIMIT and r^-2 at solar wind speed) and not a published figure. The 11.7x gap decomposes as ~2x wind speed (their model reaches 1300-1600 km/s against 800-900 for the fast solar wind) and ~6x mass flux over the Wood limit, a real tension between an astrospheric non-detection and an MHD model. The magnetopause therefore sits essentially on the surface even at the floor; holding 1.54 would need B_eq 4.11 µT, above this body's field row. Owner call 2026-08-16: adopt the floor and record the distribution", note_ko: "Chapman-Ferraro: B_eq 1.2 µT, 0.04848 AU 램압 하한 2000 nPa. 이 하한은 이 별을 직접 푼 3D MHD 결과다(Garraffo 2016, 2016ApJ...833L...4G / arXiv 1609.09076. 탐색한 모든 궤도에서 지구의 2000배 이상). 구값 170.2 nPa은 발표된 값이 아니라 우리 외삽이었다(태양 1 AU 값에 Wood 2001 질량손실 상한과 r⁻²를 태양 풍속으로 적용). 11.7배 격차는 풍속 ~2배(모델이 1300~1600 km/s, 고속 태양풍은 800~900)와 질량플럭스 ~6배로 갈라지며, 후자는 astrosphere 비검출과 MHD 모델 사이의 실재하는 긴장이다. 그래서 하한에서조차 계면이 사실상 지표에 붙는다. 1.54를 지키려면 B_eq 4.11 µT가 필요한데 이 천체의 자기장 행을 넘어선다. 오너 결정 2026-08-16: 하한 채택 + 분포 기록" }
      - { name: pause_deform_scale, value: 0.52, op: set, note: "Not consumed by the engine (stock hard-codes wavenumbers 5/7/6). At l = 4, k = l/R_mp = 2.6, i.e. 0.52× stock (4 lobes against stock's 8-11). Awaiting the KerbalismShuePause plugin", note_ko: "⚗ 엔진 미소비(스톡은 파수 5/7/6 하드코딩). l=4에서 k = l/R_mp = 2.6이라 스톡 대비 0.52배(로브 4개, 스톡은 8~11개). KerbalismShuePause 플러그인 대기" }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        A weak multipolar field (ladder value B_eq ~1.2 µT) is fixed, and whether a dynamo is active is left
        uncertain. Adopting a faint flare aurora already implied a weak field, so this row is a quantification
        with no separate art choice. Verified: computed through rocky-dynamo methodology regime 4 (RM22 with the
        tidal-locking penalty, and Driscoll & Olson 2011 for aged cooling); the giant-planet energy-flux law was
        confirmed inapplicable; and the weak field was cross-checked as consistent with the
        atmospheric-retention divergence (Garcia-Sage 2017, Garraffo 2016: even with a field, protection is hard
        against Proxima's activity), the faint aurora, and the harsh surface radiation environment of direct
        flare exposure. Caveat: there is no measurement. What has been reported is only the trace of interaction
        in the orbital-period modulation of the flares, so the strength is a methodology ladder value.
      evidence_ko: >
        약한 다중극 장(사다리값 B_eq ~1.2 µT)으로 확정하고, 활성 다이나모 여부는 불확실로 둔다. 희미한
        플레어-오로라를 채택한 순간 약한 장은 이미 함의됐으므로, 이 행은 별도 예술 선택 없는 정량화다. 확인한
        것: 암석 다이나모 방법론 regime 4(RM22 + 조석고정 penalty, 노쇠 냉각은 Driscoll & Olson 2011)로
        계산했고, 거대행성용 energy-flux 법칙은 부적용임을 확인했으며, 이 약한 장이 대기 보유의 divergence
        (Garcia-Sage 2017·Garraffo 2016: 장이 있어도 Proxima 활동성엔 보호가 어렵다), 희미한 오로라, 가혹한
        표면 방사선 환경(플레어 직격)과 서로 정합함을 교차 확인했다. 유보: 측정은 없다. 보고된 것은 플레어의
        궤도 주기 변조라는 상호작용의 흔적뿐이라, 세기는 방법론 사다리값이다.
    refs: ["2605.22925", "2203.01065"]

  - body: Proxima Cen b
    axis: environment                 # G8 — 별 측정 환경 + G7 약한장에서 도출 (radiation/wind/heliosphere)
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md", "docs/reference/surface-radiation-dose-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      The surface environment is harsh. The star flares about one and a half times a day and sends up a superflare
      roughly three times a year, and the planet takes it from 0.05 AU with little in the way of cover. Its field is
      weak and multipolar, its air a third of Earth's, so the shielding column is under a third of ours. The wind
      arrives hard for the same reason of proximity. What the planet never meets is the interstellar medium: it sits
      deep inside the star's own bubble at all times, far within a boundary that stands at 55 AU.
    narrative_ko: >
      표면 환경은 가혹하다. 별은 하루 한 번 반쯤 플레어를 터뜨리고 해마다 세 번 정도는 슈퍼플레어를 올리는데,
      행성은 0.05 AU에서 그것을 거의 가림막 없이 받는다. 자기장은 약하고 다중극이며 대기는 지구의 3분의 1이라,
      차폐 기둥이 지구의 3분의 1에도 못 미친다. 항성풍 역시 가깝다는 같은 이유로 세게 들이친다. 반면 이 행성이
      끝내 만나지 못하는 것은 성간물질이다. 55 AU에 서는 경계보다 한참 안쪽, 별의 거품 깊숙한 곳에 늘 잠겨 있다.
    fields:
      - name: radiation
        value: "Harsh (a weak magnetosphere, superflares, and a direct hit at 0.0485 AU)"
        value_ko: "가혹 (약한 자기권 + 슈퍼플레어 + 0.0485 AU 직격)"
        op: set
      - name: stellar_wind
        value: "Strong (large wind ram at close range, the driver of the Dong 2017 escape)"
        value_ko: "강함 (근접 wind ram 큼, Dong2017 escape 구동)"
        op: set
      - name: heliosphere
        value: "Deep in the astrosphere (0.0485 AU is far inside the ~55 AU standoff)"
        value_ko: "astrosphere 심부 (0.0485 AU ≪ standoff ~55 AU)"
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        The adopted values are harsh surface radiation, a strong stellar wind and deep astrospheric interior.
        All three are derived by scaling the star row's measurements with distance, with no separate art choice.
        Verified: the atmospheric column is 0.1·P/g = 286 g/cm², about 30% of the 952 for a 1 bar equivalent.
        Fed into the surface-dose recipe, between column exponents 2 and 3 it corresponds to 53–185 Gy per year,
        or 0.60–2.11 rad/h (for comparison, stock Kerbin's inner belt is 10.4 rad/h). The magnetic-field
        contribution is a weaker term than the column (dose ∝ B^-1.48), and this planet barely has even that
        weak term. The astrosphere's standard standoff is 55 AU against an orbit at 0.0485 AU, so the planet is
        always inside and interstellar material never reaches it directly. Caveat: Kerbalism has no field for
        putting a planetary surface dose in directly. radiation_surface is star-only, so the rad/h above is a
        target to check the engine's own calculation from stellar emission and magnetopause shielding against,
        not an emit value.
      evidence_ko: >
        채택값은 표면 방사선 가혹, 항성풍 강함, 항성권 심부다. 세 값 모두 별 행의 측정치를 거리로 스케일한 도출값
        이고 별도의 art 선택은 없다.
        확인: 대기 기둥은 0.1·P/g = 286 g/cm²로 1 bar 환산 952의 30% 수준이다. 표면 선량 레시피에 넣으면 기둥
        지수 2와 3 사이에서 연간 53~185 Gy, 시간당 0.60~2.11 rad에 해당한다(비교: 스톡 Kerbin 내대 10.4 rad/h).
        자기장 기여는 기둥보다 약한 항이고(dose ∝ B^-1.48), 이 행성은 그 약한 항마저 거의 없다. 항성권은
        표준 55 AU에 대해 궤도 0.0485 AU라 늘 내부이므로 성간물질 유입은 직접 닿지 않는다.
        유보: Kerbalism에는 행성 표면 선량을 직접 넣는 필드가 없다. radiation_surface는 항성 전용이라, 위 rad/h는
        엔진이 항성 방출과 자기권계면 차폐로 계산한 결과를 대조할 목표치이지 emit 값이 아니다.

  - body: Proxima Cen b
    axis: rings                       # G9 — 없음
    status: gated
    driver: [window-selection]
    narrative: "None."
    narrative_ko: "없음."
    fields:
      - name: ring_structure
        value: "none"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: "A rocky terrestrial has no rings by default. Following the principle against fabricating disks, absent a feature it stays absent."
      evidence_ko: "암석 지구형엔 고리 기본 부재. 디스크 조작 방지 원칙([[project_nearstars_ring_fabrication]])에 따라 feature 없으면 없음으로."

  - body: Proxima Cen b
    axis: satellites                  # G10 — 없음 (근접 조석환경 물리적 예외)
    status: gated
    driver: [engine, window-selection]
    narrative: "None."
    narrative_ko: "없음."
    fields:
      - name: satellite_count
        value: 0
        op: set
        note: "Hill radius 156,500 km with a prograde stability limit of 0.4895 R_H = 76,600 km (11 planetary radii), so there is room, but neither a formation route nor an observation supports one"
        note_ko: "Hill 반경 156,500 km, 순행 안정 한계 0.4895 R_H = 76,600 km(행성 반경의 11배)로 여지는 있으나 형성 근거·관측 모두 없음"
    gate:
      criterion: [stability, classification]
      verdict: pass-in-window
      evidence: >
        The adopted value is no moons. Verified: the Hill radius is a·(m_p/3M★)^⅓ = 0.0485 AU × 0.0215 ≈ 156,000
        km, the prograde stable zone is a narrow 0.3–0.5 of that, i.e. 50,000–78,000 km, and as a tidally locked
        close-in planet the stellar tides disperse such orbits on Gyr timescales. This is the physical exception
        to the variety-first principle: not an absence of evidence but a physical absence.
      evidence_ko: >
        채택값은 위성 없음이다. 확인: Hill 반경은 a·(m_p/3M★)^⅓ = 0.0485 AU × 0.0215 ≈ 156,000 km이고 순행
        안정역은 그 0.3~0.5배인 50,000~78,000 km로 좁으며, 조석고정된 근접 행성이라 항성 조석이 Gyr 규모로 그
        궤도를 흩는다. 다양성 우선 원칙의 물리적 예외에 해당한다. 증거의 부재가 아니라 물리적 부재다.
    refs: ["2006MNRAS.373.1227D"]

  - body: Proxima Cen b
    axis: gameplay                    # G11 — 착륙 가능 암석 호수 세계 (A b 거대 가스행성과 대비)
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "임무=항성간 플래그십".
      2026-08-04: 산문을 gameplay 3부 형태로 다시 썼다. evidence에 있던 오너 검토 로그(2026-06-23 7구획 확정,
      오로라대 제외, 직전 커밋 2bb8540의 무검토 작성 정정)를 여기로 옮겼다. 구획 구성과 수치는 무변경.
    status: gated
    driver: [engine]
    narrative: >
      Landing is possible, but staying is not. The field is weak and the air a third of Earth's, so flares reach the
      ground. In exchange this is the one place in the system where a craft can come down on water. The surface splits
      into seven: Substellar Point (the star fixed straight overhead) / Substellar Lakes (splashdown) / Day Lowlands
      (dark basalt) / Day Highlands (bright feldspar) / Terminator (the sun parked on the horizon) / Night Side
      (frozen rock) / Night Ice Cap (water ice at the antistellar point). The auroral belt is excluded, having no
      fixed ground. The most worthwhile of them is the substellar point, where the star hangs at one spot and the
      lakes below it steam.
    narrative_ko: >
      이 행성에는 내려앉을 수 있다. 대기를 스치는 것이 전부인 Alpha Centauri A b와 갈리는 지점이 그것이고, 여기에는
      고체 지표가 있으며 직하점에는 물 위로 내릴 자리까지 있다. 지도는 위도가 아니라 별이 얼마나 곧게 내리쬐는지로
      갈린다. 그 점에서 바깥으로 일곱 구획이다. 직하점, 그 둘레의 호수, 마픽질 주간 저지, 장석질 주간 고지, 황혼의
      명암경계선, 얼어붙은 야간면, 그리고 반대점의 물얼음 빙관이다. 가 볼 만한 곳은 직하점이다. 별이 하늘 한자리에
      붙어 꼼짝하지 않고, 그 아래 호수가 김을 올린다.
    fields:
      - name: science_biomes
        value: "Seven concentric stellar-longitude zones: substellar point / substellar lakes (splashdown) / day lowlands / day highlands / terminator / night side / night ice cap (the auroral zone is excluded)"
        value_ko: "항성경도 동심원 7구획: 직하점/직하 호수(splashdown)/주간 저지/주간 고지/명암경계선/야간면/야간 빙관 (오로라대 제외)"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        The adopted values are seven concentric stellar-longitude zones with landing and splashdown both
        possible. Verified: tidally locked with obliquity 0 there are no seasons, so latitude zoning loses its
        meaning and concentric rings around the substellar point remain. A solid surface with liquid lakes makes
        all four situations valid (landed, splashed, flying, in-space), and that is the gameplay difference from
        the surfaceless A b. The auroral zone is an appearance element rather than a fixed surface region, so it
        is excluded from the biomes. With no oxygen, atmosphereContainsOxygen is false. SOI follows
        automatically from the mass, and 0.3 bar allows atmospheric flight. Caveat: the radiation grade is high
        but Kerbalism has no planetary surface-dose field (radiation_surface is star-only). The hazard is
        computed by the engine from stellar emission and magnetopause shielding, and the comparison target is in
        the environment row.
      evidence_ko: >
        채택값은 항성경도 동심원 7구획과 착륙·splashdown 가능이다.
        확인: 조석고정에 obliquity 0이라 계절이 없으므로 위도 구획이 의미를 잃고 직하점 기준 동심원이 남는다.
        고체 표면과 액체 호수가 있어 landed·splashed·flying·in-space 네 상황이 모두 성립하고, 이것이 표면 없는
        A b와의 게임 차이다. 오로라대는 고정 표면 구역이 아니라 외형 요소이므로 biome에서 제외했다. 산소가 없어
        atmosphereContainsOxygen은 false다. SOI는 질량에서 자동으로 나오고 0.3 bar면 대기 비행이 가능하다.
        유보: 방사선 등급은 높지만 Kerbalism에 행성 표면 선량 필드가 없다(radiation_surface는 항성 전용). 해저드는
        항성 방출과 자기권계면 차폐로 엔진이 계산하며, 대조 목표치는 environment 행에 있다.

  # ════════ 행성 d (초단주기 sub-Earth, 뜨거운 무대기 수성 아날로그) — facet-walk 2026-06-23 ════════
  - body: Proxima Cen d
    axis: identity
    status: gated
    driver: [window-selection]
    provenance: >
      2026-08-07: prose modernization. Narrative rewritten to story style (EN+KO),
      evidence to the 3-part shape. The RB discovery tuple (T F F F) in evidence
      was a leftover of the discoverability layer retired 2026-07-28 and is
      dropped. No value changed.
    narrative: >
      The innermost planet, a rocky world twice the size of Mercury that circles its star in five days. What
      sets it decisively apart from Mercury is a magnetic field of some sixteen gauss, the first ever
      inferred for a rocky planet beyond the Solar System. Its star's flares erupt in step with the planet's
      orbit, as if the little world struck the star a magnetic blow on every pass.
    narrative_ko: >
      가장 안쪽 행성으로, 수성의 두 배 크기의 암석 행성이 닷새 만에 별을 한 바퀴 돈다. 수성과 결정적으로 다른
      점은 바로 16가우스에 달하는 자기장으로, 태양계 밖의 암석 행성에서 추정된 최초의 자기장이다. 플레어가
      행성의 공전 위상에 발맞춰 터져 나와, 마치 이 작은 세계가 지나갈 때마다 별을 자기적으로 두드리는 것 같다.
    fields:
      - name: body_type
        value: "Ultra-short-period sub-Earth: hot airless rock (a Mercury analog with a magnetosphere, lifeless)"
        value_ko: "초단주기 sub-Earth: 뜨거운 무대기 암석 (자기권 가진 수성형, 무생물)"
        op: set
      - name: designation
        value: "Proxima Centauri d (no proper name)"
        value_ko: "Proxima Centauri d (고유명 없음)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        The classification is fixed as an ultra-short-period sub-Earth airless rock, a Mercury type with a
        magnetosphere. Verified: the RV detection is at candidate stage (Faria 2022), the SPI-estimated polar
        field of ~16 G (Zapatero Osorio 2026) is what distinguishes it from unmagnetized Mercury, and it forms
        three extremes with b (a temperate lake world) and c (a cold mini-Neptune), confirming roster variety.
        Caveat: it is still a candidate rather than a confirmed detection.
      evidence_ko: >
        분류는 초단주기 sub-Earth 무대기 암석, 자기권을 가진 수성형으로 확정. 확인한 것: RV 검출은 후보 단계
        (Faria 2022), SPI 추정 극자기장 ~16 G(Zapatero Osorio 2026)가 무자기장 수성과의 차별 근거이고, b(온대
        호수 세계)·c(차가운 mini-Neptune)와 세 극단을 이뤄 로스터 다양성을 확인했다. 유보: 아직 확정 검출이
        아닌 candidate다.
    refs: ["2202.05188", "2605.22925"]

  - body: Proxima Cen d
    axis: orbit
    refs: ["2025A&A...700A..11S", "2022A&A...658A.115F", "docs/reference/tidal-locking-timescale-methodology.md"]
    status: gated
    driver: [window-selection]
    provenance: >
      2026-06-23: Mercury-style e=0.2 rejected (strong tides at 0.029 AU, no
      resonance to pump e); physical floor e≈0 with a seeded de-perfect at emit
      adopted instead.
      2026-08-07: prose modernization (EN+KO narrative, 3-part evidence, wiki-link
      token removed from evidence). No value changed.
    narrative: >
      It hugs the star tighter than either sibling, one lap in five days. No eccentricity has been measured;
      at this distance tides would circularize the orbit almost immediately, so a circle is the physical
      default rather than an observation. The same tides locked the spin long ago, one face holding toward
      the star forever. The planet does not transit, so how far the orbit tilts to our line of sight is
      unknown.
    narrative_ko: >
      형제 행성들보다 별을 더 바짝 끌어안고 닷새 만에 한 바퀴를 돈다. 이심률은 측정된 적이 없다. 이 거리에서는
      조석이 궤도를 거의 즉시 원으로 다듬기 때문에, 원 궤도는 관측이 아니라 물리적 기본값이다. 같은 조석이
      오래전에 자전을 묶어 한쪽 면이 영원히 별을 마주한다. 통과 현상이 관측되지 않아 궤도가 우리 시선에 얼마나
      기울었는지는 모른다.
    fields:
      - name: semi_major_axis_au
        value: 0.02885
        unit: AU
        op: set
        note: "P=5.122d"
      - name: eccentricity
        value: 0
        op: passthrough
        phase3_default: "e~0 (Faria 2022 low-amplitude RV, assumed unconstrained)"
        phase3_default_ko: "e≈0 (Faria2022 저진폭 RV, 미구속 가정)"
        note: "Physical floor e~0 (strong tides circularize at 0.029 AU). Unmeasured, so a de-perfect seed is applied at emit (upper bound ≤0.05); the concrete value is generated per system seed at emit and not recorded on the board (synthetic-orbit-noise policy rule 2). NOT baked"
        note_ko: "물리 floor e≈0 (0.029AU 강조석 원형화). 미측정이라 emit시 de-perfect seed (상한 ≲0.05); 구체값은 per-system seed로 emit 생성·보드 미기록 (synthetic-orbit-noise 정책 rule 2). NOT baked"
      - name: tidal_lock
        value: "1:1 (the a⁶ gate is near-instant); Omega/omega/M free at emit"
        value_ko: "1:1 (a⁶ 게이트 초고속); Ω/ω/M 자유 emit"
        op: set
    gate:
      criterion: [classification, stability]
      verdict: pass-in-window
      evidence: >
        a and P are measured passthrough values; e is the physical floor of ≈0 with a seeded de-perfect at emit
        (upper bound ≲0.05; per synthetic-orbit-noise policy rule 2 the concrete value is generated by emit from
        the per-system seed and only the intent is recorded on the board). Verified: the tidal-timescale
        methodology (a⁶ scaling) confirms that circularization and locking are immediate at 0.029 AU, ω_eq/n ≈
        1.015 keeps the 1:1 state, and a Mercury-like e = 0.2 is rejected for strong tides with no resonance.
        Caveat: re-verification with the multi-planet stability sim remains for emit.
      evidence_ko: >
        a·P는 측정 통과값, e는 물리 floor ≈0에 emit 단계 seeded de-perfect(상한 ≲0.05; synthetic-orbit-noise
        정책 rule 2에 따라 구체값은 per-system seed로 emit이 생성, 보드에는 의도만 기록). 확인한 것: 조석
        시간척도 방법론(a⁶ 스케일링)으로 0.029 AU에서 원형화·고정이 즉각임을 확인했고, ω_eq/n≈1.015로 1:1
        유지, 수성식 e=0.2는 강조석+공명 부재로 기각. 유보: emit 시 다행성계 stability-sim 재검증이 남아 있다.

  - body: Proxima Cen d
    axis: bulk                        # §3.2 템플릿 앵커
    body_class: tidally_locked
    refs: ["docs/reference/mass-radius-relation-methodology.md", "docs/reference/body-figure-methodology.md", "docs/reference/cassini-state-obliquity-methodology.md", "docs/reference/tidal-locking-timescale-methodology.md", "docs/reference/internal-heat-luminosity-methodology.md"]
    status: gated
    driver: [window-selection]
    provenance: >
      2026-07-12: §3.2 normalization, the trivial consequences of tidal lock
      promoted to explicit fields (rotation = orbital period, spin axis = orbit
      normal, reference_radius = radius).
      2026-07-14: figure filled from the synchronous ledger (J2 1.7e-4, C22
      5.0e-5, flattening 0.04%) and internal_heat set negligible-at-surface.
      2026-08-07: prose modernization (EN+KO narrative, 3-part evidence, dates
      moved here); verdict migrated pass-in-window -> methodology-derived
      (recipe output, matching b bulk). No value changed.
    narrative: >
      A rock less than a third of Earth's mass and about seven tenths its size, with a little over half our
      surface gravity. The mass is the radial-velocity minimum corrected for orbital inclination by
      probability, a median rather than a measurement; a world this small sits far below the boundary where
      planets keep thick envelopes, so rock is not in doubt. Tides hold the rotation to the orbit, and the
      spin axis stands almost exactly perpendicular to the orbital plane, a tilt computed as an equilibrium
      rather than assumed. The slow spin leaves the equatorial bulge far below anything the eye could see,
      and the heat still rising from the interior is too little to warm the surface. Whatever drives the
      planet's strong magnetic field was measured, not predicted: a small old world like this ought to have
      cooled past easy dynamo action long ago.
    narrative_ko: >
      지구 질량의 3분의 1이 못 되는 암석 행성이고, 크기는 지구의 7할쯤, 표면 중력은 절반을 조금 넘는다. 질량은
      시선속도가 주는 최소값에 궤도 경사를 확률로 보정한 중앙값이라 측정치는 아니다. 이만큼 작은 세계는 두꺼운
      가스 외피를 지키는 경계보다 한참 아래에 있어 암석이라는 데는 의심이 없다. 조석이 자전을 공전에 묶고 있고,
      자전축은 궤도면에 거의 정확히 수직으로 선다. 이 기울기는 가정이 아니라 평형을 계산해 얻은 값이다. 느린
      자전 탓에 적도가 부푸는 정도는 눈에 보일 수준에 한참 못 미치고, 내부에서 아직 올라오는 열도 표면을 데우기엔
      너무 적다. 다만 이 행성의 강한 자기장이 무엇으로 도는지는 예측이 아니라 관측의 몫인데, 이만큼 작고 늙은
      세계라면 진작 식어 다이너모가 멎었어야 하기 때문이다.
    fields:
      - name: mass
        value: 0.30
        unit: M_earth
        op: set
        phase3_default: "Msini 0.26 M⊕ (RV minimum mass, Faria 2022)"
        phase3_default_ko: "Msini 0.26 M⊕ (RV 최소질량, Faria2022)"
        note: "Median true mass under an isotropic prior (Msini 0.26× 1.1547)"
        note_ko: "등방 prior 중앙 진질량 (Msini 0.26×1.1547)"
      - name: radius
        value: 0.72
        unit: R_earth
        op: set
        note: "Rocky grid 0.30^0.27; g ~0.58, density ~ terrestrial rock"
        note_ko: "암석 그리드 0.30^0.27; g ~0.58, ρ ~지구형 암석"
      - name: gravity
        value: 0.58
        unit: g
        op: set
        note: "derived echo of GM/R^2"
        note_ko: "GM/R² 파생 에코"
      - name: rotation_period
        value: 5.122
        unit: d
        op: set
        note: "= orbital period (tidally locked, DB curated)"
        note_ko: "= 공전주기 (조석고정, DB curated)"
      - name: spin_axis_orientation
        value: "Offset from the orbit normal toward the Laplace pole by the Cassini ε (~0.03°), the State 1 equilibrium; azimuth de-perfected at emit"
        value_ko: "궤도 법선에서 Cassini ε(~0.03°)만큼 Laplace pole 쪽 offset (State 1 평형); 방위각 de-perfect-at-emit"
        op: set
      - name: reference_radius
        value: 4587
        unit: km
        op: set
        note: "J₂/C₂₂ reference radius = radius (0.72 R⊕)"
        note_ko: "J2/C22 기준 반경 = radius (0.72 R⊕)"
      - name: geopotential_j2
        value: 1.7e-4
        op: set
        note: "~ q_s (tidally locked and synchronous; figure ledger values.md). Visual a-c of 0.07% is below visibility, so it is gravity only"
        note_ko: "≈q_s (조석고정 동기; figure ledger values.md). visual a−c 0.07% → 가시 아래, 중력만"
      - name: geopotential_c22
        value: 5.0e-5
        op: set
        note: "= 0.30·J₂ (permanent tidal triaxiality, J₂ = 10/3·C̄₂₂)"
        note_ko: "=0.30·J₂ (영구 조석 삼축, J₂=10/3·C̄₂₂)"
      - name: flattening
        value: 4.25e-4
        op: set
        note: "= (5/2)·J₂ (0.04%, below the 2% visibility threshold, so visually a sphere)"
        note_ko: "=(5/2)·J₂ (0.04%, 가시 threshold 2% 아래 → 시각상 구)"
      - name: internal_heat
        value: "negligible (at the surface)"
        value_ko: "negligible (표면)"
        op: set
        note: "Radiogenic at or below Earth scale (an old, low-mass 0.30 M⊕ body cooled early), so the surface holds T_eff ~ T_eq (section 7). The ~16 G field is an SPI observation, though, so the dynamo follows the measurement rather than the internal-heat prediction"
        note_ko: "radiogenic ~Earth-scale 이하(노쇠 0.30 M⊕ 저질량 조기냉각), 표면 T_eff≈T_eq(§7). 단 ~16G 자기장은 SPI 관측(G7)이라 dynamo는 관측 우선(내부열 예측과 별개)"
      - name: obliquity
        value: 0
        unit: deg
        op: set
        note: "~0 = the Cassini State 1 equilibrium (computed, not assumed). |g|/α = 0.018 (Laplace-Lagrange g with the synchronous α, far below the ~1.1 resonance threshold) → ε₁ = (|g|/α)·sin I ~ 0.02-0.05° for the near-coplanar orbital inclination. No dramatic obliquity. Method: cassini-state-obliquity-methodology.md"
        note_ko: "≈0 = Cassini State 1 평형 (가정 아님·계산). |g|/α=0.018 (Laplace–Lagrange g + 동기 α, ≪ 공명 임계 ~1.1) → ε₁=(|g|/α)·sinI ≈0.02–0.05° (근접-공면 궤도 I). 극단 obliquity 없음. method=cassini-state-obliquity-methodology.md"
      - name: age
        value: 4.85
        unit: Gyr
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        Mass 0.30 M⊕ (median true mass under an isotropic prior, Msini 0.26 ×1.1547) and radius 0.72 R⊕, with
        figure, obliquity and internal heat all outputs of methodology recipes. Verified: far below the radius
        valley, so rock is certain; the radius comes from the rocky grid R∝M^0.27; the figure from the
        synchronous-rotation ledger (J₂≈q_s, C̄₂₂=0.3·J₂, f=(5/2)·J₂=0.04%, below the 2% visibility threshold);
        and the obliquity from the Cassini State 1 computation (|g|/α=0.018 ≪ the ~1.1 resonance threshold →
        ε≈0.02–0.05°). Caveat: the orbital inclination is unmeasured, so the true mass is a statistical median,
        and the closer to face-on the orbit is, the larger the real mass.
      evidence_ko: >
        질량 0.30 M⊕(등방 prior 중앙 진질량, Msini 0.26 ×1.1547)·반경 0.72 R⊕이고, figure·obliquity·내부열은
        전부 방법론 레시피 산출값. 확인한 것: radius valley 한참 아래라 암석 확정, 반경은 암석 그리드 R∝M^0.27,
        figure는 동기 자전 ledger(J₂≈q_s, C̄₂₂=0.3·J₂, f=(5/2)·J₂=0.04%로 가시 임계 2% 아래), obliquity는
        Cassini State 1 계산(|g|/α=0.018 ≪ 공명 임계 ~1.1 → ε≈0.02–0.05°). 유보: 궤도 경사가 미측정이라
        진질량은 통계 중앙값이고, face-on에 가까울수록 실제 질량은 이보다 커진다.

  - body: Proxima Cen d
    axis: atmosphere
    refs: ["docs/reference/exoplanet-atmosphere-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      None. The planet's position, its size, and its interaction with the host star cannot sustain an
      atmosphere.
    narrative_ko: >
      없음. 이 행성의 위치와 크기, 모항성과의 상호작용은 대기를 유지시키지 못한다.
    fields:
      - name: composition
        value: "Airless (bare rock; at most a thin regolith-sourced exosphere, meaningless to render)"
        value_ko: "무대기 (bare rock; 희박 표토-기원 exosphere 정도만, 렌더 무의미)"
        op: set
      - name: breathability
        value: false
        op: set
    provenance: >
      2026-06-23: airless adopted as the grounded default (owner).
      2026-08-07: prose compressed to the absence line per the c I convention;
      inline citations moved to evidence; verdict migrated pass-in-window ->
      methodology-derived (Gate 1 recipe output). No value changed.
    gate:
      criterion: [retention]
      verdict: methodology-derived
      evidence: >
        Airless is the grounded default. Verified: the planet sits below Gate 1's cosmic shoreline in the
        atmosphere methodology (Zahnle & Catling 2017), closer in and lower gravity than b, so stripping
        dominates, with 450 K substellar thermal escape on top, and the ~16 G field is no protection either
        (Garcia-Sage 2017, Garraffo 2016: a field is insufficient against Proxima's activity, and the polar
        cusps are themselves an escape route). Caveat: a regolith-sourced collisionless exosphere is possible
        but meaningless to render.
      evidence_ko: >
        무대기가 근거 있는 기본값. 확인한 것: 대기 방법론 Gate 1의 cosmic shoreline(Zahnle & Catling 2017)
        아래이고(b보다 근접·저중력이라 stripping이 압도), 직하 450 K 열탈출이 겹치며, ~16 G 자기장도 보호가
        못 된다(Garcia-Sage 2017·Garraffo 2016: Proxima 활동성엔 장이 있어도 불충분, 극 cusp가 오히려 탈출
        통로). 유보: 표토 기원의 무충돌 엑소스피어 정도는 있을 수 있으나 렌더에는 무의미하다.

  - body: Proxima Cen d
    axis: surface
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [window-selection, art-direction]
    provenance: >
      2026-07-14: albedo made numeric (0.11) and the hex colors rehomed to the
      cfg_colors_intrinsic block (reaudit hygiene).
      2026-08-03: the flat intrinsic #34302c replaced by the 2-tone
      mid-latitude #3c3833 / polar-cap ~#2a2622 after the magnetosphere
      shielding re-grounding.
      2026-08-07: prose modernization (EN+KO narrative, 3-part evidence,
      value-history phrase moved here); verdict migrated pass-in-window ->
      methodology-derived (space-weathering cascade output). No value changed.
      2026-08-07 (owner wording): narrative recast by the owner; the vague
      "frigid night" replaced with a number, ~30 K = geothermal-flux radiative
      balance (<=0.08 W/m2 -> ~34 K, lunar PSR 20-40 K anchor). The
      shielding/cusp geometry the caps rest on was written into the color
      methodology §4 (lunar swirls + Ganymede caps) the same day.
    narrative: >
      A dark basaltic surface, holding about 450 kelvin beneath the star and some 30 kelvin on the night
      hemisphere. Across the mid-latitudes the magnetic field holds the stellar wind off the ground, so the
      rock keeps a fresher, paler face than Mercury ever could, while the flare particles the field catches
      are poured onto the magnetic poles and weather them into caps of near-black brown.
    narrative_ko: >
      어두운 현무암질 표면으로, 별 아래에서는 450켈빈, 밤 반구에서는 30켈빈 남짓을 유지한다. 중위도에서는
      자기장이 항성풍을 땅에 닿기 전에 막아 주어 수성은 가져 본 적 없는 더 신선하고 밝은 표면을 지키는 반면,
      자기장이 붙잡은 플레어 입자는 자기극으로 쏟아져 그곳을 거의 흑갈색 극관으로 풍화시킨다.
    # MIGRATION-FLAG: cfg_colors_intrinsic 는 비표준 행-레벨 키로 hex 색 원문 보존 (색은 emit 말미 art-pass, typed 색필드 미분해).
    cfg_colors_intrinsic: >
      고유(중립광 기준) 반사색 — 중위도(자기권 차폐로 신선) #3c3833 · 자기극관(집중 풍화, 거의 흑갈) ~#2a2622.
      Proxima-lit 표시색은 appearance.
    fields:
      - name: surface_type
        value: "bare rock (dark basalt, two-tone: pale mid-latitudes against dark magnetic polar caps)"
        value_ko: "bare rock (어두운 현무암, 2-tone: 밝은 중위도 ↔ 어두운 자기극관)"
        op: set
      - name: surface_temperature
        value: 450
        unit: K
        op: set
        note: "Substellar (Teq ~317 K x √2, no redistribution); night hemisphere ~30 K (geothermal-flux σ-T⁴ balance). Intrinsic colors are in cfg_colors_intrinsic"
        note_ko: "직하 (Teq~317K ×√2, 무재분배); 야간 반구 ~30 K (지열 플럭스 σT⁴ 평형; 고유색은 cfg_colors_intrinsic)"
      - name: albedo
        value: 0.11
        op: set
        note: "Bond, higher than unmagnetized Mercury's ~0.088 because the magnetosphere shields the sputtering that drives space weathering (npFe0); the polar caps are locally darker"
        note_ko: "Bond, 무자기장 수성(~0.088)보다 높음, 자기권 sputtering 차폐로 우주풍화(npFe⁰) 감소; 자기극관 국소 저albedo"
    gate:
      criterion: [classification, visual-checklist]
      verdict: methodology-derived
      evidence: >
        A two-tone bare rock is fixed: fresh mid-latitude basalt (intrinsic #3c3833, Bond albedo 0.11) and
        weathered magnetic polar caps (~#2a2622). Verified: the space-weathering cascade in section 4 of the
        color and albedo methodology (Hapke 2001, Pieters 2000) was followed through the shielding effect of the
        observed ~16 G field. Shielding from stellar-wind sputtering reduces npFe⁰ production, leaving the
        surface fresher and brighter than unmagnetized Mercury (albedo ~0.088); micrometeorite gardening is
        independent of the magnetosphere and persists; and the polar channelling of the phase-locked flares
        (Zapatero Osorio 2026) grounds the polar weathering asymmetry. The observational anchors for the
        shielding and cusp geometry are section 4's lunar magnetic swirls (shielded = bright) and Ganymede's
        polar caps (a magnetosphere organizes caps). The substellar 450 K is Teq 317 K times the
        no-redistribution √2, and the ~30 K night hemisphere is the σT⁴ balance of a geothermal flux ≤0.08 W/m²
        (the same class as the measured 20–40 K in the Moon's permanently shadowed craters). The hue choice
        itself is an interesting-first art decision. Caveat: the cap boundaries and the exact colors will be
        fixed from measurement in the art pass at the end of emit.
      evidence_ko: >
        투톤 bare rock 확정. 중위도 신선 현무암(고유 #3c3833, Bond albedo 0.11)과 자기극 풍화 극관(~#2a2622).
        확인한 것: 색·albedo 방법론 §4 우주풍화 캐스케이드(Hapke 2001·Pieters 2000)로 관측 자기장 ~16 G의 차폐
        효과를 따라갔다. 항성풍 sputtering 차폐 → npFe⁰ 생성 감소 → 무자기장 수성(albedo ~0.088)보다 신선하고
        밝은 쪽, 미세운석 gardening은 자기권과 무관해 잔존, phase-lock 플레어의 극 채널링(Zapatero Osorio 2026)이
        극 풍화 비대칭의 근거. 차폐·cusp 기하의 관측 앵커는 §4의 달 자기 이상 소용돌이(차폐 = 밝음)와
        가니메데 극관(자기권이 극관을 조직). 직하 450 K는 Teq 317 K에 무재분배 √2 배율, 야간 반구 ~30 K는
        지열 플럭스 ≤0.08 W/m²의 σT⁴ 평형(달 영구음영 크레이터 실측 20–40 K와 같은 급). 색조 선택 자체는
        interesting-first 예술 결정. 유보: 극관 경계와 정확한 색은 emit 말미 art-pass에서 실측 기반으로 확정한다.

  - body: Proxima Cen d
    axis: appearance
    refs: ["docs/reference/surface-color-albedo-methodology.md", "docs/reference/hapke-shader-methodology.md"]
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: 감사 X4 — 이 행이 폐기된 단색 #34302c에서 표시색을 뽑고 있었다. surface 행(G5)이
      자기권 차폐 재근거화로 중위도 #3c3833 · 자기극관 #2a2622의 2-tone으로 대체한 뒤에도 appearance와
      base_color가 갱신되지 않아 극관이 통째로 빠져 있었다. 구값 "#34302c → Proxima-lit ~#36281a".
      Proxima-lit은 고유색에 항성 표시색 #ffcc75(정규화 1.0/0.800/0.459)를 채널 곱한 값이다. 같은 연산으로
      구 단색을 다시 계산하면 #342614가 나오므로, 기록돼 있던 ~#36281a는 순수 곱이 아닌 눈대중 값이었다.
      색 정밀화는 emit 말미 art-pass 몫이라는 정책은 그대로다.

      2026-08-07: EN+KO narrative pair added; display hex rehomed from the
      narrative and base_color field into the cfg_colors_displayed block
      (b convention). No value changed.
      2026-08-07 (owner request): terrain art-direction details folded into the
      narrative (crater saturation, subdued basalt maria, lobate scarps, crisp
      small craters, color-only caps) from
      phase4/art-direction/proxima-d-art-direction.md.
      2026-08-07: Hapke shader scalars + mean visual albedo added (hapke_terrain / hapke_scaled / hapke_porosity_k / hapke_theta / albedo_mean) per docs/reference/hapke-shader-methodology.md; K computed from the packing formula, theta anchored by analog. No prior value changed.
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      Under the red starlight the planet is a dim, warm grey-brown disk, a space-weathered Mercury
      look-alike, but two-toned rather than flat. The mid-latitudes, where the magnetic field keeps the
      ground fresh, read slightly pale; the magnetic poles, where the flare particles pour in, darken to
      near-black caps. Craters and weathering streaks mottle the face, broken here and there by faint
      volcanic plains like the lunar maria and small craters crisper than Mercury's. There is no aurora: the field is there,
      sixteen gauss of it, but there is no air to light. Beside b's ochre lake world and c's cold
      mini-Neptune it stands as the third visual extreme.
    narrative_ko: >
      붉은 별빛 아래 이 행성은 어둡고 따뜻한 회갈색 원반이고, 우주풍화된 수성을 닮았다. 다만 단색이 아니라
      투톤이다. 자기장이 지면을 신선하게 지켜 준 중위도는 상대적으로 밝게 보이고, 플레어 입자가 쏟아지는
      자기극은 거의 검은 극관으로 어두워진다. 크레이터와 풍화 줄무늬가 표면에 얼룩지고, 사이사이 달 바다와
      비슷한 은은한 화산 평지와 수성보다 또렷한 잔 크레이터가 섞인다. 오로라는 없다. 16가우스의 자기장은 있지만 빛날 대기가 없다.
      b의 황토 호수 세계, c의 차가운 미니 해왕성과 함께 시각적 세 극단을 이룬다.
    # MIGRATION-FLAG: cfg_colors_displayed 는 비표준 행-레벨 키로 프로즈+hex 원문 보존 (표시 팔레트, emit 말미 정밀화).
    cfg_colors_displayed: >
      Proxima reddening 적용 근사(§6 엔진, illuminant=별; emit서 정밀화). 중위도(자기권 차폐로 신선)
      #3c3833 → Proxima-lit ~#3c2d17 · 자기극관(집중 풍화, 거의 흑갈) #2a2622 → Proxima-lit ~#2a1e10.
      고유색은 G5 cfg_colors_intrinsic.
    fields:
      - name: base_color
        value: "Dark, warm grey-brown two-tone disk (Proxima reddening; pale mid-latitudes against near-black-brown magnetic polar caps, with craters and weathering streaks)"
        value_ko: "어두운 따뜻한 회갈 2-tone 디스크 (Proxima reddening; 밝은 중위도 ↔ 거의 흑갈 자기극관, 크레이터·풍화 줄무늬)"
        op: set
      - name: aurora
        value: "none (airless; the ~16 G field exists but there is no emitting medium)"
        value_ko: "none (무대기, ~16 G 자기장 존재하나 발광 매질 없어 불가)"
        op: set
      - name: hapke_terrain
        value: 0.95
        op: set
        note: "Between Mercury 0.88 and Luna 1.0. Magnetospheric shielding leaves the npFe0 maturity below unshielded Mercury's."
        note_ko: "수성 0.88과 달 1.0 사이. 자기권 차폐로 npFe⁰ 성숙이 무차폐 수성보다 덜하다"
      - name: hapke_scaled
        value: 2.2
        op: set
        note: "Full-disk phase behaviour (Sol's class convention)."
        note_ko: "원반 위상 거동(Sol 클래스 컨벤션)"
      - name: hapke_porosity_k
        value: 1.86
        op: set
        note: "Hapke 2008 K(φ) computed; optical-layer filling factor φ ~ 0.49 (51% porosity)."
        note_ko: "Hapke 2008 K(φ) 계산, 광학층 충전율 φ≈0.49 (51% 다공)"
      - name: hapke_theta
        value: 18
        unit: deg
        op: set
        note: "Cratered-regolith analog (Moon/Mercury 18°). A fitted parameter, so an analog choice rather than a derivation."
        note_ko: "포화 크레이터 레골리스 아날로그(달·수성 18°). 적합 파라미터라 도출이 아닌 아날로그 선택이다."
      - name: albedo_mean
        value: 0.12
        op: set
        note: "Area-weighted geometric albedo (Moon's p 0.12 / A 0.11 relation); Bond 0.11 stays on the surface row."
        note_ko: "면적가중 기하 알베도(달 p 0.12/A 0.11 관계); Bond 0.11은 surface 행"
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: >
        The adopted values carry the surface row's two-tone under Proxima's light: mid-latitudes ~#3c2d17 and
        the magnetic polar caps ~#2a1e10. Verified: the intrinsic colors are the surface row's
        magnetosphere-shielding re-grounded values (#3c3833 and #2a2622), and the displayed colors are those
        multiplied channel-wise by the star's display color #ffcc75 (the section 6 engine's host-star SED
        multiplication applied at display-color level). Airless, so with no clouds or haze the bare surface
        shows through. The terrain reading (saturated cratering, subdued basalt plains, contraction scarps, no
        fractures) follows the crater-degradation methodology and the record in
        phase4/art-direction/proxima-d-art-direction.md. Caveat: the exact hexes will be re-derived from a
        measured SED in the art pass at the end of emit.
      evidence_ko: >
        채택값은 surface 행이 정한 2-tone을 Proxima 조명 아래로 옮긴 것이다. 중위도 ~#3c2d17, 자기극관 ~#2a1e10.
        확인: 고유색은 surface 행의 자기권-차폐 재근거화 값(#3c3833 · #2a2622)이고, 표시색은 그 값에 항성
        표시색 #ffcc75를 채널 곱한 결과다(§6 엔진의 모항성 SED 곱을 표시색 수준에서 적용). 무대기라 구름과
        haze가 없어 순수 표면이 그대로 보인다.
        지형 읽기(포화 크레이터·은은한 현무암 평지·수축 단층 절벽·균열 없음)는 crater-degradation 방법론과
        phase4/art-direction/proxima-d-art-direction.md의 기록을 따른다.
        유보: 정확한 hex는 emit 말미 art-pass에서 실측 SED로 다시 뽑는다.

  - body: Proxima Cen d
    axis: magnetism.magnetic_field
    status: gated
    driver: [window-selection]
    provenance: >
      2026-06-23: the SPI observational estimate adopted over the dynamo-scaling
      weak-field expectation (owner, observation-first).
      2026-08-07: prose modernization (EN+KO narrative, 3-part evidence,
      decision date moved here). No value changed.
    narrative: >
      A polar field of roughly sixteen gauss wraps the planet, comparable to Jupiter's and dozens of times
      Earth's, the first magnetic field ever inferred for a rocky world beyond the Solar System. In theory
      this planet's dynamo should be impossible. Yet in observation the star's flares keep time with the
      planet's orbit, and the magnetic handshake needed to drive that rhythm sets the field's strength.
    narrative_ko: >
      약 16가우스의 극 자기장이 행성을 감싼다. 목성에 견줄 만하고 지구의 수십 배이며, 태양계 밖 암석 행성에서
      추정된 최초의 자기장이다. 이론상으로 이 행성은 다이나모가 존재하는 것이 불가능하다. 그러나 실제 관측에서는
      별의 플레어가 행성의 공전에 박자를 맞추고 있고, 그 리듬을 만드는 데 필요한 자기적 악수의 세기가 곧 이
      값이다.
    fields:
      - name: magnetic_field
        value: "~16 G (polar field, range 3-280 G)"
        value_ko: "~16 G (극 자기장, 범위 3–280 G)"
        op: set
        note: "Zapatero Osorio 2026 SPI estimate; the first for a rocky exoplanet. Phase-lock significance >99.8% (helicity reconnection plus Poynting flux, assuming a Mars radius)"
        note_ko: "Zapatero Osorio 2026 SPI 추정; 지구형 외계행성 최초. phase-lock >99.8% 유의 (helicity reconnection + Poynting flux, Mars 반경 가정)"
      - { name: magnetopause_standoff_rp, value: 7.517, unit: R_d, op: set, note: "Chapman-Ferraro: B_eq 800 uT (half the 16 G polar SPI estimate, since B_pol = 2 B_eq for a dipole) against 5648 nPa, the Garraffo 2016 floor scaled inward from b by r^-2. Added 2026-08-16: d had no magnetopause row at all, while the viewer preset carried a nose of 7 whose derivation did not reproduce. It does now, from the system-wide wind basis: 7.52. Field-range sensitivity is mild thanks to the sixth root, 4.30 to 19.51 R_d across the published 3-280 G", note_ko: "Chapman-Ferraro: B_eq 800 µT(SPI 극장 추정 16 G의 절반. 쌍극자는 B_pol = 2 B_eq), 램압 5648 nPa는 Garraffo 2016 하한을 b에서 r⁻²로 안쪽 환산한 값. 2026-08-16 신규: d에는 자기권계면 행이 아예 없었고, 뷰어 프리셋의 노즈 7은 도출이 재현되지 않았다. 계 전체 항성풍 기준으로 이제 재현된다(7.52). 장 범위 민감도는 6제곱근 덕에 완만하다(발표 범위 3~280 G에서 4.30~19.51 R_d)" }
      - { name: radiation_model, value: "nearstars_proxima_d", value_ko: "nearstars_proxima_d", op: set, note: "Earth-analog Shue. Owner call 2026-08-16: model d WITHOUT the Alfven-wing branch, as an ordinary super-Alfvenic wind planet. Recorded tension: d's field is known only through SPI phase-locked flares, and that signal requires sub-Alfvenic coupling, which would mean Alfven wings and no swept tail (the Ganymede and Pandora treatment). The adopted shape and the adopted evidence therefore disagree; the shape is the owner's choice", note_ko: "지구 아날로그 Shue. 오너 결정 2026-08-16: d를 알펜 날개 가지 없이, 평범한 초알펜 항성풍 행성으로 모델링한다. 기록해 두는 긴장: d의 자기장은 오직 SPI 위상고정 플레어로만 알려져 있고 그 신호는 sub-Alfvenic 결합을 요구한다. 그 결합이면 알펜 날개가 서고 끌린 꼬리가 없어야 한다(가니메데·판도라 처리). 즉 채택한 형상과 채택한 근거가 서로 어긋나며, 형상 쪽이 오너 선택이다" }
      - { name: pause_radius, value: 11.2362, unit: R_d, op: set, note: "= nose 7.517 x compression 1.4948", note_ko: "= 노즈 7.517 × comp 1.4948" }
      - { name: pause_compression, value: 1.4948, op: set, note: "= 2^alpha at alpha 0.58. Earth is the class analog rather than Mercury: d is a dipole-dominated rocky planet whose standoff lands in Earth's range, where b's landed in Mercury's", note_ko: "alpha 0.58에서 2^alpha. 등급 아날로그가 수성이 아니라 지구인 이유는, d가 쌍극자 지배 암석행성이면서 standoff가 지구 범위에 떨어지기 때문이다. b는 수성 범위에 떨어졌다" }
      - { name: pause_extension, value: 0.0099657, op: set, note: "= compression / 150. Tail closes at L = 150 x nose = 1128 R_d", note_ko: "= compression / 150. 꼬리는 L = 150 × 노즈 = 1128 R_d에서 닫힌다" }
      - { name: pause_height_scale, value: 1.0, op: set, note: "Shue is axisymmetric", note_ko: "Shue는 축대칭" }
      - { name: radiation_pause, value: -0.010, unit: "rad/h", op: set, note: "The stock-uniform magnetopause term. Unlike b, d holds a real standoff at 7.5 planetary radii, so it screens like a dipole magnetosphere", note_ko: "스톡 전반이 공유하는 자기권계면 항. b와 달리 d는 행성 반지름의 7.5배에 실제 standoff를 유지하므로 쌍극 자기권처럼 막는다" }
      - { name: pause_nose, value: 7.517, unit: R_d, op: set, note: "Shue-native", note_ko: "⚗ Shue-native" }
      - { name: pause_alpha, value: 0.58, op: set, note: "Shue-native. Earth's fitted value used as the class analogy; no fit exists for a close-in rocky planet in an M-dwarf wind", note_ko: "⚗ Shue-native. 지구 피팅값을 등급 유추로 사용. M왜성 항성풍 속 근접 암석행성에 대한 피팅은 없다" }
      - { name: pause_tail, value: 1127.5, unit: R_d, op: set, note: "Shue-native. Tail cut at 150 x nose", note_ko: "⚗ Shue-native. 꼬리 컷 = 150 × 노즈" }
      - { name: pause_smooth, value: 8.5694, unit: R_d, op: set, note: "Generalised stock pause (plugin Deliverable 1). Rounds the curvature discontinuity where the dayside scaling hands over to the nightside one; smooth = 0.5 x pause_radius is the project convention.", note_ko: "⚗ 일반화 스톡 pause(플러그인 Deliverable 1). 주간면 스케일링이 야간면으로 넘어가는 자리의 곡률 불연속을 둥글린다. smooth = 0.5 × pause_radius 는 프로젝트 관례다." }
      - { name: pause_waist, value: -8.5681, unit: R_d, op: set, note: "The widest cross-section, moved tailward. This is the single largest gain available in the stock encoding: compression pins the widest section to the body plane, while the real boundary is widest behind the planet, and waist is the only handle that moves it. Dropping compression to 1 and using waist instead cuts the residual against the Shue target from 4.581 to 2.331", note_ko: "⚗ 최대 단면을 꼬리쪽으로 옮긴다. 스톡 인코딩에서 얻을 수 있는 가장 큰 이득이다. compression 은 최대 단면을 바디 평면에 못 박는데 실제 경계의 최대폭은 행성 뒤에 있고, 그 지점을 옮길 수 있는 손잡이는 waist 뿐이다. compression 을 1 로 내리고 waist 를 쓰면 Shue 목표 대비 잔차가 4.581 에서 2.331 로 줄어든다" }
      - { name: pause_compression_smoothed, value: 1.0, op: set, note: "Pairs with pause_waist: the dayside scaling is retired entirely, because with the waist doing the work compression only gets in the way", note_ko: "⚗ pause_waist 와 한 짝. 주간면 스케일링을 통째로 버린다. waist 가 그 일을 맡으면 compression 은 방해만 된다" }
      - { name: pause_radius_smoothed, value: 17.1388, unit: R_d, op: set, note: "Pairs with pause_waist. The stock engine reads pause_radius and pause_extension but not waist or smooth, so all five move as one set or the shape breaks. Nose 7.517 and the 150 x nose tail close are preserved exactly", note_ko: "⚗ pause_waist 와 한 짝. 스톡 엔진은 pause_radius·pause_extension 은 읽지만 waist·smooth 는 안 읽으므로, 다섯 값이 한 세트로 움직이지 않으면 형상이 깨진다. 노즈 7.517 와 150×노즈 꼬리 마감은 정확히 보존된다" }
      - { name: pause_extension_smoothed, value: 0.0153309, op: set, note: "Pairs with pause_waist. Re-solved so the tail still closes at 150 x nose", note_ko: "⚗ pause_waist 와 한 짝. 꼬리가 150×노즈에서 닫히도록 다시 푼 값" }
    gate:
      criterion: [observation, derived-grounding]
      verdict: pass-in-window
      evidence: >
        The SPI-estimated polar field of ~16 G (range 3–280 G) is adopted, replacing the earlier dynamo-scaling
        weak-field expectation (dynamo doc regime 4, RM22) on observation-first grounds. Verified: the
        phase-lock significance is >99.8% (Zapatero Osorio 2026), the formulation is helicity reconnection plus
        Poynting flux (assuming a Mars radius), and 16 G at the pole is not weak against Earth's ~0.6 G or
        Jupiter's ~14 G. The phase-locked flares are d's signature, shared by the radiation and identity rows.
        Caveat: it is a model-dependent estimate with a wide 3–280 G range. The tension with the weak-field
        theory implied by tidally locked slow rotation remains; the bottom of the range, ~3 G, is what agrees
        with theory, while the central 16 G is the SPI adoption.
      evidence_ko: >
        SPI 관측 추정 극자기장 ~16 G(범위 3–280 G) 채택, 기존 dynamo-scaling 약장 추측(dynamo 문서 regime 4,
        RM22)을 관측 우선으로 대체. 확인한 것: phase-lock 유의성 >99.8%(Zapatero Osorio 2026), helicity 재결합 +
        Poynting flux 정식화(Mars 반경 가정)이고, 16 G 극장은 지구 극 ~0.6 G·목성 ~14 G와 비교해 약하지 않은
        값. phase-lock 플레어는 방사선·정체성 행이 공유하는 d의 시그니처다. 유보: 모델 의존 추정이고 범위가
        3–280 G로 넓다. 조석고정 느린 자전이 시사하는 약장 이론과의 긴장은 남는데, 범위 하단 ~3 G가 이론
        정합이고 중앙값 16 G는 SPI 채택이다.
    refs: ["2605.22925"]

  - body: Proxima Cen d
    axis: environment
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    status: gated
    driver: [window-selection]
    provenance: >
      2026-08-07: prose modernization (EN+KO narrative, 3-part evidence);
      verdict migrated pass-in-window -> methodology-derived (derived from the
      measured stellar environment via the magnetosphere-geometry recipe).
      No value changed.
    narrative: >
      The harshest radiation environment in the system. The star's flares strike the planet head-on in step
      with its orbit, and the magnetic field traps those charged particles into radiation belts of Jupiter's
      kind. So the danger fills the space around the planet, not just its ground.
    narrative_ko: >
      이 계에서 가장 가혹한 방사선 환경이다. 별의 플레어가 공전에 박자를 맞춰 행성을 정면으로 때리고, 자기장은
      그 하전입자를 붙잡아 목성형 방사선대를 이룬다. 그래서 위험은 지면만이 아니라 행성 둘레 공간까지 채운다.
    fields:
      - name: radiation
        value: "Extreme (closest orbit, direct exposure with no atmosphere, flares phase-locked to d, and trapped belts)"
        value_ko: "극심 (최근접 + 무대기 직노출 + d-phase-lock 플레어 + 포획 방사선대)"
        op: set
      - name: stellar_wind
        value: "Very strong (closest-approach ram)"
        value_ko: "매우 강 (최근접 ram)"
        op: set
      - name: heliosphere
        value: "The innermost part of the astrosphere"
        value_ko: "astrosphere 최심부"
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        Extreme radiation (the worst in the system at the surface), a very strong stellar wind and the innermost
        astrosphere are fixed. Verified: derived from the star's measured environment (the stellar environment
        row) plus direct exposure with no atmosphere plus the phase-locked flares (Zapatero Osorio 2026), and
        the magnetosphere-geometry methodology confirms that 16 G combined with the closest-in flares forms
        Jupiter-class trapped belts (the approach and orbital space are high-radiation too; with no atmosphere
        the magnetosphere's surface protection is slight, making it harsher than b). Caveat: the belt intensity
        varies greatly across the 3–280 G field-estimate range.
      evidence_ko: >
        방사선 극심(표면 기준 시스템 최악)·항성풍 매우 강·astrosphere 최심부로 확정. 확인한 것: 별의 측정 환경
        (항성 environment 행) + 무대기 직노출 + phase-lock 플레어(Zapatero Osorio 2026)에서 도출했고, 자기권
        기하 방법론으로 16 G + 최근접 플레어 조합이 목성형 포획 방사선대를 이룸을 확인했다(접근·궤도 공간도
        고방사선; 무대기라 자기권의 표면 보호는 미미, b보다 가혹). 유보: 방사선대 세기는 자기장 추정 범위
        3–280 G에 따라 크게 달라진다.

  - body: Proxima Cen d
    axis: rings
    status: gated
    driver: [window-selection]
    provenance: >
      2026-08-07: prose modernization (EN+KO absence line; wiki-link token in
      evidence replaced with plain words). Owner-confirmed. No value changed.
    narrative: "None. Nothing survives to make one this deep in the star's tide, and no observation or story asks for one."
    narrative_ko: "없음. 별의 조석이 이렇게 깊은 곳엔 고리를 이룰 것이 남지 않고, 관측도 픽션도 고리를 요구하지 않는다."
    fields:
      - name: ring_structure
        value: "none"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        No rings is fixed. Verified: a close-in hot rock has no rings by default, and under the
        search-and-verify principle against fabricating disks, absent a feature it stays absent.
      evidence_ko: >
        고리 부재 확정. 확인한 것: 극근접 뜨거운 암석은 고리 기본 부재이고, 근거 없는 디스크를 만들지 않는
        search-and-verify 원칙에 따라 feature가 없으면 없음으로 둔다.

  - body: Proxima Cen d
    axis: satellites
    status: gated
    driver: [engine, window-selection]
    provenance: >
      2026-08-07: prose modernization (EN+KO absence story; wiki-link token in
      evidence replaced with plain words, the stability numbers moved into the
      3-part evidence). Owner-confirmed. No value changed.
    narrative: >
      None. The star leaves almost no room: the zone where a moon could keep its orbit reaches barely four
      planet radii out, and the same tides that locked the planet would strip one away. Of the three planets
      this is the firmest emptiness.
    narrative_ko: >
      없음. 별이 자리를 거의 남겨 주지 않는다. 위성이 궤도를 지킬 수 있는 영역은 행성 반경의 네 배 남짓까지이고,
      행성을 잠근 그 조석이 위성마저 벗겨 간다. 세 행성 가운데 가장 단호한 빈자리다.
    fields:
      - name: satellite_count
        value: 0
        op: set
        note: "Hill radius 55,500 km with a prograde stability limit of 27,200 km, only 3.9 planetary radii, and strong stellar tides on top; physically absent"
        note_ko: "Hill 반경 55,500 km, 순행 안정 한계 27,200 km = 행성 반경의 3.9배뿐. 강한 항성 조석까지 겹쳐 물리적 부재"
    gate:
      criterion: [stability]
      verdict: pass-in-window
      evidence: >
        No moons is fixed. Verified: the Hill radius is 55,500 km with a prograde stability limit of 0.49 R_H ≈
        27,200 km (3.9 planetary radii, Domingos 2006), the same computation that validated c I, and this is the
        'physically nothing there' exception to the variety-first principle.
      evidence_ko: >
        위성 부재 확정. 확인한 것: Hill 반경 55,500 km에 순행 안정 한계 0.49 R_H ≈ 27,200 km(행성 반경 3.9배,
        Domingos 2006)로 c I를 검증한 것과 같은 계산이며, 다채로움 우선 원칙의 '물리적으로 아무것도 없음' 예외에
        해당한다.
    refs: ["2006MNRAS.373.1227D"]

  - body: Proxima Cen d
    axis: gameplay
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "항성간 플래그십 + 최근접 고방사선 착륙".
      2026-08-07: prose modernization, owner-confirmed — 3부 고정형(특별한 점 → biome 목록 →
      가장 흥미로운 곳)으로 재구성. narrative에 남아 있던 폐기 난도 구값과 은퇴한 RB 발견등급
      튜플(T F F F, 2026-07-28 discoverability 층 은퇴) 제거, ScienceValues/SOI는 evidence로.
      값 변경 없음.
    status: gated
    driver: [engine]
    narrative: >
      The question here is not how to land but when. The star's flares are locked to the planet's orbital
      phase, so radiation spikes on a schedule set by where the planet stands in its orbit, and the trapped
      belts around it mean even staying in orbit is not free. Seven biomes: the Substellar Hotspot (the
      hottest ground), Day Highlands (feldspathic uplands), Day Plains (basaltic flats), Craters (impact
      terrain), the Terminator, the Night Side (the frozen hemisphere), and the Magnetic Polar Caps
      (near-black caps carved by flare particles). The most interesting place is a polar cap: the floor of
      the particle funnel, where you stand on the footprint of the first magnetic field ever inferred for a
      rocky planet.
    narrative_ko: >
      이 세계의 문제는 어떻게 착륙하느냐가 아니라 언제 가느냐다. 별의 플레어가 행성의 공전 위상에 잠겨 있어
      방사선이 궤도 위상을 따라 주기적으로 치솟고, 행성을 두른 방사선대 때문에 궤도에 떠 있는 동안에도 피폭이
      계속 쌓인다. biome은 일곱이다. 직하 핫스팟(최고온 지점), 주간 고지(장석질 고지대), 주간 평원(현무암 평지),
      크레이터(충돌 지형), 명암경계선, 야간면(극저온 반구), 자기극 풍화관(플레어 입자가 깎은 흑갈 극관). 가장
      흥미로운 곳은 자기극 풍화관이다. 플레어 입자가 쏟아지는 깔때기의 바닥에 서서, 암석 행성 최초로 추정된
      자기장의 발자국을 밟는 자리다.
    fields:
      - name: science_biomes
        value: "Hybrid seven zones: substellar hotspot / day highlands / day plains / craters / terminator / night side / magnetic polar caps"
        value_ko: "하이브리드 7구획: 직하 핫스팟/주간 고지/주간 평원/크레이터/명암경계선/야간면/자기극 풍화관"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        The biome scheme is the hybrid seven zones (Mercury geology combined with the 1:1 thermal structure;
        owner choice 2026-06-23, adding the substellar hotspot and night side after reviewing the RSS Mercury
        3:2 case). No splashdown (no liquids), no atmospheric flight (airless, powered and ballistic only),
        breathability impossible. ScienceValues are filled throughout (landed/flying-low = ballistic/in-space;
        splashed is an inert token), and SOI follows automatically from the mass. The radiation hazard tier
        follows the environment row (inner-belt central value 5×10³ rad/h), and the cfg emit (biome map,
        ScienceValues) is batched at the end of the project.
      evidence_ko: >
        biome 스킴 = 하이브리드 7구획(수성 지질 + 1:1 열구조 결합; 2026-06-23 오너 선택, RSS 수성 3:2 사례
        확인 후 직하 핫스팟·야간면 추가). splashdown 없음(무액체), 대기비행 없음(무대기, 동력/탄도만),
        breathability 불가. ScienceValues 전체 채움(landed/flying-low=탄도/in-space; splashed=토큰 inert),
        SOI는 질량 자동. 방사선 해저드 tier는 environment 행을 따르고(내대 중앙값 5×10³ rad/h), cfg emit
        (biome map·ScienceValues)은 프로젝트 말미 일괄.

  # ════════ 행성 c (원거리 냉 mini-Neptune + Gratton 고리 + 소형 위성) — facet-walk 2026-06-23 (축별 walk) ════════
  - body: Proxima Cen c
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      This is a planet that may not exist. A radial-velocity signal at 1900 days was reported in 2020 and has never
      been confirmed; when the system was resurveyed in 2025 with a near-infrared spectrograph, whether that signal is
      even in the data came out inconclusive. Nor has it been ruled out. Taken as real it is a cold mini-Neptune of
      about eight Earth masses, holding a hydrogen-helium envelope at 40 K from 1.5 AU. Set beside temperate rocky b
      and hot mercurian d it splits the system three ways. Nothing lives there. Every value this board carries for c
      rests on assuming c is there.
    narrative_ko: >
      이 행성은 있을지도 모르는 행성이다. 2020년에 1900일 주기의 시선속도 신호로 보고됐지만 확인되지 않았고,
      2025년 근적외선 분광기로 이 계를 다시 훑었을 때도 그 신호가 데이터에 있는지 결론이 나지 않았다. 부정된 것도
      아니다. 있다고 보면 지구 질량의 여덟 배쯤 되는 차가운 미니 해왕성이고, 1.5 AU에서 수소·헬륨 외피를 두른 채
      40 K에 머문다. 온대 암석 세계인 b, 뜨거운 수성형인 d와 나란히 놓이면 이 계가 세 갈래로 갈린다. 생명은 없다.
      이 보드에서 c에 관한 모든 값은 c가 있다는 가정 위에 있다.
    fields:
      - name: body_type
        value: "Cold mini-Neptune (~8 M⊕, 1.5 AU, H/He envelope, Teq ~40 K, lifeless)"
        value_ko: "냉 mini-Neptune (~8 M⊕, 1.5 AU, H/He 외피, Teq~40K, 무생물)"
        op: set
      - name: designation
        value: "Proxima Centauri c (no proper name)"
        value_ko: "Proxima Centauri c (고유명 없음)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        The adopted reading is a cold mini-Neptune whose existence is an unconfirmed candidate. Verified: the
        only source of the signal is the 1900-day radial velocity of Damasso & Del Sordo 2020, and that remains
        the only numerical grounding. The 2025 NIRPS observations confirmed b and established d, but reached no
        conclusion on c's signal. Five years on, more precise instruments neither confirmed nor refuted it. The
        undiscovered-candidate classification is consistent with that state. Caveat: because this row declares
        the planet unconfirmed, every other c row and the moon c I hang on that assumption. If c is refuted they
        go with it.
      evidence_ko: >
        채택값은 차가운 미니 해왕성이고, 존재는 미확정 후보다.
        확인: 신호의 유일한 출처는 Damasso & Del Sordo 2020의 1900일 시선속도이고, 그 값이 지금도 유일한 수치
        근거다. 2025년 NIRPS 관측은 b를 확인하고 d의 존재를 확정했으나 c의 신호에 대해서는 결론을 내지 못했다.
        5년 뒤 더 정밀한 장비로도 확인도 부정도 되지 않았다. 미발견 후보라는 분류가 이 상태와 정합한다.
        유보: 이 행이 미확정을 선언하므로 c의 다른 모든 행과 c I 위성이 그 가정에 딸려 있다. c가 부정되면 함께
        사라진다.
    refs: ["2020SciA....6.7467D", "2025A&A...700A..11S"]

  - body: Proxima Cen c
    axis: orbit
    status: gated
    driver: [window-selection]
    narrative: >
      It circles 1.5 AU out, once every 5.2 years, on an orbit that is nearly circular. At that distance tides cannot
      hold its spin, which makes it the only freely rotating planet in the system. Nothing constrains the rotation
      period, so it is set at 27 hours, a little slower than Neptune's. The orbit's tilt to our line of sight is
      unknown as well. An astrometric attempt to pin the inclination was disputed along with the signal itself, so the
      orientation is left unset.
    narrative_ko: >
      별에서 1.5 AU 떨어져 5.2년에 한 바퀴를 돈다. 궤도는 거의 원에 가깝다. 이만큼 멀면 조석이 자전을 붙들지 못해,
      이 계에서 유일하게 자유롭게 도는 행성이 된다. 자전 주기는 관측으로 묶이지 않아 27시간으로 정했다. 해왕성보다
      조금 느린 값이다. 궤도가 우리 시선에 얼마나 기울었는지도 모른다. 천체측정으로 경사각을 잡으려는 시도가 있었지만
      그 결과는 신호 자체와 함께 반박됐고, 그래서 궤도의 배향은 정해 두지 않는다.
    fields:
      - name: semi_major_axis_au
        value: 1.5
        unit: AU
        op: passthrough
        note: "P ~1900 d (~5.2 yr); measured by Damasso 2020"
        note_ko: "P≈1900d (~5.2yr); Damasso2020 측정"
      - name: eccentricity
        value: 0.04
        op: passthrough
        note: "Measured by Damasso 2020"
        note_ko: "Damasso2020 측정"
      - name: tidal_lock
        value: "none (not tidally locked; at 1.5 AU τ_lock far exceeds the age). Inclination, Omega and omega are unmeasured and de-perfected at emit (synthetic-orbit-noise policy; the measured e 0.04 is not a noise target)"
        value_ko: "none (비조석고정, 1.5 AU → τ_lock ≫ 나이); 경사각·Ω·ω는 미측정이라 de-perfect-at-emit (synthetic-orbit-noise 정책; 측정값 e 0.04는 노이즈 대상 아님)"
        op: set
    gate:
      criterion: [classification, derived-grounding]
      verdict: pass-in-window
      evidence: >
        The adopted values are a semi-major axis of 1.5 AU, a period of 1900 days, an eccentricity of 0.04, no
        tidal lock and a 27-hour rotation. Verified: the first three pass through the Damasso & Del Sordo 2020
        measurements unchanged. Tidal locking is judged by the relation in which locking time scales as the
        sixth power of the semi-major axis, and at 1.5 AU that time far exceeds the star's age, leaving free
        rotation. The true mass is the minimum mass with the isotropic prior's median inclination of 60°
        applied, giving 8 M⊕, the same method as b and d. The astrometric inclination and mass of Kervella &
        Damasso 2020 were not adopted, as they are disputed along with the signal's subsequent refutation.
        Caveat: the 27-hour rotation is an owner choice where no observation exists. The azimuth and absolute
        orientation are unconstrained too and are set at emit.
      evidence_ko: >
        채택값은 장반경 1.5 AU, 주기 1900일, 이심률 0.04, 비조석고정, 자전 27시간이다.
        확인: 앞의 셋은 Damasso & Del Sordo 2020의 측정을 그대로 통과시킨 값이다. 조석고정 여부는 고정 시간이
        장반경의 6제곱에 비례하는 관계로 판정하며, 1.5 AU에서는 그 시간이 별의 나이를 크게 넘어 자유 자전이 남는다.
        진질량은 최소질량에 등방 prior의 중앙 경사 60°를 적용해 8 M⊕이고, b·d와 같은 방식이다. Kervella & Damasso
        2020의 천체측정 경사각과 질량은 신호 후속 반박과 함께 논쟁 대상이라 채택하지 않았다.
        유보: 자전 27시간은 관측이 없는 자리의 오너 선택이다. 방위각과 절대 배향도 미구속이라 emit에서 정한다.
    refs: ["2020SciA....6.7467D", "2003.13106", "1007.0245"]

  - body: Proxima Cen c
    axis: bulk                        # §3.2 템플릿 앵커
    body_class: free_rotator
    refs: ["docs/reference/mass-radius-relation-methodology.md", "docs/reference/body-figure-methodology.md", "docs/reference/internal-heat-luminosity-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      A mini-Neptune of eight Earth masses and about 2.7 Earth radii. At 2.2 g/cm³ its density is under half of
      Earth's, so this is not a rock but a volatile-rich body puffed out by a hydrogen-helium envelope. Surface
      gravity comes out close to Earth's. As the one freely rotating planet here its day runs 27 hours, fast enough to
      leave a mark on the gravity field if not on the visible disk. The spin axis leans 17 degrees from the orbital
      plane. Internal heat, Neptune-like, lifts the surface from 40 K into the 50s, and even so the volatiles stay
      frozen.
    narrative_ko: >
      지구 질량의 여덟 배에 반지름은 2.7배쯤 되는 미니 해왕성이다. 밀도가 지구의 절반도 안 되는 2.2 g/cm³이라,
      암석 덩어리가 아니라 수소·헬륨 외피에 부푼 휘발성 풍부한 몸이다. 표면 중력은 지구와 비슷하다. 자유롭게
      자전하는 유일한 행성이라 하루가 27시간이고, 그 속도가 눈에 보이는 원반을 일그러뜨릴 정도는 아니지만 중력에는
      새겨질 만큼 부풀린다. 자전축은 궤도면에서 17도 기울어 있다. 내부에서 올라오는 열은 해왕성만큼 있어 표면
      온도를 40 K에서 50 K대로 밀어 올리지만, 그래도 휘발성은 여전히 얼어 있다.
    fields:
      - name: mass
        value: 8
        unit: M_earth
        op: set
        phase3_default: "Msini 7 M⊕ (RV, Damasso 2020); radius unobserved (non-transiting)"
        phase3_default_ko: "Msini 7 M⊕ (RV, Damasso2020); 반경 미관측(비통과)"
        note: "Median under an isotropic prior"
        note_ko: "G2 등방중앙"
      - name: radius
        value: 2.7
        unit: R_earth
        op: set
        note: "Owner-adopted central value (band 2.5-3 R⊕, H/He envelope inflation); g ~1.1 g, density ~2.2 g/cm³, volatile-rich"
        note_ko: "오너 채택 중심값 (band 2.5–3 R⊕, H/He 외피 inflation); g ~1.1 g, 밀도 ~2.2 g/cm³ 휘발성-풍부"
      - name: gravity
        value: 1.1
        unit: g
        op: set
        note: "derived echo of GM/R^2"
        note_ko: "GM/R² 파생 에코"
      - name: reference_radius
        value: 17202
        unit: km
        op: set
        note: "J₂ reference radius = radius (2.7 R⊕)"
        note_ko: "J2 기준 반경 = radius (2.7 R⊕)"
      - name: geopotential_c22
        value: null
        na_reason: "Free rotation (not tidally locked): with no axis fixed toward the star there is no permanent tidal triaxiality"
        na_reason_ko: "자유 자전(비조석고정), 모항성 방향 고정축이 없어 영구 조석 삼축 부재"
      - name: rotation_period
        value: 27
        unit: h
        op: set
        note: "Unconstrained free rotation, an owner art choice"
        note_ko: "미구속 자유자전, 오너 art 선택"
      - name: obliquity
        value: 17
        unit: deg
        op: set
        note: "Owner art choice, 2026-07-14: the only freely rotating planet here, so it carries the axial variety (b, d and c I are all locked at 0°). The azimuth is de-perfected at emit"
        note_ko: "오너 art 2026-07-14, 유일한 자유회전 행성이라 축 다양성 부여(b/d/c I는 조석고정 0°). 방위각은 emit de-perfect"
      - name: spin_axis_orientation
        value: "Tilted 17° from the orbit normal (azimuth de-perfected at emit, synthetic-orbit-noise policy)"
        value_ko: "궤도 법선에서 17° 기움 (방위각 de-perfect-at-emit, synthetic-orbit-noise 정책)"
        op: set
      - name: geopotential_j2
        value: 8.0e-4
        op: set
        note: "Free rotation: q 6.7e-3 (P_rot 27 h) with NMoI 0.23 through Radau-Darwin → J₂ ~8e-4 (range 5e-4 to 1e-3; figure ledger)"
        note_ko: "자유회전 q 6.7e-3(P_rot 27h)·NMoI 0.23 Radau-Darwin → J₂~8e-4 (range 5e-4–1e-3; figure ledger)"
      - name: flattening
        value: 4.5e-3
        op: set
        note: "Free rotation: f = (3*J₂+q)/2 ~ 0.45%; a/c ~1.005, below the 2% visibility threshold, so gravitational J₂ only and no oblate mesh"
        note_ko: "자유회전 f=(3·J₂+q)/2 ≈0.45%; a/c~1.005 < 2% 가시 threshold → 중력 J₂만, 오블레이트 메쉬 없음"
      - name: internal_heat
        value: "T_int ~45–50 K (Neptune analog) → T_eff 40→~53 K"
        op: set
        note: "Cold mini-Neptune (section 7): insolation is so low that internal heat governs the temperature (a range, uncertain by a factor of a few). The surface still has its volatiles frozen (CH₄/N₂). Anchored on Pearl & Conrath 1991 for Neptune"
        note_ko: "cold mini-Neptune (§7), 저일사라 내부열이 온도 지배(range, factor-few 불확실). 표면은 여전히 휘발성 동결(CH₄/N₂). Pearl&Conrath1991 Neptune 앵커"
      - name: age
        value: 4.85
        unit: Gyr
        op: set
    gate:
      criterion: [derived-grounding, error-bar]
      verdict: pass-in-window
      evidence: >
        The adopted values are a mass of 8 M⊕, a radius of 2.7 R⊕, a density of 2.2 g/cm³, a 27-hour rotation,
        an obliquity of 17° and J₂ 8e-4. Verified: 8 M⊕ straddles the radius-valley boundary, but reading the
        planet as a mini-Neptune makes the probabilistic mass-radius relation the right tool rather than a
        single rocky grid, and 2.7 was taken as the center of its 2.5–3 R⊕ band. It passes the density gate as
        well: at comparable radii GJ 1214 b is 1.88, Neptune 1.64 and Uranus 1.25 g/cm³, so 2.24 is on the high
        rather than the low side for this class and corresponds to the more rock-rich half of the band (2.82 at
        R 2.5, and Neptune's 1.63 at R 3.0). J₂ comes to 8e-4 from the free-rotation parameter 6.7e-3 with the
        moment of inertia 0.23 obtained through Radau-Darwin, and the 0.45% flattening is below the 2%
        visibility threshold, so it enters gravity only and is not built as a visual mesh. Tidal triaxiality
        does not apply under free rotation. Caveat: the radius and the obliquity are owner choices where no
        observation exists. The internal heat is a Neptune analogy and carries factor-level uncertainty.
      evidence_ko: >
        채택값은 질량 8 M⊕, 반지름 2.7 R⊕, 밀도 2.2 g/cm³, 자전 27시간, obliquity 17°, J₂ 8e-4다.
        확인: 8 M⊕는 radius valley 경계에 걸리지만 미니 해왕성으로 읽으므로 단일 암석 그리드가 아니라 확률적
        질량-반경 관계가 맞는 도구이고, 그 밴드 2.5~3 R⊕의 중심으로 2.7을 잡았다. 밀도 게이트도 통과한다. 같은
        반지름대의 GJ 1214 b가 1.88, 해왕성이 1.64, 천왕성이 1.25 g/cm³이니 2.24는 이 부류에서 낮은 쪽이 아니라
        높은 쪽이고, 밴드 안에서 가장 암석에 가까운 절반에 해당한다(R 2.5면 2.82, R 3.0이면 해왕성과 같은 1.63).
        J₂는 자유 자전의 회전 파라미터 6.7e-3에 Radau-Darwin으로 얻은 관성모멘트 0.23을 적용해 8e-4이고, 편평도
        0.45%는 겉보기 임계 2% 아래라 중력에만 반영하고 시각 메쉬로는 만들지 않는다. 조석 삼축은 자유 자전이라
        해당 없음이다.
        유보: 반지름과 obliquity는 관측이 없는 자리의 오너 선택이다. 내부열은 해왕성 유추라 배수 수준의 불확도를
        갖는다.

  - body: Proxima Cen c
    axis: atmosphere
    refs: ["docs/reference/tidally-locked-temperature-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      A thick hydrogen-helium envelope that only grows denser downward. At 40 K methane freezes out by 90 K and
      nitrogen by 63 K, so hydrogen and helium are all that stay gaseous and the rest settles into ice-cloud layers
      below. How much heavier material is mixed in has never been observed, not even to an order of magnitude.
    narrative_ko: >
      수소와 헬륨으로 된 두꺼운 외피가 아래로 갈수록 짙어진다. 40 K에서는 메탄이 90 K, 질소가 63 K에서 이미
      얼어붙으므로 기체로 남는 것은 수소와 헬륨뿐이고, 나머지는 아래쪽에서 얼음 구름층을 이룬다. 무거운 원소가
      얼마나 섞였는지는 관측된 적이 없어 자릿수조차 모른다.
    fields:
      - name: composition
        value: "A thick H/He envelope (the observable upper atmosphere is H/He gas only) over deep ice-cloud layers (CH₄/N₂/NH₃/H₂O frozen out)"
        value_ko: "두꺼운 H/He 외피 (상층 관측 대기 = H/He만 기체); 심층 얼음-구름층 (CH₄/N₂/NH₃/H₂O 동결)"
        op: set
      - name: temperature
        value: 40
        unit: K
        op: set
        note: "Teq, extremely cold"
        note_ko: "Teq 극냉"
      - name: breathability
        value: false
        op: set
      - name: escape
        value: "Negligible (massive and far out, so irradiation is low)"
        value_ko: "무시 (대질량·원거리 저irradiation)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        The adopted values are a thick H/He envelope, an equilibrium temperature of 40 K and negligible escape.
        Verified: the temperature comes from the first layer of the tidally-locked temperature doc, and free
        rotation redistributes well, so it is close to uniform. Condensation was checked against each species'
        freezing point: methane at 90 K and nitrogen at 63 K are both above 40 K and cannot stay gaseous,
        leaving only hydrogen, which holds down to about 20 K. Retention follows from the gravity of 8 M⊕ and
        the low irradiation at 1.5 AU. Caveat: metallicity and methane content have no observations and are left
        order-unknown. The T/P profile will use a cold-Neptune grid at the emit stage.
      evidence_ko: >
        채택값은 두꺼운 H/He 외피, 평형온도 40 K, 탈출 무시다.
        확인: 온도는 조석고정 온도 문서의 첫 층으로 얻었고, 자유 자전이라 재분배가 좋아 균일에 가깝다. 응결 여부는
        각 종의 동결점과 대조했다. 메탄 90 K, 질소 63 K가 모두 40 K보다 높아 기체로 남지 못하고 수소만 20 K
        근처까지 버틴다. 대기 보유는 8 M⊕의 중력과 1.5 AU의 낮은 조사량에서 나온다.
        유보: 금속성과 메탄 함량은 관측이 없어 자릿수 미상으로 둔다. T/P 프로파일은 emit 단계에서 차가운 해왕성
        격자를 쓴다.

  - body: Proxima Cen c
    axis: surface
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: "None."
    narrative_ko: "없음."
    fields:
      - name: surface_type
        value: null
        na_reason: "An H/He envelope body has no surface axis. It falls outside the scope of the surface color and albedo methodology, and the visible color is carried by the appearance row"
        na_reason_ko: "H/He 외피체라 표면 축이 성립하지 않는다. 표면색·알베도 문서의 적용 범위 밖이고, 가시 색은 appearance 행이 담는다"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        The surface axis does not apply. Verified: the scope the surface color and albedo doc defines covers
        bodies with a solid surface, and an H/He envelope body falls outside it. What sets the visible color is
        the atmosphere rather than a surface, so the appearance row holds that judgement.
      evidence_ko: >
        표면 축은 해당 없음이다.
        확인: 표면색·알베도 문서가 규정하는 적용 범위는 고체 표면을 가진 천체이고, H/He 외피체는 그 밖이다.
        가시 색을 정하는 것은 표면이 아니라 대기이므로 appearance 행이 그 판단을 갖는다.

  - body: Proxima Cen c
    axis: appearance
    provenance: >
      2026-08-07: Hapke shader scalars + mean visual albedo added (hapke_terrain / hapke_scaled / hapke_porosity_k / hapke_theta / albedo_mean) per docs/reference/hapke-shader-methodology.md; K computed from the packing formula, theta anchored by analog. No prior value changed.
    refs: ["docs/reference/atmosphere-reflected-color-methodology.md", "docs/reference/hapke-shader-methodology.md"]
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      It is not Neptune-blue. Neptune's deep blue comes from gaseous methane in the upper atmosphere absorbing red,
      and Neptune is warm enough at 72 K to keep that methane gaseous. This planet sits at 40 K, in the 50s with
      internal heat, cold enough that the methane freezes out of the upper layers and nothing is left to eat the red.
      What remains is the weak blue scattering of hydrogen and helium over the near-neutral grey-white of high ice and
      haze. The disk reads pale grey-blue, a third colour beside ochre b and grey-brown d.
    narrative_ko: >
      해왕성처럼 파랗지 않다. 해왕성의 진청색은 상층의 기체 메탄이 붉은빛을 흡수해서 나오는 색인데, 그 행성은
      72 K라 메탄이 기체로 남아 있다. 여기는 40 K이고 내부열을 보태도 50 K대라 메탄이 얼어 상층에서 빠지므로,
      붉은빛을 먹을 기체가 없다. 남는 것은 수소와 헬륨의 약한 청색 산란과 고층 얼음·연무의 거의 중성한 회백이다.
      그래서 창백한 회청색 원반이 되고, 황토색인 b와 회갈색인 d 사이에서 세 번째 색을 맡는다.
    fields:
      - name: base_color
        value: "#c4d0d8 (pale grey-blue to grey-white; near-neutral with a weak Rayleigh blue)"
        value_ko: "#c4d0d8 (창백 회청/회백; 거의 중성 + 약한 Rayleigh 청)"
        op: set
      - name: clouds
        value: "H/He with high ice clouds and haze (not Neptune-blue: CH₄ condensation makes the deep-blue mechanism weak here)"
        value_ko: "H/He + 고층 얼음·haze (해왕성처럼 파랗지 않음, CH₄ 응결로 진청 메커니즘 약함)"
        op: set
      - name: hapke_terrain
        value: null
        na_reason: "No solid surface; the terrain shader does not apply (giant)."
        na_reason_ko: "고체 표면 없음. 지형 셰이더 미적용(거대행성)"
      - name: hapke_scaled
        value: 1.6
        op: set
        note: "Full-disk phase behaviour (Sol's class convention)."
        note_ko: "원반 위상 거동(Sol 클래스 컨벤션)"
      - name: hapke_porosity_k
        value: 1.8
        op: set
        note: "Hapke 2008 K(φ) computed; optical-layer filling factor φ ~ 0.47 (53% porosity)."
        note_ko: "Hapke 2008 K(φ) 계산, 광학층 충전율 φ≈0.47 (53% 다공)"
      - name: hapke_theta
        value: 10
        unit: deg
        op: set
        note: "Giant analog (Saturn/Neptune 10°). A fitted parameter, so an analog choice rather than a derivation."
        note_ko: "거대행성 아날로그(토성·해왕성 10°). 적합 파라미터라 도출이 아닌 아날로그 선택이다."
      - name: albedo_mean
        value: 0.45
        op: set
        note: "Cloud-top geometric albedo (Uranus 0.51 / Neptune 0.41 band)."
        note_ko: "구름 상부 기하 알베도(천왕성 0.51·해왕성 0.41 대역)"
    gate:
      criterion: [visual-checklist, composition-lock]
      verdict: pass-in-window
      evidence: >
        The adopted value is a pale grey-blue disk with the intrinsic color #c4d0d8. Verified: this was checked
        against Neptune, which turns deep blue because gaseous methane at 72 K absorbs red light. This planet's
        40 K is far below methane's 90 K condensation point, and even in the 50 K range with internal heat added
        it stays below, so no gas remains aloft to absorb red. The color itself was obtained through the
        atmosphere reflected-color doc's engine, combining Rayleigh scattering by hydrogen and helium with the
        weak absorption of ice hazes. Caveat: an M5.5 star at 1.5 AU makes the planet extremely dark in reality,
        but Kopernicus normalizes bodies when rendering, so that darkness does not reach the game. What this row
        fixes is the color, not the brightness.
      evidence_ko: >
        채택값은 고유색 #c4d0d8의 창백한 회청색 원반이다.
        확인: 해왕성이 72 K에서 기체 메탄으로 붉은빛을 흡수해 진청색이 되는 것과 대조했다. 이 행성의 40 K는 메탄
        응결점 90 K보다 훨씬 낮고 내부열을 더한 50 K대에서도 그 아래이므로, 상층에 붉은빛을 흡수할 기체가 남지
        않는다. 색 자체는 대기 반사색 문서의 엔진으로 수소·헬륨의 Rayleigh 산란과 얼음 연무의 약한 흡수를 합쳐
        얻었다.
        유보: 1.5 AU에 M5.5 별이라 실제로는 극도로 어둡지만, Kopernicus가 천체를 정규화해 렌더하므로 그 어두움은
        인게임에 반영되지 않는다. 이 행이 정하는 것은 밝기가 아니라 색이다.

  - body: Proxima Cen c
    axis: magnetism.magnetic_field
    status: gated
    driver: [window-selection]
    narrative: >
      The field looks like Uranus's and Neptune's. Convection in a thin conducting shell, as in those two, does not
      build a clean dipole; it builds a multipolar field with the axis strongly tilted and displaced from centre.
      Running the energy-flux recipe on this planet's own internal heat gives about 0.18 gauss at the surface, and the
      same chain reproduces Neptune to within a factor of 1.4. This is multipolar for a different reason than b: there
      rotation decides the shape, here the interior structure does. Aurora is faint, since few particles reach this
      distance to strike the field at all.
    narrative_ko: >
      자기장은 천왕성과 해왕성 쪽을 닮는다. 두 행성처럼 얇은 전도층에서 대류가 일어나면 깔끔한 쌍극자가 서지 못하고,
      축이 크게 기울고 중심에서 밀려난 다극장이 된다. 이 행성의 내부열로 에너지플럭스 레시피를 돌리면 표면에서 약
      0.18 가우스가 나오는데, 같은 사슬이 해왕성을 1.4배 안에서 재현한다. b가 느린 자전 때문에 다중극인 것과 이유가
      다르다. 여기서는 회전이 아니라 내부 구조가 형태를 정한다. 오로라는 미약하다. 자기권을 때릴 입자가 애초에 이
      거리까지 거의 오지 않는다.
    fields:
      - name: magnetic_field
        value: "~0.1-0.5 G (ice-giant analog, non-dipolar and tilted ~47-59°); confidence low"
        value_ko: "~0.1–0.5 G (빙거성 아날로그, 비쌍극·tilted ~47–59°); conf low"
        op: set
      - { name: field_geometry, value: "Tilted and offset multipolar (ice-giant type)", value_ko: "기울고 중심 이탈한 다중극 (빙거성형)", op: set, note: "Convection in a thin conducting shell. Shape diagram: docs/img/field-geometry-proxima-c.png", note_ko: "얇은 전도층 대류. 형상 도식 docs/img/field-geometry-proxima-c.png" }
      - { name: radiation_model, value: "Ice-giant type (CRAND inner belt, wind-fed outer belt, and the boundary between)", value_ko: "빙거성형 (CRAND 내대 + 항성풍 외대 + 계면)", op: set, note: "Follows the measured Uranus and Neptune, which both carry a proton inner belt and an electron outer belt. Details are in the radiation_belts row", note_ko: "실측 천왕성·해왕성이 양성자 내대와 전자 외대를 모두 가지는 것을 따른다. 상세는 radiation_belts 행" }
      - { name: geomagnetic_pole_lat, value: 40, unit: deg, op: set, note: "A 50° tilt, between Uranus' 58.6 and Neptune's 47", note_ko: "기울기 50°. 천왕성 58.6°·해왕성 47° 사이" }
      - { name: geomagnetic_offset, value: 0.4, op: set, note: "Offset from center, between Uranus' 0.3 and Neptune's 0.55", note_ko: "중심 이탈. 천왕성 0.3·해왕성 0.55 사이" }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        The adopted values are a surface field of about 0.18 G (range 0.09–0.5) with a tilted and offset
        multipolar geometry. Verified: internal heat T_int of 45–50 K gives an internal luminosity of
        8.6e14–1.3e15 W, and the energy-flux relation B_dyn = 4.8(M L²/R⁷)^(1/6) with the surface conversion
        1/(2√2) and the 0.06x multipolar collapse yields 0.17–0.20 G. The same chain gives Neptune 0.198 G, 1.4
        times the observed ~0.14 G, and Uranus 0.087 G, 0.4 times the observed ~0.23 G: for this class the order
        of magnitude holds while the factor may not. The tilted and offset geometry is what both ice giants
        share, and the shape diagram is at docs/img/field-geometry-proxima-c.png. Caveat: the dynamo doc places
        this law outside its validated domain below Neptune's mass because of helium separation. It was
        therefore used only after validating against the two ice giants first, and the result is a factor-level
        estimate. There is no observation.
      evidence_ko: >
        채택값은 표면 자기장 약 0.18 G(범위 0.09~0.5)이고 형태는 기울고 이탈한 다중극이다.
        확인: 내부열 T_int 45~50 K에서 내부 광도 8.6e14~1.3e15 W를 얻고, 에너지플럭스 관계 B_dyn = 4.8(M L²/R⁷)^(1/6)에
        표면 환산 1/(2√2)과 다중극 붕괴 0.06배를 적용해 0.17~0.20 G가 나온다. 같은 사슬로 해왕성은 0.198 G가 나와
        관측 ~0.14 G의 1.4배이고, 천왕성은 0.087 G로 관측 ~0.23 G의 0.4배다. 즉 이 부류에서 자릿수는 맞고 배수는
        틀릴 수 있다. 기울고 이탈한 형태는 두 빙거성의 공통 특징이며, 형상 도식은 docs/img/field-geometry-proxima-c.png
        에 있다.
        유보: 다이나모 문서는 해왕성 이하 질량에서 이 법칙을 헬륨 분리 때문에 적용 범위 밖으로 둔다. 그래서 두
        빙거성으로 먼저 검증한 뒤에만 썼고, 결과는 배수 수준의 추정이다. 관측은 없다.
    refs: ["docs/reference/planetary-dynamo-scaling.md"]

  - body: Proxima Cen c
    axis: magnetism.radiation_belts
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-13: 방법론 Part C 신규 절 반영. radiation_outer_gradient 2.2 → 2.15(지구 외대 아날로그),
      inner/outer compression·extension 신규 기록(1.002/0.997, 1.01/0.979. eps 0.0037·0.024).
      radiation_inner_gradient는 오너 튜닝 1.9 → 도출값 2.09(오너 결정 2026-08-13, 일관성 우선).
      방향은 원래 튜닝과 같고(스톡 3.3보다 완만) 평탄부 진입 지점이 단면 반경의 53% → 48%로 옮겨간다.
      하한(rad/d_max = 1.59)은 두 값 모두 통과하므로 강도가 깎이는 문제는 없었다.
    status: gated
    driver: [window-selection]
    narrative: >
      Two belts, filled by two different machines. Close in, cosmic rays strike the deep atmosphere and the neutrons
      they splash back decay into trapped protons, the same source that fills Earth's inner belt; here it runs harder,
      because Proxima's small astrosphere barely filters the cosmic rays and the weak field turns few of them away.
      Farther out, near three radii, sits the electron belt the stellar wind feeds, and that one is faint: the wind at
      1.5 AU carries a tenth of what Earth's magnetosphere is fed, so the belt stays well under the flux its own field
      could hold. The magnetopause that contains both stands about twelve radii out.
    narrative_ko: >
      벨트는 두 겹이고, 채우는 기계가 서로 다르다. 안쪽에서는 우주선이 깊은 대기를 때리고 튕겨 나온 중성자가 붕괴해
      양성자로 포획되는데, 지구 내대를 채우는 것과 같은 소스다. 여기서는 그것이 더 세게 돈다. 프록시마의 작은
      항성권은 우주선을 거의 거르지 못하고, 약한 자기장은 들어오는 우주선을 별로 쳐내지 못하기 때문이다. 바깥쪽
      반지름 세 배 근처에는 항성풍이 채우는 전자 벨트가 있는데 이쪽은 희미하다. 1.5 AU의 항성풍은 지구 자기권이
      받는 것의 십분의 일밖에 나르지 못해서, 벨트는 자기장이 담을 수 있는 한계에 한참 못 미친 채로 남는다. 이 둘을
      담는 자기권계면은 반지름의 열두 배쯤에 선다.
    fields:
      - { name: radiation_model, value: "nearstars_proxima_c", op: set, note: "Ice-giant type: CRAND inner belt, wind-fed outer belt, and the boundary between", note_ko: "빙거성형: CRAND 내대 + 항성풍 외대 + 계면" }
      - { name: inner_dist, value: 1.5, op: set, note: "CRAND proton belt, trapped at low L (the same place as Earth's inner belt at L ~1.5)", note_ko: "CRAND 양성자대. 저L 포획 (지구 내대 L~1.5와 같은 자리)" }
      - { name: inner_radius, value: 0.86, op: set, note: "Owner tuning. After the cut the effective equatorial span is 1.41 to 2.91 R_c", note_ko: "오너 튜닝. 컷 적용 후 유효 구간 적도 1.41~2.91 R_c" }
      - { name: inner_deform_xy, value: 0.66, op: set }
      - { name: inner_deform, value: 0.115, op: set, note: "Multipolar patchiness. Slightly over stock's 0.1 maximum, but small against the cross-section", note_ko: "다중극 얼룩짐. 스톡 최대 0.1을 약간 넘지만 단면 대비 미세" }
      - { name: inner_border_dist, value: 0.0001, op: set, note: "Spherical cut = the loss-cone D shape. The same structure as the Earth model", note_ko: "구면 컷 = 손실원뿔 D-형. 지구 모델과 같은 구조" }
      - { name: inner_border_radius, value: 1.0, op: set, note: "Equatorial cut 1.0/√0.5 = 1.41 R_c. The boundary where mirroring particles sink into the atmosphere and are lost", note_ko: "적도 컷 1.0/√0.5 = 1.41 R_c. 거울점이 대기에 잠기는 입자의 소멸 경계" }
      - { name: inner_border_deform_xy, value: 0.5, op: set }
      - { name: inner_compression, value: 1.002, op: set, note: "Derived: eps = (r_core/R_mp)^3 = 0.0037 at a core of 1.85 R_c against an 11.9 R_c nose", note_ko: "도출값. 핵심 1.85 R_c 대 nose 11.9 R_c에서 eps=(r_core/R_mp)³=0.0037" }
      - { name: inner_extension, value: 0.997, op: set, note: "Same eps against pause_extension 0.135", note_ko: "같은 eps를 pause_extension 0.135에 적용" }
      - { name: outer_dist, value: 2.8, op: set, note: "Magnetopause nose 11.9 R_c x 0.235 (the measured ratio for Uranus 0.24 and Neptune 0.23)", note_ko: "자기권계면 nose 11.9 R_c × 0.235 (실측 천왕성 0.24·해왕성 0.23의 비율)" }
      - { name: outer_radius, value: 2.5, op: set }
      - { name: outer_deform_xy, value: 0.66, op: set, note: "Ice-giant anchor (Uranus phys 0.664)", note_ko: "빙거성 앵커(천왕성 phys 0.664)" }
      - { name: outer_deform, value: 0.5, op: set, note: "Owner tuning. Multipolar patchiness. Five times stock's 0.1 maximum, but 20% against the 2.5 cross-section, so the topology holds", note_ko: "오너 튜닝. 다중극 얼룩. 스톡 최대 0.1의 5배지만 단면 2.5 대비 20%라 토폴로지 유지" }
      - { name: outer_border_dist, value: 1.54, op: set, note: "Inner carve. Follows the Earth model's border/dist ratio of 0.55", note_ko: "내측 carve. 지구 모델의 border/dist 비 0.55를 따름" }
      - { name: outer_border_radius, value: 1.42, op: set, note: "Equatorial cut ~3.6 R_c. The space between it and the inner belt (~1.4-2.9) becomes the slot", note_ko: "적도 컷 ~3.6 R_c. 내대(~1.4-2.9)와의 사이가 슬롯이 됨" }
      - { name: outer_border_deform_xy, value: 0.66, op: set }
      - { name: outer_compression, value: 1.01, op: set, note: "Derived: eps 0.024 at a core of 3.45 R_c. Small, but this is the shell that carries what asymmetry there is", note_ko: "도출값. 핵심 3.45 R_c에서 eps 0.024. 작지만 그나마 비대칭을 가지는 쪽은 이 껍질이다" }
      - { name: outer_extension, value: 0.979, op: set, note: "Same eps against pause_extension 0.135", note_ko: "같은 eps를 pause_extension 0.135에 적용" }
      - { name: pause_radius, value: 11.8394, op: set, note: "= nose 7.920 x compression 1.4948. The nose moved twice in the 2026-08-16 re-gate: alpha 0.5 to 0.58, and then the wind basis. The whole system now runs on the Garraffo 2016 MHD floor rather than our own r^-2 extrapolation from a mass-loss upper limit; both terms of the 11.7x gap (wind speed, mass flux) are global, so the same factor reaches 1.5 AU and c's ram goes 0.178 to 2.09 nPa", note_ko: "= 노즈 7.920 × comp 1.4948. 2026-08-16 재게이트에서 노즈가 두 번 움직였다. alpha 0.5→0.58, 그리고 항성풍 기준. 이제 계 전체가 질량손실 상한에서 r⁻²로 늘린 우리 외삽 대신 Garraffo 2016 MHD 하한 위에서 돈다. 11.7배 격차의 두 항(풍속·질량플럭스)이 모두 전역이라 같은 인자가 1.5 AU에도 닿고, c의 램압은 0.178에서 2.09 nPa가 된다" }
      - { name: pause_compression, value: 1.4948, op: set, note: "= 2^alpha at alpha 0.58. The ice-giant fallback settled at Earth's fitted alpha rather than the 0.5 borrowed earlier: Voyager 2 found Uranus and Neptune the emptiest magnetospheres measured (peak 2 cm-3 at Uranus, Bridge 1986; 1.4 cm-3 at Neptune, Belcher 1989), so with no Io- or Enceladus-class source their loading sits nearer Earth's than a gas giant's. An analogy, not a fit", note_ko: "alpha 0.58에서 2^alpha. 빙거성 대체값을 앞서 빌려 쓰던 0.5 대신 지구의 피팅값으로 확정했다. 보이저 2호가 천왕성·해왕성을 측정된 자기권 중 가장 비어 있는 것으로 확인했고(천왕성 피크 2 cm⁻³ Bridge 1986, 해왕성 1.4 cm⁻³ Belcher 1989), Io·엔켈라두스급 공급원이 없으니 이들의 적재량은 가스자이언트보다 지구 쪽에 가깝다. 피팅이 아니라 유추다" }
      - { name: pause_extension, value: 0.0099657, op: set, note: "= compression / 150. The tail closes at L = 150 x nose = 1791 R_c, the project convention, replacing the earlier judgement call of 125", note_ko: "= compression / 150. 꼬리는 L = 150 × 노즈 = 1791 R_c에서 닫힌다. 프로젝트 관행이며, 판단으로 정했던 구값 125를 대체한다" }
      - { name: pause_height_scale, value: 1.0, op: set, note: "The Shue shape is axisymmetric. Stock's 1.1 squeezes the meridional width by 1/1.1 and departs from Shue", note_ko: "Shue 형상은 축대칭. 스톡의 1.1은 자오면 폭을 1/1.1로 눌러 Shue와 어긋남" }
      - { name: radiation_inner, value: 8.0, unit: rad/h, op: set, note: "~0.8× Earth's inner belt 10.4. The source (unmodulated GCR plus low cutoff rigidity) exceeds Earth's, while multipolar trapping instability cuts it back", note_ko: "지구 내대 10.4의 ~0.8배. 소스(비변조 GCR+낮은 차단강성)는 지구 이상, 다중극 포획 불안정이 깎음" }
      - { name: radiation_inner_gradient, value: 2.09, op: set, note: "Derived: a CRAND proton belt with no measured profile, so it inherits Earth's inner-belt plateau fraction, the same analog that already justifies inner_dist 1.5. Supersedes an owner tuning of 1.9, which pointed the same way (softer than stock) by judgement rather than derivation", note_ko: "도출값. 측정 프로파일이 없는 CRAND 양성자대라 지구 내대의 평탄부 비율을 물려받는다. inner_dist 1.5를 정당화한 것과 같은 아날로그다. 방향은 같았으나(스톡보다 완만) 도출이 아닌 판단이었던 오너 튜닝 1.9를 대체" }
      - { name: radiation_outer, value: 1.2, unit: rad/h, op: set, note: "~1/3 of the 3.7 rad/h saturated anchor (18 µT). Source-limited by a wind pressure 0.09× Earth's; range 0.4 to 2", note_ko: "포화 앵커 3.7 rad/h(18 µT)의 ~1/3. 풍압 0.09× 지구의 소스 제한, 범위 0.4~2" }
      - { name: radiation_outer_gradient, value: 2.15, op: set, note: "Derived: no profile of its own, so it inherits Earth's outer-belt plateau fraction, the class analog for a wind-fed electron belt. The old 2.2 was the stock earth number stated explicitly", note_ko: "도출값. 자기 프로파일이 없어 항성풍이 먹이는 전자대의 등급 아날로그인 지구 외대의 평탄부 비율을 물려받는다. 구값 2.2는 스톡 earth 값을 명시한 것" }
      - { name: radiation_pause, value: -0.01, op: set }
      - { name: pause_nose, value: 7.920, op: set, note: "Shue-native (if KerbalismShuePause is adopted). = pause_radius/compression", note_ko: "⚗ Shue-native (KerbalismShuePause 채택 시). = pause_radius/compression" }
      - { name: pause_alpha, value: 0.58, op: set, note: "Shue-native. Earth's fitted alpha (Shue 1998) used as the ice-giant analogy; there is still no ice-giant fit in the literature. Justified by the Voyager 2 loading argument in the compression note", note_ko: "⚗ Shue-native. 지구 피팅값(Shue 1998)을 빙거성 유추로 사용. 빙거성 피팅 문헌은 여전히 없다. 근거는 compression 주석의 보이저 2호 적재량 논거" }
      - { name: pause_tail, value: 1188.0, op: set, note: "Shue-native. Tail cut at 150 x nose, the stated convention: every published tail extent is a spacecraft-coverage lower bound, and 150 clears the farthest of them (Jupiter, 143 r0)", note_ko: "⚗ Shue-native. 꼬리 컷 = 150 × 노즈, 명시된 관행. 발표된 꼬리 길이는 전부 탐사선 관측 하한이고, 150은 그중 가장 먼 것(목성 143 r₀)을 넘어선다" }
      - { name: pause_smooth, value: 13.6139, unit: R_c, op: set, note: "Generalised stock pause (plugin Deliverable 1). Rounds the curvature discontinuity where the dayside scaling hands over to the nightside one; smooth = 0.5 x pause_radius is the project convention.", note_ko: "⚗ 일반화 스톡 pause(플러그인 Deliverable 1). 주간면 스케일링이 야간면으로 넘어가는 자리의 곡률 불연속을 둥글린다. smooth = 0.5 × pause_radius 는 프로젝트 관례다." }
      - { name: pause_waist, value: -13.6118, unit: R_c, op: set, note: "The widest cross-section, moved tailward. This is the single largest gain available in the stock encoding: compression pins the widest section to the body plane, while the real boundary is widest behind the planet, and waist is the only handle that moves it. Dropping compression to 1 and using waist instead cuts the residual against the Shue target from 7.278 to 3.703", note_ko: "⚗ 최대 단면을 꼬리쪽으로 옮긴다. 스톡 인코딩에서 얻을 수 있는 가장 큰 이득이다. compression 은 최대 단면을 바디 평면에 못 박는데 실제 경계의 최대폭은 행성 뒤에 있고, 그 지점을 옮길 수 있는 손잡이는 waist 뿐이다. compression 을 1 로 내리고 waist 를 쓰면 Shue 목표 대비 잔차가 7.278 에서 3.703 로 줄어든다" }
      - { name: pause_compression_smoothed, value: 1.0, op: set, note: "Pairs with pause_waist: the dayside scaling is retired entirely, because with the waist doing the work compression only gets in the way", note_ko: "⚗ pause_waist 와 한 짝. 주간면 스케일링을 통째로 버린다. waist 가 그 일을 맡으면 compression 은 방해만 된다" }
      - { name: pause_radius_smoothed, value: 27.2278, unit: R_c, op: set, note: "Pairs with pause_waist. The stock engine reads pause_radius and pause_extension but not waist or smooth, so all five move as one set or the shape breaks. Nose 11.942 and the 150 x nose tail close are preserved exactly", note_ko: "⚗ pause_waist 와 한 짝. 스톡 엔진은 pause_radius·pause_extension 은 읽지만 waist·smooth 는 안 읽으므로, 다섯 값이 한 세트로 움직이지 않으면 형상이 깨진다. 노즈 11.942 와 150×노즈 꼬리 마감은 정확히 보존된다" }
      - { name: pause_extension_smoothed, value: 0.0153308, op: set, note: "Pairs with pause_waist. Re-solved so the tail still closes at 150 x nose", note_ko: "⚗ pause_waist 와 한 짝. 꼬리가 150×노즈에서 닫히도록 다시 푼 값" }
      - { name: pause_offset, value: null, na_reason: "Retired: the offset-sphere emulation cannot approximate a Shue boundary once the tail is long (40% worst residual at L = 150 x nose). The four-field stock encoding is the fallback instead.", op: set, note: "RETIRED 2026-08-16. The offset-sphere emulation of a Shue boundary only works for a short tail. Refitting it to the new nose 11.942 / alpha 0.58 / tail 1791 gives rms 2.56 and a worst residual of 10.9 R_c against curve widths of 18-29 R_c, about 40% off. Validation of the fitter: rerun against the retired nose 11.905 / alpha 0.5 / tail 125 and it reproduces the previous set (20.8 / 21.7 / 0.664 / 0.209 against the recorded 19.7 / 21.5 / 0.68 / 0.204) at rms 0.27, so the degradation is the tail length, not the fit. The four-field stock encoding above remains the fallback if KerbalismShuePause is rejected. Reproduce: scripts/refs/magnetopause_geometry.py fit_offset_emulation()", note_ko: "⚗ 2026-08-16 폐기. 구 중심 이동으로 Shue 경계를 흉내내는 방식은 꼬리가 짧을 때만 통한다. 새 노즈 11.942 / alpha 0.58 / 꼬리 1791로 다시 맞추면 rms 2.56, 최대 잔차 10.9 R_c가 나오는데 곡선 폭이 18~29 R_c이므로 약 40% 어긋난다. 피팅 검증: 폐기된 노즈 11.905 / alpha 0.5 / 꼬리 125로 돌리면 기존 세트를 재현한다(20.8 / 21.7 / 0.664 / 0.209 대 기록값 19.7 / 21.5 / 0.68 / 0.204, rms 0.27). 즉 열화의 원인은 피팅이 아니라 꼬리 길이다. KerbalismShuePause가 거부될 경우의 대체는 위의 4필드 스톡 인코딩이 그대로 맡는다. 재현: scripts/refs/magnetopause_geometry.py fit_offset_emulation()" }
      - { name: geomagnetic_pole_lat, value: 40, unit: deg, op: set, note: "A 50° tilt", note_ko: "기울기 50°" }
      - { name: geomagnetic_offset, value: 0.4, op: set }
    refs: ["docs/reference/planetary-magnetosphere-geometry-methodology.md", "docs/reference/solar-system-radiation-belts.md"]
    provenance: >
      2026-08-04 초판은 세기를 스톡 uranus/neptune cfg에 앵커해 외대 2.0 rad/h 단일 벨트로 잡았다. 같은 날 오너
      지시로 실물리 재계산: 세기는 소스-손실 레짐 콜(포화 선량앵커 3.7 rad/h × 풍압비)로 외대 1.2, CRAND 내대
      8.0을 신설, kp_limit.py로 K-P 천장 비구속 확인(n_cold 0.3~50 스윕에서 천장 6~10¹¹× 지구). 같은 날 두 벨트에
      지구 모델 구조의 border 컷 추가(내대 손실원뿔 구면 컷 적도 1.41 R_c, 외대 내측 carve). 같은 날 뷰어 오너 튜닝
      채택(inner_radius 0.86, inner_deform 0.115, outer_deform 0.5, outer_border_radius 1.42, gradient 1.9/2.2),
      pause_deform은 오너 결정으로 제거(다극 미세왜곡이 계면까지 미치는 것은 어색), 계면 플랭크를 Shue α=0.5
      실형상에 정렬(pause_radius 12.5→16.7, compression 1.05→1.4, nose 11.9 불변), Shue-native 3필드(⚗) 기록.
      같은 날 잔여 폭 불일치 원인 규명(pause_height_scale 1.1이 자오면 폭을 1/1.1로 누름) → SDF를 Shue에 완전
      정렬: radius 16.84(=nose×√2), compression 1.414, height_scale 1.0(축대칭), extension 0.135(꼬리 125 정합).
      뷰어 계면 렌더도 다이폴 틸트에서 분리(항성정렬 프레임).
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        The adopted values are a CRAND inner belt (1.5 R_c, 8.0 rad/h), a wind-fed outer belt (2.8 R_c, 1.2
        rad/h) and a magnetopause nose at 11.9 R_c. Verified: the magnetopause is the Chapman-Ferraro balance
        (0.18 G against 2.09 nPa of ram pressure at 1.5 AU → 7.92 R_c, insensitive to input error thanks to the
        sixth root). The outer belt's position uses the measured belt-to-magnetopause ratios of Uranus 0.24 and
        Neptune 0.23: 11.9 × 0.235 = 2.8 R_c. The intensities are the source-loss regime call of the
        methodology's Part B. The outer belt takes the saturated dose anchor 10.4×(18/31)^1.9 = 3.7 rad/h with a
        wind-pressure limit applied (ram pressure at 1.5 AU is about Earth's and ~900x Neptune's local value),
        giving 1.2 rad/h (range 0.4–2); the inner belt has unmodulated GCR and low magnetic cutoff rigidity
        pushing the CRAND source above Earth's while multipolar trapping instability cuts it back, giving 8.0
        rad/h, 0.8x Earth's 10.4. Both were confirmed below the K-P ceiling computed with kp_limit.py (across a
        cold-plasma sweep of 0.3–50 cm⁻³ the ceiling runs from 6x to 10¹¹x Earth's L=5 value and is never the
        binding constraint). Having an inner belt at all is the same physics as the measured Uranus and Neptune,
        which do carry proton inner belts. The inner boundaries of both belts were carved with the Earth model's
        border cut: for the inner belt a loss-cone spherical cut where mirroring particles sink into the
        atmosphere and vanish (equatorial 1.41 R_c), and for the outer belt an inner carve that opens the slot
        between them (equatorial ~3.6 R_c). The magnetopause flank was matched to Shue 1998's measured shape (α
        = 0.5, flank = nose × √2 = 16.8 R_c), aligned with compression 1.4 so the SDF and Shue-native give the
        same width. Caveat: the belt intensities are, as the methodology states, an inherently low-confidence
        regime call, and the moon c I could sweep particles from its own orbit and carve a corridor, a loss term
        that can only be added once the moon's rows are settled.
      evidence_ko: >
        채택값은 CRAND 내대(1.5 R_c, 8.0 rad/h), 항성풍 외대(2.8 R_c, 1.2 rad/h), 자기권계면 nose 11.9 R_c다.
        확인: 계면은 Chapman-Ferraro 균형(0.18 G, 1.5 AU 램압 2.09 nPa → 7.92 R_c, 6제곱근이라 입력 오차에 둔감).
        외대 위치는 실측 천왕성 0.24·해왕성 0.23의 계면 대비 비율로 11.9 × 0.235 = 2.8 R_c. 세기는 방법론 Part B의
        소스-손실 레짐 콜로 정했다. 외대는 포화 선량앵커 10.4×(18/31)^1.9 = 3.7 rad/h에 풍압 제한(1.5 AU 램압은
        지구와 비슷한 수준, 해왕성 국지값의 ~900배)을 얹어 1.2 rad/h(범위 0.4~2), 내대는 비변조 GCR과 낮은 자기 차단강성이
        CRAND 소스를 지구 이상으로 올리지만 다중극 포획 불안정이 깎아 지구 10.4의 0.8배인 8.0 rad/h. 두 값 모두
        kp_limit.py로 계산한 K-P 천장 아래임을 확인했다(냉플라스마 0.3~50 cm⁻³ 스윕에서 천장이 지구 L=5의 6배~10¹¹배로
        구속 조건이 아님). 내대를 두는 것은 실측 천왕성·해왕성이 양성자 내대를 실제로 가지는 것과 같은 물리다.
        두 벨트의 안쪽 경계는 지구 모델 구조의 border 컷으로 팠다. 내대는 거울점이 대기에 잠기는 입자가 사라지는
        손실원뿔 구면 컷(적도 1.41 R_c), 외대는 내대와의 사이 슬롯을 여는 내측 carve(적도 ~3.6 R_c)다. 계면 플랭크는
        Shue 1998의 실측 형상(α=0.5, 플랭크 = nose×√2 = 16.8 R_c)에 맞췄고, SDF와 Shue-native가 같은 폭이 되도록
        compression 1.4로 정렬했다.
        유보: 벨트 세기는 방법론이 명시하듯 본질적으로 저신뢰 레짐 콜이고, 위성 c I가 자기 궤도의 입자를 쓸어
        회랑을 팔 수 있는데 그 손실항은 위성 행이 확정된 뒤에야 넣을 수 있다.

  - body: Proxima Cen c
    axis: environment
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      The flare protons that scour b and d thin with the square of distance, and c sits thirty to fifty times farther
      out, so the same flare delivers a thousandth as many particles here. The stellar wind thins the same way: the
      ram pressure at c's orbit is about a tenth of what Earth takes from the solar wind. Proxima's astrosphere is
      smaller than the Sun's, though, and filters galactic cosmic rays poorly; what gets through is what c's
      magnetosphere catches to fill its trapped belts. So interplanetary space here is the quietest in the system,
      with the one biting exception inside a few planetary radii.
    narrative_ko: >
      b와 d를 할퀴는 플레어 양성자는 거리의 제곱으로 옅어진다. c는 그 행성들보다 별에서 30~50배 멀리 있어서, 같은
      플레어를 맞아도 도착하는 입자는 천분의 일 수준이다. 항성풍도 같은 이유로 옅어져, c 궤도의 풍압은 지구가
      태양풍에서 받는 값의 10분의 1쯤이다. 다만 프록시마의 항성권은 태양권보다 작아 은하 우주선을 거의 거르지
      못하고, 그렇게 들어온 우주선이 c의 자기권에 잡혀 포획대를 채운다. 그래서 행성간 공간은 계에서 가장
      조용하지만, 행성 반지름 몇 배 안쪽만은 예외로 문다.
    fields:
      - name: radiation
        value: "Low in interplanetary space (flare flux falls off with distance; the quietest place in the system), except inside the trapped belts (inner belt 8 rad/h)"
        value_ko: "행성간 공간 낮음 (플레어 플럭스 거리감쇄, 계에서 가장 조용); 단 자기권 포획대는 예외 (내대 8 rad/h)"
        op: set
      - name: stellar_wind
        value: "Modest (2.09 nPa of ram pressure at 1.5 AU, about the same as the solar wind at Earth; on the Garraffo 2016 MHD floor, which replaced our own r^-2 extrapolation)"
        value_ko: "보통 (1.5 AU 램압 2.09 nPa, 지구 태양풍과 비슷한 수준. 우리 r⁻² 외삽을 대체한 Garraffo 2016 MHD 하한 기준)"
        op: set
      - name: heliosphere
        value: "Deep in the astrosphere (1.5 AU is far inside the ~55 AU standoff)"
        value_ko: "astrosphere 심부 (1.5 AU ≪ standoff ~55 AU)"
        op: set
    provenance: >
      2026-08-04 스윕: 산문을 EN/KO 계약 형태로 재작성, 방사선대 실물리 재계산(내대 8 rad/h 신설)과 정합하도록
      "가장 조용"에 포획대 예외를 병기. 풍압 수치는 방사선대 행의 Chapman-Ferraro 입력과 동일값.
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        The adopted values are low interplanetary radiation, a modest stellar wind (ram pressure 2.09 nPa) and
        deep astrospheric interior. Verified: the flare particle flux is about a thousandth of b's by
        inverse-square falloff, and the ram pressure takes the solar wind's 2 nPa at 1 AU with a 0.2x mass-loss
        rate at 1.5 AU, the same input as the Chapman-Ferraro calculation in the radiation-belt row. The ~55 AU
        astrospheric standoff is carried over from the star's environment row, and the trapped-belt exception
        figures were checked against this planet's radiation-belt row. Caveat: Proxima's particle emission has
        no measurement, so this is a distance scaling of the solar SPE spectrum.
      evidence_ko: >
        채택값은 행성간 방사선 낮음, 항성풍 보통(램압 2.09 nPa), 항성권 심부다.
        확인: 플레어 입자 플럭스는 거리 제곱 감쇄로 b 대비 약 천분의 일이고, 램압은 태양풍 1 AU 2 nPa에 질량손실률
        0.2배와 거리 1.5 AU를 넣은 값으로 방사선대 행의 Chapman-Ferraro 입력과 같다. 항성권 standoff ~55 AU는 별
        environment 행의 값을 그대로 썼고, 포획대 예외 수치는 이 행성 방사선대 행과 대조했다.
        유보: 프록시마의 입자 방출은 실측이 없어 태양 SPE 스펙트럼의 거리 스케일링이다.

  - body: Proxima Cen c
    axis: rings
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      A double ring of alternating red and white bands against black space. SPHERE caught an excess of light at c
      that the planet alone struggles to explain, and a large ring system is one candidate for that excess, which is
      where this ring begins. The white bands are clean water ice and bright; the red ones are tholin-coated ice,
      like Pluto's surface. At c's 40-60 K orbit ice does not dry out by sublimation, so both materials keep. The
      bands ride separately, 24,000-32,700 km inside and 41,300-51,600 km outside, and the wide gap between them
      gives a face unlike Saturn's uniform sheet. Beyond the outer band the space is empty. The moon c I inherits the
      same tholin red, tying the planet's surroundings into one Pluto-toned palette.
    narrative_ko: >
      검은 우주를 배경으로 붉은 띠와 흰 띠가 번갈아 도는 2중 고리다. SPHERE 관측이 c 자리에서 행성만으로 설명하기
      어려운 밝기 초과를 잡았고, 대형 고리계가 그 초과를 설명하는 후보 중 하나라는 것이 이 고리의 출발점이다. 흰
      띠는 깨끗한 물얼음이라 밝고, 붉은 띠는 명왕성 표면처럼 톨린이 입혀진 얼음이다. 40~60 K의 c 궤도에서는 얼음이
      승화로 마르지 않으므로 두 재질 모두 안정하게 남는다. 두 띠는 안쪽 24,000~32,700 km와 바깥 41,300~51,600 km에
      나뉘어 돌고, 사이의 넓은 간극 덕에 토성의 균일한 시트와는 다른 얼굴이 된다. 바깥 띠를 넘어가면 빈 공간이다.
      같은 톨린 붉은색을 위성 c I가 이어받아, 이 행성 둘레는 하나의 명왕성풍 색으로 묶인다.
    fields:
      - name: ring_structure
        value: "Two bands: inner 24,000-32,700 km (~1.4-1.9 R_c) and outer 41,300-51,600 km (~2.4-3.0 R_c), with a wide gap between"
        value_ko: "2중 띠: 안쪽 24000-32700 km (~1.4-1.9 R_c) / 바깥 41300-51600 km (~2.4-3.0 R_c), 사이 큰 간극"
        op: set
      - name: ring_composition
        value: "White band = clean water ice (high albedo); red band = tholin-coated ice (KBO / Pluto style)"
        value_ko: "백띠=청정 물얼음(고albedo) + 적띠=톨린 코팅 얼음 (KBO/명왕성식)"
        op: set
      - name: ring_color
        value: "Alternating red and white stripes"
        value_ko: "적/흰 교대 줄무늬"
        op: set
    provenance: >
      2026-08-04 스윕: 산문을 EN/KO 계약 형태로 재작성(내용 무변경), refs에 디스크색·얼음 안정성 방법론 문서 추가,
      내대(1.41~2.91 R_c)와의 공간 겹침을 유보로 병기(천왕성 선례로 공존 판정). 구획·수치 무변경.
      같은 날 지구 시선 밝기 계산기(뷰어)로 Gratton 대비 정량 대조: 게이트 고리 ~7e-10 = 실측의 0.2% → "밝은 신호와
      양립" 표현을 철회하고 hook을 테마적 착상으로 명시. 전문 캐시 docs/phase3/_papers/2004.06685.md 추가.
      같은 날 확산 외곽고리(E-ring식)를 검토했다가 오너 결정으로 채택하지 않음. 고리는 밀집 2중 띠로 확정.
      2026-08-05: 위성 궤도가 4 → 6.4 R_c로 물러나며 바깥 띠 외경의 근거를 위성 shepherd에서 얼음 Roche 한계로
      교체. 구획·수치는 무변경.
    gate:
      criterion: [observation, visual-checklist]
      verdict: documented-divergence
      divergence_note: >
        Gratton's point source is tentative (the paper itself notes it could be a background source). The rings
        are an interesting-first adoption and an explicit divergence. There is tentative observational
        grounding, so this is not pure fabrication (in contrast to the ring-fabrication ban, and in the V1400
        Cen family). Avoiding a Saturn clone is the stated intent, and the double ring (separated bands) with
        red and white striping (tholin red plus clean-ice white) differentiates it from Saturn's uniform white
        sheet while keeping the theme consistent with the Pluto system. The gap position and the stripe pattern
        are art, and checking the Roche limit and ring-plane alignment at emit is recommended. The rings end
        with the dense double band and no diffuse dust layer is placed outside them: an outer layer meant to
        mimic the Gratton signal visually cannot reproduce the photometry at any thickness (see the figures
        above), so we chose not to add structure without observational grounding.
      divergence_note_ko: >
        Gratton 점광원은 잠정이다(논문이 배경원 가능성도 명시). 고리는 interesting-first 채택, 명시 발산. 잠정 관측
        근거가 있어 순수 조작 아님([[project_nearstars_ring_fabrication]] 대비, V1400 Cen 계열). 토성 클론 회피가
        명시 의도이고, 2중 고리(분리 띠) + 적/흰 줄무늬(톨린 적 + 청정 얼음 백)로 토성 균일 흰 시트와 차별, 명왕성
        위성과 테마 통일. 간극 위치·줄무늬 패턴은 art이고, emit시 로슈 한계·고리면 정합 점검 권장.
        고리는 밀집 2중 띠로 끝나고 그 바깥에 확산 먼지층은 두지 않는다. Gratton 신호를 시각적으로 흉내낼 외곽층은
        어느 두께로 잡아도 측광을 재현하지 못하므로(위 수치), 관측 근거 없는 구조를 추가하지 않는 쪽을 택했다.
      evidence: >
        The adopted values are two ice bands with alternating red and white stripes. Verified: both bands lie
        inside the ice Roche limit of ~3.3 R_c (56,700 km), and the outer band ending at 3.0 R_c is grounded in
        sitting just inside that limit (the earlier account, in which the moon shepherded the edge, was retired
        when the moon retreated to 6.4 R_c). Ice stability at 40–60 K comes from the sublimation lifetimes in
        the ice-stability doc, and the color from the Mie synthesis in the disk-color doc (clean water ice from
        Warren & Brandt 2008 plus tholin optical constants from Khare 1984). The hook was checked against the
        excess-brightness passage in the body of Gratton 2020. Caveat: the ring bands overlap the inner belt
        (equatorial 1.41–2.91 R_c) and could sweep out trapped particles, but the measured Uranus is the
        precedent for narrow rings coexisting with a proton inner belt, so this is treated as a corridor.
        Quantitatively, moreover, these rings do not explain the Gratton excess: by Gratton's c = φAr²/(4d²) the
        gated rings' reflected contrast is ~7e-10, 0.2% of the measured (3.5±2.0)e-7, and even a face-on ring
        filling the Roche zone reaches only 4% (if the measurement is real it would need a Fomalhaut b class
        dust cloud). The hook is a thematic idea, not a photometric explanation.
      evidence_ko: >
        채택값은 2중 얼음 띠와 적/흰 교대 줄무늬다.
        확인: 두 띠 모두 얼음 Roche 한계 ~3.3 R_c(56,700 km) 안쪽에 있고, 바깥 띠가 3.0 R_c에서 끝나는 것도 그
        한계 바로 안쪽이라는 사실이 근거다(위성이 가장자리를 붙잡는다는 초기 설명은 위성이 6.4 R_c로 물러나며 폐기). 40~60 K에서의 얼음 안정은 얼음 안정성
        문서의 승화 수명으로, 색은 디스크색 문서의 Mie 합성(청정 물얼음 Warren&Brandt 2008 + 톨린 Khare 1984 광학상수)
        으로 얻었다. hook은 Gratton 2020 본문의 밝기 초과 대목과 대조했다.
        유보: 고리 띠가 내대(적도 1.41~2.91 R_c)와 겹쳐 포획 입자를 쓸어낼 수 있으나, 실측 천왕성이 좁은 고리와
        양성자 내대를 공존시키는 선례라 회랑 수준으로 본다. 또한 정량으로는 이 고리가 Gratton 밝기 초과를 설명하지
        못한다. Gratton 식 c = φAr²/(4d²)로 게이트 고리의 반사 대비는 ~7e-10, 실측 (3.5±2.0)e-7의 0.2%이고 Roche를
        채운 정면 고리조차 4%다(실측이 실재라면 포말하우트 b급 먼지구름 규모가 필요). hook은 테마적 착상이지 측광
        설명이 아니다.
    refs: ["2004.06685", "docs/reference/debris-disk-color-methodology.md", "docs/reference/ice-stability-methodology.md"]

  - body: Proxima Cen c
    axis: satellites
    status: gated
    driver: [fiction, engine]
    narrative: >
      One moon, 652 km across, orbiting deep inside the room this planet has for one. Nothing has been observed here;
      the moon is invented, and the reason it is allowed is that at 1.5 AU the planet's gravitational reach extends
      nine million kilometres, so a satellite at a hundred and ten thousand is holding onto its parent about as
      firmly as anything in a planetary system can. The inner planets could not host one: they orbit close enough to
      the star that the same reach shrinks to almost nothing. The moon is named by the convention for a body with no
      name of its own, the parent's designation and a numeral.
    narrative_ko: >
      위성 하나, 지름 652 km이고, 이 행성이 위성에게 내줄 수 있는 공간의 아주 안쪽을 돈다. 여기서 관측된 것은
      아무것도 없다. 이 위성은 지어낸 것이고, 그것이 허용되는 이유는 1.5 AU에서 행성의 중력이 미치는 범위가
      900만 km까지 뻗기 때문이다. 11만 km에 있는 위성은 행성계에서 위성이 모행성을 붙들 수 있는 가장 단단한 축에
      든다. 안쪽 행성들은 이런 위성을 가질 수 없다. 별에 가까이 붙어 있어 같은 범위가 거의 남지 않기 때문이다.
      이름은 고유명이 없는 천체의 관례를 따라 모행성 기호에 숫자를 붙였다.
    fields:
      - name: satellite_count
        value: 1
        op: set
      - name: satellites
        value: "Proxima Cen c I (no proper name, 652 km across, water ice with radiolytic tholin, tidally locked to c)"
        value_ko: "Proxima Cen c I (고유명 없음, 지름 652 km, 물얼음 + 방사분해 톨린, c에 조석고정)"
        op: set
        note: "The eleven detailed axes live in its own body block"
        note_ko: "세부 11축은 별도 바디 블록"
      - name: hill_radius
        value: 9.05e6
        unit: km
        op: set
        note: "a(M_p/3M★)^(1/3), a 1.5 AU · M_p 8 M⊕ · M★ 0.1221 M☉"
      - name: satellite_stability_limit
        value: 4.43e6
        unit: km
        op: set
        note: "Prograde circular limit 0.4895 R_H (Domingos 2006). c I's 110,000 km sits at 2.5% of that limit"
        note_ko: "순행 원궤도 0.4895 R_H (Domingos 2006). c I의 11만 km는 이 한계의 2.5%"
    provenance: >
      2026-06-23: 오너가 다양성을 위해 픽션 위성 1개를 결정. 당시 반경 ~950 km, 명왕성 아날로그.
      2026-08-05: c I 세부 워크 결과를 반영해 지름 652 km·카론 아날로그로 갱신하고, 비어 있던 evidence와
      typed fields를 채웠다. Hill 반경과 안정 한계를 수치로 박아 "안정 위성 가능"이라는 종전의 말뿐인 근거를
      검증 가능한 형태로 바꿨다.
    gate:
      criterion: [fiction, stability, hill-stability]
      verdict: owner-override
      evidence: >
        The adopted value is one fictional moon, and this row is the honesty record of that decision. Verified:
        there is zero observational grounding. Since c is itself an unconfirmed candidate, no data suggesting a
        moon could exist; this is an owner invention for variety. What was verified is only that it is not
        physically impossible. The Hill radius is a(M_p/3M★)^(1/3) = 9.05e6 km, and the stability limit for a
        prograde circular moon is 0.4895 of that, 4.43e6 km (Domingos 2006). c I's orbit at 1.1e5 km is only
        2.5% of that limit, leaving a very large stability margin. Applying the same computation to b and d
        gives smaller Hill radii because they are closer to the star, so placing a moon only at c follows that
        difference rather than taste. Caveat: the N-body verification has not been run yet. With a single moon
        at 2.5% of the stability limit there is little room for the result to overturn, but confirming it with
        the stability sim before emit is the remaining step.
      evidence_ko: >
        채택값은 픽션 위성 1개이고, 이 행은 그 결정의 정직성 기록이다.
        확인: 관측 근거는 0이다. c 자체가 확정되지 않은 후보 행성이므로 위성을 시사하는 자료는 존재할 수 없고,
        이것은 오너가 다양성을 위해 넣은 창작이다. 물리적으로 불가능하지 않다는 것만 확인했다. Hill 반경은
        a(M_p/3M★)^(1/3)로 905만 km이고, 순행 원궤도 위성의 안정 한계는 그 0.4895배인 443만 km다(Domingos 2006).
        c I의 궤도 11만 km는 그 한계의 2.5%에 불과해 안정 여유가 매우 크다. 같은 계산을 b와 d에 적용하면 별에
        가까워 Hill 반경이 작아지므로, 위성을 c에만 둔 것은 자의가 아니라 이 차이를 따른 결과다.
        유보: N-body 검증은 아직 돌리지 않았다. 위성이 하나뿐이고 궤도가 안정 한계의 2.5%라 결과가 뒤집힐 여지는
        작지만, emit 전에 stability-sim으로 확인하는 것이 남은 절차다.
    refs: ["2006MNRAS.373.1227D", "docs/reference/tidal-locking-timescale-methodology.md"]

  - body: Proxima Cen c
    axis: gameplay
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "항성간 플래그십 + 시스템 최외곽(1.5 AU 도달 부담), 냉·dim".
      2026-08-04: 산문을 gameplay 3부 형태(특별한 점 → 바이옴 목록 → 명소)로 다시 썼다. evidence의
      오너 검토 로그를 여기로 옮겼고, c의 존재가 미확정이라는 유보를 evidence에 추가했다. 구획·수치 무변경.
    status: gated
    driver: [engine]
    narrative: >
      There is no solid surface, so landing is out and only atmospheric flight and orbit are available. The science
      map splits into five: Equatorial / North
      Temperate / South Temperate / North Polar / South Polar. Being the only freely rotating planet here, its zones
      follow latitude rather than the angle to the star. The ring shadow and the moon are excluded, neither being
      fixed ground. The most worthwhile is the equatorial belt at ring plane, where the double ring folds edge-on into
      a single bright line and its shadow falls straight down.
    narrative_ko: >
      내려앉을 땅이 없으니 이곳은 지나며 날고 둘레를 도는 행성이고, 그럼에도 찾아갈 값어치는 하늘에 있다. 붉은 띠와
      흰 띠로 된 2중 고리, 그리고 제 위성이 걸려 있다. 이 계에서 유일하게 자유롭게 자전하는 행성이라 지도도 보통
      세계처럼 위도로 갈린다. 적도대, 남북의 온대 띠, 남북의 극지, 모두 다섯이다. 그 띠들을 가로질러 훑고 가는 고리
      그림자는 별도의 구역이 아니라 볼거리이고, 위성도 그렇다. 그중 백미는 고리면의 적도대다. 고리가 옆에서 보여
      한 줄기 밝은 선으로 접히고, 그림자가 곧게 내리꽂힌다.
    fields:
      - name: science_biomes
        value: "Five latitude bands: equatorial / north temperate / south temperate / north polar / south polar (the ring-shadow band is excluded)"
        value_ko: "위도 5띠: 적도대/북온대/남온대/북극/남극 (고리 그림자대 제외)"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        The adopted values are five latitude bands and no landing. Verified: under free rotation it is latitude
        rather than the angle toward the star that divides the climate, so the opposite scheme to the
        stellar-longitude rings of the tidally locked b and d is correct. With no solid surface only flying and
        in-space are valid, and the landed and splashed tokens are inert. The ring shadow band and the moon are
        not fixed surface regions, so they are excluded from the biomes and kept as visual and exploration
        features. SOI follows automatically from the mass. Caveat: the planet's existence itself is unconfirmed,
        so this zoning also rests on the assumption that c is there.
      evidence_ko: >
        채택값은 위도 5띠와 착륙 불가다.
        확인: 자유 자전이라 별을 향한 각도가 아니라 위도가 기후를 가르므로, 조석고정된 b·d의 항성경도 동심원과
        반대 방식이 맞다. 고체 표면이 없어 flying·in-space만 성립하고 landed·splashed 토큰은 비활성이다. 고리
        그림자대와 위성은 고정된 표면 구역이 아니므로 biome에서 빼고 시각·탐사 피처로 둔다. SOI는 질량에서
        자동으로 나온다.
        유보: 이 행성의 존재 자체가 확정되지 않았다. 그러니 이 구획도 c가 있다는 가정 위에 있다.

