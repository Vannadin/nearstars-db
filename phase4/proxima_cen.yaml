      시트와 정반대). 색=적/흰 교대 줄무늬다. 백띠=청정 물얼음(고albedo), 적띠=톨린 코팅 얼음(KBO/명왕성식 냉-처리,
      위성 Proxima c I의 명왕성 테마와 통일). c ~40–60K라 얼음 안정, Gratton 밝은 신호와 양립(청정 얼음 백띠가 밝음).
      규모: 두 띠 모두 얼음 Roche(~3.3 R_c=56,700 km) 안쪽이고, 안 띠 ~1.4–1.9 R_c(24,000–32,700 km) · 바깥 띠
      ~2.4–3.0 R_c(41,300–51,600 km). 색 합성=디스크색 문서 Mie(물얼음 + 톨린 n,k), faithful/vivid 변종.
    fields:
