      evidence: >
        rationale: 오너 결정 2026-06-23 (a)로 진질량 등방중앙 8 M⊕ 채택. Kervella&Damasso2020(arXiv:2003.13106) 천체측정
        경사각/질량은 논쟁적(신호 후속 반박)이라 비채택, caveat 병기. c 존재 자체가 disputed candidate라 "있다는 가정
        하" 진행. 자전주기 ~27h는 미구속 자유자전의 오너 art 선택(해왕성형보다 약간 느림). 1.5 AU 비잠김은 locking 문서 a⁶로 확정.

        paper: 진질량 등방 = Ho&Turner2011(1007.0245). 경사각 논쟁 = Kervella&Damasso2020(2003.13106). 비잠김 =
