      evidence: >
        owner_review: 2026-06-23 오너 검토·선택으로 biome 스킴 C(하이브리드) 채택. RSS 수성(지질+크레이터+극, 3:2라 항성경도
        미사용) 확인 후, d는 1:1 고정이라 수성 지질 + 영구 day/night 열구조를 결합(직하 핫스팟·야간면 추가). 무대기라 b의
        호수/빙관/구름 biome은 없음.

        note: 무대기·무액체가 b(호수세계, splashdown·대기비행)와의 핵심 게임 차이다. d는 수성형 진공 착륙. radiation 극심=G8
        derived. cfg emit(biome map·ScienceValues·ResearchBodies)는 프로젝트 말미 일괄.

