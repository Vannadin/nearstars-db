  - body: Proxima Cen c I
    axis: gameplay
    status: gated
    driver: [engine]
    narrative: >
      The reason to come here is the sky rather than the ground. The moon keeps one face to the planet, so from the
      near side the planet hangs fixed at eighteen degrees across, thirty-five times the width of Earth's Moon, with
      the double ring edge-on beneath it as a single bright line, and it never moves. Gravity is a sixtieth of
      Earth's, which makes landing forgiving and walking useless. The map divides into four: Trailing Hemisphere,
      Leading Hemisphere, Sub-planet Patch and Ray Craters. Land on the Sub-planet Patch, the bright ring-ice ground
      directly beneath the planet.
    narrative_ko: >
      여기 오는 이유는 땅이 아니라 하늘이다. 위성이 행성을 향해 한쪽 면만 보이므로, 그쪽 반구에서는 행성이 18도
      너비로 하늘에 걸린 채 움직이지 않는다. 지구에서 보는 달의 서른다섯 배이고, 그 아래로 2중 고리가 측면으로 누워
      밝은 한 줄을 긋는다. 중력은 지구의 60분의 1이라 착륙은 너그럽지만 걷는 것은 소용없다. 지도는 넷으로 갈린다.
      후행 반구(Trailing Hemisphere, 벨트에 그을린 녹빛 적화지) / 선행 반구(Leading Hemisphere, 손 덜 탄 회백 얼음)
      / sub-c 얼음 얼룩(Sub-planet Patch, 고리에서 내려앉은 밝은 신선 얼음) / 광선 크레이터(Ray Craters, 젊은
      충돌구가 뿌린 밝은 줄기). 내려앉을 곳은 sub-c 얼음 얼룩이다. 행성이 바로 머리 위에 붙박여 있다.
    fields:
      - name: science_biomes
        value: "Four zones: trailing-hemisphere reddened terrain / leading hemisphere / sub-c ice patches / ray craters"
        value_ko: "4구획: 후행 반구 적화지 / 선행 반구 / sub-c 얼음 얼룩 / 광선 크레이터"
        op: set
      - name: landing
        value: "Possible (solid ice surface, g 0.146 m/s²). No splashdown and no atmospheric flight"
        value_ko: "가능 (고체 얼음 표면, g 0.146 m/s²). 물 착수·대기비행 없음"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: set
    provenance: >
      2026-06-23: 4구획을 위도 기반으로 잡았다(적도 톨린대 / 중위도 / 극 N₂ 빙관 / sub-c eyeball).
      2026-08-05: 표면 결정이 바뀌며 재작성. 대기 철회로 청색 haze 관람 요소를 뺐고, 중력 표기를 0.5 → 0.146 m/s²로
      고쳤으며, 방사선 해저드를 "시스템 최저"에서 벨트 노출로 정정했다. 구획은 위도가 아니라 반구 구조를 따르므로
      적도대·극관 대신 후행/선행 반구와 광선 크레이터로 바뀌었다. 난도 등급은 SPEC §0의 difficulty facet 보류를
      따라 적지 않는다.
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        The adopted values are four science zones and landing possible. Verified: the zones carry over the
        terrain units the surface row defined. The trailing-hemisphere reddening is the face the belt plasma
        overtakes and strikes, and the sub-c ice patches are the face held toward the planet by tidal locking,
        so both have boundaries fixed on the ground. The ray craters are a unit that follows from the
        crater-saturation verdict: with no relaxation, the bright streaks of young impacts are never erased. The
        planet's apparent size of 18 degrees was computed at the 6.4 R_c orbit. Caveat: the orbit sits inside
        the belt, so the surface dose runs to several rad per hour and EVA duration becomes a real constraint.
        That figure lives in the environment row.
      evidence_ko: >
        채택값은 과학 구획 4개와 착륙 가능이다.
        확인: 구획은 표면 행이 정한 지형 단위를 그대로 옮겼다. 후행 반구 적화는 벨트 플라스마가 위성을 추월해 때리는
        면이고, sub-c 얼음 얼룩은 조석고정으로 행성을 향해 고정된 면이라 둘 다 지표에 고정된 경계를 갖는다. 광선
        크레이터는 크레이터 포화 판정에서 나온 단위로, 이완이 없어 젊은 충돌구의 밝은 줄기가 지워지지 않는다.
        행성의 겉보기 크기 18도는 궤도 6.4 R_c에서 계산했다.
        유보: 벨트 안쪽 궤도라 지표 선량이 시간당 수 rad 수준이므로, EVA 체류 시간이 실제로는 제약이 된다. 그 수치는
        환경 행이 갖는다.
