      rock accounts for about six tenths of its mass. Surface gravity is a seventieth of Earth's. Everything else
      follows from how close the planet is. Tides locked its rotation early, so one hemisphere never turns away, and
      the same tides rounded the orbit off. With no eccentricity left there is nothing to knead the interior, and
      that alone is why this moon is cold where Enceladus is not. The planet's pull does stretch it, but by about one
      percent, too little to see against the stars and visible only in the gravity field.
    narrative_ko: >
