        surface 보호 한계. b보다 가혹(더 근접·무대기 차폐 0).

        paper: 별 환경 측정 = 별 섹션(environment.activity/wind/heliosphere); phase-lock 플레어 = Zapatero Osorio 2026
        (2605.22925, G7); 대기 escape 무관(무대기).

