      [2026-07-14 figure+walk] obliquity 17°(오너 art)·spin 궤도법선서 17° 기움·J₂ ~8e-4(q 6.7e-3·NMoI 0.23
      Radau-Darwin)·flattening 0.45%(a/c 1.005 → 가시 threshold 아래)·internal_heat T_int~45–50K(cold mini-Neptune
