      암석이다. 표면 중력은 지구의 70분의 1이다. 나머지 성질은 행성이 가깝다는 사실에서 따라 나온다. 조석이
      일찌감치 자전을 잠가 한쪽 반구가 영영 돌아서지 않고, 같은 조석이 궤도를 원으로 다듬어 놓았다. 이심률이 남지
      않았으니 속을 주무를 힘도 없다. 엔셀라두스는 뜨겁고 이 위성은 차가운 이유가 그 하나다. 행성의 인력이 몸을
      늘이기는 하지만 1퍼센트 남짓이라 별을 배경으로 알아볼 수 없고, 중력장에만 드러난다.
