      - name: flattening
        value: 4.5e-3
        op: set
        note: "자유회전 f=(3·J₂+q)/2 ≈0.45%; a/c~1.005 < 2% 가시 threshold → 중력 J₂만, 오블레이트 메쉬 없음"
