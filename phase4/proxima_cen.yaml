        확인: 고유색은 surface 행의 자기권-차폐 재근거화 값(#3c3833 · #2a2622)이고, 표시색은 그 값에 항성
        표시색 #ffcc75를 채널 곱한 결과다(§6 엔진의 모항성 SED 곱을 표시색 수준에서 적용). 무대기라 구름과
        haze가 없어 순수 표면이 그대로 보인다.
        유보: 정확한 hex는 emit 말미 art-pass에서 실측 SED로 다시 뽑는다.

  - body: Proxima Cen d
    axis: magnetism.magnetic_field
    status: gated
    driver: [window-selection]
    narrative: >
      극 자기장 ~16 G(범위 3–280 G). Zapatero Osorio et al. 2026(arXiv:2605.22925) SPI 추정이고, 지구형 외계행성
      최초의 자기장 추정치. 항성 플레어가 d 궤도위상에 phase-lock(>99.8% 유의) → helicity-driven 재결합 + Poynting flux
      형식으로 도출(Mars 반경 가정). 관측>모델이라 기존 dynamo-scaling '약장' 추측을 대체.
    fields:
      - name: magnetic_field
        value: "~16 G (극 자기장, 범위 3–280 G)"
        op: set
        note: "Zapatero Osorio 2026 SPI 추정; 지구형 외계행성 최초. phase-lock >99.8% 유의 (helicity reconnection + Poynting flux, Mars 반경 가정)"
    gate:
      criterion: [observation, derived-grounding]
      verdict: pass-in-window
      evidence: >
        rationale: SPI 관측 추정(~16 G)이 RM22 느린자전 약장 추측을 supersede(오너 결정 2026-06-23, 관측 우선). caveat:
        모델의존(helicity reconnection·Poynting flux, Mars 반경 가정)·범위 3–280 G로 광범. dynamo 이론(조석고정 느린자전
        →약장)과 긴장이 있는데, 범위 하단 ~3 G가 이론 정합이나 central 16 G는 SPI 채택. 16 G 극장은 약하지 않음(지구 극 ~0.6 G·
        목성 ~14 G 수준).

        feature: phase-lock 플레어는 d의 distinctive 피처, 곧 '별을 자기적으로 때리는 안쪽 행성'이다. G8 방사선·G1 정체성에 연계.

        paper: Zapatero Osorio et al. 2026 (arXiv:2605.22925) "Star-planet interaction in the Proxima system". 약장 기존
        추측 출처=dynamo 문서 regime4(RM22).
    refs: ["2605.22925"]

