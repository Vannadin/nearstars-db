    driver: [art-direction, window-selection]
    narrative: >
      Proxima의 적색광을 입은 어두운 따뜻한 회갈색 디스크이고, 공간풍화된 수성을 닮았다. 단색이 아니라 2-tone이다.
      자기권이 항성풍을 막아 준 중위도는 상대적으로 밝고(고유 #3c3833 → Proxima-lit ~#3c2d17), 플레어 입자가
      집중 채널되는 자기극관은 거의 흑갈로 짙다(고유 #2a2622 → Proxima-lit ~#2a1e10). 크레이터와 풍화 줄무늬가
      더해진다. 오로라는 없다. 자기장은 약 16 G로 존재하지만 발광할 대기가 없다. b의 황토 호수세계, c의 차가운
      미니 해왕성과 함께 시각적으로 세 극을 이룬다.
    fields:
      - name: base_color
        value: "중위도 #3c3833 → Proxima-lit ~#3c2d17 / 자기극관 #2a2622 → Proxima-lit ~#2a1e10 (2-tone; 크레이터·풍화 줄무늬)"
        op: set
      - name: aurora
        value: "none (무대기, ~16 G 자기장 존재하나 발광 매질 없어 불가)"
        op: set
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: >
        채택값은 surface 행이 정한 2-tone을 Proxima 조명 아래로 옮긴 것이다. 중위도 ~#3c2d17, 자기극관 ~#2a1e10.
        확인: 고유색은 surface 행의 자기권-차폐 재근거화 값(#3c3833 · #2a2622)이고, 표시색은 그 값에 항성
        표시색 #ffcc75를 채널 곱한 결과다(§6 엔진의 모항성 SED 곱을 표시색 수준에서 적용). 무대기라 구름과
        haze가 없어 순수 표면이 그대로 보인다.
        유보: 정확한 hex는 emit 말미 art-pass에서 실측 SED로 다시 뽑는다.

  - body: Proxima Cen d
    axis: magnetism.magnetic_field
    status: gated
    driver: [window-selection]
    narrative: >
      극 자기장 ~16 G(범위 3–280 G). Zapatero Osorio et al. 2026(arXiv:2605.22925) SPI 추정이고, 지구형 외계행성
      최초의 자기장 추정치. 항성 플레어가 d 궤도위상에 phase-lock(>99.8% 유의) → helicity-driven 재결합 + Poynting flux
      형식으로 도출(Mars 반경 가정). 관측>모델이라 기존 dynamo-scaling '약장' 추측을 대체.
    fields:
      - name: magnetic_field
        value: "~16 G (극 자기장, 범위 3–280 G)"
        op: set
        note: "Zapatero Osorio 2026 SPI 추정; 지구형 외계행성 최초. phase-lock >99.8% 유의 (helicity reconnection + Poynting flux, Mars 반경 가정)"
    gate:
      criterion: [observation, derived-grounding]
      verdict: pass-in-window
      evidence: >
        rationale: SPI 관측 추정(~16 G)이 RM22 느린자전 약장 추측을 supersede(오너 결정 2026-06-23, 관측 우선). caveat:
        모델의존(helicity reconnection·Poynting flux, Mars 반경 가정)·범위 3–280 G로 광범. dynamo 이론(조석고정 느린자전
        →약장)과 긴장이 있는데, 범위 하단 ~3 G가 이론 정합이나 central 16 G는 SPI 채택. 16 G 극장은 약하지 않음(지구 극 ~0.6 G·
        목성 ~14 G 수준).

        feature: phase-lock 플레어는 d의 distinctive 피처, 곧 '별을 자기적으로 때리는 안쪽 행성'이다. G8 방사선·G1 정체성에 연계.

        paper: Zapatero Osorio et al. 2026 (arXiv:2605.22925) "Star-planet interaction in the Proxima system". 약장 기존
        추측 출처=dynamo 문서 regime4(RM22).
    refs: ["2605.22925"]

  - body: Proxima Cen d
    axis: environment
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      radiation=극심(최근접(0.029 AU) 플레어 별 + 무대기 표면 직노출 + d에 phase-lock된 플레어[Zapatero Osorio
      2026, G7] → 표면 방사선 시스템 최악). ~16 G 자기권(G7)이 하전입자 일부 편향하나 무대기라 surface 보호 미미. 단 16 G
      자기권 + 최근접 플레어 → 강한 포획 방사선대(목성형) → 표면뿐 아니라 d 주변 궤도 공간도 고방사선(접근선·궤도선이 belt
      통과). stellar_wind=매우 강(최근접 ram). heliosphere=astrosphere 최심부. G11 해저드·G1 무생물의 물리 근거.
    fields:
      - name: radiation
        value: "극심 (최근접 + 무대기 직노출 + d-phase-lock 플레어 + 포획 방사선대)"
        op: set
      - name: stellar_wind
        value: "매우 강 (최근접 ram)"
        op: set
      - name: heliosphere
        value: "astrosphere 최심부"
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        별 measured 환경 + 무대기 + d-phase-locked 플레어(G7 SPI)에서 도출. 정정: 자기장은 약하지 않음(~16 G). 단 무대기라
        surface 보호 한계. b보다 가혹(더 근접·무대기 차폐 0).

        paper: 별 환경 측정 = 별 섹션(environment.activity/wind/heliosphere); phase-lock 플레어 = Zapatero Osorio 2026
        (2605.22925, G7); 대기 escape 무관(무대기).

  - body: Proxima Cen d
    axis: rings
    status: gated
    driver: [window-selection]
    narrative: "고리 없음 (극근접 뜨거운 암석, 근거·픽션 없음)."
    fields:
      - name: ring_structure
        value: "none"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: "극근접 뜨거운 암석엔 고리 기본 부재. 디스크 조작 방지 원칙([[project_nearstars_ring_fabrication]])에 따라 feature 없으면 없음."

  - body: Proxima Cen d
    axis: satellites
    status: gated
    driver: [engine, window-selection]
    narrative: "위성 없음. 극근접(0.029 AU) 미세 Hill 반경 + 강항성조석으로 안정 위성 불가(b보다 더 단호한 물리적 부재)."
    gate:
      criterion: [stability]
      verdict: pass-in-window
      evidence: "[[feedback_gameplay_variety]] '물리적으로 아무것도 없음' 예외."

  - body: Proxima Cen d
    axis: gameplay
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "항성간 플래그십 + 최근접 고방사선 착륙".
    status: gated
    driver: [engine]
    narrative: >
      착륙 가능(고체 표면)이나 splashdown 없음(무액체)·대기비행 없음(무대기 → 동력/탄도만). breathability=불가
      (무대기). radiation 해저드=극심(G8, 최근접 플레어+무대기 직노출, 시스템 최악 tier; 가혹한 착륙). ~16 G 자기권(G7)
      → 방사선대(trapped 입자)·자기극 강하 + 항성 플레어가 d 궤도위상에 phase-lock → 주기적 방사선 spike(궤도 위상별 위험
      변동, 게임플레이 훅). 과학 타깃은 지구형 외계행성 최초 자기장(SPI)이고, 자기권·phase-lock 관측 과학 명소다. biome = 하이브리드
      7구획(오너 검토·선택 2026-06-23, 수성 지질 + 1:1 열구조 결합): ① 직하 핫스팟(Substellar Hotspot, 최고온 시그니처
      명소) · ② 주간 고지(Day Highlands, 장석질) · ③ 주간 평원(Day Plains, 마픽/planitia) · ④ 크레이터(Craters, 충돌지형) ·
      ⑤ 명암경계선(Terminator) · ⑥ 야간면(Night Side, 극냉) · ⑦ 자기극 풍화관(Magnetic Polar Caps), 플레어 입자
      집중 채널로 강풍화된 어두운 흑갈 극관(G5 2-tone; 자기장 시그니처 biome, 무자기장 수성의 단순 극 크레이터와 차별).
      ScienceValues 전체(landed/flying-low=탄도/in-space; splashed=토큰 inert). SOI 자동. 난도=항성간 플래그십 + 최근접
      고방사선 착륙. 발견=RB T F F F(candidate, G1).
    fields:
      - name: science_biomes
        value: "하이브리드 7구획: 직하 핫스팟/주간 고지/주간 평원/크레이터/명암경계선/야간면/자기극 풍화관"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        owner_review: 2026-06-23 오너 검토·선택으로 biome 스킴 C(하이브리드) 채택. RSS 수성(지질+크레이터+극, 3:2라 항성경도
        미사용) 확인 후, d는 1:1 고정이라 수성 지질 + 영구 day/night 열구조를 결합(직하 핫스팟·야간면 추가). 무대기라 b의
        호수/빙관/구름 biome은 없음.

        note: 무대기·무액체가 b(호수세계, splashdown·대기비행)와의 핵심 게임 차이다. d는 수성형 진공 착륙. radiation 극심=G8
        derived. cfg emit(biome map·ScienceValues·ResearchBodies)는 프로젝트 말미 일괄.

  # ════════ 행성 c (원거리 냉 mini-Neptune + Gratton 고리 + 소형 위성) — facet-walk 2026-06-23 (축별 walk) ════════
  - body: Proxima Cen c
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      This is a planet that may not exist. A radial-velocity signal at 1900 days was reported in 2020 and has never
      been confirmed; when the system was resurveyed in 2025 with a near-infrared spectrograph, whether that signal is
      even in the data came out inconclusive. Nor has it been ruled out. Taken as real it is a cold mini-Neptune of
      about eight Earth masses, holding a hydrogen-helium envelope at 40 K from 1.5 AU. Set beside temperate rocky b
      and hot mercurian d it splits the system three ways. Nothing lives there. Every value this board carries for c
      rests on assuming c is there.
    narrative_ko: >
      이 행성은 있을지도 모르는 행성이다. 2020년에 1900일 주기의 시선속도 신호로 보고됐지만 확인되지 않았고,
      2025년 근적외선 분광기로 이 계를 다시 훑었을 때도 그 신호가 데이터에 있는지 결론이 나지 않았다. 부정된 것도
      아니다. 있다고 보면 지구 질량의 여덟 배쯤 되는 차가운 미니 해왕성이고, 1.5 AU에서 수소·헬륨 외피를 두른 채
      40 K에 머문다. 온대 암석 세계인 b, 뜨거운 수성형인 d와 나란히 놓이면 이 계가 세 갈래로 갈린다. 생명은 없다.
      이 보드에서 c에 관한 모든 값은 c가 있다는 가정 위에 있다.
    fields:
      - name: body_type
        value: "냉 mini-Neptune (~8 M⊕, 1.5 AU, H/He 외피, Teq~40K, 무생물)"
        op: set
      - name: designation
        value: "Proxima Centauri c (고유명 없음)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        채택값은 차가운 미니 해왕성이고, 존재는 미확정 후보다.
        확인: 신호의 유일한 출처는 Damasso & Del Sordo 2020의 1900일 시선속도이고, 그 값이 지금도 유일한 수치
        근거다. 2025년 NIRPS 관측은 b를 확인하고 d의 존재를 확정했으나 c의 신호에 대해서는 결론을 내지 못했다.
        5년 뒤 더 정밀한 장비로도 확인도 부정도 되지 않았다. 미발견 후보라는 분류가 이 상태와 정합한다.
        유보: 이 행이 미확정을 선언하므로 c의 다른 모든 행과 c I 위성이 그 가정에 딸려 있다. c가 부정되면 함께
        사라진다.
    refs: ["2020SciA....6.7467D", "2025A&A...700A..11S"]

  - body: Proxima Cen c
    axis: orbit
    status: gated
    driver: [window-selection]
    narrative: >
      It circles 1.5 AU out, once every 5.2 years, on an orbit that is nearly circular. At that distance tides cannot
      hold its spin, which makes it the only freely rotating planet in the system. Nothing constrains the rotation
      period, so it is set at 27 hours, a little slower than Neptune's. The orbit's tilt to our line of sight is
      unknown as well. An astrometric attempt to pin the inclination was disputed along with the signal itself, so the
      orientation is left free at emit.
    narrative_ko: >
      별에서 1.5 AU 떨어져 5.2년에 한 바퀴를 돈다. 궤도는 거의 원에 가깝다. 이만큼 멀면 조석이 자전을 붙들지 못해,
      이 계에서 유일하게 자유롭게 도는 행성이 된다. 자전 주기는 관측으로 묶이지 않아 27시간으로 정했다. 해왕성보다
      조금 느린 값이다. 궤도가 우리 시선에 얼마나 기울었는지도 모른다. 천체측정으로 경사각을 잡으려는 시도가 있었지만
      그 결과는 신호 자체와 함께 반박됐고, 그래서 배향은 emit 단계에서 자유롭게 정한다.
    fields:
      - name: semi_major_axis_au
        value: 1.5
        unit: AU
        op: passthrough
        note: "P≈1900d (~5.2yr); Damasso2020 측정"
      - name: eccentricity
        value: 0.04
        op: passthrough
        note: "Damasso2020 측정"
      - name: tidal_lock
        value: "none (비조석고정, 1.5 AU → τ_lock ≫ 나이); 경사각·Ω·ω는 미측정이라 de-perfect-at-emit (synthetic-orbit-noise 정책; 측정값 e 0.04는 노이즈 대상 아님)"
        op: set
    gate:
      criterion: [classification, derived-grounding]
      verdict: pass-in-window
      evidence: >
        채택값은 장반경 1.5 AU, 주기 1900일, 이심률 0.04, 비조석고정, 자전 27시간이다.
        확인: 앞의 셋은 Damasso & Del Sordo 2020의 측정을 그대로 통과시킨 값이다. 조석고정 여부는 고정 시간이
        장반경의 6제곱에 비례하는 관계로 판정하며, 1.5 AU에서는 그 시간이 별의 나이를 크게 넘어 자유 자전이 남는다.
        진질량은 최소질량에 등방 prior의 중앙 경사 60°를 적용해 8 M⊕이고, b·d와 같은 방식이다. Kervella & Damasso
        2020의 천체측정 경사각과 질량은 신호 후속 반박과 함께 논쟁 대상이라 채택하지 않았다.
        유보: 자전 27시간은 관측이 없는 자리의 오너 선택이다. 방위각과 절대 배향도 미구속이라 emit에서 정한다.
    refs: ["2020SciA....6.7467D", "2003.13106", "1007.0245"]

  - body: Proxima Cen c
    axis: bulk                        # §3.2 템플릿 앵커
    body_class: free_rotator
    refs: ["docs/reference/mass-radius-relation-methodology.md", "docs/reference/body-figure-methodology.md", "docs/reference/internal-heat-luminosity-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      A mini-Neptune of eight Earth masses and about 2.7 Earth radii. At 2.2 g/cm³ its density is under half of
      Earth's, so this is not a rock but a volatile-rich body puffed out by a hydrogen-helium envelope. Surface
      gravity comes out close to Earth's. As the one freely rotating planet here its day runs 27 hours, fast enough to
      leave a mark on the gravity field if not on the visible disk. The spin axis leans 17 degrees from the orbital
      plane. Internal heat, Neptune-like, lifts the surface from 40 K into the 50s, and even so the volatiles stay
      frozen.
    narrative_ko: >
      지구 질량의 여덟 배에 반지름은 2.7배쯤 되는 미니 해왕성이다. 밀도가 지구의 절반도 안 되는 2.2 g/cm³이라,
      암석 덩어리가 아니라 수소·헬륨 외피에 부푼 휘발성 풍부한 몸이다. 표면 중력은 지구와 비슷하다. 자유롭게
      자전하는 유일한 행성이라 하루가 27시간이고, 그 속도가 눈에 보이는 원반을 일그러뜨릴 정도는 아니지만 중력에는
      새겨질 만큼 부풀린다. 자전축은 궤도면에서 17도 기울어 있다. 내부에서 올라오는 열은 해왕성만큼 있어 표면
      온도를 40 K에서 50 K대로 밀어 올리지만, 그래도 휘발성은 여전히 얼어 있다.
    fields:
      - name: mass
        value: 8
        unit: M_earth
        op: set
        phase3_default: "Msini 7 M⊕ (RV, Damasso2020); 반경 미관측(비통과)"
        note: "G2 등방중앙"
      - name: radius
        value: 2.7
        unit: R_earth
        op: set
        note: "오너 채택 중심값 (band 2.5–3 R⊕, H/He 외피 inflation); g ~1.1 g, 밀도 ~2.2 g/cm³ 휘발성-풍부"
      - name: gravity
        value: 1.1
        unit: g
        op: set
        note: "GM/R² 파생 에코"
      - name: reference_radius
        value: 17202
        unit: km
        op: set
        note: "J2 기준 반경 = radius (2.7 R⊕)"
      - name: geopotential_c22
        value: null
        na_reason: "자유 자전(비조석고정), 모항성 방향 고정축이 없어 영구 조석 삼축 부재"
      - name: rotation_period
        value: 27
        unit: h
        op: set
        note: "미구속 자유자전, 오너 art 선택"
      - name: obliquity
        value: 17
        unit: deg
        op: set
        note: "오너 art 2026-07-14, 유일한 자유회전 행성이라 축 다양성 부여(b/d/c I는 조석고정 0°). 방위각은 emit de-perfect"
      - name: spin_axis_orientation
        value: "궤도 법선에서 17° 기움 (방위각 de-perfect-at-emit, synthetic-orbit-noise 정책)"
        op: set
      - name: geopotential_j2
        value: 8.0e-4
        op: set
        note: "자유회전 q 6.7e-3(P_rot 27h)·NMoI 0.23 Radau-Darwin → J₂~8e-4 (range 5e-4–1e-3; figure ledger)"
      - name: flattening
        value: 4.5e-3
        op: set
        note: "자유회전 f=(3·J₂+q)/2 ≈0.45%; a/c~1.005 < 2% 가시 threshold → 중력 J₂만, 오블레이트 메쉬 없음"
      - name: internal_heat
        value: "T_int ~45–50 K (Neptune analog) → T_eff 40→~53 K"
        op: set
        note: "cold mini-Neptune (§7), 저일사라 내부열이 온도 지배(range, factor-few 불확실). 표면은 여전히 휘발성 동결(CH₄/N₂). Pearl&Conrath1991 Neptune 앵커"
      - name: age
        value: 4.85
        unit: Gyr
        op: set
    gate:
      criterion: [derived-grounding, error-bar]
      verdict: pass-in-window
      evidence: >
        채택값은 질량 8 M⊕, 반지름 2.7 R⊕, 밀도 2.2 g/cm³, 자전 27시간, obliquity 17°, J₂ 8e-4다.
        확인: 8 M⊕는 radius valley 경계에 걸리지만 미니 해왕성으로 읽으므로 단일 암석 그리드가 아니라 확률적
        질량-반경 관계가 맞는 도구이고, 그 밴드 2.5~3 R⊕의 중심으로 2.7을 잡았다. 밀도 게이트도 통과한다. 같은
        반지름대의 GJ 1214 b가 1.88, 해왕성이 1.64, 천왕성이 1.25 g/cm³이니 2.24는 이 부류에서 낮은 쪽이 아니라
        높은 쪽이고, 밴드 안에서 가장 암석에 가까운 절반에 해당한다(R 2.5면 2.82, R 3.0이면 해왕성과 같은 1.63).
        J₂는 자유 자전의 회전 파라미터 6.7e-3에 Radau-Darwin으로 얻은 관성모멘트 0.23을 적용해 8e-4이고, 편평도
        0.45%는 겉보기 임계 2% 아래라 중력에만 반영하고 시각 메쉬로는 만들지 않는다. 조석 삼축은 자유 자전이라
        해당 없음이다.
        유보: 반지름과 obliquity는 관측이 없는 자리의 오너 선택이다. 내부열은 해왕성 유추라 배수 수준의 불확도를
        갖는다.

  - body: Proxima Cen c
    axis: atmosphere
    refs: ["docs/reference/tidally-locked-temperature-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      A thick hydrogen-helium envelope that only grows denser downward. At 40 K methane freezes out by 90 K and
      nitrogen by 63 K, so hydrogen and helium are all that stay gaseous and the rest settles into ice-cloud layers
      below. How much heavier material is mixed in has never been observed, not even to an order of magnitude.
    narrative_ko: >
      수소와 헬륨으로 된 두꺼운 외피가 아래로 갈수록 짙어진다. 40 K에서는 메탄이 90 K, 질소가 63 K에서 이미
      얼어붙으므로 기체로 남는 것은 수소와 헬륨뿐이고, 나머지는 아래쪽에서 얼음 구름층을 이룬다. 무거운 원소가
      얼마나 섞였는지는 관측된 적이 없어 자릿수조차 모른다.
    fields:
      - name: composition
        value: "두꺼운 H/He 외피 (상층 관측 대기 = H/He만 기체); 심층 얼음-구름층 (CH₄/N₂/NH₃/H₂O 동결)"
        op: set
      - name: temperature
        value: 40
        unit: K
        op: set
        note: "Teq 극냉"
      - name: breathability
        value: false
        op: set
      - name: escape
        value: "무시 (대질량·원거리 저irradiation)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        채택값은 두꺼운 H/He 외피, 평형온도 40 K, 탈출 무시다.
        확인: 온도는 조석고정 온도 문서의 첫 층으로 얻었고, 자유 자전이라 재분배가 좋아 균일에 가깝다. 응결 여부는
        각 종의 동결점과 대조했다. 메탄 90 K, 질소 63 K가 모두 40 K보다 높아 기체로 남지 못하고 수소만 20 K
        근처까지 버틴다. 대기 보유는 8 M⊕의 중력과 1.5 AU의 낮은 조사량에서 나온다.
        유보: 금속성과 메탄 함량은 관측이 없어 자릿수 미상으로 둔다. T/P 프로파일은 emit 단계에서 차가운 해왕성
        격자를 쓴다.

  - body: Proxima Cen c
    axis: surface
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: "None."
    narrative_ko: "없음."
    fields:
      - name: surface_type
        value: null
        na_reason: "H/He 외피체라 표면 축이 성립하지 않는다. 표면색·알베도 문서의 적용 범위 밖이고, 가시 색은 appearance 행이 담는다"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        표면 축은 해당 없음이다.
        확인: 표면색·알베도 문서가 규정하는 적용 범위는 고체 표면을 가진 천체이고, H/He 외피체는 그 밖이다.
        가시 색을 정하는 것은 표면이 아니라 대기이므로 appearance 행이 그 판단을 갖는다.

  - body: Proxima Cen c
    axis: appearance
    refs: ["docs/reference/atmosphere-reflected-color-methodology.md"]
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      It is not Neptune-blue. Neptune's deep blue comes from gaseous methane in the upper atmosphere absorbing red,
      and Neptune is warm enough at 72 K to keep that methane gaseous. This planet sits at 40 K, in the 50s with
      internal heat, cold enough that the methane freezes out of the upper layers and nothing is left to eat the red.
      What remains is the weak blue scattering of hydrogen and helium over the near-neutral grey-white of high ice and
      haze. The disk reads pale grey-blue, a third colour beside ochre b and grey-brown d.
    narrative_ko: >
      해왕성처럼 파랗지 않다. 해왕성의 진청색은 상층의 기체 메탄이 붉은빛을 흡수해서 나오는 색인데, 그 행성은
      72 K라 메탄이 기체로 남아 있다. 여기는 40 K이고 내부열을 보태도 50 K대라 메탄이 얼어 상층에서 빠지므로,
      붉은빛을 먹을 기체가 없다. 남는 것은 수소와 헬륨의 약한 청색 산란과 고층 얼음·연무의 거의 중성한 회백이다.
      그래서 창백한 회청색 원반이 되고, 황토색인 b와 회갈색인 d 사이에서 세 번째 색을 맡는다.
    fields:
      - name: base_color
        value: "#c4d0d8 (창백 회청/회백; 거의 중성 + 약한 Rayleigh 청)"
        op: set
      - name: clouds
        value: "H/He + 고층 얼음·haze (해왕성처럼 파랗지 않음, CH₄ 응결로 진청 메커니즘 약함)"
        op: set
    gate:
      criterion: [visual-checklist, composition-lock]
      verdict: pass-in-window
      evidence: >
        채택값은 고유색 #c4d0d8의 창백한 회청색 원반이다.
        확인: 해왕성이 72 K에서 기체 메탄으로 붉은빛을 흡수해 진청색이 되는 것과 대조했다. 이 행성의 40 K는 메탄
        응결점 90 K보다 훨씬 낮고 내부열을 더한 50 K대에서도 그 아래이므로, 상층에 붉은빛을 흡수할 기체가 남지
        않는다. 색 자체는 대기 반사색 문서의 엔진으로 수소·헬륨의 Rayleigh 산란과 얼음 연무의 약한 흡수를 합쳐
        얻었다.
        유보: 1.5 AU에 M5.5 별이라 실제로는 극도로 어둡지만, Kopernicus가 천체를 정규화해 렌더하므로 그 어두움은
        인게임에 반영되지 않는다. 이 행이 정하는 것은 밝기가 아니라 색이다.

  - body: Proxima Cen c
    axis: magnetism.magnetic_field
    status: gated
    driver: [window-selection]
    narrative: >
      The field looks like Uranus's and Neptune's. Convection in a thin conducting shell, as in those two, does not
      build a clean dipole; it builds a multipolar field with the axis strongly tilted and displaced from centre.
      Running the energy-flux recipe on this planet's own internal heat gives about 0.18 gauss at the surface, and the
      same chain reproduces Neptune to within a factor of 1.4. This is multipolar for a different reason than b: there
      rotation decides the shape, here the interior structure does. Aurora is faint, since few particles reach this
      distance to strike the field at all.
    narrative_ko: >
      자기장은 천왕성과 해왕성 쪽을 닮는다. 두 행성처럼 얇은 전도층에서 대류가 일어나면 깔끔한 쌍극자가 서지 못하고,
      축이 크게 기울고 중심에서 밀려난 다극장이 된다. 이 행성의 내부열로 에너지플럭스 레시피를 돌리면 표면에서 약
      0.18 가우스가 나오는데, 같은 사슬이 해왕성을 1.4배 안에서 재현한다. b가 느린 자전 때문에 다중극인 것과 이유가
      다르다. 여기서는 회전이 아니라 내부 구조가 형태를 정한다. 오로라는 미약하다. 자기권을 때릴 입자가 애초에 이
      거리까지 거의 오지 않는다.
    fields:
      - name: magnetic_field
        value: "~0.1–0.5 G (빙거성 아날로그, 비쌍극·tilted ~47–59°); conf low"
        op: set
      - { name: field_geometry, value: "기울고 중심 이탈한 다중극 (빙거성형)", op: set, note: "얇은 전도층 대류. 형상 도식 docs/img/field-geometry-proxima-c.png" }
      - { name: radiation_model, value: "빙거성형 (CRAND 내대 + 항성풍 외대 + 계면)", op: set, note: "실측 천왕성·해왕성이 양성자 내대와 전자 외대를 모두 가지는 것을 따른다. 상세는 radiation_belts 행" }
      - { name: geomagnetic_pole_lat, value: 40, unit: deg, op: set, note: "기울기 50°. 천왕성 58.6°·해왕성 47° 사이" }
      - { name: geomagnetic_offset, value: 0.4, op: set, note: "중심 이탈. 천왕성 0.3·해왕성 0.55 사이" }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        채택값은 표면 자기장 약 0.18 G(범위 0.09~0.5)이고 형태는 기울고 이탈한 다중극이다.
        확인: 내부열 T_int 45~50 K에서 내부 광도 8.6e14~1.3e15 W를 얻고, 에너지플럭스 관계 B_dyn = 4.8(M L²/R⁷)^(1/6)에
        표면 환산 1/(2√2)과 다중극 붕괴 0.06배를 적용해 0.17~0.20 G가 나온다. 같은 사슬로 해왕성은 0.198 G가 나와
        관측 ~0.14 G의 1.4배이고, 천왕성은 0.087 G로 관측 ~0.23 G의 0.4배다. 즉 이 부류에서 자릿수는 맞고 배수는
        틀릴 수 있다. 기울고 이탈한 형태는 두 빙거성의 공통 특징이며, 형상 도식은 docs/img/field-geometry-proxima-c.png
        에 있다.
        유보: 다이나모 문서는 해왕성 이하 질량에서 이 법칙을 헬륨 분리 때문에 적용 범위 밖으로 둔다. 그래서 두
        빙거성으로 먼저 검증한 뒤에만 썼고, 결과는 배수 수준의 추정이다. 관측은 없다.
    refs: ["docs/reference/planetary-dynamo-scaling.md"]

  - body: Proxima Cen c
    axis: magnetism.radiation_belts
    status: gated
    driver: [window-selection]
    narrative: >
      Two belts, filled by two different machines. Close in, cosmic rays strike the deep atmosphere and the neutrons
      they splash back decay into trapped protons, the same source that fills Earth's inner belt; here it runs harder,
      because Proxima's small astrosphere barely filters the cosmic rays and the weak field turns few of them away.
      Farther out, near three radii, sits the electron belt the stellar wind feeds, and that one is faint: the wind at
      1.5 AU carries a tenth of what Earth's magnetosphere is fed, so the belt stays well under the flux its own field
      could hold. The magnetopause that contains both stands about twelve radii out.
    narrative_ko: >
      벨트는 두 겹이고, 채우는 기계가 서로 다르다. 안쪽에서는 우주선이 깊은 대기를 때리고 튕겨 나온 중성자가 붕괴해
      양성자로 포획되는데, 지구 내대를 채우는 것과 같은 소스다. 여기서는 그것이 더 세게 돈다. 프록시마의 작은
      항성권은 우주선을 거의 거르지 못하고, 약한 자기장은 들어오는 우주선을 별로 쳐내지 못하기 때문이다. 바깥쪽
      반지름 세 배 근처에는 항성풍이 채우는 전자 벨트가 있는데 이쪽은 희미하다. 1.5 AU의 항성풍은 지구 자기권이
      받는 것의 십분의 일밖에 나르지 못해서, 벨트는 자기장이 담을 수 있는 한계에 한참 못 미친 채로 남는다. 이 둘을
      담는 자기권계면은 반지름의 열두 배쯤에 선다.
    fields:
      - { name: radiation_model, value: "nearstars_proxima_c", op: set, note: "빙거성형: CRAND 내대 + 항성풍 외대 + 계면" }
      - { name: inner_dist, value: 1.5, op: set, note: "CRAND 양성자대. 저L 포획 (지구 내대 L~1.5와 같은 자리)" }
      - { name: inner_radius, value: 0.86, op: set, note: "오너 튜닝. 컷 적용 후 유효 구간 적도 1.41~2.91 R_c" }
      - { name: inner_deform_xy, value: 0.66, op: set }
      - { name: inner_deform, value: 0.115, op: set, note: "다중극 얼룩짐. 스톡 최대 0.1을 약간 넘지만 단면 대비 미세" }
      - { name: inner_border_dist, value: 0.0001, op: set, note: "구면 컷 = 손실원뿔 D-형. 지구 모델과 같은 구조" }
      - { name: inner_border_radius, value: 1.0, op: set, note: "적도 컷 1.0/√0.5 = 1.41 R_c. 거울점이 대기에 잠기는 입자의 소멸 경계" }
      - { name: inner_border_deform_xy, value: 0.5, op: set }
      - { name: outer_dist, value: 2.8, op: set, note: "자기권계면 nose 11.9 R_c × 0.235 (실측 천왕성 0.24·해왕성 0.23의 비율)" }
      - { name: outer_radius, value: 2.5, op: set }
      - { name: outer_deform_xy, value: 0.66, op: set, note: "빙거성 앵커(천왕성 phys 0.664)" }
      - { name: outer_deform, value: 0.5, op: set, note: "오너 튜닝. 다중극 얼룩. 스톡 최대 0.1의 5배지만 단면 2.5 대비 20%라 토폴로지 유지" }
      - { name: outer_border_dist, value: 1.54, op: set, note: "내측 carve. 지구 모델의 border/dist 비 0.55를 따름" }
      - { name: outer_border_radius, value: 1.42, op: set, note: "적도 컷 ~3.6 R_c. 내대(~1.4-2.9)와의 사이가 슬롯이 됨" }
      - { name: outer_border_deform_xy, value: 0.66, op: set }
      - { name: pause_radius, value: 16.84, op: set, note: "플랭크 = nose×√2. nose 11.9 R_c = Chapman-Ferraro (B_eq 0.18 G, 1.5 AU 램압 0.178 nPa)" }
      - { name: pause_compression, value: 1.414, op: set, note: "Shue α=0.5의 플랭크/nose 비 √2를 SDF로 재현. 스톡 earth 1.5·mercury 1.4와 같은 급" }
      - { name: pause_extension, value: 0.135, op: set, note: "꼬리 = rad/ext = 125 R_c = pause_tail과 정합" }
      - { name: pause_height_scale, value: 1.0, op: set, note: "Shue 형상은 축대칭. 스톡의 1.1은 자오면 폭을 1/1.1로 눌러 Shue와 어긋남" }
      - { name: radiation_inner, value: 8.0, unit: rad/h, op: set, note: "지구 내대 10.4의 ~0.8배. 소스(비변조 GCR+낮은 차단강성)는 지구 이상, 다중극 포획 불안정이 깎음" }
      - { name: radiation_inner_gradient, value: 1.9, op: set, note: "오너 튜닝. 스톡 3.3보다 완만한 에지" }
      - { name: radiation_outer, value: 1.2, unit: rad/h, op: set, note: "포화 앵커 3.7 rad/h(18 µT)의 ~1/3. 풍압 0.09× 지구의 소스 제한, 범위 0.4~2" }
      - { name: radiation_outer_gradient, value: 2.2, op: set, note: "스톡 earth 값 명시 (생략 시 코드 기본값으로 떨어짐)" }
      - { name: radiation_pause, value: -0.01, op: set }
      - { name: pause_nose, value: 11.905, op: set, note: "⚗ Shue-native (KerbalismShuePause 채택 시). = pause_radius/compression" }
      - { name: pause_alpha, value: 0.5, op: set, note: "⚗ Shue-native. Shue 1998 지구 경험치 차용, 빙거성 피팅 문헌 없음(저신뢰)" }
      - { name: pause_tail, value: 125, op: set, note: "⚗ Shue-native. 꼬리 컷. 지구 꼬리 관측 ~200 R_E 스케일과 정합" }
      - { name: pause_offset, value: 19.7, op: set, note: "⚗ offset 에뮬레이션 (경량 패치용). 구 중심을 꼬리쪽으로 이동해 Shue 근사. 아래 3값과 세트" }
      - { name: pause_offset_radius, value: 21.5, op: set, note: "⚗ offset 세트. 최대폭 = Shue 점근 2×nose 근사" }
      - { name: pause_offset_compression, value: 0.68, op: set, note: "⚗ offset 세트. nose 11.9 유지용" }
      - { name: pause_offset_extension, value: 0.204, op: set, note: "⚗ offset 세트. 꼬리 마감 125 정합. 스톡 SDF는 최대폭이 행성 중심에 고정돼 Shue 꼬리 벌어짐(최대폭이 행성 뒤 ~1.7 nose 지점)을 표현 불가. offset이 그 한계를 푼다" }
      - { name: geomagnetic_pole_lat, value: 40, unit: deg, op: set, note: "기울기 50°" }
      - { name: geomagnetic_offset, value: 0.4, op: set }
    refs: ["docs/reference/planetary-magnetosphere-geometry-methodology.md", "docs/reference/solar-system-radiation-belts.md"]
    provenance: >
      2026-08-04 초판은 세기를 스톡 uranus/neptune cfg에 앵커해 외대 2.0 rad/h 단일 벨트로 잡았다. 같은 날 오너
      지시로 실물리 재계산: 세기는 소스-손실 레짐 콜(포화 선량앵커 3.7 rad/h × 풍압비)로 외대 1.2, CRAND 내대
      8.0을 신설, kp_limit.py로 K-P 천장 비구속 확인(n_cold 0.3~50 스윕에서 천장 6~10¹¹× 지구). 같은 날 두 벨트에
      지구 모델 구조의 border 컷 추가(내대 손실원뿔 구면 컷 적도 1.41 R_c, 외대 내측 carve). 같은 날 뷰어 오너 튜닝
      채택(inner_radius 0.86, inner_deform 0.115, outer_deform 0.5, outer_border_radius 1.42, gradient 1.9/2.2),
      pause_deform은 오너 결정으로 제거(다극 미세왜곡이 계면까지 미치는 것은 어색), 계면 플랭크를 Shue α=0.5
      실형상에 정렬(pause_radius 12.5→16.7, compression 1.05→1.4, nose 11.9 불변), Shue-native 3필드(⚗) 기록.
      같은 날 잔여 폭 불일치 원인 규명(pause_height_scale 1.1이 자오면 폭을 1/1.1로 누름) → SDF를 Shue에 완전
      정렬: radius 16.84(=nose×√2), compression 1.414, height_scale 1.0(축대칭), extension 0.135(꼬리 125 정합).
      뷰어 계면 렌더도 다이폴 틸트에서 분리(항성정렬 프레임).
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        채택값은 CRAND 내대(1.5 R_c, 8.0 rad/h), 항성풍 외대(2.8 R_c, 1.2 rad/h), 자기권계면 nose 11.9 R_c다.
        확인: 계면은 Chapman-Ferraro 균형(0.18 G, 1.5 AU 램압 0.178 nPa → 11.9 R_c, 6제곱근이라 입력 오차에 둔감).
        외대 위치는 실측 천왕성 0.24·해왕성 0.23의 계면 대비 비율로 11.9 × 0.235 = 2.8 R_c. 세기는 방법론 Part B의
        소스-손실 레짐 콜로 정했다. 외대는 포화 선량앵커 10.4×(18/31)^1.9 = 3.7 rad/h에 풍압 제한(1.5 AU 램압은
        지구의 0.09배, 해왕성 국지값의 80배)을 얹어 1.2 rad/h(범위 0.4~2), 내대는 비변조 GCR과 낮은 자기 차단강성이
        CRAND 소스를 지구 이상으로 올리지만 다중극 포획 불안정이 깎아 지구 10.4의 0.8배인 8.0 rad/h. 두 값 모두
        kp_limit.py로 계산한 K-P 천장 아래임을 확인했다(냉플라스마 0.3~50 cm⁻³ 스윕에서 천장이 지구 L=5의 6배~10¹¹배로
        구속 조건이 아님). 내대를 두는 것은 실측 천왕성·해왕성이 양성자 내대를 실제로 가지는 것과 같은 물리다.
        두 벨트의 안쪽 경계는 지구 모델 구조의 border 컷으로 팠다. 내대는 거울점이 대기에 잠기는 입자가 사라지는
        손실원뿔 구면 컷(적도 1.41 R_c), 외대는 내대와의 사이 슬롯을 여는 내측 carve(적도 ~3.6 R_c)다. 계면 플랭크는
        Shue 1998의 실측 형상(α=0.5, 플랭크 = nose×√2 = 16.8 R_c)에 맞췄고, SDF와 Shue-native가 같은 폭이 되도록
        compression 1.4로 정렬했다.
        유보: 벨트 세기는 방법론이 명시하듯 본질적으로 저신뢰 레짐 콜이고, 위성 c I가 자기 궤도의 입자를 쓸어
        회랑을 팔 수 있는데 그 손실항은 위성 행이 확정된 뒤에야 넣을 수 있다.

  - body: Proxima Cen c
    axis: environment
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      The flare protons that scour b and d thin with the square of distance, and c sits thirty to fifty times farther
      out, so the same flare delivers a thousandth as many particles here. The stellar wind thins the same way: the
      ram pressure at c's orbit is about a tenth of what Earth takes from the solar wind. Proxima's astrosphere is
      smaller than the Sun's, though, and filters galactic cosmic rays poorly; what gets through is what c's
      magnetosphere catches to fill its trapped belts. So interplanetary space here is the quietest in the system,
      with the one biting exception inside a few planetary radii.
    narrative_ko: >
      b와 d를 할퀴는 플레어 양성자는 거리의 제곱으로 옅어진다. c는 그 행성들보다 별에서 30~50배 멀리 있어서, 같은
      플레어를 맞아도 도착하는 입자는 천분의 일 수준이다. 항성풍도 같은 이유로 옅어져, c 궤도의 풍압은 지구가
      태양풍에서 받는 값의 10분의 1쯤이다. 다만 프록시마의 항성권은 태양권보다 작아 은하 우주선을 거의 거르지
      못하고, 그렇게 들어온 우주선이 c의 자기권에 잡혀 포획대를 채운다. 그래서 행성간 공간은 계에서 가장
      조용하지만, 행성 반지름 몇 배 안쪽만은 예외로 문다.
    fields:
      - name: radiation
        value: "행성간 공간 낮음 (플레어 플럭스 거리감쇄, 계에서 가장 조용); 단 자기권 포획대는 예외 (내대 8 rad/h)"
        op: set
      - name: stellar_wind
        value: "약 (1.5 AU 램압 0.178 nPa, 지구 태양풍의 ~0.09배)"
        op: set
      - name: heliosphere
        value: "astrosphere 심부 (1.5 AU ≪ standoff ~55 AU)"
        op: set
    provenance: >
      2026-08-04 스윕: 산문을 EN/KO 계약 형태로 재작성, 방사선대 실물리 재계산(내대 8 rad/h 신설)과 정합하도록
      "가장 조용"에 포획대 예외를 병기. 풍압 수치는 방사선대 행의 Chapman-Ferraro 입력과 동일값.
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        채택값은 행성간 방사선 낮음, 항성풍 약(램압 0.178 nPa), 항성권 심부다.
        확인: 플레어 입자 플럭스는 거리 제곱 감쇄로 b 대비 약 천분의 일이고, 램압은 태양풍 1 AU 2 nPa에 질량손실률
        0.2배와 거리 1.5 AU를 넣은 값으로 방사선대 행의 Chapman-Ferraro 입력과 같다. 항성권 standoff ~55 AU는 별
        environment 행의 값을 그대로 썼고, 포획대 예외 수치는 이 행성 방사선대 행과 대조했다.
        유보: 프록시마의 입자 방출은 실측이 없어 태양 SPE 스펙트럼의 거리 스케일링이다.

  - body: Proxima Cen c
    axis: rings
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      A double ring of alternating red and white bands against black space. SPHERE caught an excess of light at c
      that the planet alone struggles to explain, and a large ring system is one candidate for that excess, which is
      where this ring begins. The white bands are clean water ice and bright; the red ones are tholin-coated ice,
      like Pluto's surface. At c's 40-60 K orbit ice does not dry out by sublimation, so both materials keep. The
      bands ride separately, 24,000-32,700 km inside and 41,300-51,600 km outside, and the wide gap between them
      gives a face unlike Saturn's uniform sheet. The moon c I inherits the same tholin red, tying the planet's
      surroundings into one Pluto-toned palette.
    narrative_ko: >
      검은 우주를 배경으로 붉은 띠와 흰 띠가 번갈아 도는 2중 고리다. SPHERE 관측이 c 자리에서 행성만으로 설명하기
      어려운 밝기 초과를 잡았고, 대형 고리계가 그 초과를 설명하는 후보 중 하나라는 것이 이 고리의 출발점이다. 흰
      띠는 깨끗한 물얼음이라 밝고, 붉은 띠는 명왕성 표면처럼 톨린이 입혀진 얼음이다. 40~60 K의 c 궤도에서는 얼음이
      승화로 마르지 않으므로 두 재질 모두 안정하게 남는다. 두 띠는 안쪽 24,000~32,700 km와 바깥 41,300~51,600 km에
      나뉘어 돌고, 사이의 넓은 간극 덕에 토성의 균일한 시트와는 다른 얼굴이 된다. 같은 톨린 붉은색을 위성 c I가
      이어받아, 이 행성 둘레는 하나의 명왕성풍 색으로 묶인다.
    fields:
      - name: ring_structure
        value: "2중 띠: 안쪽 24000-32700 km (~1.4-1.9 R_c) / 바깥 41300-51600 km (~2.4-3.0 R_c), 사이 큰 간극"
        op: set
      - name: ring_composition
        value: "백띠=청정 물얼음(고albedo) + 적띠=톨린 코팅 얼음 (KBO/명왕성식)"
        op: set
      - name: ring_color
        value: "적/흰 교대 줄무늬"
        op: set
    provenance: >
      2026-08-04 스윕: 산문을 EN/KO 계약 형태로 재작성(내용 무변경), refs에 디스크색·얼음 안정성 방법론 문서 추가,
      내대(1.41~2.91 R_c)와의 공간 겹침을 유보로 병기(천왕성 선례로 공존 판정). 구획·수치 무변경.
      같은 날 지구 시선 밝기 계산기(뷰어)로 Gratton 대비 정량 대조: 게이트 고리 ~7e-10 = 실측의 0.2% → "밝은 신호와
      양립" 표현을 철회하고 hook을 테마적 착상으로 명시. 전문 캐시 docs/phase3/_papers/2004.06685.md 추가.
    gate:
      criterion: [observation, visual-checklist]
      verdict: documented-divergence
      divergence_note: >
        Gratton 점광원은 잠정이다(논문이 배경원 가능성도 명시). 고리는 interesting-first 채택, 명시 발산. 잠정 관측
        근거가 있어 순수 조작 아님([[project_nearstars_ring_fabrication]] 대비, V1400 Cen 계열). 토성 클론 회피가
        명시 의도이고, 2중 고리(분리 띠) + 적/흰 줄무늬(톨린 적 + 청정 얼음 백)로 토성 균일 흰 시트와 차별, 명왕성
        위성과 테마 통일. 간극 위치·줄무늬 패턴은 art이고, emit시 로슈 한계·고리면 정합 점검 권장.
      evidence: >
        채택값은 2중 얼음 띠와 적/흰 교대 줄무늬다.
        확인: 두 띠 모두 얼음 Roche 한계 ~3.3 R_c(56,700 km) 안쪽에 있다. 40~60 K에서의 얼음 안정은 얼음 안정성
        문서의 승화 수명으로, 색은 디스크색 문서의 Mie 합성(청정 물얼음 Warren&Brandt 2008 + 톨린 Khare 1984 광학상수)
        으로 얻었다. hook은 Gratton 2020 본문의 밝기 초과 대목과 대조했다.
        유보: 고리 띠가 내대(적도 1.41~2.91 R_c)와 겹쳐 포획 입자를 쓸어낼 수 있으나, 실측 천왕성이 좁은 고리와
        양성자 내대를 공존시키는 선례라 회랑 수준으로 본다. 또한 정량으로는 이 고리가 Gratton 밝기 초과를 설명하지
        못한다. Gratton 식 c = φAr²/(4d²)로 게이트 고리의 반사 대비는 ~7e-10, 실측 (3.5±2.0)e-7의 0.2%이고 Roche를
        채운 정면 고리조차 4%다(실측이 실재라면 포말하우트 b급 먼지구름 규모가 필요). hook은 테마적 착상이지 측광
        설명이 아니다.
    refs: ["2004.06685", "docs/reference/debris-disk-color-methodology.md", "docs/reference/ice-stability-methodology.md"]

  - body: Proxima Cen c
    axis: satellites
    status: gated
    driver: [fiction, engine]
    narrative: >
      위성 1개 = Proxima c I. 반경 ~950 km(트리톤/티타니아급, 명왕성 느낌)(N₂/CH₄ 얼음 + 톨린 적화 다양 지형), 고유명 없음, c에
      조석고정. c는 큰 Hill 반경(~900만 km, 안정역 ~270–450만 km)이라 안정 위성 가능. 판도라식 독자 facet-walk로 별도
      바디 전개(아래 "Proxima Centauri c I" 블록 11축).
      관측 근거 0이고, art-first 픽션 위성(오너 결정 2026-06-23, 다양성). b/d와 달리 c는 원거리·대Hill이라 안정 위성 물리적
      가능(불가 아님). 명왕성 아날로그는 물리 정합(명왕성=~40K 냉 얼음+톨린). emit시 stability-sim 필수([[project_nearstars_stability_sim]] Hill+MEGNO).
      정밀 질량/궤도는 위성 독자 walk(G3)서 확정. 명명=모행성+로마숫자(Proxima c I).
    gate:
      criterion: [fiction, stability, hill-stability]
      verdict: owner-override

  - body: Proxima Cen c
    axis: gameplay
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "항성간 플래그십 + 시스템 최외곽(1.5 AU 도달 부담), 냉·dim".
      2026-08-04: 산문을 gameplay 3부 형태(특별한 점 → 바이옴 목록 → 명소)로 다시 썼다. evidence의
      오너 검토 로그를 여기로 옮겼고, c의 존재가 미확정이라는 유보를 evidence에 추가했다. 구획·수치 무변경.
    status: gated
    driver: [engine]
    narrative: >
      There is no solid surface, so landing is out and only atmospheric flight and orbit are available. The science
      map splits into five: Equatorial / North
      Temperate / South Temperate / North Polar / South Polar. Being the only freely rotating planet here, its zones
      follow latitude rather than the angle to the star. The ring shadow and the moon are excluded, neither being
      fixed ground. The most worthwhile is the equatorial belt at ring plane, where the double ring folds edge-on into
      a single bright line and its shadow falls straight down.
    narrative_ko: >
      고체 표면이 없어 착륙은 불가하고 대기 비행과 궤도만 가능하다. 과학 지도는 다섯으로 갈린다. 적도대(Equatorial) / 북온대(North Temperate) / 남온대(South Temperate) /
      북극(North Polar) / 남극(South Polar). 이 계에서 유일한 자유 자전 행성이라 구획이 별을 향한 각도가 아니라
      위도를 따른다. 고리 그림자대와 위성은 고정된 땅이 아니어서 제외했다. 그중 가장 볼 만한 곳은 고리면의
      적도대로, 2중 고리가 옆에서 한 줄기 밝은 선으로 접히고 그림자가 곧게 내리꽂힌다.
    narrative_ko: >
      내려앉을 땅이 없으니 이곳은 지나며 날고 둘레를 도는 행성이고, 그럼에도 찾아갈 값어치는 하늘에 있다. 붉은 띠와
      흰 띠로 된 2중 고리, 그리고 제 위성이 걸려 있다. 이 계에서 유일하게 자유롭게 자전하는 행성이라 지도도 보통
      세계처럼 위도로 갈린다. 적도대, 남북의 온대 띠, 남북의 극지, 모두 다섯이다. 그 띠들을 가로질러 훑고 가는 고리
      그림자는 별도의 구역이 아니라 볼거리이고, 위성도 그렇다. 그중 백미는 고리면의 적도대다. 고리가 옆에서 보여
      한 줄기 밝은 선으로 접히고, 그림자가 곧게 내리꽂힌다.
    fields:
      - name: science_biomes
        value: "위도 5띠: 적도대/북온대/남온대/북극/남극 (고리 그림자대 제외)"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
      criterion: [gameplay]
      verdict: pass-in-window
      evidence: >
        채택값은 위도 5띠와 착륙 불가다.
        확인: 자유 자전이라 별을 향한 각도가 아니라 위도가 기후를 가르므로, 조석고정된 b·d의 항성경도 동심원과
        반대 방식이 맞다. 고체 표면이 없어 flying·in-space만 성립하고 landed·splashed 토큰은 비활성이다. 고리
        그림자대와 위성은 고정된 표면 구역이 아니므로 biome에서 빼고 시각·탐사 피처로 둔다. SOI는 질량에서
        자동으로 나온다.
        유보: 이 행성의 존재 자체가 확정되지 않았다. 그러니 이 구획도 c가 있다는 가정 위에 있다.

