      τ_lock ≫ 나이) → 자유자전, 자전주기 ~27h(오너 결정, 해왕성형보다 약간 느린 자전; 미구속이라 art 선택). 경사각·절대 배향 = 천체측정
      논쟁이라 자유 emit. 진질량 = Msini×1.1547 ≈ 8 M⊕(등방 중앙값, b·d 선례 일관)이고, "c 존재 가정 하" 전제.
    fields:
