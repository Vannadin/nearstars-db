        note_ko: "≈0 = Cassini State 1 (계산). |g|/α=8e-4 (c의 J₂ 구동 g + 동기 α) → ε₁≲0.004° (갈릴레이 위성급, 사실상 0). method=cassini-state-obliquity-methodology.md"
