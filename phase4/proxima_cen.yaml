  - body: Proxima Cen d
    axis: appearance
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: 감사 X4 — 이 행이 폐기된 단색 #34302c에서 표시색을 뽑고 있었다. surface 행(G5)이
      자기권 차폐 재근거화로 중위도 #3c3833 · 자기극관 #2a2622의 2-tone으로 대체한 뒤에도 appearance와
      base_color가 갱신되지 않아 극관이 통째로 빠져 있었다. 구값 "#34302c → Proxima-lit ~#36281a".
      Proxima-lit은 고유색에 항성 표시색 #ffcc75(정규화 1.0/0.800/0.459)를 채널 곱한 값이다. 같은 연산으로
      구 단색을 다시 계산하면 #342614가 나오므로, 기록돼 있던 ~#36281a는 순수 곱이 아닌 눈대중 값이었다.
      색 정밀화는 emit 말미 art-pass 몫이라는 정책은 그대로다.
