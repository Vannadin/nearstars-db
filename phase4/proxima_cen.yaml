  - body: Proxima Cen c I
    axis: orbit
    status: gated
    driver: [window-selection, engine]
    narrative: >
      The moon rides the outer edge of the planet's radiation belt, 110,000 km out, close enough to graze the trapped
      particles and far enough that the tides push it outward rather than in. That distinction decides everything:
      inside 5.3 planetary radii the planet's 27-hour spin is slower than the orbit, and a moon there spirals down
      into the rings within a few hundred million years, the fate Phobos is meeting at Mars. Out here it retreats
      instead, slowly enough to be imperceptible. It keeps one face to the planet, locked within a hundred thousand
      years of forming, and the orbit is circular for the same tidal reason.
    narrative_ko: >
      위성은 행성 방사선대의 바깥 테두리를 타고 돈다. 11만 km 거리이고, 포획된 입자를 스칠 만큼 가깝지만 조석이
      위성을 안쪽이 아니라 바깥으로 밀어낼 만큼은 멀다. 이 구분이 모든 것을 정한다. 반지름 5.3배 안쪽에서는 행성의
      27시간 자전이 위성의 공전보다 느려서, 그 자리의 위성은 수억 년 안에 고리로 감겨 내려간다. 화성에서 포보스가
      맞고 있는 운명이다. 여기서는 반대로 물러나며, 그 속도는 알아챌 수 없을 만큼 느리다. 행성을 향해 한쪽 면만
      보이는데 생긴 뒤 십만 년 안에 잠겼고, 궤도가 원인 것도 같은 조석 때문이다.
    fields:
      - name: semi_major_axis_au
        value: 7.3592e-4
        unit: AU
        op: set
        note: "= 110,093 km = 6.4 R_c (owner, 2026-08-05). Just inside the outer belt's equatorial edge at 6.52 R_c and outside synchronous orbit at 5.31 R_c; orbits in c's equatorial plane; Omega/omega/M free at emit. The field name ends in _au, so leaving a km value here would be an emit accident (converted 2026-07-12)"
        note_ko: "= 110,093 km = 6.4 R_c (오너 2026-08-05). 방사선 외대 적도 외곽 6.52 R_c 바로 안쪽 + 동기궤도 5.31 R_c 바깥; c 적도면 공전; Ω/ω/M 자유 emit; 필드명이 _au라 km 값 그대로 두면 emit 사고(2026-07-12 환산)"
      - name: eccentricity
        value: 0
        op: set
        note: "Tidally circularized e~0 (physically forced, not a default). With no atmosphere the atmospheric-curve divide-by-zero trap does not apply; just confirm at emit"
        note_ko: "조석 원형화 e≈0 (물리 강제, 기본값 아님). 대기 없음이라 대기 곡선 0-나눗셈 트랩 무관; emit시 확인만"
      - name: orbital_period
        value: 35.7
        unit: h
        op: set
        note: "= 1.49 days (Kepler, a 6.4 R_c with M_c 8 M⊕). Same as the rotation period"
        note_ko: "= 1.49일 (케플러, a 6.4 R_c·M_c 8 M⊕). 자전과 같음"
      - name: tidal_lock
        value: "1:1 (locked within ~10⁴-10⁵ years)"
        value_ko: "1:1 (~10⁴–10⁵년 잠김)"
        op: set
        note: "τ scales as a⁶, so 17× slower than at 4 R_c, yet still instant against the system's age"
        note_ko: "τ∝a⁶라 4 R_c 대비 17배 느리지만 여전히 나이에 비해 순간"
    provenance: >
      2026-06-23: 오너가 "고리 바로 바깥" 의도로 a=4 R_c(69,000 km) 확정. 근거는 바깥 고리 가장자리 shepherd.
      2026-08-05: 조석 진화 검산으로 4 R_c 철회. c의 자전 27시간이 만드는 동기궤도가 5.31 R_c라 4 R_c는 그
      안쪽이고, 포보스형 안쪽 감김으로 190~570 Myr에 고리로 낙하한다(포보스 실측 2 cm/yr를 2배 안에서 재현하는
      da/dt = 3(k2/Q)(Mm/Mp)·n·a·(Rp/a)⁵로 계산). 오너가 방사선 외대에 살짝 걸치는 6.4 R_c를 택해 동기궤도 밖으로
      이동. 고리 외경의 역학적 근거는 shepherd에서 얼음 Roche 한계 3.3 R_c로 교체(고리 3.0 R_c는 그 바로 안쪽).
      같은 날 벨트 안쪽 테두리(3.64 R_c) 배치도 검토했다. c 자전을 27 → 16시간(빙거성 실측 대역)으로 낮추면 동기궤도가
      3.77 R_c로 내려와 성립하고 편평도 5.84%로 계란형이 부활하지만, 오너가 바깥쪽 경계를 택해 채택하지 않았다.
      비교 그림 docs/img/proxima-c-i-orbit-edge-compare.png.
    gate:
      criterion: [stability, classification]
      verdict: pass-in-window
      evidence: >
        The adopted values are a 6.4 R_c orbit (110,093 km), e 0, a 35.7-hour orbit and rotation, and a 1:1
        tidal lock. Verified: the orbital radius was placed between two boundaries. The outer belt's equatorial
        edge is at (2.8+2.5)/√0.66 = 6.52 R_c and synchronous orbit is at 5.31 R_c, so 6.4 R_c falls in the only
        width that grazes the belt while remaining outside synchronous orbit. Being outside synchronous orbit is
        decisive because it flips the sign of tidal migration: inside, a moon spirals in; outside, it retreats,
        and here it recedes by 0.2–0.7 cm per year, harmless over the whole age. The formula reproduces Phobos'
        measured recession rate to within a factor of two. Tidal locking takes 10⁴–10⁵ years by despin τ∝a⁶,
        instant against the age, and the orbit sits deep inside the Hill stable zone (2.7–4.5e6 km). Caveat:
        k2/Q is order-uncertain for a mini-Neptune with no observations. But at 6.4 R_c the sign is on the safe
        side, so that uncertainty does not overturn the verdict; conversely 4 R_c fails to survive the age for
        any k2/Q.
      evidence_ko: >
        채택값은 a 6.4 R_c(110,093 km), e 0, 공전·자전 35.7시간, 1:1 조석고정이다.
        확인: 궤도 반경은 두 경계 사이에 끼워 정했다. 방사선 외대의 적도 외곽이 (2.8+2.5)/√0.66 = 6.52 R_c이고
        동기궤도가 5.31 R_c이므로, 6.4 R_c는 벨트를 스치면서 동기궤도 밖에 남는 유일한 폭 안에 있다. 동기궤도 밖이
        결정적인 이유는 조석 이동 부호가 뒤집히기 때문이다. 안쪽이면 감기고 밖이면 물러나는데, 여기서는 바깥으로
        연간 0.2~0.7 cm 물러나 나이 전체에 걸쳐 무해하다. 계산식은 포보스의 실측 후퇴 속도를 2배 안에서 재현한다.
        조석고정은 despin τ∝a⁶로 10⁴~10⁵년이라 나이에 비해 순간이고, Hill 안정역(270~450만 km) 깊숙이 든다.
        유보: k2/Q는 미니 해왕성에서 관측이 없어 자릿수 불확실하다. 다만 6.4 R_c는 부호가 안전한 쪽이라 이 불확실성이
        판정을 뒤집지 않는다. 반대로 4 R_c는 어떤 k2/Q를 넣어도 나이를 못 버틴다.
    refs: ["docs/reference/tidal-locking-timescale-methodology.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]

  - body: Proxima Cen c I
    axis: bulk                        # §3.2 템플릿 앵커
    body_class: tidally_locked
