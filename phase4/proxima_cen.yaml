      의존하므로 0.0217 → 5.34e-3으로 4배 줄었고, J₂ 4.70e-3·C̄₂₂ 1.41e-3·flattening 1.18%가 되어 가시 임계 2%
      아래로 내려갔다. 계란형 메쉬 emit 대상에서 제외. 자전은 공전과 같아 17.7 → 35.7시간.
    gate:
      criterion: [fiction, error-bar]
      verdict: pass-in-window
      evidence: >
        The adopted values are a diameter of 652 km, a density of 1.6 g/cm³, a mass of 2.32e20 kg, g 0.146 m/s²
        and a flattening of 1.18%. Verified: as a fictional body the mass was computed self-consistently from
        the owner's chosen diameter and density, and the density of 1.6 corresponds to a rock mass fraction of
        0.59 between water ice at 0.93 and rock at 3.2, placing it between Charon (1.70) and Mimas (1.15). A
        radius of 326 km is larger than the spherical Mimas (198 km), so hydrostatic equilibrium holds and the
        shape is a sphere. The figure comes from the rotation parameter the orbit sets, q_s = n²/(G·ρ·4π/3) =
        5.34e-3, and the tidal cross-check (M_c/M_cI)(R/a)³ gives the same value. Because q_s is fixed by
        density and orbit rather than radius, changing the size does not change the flattening; retreating to
        6.4 R_c is what lowered it to 1.18%. Below the 2% visibility threshold, the egg shape is not an emit
        target and enters gravity only. Caveat: with no observations at all, every value on this fictional moon
        is an owner choice or a derivation from one. Tidal heating is set to zero because the orbit is circular,
        but adding a resonance partner later would open Io-class heating through a forced eccentricity.
      evidence_ko: >
        채택값은 지름 652 km, 밀도 1.6 g/cm³, 질량 2.32e20 kg, g 0.146 m/s², flattening 1.18%다.
        확인: 픽션 천체이므로 질량은 오너가 정한 지름과 밀도에서 자기일관하게 계산했고, 밀도 1.6은 물얼음 0.93과
        암석 3.2 사이에서 암석 질량비 0.59에 해당해 카론(1.70)과 미마스(1.15) 사이에 든다. 반경 326 km는 구형인
        미마스(198 km)보다 크므로 유체정역학 평형이 성립하고 형태는 구다. figure는 궤도가 정한 회전 파라미터
        q_s = n²/(G·ρ·4π/3) = 5.34e-3에서 나왔고, 조석 검산 (M_c/M_cI)(R/a)³이 같은 값을 준다. q_s가 반지름이
        아니라 밀도와 궤도만으로 결정되므로 크기를 바꿔도 편평도는 변하지 않고, 6.4 R_c로 물러난 것이 1.18%로
        낮춘 원인이다. 가시 임계 2% 아래라 계란형 메쉬는 emit 대상이 아니고 중력에만 반영한다.
        유보: 관측이 전혀 없는 픽션 위성이라 모든 값이 오너 선택과 그로부터의 도출이다. 궤도가 원이어서 조석가열은
        0으로 두지만, 나중에 공명 파트너를 넣으면 강제 이심률로 이오급 가열이 열린다.

  - body: Proxima Cen c I
    axis: atmosphere
    status: gated
    driver: [window-selection]
    narrative: "None. Too small to hold gas: airless Charon is nearly twice its size."
    narrative_ko: "없음. 기체를 붙잡기에 너무 작다. 대기가 없는 카론이 이 위성의 두 배 가까이 된다."
    fields:
      - name: composition
        value: null
        na_reason: "No bound atmosphere. Sublimated vapor is a collisionless exosphere below the nanopascal level, treated as airless in KSP"
        na_reason_ko: "결속 대기 없음. 승화 증기는 nPa 이하 무충돌 엑소스피어라 KSP 무대기 처리"
      - name: pressure
        value: 0
        unit: Pa
        op: set
      - name: breathability
        value: false
        op: set
      - name: escape
        value: "Hydrodynamic blow-off (Jeans λ(N₂, 45 K) = 3.6, escape velocity 308 m/s)"
        value_ko: "유체역학적 날림 (Jeans λ(N₂,45K) = 3.6, 탈출속도 308 m/s)"
        op: set
    provenance: >
      2026-06-23: 명왕성 아날로그로 희박 N₂ 대기 1 Pa + 톨린 청색 haze를 채택. 근거는 "승화-지지 정상상태"와
      당시 반경 950 km(표기 v_esc ~0.97 km/s).
      2026-08-05: 오너가 지름 652 km를 확정하면서 철회. Jeans λ(N₂,45K) = 3.6으로, 대기를 실제로 못 가진
      카론(λ 11)보다도 아래다(명왕성 62·트리톤 94·타이탄 125가 보유 기준선). 승화-지지 논거도 무너진다. 증기압
      평형은 대기가 있어야 승화와 응결이 상쇄되는 것이므로, 대기가 날아가는 천체에서는 자유 승화가 되어 N₂ 얼음
      자체가 남지 않는다(표면 행이 물얼음 기반암으로 바뀐 이유). 판정 그림 docs/img/moon-atmosphere-feasibility.png.
      같은 날 오너 지시로 산문을 부재 표기 한 줄로 압축.
    gate:
      criterion: [classification, derived-grounding]
      verdict: methodology-derived
      evidence: >
        The adopted value is no bound atmosphere. Verified: judged by the Jeans parameter λ = GMμ/kTR, which
        gives 3.6 at 45 K. The blow-off boundary is about 25 and the Gyr-retention boundary about 60, and
        measurements support that line: Pluto at 62, Triton at 94 and Titan at 125 have atmospheres and lie
        above, while airless Charon at 11 and Enceladus at 1.3 lie below. That Charon, larger than this moon,
        has no atmosphere is the direct counterexample. Caveat: retention is only a necessary condition.
        Ganymede at λ 115 is in the retention zone yet has no atmosphere, because N₂ cannot stay as ice at 110
        K. Here both conditions fail, so the conclusion is not split.
      evidence_ko: >
        채택값은 결속 대기 없음이다.
        확인: Jeans 매개변수 λ = GMμ/kTR로 판정했고 45 K에서 3.6이 나온다. 날림 경계가 약 25, Gyr 보유 경계가 약
        60이며, 실측이 그 선을 뒷받침한다. 대기를 가진 명왕성 62·트리톤 94·타이탄 125가 위, 대기가 없는 카론 11·
        엔셀라두스 1.3이 아래다. 이 위성보다 큰 카론이 대기가 없다는 것이 직접 반례다.
        유보: 보유 판정은 필요조건일 뿐이다. 가니메데는 λ 115로 보유 영역인데도 110 K에서 N₂가 얼음으로 남지 못해
        대기가 없다. 여기서는 두 조건이 모두 부정이라 결론이 갈리지 않는다.
    refs: ["docs/reference/exoplanet-atmosphere-methodology.md", "docs/reference/ice-stability-methodology.md"]

  - body: Proxima Cen c I
    axis: surface
    refs: ["docs/reference/surface-color-albedo-methodology.md", "docs/reference/crater-degradation-methodology.md",
           "docs/reference/ice-stability-methodology.md"]
    status: gated
    driver: [fiction, art-direction]
    narrative: >
      Water ice bedrock, stained dark red where the planet's radiation belt has worked on it longest. The moon grazes
      the belt's outer edge, and because the belt sweeps around the planet faster than the moon can orbit, the
      particles overtake it and rain onto the trailing hemisphere, breaking down the methane
      and carbon dioxide locked in the ice into heavy organics. It is the same reddening that darkens the trailing
      hemispheres of Jupiter's icy moons, and for the same reason. Against that stained ground sit two kinds of bright terrain: the fresh ice thrown
      up by young craters, and a pale circular patch on the face turned toward the planet, where ice drifting off the
      rings settles faster than the radiation can darken it. The craters themselves never heal here, since ice this
      cold does not flow, so the surface is a saturated record of every impact it has taken.
    narrative_ko: >
      물얼음 기반암이고, 행성 방사선대가 가장 오래 작업한 곳이 어두운 붉은색으로 물들어 있다. 위성이 벨트의 바깥
      테두리를 스치는데, 벨트는 위성이 공전하는 것보다 빠르게 행성을 돌기 때문에 입자가 위성을 추월해 뒤따르는
      반구에 쏟아진다. 그것이 얼음에 갇힌 메탄과 이산화탄소를 무거운 유기물로 분해한다. 목성의 얼음 위성들이
      후행 반구부터 어두워지는 것과 같은 이유다. 그 물든 바탕 위에 밝은 지형이
      두 종류 놓인다. 젊은 크레이터가 파올린 신선한 얼음, 그리고 행성을 마주보는 면의 창백한 원형 얼룩이다. 그 얼룩은
      고리에서 흘러온 얼음이 방사선이 어둡게 만드는 속도보다 빠르게 내려앉는 자리다. 크레이터는 여기서 결코 아물지
      않는다. 이만큼 차가운 얼음은 흐르지 않기 때문이다. 그래서 표면은 자기가 받아낸 모든 충돌의 기록이 포화된 상태로
      남아 있다.
    fields:
      - name: surface_type
        value: "Water-ice bedrock (Charon analog) with radiolytic tholin reddening on the trailing hemisphere, fresh-ice craters, and sub-c ring-ice coating patches"
        value_ko: "물얼음 기반암 (카론 아날로그) + 후행 반구 방사분해 톨린 적화 + 신선얼음 크레이터 + sub-c 고리얼음 코팅 얼룩"
        op: set
      - name: albedo
        value: "~0.25-0.45 (Bond, within Charon's 0.25-0.38 band; lower where reddened, higher on fresh ice and the sub-c patches)"
        value_ko: "~0.25–0.45 (Bond, 카론 0.25~0.38 대역; 적화부 낮고 신선얼음·sub-c 얼룩 높음)"
        op: set
      - name: crater_state
        value: "Saturated (relaxation, burial and weathering channels are all absent)"
        value_ko: "포화 (이완·매몰·풍화 채널 모두 부재)"
        op: set
        note: "Water ice at 40-50 K sits at T/T_melt 0.17, so relaxation is switched off, and there is no atmosphere or volcanism; only diffusion remains, and erasing a 1 km crater would take longer than the system's age"
        note_ko: "40~50 K 물얼음은 T/T_melt 0.17로 이완 꺼짐, 대기·화산 없음 → 확산만 남고 1 km 크레이터 소거에 계 나이 초과"
    provenance: >
      2026-06-23: 명왕성/트리톤 아날로그로 적도 톨린대 + 극 N₂/CH₄ 빙관 + sub-c eyeball을 채택.
      2026-08-05: 대기 철회에 따라 N₂/CH₄ 극관을 뺐다. 대기 없이는 자유 승화로 N₂ 얼음이 남지 않는다(대기 행 참조).
      대체 서사는 카론 아날로그다. 붉은 유기물의 근원을 휘발성 광화학에서 벨트 방사분해로 옮겼고, 6.4 R_c가 방사선
      외대를 스치는 궤도라 그 공급이 실제로 있다. 위도 구조(적도대/극관) 대신 반구 구조(후행 반구 적화 / sub-c 얼룩)로
      바뀐 것이 시각적 귀결이다. 크레이터 포화는 크레이터 풍화 문서의 판정을 새로 반영한 항목이다.
    gate:
      criterion: [classification, visual-checklist, derived-grounding]
      verdict: methodology-derived
      evidence: >
        The adopted values are water-ice bedrock with radiolytic reddening, fresh-ice craters and sub-c patches,
        with cratering at saturation. Verified: three separate checks. The ice species comes from the
        ice-stability doc: at 40–50 K water ice is permanently stable while N₂ cannot persist without an
        atmosphere. The crater state comes from the channel comparison in the crater-degradation doc: relaxation
        switches off at T/T_melt 0.17, burial and weathering have no source, and only diffusion remains, which
        would take longer than the system's age to erase a 1 km crater. The reddening is set by the orbit: 6.4
        R_c is just inside the outer belt's equatorial edge at 6.52 R_c, so charged-particle influx is real, and
        radiolysis of CH₄ and CO₂ within ice producing heavy organics is the mechanism that explains the dark
        material on Jupiter's icy moons. The face it strikes is the trailing hemisphere: c's 27-hour rotation is
        faster than the moon's 35.7-hour orbit, so the co-rotating plasma overtakes the moon and hits it the
        same way it does the Galilean satellites. The colors were obtained through the surface-color doc's
        engine, mixing water-ice and tholin optical constants. Caveat: with no observations on a fictional moon,
        the strength of the hemispheric contrast is an art choice. The sub-c patches rest on the premise that
        ring material diffuses out to the moon, and the transport efficiency between the ring's 3.0 R_c outer
        edge and the 6.4 R_c orbit was not computed.
      evidence_ko: >
        채택값은 물얼음 기반암에 방사분해 적화, 신선얼음 크레이터, sub-c 얼룩이고 크레이터는 포화 상태다.
        확인: 세 갈래로 검증했다. 얼음 종류는 얼음 안정성 문서로, 40~50 K에서 물얼음은 영구 안정이고 N₂는 대기 없이
        존속 불가다. 크레이터 상태는 크레이터 풍화 문서의 채널 대조로, 이완은 T/T_melt 0.17에서 꺼지고 매몰과 풍화는
        공급원이 없어 확산만 남는데 그 채널로는 1 km 크레이터 소거에 계 나이를 넘긴다. 적화는 궤도가 정한다. 6.4 R_c는
        외대 적도 외곽 6.52 R_c 바로 안쪽이라 하전입자 유입이 실재하고, 얼음 속 CH₄·CO₂의 방사분해가 무거운 유기물을
        만드는 것은 목성 얼음 위성의 어두운 물질을 설명하는 기작이다. 맞는 면은 후행 반구다. c의 자전 27시간이
        위성 공전 35.7시간보다 빨라 함께 도는 플라스마가 위성을 추월하므로, 갈릴레이 위성들과 같은 방향으로 때린다. 색은 표면색 문서의 엔진으로
        물얼음과 톨린 광학상수를 섞어 얻었다.
        유보: 관측이 없는 픽션 위성이라 반구 대비의 세기는 아트 선택이다. sub-c 얼룩은 고리 물질이 위성까지 확산한다는
        전제에 기대는데, 고리 외경 3.0 R_c와 궤도 6.4 R_c 사이의 수송 효율은 계산하지 않았다.

  - body: Proxima Cen c I
    axis: appearance
    refs: ["docs/reference/surface-color-albedo-methodology.md", "docs/reference/hapke-shader-methodology.md"]
    status: gated
    driver: [art-direction]
    narrative: >
      Two hemispheres that barely look like the same body. The side that trails the moon around its orbit is a dark
      rust brown, worked over by the radiation belt overtaking it; the side facing the planet carries a pale ring-ice patch bright
      enough to read as a second, smaller disk. Between them the ground is grey-white water ice, pocked everywhere
      with craters that will never soften, and the youngest of those craters cut bright rays into the rust. There is
      no limb glow of any kind, since there is no air. Against ochre b, pale grey-blue c and grey-brown d, this one
      is the rust-and-bone body.
    narrative_ko: >
      두 반구가 같은 천체로 보이지 않을 만큼 다르다. 궤도를 뒤따르는 쪽은 추월해 오는 방사선대에 시달려 어두운
      녹빛 갈색이고,
      행성을 마주보는 쪽은 창백한 고리얼음 얼룩이 또 하나의 작은 원반처럼 읽힐 만큼 밝다. 그 사이의 바탕은 회백색
      물얼음이며 결코 부드러워지지 않을 크레이터가 온 면에 박혀 있고, 그중 가장 젊은 것들은 녹빛 위에 밝은 광선을
      새긴다. 지평선의 빛무리는 어떤 종류도 없다. 공기가 없기 때문이다. 황토색인 b, 창백한 회청색인 c, 회갈색인 d
      사이에서 이 천체는 녹빛과 뼛빛을 맡는다.
    fields:
      - name: base_color
        value: "Grey-white water ice #d3d8dc base with a rusty brown trailing hemisphere #6e4632 and sub-c fresh ice #e8eef0"
        value_ko: "회백 물얼음 #d3d8dc 바탕 + 후행 반구 녹빛 갈색 #6e4632 + sub-c 신선얼음 #e8eef0"
        op: set
      - name: haze
        value: null
        na_reason: "With no atmosphere there is no haze layer. The blue haze limb was retired along with the atmosphere (2026-08-05)"
        na_reason_ko: "대기가 없어 연무층이 성립하지 않는다. 청색 haze 림은 대기 철회와 함께 폐기(2026-08-05)"
      - name: surface_detail
        value: "Saturated cratering plus bright ray systems around the young craters"
        value_ko: "포화 크레이터 + 젊은 크레이터의 밝은 광선계 (ray crater)"
        op: set
      - name: hapke_terrain
        value: 0.43
        op: set
        note: "Icy / dark-grain family. Sol's own Charon is 0.43."
        note_ko: "얼음/어두운 입자 패밀리. Sol의 카론 자신이 0.43"
      - name: hapke_scaled
        value: 2.2
        op: set
        note: "Full-disk phase behaviour (Sol's class convention)."
        note_ko: "원반 위상 거동(Sol 클래스 컨벤션)"
      - name: hapke_porosity_k
        value: 1.86
        op: set
        note: "Hapke 2008 K(φ) computed; optical-layer filling factor φ ~ 0.49 (51% porosity)."
        note_ko: "Hapke 2008 K(φ) 계산, 광학층 충전율 φ≈0.49 (51% 다공)"
      - name: hapke_theta
        value: 23
        unit: deg
        op: set
        note: "Charon analog. A fitted parameter, so an analog choice rather than a derivation."
        note_ko: "카론 아날로그. 적합 파라미터라 도출이 아닌 아날로그 선택이다."
      - name: albedo_mean
        value: 0.4
        op: set
        note: "Charon's p_v 0.41 band; Bond ~0.25-0.45 stays on the surface row."
        note_ko: "카론 p_v 0.41 대역; Bond ~0.25–0.45는 surface 행"
    provenance: >
      2026-06-23: 명왕성 룩(적도 톨린대 + 크림 극관 + 청색 tholin haze 림)을 채택.
      2026-08-05: 대기 철회로 haze 림을 폐기하고, 위도 구조를 반구 구조로 교체(표면 행과 동일 결정). 색 자체는
      톨린 적갈과 물얼음 회백을 유지하되 배치가 바뀌었다.
      2026-08-07: Hapke shader scalars + mean visual albedo added (hapke_terrain / hapke_scaled / hapke_porosity_k / hapke_theta / albedo_mean) per docs/reference/hapke-shader-methodology.md; K computed from the packing formula, theta anchored by analog. No prior value changed.
    gate:
      criterion: [visual-checklist]
      verdict: pass-in-window
      evidence: >
        The adopted look is a grey-white water-ice base with a rusty brown trailing hemisphere, sub-c fresh-ice
        patches and saturated cratering. Verified: the colors came from the surface-color doc's engine using
        water-ice and tholin optical constants, and the layout follows the surface row's terrain decisions
        unchanged. The absence of haze follows directly from the Jeans verdict in the atmosphere row. The
        palette was also checked against the other three bodies in the system to avoid overlap. Caveat: the
        strength of the hemispheric contrast and the density of the ray systems are art choices.
      evidence_ko: >
        채택값은 회백 물얼음 바탕에 후행 반구 녹빛 갈색, sub-c 신선얼음 얼룩, 포화 크레이터다.
        확인: 색은 표면색 문서의 엔진으로 물얼음과 톨린 광학상수에서 얻었고, 배치는 표면 행의 지형 결정을 그대로
        따른다. 연무가 없다는 것은 대기 행의 Jeans 판정에서 직접 따라온다. 계 안의 다른 세 천체와 색이 겹치지
        않는지도 대조했다.
        유보: 반구 대비의 세기와 광선계의 밀도는 아트 선택이다.

  - body: Proxima Cen c I
    axis: magnetism.magnetic_field
    refs: ["docs/reference/rocky-planet-dynamo-methodology.md"]
    status: gated
    driver: [fiction]
    provenance: >
      2026-06-23: owner confirmed no field.
      2026-08-07: prose modernization, owner-confirmed (EN+KO absence story,
      3-part evidence, decision date moved here). No value changed.
    narrative: >
      None. An ice body this size has no metal core to run a dynamo, and with no subsurface ocean there is
      no induced field either. Its magnetic environment belongs entirely to the planet: instead of carrying
      a field of its own, the moon rides through someone else's radiation belt.
    narrative_ko: >
      없음. 이만한 얼음체는 다이너모를 돌릴 금속핵이 없고, 지하 바다가 없어 유도장도 생기지 않는다. 자기 환경은
      전적으로 행성의 몫이라, 위성은 제 장을 갖는 대신 남의 방사선대 속을 지난다.
    fields:
      - name: magnetic_field
        value: "none (a small icy body with no dynamo, and negligible induced field; inside c's magnetosphere at 6.4 R_c, just inside the outer belt)"
        value_ko: "none (소형 얼음체 무dynamo, 유도장도 미미; c 자기권 6.4 R_c 내부, 외대 안쪽)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        No magnetic field is fixed. Verified: this is typical of a small icy moon (no metallic-core convection),
        and with e≈0 under tidal lock there is no tidal heating, so no conducting subsurface ocean forms and the
        Europa-style induced-field route is closed too. The magnetic environment of the orbit is set by c's
        magnetosphere and the environment row.
      evidence_ko: >
        자기장 부재 확정. 확인한 것: 소형 얼음 위성 전형(금속핵 대류 없음)이고, e≈0 조석고정이라 조석 가열이
        없어 전도성 지하 바다가 만들어지지 않고 Europa식 유도장 경로도 닫힌다. 궤도의 자기 환경은 c의 자기권과
        environment 행이 정한다.

  - body: Proxima Cen c I
    axis: environment
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md",
           "docs/reference/surface-radiation-dose-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      Sheltered from the star, exposed to the planet. The planet's magnetosphere takes the stellar wind and the flare
      particles, so nothing arrives from Proxima directly, but the orbit grazes the outer edge of the trapped-particle
      belt and those particles reach the ground without an atmosphere to stop them. That is the dose that matters
      here, a couple of rad an hour at the surface, and it is also the engine behind the reddened leading hemisphere.
      Galactic cosmic rays add a steady floor on top, unfiltered because Proxima's astrosphere is small.
    narrative_ko: >
      별로부터는 가려져 있고 행성에게는 노출되어 있다. 항성풍과 플레어 입자는 행성의 자기권이 받아내므로 프록시마에서
      직접 오는 것은 없다. 그러나 궤도가 포획 입자대의 바깥 테두리를 스치고, 그 입자들은 막아줄 대기가 없어 지표까지
      닿는다. 여기서 문제가 되는 선량은 그것이고, 표면에서 시간당 수 rad 수준이다. 이것이 앞서 가는 반구를 붉히는
      엔진이기도 하다. 그 위로 은하 우주선이 꾸준한 바닥선을 얹는데, 프록시마의 항성권이 작아 걸러지지 않는다.
    fields:
      - name: radiation
        value: "Moderate (stellar-origin radiation is shielded by c's magnetosphere, but the moon takes trapped outer-belt particles directly, ~1-2 rad/h, plus unshielded GCR)"
        value_ko: "중간 (항성 기원은 c 자기권이 차폐, 대신 외대 포획 입자를 직접 받음 ~1–2 rad/h + 비차폐 GCR)"
        op: set
        note: "6.4 R_c is just inside the outer belt's equatorial edge at 6.52 R_c. With no atmosphere there is no atmospheric attenuation"
        note_ko: "6.4 R_c는 외대 적도 외곽 6.52 R_c 바로 안쪽. 대기가 없어 대기 감쇠 없음"
      - name: stellar_wind
        value: "Shielded (inside c's magnetosphere, so c blocks direct stellar wind and flares)"
        value_ko: "차폐됨 (c 자기권 내부 → 항성풍·플레어 직격 c가 차단)"
        op: set
      - name: heliosphere
        value: "Deep in Proxima's astrosphere (by way of c)"
        value_ko: "Proxima astrosphere 심부 (c 경유)"
        op: set
    provenance: >
      2026-06-23: "시스템 최저 방사선"으로 확정. 근거는 c 자기권 차폐 + GCR만 비차폐이고, 톨린 적화의 주력을 GCR로 봤다.
      2026-08-05: 궤도가 6.4 R_c로 확정되며 재판정. 그 자리는 c의 방사선 외대 안쪽 테두리라 포획 입자를 직접 받고,
      대기가 없어 감쇠도 없다. 그래서 "최저"가 아니라 "중간"이며, 톨린 적화의 주력도 GCR에서 벨트 방사분해로 바뀐다
      (표면 행과 같은 결정). 항성풍 차폐는 그대로 유지.
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        The adopted values are shielding from stellar-origin radiation, direct exposure to trapped belt
        particles at ~1–2 rad/h, and an unshielded GCR floor. Verified: exposure was settled by comparing the
        orbit with the belt geometry. c's outer belt spans 0.37–6.52 R_c at the equator and the moon orbits at
        6.4 R_c, so it sits inside the belt's inner rim. The belt intensity is the 1.2 rad/h from the parent's
        radiation-belt row, and with no atmospheric column there is no surface-dose attenuation (the attenuation
        formula in the surface-dose doc requires a column density, which is zero here). The stellar-origin
        shielding follows from the moon sitting deep inside c's magnetosphere. Caveat: the belt intensity is
        itself the low-confidence regime call the methodology states, and the feedback in which the moon sweeps
        belt particles and carves a corridor along its own orbit was not included.
      evidence_ko: >
        채택값은 항성 기원 차폐, 벨트 포획 입자 직접 노출 ~1–2 rad/h, 비차폐 GCR 바닥선이다.
        확인: 노출 여부는 궤도와 벨트 기하의 대조로 정했다. c의 외대는 적도에서 0.37~6.52 R_c에 걸치고 위성 궤도가
        6.4 R_c이므로 벨트 안쪽 테두리에 든다. 벨트 세기는 모행성 방사선대 행의 1.2 rad/h이고, 대기 기둥이 없어
        표면 선량 감쇠가 걸리지 않는다(표면 선량 문서의 감쇠식은 기둥밀도를 요구하는데 여기서는 0이다). 항성 기원
        차폐는 위성이 c 자기권 심부에 있다는 사실에서 나온다.
        유보: 벨트 세기 자체가 방법론이 명시하는 저신뢰 레짐 콜이고, 위성이 벨트 입자를 쓸어내며 자기 궤도에 회랑을
        파는 되먹임은 넣지 않았다.

