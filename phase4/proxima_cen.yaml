# Proxima Centauri (α Cen C / GJ 551) Phase 4 결정 보드 — 별 + 행성 b/c/d. (body × axis) 행별 상태. DB 불변, staging 기록
# 실관측 시스템 → 대부분 Phase 3 측정/합성값 passthrough, 소수 art/divergence만 결정. grounding=docs/phase3/proxima-cen*.md
schema_version: 2
system: proxima_cen
status: staged
updated: 2026-07-12

decisions:
  # ── 별 (Proxima Cen, M5.5Ve 플레어 별) — facet-walk 2026-06-23 ──────────
  - body: Proxima Cen
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The closest star to the Sun. It is a red dwarf of an eighth of a solar mass, and the e on the end of its
      spectral type marks hydrogen emission: this is a flare star. It sits 13,000 AU from α Cen AB, bound so
      loosely that it is the system's third member while moving almost independently of the pair's orbit. Besides
      Proxima Centauri it also answers to α Cen C and GJ 551.
    narrative_ko: >
      태양에서 가장 가까운 별이다. 질량이 태양의 8분의 1뿐인 적색왜성이고, 분광형 끝의 e는 수소 방출선을 뜻한다.
      즉 이 별은 플레어 별이다. α Cen AB에서 13,000 AU 떨어져 아주 약하게 묶여 있어, 같은 계의 세 번째
      구성원이면서도 두 별의 궤도와는 거의 무관하게 움직인다. Proxima Centauri라는 이름 외에 α Cen C나
      GJ 551로도 불린다.
    fields:
      - name: body_type
        value: "M5.5Ve 적색왜성(플레어 별)"
        op: set
      - name: designation
        value: "Proxima Centauri (α Cen C / GJ 551)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        α Cen A·B(naked_eye, 밝은 별)와 달리 Proxima는 겉보기 11등이라 맨눈 불가 → category=confirmed(망원경 검출사와
        정합), naked_eye 아님. 오너 결정(a).

  - body: Proxima Cen
    axis: bulk                        # §3.2 템플릿 앵커 — 측정 passthrough 에코 (spin_axis·J2는 전용 행)
    refs: ["2025A&A...700A..11S", "2009A&A...505..205D", "2019A&A...627A.161P", "2012ApJ...757..112B", "1998AJ....116..429B", "2017A&A...598L...7K"]
    body_class: star
    status: passthrough
    narrative: >
      A small cold star: an eighth of the Sun's mass, a seventh of its radius, and a mere six-hundred-and-fortieth
      of its light. The surface runs at 2,900 K, less than half the Sun's, so most of that light leaves in the
      infrared. Packing that mass into that radius puts the surface gravity above 170 times Earth's. Rotation is
      slow at 83.5 days, which makes this star's day close to three Earth months. The age comes out near 4.85
      billion years, much like the Sun's, but it is a kinematic estimate, so whether Proxima was captured by
      α Cen AB or born alongside it remains open. Every value here is a high-confidence measurement.
    narrative_ko: >
      태양의 8분의 1 질량에 7분의 1 반지름, 밝기는 640분의 1에 그치는 작고 차가운 별이다. 표면은 2,900 K로
      태양의 절반이 채 안 되고, 그만큼 빛은 적외선 쪽으로 몰린다. 작고 무거운 몸집이라 표면 중력은 지구의
      170배가 넘는다. 자전은 83.5일로 느려서, 이 별의 하루는 지구의 석 달에 가깝다. 나이는 약 48억 년으로
      태양과 비슷하지만 운동학으로 얻은 값이라, α Cen AB에 나중에 붙잡힌 것인지 함께 태어난 것인지는 아직
      갈리지 않는다. 값은 모두 신뢰도 높은 실측이다.
    fields:
      - name: mass
        value: 0.1221
        unit: M_sun
        op: passthrough
        note: "±0.0022 (SM2025 진화모델)"
      - name: radius
        value: 0.141
        unit: R_sun
        op: passthrough
        note: "±0.011 (Demory2009 VLTI)"
      - name: gravity
        value: 1684
        unit: m/s2
        op: passthrough
        phase3_default: "GM/R² 파생 에코"
      - name: flattening
        value: 2.8e-8
        op: set
        note: "= (3J₂+q)/2 파생 에코 (J₂ 3.7e-9, q 4.4e-8), 시각 oblate 슬롯"
      - name: rotation_period
        value: 83.5
        unit: d
        op: passthrough
        note: "DB recommended, bulk.geopotential_j2 행과 동일 입력"
      - name: intrinsic_luminosity
        value: 0.00157
        unit: L_sun
        op: passthrough
      - name: age
        value: 4.85
        unit: Gyr
        op: passthrough
        note: "±0.5 (kinematic; 포획 vs 동시생성 미정). Teff 2904±51K (Passegger2019)"

  - body: Proxima Cen
    axis: appearance                  # [star] group 6 — 관측 기반 + 흑점 결정
    status: gated
    driver: [window-selection]
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: 산문을 문체 계약에 맞춰 다시 썼다. 폐기 이력을 여기로 옮겼다. 구 표시색 #c54c2a(심적색)은
      광도와 색조를 혼동한 render 짐작이라 폐기하고 실측 Pickles SED→CIE의 #ffcc75로 대체했다. 수치 필드는
      무변경이고 인용은 refs가 담는다.
    narrative: >
      In visible light this star shows a warm orange. Spots cover 3 to 5 percent of the surface, which makes it
      look blotchier than α Cen A or B. The darkening toward the limb is moderate for a red dwarf this size. The
      red hydrogen glow of a flare is recorded for reference, but a flicker that changes with time cannot go into
      a config file, so it stays out of the star's appearance.
    narrative_ko: >
      가시광에서 이 별은 따뜻한 주황색을 띠고 있다. 흑점이 표면의 3~5%를 덮고 있어 α Cen A·B에 비해
      얼룩덜룩해 보인다. 가장자리로 갈수록 어두워지는 정도는 이 크기의 적색왜성치고 온건하다. 플레어가 터질 때의
      붉은 수소 발광색은 참고로 적어 두지만, 시간에 따라 변하는 번쩍임은 설정 파일에 담을 수 없어 겉모습에는
      들어가지 않는다.
    fields:
      - name: color
        value: "#ffcc75"
        op: set
        phase3_default: "#c54c2a (심적색, 광도/색조 혼동 render 짐작 → 폐기)"
        note: "M5.5V 물리색, 실측 Pickles SED→CIE"
      - name: limb_darkening
        value: 0.4
        op: set
        note: "α~0.4 (Claret2018 M-dwarf 보간, tie-break)"
      - name: spots_faculae
        value: "~3–5% (보통~다소 많음; 83d 자전 변조 검출)"
        op: set
      - name: flares
        value: "#ff5e2a (Hα, 참조용; 동적 플레어 cfg 렌더 불가, visual passthrough)"
        op: set
    gate:
      criterion: [observation]
      verdict: methodology-derived
      evidence: >
        색 정정 2026-06-24. 물리색 #ffcc75(실측 Pickles SED→CIE)를 채택하고 옛 #c54c2a는 폐기. limb=tie-break passthrough.
        흑점량=오너 위임 결정(텍스처용) ~3–5%. 플레어 visual 드롭(KSP 동적 플레어 미지원, 오너 확인).
    refs: ["docs/reference/stellar-photospheric-color-methodology.md"]

  - body: Proxima Cen
    axis: magnetism.magnetic_field    # 측정
    refs: ["2008ApJ...684.1390R", "2021MNRAS.500.1844K"]
    status: passthrough
    narrative: >
      This star's magnetic field runs hundreds of times the Sun's. Averaged over the surface it reaches
      0.6 kilogauss, of which the large-scale dipole that actually extends out to the planets is 0.135 kilogauss.
      The rest is tangled at small scales and does not reach far. Being fully convective, it does not run the Sun's
      layered dynamo, which is how it holds a field this strong while turning slowly.
    narrative_ko: >
      이 별의 자기장은 태양의 수백 배에 달한다. 표면 전체를 평균하면 0.6 킬로가우스이고, 그중 행성까지 뻗는
      대규모 쌍극자 성분은 0.135 킬로가우스다. 나머지는 작은 규모로 얽혀 있어 멀리 미치지 못한다. 완전 대류
      별이라 태양처럼 층이 갈린 다이나모가 아니고, 그래서 느린 자전에도 이만한 장을 유지한다.
    fields:
      - name: magnetic_field
        value: 0.6
        unit: kG
        op: passthrough
        note: "평균 표면장 (Reiners&Basri2008/Reiners2022 CARMENES); 대규모 dipole 0.135 kG (Klein2021 ZDI, 주로 poloidal); spin incl 47°±7°"

  - body: Proxima Cen
    axis: environment.activity        # 플레어 별 핵심 — 측정
    # 2026-07-31: logR'HK -5.65±0.17 원출처를 SM2015 로 교정 (구 핀 2016MNRAS.459.3565S 는 ADS 미해결 오기였음)
    refs: ["1998AJ....116..429B", "2017MNRAS.464.3281W", "2015MNRAS.452.2745S", "2004A&A...417..651S"]
    status: passthrough
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: 산문을 문체 계약에 맞춰 다시 썼다. 본문에 있던 점검 로그를 여기로 옮겼다. 2026-07-12 점검에서
      사이클 인용을 Wargelin2024에서 2017(2017MNRAS.464.3281W)로 바꿔 DB recommended 핀과 정렬했다. 수치 필드는
      무변경이고 인용은 refs가 담는다.
    narrative: >
      The star looks quiet and detonates often. It turns slowly at 83.5 days and its quiescent chromospheric
      activity is low, yet flares arrive about 1.5 times a day. Superflares beyond anything the Sun offers come
      around three times a year, and one an order of magnitude larger about every other year. An old slow rotator
      flaring this often reads as a contradiction, and a seven-year activity cycle is what bridges it. X-ray
      brightness swings by more than a factor of thirty between quiescence and flare peak.
    narrative_ko: >
      이 별은 조용한 듯 보이지만 자주 폭발한다. 자전은 83.5일로 느리고 평상시 채층 활동 지표도 낮은데, 플레어는
      하루 평균 1.5회로 터진다. 태양이 내놓는 무엇보다 큰 슈퍼플레어가 해마다 세 번쯤, 그보다 한 자릿수 큰 것이
      2년에 한 번쯤 온다. 나이 든 느린 자전체가 이렇게 자주 폭발하는 것은 모순처럼 보이지만, 7년 주기의 활동
      사이클이 그 사이를 메운다. X선 밝기는 평상시와 플레어 최대 사이에서 30배 넘게 오간다.
    fields:
      - name: activity
        value: "P_rot 83.5±0.5d (Benedict1998 HST), 7년 사이클 (Wargelin2017), log R'HK −5.65±0.17"
        op: passthrough
      - name: flares
        value: "1.49회/일 (Vida2019 TESS); 슈퍼플레어 ≥10³³erg ~3회/년, ultra ~0.5회/년; X선 log Lx ~27.0 정온→28.5 피크"
        op: passthrough

  - body: Proxima Cen
    axis: environment.stellar_wind    # 측정
    refs: ["2001ApJ...547L..49W"]
    status: passthrough
    narrative: >
      The wind this star sheds is weaker than the Sun's. What the observations give is an upper limit, no more
      than a fifth of the Sun's mass-loss rate, which follows from the star being so small and faint. So what
      troubles the planets here is not a steady wind but the flares that arrive in bursts.
    narrative_ko: >
      이 별이 흘려보내는 항성풍은 태양보다도 약하다. 관측으로 얻은 것은 상한값이고, 태양 질량손실률의 5분의 1을
      넘지 않는다. 별 자체가 워낙 어둡고 작아서 그렇다. 그래서 이 계의 행성들을 괴롭히는 것은 꾸준한 바람이
      아니라 이따금 들이치는 플레어다.
    fields:
      - name: stellar_wind
        value: 0.2
        unit: Mdot_sun
        op: passthrough
        note: "≤0.2 (Wood2001 astrospheric Lyα 상한). 플레어-지배 환경, 절대 풍 약함"

  - body: Proxima Cen
    axis: environment.heliosphere     # SHARED 시스템 대표
    refs: ["2001ApJ...547L..49W"]
    status: passthrough
    narrative: >
      The boundary where this star's wind is stopped by the interstellar medium sits inside 55 AU. Against the
      Sun's equivalent boundary beyond 100 AU that is less than half the size, which is what a weak wind buys. The
      interstellar flow it pushes through runs at 25 km/s, the same cloud α Cen AB travels in.
    narrative_ko: >
      항성풍이 성간물질에 밀려 멈추는 경계는 55 AU 안쪽이다. 태양의 같은 경계가 100 AU를 넘는 것과 비교하면
      절반도 되지 않는 작은 거품이고, 약한 바람의 당연한 결과다. 이 별이 헤치고 지나가는 성간 흐름은 초속
      25 km이며, α Cen AB가 지나는 것과 같은 구름이다.
    fields:
      - name: heliosphere
        value: "astrosphere standoff ≲55 AU (Wood2001); ISM 유입 ~25 km/s (Wood2005, α Cen AB와 동일 G-cloud)"
        op: passthrough

  # ── 항성 자전축/J2 — 2026-07-12 항성 점검서 신설 (silent-passthrough 해소) ──
  - body: Proxima Cen
    axis: bulk.spin_axis_orientation
    status: gated                     # 측정 채택 (Klein 2021 ZDI)
    driver: [window-selection]
    narrative: >
      The star's spin axis is tilted 47 degrees to our line of sight, a value that came out of the same
      observations that map its magnetic field. Which way the axis points on the sky is still unconstrained, so we
      know the tilt and not the bearing. None of the three planets has a measured orbital inclination either, so
      whether this star's spin lines up with their orbital plane cannot be answered yet. That leaves its equatorial
      plane as a candidate reference when the planets' orbital orientation has to be fixed.
    narrative_ko: >
      이 별의 자전축은 우리 시선에 대해 47도 기울어 있다. 자기장 지도를 그리는 관측에서 함께 얻은 값이다. 다만
      축이 하늘에서 어느 방향을 향하는지는 아직 묶이지 않아, 기울기만 알고 방위는 모른다. 행성 셋의 궤도 경사도
      측정된 것이 없어서, 이 별의 자전이 행성 궤도면과 나란한지는 지금 답할 수 없다. 그래서 행성 궤도의 방향을
      정할 때 이 적도면을 기준으로 삼는 것이 후보로 남는다.
    fields:
      - { name: spin_axis_orientation, value: "i★ 47°±7° (LOS 기준, 측정) · PA 자유, ICRS 변환 at emit", op: set }
    gate:
      criterion: [observation]
      verdict: pass-in-window
      evidence: >
        ZDI 측정값 그대로 채택(47°±7°, recommended). 가정은 극 방위각뿐. 행성 궤도 경사 미측정이라
        정렬 주장 없음.
    refs: ["2021MNRAS.500.1844K"]

  - body: Proxima Cen
    axis: bulk.geopotential_j2
    status: gated                     # 오너 정책 2026-07-12 — 항성 J2 상시 계산·emit
    driver: [window-selection]
    narrative: >
      This star is very nearly a perfect sphere. Turning once in 83.5 days leaves the centrifugal term negligible
      against its own gravity, so the equatorial bulge stays at the level of four parts in a billion. The Sun, by
      the same measure, is bulged about sixty times more. Because the star is fully convective its internal mass
      distribution cannot be borrowed from the Sun, so the flattening comes from a moment of inertia taken from a
      polytrope model instead. The uncertainty is about a quarter, dominated by the measured radius.
    narrative_ko: >
      이 별은 사실상 완벽한 구다. 자전이 83.5일로 느려서 원심력이 자기중력에 비해 무시할 만하고, 그래서 적도가
      부푸는 정도가 10억분의 4 수준에 머문다. 태양이 같은 값에서 이 별의 60배쯤 부풀어 있다. 완전 대류 별이라
      내부 질량 분포를 태양에서 빌려 올 수 없어, 폴리트로프 모형으로 얻은 관성모멘트를 써서 편평도를 구했다.
      값의 불확도는 4분의 1 정도이고 대부분 반지름 측정에서 온다.
    fields:
      - { name: geopotential_j2, value: 3.7e-9, op: set }
      - { name: reference_radius, value: 9.809e7, unit: m, op: set }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        느린 자전(83.5d)+작은 반지름이라 q 자체가 태양의 ~1/470이고, 로스터 최소 J2다. 그래도 오너 정책
        (항성 J2 무시가능 처리 금지, Principia 플레이 중요)대로 계산값 emit. 태양 비율(0.0105) 대신
        M왜성 폴리트로프 계수(0.084)를 쓴 것은 응집도 차이의 물리적 귀결.
    refs: ["docs/reference/body-figure-methodology.md"]

  # ── 행성 b (대륙형 호수 세계, 무생물) — facet-walk 2026-06-23 ──────────
  - body: Proxima Cen b
    axis: identity
    status: gated
    driver: [window-selection]
    narrative: >
      The closest planet to the Sun. A rocky world about Earth's size, with highland rising at the centre of the
      face turned toward its star and lakes and inland seas scattered around it. The far side, where night never
      ends, is capped in ice. It is not the eyeball world usually drawn, with an ocean pooled at the substellar
      point. Nothing lives here.
    narrative_ko: >
      태양에서 가장 가까운 행성이다. 지구와 비슷한 크기의 암석 세계이고, 별을 향한 한쪽 면 가운데에 고지대가 솟고
      그 주변으로 호수와 내해가 흩어져 있다. 밤이 영원한 반대편에는 얼음이 덮여 있다. 흔히 그려지는 눈알 모양의
      세계, 즉 직하점에 바다가 고인 형태는 아니다. 생명은 없다.
    fields:
      - name: body_type
        value: "암석 지구형: 대륙형 호수 세계 (직하 고지대 + 흩어진 호수/내해 + 야간측 빙관, 무생물)"
        op: set
      - name: designation
        value: "Proxima Centauri b (고유명 없음)"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: >
        RV confirmed. 기후=대륙형 호수(eyeball 회피, 로스터 다양성; 직하-고지대 전제라
        TRAPPIST-1 e와 자연 분기). 생명 없음.

  - body: Proxima Cen b
    axis: orbit                       # a/e/inc/lock = 측정 passthrough
    refs: ["2025A&A...700A..11S", "2016Natur.536..437A", "2022A&A...658A.115F"]
    status: passthrough
    narrative: >
      It hugs its star, one lap in 11.2 days. The orbit is circular for all practical purposes, and at this
      distance tides lock the spin to it within a hundred thousand years, so one face holds toward the star
      forever. The planet does not transit, so how far the orbit tilts to our line of sight is unknown.
    narrative_ko: >
      별에 아주 가까이 붙어 11.2일에 한 바퀴를 돈다. 궤도는 사실상 원이고, 이 거리에서는 조석이 10만 년 안에
      자전을 궤도에 묶어 버리므로 한쪽 면이 영원히 별을 마주한다. 통과 현상이 관측되지 않아 궤도가 우리 시선에
      얼마나 기울었는지는 모른다.
    fields:
      - name: semi_major_axis_au
        value: 0.04848
        unit: AU
        op: passthrough
        note: "P=11.18465d"
      - name: eccentricity
        value: 0
        op: passthrough
        note: "≈0 measured (SM2025); inc 미측정(비통과). emit 주의: e≈0 + 0.3 bar 대기 → Kopernicus temperatureEccentricityBiasCurve 0-나눗셈 트랩 → 측정값이라 noise 금지 → emit시 곡선 suppress"
      - name: tidal_lock
        value: "1:1 (락타임 <10⁵yr); Ω/ω/M free-emit"
        op: passthrough

  - body: Proxima Cen b
    axis: bulk                        # §3.2 템플릿 앵커 — mass=등방 prior 중앙 진질량(결정), 나머지 passthrough/tie-break
    body_class: tidally_locked
    status: gated
    driver: [window-selection]
    narrative: >
      A rocky planet a little heavier and a little larger than Earth. Its density is nearly Earth's, so the body
      is an iron core under a silicate mantle, and the surface gravity is much the same as ours. The mass, though,
      is the radial-velocity minimum corrected for orbital inclination by probability, so it is a median rather
      than a measurement. Tides hold the rotation to the orbit, and the spin axis stands very nearly perpendicular
      to the orbital plane, a tilt that was computed as an equilibrium rather than assumed. Turning that slowly
      leaves the equatorial bulge negligible, and the heat rising from inside is too little to move the surface
      temperature. That little heat is what drives the planet's weak magnetic field.
    narrative_ko: >
      지구보다 조금 무겁고 조금 큰 암석 행성이다. 밀도가 지구와 거의 같아 철 핵과 규산염 맨틀로 이루어진 몸이고,
      표면 중력도 지구와 다를 바 없다. 다만 질량은 시선속도가 주는 최소값에 궤도 경사를 확률로 보정한 값이라,
      측정치가 아니라 중앙값이다. 조석에 묶여 자전 주기가 공전 주기와 같고, 자전축은 궤도면에 거의 수직으로 선다.
      이 기울기는 가정이 아니라 평형 상태를 계산해 얻은 값이다. 느린 자전 탓에 적도가 부푸는 정도는 무시할 만하며,
      내부에서 올라오는 열도 표면 온도를 바꾸지 못할 만큼 적다. 다만 그 적은 열이 이 행성의 약한 자기장을 돌린다.
    fields:
      - name: mass
        value: 1.22
        unit: M_earth
        op: set
        phase3_default: "Msini 1.055 M⊕ (RV 최소질량, SM2025)"
        note: "등방 prior 중앙 진질량"
      - name: radius
        value: 1.07
        unit: R_earth
        op: set
        note: "비통과 tie-break(질량-반경); g~1.07·밀도~5.5 g/cm³ 지구형 암석"
      - name: gravity
        value: 1.07
        unit: g
        op: set
        note: "GM/R² 파생 에코"
      - name: flattening
        value: 7.0e-5
        op: set
        note: "= (5/2)·J₂ 평균적도 spheroid (J₂ 2.8e-5), 시각상 구"
      - name: rotation_period
        value: 11.186
        unit: d
        op: set
        note: "= 공전주기 (조석고정, DB curated)"
      - name: spin_axis_orientation
        value: "궤도 법선에서 Cassini ε(~0.03°)만큼 Laplace pole 쪽 offset (State 1 평형); 방위각 de-perfect-at-emit"
        op: set
      - name: geopotential_j2
        value: 2.8e-5
        op: set
        note: "≈ q_s (동기 자전, body-figure-methodology §6 워크드)"
      - name: geopotential_c22
        value: 8.0e-6
        op: set
        note: "영구 조석 삼축 (§6 워크드), emit 임계 판단은 emit 단계"
      - name: reference_radius
        value: 6817
        unit: km
        op: set
        note: "J2/C22 기준 반경 = radius"
      - name: internal_heat
        value: "negligible (표면)"
        op: set
        note: "radiogenic ~Earth-scale ~0.08 W/m² (T_int~35K), 표면 T_eff≈T_eq(§7); 내부열 몫은 G7 약한 dynamo(RM22) 구동"
      - name: obliquity
        value: 0
        unit: deg
        op: set
        note: "≈0 = Cassini State 1 평형 (가정 아님·계산). |g|/α=0.017 (Laplace–Lagrange 승교점율 g + 동기 α, ≪ 공명 임계 ~1.1) → ε₁=(|g|/α)·sinI ≈0.02–0.05° (근접-공면 궤도 I). 극단 obliquity 없음. method=cassini-state-obliquity-methodology.md"
      - name: age
        value: 4.85
        unit: Gyr
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        채택값은 진질량 1.22 M⊕, 반경 1.07 R⊕, 조석고정 자전, obliquity 0, J₂ 2.8e-5이다.
        확인: 측정된 최소질량 Msini 1.055 M⊕에 무작위 배향의 중앙 경사 60°를 적용해(1/sin60 = 1.1547) 중앙
        진질량 1.22 M⊕를 얻었고, Barnard 보드와 같은 방식이다. 반경은 비통과라 질량-반경 관계로 tie-break해
        밀도 5.5 g/cm³의 지구형을 유지하며, 이 질량대에서 H/He 외피는 플레어 광증발로 남지 못한다. 동기 자전의
        q_s 2.8e-5이 그대로 J₂가 되고 영구 조석 삼축 C̄₂₂는 8e-6이다. obliquity는 |g|/α = 0.017로 공명 임계
        1.1보다 훨씬 작아 Cassini State 1 평형에 앉는다.
        유보: 1.22는 등방 prior의 중앙값이다(cos i 균일 → 중앙 경사 60°). 하한은 측정된 Msini 1.055이고 상한은
        없다. 모집단 질량함수를 함께 넣어 사후분포를 구하면 중앙값이 등방 가정보다 낮은 쪽으로 이동하므로, 이 값을
        정밀한 기대값으로 읽어서는 안 된다. 로스터 일관성을 위해 세 행성 모두 등방 중앙값을 쓴다.
    refs: ["1007.0245", "docs/reference/mass-radius-relation-methodology.md", "docs/reference/body-figure-methodology.md", "docs/reference/cassini-state-obliquity-methodology.md", "docs/reference/internal-heat-luminosity-methodology.md"]

  - body: Proxima Cen b
    axis: atmosphere                  # G4
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-04: pressure 0.7 → 0.3 bar (오너 결정). 구값 0.7 bar는 Phase 3 앵커 1 bar에서 내려온 값인데 사유
      기록이 없었고, 야간 CO₂ 서리가 분압을 버퍼링한다는 조건을 넣으면 야간 157 K를 요구해 GCM 앵커 150 K와
      어긋났다. 150 K가 버퍼링하는 분압 8.4 mbar가 3%가 되는 총기압이 0.28 bar라 0.3 bar가 자기정합적이다.
      같은 검토에서 evidence의 CO₂ frost point 135 K가 오류로 드러났다(같은 Fray & Schmitt 곡선으로 21 mbar는
      156.8 K, 화성 극관 147.7 K로 곡선 검증). divergence_note의 "shoreline 위"도 반대로 정정했고, Ribas 2016을
      침식 근거로 인용한 것도 바로잡았다(그 논문은 보유 쪽 결론이다).
    status: gated
    driver: [window-selection]
    narrative: >
      The planet holds an atmosphere at about a third of Earth's pressure. Nitrogen dominates it with 3 percent
      carbon dioxide, and that 3 percent works as a greenhouse that keeps the star-facing ground above the freezing
      point of water. There is no oxygen, so it cannot be breathed. The air is thin: 95 percent of its mass sits
      within 21 km of the surface. On the far side, in permanent night, the ground is cold enough that some of the
      carbon dioxide settles out as dry-ice frost, and that frost is what fixes how much of the gas stays in the
      air: any excess freezes onto it, any shortfall sublimates back. Nothing survives as frost on the lit side,
      where even the terminator is far too warm. That this air survives the star at all, though, is a choice rather
      than an observation. Proxima's flares and wind are capable of stripping an atmosphere of this size.
    narrative_ko: >
      이 행성에는 지구의 3분의 1쯤 되는 기압의 대기가 있다. 질소가 주성분이고 이산화탄소가 3% 섞여 있는데, 그 3%가
      온실로 작용해 별을 마주한 쪽 지표를 물의 어는점 위에 붙들어 둔다. 산소는 없어 숨 쉴 수 없다. 대기는 얇다.
      질량의 95%가 지표 위 21 km 안에 들어 있다. 밤이 영원한 반대편은 지표가 충분히 차가워 이산화탄소 일부가
      드라이아이스 서리로 내려앉고, 그 서리가 대기에 남는 기체의 양을 정한다. 남으면 서리로 얼어붙고 모자라면
      다시 승화해 돌아온다. 빛을 받는 쪽에는 서리가 남지 못한다. 명암경계선조차 너무 따뜻하다. 다만 이 대기가
      별을 견디고 남아 있다는 것 자체는 관측이 아니라 선택이다. Proxima의 플레어와 항성풍에는 이만한 대기를
      벗겨낼 힘이 있다.
    # MIGRATION-FLAG: derived_temps 는 비표준 행-레벨 키로 프로즈 원문 보존 (validator 무시). 온도값 typed field 로 병기.
    derived_temps: >
      Teq≈228K(A 0.33, 기압 무관, G5 albedo cascade). 조석고정 1:1 → 1 bar GCM 앵커(Turbet2016·Boutle2017: 직하 290K,
      야간 150K, 평균 250K)에서 0.3 bar로 Koll 2022 대비 스케일링: 직하 ~295–310K(>273K → 액체 호수 유지)·야간
      ~148–152K(CO₂ 서리 버퍼가 이 온도에 고정)·평균 ~240K. 온실 계산기(greenhouse_dt.py, S 0.668·pCO₂ 9 mbar·A 0.33)는
      평균 Ts 241K. 직하 호수 + 나머지 빙결 = 대륙형 호수 세계와 정합하고, 얇아진 대기는 재분배를 줄여 직하를 오히려
      높이므로 빙점 마진이 0.7 bar보다 넓다.
    fields:
      - name: pressure
        value: 0.3
        unit: bar
        op: set
        phase3_default: "Phase 3 합성 대기(있으면); 본 결정이 art-direction 기압/조성 확정값"
        note: "야간 최저 ~150 K의 CO₂ 서리가 분압 8.4 mbar를 버퍼링 → 3%가 되는 총기압 0.28 bar. 구값 0.7 bar는 야간 157 K를 요구해 GCM 앵커와 어긋났다"
      - name: composition
        value: "N₂ 지배 + CO₂ ~3% (μ≈28.5 g/mol)"
        op: set
      - name: temperature
        value: 228
        unit: K
        op: set
        note: "Teq (A 0.33, 기압 무관). 0.3 bar 재분배: 직하 ~295–310K·야간 ~148–152K·평균 ~240K (1 bar GCM 앵커에서 Koll 2022 대비 스케일링)"
      - name: scale_height
        value: 7
        unit: km
        op: set
        note: "=RT/μg (T~250K·g 10.5·μ 28.5)"
      - name: breathability
        value: false
        op: set
        note: "무생물·무산소, atmosphereContainsOxygen=false"
      - name: escape
        value: "shoreline 아래(중력 허용치의 23배 초과)이나 호수 세계 전제로 보유 채택"
        op: set
    gate:
      criterion: [classification, retention, error-bar]
      verdict: documented-divergence
      divergence_note: >
        경험적 cosmic shoreline(Zahnle & Catling 2017, v_esc ∝ I_XUV^¼)에서 이 행성은 유지 쪽이 아니라 벗겨지는
        쪽에 있다. 탈출속도 11.94 km/s는 지구의 1.068배뿐이어서 중력이 허용하는 조사량이 1.3배인데, Ribas 2016이
        측정한 실제 조사량은 EUV 30배·X선 250배로 약 23배 초과한다. 그래도 대기를 남긴 것은 이 보드가 b를 액체
        물 호수 세계로 확정했기 때문이고, Meadows 2018이 나열한 환경 상태 중 온대 분기를 명시적 tie-break로
        골랐다. 문헌은 갈려 있다. Dong 2017의 항성풍 이온 탈출은 지질학적으로 짧은 시간에 침식된다고 보는 반면,
        Ribas 2016은 에너지 제한 탈출로 계산해 잃은 수소가 지구 바다 하나 미만이며 b가 유력한 거주가능 후보라고
        맺는다. 즉 우리가 떠난 것은 경험적 shoreline과 Dong의 이온 탈출이고, 택한 것은 Ribas·Meadows의 상세
        계산이다. Garraffo 2016의 자기 차폐는 도울 수 있으나 Ramstad & Barabash 2021이 반대 방향을 제시하므로
        근거로 세우지 않는다.
      evidence: >
        채택값은 0.3 bar의 N₂ 대기에 CO₂ 3%, 평균 분자량 28.5, 규모 높이 7 km, 평형온도 228 K, 산소 없음이다.
        확인: 기압을 정한 것은 야간측 CO₂ 냉각 포획이다. Fray & Schmitt 증기압 곡선에서 야간 최저 150 K의 서리가
        대기 CO₂ 분압을 8.4 mbar로 버퍼링하고, 그 값이 3%가 되는 총기압이 0.28 bar다. 서리 더미가 저장고로
        작동해 남는 CO₂는 얼어붙고 모자라면 승화해 돌아오므로 분압이 유지된다. 일사를 받는 쪽에는 서리가 남지
        않는다. 명암경계선 200 K에서 이미 증기압이 1,556 mbar로 대기 분압의 170배다. 0.3 bar는 Joshi 1997의
        붕괴 임계 0.1~0.3 bar의 상단이라 수송이 야간을 그 온도에 붙들 수 있고, 열조석도 1 bar보다 약해 1:1
        고정과 obliquity 0이 안전하다. 온도 3계층은 1 bar GCM 앵커(직하 290 K·야간 150 K·평균 250 K)에서
        Koll 2022 대비 스케일링으로 옮겼고, 온실 계산기는 평균 241 K를 준다.
        유보: Bond 알베도 0.33은 직하 구름을 포함해 잡은 값인데, 기압이 얇아지면 구름이 줄어 알베도가 0.30 쪽으로
        내려갈 수 있다. 그러면 평형온도가 오른다. surface 행에서 함께 볼 사안으로 남긴다.
    refs: ["1702.04089", "1608.06813", "1608.08620", "docs/reference/exoplanet-atmosphere-methodology.md", "docs/reference/tidally-locked-temperature-methodology.md"]

  - body: Proxima Cen b
    axis: surface                     # G5 — 대륙형 호수 세계 표면; 색=표면색 문서, A=Bond cascade
    refs: ["docs/reference/surface-color-albedo-methodology.md"]
    status: gated
    driver: [window-selection, art-direction]
    narrative: >
      The hemisphere in permanent day divides into two colours of ground. The low country is basalt rich in olivine
      and pyroxene, a dark grey-green; the high country is feldspar-rich and bright. It is not Mars-red. With no
      life and no oxygen the iron never oxidizes and stays reduced, so the charge transfer that makes rust-red never
      happens. Lakes and inland seas lie scattered between them as dark water, and water cloud hangs over the
      substellar point, cooling what is beneath. The far side, in permanent night, is covered in bright water ice
      with a faint blue cast.
    narrative_ko: >
      낮이 영원한 반구는 두 가지 색의 땅으로 갈린다. 낮은 곳은 올리빈과 휘석이 많은 현무암 지대라 어두운
      회녹색이고, 높은 곳은 장석이 모인 밝은 고지다. 화성처럼 붉지는 않다. 생명도 산소도 없어 철이 산화되지
      못하고 환원된 상태로 남는 탓에, 붉은색을 만드는 전하 이동이 일어나지 않는다. 그 사이로 호수와 내해가
      흩어져 어두운 물빛으로 놓이고, 직하점 위에는 물구름이 걸려 그 아래를 식힌다. 밤이 영원한 반대편은 밝은
      물얼음으로 덮여 살짝 푸르다.
    # MIGRATION-FLAG: bond_albedo_cascade / cfg_colors_intrinsic 는 비표준 행-레벨 키로 프로즈+hex 원문 보존 (색은 emit 말미 art-pass, typed 색필드 미분해).
    bond_albedo_cascade: >
      Bond albedo는 **일사받는 데이샤이드만** 결정(1:1 고정 → 야간측 일사 0 → 밝은 빙관은 Bond에 미기여, 과대평가 회피).
      데이샤이드 면적가중 = 어두운 마픽+호수(낮음) + 밝은 anorthosite 고지·직하 구름(높음) → **A≈0.33**. G4 Teq 228K와
      맞물림 → cascade 닫힘. 오너 "평균 알베도 조금↑"은 밝은 고지 추가로 물리적 정당화(0.30→0.33), 온도는 G4서 동기 하향.
    cfg_colors_intrinsic: >
      고유(중립광/태양 기준) 반사색 — cfg 저장값, 렌더러가 항성광 적용(Proxima-lit 표시색은 appearance/G6).
      마픽 저지 #3c4339(창 #353b32–#444b40) · 장석질 고지 #928c81(창 #88827a–#9d978c) ·
      직하 호수 #1d2c3a(창 #182430–#223240) · 야간 빙관 #dde6ec(창 #d4dde6–#e8eef2) · 직하 구름층 #eef1f4.
    fields:
      - name: surface_type
        value: "rock (2색 대륙: 회녹 마픽 저지 + 장석질 고지)"
        op: set
      - name: albedo
        value: 0.33
        op: set
        note: "Bond, 데이샤이드 면적가중 (G4 Teq 228K와 cascade)"
      - name: hydrosphere
        value: "직하 호수/내해 (어두운 물 A~0.07, 산재)"
        op: set
      - name: ice_caps
        value: "야간 빙관 (밝은 물얼음 A~0.5–0.6, 살짝 청색)"
        op: set
    gate:
      criterion: [classification, visual-checklist]
      verdict: pass-in-window
      evidence: >
        채택값은 2색 대륙(어두운 회녹 마픽 저지 + 밝은 장석질 고지), 직하 호수·내해, 야간 빙관, Bond 알베도
        0.33이다.
        확인: 색을 정하는 최대 레버는 산화상태다. 무생물·무산소이므로 철이 Fe²⁺로 남아 Fe³⁺ 전하이동이 만드는
        적색 슬로프가 생기지 않는다. Bond 알베도는 일사를 받는 데이샤이드만으로 면적가중했다. 1:1 고정이라
        야간측 일사가 0이어서 밝은 빙관을 넣으면 과대평가가 된다. 어두운 마픽과 호수, 밝은 고지와 직하 구름을
        합쳐 0.33이 되고, 이 값이 대기 행의 평형온도 228 K와 맞물려 닫힌다. 여기서 나눈 표면 구획은 gameplay
        행의 biome 후보로 이어진다.
        유보: 색조와 패턴 자체는 물리가 허용하는 창 안에서 고른 아트 선택이다. 물리가 묶는 것은 면적가중 Bond
        알베도 하나뿐이다. 0.3 bar로 내려가면 직하 구름이 얇아져 알베도가 0.30 쪽으로 갈 수 있으나, 그때 평형온도
        상승은 2.5 K로 온실 계산의 ±10 K 밴드 안이라 판정을 바꾸지 않는다.

  - body: Proxima Cen b
    axis: appearance                  # G6 — Proxima-lit 표시색 + 디스크 종합 + 희미 플레어-오로라
    status: gated
    driver: [art-direction, window-selection]
    narrative: >
      Under red starlight the planet reads as a warm ochre disk. The brightest thing on it is the swirl of water
      cloud over the substellar point, ringed by two-tone continents stained red, with lakes sunk dark between them.
      Past the terminator the night-side ice cap carries on in cream. Starlight erases the blue of that ice. It is
      the opposite of Alpha Centauri A b (Polyphemus), which stands under a Sun twin and keeps its own colours almost untouched. Only
      when a flare breaks does a violet aurora spread faintly, and with no oxygen the green Earth shows never
      appears.
    narrative_ko: >
      붉은 별빛 아래 이 행성은 따뜻한 황토빛 원반으로 보인다. 가장 밝은 것은 직하점에 걸린 물구름의 소용돌이이고,
      그 둘레로 붉게 물든 두 색의 대륙이 펼쳐지며 사이사이 호수가 검붉게 잠긴다. 명암경계선을 넘어서면 야간
      빙관이 크림빛으로 이어진다. 얼음의 푸른 기는 별빛에 지워진다. 태양 쌍둥이의 빛을 받아 제 색을 거의 그대로
      보이는 Alpha Centauri A b(폴리페무스)와는 정반대다. 플레어가 터질 때만 자줏빛 오로라가 희미하게 번지는데, 산소가 없어
      지구에서 보는 초록빛은 나타나지 않는다.
    # MIGRATION-FLAG: cfg_colors_displayed 는 비표준 행-레벨 키로 프로즈+hex 원문 보존 (표시 팔레트, emit 말미 정밀화).
    cfg_colors_displayed: >
      Proxima reddening 적용 근사(§6 엔진, illuminant=별; emit서 정밀화). 마픽 저지 #3e2c16(움버) ·
      장석 고지 #9a5e38(테라코타) · 직하 호수 #1d1810(검붉은 근흑) · 야간 빙관 #dda176(크림-복숭아, 청색 죽음) ·
      직하 구름 #f0d8bf(크림화이트). 고유색은 G5 cfg_colors_intrinsic.
    fields:
      - name: base_color
        value: "따뜻한 황토/적갈 디스크 (Proxima M5.5 Teff 2904K reddening)"
        op: set
      - name: aurora
        value: "희미·간헐 플레어-오로라, 적자색 (magenta-violet)"
        op: set
    gate:
      criterion: [visual-checklist, composition-lock]
      verdict: owner-override
      evidence: >
        채택값은 따뜻한 황토·적갈 원반이고, 직하 구름 소용돌이가 가장 밝으며, 붉게 물든 2색 대륙과 검붉은 호수,
        크림빛 야간 빙관, 그리고 플레어 때만 보이는 희미한 자적색 오로라가 얹힌다.
        확인: 표시색은 surface 행의 고유 반사색에 Proxima의 스펙트럼을 곱해 얻었고, 별빛이 붉히는 것 자체는
        물리다. 오로라 색은 조성이 잠근다. N₂ 지배에 산소가 없어 지구의 산소 557 nm 녹색선이 나오지 못하고,
        N₂ 1st Positive의 적색과 N₂⁺ 391 nm의 자색이 지배해 자적색이 된다.
        유보: 이 행성의 자기장은 측정된 적이 없다. 외계행성 자기장 직접 검출 사례가 없고, 전파로 본 항성-행성
        상호작용도 잠정이며 항성 플레어 기원일 수 있다. 조석고정된 느린 자전은 약한 다이나모를 시사하는 반면
        구동원인 별은 강력하다. 그래서 약한 장을 가정하고 강한 구동을 얹어 희미하고 간헐적인 오로라를 택했다.
        장의 존재를 약하게 가정한 선택임을 명기한다.
    refs: ["2017ApJ...844L..13G", "2012.02116", "2011Icar..213...12D"]

  - body: Proxima Cen b
    axis: magnetism.magnetic_field    # G7 — 암석 dynamo(RM22)+조석고정 penalty → 약한 장. G6서 함의된 결정 명시
    status: gated
    driver: [window-selection]
    narrative: >
      The planet's field is weak, under a third of Earth's, and whether a dynamo is running at
      all is uncertain. Two things work against it: tides hold the rotation to 11.2 days, too slow to organize a
      dynamo, and a core that has been cooling for 4.85 billion years convects feebly. Nothing here is measured.
      No exoplanet's magnetic field has been detected directly, and what has been reported is a modulation of the
      star's flares at the planet's orbital period, a trace of magnetic interaction rather than a field strength.
      What the slow rotation does decide is the field's shape: not a clean dipole with two poles, but a multipolar
      one whose surface flux breaks into patches. Aurora follows those patches down to mid-latitudes instead of
      ringing the poles, and the weak field shields poorly, which is why the atmosphere is at risk and the surface
      takes what the star throws.
    narrative_ko: >
      이 행성의 자기장은 약하다. 지구의 3분의 1에도 못 미치고, 활성 다이나모가 돌고 있는지 자체가 불확실하다. 불리한
      조건이 둘이다. 조석에 묶여 11.2일에 한 번 도는 자전은 다이나모를 조직할 만큼 빠르지 않고, 48억 년을 식은 핵은
      대류가 시들하다. 측정된 것은 없다. 외계행성의 자기장을 직접 검출한 사례가 아직 없고, 보고된 것은 이 별의
      플레어가 행성 공전 주기에 맞춰 변조된다는 사실, 즉 자기적 상호작용의 흔적일 뿐 세기가 아니다. 느린 자전이
      확실히 정하는 것은 세기가 아니라 형태다. 두 극을 가진 매끈한 쌍극자가 아니라, 표면 자속이 여러 조각으로
      갈라진 다중극이다. 그래서 오로라가 극지를 둘러싸는 대신 그 반점을 따라 중위도까지 내려오고, 약한 장은 차폐를
      제대로 못 해 대기가 위험해지고 지표는 별이 던지는 것을 그대로 받는다.
    fields:
      - name: magnetic_field
        value: "약한 (차수 ≲0.1–0.3× 지구, ≲ 수 µT 표면); 활성 dynamo 여부 불확실, conf=low"
        op: set
      - { name: field_geometry, value: "다중극 (multipolar; Ro_l > 0.12 게이트 통과)", op: set, note: "쌍극 모멘트 0.06배 붕괴, 사다리값 B_eq ~1.2 µT·B_pol ~2.4 µT. 형태 도식 = docs/img/field-geometry.png" }
      - { name: radiation_model, value: "irregular (스톡 템플릿 재사용)", op: set, note: "벨트 없음 + pause_deform 0.1의 비축대칭 경계. 미지정 필드는 템플릿 값을 따른다" }
      - { name: geomagnetic_offset, value: 0.25, op: set, note: "축대칭 다중극(쌍극+사극) 성분; 수성 0.208보다 크다. 쌍극 지배력이 더 약하기 때문이다" }
      - { name: geomagnetic_pole_lat, value: 60, unit: deg, op: set, note: "기울기 30°. 다중극이라 단일 극의 의미가 약하고 축도 미측정이라 대칭을 깨는 쪽으로 art 선택" }
      - { name: magnetopause_standoff_rp, value: 1.54, unit: R_p, op: set, note: "Chapman-Ferraro: B_eq 1.2 µT, 0.0485 AU 램압 170 nPa(Ṁ ≤ 0.2 Ṁ☉ 상한이라 최대 압축). 수성 1.45와 동급" }
      - { name: pause_deform_scale, value: 0.52, op: set, note: "⚗ 엔진 미소비(스톡은 파수 5/7/6 하드코딩). l=4에서 k = l/R_mp = 2.6이라 스톡 대비 0.52배(로브 4개, 스톡은 8~11개). KerbalismShuePause 플러그인 대기" }
    gate:
      criterion: [derived-grounding]
      verdict: methodology-derived
      evidence: >
        rationale: G6 "희미한 플레어-오로라" 채택이 약한 장 존재를 이미 함의 → G7은 그 정량·명시(별도 art 선택 없는
        derived 축). 자이언트 energy-flux 법칙(Christensen2009)은 부적용이고, 암석체라 RM22 경로. 강한 장 가정은 근거
        없음(미측정+느린자전+노쇠).

        coupling: G4 retention divergence를 강화한다. 약한 장 → 자기차폐 미약 → M왜성 stripping 무방비(Garcia-Sage2017·
        Garraffo2016: 장이 있어도 Proxima 활동성엔 보호 어려움) → "보유"를 documented-divergence로 둔 게 정당. G6 오로라
        희미함과도 정합. environment.radiation(G8)에도 입력이다. 약한 자기권 → 표면 방사선 환경 가혹(플레어 직격).

        paper: 암석 dynamo = docs/reference/planetary-dynamo-scaling.md regime 4(RM22 2203.01065 + Garraffo2017 +
        조석lock penalty). 노쇠/느린자전 약화 = Driscoll&Olson2011.
    refs: ["2605.22925", "2203.01065"]

  - body: Proxima Cen b
    axis: environment                 # G8 — 별 측정 환경 + G7 약한장에서 도출 (radiation/wind/heliosphere)
    refs: ["docs/reference/solar-system-radiation-belts.md", "docs/reference/planetary-magnetosphere-geometry-methodology.md"]
    status: gated
    driver: [window-selection]
    narrative: >
      radiation(표면)=가혹이다. 원인은 약한 자기권(G7) + 잦은 슈퍼플레어(별 measured: 1.49회/일, ≥10³³erg ~3/년, X선 log Lx
      27정온→28.5피크) + 근접궤도 0.0485 AU 직격. 0.3 bar 대기가 일부 column 차폐하나(1 bar 기준 ~1000 g/cm²의 30% 수준) 약한 장이라 플레어가 대기 직타 →
      G1 무생물·G11 해저드의 물리 근거. stellar_wind=강함(근접 → wind ram 큼, Dong2017 escape 구동 = G4 retention
      divergence 입력). heliosphere=astrosphere 심부(행성 0.0485 AU ≪ standoff ~55 AU[Wood2001] → 항상 항성풍 내부,
      ISM 직접 미관측).
    fields:
      - name: radiation
        value: "가혹 (약한 자기권 + 슈퍼플레어 + 0.0485 AU 직격)"
        op: set
      - name: stellar_wind
        value: "강함 (근접 wind ram 큼, Dong2017 escape 구동)"
        op: set
      - name: heliosphere
        value: "astrosphere 심부 (0.0485 AU ≪ standoff ~55 AU)"
        op: set
    gate:
      criterion: [derived-grounding]
      verdict: pass-in-window
      evidence: >
        rationale: 전부 별 measured 환경(environment.activity/stellar_wind/heliosphere) + G7 약한 자기권에서 도출이고,
        별도 art 선택 없는 derived 축. radiation 등급(Kerbalism 매핑)은 high이되 정확 tier는 G11 gameplay서 확정.

        coupling: G4 retention divergence(풍-구동 escape)·G1 무생물(방사선 적대)·G11 해저드의 공통 입력. G7 약한 장이
        radiation 가혹의 직접 원인.

        paper: 별 환경 측정 출처는 별 섹션(environment.activity/wind/heliosphere; Vida2019·Wargelin2024·Wood2001 등).
        대기 escape = exoplanet-atmosphere-methodology.md Gate2(Dong2017·Ribas2016).

  - body: Proxima Cen b
    axis: rings                       # G9 — 없음
    status: gated
    driver: [window-selection]
    narrative: "None."
    narrative_ko: "없음."
    fields:
      - name: ring_structure
        value: "none"
        op: set
    gate:
      criterion: [classification]
      verdict: pass-in-window
      evidence: "암석 지구형엔 고리 기본 부재. 디스크 조작 방지 원칙([[project_nearstars_ring_fabrication]])에 따라 feature 없으면 없음으로."

  - body: Proxima Cen b
    axis: satellites                  # G10 — 없음 (근접 조석환경 물리적 예외)
    status: gated
    driver: [engine, window-selection]
    narrative: "None."
    narrative_ko: "없음."
    gate:
      criterion: [stability, classification]
      verdict: pass-in-window
      evidence: >
        채택값은 위성 없음이다. 확인: Hill 반경은 a·(m_p/3M★)^⅓ = 0.0485 AU × 0.0215 ≈ 156,000 km이고 순행
        안정역은 그 0.3~0.5배인 50,000~78,000 km로 좁으며, 조석고정된 근접 행성이라 항성 조석이 Gyr 규모로 그
        궤도를 흩는다. 다양성 우선 원칙의 물리적 예외에 해당한다. 증거의 부재가 아니라 물리적 부재다.

  - body: Proxima Cen b
    axis: gameplay                    # G11 — 착륙 가능 암석 호수 세계 (A b 거대 가스행성과 대비)
    provenance: >               # 뷰어 미렌더 — 값 이력 전용
      2026-08-03: difficulty 필드 폐기 — SPEC §0가 difficulty facet을 보류함(오너 2026-07-24,
      임무 난이도 등급은 모드-지원 관심사). 구값 "임무=항성간 플래그십".
    status: gated
    driver: [engine]
    narrative: >
      고체 표면이 있어 착륙 가능한 암석 호수 세계(A b 거대 가스행성과 대비). biome = 항성경도 동심원(조석고정이라
      위도 아닌 직하→명암경계선→반대점 순; 직하 최온, 바깥일수록 한랭) 7구획(오너 검토 2026-06-23):
      ① 직하점(Substellar Point, 핫스팟 시그니처 명소, A b 폭풍눈 대응) · ② 직하 호수(Substellar Lakes,
      splashdown) · ③ 주간 저지(Day Lowlands, 마픽) · ④ 주간 고지(Day Highlands, 장석질) · ⑤ 명암경계선(Terminator,
      황혼대) · ⑥ 야간면(Night Side, 동결 암석) · ⑦ 야간 빙관(Night Ice Cap, 반대점 물얼음). 오로라대는 biome서 제외인데,
      고정 표면 구역이 아니라 G6 외형 요소로만 쓴다(오너 결정). breathability=불가(무산소, atmosphereContainsOxygen=false).
      radiation 해저드=high(G8, 약한 장+플레어; Kerbalism radiation_surface high tier, 플레어 시 spike). ScienceValues
      전체(landed/splashed/flying/in-space) 정의. SOI=질량서 자동. 대기 0.3 bar 비행 가능. 임무 난도의 핵심은 접근이다. Proxima는 태양 최근접(4.24 ly)이지만 여정 자체가 난도다.
    fields:
      - name: science_biomes
        value: "항성경도 동심원 7구획: 직하점/직하 호수(splashdown)/주간 저지/주간 고지/명암경계선/야간면/야간 빙관 (오로라대 제외)"
        op: set
      - name: sphere_of_influence_tuning
        value: "auto from mass"
        op: passthrough
    gate:
